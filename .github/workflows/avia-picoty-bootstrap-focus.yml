name: AVIA Picoty guest bootstrap focus

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_bootstrap_focus.py"
      - ".github/workflows/avia-picoty-bootstrap-focus.yml"
      - "data/reports/avia_picoty_runtime_config.json"
      - "data/reports/avia_picoty_hermes_api_strings.json"
      - "data/reports/avia_picoty_app_api_discovery.json"
      - "data/reports/avia_picoty_guest_route_focus.json"

permissions:
  contents: write

concurrency:
  group: avia-picoty-bootstrap-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract guest bootstrap context
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_bootstrap_focus.py
          python scripts/avia_picoty_bootstrap_focus.py
      - name: Validate redacted report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_bootstrap_focus.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          raw=p.read_text(encoding='utf-8')
          assert d['schemaVersion']=='1.0.0'
          assert any(d['hits'].values()), 'no focused hits'
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}', raw)
          print({k:len(v) for k,v in d['hits'].items() if v})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-bootstrap-focus
          path: data/reports/avia_picoty_bootstrap_focus.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_bootstrap_focus.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract AVIA Picoty guest bootstrap context"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
