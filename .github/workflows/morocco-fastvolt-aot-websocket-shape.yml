name: Morocco FastVolt AOT websocket shape

on:
  push:
    paths:
      - '.github/workflows/morocco-fastvolt-aot-websocket-shape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download DAE and current FastVolt XAPK temporarily
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2             https://github.com/ejfkdev/dae/releases/download/v0.1.3/dae-Linux-x64             -o /tmp/dae
          chmod +x /tmp/dae
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0'             'https://d.apkpure.net/b/XAPK/ma.fastgo?version=latest'             -o /tmp/fastvolt.xapk
          mkdir -p /tmp/fv-xapk /tmp/fv-apk
          unzip -q /tmp/fastvolt.xapk -d /tmp/fv-xapk
          ARM_APK="$(find /tmp/fv-xapk -type f -name '*.apk' | while read -r f; do
            if unzip -l "$f" 2>/dev/null | grep -q 'lib/arm64-v8a/libapp.so'; then echo "$f"; break; fi
          done)"
          test -n "$ARM_APK"
          unzip -q "$ARM_APK" 'lib/arm64-v8a/libapp.so' -d /tmp/fv-apk
          test -s /tmp/fv-apk/lib/arm64-v8a/libapp.so

      - name: Inspect Dart AOT snapshot and publish only sanitized structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone

          DAE='/tmp/dae'
          BIN='/tmp/fv-apk/lib/arm64-v8a/libapp.so'
          OUT='reports/morocco/fastvolt/latest-native-aot-websocket-shape.json'
          os.makedirs(os.path.dirname(OUT),exist_ok=True)

          def run(args,timeout=90):
              try:
                  p=subprocess.run([DAE]+args,capture_output=True,text=True,errors='ignore',timeout=timeout)
                  return {'rc':p.returncode,'stdout':p.stdout[:5_000_000],'stderr':p.stderr[:200_000]}
              except Exception as e:
                  return {'rc':None,'stdout':'','stderr':type(e).__name__}

          def safe_diag(s):
              lines=[]
              for line in (s or '').splitlines()[:12]:
                  line=re.sub(r'https?://\S+','<url>',line)
                  line=re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_+\-/=]{40,}(?![A-Za-z0-9])','<redacted-long-token>',line)
                  if len(line)>240: line=line[:240]+'…'
                  lines.append(line)
              return lines

          results={}
          results['info']=run(['info',BIN])
          results['classes_websocket']=run(['classes',BIN,'WebSocket','--fuzzy'])
          results['functions_websocket']=run(['functions',BIN,'WebSocket'])
          results['classes_auth']=run(['classes',BIN,'Auth','--fuzzy'])
          results['libs_evplug']=run(['libs',BIN,'evplug'])
          results['strings_userid']=run(['strings',BIN,'-f','User ID is empty'])
          results['strings_wss']=run(['strings',BIN,'-f','wss://mobile.ev.fastvolt.ma/'])

          # Try focused decompilation only when the snapshot/query layer is operational.
          class_text=''
          class_attempt=None
          if results['info']['rc']==0:
              for candidate in ('WebSocketProvider','WebsocketProvider'):
                  r=run(['getclass',BIN,candidate,'--fuzzy'])
                  class_attempt={'candidate':candidate,'rc':r['rc'],'stderr':safe_diag(r['stderr'])}
                  if r['stdout'].strip():
                      class_text=r['stdout']
                      break

          index_text='\n'.join(r['stdout'] for r in results.values())
          alltxt=index_text+'\n'+class_text

          urls=sorted(set(re.findall(r'https?://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[A-Za-z0-9_./{}:=?-]*)?',alltxt)))
          wss=sorted(set(re.findall(r'wss://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[A-Za-z0-9_./{}:=?-]*)?',alltxt)))
          paths=sorted(set(re.findall(r'(?<![A-Za-z0-9])/(?:app|user|auth)/[A-Za-z0-9_./{}:=?-]+',alltxt)))
          safe_urls=[u for u in urls if any(h in u.lower() for h in ('fastvolt.ma','fastvolt.net'))][:50]
          safe_wss=[u for u in wss if 'fastvolt' in u.lower()][:20]

          terms=[
              'WebSocketChannel.connect','IOWebSocketChannel.connect','WebSocket.connect',
              'queryParameters','queryParametersAll','Uri.parse','Uri.https','Uri.replace',
              'sink.add','channel.sink.add','jsonEncode','json.encode','userId','user_id',
              'userid','ff_userid','Authorization','Bearer','headers'
          ]
          indicators={t:(t.lower() in alltxt.lower()) for t in terms}

          qstrings=re.findall(r'["\']([A-Za-z_][A-Za-z0-9_.-]{1,50})["\']',class_text)
          keys=sorted(set(s for s in qstrings if re.search(r'(user.?id|uid|socket|event|message|channel|connect|status|station|connector)',s,re.I)))[:80]

          def query_shape(name,r):
              return {
                  'return_code':r['rc'],
                  'stdout_bytes':len(r['stdout'].encode('utf-8')),
                  'stderr':safe_diag(r['stderr'])
              }

          report={
              'schema_version':2,
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'country':'MA','network':'FastVolt',
              'target':{'package':'ma.fastgo','client_version_context':'current public XAPK; expected 2.8.9'},
              'tool':{'name':'dae','version':'v0.1.3','target':'lib/arm64-v8a/libapp.so'},
              'policy':{
                  'static_analysis_only':True,'raw_apk_persisted':False,'raw_libapp_persisted':False,
                  'raw_decompiled_code_persisted':False,'credentials_persisted':False,
                  'api_keys_persisted':False,'tokens_persisted':False
              },
              'dae_queries':{k:query_shape(k,v) for k,v in results.items()},
              'focused_class_attempt':class_attempt,
              'focused_class_recovered':bool(class_text.strip()),
              'safe_literals':{
                  'fastvolt_http_urls':safe_urls,
                  'fastvolt_websocket_urls':safe_wss,
                  'api_paths':[p for p in paths if len(p)<=180][:80],
                  'key_name_candidates':keys
              },
              'structural_indicators':indicators,
              'interpretation':{
                  'snapshot_query_operational':results['info']['rc']==0,
                  'websocket_class_search_has_output':bool(results['classes_websocket']['stdout'].strip()),
                  'websocket_function_search_has_output':bool(results['functions_websocket']['stdout'].strip()),
                  'focused_websocket_class_recovered':bool(class_text.strip()),
                  'uri_query_construction_evidence': indicators['queryParameters'] or indicators['queryParametersAll'] or indicators['Uri.replace'],
                  'application_message_send_evidence': indicators['sink.add'] or indicators['channel.sink.add'],
                  'user_id_symbol_evidence': indicators['userId'] or indicators['user_id'] or indicators['userid'] or indicators['ff_userid'],
                  'authorization_symbol_evidence': indicators['Authorization'] or indicators['Bearer']
              }
          }
          with open(OUT,'w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(report['interpretation'],indent=2))
          PY

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/morocco/fastvolt/latest-native-aot-websocket-shape.json
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m "diag(morocco): refine FastVolt AOT websocket shape [run $GITHUB_RUN_ID]"
            git push
          fi

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/dae /tmp/fastvolt.xapk /tmp/fv-xapk /tmp/fv-apk
