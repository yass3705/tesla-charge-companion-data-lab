name: UK Applegreen map query shape

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-applegreen-map-query-shape.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract map query construction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          url="https://driver.applegreenelectric.com/resources/js/lib/evmap/jquery.evmap.js?v=80f5b190"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/javascript,*/*"})
          with urllib.request.urlopen(req,timeout=60) as r:
              body=r.read(8_000_000).decode("utf-8","replace")
          hits=[]
          for pat in [r'var\s+queryInfo\s*=\s*\{',r'queryInfo\s*=\s*\{',r'fetchBounds\s*=\s*function',r'fetchAndRenderBounds']:
              for m in re.finditer(pat,body,re.I):
                  hits.append({"pattern":pat,"context":body[max(0,m.start()-3500):min(len(body),m.end()+5000)]})
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"url":url,"hits":hits}
          Path("reports/uk/applegreen-map-query-shape-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/applegreen-map-query-shape-latest.json
          git commit -m "diag(uk): extract Applegreen map query shape [run ${GITHUB_RUN_ID}]" || exit 0
          for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
