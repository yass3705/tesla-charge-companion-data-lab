name: Check Dartford Tesla Mac and SuC actual tariffs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tesla_dartford_source_check_20261010.py'
      - '.github/workflows/dartford-tesla-source-check.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compare actual Dartford rules in Mac and SuC inputs
        run: python scripts/tesla_dartford_source_check_20261010.py
      - name: Preserve audit result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tesla/dartford-source-check-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reports(tesla): Dartford source price audit"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
