name: Electra NL national eMSP source staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  national-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact allowed-connector guards
        run: python3 -m unittest tests/test_electra_nl_national_stage.py tests/test_emsp_allowed_connectors.py
      - name: Collect remaining pages in bounded checkpoints
        run: |
          python3 - <<'PY'
          import gzip,json,math,subprocess
          first='data/platforms/electra/netherlands/emsp-source-staging/pages-0000-0059.json.gz'
          with gzip.open(first,'rt') as f: total=json.load(f)['sourceTotalCount']
          last=math.ceil(total/100)
          print(f'Electra global pages: {last}; starting after committed 60-page checkpoint',flush=True)
          for page in range(60,last,60):
              count=min(60,last-page)
              subprocess.run(['python3','scripts/electra_nl_emsp_national_stage.py',
                              '--start-page',str(page),'--pages',str(count),'--workers','3'],check=True)
          PY
          python3 scripts/audit_electra_nl_emsp_national_stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electra-nl-national-emsp-source-staging
          path: |
            data/platforms/electra/netherlands/emsp-source-staging/*.json.gz
            reports/emsp-national/electra-nl-stage-audit.json
          if-no-files-found: warn
          retention-days: 7
