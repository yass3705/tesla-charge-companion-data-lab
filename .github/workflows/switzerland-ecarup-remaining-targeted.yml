name: Switzerland eCarUp remaining CPO queries
on:
  push:
    paths:
      - 'scripts/query_ecarup_for_remaining_swiss_cpos.py'
      - '.github/workflows/switzerland-ecarup-remaining-targeted.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/query_ecarup_for_remaining_swiss_cpos.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-ecarup-remaining-targeted-queries-2026-09-28.json
          git commit -m 'docs(switzerland): query eCarUp for SOC MMN SCH AVIA' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
