name: Allego Italy exact DXP probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/allego_italy_exact.py"
      - ".github/workflows/allego-italy-exact.yml"

permissions:
  contents: write

concurrency:
  group: allego-italy-exact
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check -q selenium
      - name: Probe exact Italy EVSE tariffs
        run: |
          set -euo pipefail
          python -m py_compile scripts/allego_dxp_national.py scripts/allego_italy_exact.py
          python scripts/allego_italy_exact.py
      - name: Public safety scan
        run: |
          python scripts/public_safety_check.py scripts/allego_italy_exact.py data/reports/allego_italy_exact_20260925.json
      - name: Commit deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/allego_direct_stations_italy_20260925.json.gz data/reports/allego_italy_exact_20260925.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(allego): refresh Italy exact DXP tariffs"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
