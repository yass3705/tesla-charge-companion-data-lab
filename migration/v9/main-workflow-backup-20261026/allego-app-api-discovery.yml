name: Allego app API discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/allego-app-api-discovery.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture public SPA API configuration and test direct pricing calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python -m pip install --disable-pip-version-check -q selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import hashlib, json, time, urllib.request, urllib.error
          from pathlib import Path

          PAGE='https://app.allego.eu/price/FRALLEGO8001301'
          API_MARKER='p-dxp-api-'
          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--window-size=1440,1600')
          opt.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opt)
          key=None
          captured=[]
          try:
              d.get(PAGE)
              time.sleep(8)
              body=d.find_element('tag name','body').text
              Path('probe/rendered_body.txt').write_text(body)
              print('=== RENDERED PRICE PAGE ===')
              print(body[:4500])

              for item in d.get_log('performance'):
                  try: msg=json.loads(item['message'])['message']
                  except Exception: continue
                  if msg.get('method') != 'Network.requestWillBeSent':
                      continue
                  req=msg['params']['request']
                  url=req.get('url','')
                  if API_MARKER not in url:
                      continue
                  headers=req.get('headers') or {}
                  names=sorted(headers)
                  row={'url':url,'method':req.get('method'),'headerNames':names}
                  captured.append(row)
                  for hn,hv in headers.items():
                      if hn.lower() == 'ocp-apim-subscription-key':
                          key=str(hv)
                  print('DXP request:', json.dumps(row,ensure_ascii=False))

              if not key:
                  raise RuntimeError('Ocp-Apim-Subscription-Key not observed in browser request headers')

              fingerprint=hashlib.sha256(key.encode()).hexdigest()
              print(f'Public SPA APIM key observed: length={len(key)} sha256={fingerprint}')
              # Deliberately never print or persist the key itself in this public repository.

              base='https://p-dxp-api-acg8edbwd7g2eheg.a01.azurefd.net/api/dxp/poi/chargepoints/'
              ids=[
                  'FRALLEGO800130','FRALLEGO8001301',
                  'FRALLEGO800990','FRALLEGO8009901',
                  'FRALLEGO900108','FRALLEGO9001081',
                  'FRALLEGO999088','FRALLEGO9990881',
                  'FRALLEGO800261','FRALLEGO8002611',
              ]
              results=[]
              for cid in ids:
                  url=base+cid
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0',
                      'Accept':'application/json, text/plain, */*',
                      'Origin':'https://app.allego.eu',
                      'Referer':'https://app.allego.eu/',
                      'Ocp-Apim-Subscription-Key':key,
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          raw=r.read().decode('utf-8','replace')
                          status=r.status
                          ctype=r.headers.get('content-type','')
                  except urllib.error.HTTPError as e:
                      raw=e.read().decode('utf-8','replace')
                      status=e.code
                      ctype=e.headers.get('content-type','') if e.headers else ''
                  row={'id':cid,'status':status,'contentType':ctype,'bytes':len(raw.encode()),'body':raw[:12000]}
                  try: row['json']=json.loads(raw)
                  except Exception: pass
                  results.append(row)
                  print('\n===',cid,'===')
                  print('status=',status,'type=',ctype,'bytes=',len(raw.encode()))
                  print(raw[:5000])

              Path('probe/direct_api_results.json').write_text(json.dumps({
                  'apiBase':base,
                  'keyFingerprintSha256':fingerprint,
                  'keyLength':len(key),
                  'capturedRequests':captured,
                  'results':results,
              },ensure_ascii=False,indent=2))
          finally:
              d.quit()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: allego-app-api-discovery
          path: probe
          retention-days: 3
