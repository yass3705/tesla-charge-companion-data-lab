name: Bump tariff readiness

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_tariff_readiness.py"
      - ".github/workflows/bump-tariff-readiness.yml"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify Bump tariffs
        run: python scripts/bump_tariff_readiness.py
      - name: Validate readiness report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/tariff_readiness_latest.json').read_text())
          c=p['pointCategoryCounts']
          assert c.get('static_rankable',0) > 1000
          assert c.get('variable_time_requires_rule_parse',0) > 0
          assert p['variablePatternCount'] > 0
          print({'points':c,'stations':p['stationCategoryCounts'],'variablePatterns':p['variablePatternCount'],'staticPatterns':p['staticPatternCount']})
          PY
      - name: Publish readiness report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/tariff_readiness_latest.json reports/bump/tariff_readiness_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report(bump): classify tariff readiness [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
