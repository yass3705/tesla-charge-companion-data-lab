name: Shell DE-ES provider matrix probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/shell-de-es-provider-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-api-global
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe alternate provider IDs on DE ubitricity and ES residual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/cross-country
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Provider-Matrix"
          last=0.0; token=None; refreshes=0

          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token,refreshes
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr:
                  token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1
          auth()

          def call(uid,provider):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")
                  if provider is not None:
                      url+="?"+urllib.parse.urlencode({"providerId":provider})
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+token,"Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:2000]}
              return 0,{}

          de_uids=[
            "DE*UBI*1119","DE*UBI*1198","DE*UBI*1235","DE*UBI*1286","DE*UBI*1352",
            "DE*UBI*1385","DE*UBI*1393","DE*UBI*1431","DE*UBI*1630","DE*UBI*1649"
          ]
          es_uids=["GB*TNM*4829"]
          providers=["Shell_RP_2","Shell_RP_1","Shell_RP",None]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"results":[]}

          for country,uids in [("DE",de_uids),("ES",es_uids)]:
              for uid in uids:
                  row={"country":country,"uid":uid,"probes":[]}
                  for provider in providers:
                      st,body=call(uid,provider)
                      data=body.get("data") if isinstance(body,dict) else None
                      if isinstance(data,list) and data: data=data[0]
                      tariffs=[]; connectors=0
                      if isinstance(data,dict):
                          for ev in data.get("evses") or []:
                              for conn in ev.get("connectors") or []:
                                  connectors+=1
                                  for t in conn.get("tariffs") or []:
                                      tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
                      row["probes"].append({
                          "providerId":provider,"httpStatus":st,"connectorCount":connectors,
                          "tariffCount":len(tariffs),"tariffs":tariffs
                      })
                  out["results"].append(row)

          out["tokenRefreshCount"]=refreshes
          out["resolved"]=[
              {"country":r["country"],"uid":r["uid"],
               "providers":[p["providerId"] for p in r["probes"] if p["tariffCount"]>0]}
              for r in out["results"] if any(p["tariffCount"]>0 for p in r["probes"])
          ]
          Path("reports/cross-country/shell-de-es-provider-matrix-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps({
              "resolved":out["resolved"],
              "summary":[
                  {"country":r["country"],"uid":r["uid"],
                   "probes":[{"providerId":p["providerId"],"httpStatus":p["httpStatus"],"tariffCount":p["tariffCount"]} for p in r["probes"]]}
                  for r in out["results"]
              ]
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/cross-country/shell-de-es-provider-matrix-latest.json /tmp/shell-de-es-provider-matrix-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/shell-de-es-provider-matrix-latest.json reports/cross-country/shell-de-es-provider-matrix-latest.json
            git add reports/cross-country/shell-de-es-provider-matrix-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: probe alternate Shell provider IDs for DE-ES residuals [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with another writer; retrying (${attempt}/5)"
            sleep $((attempt * 2))
          done
          echo "Failed to publish after 5 retries" >&2
          exit 1
