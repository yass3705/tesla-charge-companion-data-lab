name: Belgium Charge Europe aapt resource diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-charge-europe-aapt-resource-diagnostic.txt"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq aapt
      - run: python scripts/belgium_charge_europe_aapt_resource_diagnostic.py
      - name: Persist sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/charge-europe-aapt-resource-diagnostic-2026-09-28.json
          git commit -m "Diagnose Charge Europe Android resource values" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
