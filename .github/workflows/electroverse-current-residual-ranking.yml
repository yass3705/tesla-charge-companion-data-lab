name: Audit Electroverse FR current residual ranking
on:
  push:
    branches:
      - audit/electroverse-current-residual-ranking-2
    paths:
      - "scripts/audit_electroverse_current_residual_ranking.mjs"
      - ".github/workflows/electroverse-current-residual-ranking.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rank residual operators
        run: node scripts/audit_electroverse_current_residual_ranking.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-current-residual-ranking.json
          git commit -m "audit: publish current Electroverse residual ranking" || exit 0
          git push
