name: Morocco EVGO tariff routes

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco_evgo_tariff_route_probe.py'
      - '.github/workflows/morocco-evgo-tariff-routes.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run sanitized GET-only tariff route probe
        run: python3 scripts/morocco_evgo_tariff_route_probe.py
      - name: Publish sanitized report
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p reports/morocco/evgo
          cp artifacts/morocco-evgo-tariff-routes/summary.json reports/morocco/evgo/latest-tariff-routes.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/evgo/latest-tariff-routes.json
          if git diff --cached --quiet; then
            echo 'No report changes'
            exit 0
          fi
          git commit -m "data(morocco): update EVGO tariff routes [run ${RUN_ID}]"
          git push
