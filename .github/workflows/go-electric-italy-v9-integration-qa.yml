name: Go Electric Italy V9 integration QA

on:
  workflow_dispatch:
  push:
    branches:
      - research/go-electric-italy-v9
    paths:
      - scripts/go_electric_italy_v9_integrate.py
      - .github/workflows/go-electric-italy-v9-integration-qa.yml

permissions:
  contents: read
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check selenium requests pypdf

      - name: Download latest successful normalized PUN artifact
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pun-italy-normalized.yml --branch research/pun-italy-normalized --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/pun data/national
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n pun-italy-normalized -D /tmp/pun
          cp /tmp/pun/national/pun_italy_national.json.gz data/national/pun_italy_national.json.gz
          test -s data/national/pun_italy_national.json.gz
          echo "Using PUN run $RUN_ID"

      - name: Download validated A2A national candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow a2a-italy-national-build.yml --branch research/a2a-italy-national --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/a2a data/reports
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n a2a-direct-italy-candidate -D /tmp/a2a
          cp /tmp/a2a/national/a2a_direct_stations_italy.json.gz data/national/a2a_direct_stations_italy.json.gz
          cp /tmp/a2a/reports/a2a_italy_national_report.json data/reports/a2a_italy_national_report.json
          test -s data/national/a2a_direct_stations_italy.json.gz
          echo "Using A2A run $RUN_ID"

      - name: Revalidate A2A against current PUN
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open('data/national/pun_italy_national.json.gz','rt',encoding='utf-8') as fh:pun=json.load(fh)
          with gzip.open('data/national/a2a_direct_stations_italy.json.gz','rt',encoding='utf-8') as fh:a2a=json.load(fh)
          pun_ids={str(e.get('evseId')) for e in pun.get('evses',[]) if str(e.get('partyId') or '').upper()=='A2M' and e.get('evseId')}
          direct={str(e.get('evseId')) for e in a2a.get('evses',[]) if e.get('rankableDirectTariff') is True and e.get('evseId')}
          coverage=len(pun_ids & direct)/len(pun_ids) if pun_ids else 0
          print(json.dumps({'punA2mEvse':len(pun_ids),'rankableA2aEvse':len(direct),'coverage':coverage},indent=2))
          assert direct <= pun_ids
          assert coverage >= .95
          PY

      - name: Download validated legacy GES NextCharge candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ges-nextcharge-national-candidate.yml --branch research/ges-italy-probe --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/ges
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n nextcharge-ges-italy-national-candidate -D /tmp/ges
          cp /tmp/ges/national/nextcharge_ges_italy_candidate.json.gz data/national/nextcharge_ges_italy_candidate.json.gz
          cp /tmp/ges/reports/ges_nextcharge_italy_national_report.json data/reports/ges_nextcharge_italy_national_report.json
          test -s data/national/nextcharge_ges_italy_candidate.json.gz
          echo "Using legacy GES candidate run $RUN_ID"

      - name: Build Plenitude candidate
        run: python scripts/plenitude_italy_apply.py

      - name: Build Duferco candidate
        run: python scripts/duferco_italy_pun_direct.py --pun data/national/pun_italy_national.json.gz

      - name: Validate current official Atlante Italy offers
        run: python scripts/atlante_italy_official.py

      - name: Build Atlante Go own-network overlay
        run: python scripts/atlante_italy_pun_overlay.py --pun data/national/pun_italy_national.json.gz

      - name: Build Atlante Go ChargeLeague overlay
        run: python scripts/atlante_go_chargeleague_italy_overlay.py --pun data/national/pun_italy_national.json.gz

      - name: Build baseline Italy V9 candidate
        run: python scripts/italy_consolidate_v9.py

      - name: Download validated Go Electric semantic artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/go_electric_semantic
          gh run download 33450130979 --repo "$GITHUB_REPOSITORY" -n go-electric-italy-v9-semantic-qa -D artifacts/go_electric_semantic
          test -s artifacts/go_electric_semantic/go_electric_italy_v9_ready_offers.json
          test -s artifacts/go_electric_semantic/go_electric_italy_v9_semantic_qa.json
          test -s artifacts/go_electric_semantic/go_electric_italy_v9_semantic_quarantine.json

      - name: Integrate exact Go Electric direct tariffs
        run: python scripts/go_electric_italy_v9_integrate.py

      - name: Validate Go Electric integration gates
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path

          report=json.loads(Path('data/reports/go_electric_italy_v9_integration_qa.json').read_text(encoding='utf-8'))
          assert report['publicationAllowed'] is False
          assert all(report['gates'].values())
          assert report['input']['goElectricPhysicalStations'] == 1136
          assert report['input']['goElectricPhysicalEvse'] == 2413
          assert report['input']['semanticReadyOffers'] == 2214
          assert report['integration']['matchedCandidateEvse'] == 2214
          assert report['integration']['missingCandidateEvse'] == 0
          assert report['integration']['newDirectEvse'] == 2214
          assert report['integration']['sameSourceDirectOverlaps'] == 0
          assert report['integration']['conflictingExistingDirectOverlaps'] == 0
          assert report['integration']['stationCoverage']['upstreamStationQuarantine'] == 79
          assert report['integration']['stationCoverage']['connectorSemanticExclusion'] == 48
          assert report['after']['rankableDirectEvse'] == report['before']['rankableDirectEvse'] + 2214
          assert report['after']['rankableDirectCoveragePct'] > report['before']['rankableDirectCoveragePct']
          assert report['after']['rankableDirectByOperator']['Go Electric Stations SRLS'] == 2214
          assert report['integration']['legacyNextChargeEmspEntriesRetired'] > 100

          out=Path('data/consolidation/italy_v9_candidate_go_electric_direct_qa.json.gz')
          assert out.exists() and out.stat().st_size > 100000
          with gzip.open(out,'rt',encoding='utf-8') as fh:
              data=json.load(fh)
          assert data['publicationAllowed'] is False
          assert data['goElectricIntegration']['acceptedExactEvseOffers'] == 2214
          go_electric=[]
          residual_legacy=0
          for evse in data['evses']:
              tariff=evse.get('tccV9DirectTariff') or {}
              if tariff.get('operator') == 'Go Electric Stations SRLS':
                  go_electric.append(tariff)
                  assert tariff.get('rankable') is True
                  assert tariff.get('publicationAllowed') is False
                  assert tariff.get('currency') == 'EUR'
                  assert tariff.get('pricingType') == 'components'
                  assert any(c.get('type') == 'energy' for c in tariff.get('priceComponents',[]))
                  assert 'preAuth' not in json.dumps(tariff)
              for emsp in evse.get('tccV9EmspTariffs') or []:
                  if str(emsp.get('provider') or '').lower() == 'nextcharge' and 'go electric stations' in str(emsp.get('billedBy') or '').lower():
                      residual_legacy += 1
          assert len(go_electric) == 2214
          assert residual_legacy == 0
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload integration QA candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-electric-italy-v9-integration-qa
          path: |
            data/consolidation/italy_v9_candidate_go_electric_direct_qa.json.gz
            data/reports/go_electric_italy_v9_integration_qa.json
            data/reports/italy_v9_consolidation_report.json
          retention-days: 14
