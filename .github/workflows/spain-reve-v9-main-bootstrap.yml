# REVE transport diagnostic. The stateful production refresh is
# .github/workflows/spain-reve-v9-stream-refresh.yml.
name: Spain REVE V9 one-shot bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/spain-reve-v9-main-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY || secrets.REVE_API_KEY }}
      BASE_URL: https://www.mapareve.es/api/external/v1

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REVE_API_KEY:-}" || { echo "REVE API key is missing" >&2; exit 2; }
          echo "REVE key present; length=${#REVE_API_KEY}"

      - name: Probe five documented REVE resources with validated curl transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spain/reve
          python - <<'PY'
          import json, os, pathlib, subprocess, tempfile, datetime
          base=os.environ['BASE_URL'].rstrip('/')
          key=os.environ['REVE_API_KEY'].strip()
          out=pathlib.Path('artifacts/spain/reve')
          endpoints=[
            ('api_docs','/docs/api-docs.json'),
            ('cpos','/cpos'),
            ('locations','/locations?page=1&limit=1'),
            ('operational_status','/evses/operational_status?page=1&limit=1'),
            ('connector_tariffs','/connectors/tariffs?page=1&limit=1'),
          ]
          report={
            'source':'Mapa REVE / Red Electrica de Espana',
            'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'transport':'curl',
            'key_length_after_strip':len(key),
            'endpoints':{}
          }
          failures=0
          for name,path in endpoints:
            with tempfile.TemporaryDirectory(prefix='reve-bootstrap-') as td:
              body=pathlib.Path(td)/'body'
              proc=subprocess.run([
                'curl','-sS','--max-time','120','-o',str(body),'-w','%{http_code}',
                '-H',f'x-api-key: {key}','-H','Accept: application/json',base+path
              ],capture_output=True,text=True,check=False)
              status=int(proc.stdout[-3:]) if len(proc.stdout)>=3 and proc.stdout[-3:].isdigit() else 0
              raw=body.read_bytes() if body.exists() else b''
            meta={'path':path,'http_status':status,'bytes':len(raw),'curl_exit':proc.returncode}
            if status==200:
              try:
                data=json.loads(raw)
                meta['json_type']=type(data).__name__
                if isinstance(data,list): meta['count']=len(data)
                elif isinstance(data,dict): meta['top_level_keys']=sorted(data.keys())
                (out/f'{name}.json').write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')
              except Exception as e:
                failures+=1
                meta['json_error']=str(e)[:300]
            else:
              failures+=1
              meta['error_preview']=raw[:500].decode('utf-8','replace')
              (out/f'{name}.error.txt').write_bytes(raw)
            report['endpoints'][name]=meta
          (out/'bootstrap_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if failures:
            raise SystemExit(1)
          PY

      - name: Upload REVE bootstrap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spain-reve-v9-bootstrap-main
          path: artifacts/spain/reve/
          retention-days: 7
