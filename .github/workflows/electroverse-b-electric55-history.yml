name: Audit Electric55 history for final B
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_electric55_history.mjs"
      - ".github/workflows/electroverse-b-electric55-history.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit_b_electric55_history.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-electric55-history-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist Electric55 history for final B"
            git pull --rebase origin main || true
            git push
          fi
