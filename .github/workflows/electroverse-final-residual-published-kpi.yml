name: Audit Electroverse final residual published KPI
on:
  push:
    branches:
      - audit/electroverse-final-residual-published-kpi
    paths:
      - "scripts/audit_electroverse_final_residual_published_kpi.mjs"
      - ".github/workflows/electroverse-final-residual-published-kpi.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit final residual publication
        run: node scripts/audit_electroverse_final_residual_published_kpi.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/final-residual-published-kpi-audit.json
          git commit -m "audit: publish final residual KPI audit" || exit 0
          git push
