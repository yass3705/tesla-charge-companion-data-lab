name: UK Zest APK static inspect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-zest-apk-static-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download and inspect Zest Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/zest
          curl -fL --retry 3 --retry-delay 3             -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/com.uk.zest.app?version=latest"             -o /tmp/zest/app.xapk
          unzip -q /tmp/zest/app.xapk -d /tmp/zest/x
          find /tmp/zest/x -type f -name "*.apk" -print
          mkdir -p /tmp/zest/apks
          for apk in /tmp/zest/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/zest/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"
            unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os
          from pathlib import Path
          from datetime import datetime,timezone

          roots=glob.glob("/tmp/zest/apks/*")
          url_re=re.compile(rb'https?://[A-Za-z0-9._~:/?#\[\]@!$&\'()*+,;=%-]{6,500}')
          host_re=re.compile(rb'(?i)(?:https?://)?([a-z0-9][a-z0-9.-]+\.(?:com|co\.uk|uk|io|app|net|cloud|tech|eu|org))(?:[:/][^\x00\s"\']*)?')
          urls=set(); hosts=set(); literals=set(); files=0
          keywords=(b"api",b"ocpi",b"location",b"tariff",b"chargepoint",b"charger",b"station",b"graphql",b"socket",b"firebase")
          for root in roots:
            for fn in glob.glob(root+"/**/*",recursive=True):
              if not os.path.isfile(fn): continue
              try:
                if os.path.getsize(fn)>40_000_000: continue
                b=open(fn,"rb").read()
              except Exception: continue
              files+=1
              for m in url_re.findall(b):
                try:
                  u=m.decode("utf-8","ignore")
                  if any(k.decode() in u.lower() for k in keywords): urls.add(u[:500])
                except Exception: pass
              for m in host_re.findall(b):
                try:
                  h=m.decode("utf-8","ignore").lower()
                  if any(k in h for k in ("zest","api","charge","ocpi","azure","amazonaws","firebase")): hosts.add(h)
                except Exception: pass
              # extract useful printable strings around domain/API terms
              for s in re.findall(rb'[ -~]{8,300}',b):
                sl=s.lower()
                if any(k in sl for k in keywords) and (b"http" in sl or b"/api" in sl or b"baseurl" in sl or b"graphql" in sl):
                  try: literals.add(s.decode("utf-8","ignore"))
                  except Exception: pass
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),
               "package":"com.uk.zest.app","filesScanned":files,
               "urls":sorted(urls)[:800],"hosts":sorted(hosts)[:400],"literals":sorted(literals)[:800]}
          Path("reports/uk/zest-apk-static-inspect-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"urls":out["urls"],"hosts":out["hosts"],"literals":out["literals"][:200]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/zest-apk-static-inspect-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Zest Android app statically [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
