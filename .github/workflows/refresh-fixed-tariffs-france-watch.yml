name: Refresh fixed tariffs France watch

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_fixed_tariffs_france_watch.py"
      - ".github/workflows/refresh-fixed-tariffs-france-watch.yml"
  workflow_dispatch:
  schedule:
    - cron: "5 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh_fixed_tariffs_france_watch.py
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/dream_energy_promotional_tariff_france_2026.json data/operator_direct/soregies_tariff_rules_france_2026.json data/operator_direct/mobive_official_france.json reports/fixed-tariff-refresh-france-watch-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data(fr): refresh/watch Dream Sorégies Mobive [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
