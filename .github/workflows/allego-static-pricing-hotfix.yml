name: Allego static pricing hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/allego-static-pricing-hotfix.yml"
      - "scripts/patch_allego_static_pricing.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Allego patch
        run: |
          set -euo pipefail
          python scripts/patch_allego_static_pricing.py
          python -m py_compile scripts/allego_official.py

      - name: Commit Allego static pricing fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/allego_official.py
          if git diff --cached --quiet; then
            echo "Allego script already patched"
            exit 0
          fi
          git commit -m "fix(allego): map France from static official pricing HTML"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
