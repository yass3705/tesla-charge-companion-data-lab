name: Netherlands direct CPO tariff source provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_cpo_direct_price_provenance_20261011.py
      - .github/workflows/nl-direct-price-provenance.yml
permissions:
  contents: write
concurrency:
  group: nl-direct-price-provenance
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify exact selected national OCPI tariffs as ad-hoc, generic, or overlay
        run: |
          python3 -m py_compile scripts/nl_cpo_direct_price_provenance_20261011.py
          python3 scripts/nl_cpo_direct_price_provenance_20261011.py
      - name: Persist provenance report
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-direct-price-provenance-2026-10-11.json /tmp/nl-price-provenance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-price-provenance.json reports/netherlands/nl-direct-price-provenance-2026-10-11.json
            git add reports/netherlands/nl-direct-price-provenance-2026-10-11.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): evidence of tariff provenance before QR guest confirmation [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then echo NL_PROVENANCE_PUBLISHED; exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-direct-provenance-${{ github.run_id }}
          path: reports/netherlands/nl-direct-price-provenance-2026-10-11.json
          retention-days: 90
