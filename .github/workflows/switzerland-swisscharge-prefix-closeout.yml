name: Switzerland Swisscharge prefix closeout
on:
  push:
    paths:
      - 'scripts/finalize_swisscharge_prefix.py'
      - '.github/workflows/switzerland-swisscharge-prefix-closeout.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/finalize_swisscharge_prefix.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-swisscharge-prefix-closeout-2026-09-28.json
          git commit -m 'docs(switzerland): close Swisscharge prefix scope' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
