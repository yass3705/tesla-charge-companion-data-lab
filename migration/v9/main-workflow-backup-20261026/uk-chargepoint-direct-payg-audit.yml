name: UK ChargePoint guest direct-payment and pricing audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/uk_chargepoint_direct_payg_audit_20261011.py
      - reports/uk/chargepoint-direct-payg-evidence-2026-10-11.json
      - .github/workflows/uk-chargepoint-direct-payg-audit.yml
permissions:
  contents: write
concurrency:
  group: uk-chargepoint-direct-payg-audit
  cancel-in-progress: false
jobs:
  exact-direct-payg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify guest-payment evidence and each exact PCPR connector for 25 sites
        run: python3 scripts/uk_chargepoint_direct_payg_audit_20261011.py
      - name: Publish evidence matrix with concurrent-update retry
        shell: bash
        run: |
          set -euo pipefail
          cp reports/uk/chargepoint-direct-payg-audit-2026-10-11.json /tmp/cp-payg.json
          cp reports/uk/chargepoint-direct-payg-exact-connectors-2026-10-11.csv /tmp/cp-payg.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cp-payg.json reports/uk/chargepoint-direct-payg-audit-2026-10-11.json
            cp /tmp/cp-payg.csv reports/uk/chargepoint-direct-payg-exact-connectors-2026-10-11.csv
            git add reports/uk/chargepoint-direct-payg-audit-2026-10-11.json reports/uk/chargepoint-direct-payg-exact-connectors-2026-10-11.csv
            if git diff --cached --quiet; then
              echo CHARGEPOINT_DIRECT_PAYG_REPORT_CURRENT
              exit 0
            fi
            git commit -m "reports(uk): ChargePoint 25-site verified payment and 84-connector price audit [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo CHARGEPOINT_DIRECT_PAYG_REPORT_PUBLISHED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Retry exhausted" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chargepoint-uk-25-guest-payg-${{ github.run_id }}
          path: |
            reports/uk/chargepoint-direct-payg-audit-2026-10-11.json
            reports/uk/chargepoint-direct-payg-exact-connectors-2026-10-11.csv
          retention-days: 90
