name: Load Motion France refresh
# auth-probe-trigger: 2026-10-05-eula

on:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/loadmotion-france-refresh.yml"
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant to refresh
        required: true
        type: choice
        default: all
        options: [all, yes55, loadstations, reveo, mobisdec]
      publish:
        description: Commit refreshed snapshots and V9 offers
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: loadmotion-france-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh YES55
        id: yes55
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.tenant == 'all' || inputs.tenant == 'yes55' }}
        env:
          LOADMOTION_ID: ${{ secrets.LOADMOTION_ID }}
          LOADMOTION_PASS: ${{ secrets.YES55_PASS }}
          LOADMOTION_TOKEN: ${{ secrets.LOADMOTION_YES55_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOADMOTION_TOKEN:-}" ] && { [ -z "${LOADMOTION_ID:-}" ] || [ -z "${LOADMOTION_PASS:-}" ]; }; then
            echo "::error::Missing YES55 credentials: LOADMOTION_ID + YES55_PASS"
            exit 1
          fi
          node scripts/loadmotion/extract_loadmotion_france.mjs --tenant yes55 --out data/loadmotion/france/current/yes55.json.gz

      - name: Refresh Load Stations
        id: loadstations
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.tenant == 'all' || inputs.tenant == 'loadstations' }}
        env:
          LOADMOTION_ID: ${{ secrets.LOADMOTION_ID }}
          LOADMOTION_PASS: ${{ secrets.LOADSTATIONS_PASS }}
          LOADMOTION_TOKEN: ${{ secrets.LOADMOTION_LOADSTATIONS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOADMOTION_TOKEN:-}" ] && { [ -z "${LOADMOTION_ID:-}" ] || [ -z "${LOADMOTION_PASS:-}" ]; }; then
            echo "::error::Missing Load Stations credentials: LOADMOTION_ID + LOADSTATIONS_PASS"
            exit 1
          fi
          node scripts/loadmotion/extract_loadmotion_france.mjs --tenant loadstations --out data/loadmotion/france/current/loadstations.json.gz

      - name: Refresh Reveo
        id: reveo
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.tenant == 'all' || inputs.tenant == 'reveo' }}
        env:
          LOADMOTION_ID: ${{ secrets.LOADMOTION_ID }}
          LOADMOTION_PASS: ${{ secrets.REVEO_PASS }}
          LOADMOTION_TOKEN: ${{ secrets.LOADMOTION_REVEO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOADMOTION_TOKEN:-}" ] && { [ -z "${LOADMOTION_ID:-}" ] || [ -z "${LOADMOTION_PASS:-}" ]; }; then
            echo "::error::Missing REVEO credentials: LOADMOTION_ID + REVEO_PASS"
            exit 1
          fi
          node scripts/loadmotion/extract_loadmotion_france.mjs --tenant reveo --concurrency 2 --out data/loadmotion/france/current/reveo.json.gz

      - name: Refresh MobiSDEC
        id: mobisdec
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.tenant == 'all' || inputs.tenant == 'mobisdec' }}
        env:
          LOADMOTION_ID: ${{ secrets.LOADMOTION_ID }}
          LOADMOTION_PASS: ${{ secrets.MOBISDEC_PASS }}
          LOADMOTION_TOKEN: ${{ secrets.LOADMOTION_MOBISDEC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOADMOTION_TOKEN:-}" ] && { [ -z "${LOADMOTION_ID:-}" ] || [ -z "${LOADMOTION_PASS:-}" ]; }; then
            echo "::error::Missing MobiSDEC credentials: LOADMOTION_ID + MOBISDEC_PASS"
            exit 1
          fi
          node scripts/loadmotion/extract_loadmotion_france.mjs --tenant mobisdec --out data/loadmotion/france/current/mobisdec.json.gz

      - name: Check tenant refresh results
        if: ${{ always() }}
        shell: bash
        run: |
          failed=0
          for pair in             "YES55:${{ steps.yes55.outcome }}"             "LoadStations:${{ steps.loadstations.outcome }}"             "REVEO:${{ steps.reveo.outcome }}"             "MobiSDEC:${{ steps.mobisdec.outcome }}"; do
            echo "$pair"
            case "$pair" in *:failure) failed=1;; esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Load Motion tenants failed. See individual step logs."
            exit 1
          fi

      - name: Compile V9 Load Motion offers
        if: ${{ success() }}
        run: |
          node scripts/loadmotion/compile_loadmotion_v9_offers.mjs \
            --current data/loadmotion/france/current \
            --out v9-production-runtime/data/v9/france-loadmotion-offers.json

      - name: Validate compiled offers
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='v9-production-runtime/data/v9/france-loadmotion-offers.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.country!=='FR'||d.mode!=='verified_loadmotion_direct') throw new Error('unexpected Load Motion payload');
          if(!Array.isArray(d.directOffers)||d.directOffers.length<70) throw new Error(`Load Motion offers incomplete: ${d.directOffers?.length||0}`);
          if(d.directOffers.some(x=>JSON.stringify(x).includes('No Tariff'))) throw new Error('No Tariff leaked into rankable offers');
          const legacy=['chargePerMinute','afterMinutesRate','postChargeRate','connectionFee'];
          const raw=JSON.stringify(d.directOffers);
          for(const field of legacy){
            if(raw.includes(`"${field}"`)) throw new Error(`legacy unsupported pricing field leaked: ${field}`);
          }
          const byTenant={};
          for(const offer of d.directOffers){
            const tenant=offer?.metadata?.tenant||'unknown';
            byTenant[tenant]=(byTenant[tenant]||0)+1;
          }
          for(const tenant of ['yes55','loadstations','reveo','mobisdec']){
            if(!byTenant[tenant]) throw new Error(`missing rankable Load Motion tenant: ${tenant}`);
          }
          console.log(`validated ${d.directOffers.length} Load Motion direct offers`,byTenant);
          NODE

      - name: Commit refreshed snapshots and V9 offers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true }}
        shell: bash
        run: |
          if git diff --quiet -- data/loadmotion/france/current v9-production-runtime/data/v9/france-loadmotion-offers.json; then
            echo "No Load Motion data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loadmotion/france/current v9-production-runtime/data/v9/france-loadmotion-offers.json
          git commit -m "data(france): refresh Load Motion direct tariffs"

          # Main may advance while this long refresh is running. Rebase only when
          # the refresh logic itself has not changed; otherwise fail closed and
          # require a fresh run with the new logic.
          git fetch origin main
          changed_since_start="$(git diff --name-only "$GITHUB_SHA"..origin/main || true)"
          if printf '%s\n' "$changed_since_start" | grep -Eq '^(scripts/loadmotion/|\.github/workflows/loadmotion-france-refresh\.yml$|v9-production-runtime/data/v9/source-registry\.json$)'; then
            echo "Load Motion refresh logic changed on main while this run was executing; refusing to publish stale-generation output."
            printf '%s\n' "$changed_since_start"
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main