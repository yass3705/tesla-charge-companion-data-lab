name: Switzerland Partino EVC-Net page config probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-partino-evcnet-page-config-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract public Locations page DeviceMap config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          url="https://partino-chf.evc-net.com/Locations"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TCC-V9-Partino"})
          html=urllib.request.urlopen(req,timeout=60).read().decode("utf-8","replace")
          needles=["new DeviceMap","DeviceMap(","tariffProvider","provider:","profile:","MODE_ROAMING","MODE_CURRENT","VIEW_CLUSTERED","VIEW_UNCLUSTERED","mapOptions","rechargeSpotIds","noBounds"]
          snips=[]
          for n in needles:
            pos=0
            while True:
              i=html.find(n,pos)
              if i<0: break
              snips.append({"needle":n,"offset":i,"text":html[max(0,i-2500):min(len(html),i+5000)]})
              pos=i+len(n)
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,re.I|re.S)
          out={"schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),"url":url,"htmlBytes":len(html),"snippets":snips,"inlineScripts":scripts}
          Path("docs/switzerland-partino-evcnet-page-config-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"htmlBytes":len(html),"snippetCount":len(snips),"inlineScriptCount":len(scripts)},ensure_ascii=False))
          PY
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-partino-evcnet-page-config-2026-09-29.json
          git commit -m "research(ch): inspect Partino Locations map config" || exit 0
          git pull --rebase origin main
          git push origin main
