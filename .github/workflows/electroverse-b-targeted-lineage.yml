name: Audit targeted B lineage relationships
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_targeted_lineage_relationships.mjs"
      - ".github/workflows/electroverse-b-targeted-lineage.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit_b_targeted_lineage_relationships.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-targeted-lineage-relationship-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist targeted B lineage relationships"
            git pull --rebase origin main || true
            git push
          fi
