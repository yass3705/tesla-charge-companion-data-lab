name: AVIA Picoty public Expo update probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_expo_update_probe.py"
      - ".github/workflows/avia-picoty-expo-update-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public production update endpoint
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_expo_update_probe.py
          python scripts/avia_picoty_expo_update_probe.py
      - name: Validate sanitized report
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_expo_update_probe.json')
          d=json.loads(p.read_text())
          assert d['schemaVersion']=='1.0.0' and d['credentialsSent'] is False
          assert len(d['results'])>=4
          raw=p.read_text()
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}',raw)
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}',raw)
          print([{'runtime':x['runtime'],'status':x['status'],'parts':len(x['parts']),'assetHits':len(x['assetScans'])} for x in d['results']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-expo-update-probe
          path: data/reports/avia_picoty_expo_update_probe.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_expo_update_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe AVIA Picoty public Expo update"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
