name: Belgium Monta public pricing collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/belgium-monta-public-pricing-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect Belgium Monta public pricing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/belgium/additional reports/belgium
          python - <<'PY'
          import json,urllib.request,urllib.parse,time,re,gzip
          from html.parser import HTMLParser
          from pathlib import Path
          from datetime import datetime,timezone

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None; self.buf=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='tr': self.row=[]
                  elif tag in ('td','th') and self.row is not None: self.cell=tag; self.buf=[]
              def handle_data(self,data):
                  if self.cell: self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell:
                      self.row.append(re.sub(r'\s+',' ',' '.join(self.buf)).strip()); self.cell=None; self.buf=[]
                  elif tag=='tr' and self.row is not None:
                      if self.row: self.rows.append(self.row)
                      self.row=None

          base='https://app.monta.app/roaming/monta-as-a-cpo-pricing'
          all_rows=[]; header=None; pages=0
          evse_re=re.compile(r'[A-Z]{2}\*?[A-Z0-9]{3}\*?E[A-Z0-9]+')
          for page in range(1,100):
              url=base+'?'+urllib.parse.urlencode({'country':'BE','page':page,'per_page':200})
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9','Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=90) as r: raw=r.read().decode('utf-8','replace')
              p=TableParser(); p.feed(raw); rows=p.rows
              if header is None:
                  for rr in rows:
                      low=[x.lower() for x in rr]
                      if any('evse' in x for x in low) and any(('price' in x or 'tariff' in x) for x in low):
                          header=rr; break
              data=[rr for rr in rows if any(evse_re.fullmatch(x.strip()) for x in rr)]
              all_rows.extend(data); pages+=1
              print(json.dumps({'page':page,'dataRows':len(data)}))
              if len(data)<200: break
              time.sleep(.35)

          parsed=[]
          for rr in all_rows:
              evse=next((x.strip() for x in rr if evse_re.fullmatch(x.strip())),None)
              tariff=next((x for x in reversed(rr) if re.fullmatch(r'BE[A-Z0-9-]*T\d+',x.strip())),None)
              currency=next((x.lower() for x in rr if x.lower() in ('eur','gbp','dkk','sek','nok','chf','usd')),None)
              nums=[]
              for i,x in enumerate(rr):
                  if re.fullmatch(r'-?\d+(?:\.\d+)?',x.strip()):
                      try: nums.append((i,float(x)))
                      except: pass
              price=None; power=None
              ci=next((i for i,x in enumerate(rr) if currency and x.lower()==currency),None)
              if ci is not None:
                  before=[(i,v) for i,v in nums if i<ci]
                  if before:
                      if len(before)>=2: power=before[0][1]; price=before[1][1]
                      else: price=before[-1][1]
              parsed.append({'evseId':evse,'tariffId':tariff,'currency':currency,'powerKw':power,'energyPrice':price,'raw':rr})

          by_evse={}
          for p in parsed:
              if p.get('evseId'): by_evse[p['evseId']]=p
          tariff_values={}
          for p in parsed:
              tid=p.get('tariffId')
              if tid: tariff_values.setdefault(tid,set()).add((p.get('energyPrice'),p.get('currency')))
          conflicts={k:sorted([list(v) for v in vals],key=str) for k,vals in tariff_values.items() if len(vals)>1}
          retrieved=datetime.now(timezone.utc).isoformat()
          out={'country':'BE','network':'Monta platform','retrievedAt':retrieved,'sourceUrl':base,'header':header,'pages':pages,'pricingRows':parsed}
          summary={'country':'BE','network':'Monta platform','retrievedAt':retrieved,'pages':pages,'pricingRows':len(parsed),'distinctEvses':len(by_evse),'distinctPricingTariffs':len(tariff_values),'tariffPriceConflicts':conflicts,'header':header,'firstRows':parsed[:5],'status':'complete_public_pricing_snapshot' if parsed and not conflicts else 'partial'}
          with gzip.open('data/belgium/additional/monta-public-pricing-2026-09-29.json.gz','wt',encoding='utf-8') as g:
              json.dump(out,g,ensure_ascii=False,separators=(',',':'))
          Path('reports/belgium/monta-public-pricing-2026-09-29.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/belgium/additional/monta-public-pricing-2026-09-29.json.gz reports/belgium/monta-public-pricing-2026-09-29.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(be): collect Monta public pricing [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
