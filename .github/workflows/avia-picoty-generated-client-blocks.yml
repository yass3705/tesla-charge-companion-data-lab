name: AVIA Picoty generated client blocks

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_generated_client_blocks.py"
      - ".github/workflows/avia-picoty-generated-client-blocks.yml"
      - "data/reports/avia_picoty_runtime_config.json"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract generated client blocks
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_generated_client_blocks.py
          python scripts/avia_picoty_generated_client_blocks.py
      - name: Validate redacted report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_generated_client_blocks.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          raw=p.read_text(encoding='utf-8')
          assert d['schemaVersion']=='1.0.0'
          assert d['genericRouteBlocks'] or any(d['targets'].values())
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}', raw)
          print({k:len(v) for k,v in d['targets'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-generated-client-blocks
          path: data/reports/avia_picoty_generated_client_blocks.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_generated_client_blocks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract AVIA Picoty generated Deftpower client blocks"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
