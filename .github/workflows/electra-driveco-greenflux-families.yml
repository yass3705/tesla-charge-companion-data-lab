name: Electra eMSP DRIVECO Greenflux tariff families
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/france/audit_electra_driveco_greenflux.mjs"
      - ".github/workflows/electra-driveco-greenflux-families.yml"
permissions:
  contents: write
concurrency:
  group: electra-driveco-greenflux-families-main
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify real tariff families by CPO and individual EVSE
        run: node scripts/france/audit_electra_driveco_greenflux.mjs
      - name: Preserve auditable results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/electra/driveco-greenflux-tariff-family-audit-latest.json reports/france/electra/driveco-greenflux-residual-families-latest.csv
          if ! git diff --cached --quiet; then
            git commit -m 'audit(electra): classify Driveco and Greenflux eMSP tariff and technical families'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
