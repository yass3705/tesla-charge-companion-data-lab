name: Audit B FR55C current-tech duplicate groups
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_fr55c_current_tech_duplicates.py"
      - ".github/workflows/electroverse-b-fr55c-current-tech.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_b_fr55c_current_tech_duplicates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-fr55c-current-tech-duplicate-groups.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B FR55C current-tech duplicate groups"
            git pull --rebase origin main || true
            git push
          fi
