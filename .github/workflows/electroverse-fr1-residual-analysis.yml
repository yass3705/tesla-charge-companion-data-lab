name: Analyze Electroverse France FR1 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_fr1_residual.mjs"
      - ".github/workflows/electroverse-fr1-residual-analysis.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze FR1 unpublished residual
        run: node scripts/analyze_electroverse_fr1_residual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-fr1-residual-analysis
          path: reports/electroverse/fr1-residual-analysis.json
          retention-days: 14
