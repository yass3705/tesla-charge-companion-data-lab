name: Electroverse UK national source details
on:
  pull_request:
    paths:
      - .github/workflows/electroverse-uk-national-details.yml
      - scripts/electroverse_uk_national_details.mjs
      - tests/test_electroverse_uk_national_details.mjs
  workflow_dispatch:
    inputs:
      offset:
        description: First PK in the immutable UK candidate queue
        required: true
        default: '0'
      count:
        description: PK count, maximum 100 (20 GraphQL requests)
        required: true
        default: '100'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_electroverse_uk_national_details.mjs
      - name: Collect bounded source details
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
        run: node scripts/electroverse_uk_national_details.mjs "${{ inputs.offset }}" "${{ inputs.count }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: electroverse-uk-national-details
          path: reports/emsp-national/electroverse-uk-details/*.json.gz
          if-no-files-found: warn
          retention-days: 7
