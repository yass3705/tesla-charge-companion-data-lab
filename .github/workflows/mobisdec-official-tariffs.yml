name: MobiSDEC official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mobisdec-official-tariffs.yml"
      - "scripts/mobisdec_official.py"
      - "scripts/public_safety_check.py"

permissions:
  contents: write

concurrency:
  group: mobisdec-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Extract and validate official MobiSDEC evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/mobisdec
          python -m py_compile scripts/mobisdec_official.py
          python scripts/mobisdec_official.py 2> >(tee out/mobisdec/error.log >&2)
          cat out/mobisdec/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/mobisdec
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/mobisdec/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/mobisdec/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'mobisdec-individual-diagnostic',
              'operator':'MobiSDEC / SDEC Énergie',
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-80:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mobisdec/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(mobisdec): publish operator diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate output envelope
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/mobisdec/mobisdec_official_calvados.json').read_text())
          assert p['dataset'] == 'mobisdec-official-calvados'
          assert p['operator'] == 'MobiSDEC / SDEC Énergie'
          assert p['country'] == 'FR'
          assert p['publicationStatus'] == 'candidate_validated_source_with_fee_discrepancy'
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['classification']['technicalOperator2026'] == 'Load Stations'
          assert p['classification']['immobilizationFeeSourceDiscrepancy'] is True
          d=p['operatorDirect']
          assert d['energyTariffs']['slow7Kva']['eurPerKwh'] == 0.42
          assert d['energyTariffs']['normal22To25Kva']['eurPerKwh'] == 0.47
          assert d['energyTariffs']['rapid50Kva']['eurPerKwh'] == 0.52
          assert d['energyTariffs']['rapid100Kva']['eurPerKwh'] == 0.57
          assert d['energyTariffs']['rapid150KvaAndAbove']['eurPerKwh'] == 0.62
          i=d['immobilization']
          assert i['graceAfterChargeCompleteMinutes'] == 15
          assert i['formalSdec2026ApprovedEurPerMinute'] == 0.22
          assert i['mobisdecWebsiteDisplayedEurPerMinute'] == 0.21
          assert i['recommendedCalculatorValue'] is None
          assert i['manualBillingCheckRequired'] is True
          assert p['accessChannels']['qrSubscriptionRequired'] is False
          assert p['accessChannels']['contactlessRestrictedToRapidStations'] is True
          assert p['roaming']['mustRemainSeparateFromMobisdecDirectTariff'] is True
          samples=p['technical']['stationExamplesFromOfficialDataset']
          assert samples['caen'] and samples['bayeux'] and samples['vireNormandie']
          print('Validated MobiSDEC output envelope with immobilization-fee discrepancy preserved')
          PY

      - name: Publish validated rule set only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/mobisdec/mobisdec_official_calvados.json')
          dst=Path('data/operator_direct/mobisdec_official_calvados.json')
          rep=Path('reports/mobisdec/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/mobisdec/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated MobiSDEC rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/mobisdec_official_calvados.json reports/mobisdec/latest_summary.md
          git commit -m "data(mobisdec): publish official Calvados tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
