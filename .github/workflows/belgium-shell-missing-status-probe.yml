name: Belgium Shell missing status probe

on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-shell-missing-status-probe.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BELGIUM_NAP_TOKEN: ${{ secrets.BELGIUM_NAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe all missing-price Shell EVSEs
        run: python scripts/belgium_shell_missing_status_probe.py
      - name: Persist results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium-shell-missing-status-probe-2026-09-28.json
          git commit -m "Probe Belgium Shell missing-price statuses" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
