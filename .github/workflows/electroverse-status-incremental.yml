name: Electroverse FR incremental status census
on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Partition 0..15; blank means 0'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '10,30,50 22-23,0-3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/electroverse_status_incremental.mjs'
      - '.github/workflows/electroverse-status-incremental.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: electroverse-status-incremental-fr
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
      ELECTROVERSE_STATUS_REQUEST_DELAY_MS: '800'
      ELECTROVERSE_STATUS_FAILURE_BUDGET: '48'
      ELECTROVERSE_STATUS_RUN_LIMIT: '1500'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve partition from trigger
        id: partition
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PARTITION: ${{ inputs.partition }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            hour=$(date -u +%H)
            minute=$(date -u +%M)
            slot=$(( ((10#$hour + 2) % 24) * 3 + (10#$minute - 10)/20 ))
            p=$(( slot % 16 ))
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            p="${INPUT_PARTITION:-0}"
          else
            p="0"
          fi
          [[ "$p" =~ ^([0-9]|1[0-5])$ ]] || { echo "Invalid partition $p" >&2; exit 1; }
          printf 'number=%s\n' "$p" >> "$GITHUB_OUTPUT"
          echo "partition=$p"
      - name: Verify collector syntax
        run: node --check scripts/electroverse_status_incremental.mjs
      - name: Synchronize latest progress before reading a partition
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Collect and checkpoint one partition (fallback on individual requests)
        env:
          PART: ${{ steps.partition.outputs.number }}
        run: node scripts/electroverse_status_incremental.mjs collect "$PART"
      - name: Archive chunk evidence even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electroverse-status-partition-${{ steps.partition.outputs.number }}
          path: |
            data/electroverse/live_statuses/parts/
            reports/electroverse/status-partition-latest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist progress with optimistic rebase
        env:
          PART: ${{ steps.partition.outputs.number }}
        run: |
          set -euo pipefail
          part=$(printf 'part-%02d.json' "$PART")
          mkdir -p /tmp/electroverse-status-parts
          cp "data/electroverse/live_statuses/parts/$part" "/tmp/electroverse-status-parts/$part"
          cp reports/electroverse/status-partition-latest.json /tmp/electroverse-status-partition-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/electroverse/live_statuses/parts reports/electroverse
            node scripts/electroverse_merge_status_partitions.mjs "/tmp/electroverse-status-parts/$part" "data/electroverse/live_statuses/parts/$part"
            cp /tmp/electroverse-status-partition-report.json reports/electroverse/status-partition-latest.json
            git add "data/electroverse/live_statuses/parts/$part" reports/electroverse/status-partition-latest.json
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -m "data(electroverse): checkpoint status partition $PART"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((n*2))
          done
          [[ "$ok" -eq 1 ]] || exit 1
      - name: Finalize national ledger only after all partitions are recent and complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/electroverse_status_incremental.mjs finalize
          if [ ! -s data/electroverse/live_statuses/manifest.json ]; then
            echo 'National ledger remains blocked pending other partitions'
            exit 0
          fi
          node scripts/electroverse_status_incremental.mjs validate
          cp data/electroverse/live_statuses/manifest.json /tmp/ev_status_manifest.json
          cp data/electroverse/live_statuses/evses.json.gz /tmp/ev_status_evses.json.gz
          cp reports/electroverse/status-national-finalization.json /tmp/ev_status_finalization.json
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ev_status_manifest.json data/electroverse/live_statuses/manifest.json
            cp /tmp/ev_status_evses.json.gz data/electroverse/live_statuses/evses.json.gz
            cp /tmp/ev_status_finalization.json reports/electroverse/status-national-finalization.json
            git add data/electroverse/live_statuses/manifest.json data/electroverse/live_statuses/evses.json.gz reports/electroverse/status-national-finalization.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(electroverse): publish verified complete status snapshot'
            if git push origin HEAD:main; then
              echo 'Dispatching guarded overlay rebuild'
              gh workflow run electroverse-france-evse-overlay.yml --ref main --repo "$GH_REPO"
              exit 0
            fi
            sleep $((n*2))
          done
          exit 1
