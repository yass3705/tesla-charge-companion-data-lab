name: Retired Electroverse monolithic status sweep
# Retired: nationwide one-shot sweeps exhausted GraphQL service with
# thousands of partial failures. Use electroverse-status-incremental.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Point to incremental replacement
        run: |
          echo 'One-shot Electroverse status sweep retired. Use electroverse-status-incremental.yml to resume 16 durable partitions.'
