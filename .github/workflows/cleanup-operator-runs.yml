name: Cleanup operator runs

on:
  workflow_run:
    workflows:
      - Lidl Plus official tariff
      - IZIVIA official tariffs
      - Fastned official tariffs
      - Allego official tariffs v2
      - TotalEnergies official tariffs
      - IONITY official tariffs
      - Powerdot official tariffs
      - ENGIE Vianeo official tariffs
      - Freshmile official tariffs
      - DRIVECO official tariffs
      - IECharge official tariffs
      - e-Vadea official tariffs
      - Atlante official tariffs
      - Plug Inn fast charge official tariffs
      - Zunder official tariffs
      - Belib official Paris tariffs
      - Métropolis official tariffs
      - eborn official tariffs
      - Ouest Charge official tariffs
      - Mobive official tariffs
      - Alizé Toulouse official tariffs
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Operator workflow to clean
        required: true
        default: all
        type: choice
        options:
          - all
          - lidl
          - izivia
          - fastned
          - allego
          - totalenergies
          - ionity
          - powerdot
          - vianeo
          - freshmile
          - driveco
          - iecharge
          - evadea
          - atlante
          - pluginn
          - zunder
          - belib
          - metropolis
          - eborn
          - ouestcharge
          - mobive
          - alize_toulouse
  push:
    branches: ["main"]
    paths:
      - "scripts/cleanup_operator_runs.py"
      - ".github/workflows/cleanup-operator-runs.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-operator-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Resolve cleanup target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="all"
          keep_run=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            keep_run="${{ github.event.workflow_run.id }}"
            case "${{ github.event.workflow_run.name }}" in
              "Lidl Plus official tariff") target="lidl" ;;
              "IZIVIA official tariffs") target="izivia" ;;
              "Fastned official tariffs") target="fastned" ;;
              "Allego official tariffs v2") target="allego" ;;
              "TotalEnergies official tariffs") target="totalenergies" ;;
              "IONITY official tariffs") target="ionity" ;;
              "Powerdot official tariffs") target="powerdot" ;;
              "ENGIE Vianeo official tariffs") target="vianeo" ;;
              "Freshmile official tariffs") target="freshmile" ;;
              "DRIVECO official tariffs") target="driveco" ;;
              "IECharge official tariffs") target="iecharge" ;;
              "e-Vadea official tariffs") target="evadea" ;;
              "Atlante official tariffs") target="atlante" ;;
              "Plug Inn fast charge official tariffs") target="pluginn" ;;
              "Zunder official tariffs") target="zunder" ;;
              "Belib official Paris tariffs") target="belib" ;;
              "Métropolis official tariffs") target="metropolis" ;;
              "eborn official tariffs") target="eborn" ;;
              "Ouest Charge official tariffs") target="ouestcharge" ;;
              "Mobive official tariffs") target="mobive" ;;
              "Alizé Toulouse official tariffs") target="alize_toulouse" ;;
              *)
                echo "Unknown operator workflow; nothing to clean"
                exit 0
                ;;
            esac
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "keep_run=$keep_run" >> "$GITHUB_OUTPUT"
          echo "Resolved cleanup target: $target"
          if [[ -n "$keep_run" ]]; then
            echo "Reference successful run: $keep_run"
          fi

      - name: Prune obsolete completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --target "${{ steps.target.outputs.target }}"
            --prune-self
            --current-cleanup-run-id "$GITHUB_RUN_ID"
          )
          if [[ -n "${{ steps.target.outputs.keep_run }}" ]]; then
            args+=(--keep-run-id "${{ steps.target.outputs.keep_run }}")
          fi
          python scripts/cleanup_operator_runs.py "${args[@]}" | tee cleanup.log

          {
            echo "## Operator workflow cleanup"
            echo
            echo '```text'
            cat cleanup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
