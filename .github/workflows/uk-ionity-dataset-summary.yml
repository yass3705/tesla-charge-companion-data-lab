name: UK IONITY dataset summary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-ionity-dataset-summary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize existing UK IONITY dataset
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          p=json.load(gzip.open("data/national/ionity_direct_stations_uk.json.gz","rt",encoding="utf-8"))
          out={
            "generatedAt":p.get("generatedAt"),
            "operator":p.get("operator"),
            "country":p.get("country"),
            "scope":p.get("scope"),
            "counts":p.get("counts"),
            "validation":{
              "allLocationsGBAndIonityCpo":all(x.get("country")=="GB" and x.get("cpoIdentifier")=="IONITY_CPO" for x in p.get("locations",[])),
              "allConnectorsPricedPositiveGbp":all(c.get("pricePerKwhGbp",0)>0 for x in p.get("locations",[]) for c in x.get("connectors",[]))
            }
          }
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/ionity-direct-uk-latest.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/ionity-direct-uk-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(uk): summarize IONITY Direct dataset [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
