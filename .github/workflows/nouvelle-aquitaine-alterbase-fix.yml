name: Nouvelle-Aquitaine AlterBase decimal fix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nouvelle-aquitaine-alterbase-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make AlterBase numeric witness robust
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/nouvelle_aquitaine_regional_coverage.py')
          s = p.read_text()
          old = "        require(src['alterbase']['text'],'18€','0,432','0,528','0,612','0,996',label='AlterBase')"
          new = """        alter_text=norm(src['alterbase']['text'])
        alter_compact=re.sub(r'\\s+','',alter_text).replace(',','.')
        require(src['alterbase']['text'],'18€',label='AlterBase')
        alter_missing=[v for v in ('0.432','0.528','0.612','0.996') if v not in alter_compact]
        if alter_missing: raise RuntimeError('AlterBase missing numeric witnesses: '+', '.join(alter_missing))"""
          if old not in s:
              raise SystemExit('Current AlterBase witness line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile scripts/nouvelle_aquitaine_regional_coverage.py
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nouvelle_aquitaine_regional_coverage.py
          git commit -m "fix(nouvelle-aquitaine): robust AlterBase numeric witness"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
