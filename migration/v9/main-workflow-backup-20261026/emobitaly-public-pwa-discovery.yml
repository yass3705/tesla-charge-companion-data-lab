name: EMOBITALY public PWA discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/emobitaly-public-pwa-discovery.yml"

permissions:
  contents: write

concurrency:
  group: emobitaly-public-pwa-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover public PWA assets and API candidates
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, ssl
          from pathlib import Path

          BASE='https://app.emobitaly.com/'
          UA='Mozilla/5.0 TCC-V9-readonly-discovery'
          ctx=ssl.create_default_context()

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                  b=r.read()
                  return r.status,dict(r.headers),b

          status,headers,raw=get(BASE)
          html=raw.decode('utf-8','replace')
          assets=set()
          for m in re.finditer(r'''(?:src|href)=["']([^"'#]+)["']''',html,re.I):
              u=urllib.parse.urljoin(BASE,m.group(1))
              if urllib.parse.urlparse(u).netloc.endswith('emobitaly.com'):
                  assets.add(u)

          # Common PWA manifests/service workers are also worth inspecting.
          for rel in ('manifest.json','manifest.webmanifest','service-worker.js','sw.js'):
              assets.add(urllib.parse.urljoin(BASE,rel))

          texts={BASE:html}
          fetched=[]
          for u in sorted(assets):
              try:
                  s,h,b=get(u)
                  ctype=h.get('Content-Type','')
                  if len(b)<=8_000_000 and ('javascript' in ctype or 'json' in ctype or 'text' in ctype or u.endswith(('.js','.json','.webmanifest'))):
                      t=b.decode('utf-8','replace')
                      texts[u]=t
                      fetched.append({'url':u,'status':s,'bytes':len(b),'contentType':ctype})
              except Exception as e:
                  fetched.append({'url':u,'error':type(e).__name__+': '+str(e)[:300]})

          blob='\n'.join(texts.values())
          absolute=sorted(set(re.findall(r'https?://[^"\'<>\\\s]+',blob)))
          apiish=sorted(set(
              x.rstrip('),;')
              for x in absolute
              if any(k in x.lower() for k in ('api','charge','station','evse','tariff','price','optimile','mobility'))
          ))
          paths=sorted(set(re.findall(r'''["'](/[^"'\s]{2,180})["']''',blob)))
          path_candidates=[
              p for p in paths
              if any(k in p.lower() for k in ('api','charge','station','evse','tariff','price','location','connector'))
          ]

          env_hits=[]
          patterns=('apiurl','api_url','baseurl','base_url','graphql','axios','fetch(','station','tariff','price','evse','connector')
          for url,t in texts.items():
              low=t.lower()
              for pat in patterns:
                  pos=0
                  while True:
                      i=low.find(pat,pos)
                      if i<0: break
                      env_hits.append({'asset':url,'pattern':pat,'context':t[max(0,i-180):i+380]})
                      pos=i+len(pat)
                      if len(env_hits)>=250: break
                  if len(env_hits)>=250: break
              if len(env_hits)>=250: break

          report={
              'schemaVersion':1,
              'subject':'EMOBITALY public PWA static discovery',
              'base':BASE,
              'rootStatus':status,
              'fetchedAssets':fetched,
              'absoluteApiCandidates':apiish[:300],
              'pathCandidates':path_candidates[:500],
              'contextHits':env_hits,
              'safety':'Static/public GET discovery only. No login, payment, charging action, mutation, or credential use.'
          }
          out=Path('data/reports/emobitaly_public_pwa_discovery_latest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({
              'assets':len(fetched),
              'absoluteApiCandidates':len(apiish),
              'pathCandidates':len(path_candidates),
              'contextHits':len(env_hits)
          }))
          PY

      - name: Publish discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/emobitaly_public_pwa_discovery_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(italy): inspect EMOBITALY public PWA surface [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
