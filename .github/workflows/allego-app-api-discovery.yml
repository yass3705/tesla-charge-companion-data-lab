name: Allego app API discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/allego-app-api-discovery.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Allego shells and current bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/bundles probe/headers
          for page in root price; do
            if [[ "$page" == root ]]; then URL='https://app.allego.eu/'; else URL='https://app.allego.eu/price/FRALLEGO8001301'; fi
            curl -fsSL --max-time 30 -A 'Mozilla/5.0' "$URL" -o "probe/${page}.html"
          done
          python - <<'PY'
          from pathlib import Path
          import re, html
          srcs=[]
          for p in (Path('probe/root.html'),Path('probe/price.html')):
              t=p.read_text(errors='replace')
              print('\n===',p,'script tags ===')
              for tag in re.findall(r'<script[^>]*>',t,re.I): print(tag)
              for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)', t, re.I):
                  src=html.unescape(m.group(1))
                  if src.startswith('/'):
                      src='https://app.allego.eu'+src
                  elif src.startswith('//'):
                      src='https:'+src
                  elif not src.startswith('http'):
                      src='https://app.allego.eu/'+src.lstrip('/')
                  srcs.append(src)
          srcs=list(dict.fromkeys(srcs))
          Path('probe/scripts.txt').write_text('\n'.join(srcs))
          print('scripts=',srcs)
          PY
          i=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            echo "===== GET $u ====="
            curl -sS -L --max-time 45 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -H 'Accept: */*' \
              -H 'Referer: https://app.allego.eu/price/FRALLEGO8001301' \
              -D "probe/headers/bundle_${i}.txt" \
              -w 'status=%{http_code} type=%{content_type} size=%{size_download} final=%{url_effective}\n' \
              "$u" -o "probe/bundles/bundle_${i}.js" || true
            cat "probe/headers/bundle_${i}.txt" || true
            wc -c "probe/bundles/bundle_${i}.js" 2>/dev/null || true
            head -c 160 "probe/bundles/bundle_${i}.js" 2>/dev/null || true; echo
          done < probe/scripts.txt

      - name: Inspect bundles for API and tariff routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json
          files=[p for p in Path('probe/bundles').glob('*.js') if p.stat().st_size>5000]
          text='\n'.join(p.read_text(errors='replace') for p in files)
          print('bundle_count=',len(files),'chars=',len(text))
          urls=sorted(set(re.findall(r'https?://[^"\'`\\\s<>]{4,240}', text)))
          print('\n=== ABSOLUTE URLS (filtered) ===')
          for u in urls:
              low=u.lower()
              if any(k in low for k in ('api','allego','smoov','charge','tariff','price','evse','ocpi')):
                  print(u[:320])
          print('\n=== ROUTE / CONTEXT HITS ===')
          keys=['tariff','price','evse','chargepoint','charge-point','chargingstation','charging-station','station','ocpi','graphql','baseurl','axios','fetch(']
          hits=[]; low=text.lower()
          for key in keys:
              start=0; n=0
              while n<30:
                  pos=low.find(key,start)
                  if pos<0: break
                  a=max(0,pos-260); b=min(len(text),pos+520)
                  chunk=re.sub(r'\s+',' ',text[a:b])
                  hits.append((key,chunk)); n+=1; start=pos+len(key)
          for key,chunk in hits:
              print(f'[{key}] {chunk[:900]}')
          Path('probe/api_hits.json').write_text(json.dumps({'urls':urls,'hits':hits},ensure_ascii=False,indent=2))
          PY

      - name: Capture browser network calls from price page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,time,re
          from pathlib import Path
          opt=Options()
          opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--window-size=1440,1600')
          opt.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opt)
          try:
              url='https://app.allego.eu/price/FRALLEGO8001301'
              d.get(url); time.sleep(8)
              body=d.find_element('tag name','body').text
              Path('probe/rendered_body.txt').write_text(body)
              print('\n=== RENDERED BODY ===')
              print(body[:6000])
              rows=[]
              for item in d.get_log('performance'):
                  try: msg=json.loads(item['message'])['message']
                  except Exception: continue
                  if msg['method']=='Network.requestWillBeSent':
                      r=msg['params']['request']; u=r.get('url','')
                      rows.append({'kind':'request','url':u,'method':r.get('method'),'postData':r.get('postData'),'type':msg['params'].get('type')})
                  elif msg['method']=='Network.responseReceived':
                      r=msg['params']['response']; u=r.get('url','')
                      rows.append({'kind':'response','url':u,'status':r.get('status'),'mimeType':r.get('mimeType'),'type':msg['params'].get('type')})
              Path('probe/network.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              print('\n=== NETWORK API/PRICE CANDIDATES ===')
              seen=set()
              for r in rows:
                  u=r.get('url',''); low=u.lower()
                  if u in seen: continue
                  if any(k in low for k in ('api','price','tariff','evse','charge','station','ocpi','smoov')) or r.get('type') in ('Fetch','XHR'):
                      seen.add(u); print(json.dumps(r,ensure_ascii=False)[:1200])
              print('\n=== BROWSER CONSOLE ===')
              for x in d.get_log('browser'): print(x)
          finally:
              d.quit()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: allego-app-api-discovery
          path: probe
          retention-days: 3
