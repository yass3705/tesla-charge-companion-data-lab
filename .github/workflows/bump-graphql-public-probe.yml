name: Bump public GraphQL probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_graphql_public_probe.py"
      - ".github/workflows/bump-graphql-public-probe.yml"

permissions:
  contents: write

concurrency:
  group: bump-public-graphql-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public GraphQL endpoint/schema
        run: python scripts/bump_graphql_public_probe.py
      - name: Validate sanitized metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/graphql_public_probe_latest.json').read_text())
          m=p['method']
          assert m['unauthenticated'] and m['readOnlyGraphqlQueriesOnly']
          assert not m['mutationsSent'] and not m['credentialsUsed'] and not m['responseBodiesPersisted'] and not m['personalDataQueried']
          for a in p['attempts']:
              assert '?' not in a['path'] and '#' not in a['path']
          print({'endpoint':p['graphqlEndpoint'],'introspection':p['introspection']})
          PY
      - name: Publish sanitized GraphQL probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/graphql_public_probe_latest.json reports/bump/graphql_public_probe_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(bump): publish GraphQL public probe [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
