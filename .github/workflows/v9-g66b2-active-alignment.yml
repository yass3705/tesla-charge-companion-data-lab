name: V9 G6.6b-2 active IRVE alignment and lane impact
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/g66b2-active-alignment-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-electroverse-overlay-offline-audit
  cancel-in-progress: false
jobs:
  alignment:
    if: github.repository == 'yass3705/tesla-charge-companion-data-lab' && github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yass3705/tesla-charge-companion-production
          ref: b4f6d1af55b951cd93feaf210d96958e50828823
          path: production
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pins and safety
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('migration/v9/g66b2-active-alignment-request.json').read_text())
          assert r['purpose']=='offline_g66b2_active_national_alignment'
          assert all(r[k] is False for k in ('supplierCalls','automaticPublication','runtimeActivation'))
          assert subprocess.check_output(['git','-C','production','rev-parse','HEAD'],text=True).strip()==r['productionSha']
          assert not subprocess.check_output(['git','diff','--name-only',r['dataLabParent'],'HEAD','--','data','reports','v9_rebuild','scripts/build_v9_canonical_batch.py'],text=True).strip()
          PY
          python -m unittest discover -s production/tests -p test_import_g66_fr_projection.py
          python -m unittest discover -s tests -p test_audit_g66b2_active_alignment.py
          python scripts/public_safety_check.py .
      - name: Verify immutable source and replay both national generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.audit_g66b2_active_alignment migration/v9/g66b2-active-alignment-request.json "$RUNNER_TEMP/g66b2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-g66b2-active-alignment
          path: ${{ runner.temp }}/g66b2/results/
          if-no-files-found: error
          retention-days: 30
