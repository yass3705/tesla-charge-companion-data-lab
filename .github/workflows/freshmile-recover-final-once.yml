name: Freshmile recover final scan once

on:
  pull_request:
    paths:
      - '.github/workflows/freshmile-recover-final-once.yml'

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: >-
          python -m py_compile
          scripts/freshmile_direct_tariffs.py
          scripts/freshmile_direct_tariffs_v2.py
          scripts/freshmile_restore_unresolved_points.py
          scripts/freshmile_missing_ref_tariffs.py
      - name: Download final sharded artifact
        uses: actions/download-artifact@v4
        with:
          name: freshmile-direct-tariffs-final
          path: data/recovery
          run-id: 32843755985
          github-token: ${{ github.token }}
      - name: Restore IRVE EVSE placeholders
        run: >-
          python scripts/freshmile_restore_unresolved_points.py
          --inventory data/recovery/freshmile_direct_stations_france.json.gz
          --scan data/recovery/freshmile_direct_tariffs_france.json.gz
          --output data/recovery/freshmile_direct_tariffs_france.json.gz
      - name: Recover by exact EVSE custom ref
        run: >-
          python scripts/freshmile_missing_ref_tariffs.py
          --input data/recovery/freshmile_direct_stations_france.json.gz
          --scan data/recovery/freshmile_direct_tariffs_france.json.gz
          --output data/recovery/freshmile_direct_tariffs_france.json.gz
      - name: Validate recovered national layer
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from collections import Counter
          from pathlib import Path
          path = Path('data/recovery/freshmile_direct_tariffs_france.json.gz')
          with gzip.open(path, 'rt', encoding='utf-8') as handle:
              data = json.load(handle)
          stats = data['stats']
          points = [p for s in data['stations'] for p in s['chargePoints']]
          tariffs = [t for p in points for t in p['tariffs']]
          invalid_rankable = [t for t in tariffs if t.get('tccRankable') and (not t.get('sourceValidated') or t.get('isPreferential') or t.get('currency') not in {None, 'EUR'} or (t.get('components') or {}).get('status') in {'unparsed','parsed_complex_tiers'})]
          summary = {
              'pointCount': len(points),
              'inventoryPointCount': stats['chargePointsInInventory'],
              'preservation': data.get('irveEvsePreservation'),
              'recovery': data.get('recovery'),
              'quality': data.get('quality'),
              'stats': stats,
              'tariffs': {
                  'found': len(tariffs),
                  'sourceValidated': sum(bool(t.get('sourceValidated')) for t in tariffs),
                  'rankable': sum(bool(t.get('tccRankable')) for t in tariffs),
                  'unparsed': sum((t.get('components') or {}).get('status') == 'unparsed' for t in tariffs),
                  'complexTiered': sum((t.get('components') or {}).get('status') == 'parsed_complex_tiers' for t in tariffs),
                  'currencies': dict(Counter(str(t.get('currency') or 'NONE') for t in tariffs)),
                  'invalidRankable': len(invalid_rankable),
              },
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert len(points) == stats['chargePointsInInventory']
          assert stats.get('evseMatchedFinal', 0) / max(1, stats['chargePointsInInventory']) >= 0.98
          assert not invalid_rankable
          PY
      - name: Upload recovered national artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshmile-direct-tariffs-recovered-final
          path: |
            data/recovery/freshmile_direct_stations_france.json.gz
            data/recovery/freshmile_direct_tariffs_france.json.gz
          retention-days: 7
          if-no-files-found: warn
