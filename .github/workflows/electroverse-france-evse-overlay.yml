name: Build France Electroverse EVSE overlay
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - "data/platforms/electroverse/validated-mappings/p01-structured-residual.json"
      - "data/platforms/electroverse/validated-mappings/b-residual.json"
      - "data/platforms/electroverse/validated-mappings/sae-structured-residual.json"
      - "data/platforms/electroverse/validated-mappings/h01-structured-residual.json"
      - "data/platforms/electroverse/validated-mappings/adp-structured-residual.json"
      - "data/platforms/electroverse/validated-mappings/generic-small-buckets.json"
      - ".github/workflows/electroverse-france-evse-overlay.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: electroverse-france-evse-overlay
  cancel-in-progress: true
jobs:
  # rebuild marker: generic small-bucket ledger
  # rebuild marker: ADP structured ledger persisted
  # rebuild marker: H01 structured ledger persisted
  # rebuild marker: SAE structured ledger persisted
  # rebuild marker: validated B residual ledger ready
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact EVSE-level Electroverse overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Persist validated EVSE overlay
        run: |
          rm -rf /tmp/electroverse-france-evse
          cp -a data/platforms/electroverse/france-evse /tmp/electroverse-france-evse
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/platforms/electroverse/france-evse
            mkdir -p data/platforms/electroverse
            cp -a /tmp/electroverse-france-evse data/platforms/electroverse/france-evse
            git add data/platforms/electroverse/france-evse
            if git diff --cached --quiet; then
              echo 'No overlay changes'
              exit 0
            fi
            git commit -m 'data: publish France Electroverse EVSE-level national overlay'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to persist Electroverse overlay after retries' >&2
          exit 1
