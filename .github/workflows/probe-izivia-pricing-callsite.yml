name: France IZIVIA pricing callsite probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-pricing-callsite.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract safe pricing callsite contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia /tmp/i
          curl -fLsS https://fronts-map.izivia.com/ -o /tmp/i/index.html
          JS=$(grep -Eo 'src="[^"]+\.js' /tmp/i/index.html | head -1 | cut -d'"' -f2)
          curl -fLsS "https://fronts-map.izivia.com/${JS#/}" -o /tmp/i/app.js
          python - <<'PY'
          import re,json,pathlib
          t=pathlib.Path('/tmp/i/app.js').read_text(errors='ignore')
          contexts=[]
          for needle in ('pricing-info-items','firstStationEmipId','legacyId','stationEmipId'):
              for m in re.finditer(re.escape(needle),t):
                  s=t[max(0,m.start()-1800):min(len(t),m.end()+3000)]
                  if re.search(r'(?i)mapbox|access.?token|api.?key',s): continue
                  if s not in contexts: contexts.append(s)
          out={'contexts':contexts[:30]}
          pathlib.Path('reports/france/izivia/pricing-callsite.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/izivia/pricing-callsite.json
          git commit -m 'France IZIVIA: publish pricing callsite probe' || exit 0
          git pull --rebase origin main
          git push
