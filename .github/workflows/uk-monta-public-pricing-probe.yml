name: UK Monta public pricing probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-monta-public-pricing-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe public Monta CPO pricing page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,html
          from pathlib import Path
          from datetime import datetime,timezone
          base='https://app.monta.app/roaming/monta-as-a-cpo-pricing'
          variants=[
            {'country':'all','page':'1','per_page':'200'},
            {'country':'GB','page':'1','per_page':'200'},
            {'country':'United Kingdom','page':'1','per_page':'200'},
            {'country':'uk','page':'1','per_page':'200'},
          ]
          out={'retrievedAt':datetime.now(timezone.utc).isoformat(),'variants':[]}
          for q in variants:
              url=base+'?'+urllib.parse.urlencode(q)
              item={'query':q,'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9','Accept':'text/html,*/*'})
                  with urllib.request.urlopen(req,timeout=60) as r: raw=r.read().decode('utf-8','replace')
                  txt=re.sub(r'<[^>]+>',' ',raw); txt=html.unescape(re.sub(r'\s+',' ',txt))
                  item.update({'status':r.status,'bytes':len(raw.encode()),'ukMentions':txt.lower().count('united kingdom'),'gbpMentions':txt.lower().count('gbp'),'monMentions':txt.count('DK*MON*'),'prefix':txt[:1500]})
                  item['evseSamples']=re.findall(r'[A-Z]{2}\*?[A-Z0-9]{3}\*?E[A-Z0-9]+',txt)[:20]
                  item['tariffSamples']=re.findall(r'GB[A-Z0-9-]*T\d+',txt)[:20]
              except Exception as e: item['error']=f'{type(e).__name__}: {e}'
              out['variants'].append(item)
          Path('reports/uk/monta-public-pricing-probe-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/monta-public-pricing-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Monta public pricing page [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
