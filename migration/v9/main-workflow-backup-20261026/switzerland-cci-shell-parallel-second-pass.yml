name: Switzerland CCI Shell parallel second pass
on:
  push:
    paths:
      - '.github/workflows/switzerland-cci-shell-parallel-second-pass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - operator: 'CH*CCI'
            slug: cci
            name: 'MOVE / CH*CCI'
            workers: 6
          - operator: 'CH*SHE'
            slug: shell-recharge
            name: 'Shell Recharge'
            workers: 5
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Parallel second pass
        run: |
          python3 scripts/collect_swiss_atlas_cpo_parallel.py \
            --operator '${{ matrix.operator }}' \
            --name '${{ matrix.name }}' \
            --output 'data/switzerland/${{ matrix.slug }}-direct-tariffs-second-pass.json' \
            --workers ${{ matrix.workers }} \
            --delay 0.05 \
            --provider-customer-tariffs
      - name: Write result
        shell: python
        run: |
          import json,pathlib
          slug='${{ matrix.slug }}'
          p=pathlib.Path(f'data/switzerland/{slug}-direct-tariffs-second-pass.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          doc={
            'schemaVersion':1,'country':'CH','cpo':x['cpo'],'operatorId':x['operatorId'],
            'pass':'second-parallel','status':x['summary']['status'],'summary':x['summary'],
            'unresolved':x['unresolved'],
            'method':'Swiss Ladepreisatlas public API, parallel second pass, provider_customer_tariffs=true, direct-only',
            'policy':'No cross-station extrapolation. National EVSE scope remains authoritative.'
          }
          pathlib.Path(f'docs/switzerland-{slug}-second-pass-2026-09-28.json').write_text(
            json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'data/switzerland/${{ matrix.slug }}-direct-tariffs-second-pass.json' 'docs/switzerland-${{ matrix.slug }}-second-pass-2026-09-28.json'
          git commit -m 'data(switzerland): parallel second-pass ${{ matrix.name }}' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
