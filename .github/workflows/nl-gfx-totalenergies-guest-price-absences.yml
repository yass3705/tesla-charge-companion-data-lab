name: NL GFX TotalEnergies 738 missing guest tariff causes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_gfx_totalenergies_exact_missing_classification_20261011.py
      - .github/workflows/nl-gfx-totalenergies-guest-price-absences.yml
permissions:
  contents: write
concurrency:
  group: nl-gfx-totalenergies-guest-price-absences
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compare 738 exact original TotalEnergies EVSE guest products
        run: |
          python3 -m py_compile scripts/nl_gfx_totalenergies_exact_missing_classification_20261011.py
          python3 scripts/nl_gfx_totalenergies_exact_missing_classification_20261011.py
      - name: Save exact public portal diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.json /tmp/gfx-te.json
          cp reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.csv /tmp/gfx-te.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gfx-te.json reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.json
            cp /tmp/gfx-te.csv reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.csv
            git add reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): exact TotalEnergies portal cause of 738 missing guest tariffs"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-gfx-te-guest-absences-${{ github.run_id }}
          path: |
            reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.json
            reports/netherlands/nl-gfx-totalenergies-738-missing-direct-price-diagnostic-latest.csv
