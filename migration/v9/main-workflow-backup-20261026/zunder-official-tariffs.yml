name: Zunder official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "57 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/zunder_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/zunder-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: zunder-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract Zunder official France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/zunder
          python -m py_compile scripts/zunder_official.py
          python scripts/zunder_official.py --out out/zunder 2> >(tee out/zunder/error.log >&2)
          cat out/zunder/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/zunder
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/zunder/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/zunder/latest_diagnostic.json').write_text(json.dumps({'dataset':'zunder-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-50:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/zunder/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(zunder): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification and tariffs
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/zunder/zunder_official_france.json').read_text())
          assert p['dataset'] == 'zunder-official-france'
          assert p['country'] == 'FR'
          assert p['classification']['singleFlatNationalPublicTariff'] is False
          assert p['classification']['stationLevelPriceLookupRequiredForExactPublicPrice'] is True
          ref=p['operatorDirect']['franceReferencePublic']
          assert ref['upTo50KwEurPerKwh'] == 0.42
          assert ref['above50KwEurPerKwh'] == 0.59
          sub=p['operatorDirect']['subscriptions']
          assert sub['easy']['monthlyFeeEur'] == 1.99 and sub['easy']['eurPerKwh'] == 0.51 and sub['easy']['creditPercent'] == 3
          assert sub['pro']['monthlyFeeEur'] == 11.99 and sub['pro']['eurPerKwh'] == 0.39 and sub['pro']['creditPercent'] == 5
          assert p['loyalty']['noPlanPercent'] == 1
          social=p['specialPrograms']['socialLeasing2026']
          assert social['generalPublicTariff'] is False
          assert social['upTo50KwEurPerKwh'] == 0.39 and social['above50KwEurPerKwh'] == 0.45
          assert social['validUntil'] == '2026-12-31'
          roaming=p['roaming']
          assert roaming['operatorDirect'] is False and roaming['zunderServiceFeeEurPerSession'] == 0.99 and roaming['plusCpoPrice'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          print('Validated Zunder France public, subscription, social-leasing and roaming layers')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/zunder/zunder_official_france.json')
          dst=Path('data/operator_direct/zunder_official_france.json')
          rep=Path('reports/zunder/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'specialPrograms':d.get('specialPrograms'),
                  'loyalty':d.get('loyalty'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/zunder/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Zunder rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/zunder_official_france.json reports/zunder/latest_summary.md
          git commit -m "data(zunder): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
