name: AVIA Picoty public tariff evidence sweep

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_carburantiq_sweep.py"
      - ".github/workflows/avia-picoty-carburantiq-sweep.yml"

permissions:
  contents: write

concurrency:
  group: avia-picoty-evidence-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sweep all current FR*PY2 stations
        shell: bash
        run: |
          set -euo pipefail
          test -s data/national/avia_volt_picoty_station_index.json
          python -m py_compile scripts/avia_picoty_carburantiq_sweep.py
          python scripts/avia_picoty_carburantiq_sweep.py \
            data/national/avia_volt_picoty_station_index.json \
            data/reports/avia_picoty_carburantiq_evidence_sweep.json
      - name: Validate evidence classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/reports/avia_picoty_carburantiq_evidence_sweep.json').read_text())
          assert d['counts']['stationInput']==41, d['counts']
          assert d['policy']=='public_unauthenticated_api_evidence_only_estimates_not_publishable'
          for x in d['publishableEvidence']:
              assert str(x['tariff'].get('source','')).lower()!='estimate'
          print(json.dumps({'counts':d['counts'],'sourceSummary':d['sourceSummary'],'statusSummary':d['statusSummary']},indent=2,ensure_ascii=False))
          PY
      - name: Upload evidence sweep
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-carburantiq-evidence-sweep
          path: data/reports/avia_picoty_carburantiq_evidence_sweep.json
          retention-days: 14
      - name: Commit evidence sweep
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_carburantiq_evidence_sweep.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh AVIA Picoty public tariff evidence sweep"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
