name: Refresh fixed tariffs BFC regional

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_fixed_tariffs_bfc.py"
      - ".github/workflows/refresh-fixed-tariffs-bfc.yml"
  workflow_dispatch:
  schedule:
    - cron: "49 2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-fixed-tariffs-bfc
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Refresh BFC regional fixed tariffs
        run: python3 scripts/refresh_fixed_tariffs_bfc.py
      - name: Publish validated changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/siceco_cotedor_official.json \
                  data/operator_direct/syded_doubs_official.json \
                  data/operator_direct/sieeen_nievre_official.json \
                  data/operator_direct/sied70_official_haute_saone.json \
                  data/operator_direct/sdey_official_yonne.json \
                  data/operator_direct/tde90_belfort_official.json \
                  data/tariff_history reports/fixed-tariff-refresh-bfc-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(fr): refresh BFC regional direct tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
