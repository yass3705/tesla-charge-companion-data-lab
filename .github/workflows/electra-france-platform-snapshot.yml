name: Build France Electra platform overlay
# CPO summary manifest gate
on:
  push:
    branches: [main]
    paths:
      - "scripts/electra_france_platform_snapshot.mjs"
      - "tests/electra-france-evse-power-scope.test.mjs"
      - "data/platforms/electra/irve-associations-batch-01.json"
      - "data/platforms/electra/irve-association-batches/**"
      - ".github/workflows/electra-france-platform-snapshot.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 1"
permissions:
  contents: write
concurrency:
  group: electra-france-platform-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression SOC80 et formats de tarif eMSP
        run: node tests/electra-france-congestion-soc80.test.mjs
      - name: Regression per-EVSE / same-power attribution
        run: node tests/electra-france-evse-power-scope.test.mjs
      - name: Build exact national-EVSE Electra platform overlay
        run: |
          rm -rf data/platforms/electra/france
          node scripts/electra_france_platform_snapshot.mjs data/platforms/electra/france data/national/france-irve-static-v9/all.json.gz
      - name: Persist validated overlay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/platforms/electra/france scripts/electra_france_platform_snapshot.mjs .github/workflows/electra-france-platform-snapshot.yml
          git commit -m 'data: publish France Electra platform overlay joined to national EVSEs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
