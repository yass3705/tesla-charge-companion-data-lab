name: UK Connekt Qwello Forward discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-connekt-qwello-forward-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect public frontends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          targets=[
            ("Connekt","https://www.connektcharging.com/driver-support"),
            ("Qwello","https://qwello.uk/en/"),
            ("Forward EV","https://www.forward-ev.com/drivers"),
          ]
          def get(url,limit=7_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status,r.geturl(),r.read(limit).decode("utf-8","replace"),r.headers.get("Content-Type")
              except urllib.error.HTTPError as e:
                  return e.code,url,e.read(3000).decode("utf-8","replace"),e.headers.get("Content-Type")

          def sanitize(s):
              s=re.sub(r'(?i)(access_token=)[^&"\'\s]+',r'\1<redacted>',s)
              s=re.sub(r'(?i)\b(?:pk|sk)\.[A-Za-z0-9._-]{20,}','<redacted-token>',s)
              return s

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":[]}
          for name,url in targets:
              st,final,html,ct=get(url)
              item={"name":name,"url":url,"status":st,"finalUrl":final,"contentType":ct}
              scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
              urls=set(); rel=set(); contexts=[]
              bodies=[("html",html)]
              for s in scripts[:80]:
                  try:
                      bst,bfinal,b,bct=get(s)
                      if bst==200: bodies.append((s,b))
                  except Exception: pass
              for source,b in bodies:
                  for u in re.findall(r'https?://[^"\'\s<>()\\]+',b):
                      if any(k in u.lower() for k in ("api","charge","station","location","tariff","ocpi","plug","connekt","qwello","forward")):
                          if "mapbox" not in u.lower() and "googleapis" not in u.lower():
                              urls.add(sanitize(u[:600]))
                  for p in re.findall(r'["\']((?:/api/|/ocpi/|/v[0-9]+/|/locations?|/stations?|/chargers?|/chargepoints?|/tariffs?|/prices?)[^"\']{0,220})["\']',b,re.I):
                      rel.add(sanitize(p))
                  for m in re.finditer(r'(?i)(ocpi|graphql|fetch\(|axios|location|tariff|charger|station)',b):
                      ctx=b[max(0,m.start()-350):min(len(b),m.end()+700)]
                      if re.search(r'https?://|/api/|/ocpi/|fetch\(|axios|graphql',ctx,re.I):
                          contexts.append({"source":source,"context":sanitize(ctx)})
                          if len(contexts)>=120: break
                  if len(contexts)>=120: break
              item["scripts"]=scripts[:80]
              item["urlCandidates"]=sorted(urls)[:300]
              item["relativePathCandidates"]=sorted(rel)[:300]
              item["contexts"]=contexts[:120]
              out["targets"].append(item)
          Path("reports/uk/connekt-qwello-forward-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/connekt-qwello-forward-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Connekt Qwello Forward public frontends [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
