name: Belib official direct status probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/belib-direct-status-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download official Belib realtime CSV
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.data.gouv.fr/api/1/datasets/r/fde557ec-b96e-49a5-9282-31407296282c' \
            -o /tmp/belib_realtime.csv
          test -s /tmp/belib_realtime.csv
          wc -c /tmp/belib_realtime.csv

      - name: Download current national IRVE static snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.data.gouv.fr/api/1/datasets/r/4ca78c71-4ea4-475d-bd3a-d4aef88f7bf8' \
            -o /tmp/irve.csv
          test -s /tmp/irve.csv

      - name: Audit schema, raw statuses and exact PDC matches
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, re
          from collections import Counter

          def norm(v):
              return re.sub(r'[^A-Z0-9]', '', str(v or '').upper())

          def open_reader(path):
              f=open(path, encoding='utf-8-sig', newline='')
              sample=f.read(32768)
              f.seek(0)
              try:
                  dialect=csv.Sniffer().sniff(sample, delimiters=',;\t|')
                  delim=dialect.delimiter
              except Exception:
                  delim=';'
              reader=csv.DictReader(f, delimiter=delim)
              return f, reader, delim

          canonical={}
          f, reader, delim=open_reader('/tmp/irve.csv')
          with f:
              for row in reader:
                  raw=str(row.get('id_pdc_itinerance') or '').strip()
                  n=norm(raw)
                  if n:
                      canonical[n]=raw

          f, reader, delim=open_reader('/tmp/belib_realtime.csv')
          with f:
              fields=reader.fieldnames or []
              rows=list(reader)
          print('delimiter=', repr(delim))
          print('fields=', json.dumps(fields, ensure_ascii=False))
          print('rowCount=', len(rows))
          if not rows:
              raise SystemExit('empty Belib realtime feed')

          # Prefer schema IRVE dynamic identifiers, otherwise discover the field
          # whose values actually match the current canonical PAN most often.
          pdc_candidates=[c for c in fields if 'pdc' in c.lower() and ('id' in c.lower() or 'itiner' in c.lower())]
          if 'id_pdc_itinerance' in fields:
              pdc_candidates=['id_pdc_itinerance'] + [c for c in pdc_candidates if c!='id_pdc_itinerance']
          scored=[]
          for col in pdc_candidates:
              nonempty=0; matched=0
              for row in rows:
                  n=norm(row.get(col))
                  if not n: continue
                  nonempty += 1
                  matched += int(n in canonical)
              scored.append((matched, nonempty, col))
          scored.sort(reverse=True)
          print('pdcCandidateScores=', json.dumps([
              {'field':c,'matched':m,'nonEmpty':n,'share':round(m/max(1,n),6)}
              for m,n,c in scored
          ], ensure_ascii=False, indent=2))
          if not scored or scored[0][0] == 0:
              raise SystemExit('no Belib PDC field matches current canonical PAN')
          matched, nonempty, pdc_field=scored[0]

          status_candidates=[c for c in fields if any(t in c.lower() for t in ('statut','status','etat'))]
          status_counts={}
          for col in status_candidates:
              counts=Counter(str(r.get(col) or '').strip() or '<empty>' for r in rows)
              status_counts[col]=dict(counts.most_common())
          print('statusCandidates=', json.dumps(status_counts, ensure_ascii=False, indent=2))

          seen=set(); dup=0; exact=0; unmatched=[]; empty=0
          for row in rows:
              raw=str(row.get(pdc_field) or '').strip()
              n=norm(raw)
              if not n:
                  empty += 1; continue
              if n in seen: dup += 1
              seen.add(n)
              if n in canonical:
                  exact += 1
              elif len(unmatched)<20:
                  unmatched.append(raw)

          result={
              'pdcField':pdc_field,
              'rows':len(rows),
              'uniquePdc':len(seen),
              'duplicateRows':dup,
              'emptyPdc':empty,
              'exactCanonicalMatches':exact,
              'unmatchedCount':len(seen)-len({n for n in seen if n in canonical}),
              'exactMatchShare':round(exact/max(1,nonempty),6),
              'unmatchedSample':unmatched,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if len(rows) < 1000:
              raise SystemExit('unexpectedly small Belib realtime feed')
          if exact < 1000:
              raise SystemExit('too few exact Belib PDC matches')
          if exact / max(1, nonempty) < 0.90:
              raise SystemExit('Belib exact canonical match rate below 90%')
          if not status_candidates:
              raise SystemExit('no status-like field found')
          print('RESULT belibOfficialDirectStatusProbe=True')
          PY
