name: Build France Electroverse final residual lab
on:
  push:
    branches:
      - electroverse-final-residual-recovery-lab
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - "data/platforms/electroverse/validated-mappings/final-residual-recovery-plan.json"
      - ".github/workflows/electroverse-final-residual-recovery-lab.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Retry after persisted recovery-plan commit is present on branch.
      # Persisted validation pass after lab overlay commit.
      - name: Build final residual lab overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare lab against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
      - name: Persist lab overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/france-evse
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "lab: publish final residual Electroverse overlay"
            git pull --rebase origin electroverse-final-residual-recovery-lab
            git push
          fi
