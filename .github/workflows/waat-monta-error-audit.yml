name: WAAT Monta national error audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waat-monta-error-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize map errors
        run: |
          python - <<'PY'
          import gzip,json,collections
          p=json.load(gzip.open('data/national/waat_monta_direct_tariffs_france.json.gz','rt',encoding='utf-8'))
          print('HTTP',dict(collections.Counter(str(s.get('mapHttpStatus')) for s in p['stations'])))
          print('ERRORS',dict(collections.Counter(s.get('mapError') for s in p['stations'] if s.get('mapError'))))
          PY
