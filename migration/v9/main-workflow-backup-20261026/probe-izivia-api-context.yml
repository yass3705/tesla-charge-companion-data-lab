name: France IZIVIA API context probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-api-context.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract API contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia /tmp/izc
          curl -fLsS --retry 3 https://fronts-map.izivia.com/assets/index-DFe2TIu0.js -o /tmp/izc/app.js
          python - <<'PY'
          import pathlib,re,json
          s=pathlib.Path('/tmp/izc/app.js').read_text(errors='ignore')
          needles=['baseApiUrl','charging-locations/','chargingLocationPricingInfo','queryParamStationId','stationEmipId','markers','fetchMarkers','x-user-station-group-ids']
          out={}
          for n in needles:
              arr=[]
              start=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  arr.append(s[max(0,i-1200):min(len(s),i+2200)])
                  start=i+len(n)
                  if len(arr)>=12: break
              out[n]=arr
          urls=sorted(set(re.findall(r'https?://[^"\'`\\\s)]+',s)))
          report={'bundleBytes':len(s),'contexts':out,'urls':urls}
          pathlib.Path('reports/france/izivia/api-context-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'bundleBytes':len(s),'urlCount':len(urls),'urls':[u for u in urls if 'izivia' in u.lower() or 'api' in u.lower()][:100]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git pull --rebase origin main || true
            git add reports/france/izivia/api-context-probe.json
            git commit -m 'France IZIVIA: publish API context probe' || true
            git push && exit 0
            sleep $((i*2))
          done
          exit 1
