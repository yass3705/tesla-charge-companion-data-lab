name: IONITY Direct UK station tariffs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/ionity_station_tariffs_uk.py"
      - ".github/workflows/ionity-direct-uk-station-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: ionity-direct-uk-station-tariffs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build UK IONITY Direct map
        run: python scripts/ionity_station_tariffs_uk.py
      - name: Validate UK map
        run: |
          python - <<'PY'
          import gzip,json
          p=json.load(gzip.open('data/national/ionity_direct_stations_uk.json.gz','rt',encoding='utf-8'))
          assert p['operator']=='IONITY' and p['country']=='GB'
          assert p['scope']['requiredCpoIdentifier']=='IONITY_CPO'
          assert p['scope']['currency']=='GBP'
          assert p['counts']['ukLocationCount'] >= 10
          assert p['counts']['ukConnectorCount'] >= p['counts']['ukLocationCount']
          assert p['counts']['ukUnpricedConnectorCount'] == 0
          assert all(x['country']=='GB' and x['cpoIdentifier']=='IONITY_CPO' for x in p['locations'])
          assert all(c['pricePerKwhGbp']>0 for x in p['locations'] for c in x['connectors'])
          print(p['counts'])
          PY
      - name: Publish UK map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/ionity_direct_stations_uk.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(ionity): publish Direct UK station tariffs [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
