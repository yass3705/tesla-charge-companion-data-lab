name: Switzerland second-pass national consolidation

on:
  workflow_run:
    workflows: ["Switzerland partial CPO second pass"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/reconcile_swiss_second_pass_national.py
      - name: Persist consolidation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-second-pass-national-reconciliation-2026-09-28.json
          git commit -m 'docs(switzerland): consolidate second-pass national coverage' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
