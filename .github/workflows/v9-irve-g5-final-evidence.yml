name: V9 G5 final station and tariff evidence
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/irve-g5-final-evidence-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-electroverse-rebuild-exclusive
  cancel-in-progress: false
jobs:
  final-evidence:
    if: github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit tests and public safety
        run: |
          node --test tests/electroverse_g5_external_id.test.mjs
          python -m unittest discover -s tests -p test_irve_g5_final_tariff.py
          python scripts/public_safety_check.py .
      - name: Audit offline tariff evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.audit_irve_g5_final_tariff migration/v9/irve-g5-final-evidence-request.json "$RUNNER_TEMP/g5-final-tariff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-g5-final-tariff-evidence
          path: ${{ runner.temp }}/g5-final-tariff/results/
          if-no-files-found: error
          retention-days: 30
      - name: Collect bounded externalId and address evidence
        env:
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
        run: |
          node scripts/electroverse_g5_external_id.mjs migration/v9/irve-g5-final-evidence-request.json "$RUNNER_TEMP/g5-external-id"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-g5-external-id-evidence
          path: ${{ runner.temp }}/g5-external-id/
          if-no-files-found: error
          retention-days: 30
