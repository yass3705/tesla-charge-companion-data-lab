name: IZIVIA FAST national official tariff capture

on:
  push:
    branches: [feat/izivia-fast-station-tariffs]
    paths:
      - scripts/izivia_fast_capture.py
      - scripts/build_izivia_fast_offers.py
      - .github/workflows/izivia-fast-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact national FAST tariff facts
        run: python3 scripts/izivia_fast_capture.py
      - name: Build exact station and connector direct offers
        run: python3 scripts/build_izivia_fast_offers.py out/izivia-fast-national-capture.json.gz out/izivia-fast-direct-france.json
      - name: Publish immutable capture and coverage report on review branch
        shell: bash
        run: |
          set -euo pipefail
          cp out/izivia-fast-national-capture.json.gz data/operator_direct/izivia_fast_national_capture_2026_10_06.json.gz
          cp out/izivia-fast-national-summary.json reports/france/izivia/izivia-fast-national-summary-2026-10-06.json
          cp out/izivia-fast-direct-france.json data/operator_direct/izivia_fast_direct_france_2026_10_06.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/izivia_fast_national_capture_2026_10_06.json.gz data/operator_direct/izivia_fast_direct_france_2026_10_06.json reports/france/izivia/izivia-fast-national-summary-2026-10-06.json
          git commit -m 'Capture exact IZIVIA FAST station tariffs from official map'
          git pull --rebase origin feat/izivia-fast-station-tariffs
          git push origin HEAD:feat/izivia-fast-station-tariffs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izivia-fast-national-capture
          path: out/izivia-fast-national-*
          retention-days: 7
