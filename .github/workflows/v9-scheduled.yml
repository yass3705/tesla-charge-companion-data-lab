name: V9 scheduled collections
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-verified-schedule
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: FR:ionity_direct_family
            slug: FR_ionity_direct_family
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 00b3ef4228e5c8ce30013f2f8c2527340dd03f86
          persist-credentials: false
      - name: Renew the approved method in temporary storage
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: python3 -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/v9" --workers 1 --attempts 1
      - name: Retain complete collection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-collection-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/v9/manifest.json
            ${{ runner.temp }}/v9/objects
          if-no-files-found: error
          retention-days: 30
