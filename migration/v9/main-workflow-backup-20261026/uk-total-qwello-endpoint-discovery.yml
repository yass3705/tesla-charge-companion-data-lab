name: UK TotalEnergies Qwello endpoint discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-total-qwello-endpoint-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Discover map APIs safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          targets=[
            ("TotalEnergies UK","https://chargingservices.totalenergies.com/en/find-a-charger?countryCode=GB"),
            ("Qwello UK","https://qwello.uk/")
          ]
          def fetch(url):
              q=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,*/*"})
              with urllib.request.urlopen(q,timeout=60) as r:
                  return r.status,r.geturl(),r.read(6_000_000).decode("utf-8","replace")
          def sanitize(s):
              s=str(s)
              s=re.sub(r'(?i)([?&](?:code|key|token|sig|signature|api[-_]?key)=)[^&#\s]+',r'\1[REDACTED]',s)
              s=re.sub(r'(?i)((?:authorization|x-api-key|api[-_ ]?key|token|secret)[^A-Za-z0-9]{0,10})[A-Za-z0-9._~+/-]{16,}',r'\1[REDACTED]',s)
              return s

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":[]}
          for name,url in targets:
              item={"name":name,"url":url,"assets":[],"hosts":[],"paths":[],"contexts":[]}
              try:
                  st,final,html=fetch(url); item.update({"status":st,"finalUrl":final,"htmlBytes":len(html)})
                  srcs=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
                  bodies=[("html",html)]
                  for src in srcs[:70]:
                      try:
                          ast,afinal,body=fetch(src)
                          item["assets"].append({"url":src,"status":ast,"bytes":len(body)})
                          bodies.append((src,body))
                      except Exception as e:item["assets"].append({"url":src,"error":type(e).__name__})
                  hosts=set(); paths=set(); ctx=[]
                  for source,body in bodies:
                      for m in re.finditer(r'https?://([A-Za-z0-9.-]+)',body):
                          h=m.group(1).lower()
                          if not re.search(r'(google|gstatic|youtube|facebook|sentry|fonts|analytics|hubspot|stripe|paypal|webflow|cloudflare|jsdelivr|unpkg)',h):
                              hosts.add(h)
                      for m in re.finditer(r'["\'](/[^"\']{0,220}(?:api|graphql|ocpi|locations?|stations?|chargers?|chargepoints?|tariffs?|prices?)[^"\']{0,220})["\']',body,re.I):
                          paths.add(sanitize(m.group(1))[:500])
                      for needle in ("fetch(","axios","getJSON(","graphql","ocpi","tariff","station","charger","locations","map"):
                          for m in re.finditer(re.escape(needle),body,re.I):
                              c=body[max(0,m.start()-350):min(len(body),m.end()+750)]
                              if re.search(r'(?i)(https?://|api|graphql|ocpi|tariff|station|charger|location)',c):
                                  ctx.append({"source":source,"needle":needle,"context":sanitize(c)})
                              if len(ctx)>=250:break
                          if len(ctx)>=250:break
                      if len(ctx)>=250:break
                  item["hosts"]=sorted(hosts)
                  item["paths"]=sorted(paths)[:300]
                  item["contexts"]=ctx[:250]
              except Exception as e:item["error"]=f"{type(e).__name__}: {e}"
              out["targets"].append(item)
          rendered=sanitize(json.dumps(out,ensure_ascii=False,indent=2))
          Path("reports/uk/total-qwello-endpoint-discovery-latest.json").write_text(rendered+"\n")
          print(rendered[:180000])
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/uk/total-qwello-endpoint-discovery-latest.json
          git commit -m "diag(uk): discover TotalEnergies and Qwello endpoints [run ${GITHUB_RUN_ID}]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
