name: UK Qwello station service probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-qwello-station-service-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract proto and probe Qwello station service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/qwello
          curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/eu.qwello.app?version=latest"             -o /tmp/qwello/app.xapk
          unzip -q /tmp/qwello/app.xapk -d /tmp/qwello/x
          mkdir -p /tmp/qwello/apks
          for apk in /tmp/qwello/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/qwello/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"; unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os,gzip,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          proto_paths=glob.glob("/tmp/qwello/apks/**/stations_service.proto",recursive=True)
          protos=[]
          routes=[]
          for fn in proto_paths:
              txt=Path(fn).read_text(encoding="utf-8",errors="replace")
              protos.append({"file":fn.replace("/tmp/qwello/apks/",""),"text":txt})
              routes += re.findall(r'(?m)\b(?:get|post|put|delete|patch)\s*:\s*"([^"]+)"',txt)

          # choose one GB EVSE from existing tariff view
          evse=None
          pth=Path("data/national/uk_qwello_tariff_view.json.gz")
          if pth.exists():
              with gzip.open(pth,"rt",encoding="utf-8") as g:
                  data=json.load(g)
              rows=data.get("rows") if isinstance(data,dict) else data
              if not isinstance(rows,list):
                  rows=data.get("stations",[]) if isinstance(data,dict) else []
              def walk(x):
                  nonlocal_evse=[None]
              for row in rows:
                  if not isinstance(row,dict): continue
                  ids=row.get("id") or row.get("ids") or row.get("evseIds") or row.get("evse_ids")
                  if isinstance(ids,list):
                      for z in ids:
                          if str(z).upper().startswith("GB"):
                              evse=str(z); break
                  elif ids and str(ids).upper().startswith("GB"):
                      evse=str(ids)
                  if not evse:
                      for k,v in row.items():
                          if "evse" in str(k).lower():
                              if isinstance(v,str) and v.upper().startswith("GB"): evse=v; break
                              if isinstance(v,list):
                                  for z in v:
                                      if str(z).upper().startswith("GB"): evse=str(z); break
                          if evse: break
                  if evse: break

          # fallback from tariff report if dataset shape changes
          if not evse:
              evse="GB*QWE*E"

          candidates=[]
          hosts=[
            "https://api.qwello.eu",
            "https://api.qwello.eu/springspinne/v1",
            "https://services.qwello.eu",
            "https://backend.qwello.eu",
            "https://backend.qwello.eu/api"
          ]
          for route in sorted(set(routes)):
              if "{evse_id}" in route and evse and evse!="GB*QWE*E":
                  path=route.replace("{evse_id}",urllib.parse.quote(evse,safe=""))
                  for h in hosts: candidates.append(h.rstrip("/")+"/"+path.lstrip("/"))

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"evseId":evse,
               "protoFiles":protos,"annotatedRoutes":sorted(set(routes)),"probes":[]}
          for url in candidates:
              item={"url":url}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Qwello/3.9.5 TeslaChargeCompanion/9","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      raw=r.read(2_000_000)
                      item.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw)})
                      try:
                          p=json.loads(raw.decode("utf-8"))
                          item["json"]=True; item["jsonType"]=type(p).__name__
                          if isinstance(p,dict): item["keys"]=list(p)[:100]; item["sample"]=p
                          elif isinstance(p,list): item["count"]=len(p); item["sample"]=p[:3]
                      except Exception:
                          item["json"]=False; item["prefix"]=raw.decode("utf-8","replace")[:1500]
              except urllib.error.HTTPError as e:
                  raw=e.read(100000)
                  item.update({"status":e.code,"error":str(e),"bodyPrefix":raw.decode("utf-8","replace")[:1500]})
              except Exception as e:
                  item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
              out["probes"].append(item)

          Path("reports/uk/qwello-station-service-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"evseId":evse,"routes":out["annotatedRoutes"],"probes":out["probes"],"protoFiles":protos},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/qwello-station-service-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Qwello station service [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
