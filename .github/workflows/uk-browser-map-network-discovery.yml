name: UK browser map network discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-browser-map-network-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture public map network traffic with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          mkdir -p reports/uk /tmp/tcc-uk-browser

          python3 - <<'PY'
          import json, os, re, subprocess, pathlib, time
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          chrome=os.environ.get("CHROME_BIN") or next((p for p in [
              "/usr/bin/google-chrome","/usr/bin/chromium","/usr/bin/chromium-browser"
          ] if os.path.exists(p)), None)
          if not chrome:
              raise SystemExit("Chrome not found")

          targets={
            "TotalEnergies UK":"https://chargingservices.totalenergies.com/en/find-a-charger?countryCode=GB",
            "EZ-Charge":"https://ez-charge.co.uk/drivers/#map",
            "Roam":"https://www.roamcharging.com/for-drivers/charging-map",
          }

          def collect_urls(obj, out):
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      if k=="url" and isinstance(v,str) and v.startswith(("http://","https://")):
                          out.add(v)
                      collect_urls(v,out)
              elif isinstance(obj,list):
                  for v in obj: collect_urls(v,out)

          report={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":{}}
          for name,url in targets.items():
              slug=re.sub(r'[^a-z0-9]+','-',name.lower()).strip('-')
              netlog=f"/tmp/tcc-uk-browser/{slug}-netlog.json"
              dom=f"/tmp/tcc-uk-browser/{slug}-dom.html"
              stderr=f"/tmp/tcc-uk-browser/{slug}-stderr.log"
              cmd=[
                chrome,"--headless=new","--no-sandbox","--disable-gpu","--disable-dev-shm-usage",
                "--disable-extensions","--disable-background-networking",
                "--virtual-time-budget=30000",
                f"--log-net-log={netlog}","--net-log-capture-mode=Everything",
                "--dump-dom",url
              ]
              with open(dom,"wb") as o, open(stderr,"wb") as e:
                  rc=subprocess.run(cmd,stdout=o,stderr=e,timeout=75).returncode
              urls=set()
              if os.path.exists(netlog):
                  try:
                      data=json.load(open(netlog,encoding="utf-8"))
                      collect_urls(data,urls)
                  except Exception as ex:
                      neterr=f"{type(ex).__name__}: {ex}"
                  else: neterr=None
              else: neterr="netlog missing"
              domtxt=pathlib.Path(dom).read_text(errors="replace") if os.path.exists(dom) else ""
              urls.update(re.findall(r'https?://[^"\'<>\\\s]+',domtxt))
              keep=[]
              for u in sorted(urls):
                  ul=u.lower()
                  host=urlparse(u).netloc.lower()
                  if any(x in ul for x in [
                    "api","ocpi","station","location","charger","chargepoint","tariff","price",
                    "map","evse","socket","connector","totalenergies","ez-charge","ezcharge",
                    "roam","worker","azure","blob"
                  ]):
                      # Drop analytics/ad endpoints from persisted evidence.
                      if any(x in host for x in [
                        "google-analytics","googletagmanager","doubleclick","facebook",
                        "hotjar","clarity.ms","segment","sentry"
                      ]):
                        continue
                      keep.append(u[:1000])
              report["targets"][name]={
                "url":url,"chromeReturnCode":rc,"domBytes":len(domtxt),
                "networkUrlCount":len(urls),"candidateUrls":keep[:400],
                "candidateCount":len(keep),"netlogParseError":neterr
              }

          pathlib.Path("reports/uk/browser-map-network-discovery-latest.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({k:{"candidateCount":v["candidateCount"],"sample":v["candidateUrls"][:20]} for k,v in report["targets"].items()},ensure_ascii=False,indent=2))
          PY
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/browser-map-network-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): capture public map network endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
