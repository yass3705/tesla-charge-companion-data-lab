name: Analyze Electroverse France SE1 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_se1_residual.mjs"
      - ".github/workflows/electroverse-se1-residual-analysis.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze SE1 unpublished residual
        run: node scripts/analyze_electroverse_se1_residual.mjs
      - name: Persist validated SE1 mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/validated-mappings/se1-residual.json
          if git diff --cached --quiet; then
            echo "No SE1 mapping changes"
          else
            git commit -m "data: publish validated Electroverse SE1 mappings"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-se1-residual-analysis
          path: reports/electroverse/se1-residual-analysis.json
          retention-days: 14
