name: TEST NON-TESLA — Electroverse sustained batch benchmark
on:
  push:
    paths:
      - tests/non-tesla/active/run-electroverse-sustained-batch.trigger
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
      BATCH_SIZE: '5'
      BENCH_STATIONS: '250'
      BATCH_PAUSE_MS: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/electroverse_batch_sustained_benchmark.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/batch-sustained-benchmark.json
          git commit -m "test(electroverse): record sustained batch benchmark [run ${GITHUB_RUN_ID}]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
