name: Debug Greenspot GSP station
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/debug_greenspot_gsp_station.mjs"
      - ".github/workflows/greenspot-gsp-debug.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/debug_greenspot_gsp_station.mjs
