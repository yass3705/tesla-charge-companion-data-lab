name: Analyze Electroverse France remaining residuals batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_remaining_batch.mjs"
      - ".github/workflows/electroverse-remaining-residual-batch.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze every remaining residual bucket
        run: node scripts/analyze_electroverse_remaining_batch.mjs
      - name: Persist residual analysis and validated mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/remaining-batch-analysis.json data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json
          if git diff --cached --quiet; then
            echo "No mapping changes"
          else
            git commit -m "data: publish remaining validated Electroverse suffix mappings"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-remaining-residual-batch
          path: |
            reports/electroverse/remaining-batch-analysis.json
            data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json
          retention-days: 14
