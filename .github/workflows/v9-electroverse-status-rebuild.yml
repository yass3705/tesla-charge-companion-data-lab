            --phase recovery --partition 15
      - name: Preserve immutable recovery 15 checkpoint
        if: ${{ steps.recovery15.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-electroverse-status-stage-recovery-15
          path: ${{ runner.temp }}/tcc-v9-status-census/stage-delta/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Strict finalization of fully verified statuses only
        if: ${{ steps.mode.outputs.mode == 'collect' }}
        id: status_finish
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/resilient_v9_electroverse_status.py finish \
            --out "$RUNNER_TEMP/tcc-v9-status-census"
      - name: Upload only fully validated national statuses
        if: ${{ steps.status_finish.outputs.collection_state == 'complete' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-electroverse-status-complete
          path: ${{ runner.temp }}/tcc-v9-status-census/complete/
