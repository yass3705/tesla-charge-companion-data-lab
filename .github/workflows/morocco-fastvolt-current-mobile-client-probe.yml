name: Morocco FastVolt current mobile client probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/morocco-fastvolt-current-mobile-client-probe.yml'

permissions:
  contents: write

concurrency:
  group: morocco-fastvolt-current-mobile-client-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download public current FastVolt XAPK temporarily
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fastvolt-xapk
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0' \
            'https://d.apkpure.net/b/XAPK/ma.fastgo?version=latest' \
            -o /tmp/fastvolt.xapk
          test "$(stat -c%s /tmp/fastvolt.xapk)" -lt 120000000
          unzip -q /tmp/fastvolt.xapk -d /tmp/fastvolt-xapk
          find /tmp/fastvolt-xapk -type f -name '*.apk' -print

      - name: Extract APK contents and sanitized public client indicators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, hashlib, zipfile
          from datetime import datetime, timezone
          from urllib.parse import urlsplit

          root='/tmp/fastvolt-xapk'
          extracted='/tmp/fastvolt-apk-extracted'
          out='reports/morocco/fastvolt/latest-current-mobile-client-indicators.json'
          os.makedirs(extracted, exist_ok=True)
          os.makedirs(os.path.dirname(out), exist_ok=True)

          apks=[]
          for dp,_,fs in os.walk(root):
              for f in fs:
                  if f.endswith('.apk'):
                      apks.append(os.path.join(dp,f))
          if not apks:
              raise SystemExit('no APK found in XAPK')

          apk_meta=[]
          scan_files=[]
          for i,p in enumerate(sorted(apks)):
              data=open(p,'rb').read()
              apk_meta.append({'name':os.path.basename(p),'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              d=os.path.join(extracted,str(i))
              os.makedirs(d,exist_ok=True)
              try:
                  with zipfile.ZipFile(p) as z:
                      for n in z.namelist():
                          low=n.lower()
                          if low.endswith(('.so','.json','.xml','.txt','.properties','.yaml','.yml')) or 'flutter_assets' in low:
                              try:
                                  z.extract(n,d)
                              except Exception:
                                  pass
              except zipfile.BadZipFile:
                  pass

          for dp,_,fs in os.walk(extracted):
              for f in fs:
                  p=os.path.join(dp,f)
                  try:
                      if os.path.getsize(p) <= 80_000_000:
                          scan_files.append(p)
                  except OSError:
                      pass

          text_parts=[]
          source_lines=[]
          scanned_meta=[]
          for p in scan_files:
              rel=os.path.relpath(p,extracted)
              scanned_meta.append({'path':rel,'size_bytes':os.path.getsize(p)})
              try:
                  proc=subprocess.run(['strings','-a','-n','5',p],capture_output=True,text=True,errors='ignore',timeout=90)
                  lines=proc.stdout.splitlines()
                  text_parts.append(proc.stdout)
                  for line in lines:
                      source_lines.append((rel,line.strip()))
              except Exception:
                  continue
          text='\n'.join(text_parts)

          secret_terms=('authorization','bearer ','password','secret','refresh_token','access_token','client_secret','api_key','apikey')
          def safe(s):
              low=s.lower()
              return not any(x in low for x in secret_terms)

          url_re=re.compile(r'https?://[^\\s\"\'<>]{4,300}',re.I)
          urls=[]
          for raw in url_re.findall(text):
              raw=raw.rstrip('),.;]}')
              try:
                  u=urlsplit(raw)
              except Exception:
                  continue
              host=(u.hostname or '').lower()
              if not host or '.' not in host:
                  continue
              if re.fullmatch(r'\\d{1,3}(?:\\.\\d{1,3}){3}',host):
                  continue
              if len(host)>100:
                  continue
              path=u.path or '/'
              if len(path)>180:
                  path=path[:180]
              urls.append(f'{u.scheme.lower()}://{host}{path}')

          route_terms=('api','station','charger','chargepoint','connector','evse','status','tariff','price','cost','map','location','availability','socket')
          routes=set()
          domain_re=re.compile(r'(?i)^(?:[a-z0-9-]+\\.)+[a-z]{2,15}$')
          all_domains=set()
          for _,line in source_lines:
              s=line.strip().strip('"\'()[]{}<>,;')
              if not (3 <= len(s) <= 180) or not safe(s):
                  continue
              low=s.lower()
              if re.fullmatch(r'/[A-Za-z0-9_./{}:=?-]+',s) and ('/' in s[1:]) and any(t in low for t in route_terms):
                  routes.add(s.split('?',1)[0])
              if domain_re.fullmatch(s) and not re.fullmatch(r'\\d{1,3}(?:\\.\\d{1,3}){3}',s):
                  all_domains.add(s.lower())

          # Bounded context around the exact current-client station routes. Persist only
          # domain/URL/path-shaped infrastructure strings, never arbitrary neighbouring text.
          targets=(
              '/app/charging_stations/',
              '/user/get_charging_station_details/',
              '/user/v2/estimates/'
          )
          route_context=[]
          for idx,(rel,line) in enumerate(source_lines):
              if line not in targets:
                  continue
              candidates=set()
              lo=max(0,idx-80); hi=min(len(source_lines),idx+81)
              for _,near in source_lines[lo:hi]:
                  s=near.strip().strip('"\'()[]{}<>,;')
                  if not (3 <= len(s) <= 220) or not safe(s):
                      continue
                  if domain_re.fullmatch(s):
                      candidates.add(s.lower())
                      continue
                  if s.startswith(('http://','https://')):
                      try:
                          u=urlsplit(s.rstrip('),.;]}'))
                          if u.hostname and '.' in u.hostname:
                              candidates.add(f'{u.scheme.lower()}://{u.hostname.lower()}{u.path or "/"}')
                      except Exception:
                          pass
                  elif re.fullmatch(r'/[A-Za-z0-9_./{}:=?-]{3,180}',s):
                      if any(t in s.lower() for t in route_terms):
                          candidates.add(s.split('?',1)[0])
              route_context.append({'route':line,'source_file':rel,'nearby_infrastructure_literals':sorted(candidates)[:100]})

          urls=sorted(set(urls))
          relevant=[]
          for u in urls:
              low=u.lower()
              if any(k in low for k in ('fastvolt','fastgo','evplug','api','charge','charger','station','firebase','socket','map','location')):
                  relevant.append(u)
          hosts=sorted({urlsplit(u).hostname for u in relevant if urlsplit(u).hostname})
          domain_indicators=sorted(d for d in all_domains if any(k in d for k in ('fast','volt','evplug','charge','station','api','afri','mobility')))

          flutter_markers=[
              os.path.relpath(p,extracted) for p in scan_files
              if os.path.basename(p) in ('libapp.so','libflutter.so') or 'flutter_assets' in p
          ]

          report={
            'schema_version':3,
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'FastVolt',
            'source':{
              'package':'ma.fastgo','public_catalog':'APKPure',
              'download_shape':'https://d.apkpure.net/b/XAPK/ma.fastgo?version=latest','raw_apk_persisted':False
            },
            'policy':{
              'public_source_only':True,'read_only':True,'no_login':True,'no_credentials':True,
              'no_mutations':True,'raw_binary_not_committed':True,'query_strings_removed':True,
              'obvious_secret_bearing_literals_excluded':True,
              'route_context_only_infrastructure_literals':True
            },
            'apk_files':apk_meta,
            'extracted_scan':{
              'file_count':len(scanned_meta),
              'flutter_markers':flutter_markers[:50],
              'scanned_paths':[x['path'] for x in scanned_meta[:150]]
            },
            'sanitized':{
              'hosts':hosts[:100],
              'relevant_urls':relevant[:200],
              'route_like_literals':sorted(routes)[:300],
              'domain_like_indicators':domain_indicators[:150],
              'route_authority_context':route_context[:20]
            },
            'modeling':{
              'cpo_operator':'FastVolt / Afrimobility','site_brand':None,
              'app_source_access_network':'FastVolt','tariff_channel':'FastVolt direct','status_source':None
            },
            'interpretation':'Static indicators from extracted public client files only. Route-neighbourhood output is restricted to infrastructure-shaped literals. Hosts/routes are clues, not promoted to status/tariff sources until separately validated with bounded anonymous read-only requests.'
          }
          with open(out,'w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          rm -rf /tmp/fastvolt.xapk /tmp/fastvolt-xapk /tmp/fastvolt-apk-extracted

      - name: Publish sanitized report when changed
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/fastvolt/latest-current-mobile-client-indicators.json
          if git diff --cached --quiet; then
            echo 'No sanitized report change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "diag(morocco): publish FastVolt current mobile indicators [run $GITHUB_RUN_ID]"
          git push
