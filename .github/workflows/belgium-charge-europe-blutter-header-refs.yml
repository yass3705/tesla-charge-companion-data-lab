name: Belgium Charge Europe Blutter header refs

on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-charge-europe-blutter-header-refs.txt"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libicu-dev libcapstone-dev
          python -m pip install --quiet pyelftools requests

      - name: Download Charge Europe and extract ARM64 Flutter libs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/charge-europe-refs /tmp/blutter /tmp/blutter-out
          mkdir -p /tmp/charge-europe-refs/xapk /tmp/charge-europe-refs/lib
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0'             -H 'Referer: https://apkpure.net/'             'https://d.apkpure.net/b/XAPK/com.total.europe?version=latest'             -o /tmp/charge-europe-refs/app.xapk
          unzip -q /tmp/charge-europe-refs/app.xapk -d /tmp/charge-europe-refs/xapk
          python - <<'PY'
          import os,zipfile
          root='/tmp/charge-europe-refs/xapk'; out='/tmp/charge-europe-refs/lib'
          pair={}
          for fn in os.listdir(root):
              if not fn.endswith('.apk'): continue
              p=os.path.join(root,fn)
              try:
                  with zipfile.ZipFile(p) as z:
                      for target in ('libapp.so','libflutter.so'):
                          n='lib/arm64-v8a/'+target
                          if n in z.namelist() and target not in pair:
                              open(os.path.join(out,target),'wb').write(z.read(n)); pair[target]=fn
              except Exception: pass
          if len(pair)!=2: raise SystemExit('ARM64 Flutter pair unavailable')
          PY

      - name: Run Blutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
          timeout 720 python3 /tmp/blutter/blutter.py /tmp/charge-europe-refs/lib /tmp/blutter-out >/tmp/blutter.log 2>&1

      - name: Resolve header and route references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/belgium/totalenergies
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          root=Path('/tmp/blutter-out')
          pp=root/'pp.txt'
          pp_lines=pp.read_text(errors='ignore').splitlines()
          markers={
            'apiHeader':'x-apif-apikey',
            'marketplace':'marketplace-evp',
            'baseUrl':'https://prod.apix.alzp.tgscloud.net/evdc-bff-europe/v0.0.1',
            'locations':'/v3/infrastructure/locations',
            'accountHeader':'x-user-account-id',
          }
          offsets={}
          for name,val in markers.items():
              for line in pp_lines:
                  if f'String: "{val}"' in line:
                      m=re.search(r'\[pp\+(0x[0-9a-fA-F]+)\]',line)
                      if m: offsets[name]=m.group(1); break

          refs=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.name=='pp.txt': continue
              try:
                  if p.stat().st_size>80_000_000: continue
                  lines=p.read_text(errors='ignore').splitlines()
              except Exception: continue
              for i,line in enumerate(lines):
                  hits=[name for name,off in offsets.items() if off in line]
                  if not hits: continue
                  lo=max(0,i-35); hi=min(len(lines),i+70)
                  block=[]
                  for j in range(lo,hi):
                      s=lines[j]
                      # redact opaque values while preserving instructions, offsets, header names and route names
                      s=re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]{12,}',r'\1<redacted>',s)
                      s=re.sub(r'(?<![A-Za-z0-9])([A-Za-z0-9_-]{48,})(?![A-Za-z0-9])','<redacted-long>',s)
                      block.append({'line':j+1,'text':s[:1000]})
                  refs.append({'file':str(p.relative_to(root)),'line':i+1,'hits':hits,'context':block})

          # pp neighborhood, with candidate values hashed rather than persisted
          neighborhoods=[]
          for name,off in offsets.items():
              idx=next((i for i,l in enumerate(pp_lines) if f'[pp+{off}]' in l),None)
              if idx is None: continue
              vals=[]
              for j in range(max(0,idx-20),min(len(pp_lines),idx+21)):
                  m=re.search(r'String: "([^"]*)"',pp_lines[j])
                  if not m: continue
                  v=m.group(1)
                  safe=v
                  if len(v)>=16 and v not in markers.values() and not v.startswith('/') and 'http' not in v and not re.fullmatch(r'[A-Za-z0-9_.-]{1,32}',v):
                      safe=f'<redacted len={len(v)} sha256={hashlib.sha256(v.encode()).hexdigest()[:16]}>'
                  vals.append({'line':j+1,'value':safe[:500]})
              neighborhoods.append({'marker':name,'offset':off,'neighbors':vals})

          out={'offsets':offsets,'references':refs[:250],'neighborhoods':neighborhoods,
               'policy':{'credentialValuesPersisted':False,'rawBlutterPersisted':False,'staticAnalysisOnly':True}}
          Path('reports/belgium/totalenergies/charge-europe-blutter-header-refs-2026-09-28.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'offsets':offsets,'referenceCount':len(refs),'files':sorted(set(r['file'] for r in refs))},indent=2))
          PY

      - name: Persist sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/charge-europe-blutter-header-refs-2026-09-28.json
          git commit -m "Resolve Charge Europe API header references" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
