name: Morocco WATT OCPI read-only probe

on:
  workflow_dispatch:
  push:
    branches: [investigation/morocco-watt-ocpi-readonly-20260901]
    paths:
      - '.github/workflows/morocco-watt-ocpi-readonly-probe.yml'
      - 'scripts/morocco_watt_ocpi_public_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe documented public GET surfaces only
        run: python3 scripts/morocco_watt_ocpi_public_probe.py

      - name: Validate sanitized artifact contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/morocco-watt-ocpi-public-probe/summary.json')
          d=json.loads(p.read_text())
          pol=d.get('policy',{})
          assert pol.get('read_only') is True
          assert pol.get('http_methods') == ['GET']
          assert pol.get('credentials_used') is False
          assert pol.get('cookies_used') is False
          assert pol.get('session_or_command_routes_used') is False
          assert pol.get('raw_payloads_committed') is False
          assert d.get('production_decision') == 'diagnostic_only_until_source_contract_and_identity_mapping_are_validated'
          print(json.dumps({
            'locations': d.get('locations_summary',{}).get('record_count'),
            'tariffs': d.get('tariffs_summary',{}).get('record_count'),
            'locations_http': d.get('locations_endpoint',{}).get('http_status'),
            'tariffs_http': d.get('tariffs_endpoint',{}).get('http_status'),
            'live_http': d.get('fastvolt_morocco_mall_live_status_probe',{}).get('http_status')
          }, ensure_ascii=False))
          PY

      - name: Upload sanitized WATT diagnostic summary
        uses: actions/upload-artifact@v4
        with:
          name: morocco-watt-ocpi-readonly-summary
          path: artifacts/morocco-watt-ocpi-public-probe/summary.json
          if-no-files-found: error
          retention-days: 3
