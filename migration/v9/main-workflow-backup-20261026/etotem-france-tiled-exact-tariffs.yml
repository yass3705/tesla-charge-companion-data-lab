name: France e-Totem tiled exact tariffs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/etotem-france-tiled-exact-tariffs.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build resilient tiled exact mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/etotem data/operator_direct
          python - <<'PY'
          import requests,csv,io,json,pathlib,datetime,re,html,math,time,concurrent.futures,threading
          U='https://static.data.gouv.fr/resources/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques-donnees-statiques/20260902-033409/consolidation-etalab-schema-irve-statique-v-2.3.1-20260902.csv'
          rows=list(csv.DictReader(io.StringIO(requests.get(U,timeout=60).text)))
          et=[r for r in rows if 'totem' in str(r.get('nom_operateur','')).lower()]
          def norm(x):return re.sub('[^A-Z0-9]','',str(x or '').upper())
          sts={}
          for r in et:
            try:lat=float(r['consolidated_latitude']);lon=float(r['consolidated_longitude'])
            except:continue
            k=norm(r.get('id_station_itinerance'))
            if k:sts.setdefault(k,{'sid':r.get('id_station_itinerance'),'lat':lat,'lon':lon,'rows':[]})['rows'].append(r)
          # one auth token; low parallelism + retries to avoid e-Totem throttling/timeouts
          a=requests.post('https://www.e-totem.fr/api/ConnexionAnonyme',timeout=20).json()
          def tok(x):
            if isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,str) and ('token' in k.lower() or (v.count('.')==2 and len(v)>60)):return v
              for v in x.values():
                z=tok(v)
                if z:return z
            if isinstance(x,list):
              for v in x:
                z=tok(v)
                if z:return z
          T=tok(a);assert T
          H={'Authorization':'Bearer '+T,'Accept':'application/json','User-Agent':'Mozilla/5.0'};local=threading.local()
          def S():
            if not hasattr(local,'s'):local.s=requests.Session();local.s.headers.update(H)
            return local.s
          # Build only tiles containing PAN stations; ~0.2 x 0.3 degree, with overlap margin.
          tiles={}
          for k,st in sts.items():
            ti=(math.floor(st['lat']/0.2),math.floor(st['lon']/0.3));tiles.setdefault(ti,[]).append(k)
          def fetch_tile(item):
            (yi,xi),ids=item;lat0=yi*.2;lon0=xi*.3
            p={'fLatSudOuest':lat0-.015,'fLongSudOuest':lon0-.02,'fLatNordEst':lat0+.215,'fLongNordEst':lon0+.32,'bUniquementBornesDisponibles':0,'bCompatibleAutocharge':0,'nZoom':18,'bNePasClusteriser':1,'nBornesPrivees':0,'bRecupererBorneLaPlusProche':0}
            err=None
            for attempt in range(4):
              try:
                r=S().get('https://www.e-totem.fr/api/Stations',params=p,timeout=20)
                if r.status_code==200:
                  d=r.json();return {'tile':[yi,xi],'ids':ids,'status':200,'elements':d.get('aElements',[]) if isinstance(d,dict) else []}
                err='status '+str(r.status_code)
              except Exception as e:err=str(e)
              time.sleep(1.5*(attempt+1))
            return {'tile':[yi,xi],'ids':ids,'error':err,'elements':[]}
          tres=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for i,x in enumerate(ex.map(fetch_tile,list(tiles.items())),1):
              tres.append(x)
              if i%25==0:print('tiles',i,'/',len(tiles))
          official={}; tileErrors=[]; clusterCount=0
          for tr in tres:
            if tr.get('error'):tileErrors.append({'tile':tr['tile'],'error':tr['error'],'panIds':tr['ids']})
            for e in tr.get('elements',[]):
              if not isinstance(e,dict):continue
              ids=[e.get('sIdPool')]+[b.get('sEmi3Pool') for b in (e.get('aBornes') or []) if isinstance(b,dict)]
              valid=False
              for x in ids:
                k=norm(x)
                if k:
                  official[k]=e;valid=True
              if not valid:clusterCount+=1
          def clean(v):
            x=html.unescape(str(v or ''));x=re.sub(r'<br\s*/?>','\n',x,flags=re.I);x=re.sub('<[^>]+>',' ',x);x=html.unescape(x);return re.sub(r'\s+',' ',x).strip()
          stations=[];overlay=[]
          for k,st in sts.items():
            e=official.get(k)
            if not e:continue
            th=e.get('sWebTexte') or next((b.get('sWebTexte') or b.get('szWebTexte') or b.get('sWebTextePool') for b in (e.get('aBornes') or []) if isinstance(b,dict) and (b.get('sWebTexte') or b.get('szWebTexte') or b.get('sWebTextePool'))),'')
            tt=clean(th)
            stations.append({'panStationId':st['sid'],'apiPoolId':e.get('sIdPool'),'network':e.get('sNomReseau'),'name':e.get('sLibelle'),'tariffText':tt,'tariffHtml':th})
            for r in st['rows']:overlay.append({'id_station_itinerance':r.get('id_station_itinerance'),'id_pdc_itinerance':r.get('id_pdc_itinerance'),'puissance_nominale':r.get('puissance_nominale'),'api_pool_id':e.get('sIdPool'),'network':e.get('sNomReseau'),'tariff_text':tt,'tariff_html':th,'source':'https://www.e-totem.fr/api/Stations','exactness':'official_exact_station_id'})
          cov={'panRows':len(et),'uniqueStations':len(sts),'tileCount':len(tiles),'tileErrors':len(tileErrors),'clusterLikeElements':clusterCount,'matchedStations':len(stations),'stationsWithTariff':sum(bool(x['tariffText']) for x in stations),'matchedPanRows':len(overlay),'matchedPanRowsWithTariff':sum(bool(x['tariff_text']) for x in overlay),'missingStations':len(sts)-len(stations)}
          out={'schemaVersion':'1.0.0','dataset':'etotem-official-france-tiled','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'operator':'E-Totem','country':'FR','coverage':cov,'tileErrors':tileErrors,'stations':stations,'pdcTariffOverlay':overlay,'notes':['Official e-Totem map API queried by small geographic tiles with retries.','Only exact normalized official station/pool IDs are matched; unmatched entries fail closed.','Official tariff HTML/text is preserved without extrapolation.']}
          pathlib.Path('data/operator_direct/etotem_official_france_tiled.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          small={'generatedAt':out['generatedAt'],'coverage':cov,'sampleStations':stations[:10],'tileErrorSample':tileErrors[:10]}
          pathlib.Path('reports/france/etotem/tiled-exact-tariffs-summary.json').write_text(json.dumps(small,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(small,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/etotem_official_france_tiled.json reports/france/etotem/tiled-exact-tariffs-summary.json
          git commit -m 'data(etotem): publish resilient tiled France tariffs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
