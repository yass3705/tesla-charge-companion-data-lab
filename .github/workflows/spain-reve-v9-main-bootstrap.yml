name: Spain REVE V9 auth diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/spain-reve-v9-main-bootstrap.yml

permissions:
  contents: read

jobs:
  auth-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY }}
      BASE_URL: https://www.mapareve.es/api/external/v1
    steps:
      - name: Test sanitized API key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spain/reve
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, hashlib, datetime
          raw=os.environ.get('REVE_API_KEY','')
          key=raw.strip()
          report={
            'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'secret_present':bool(raw),
            'raw_length':len(raw),
            'trimmed_length':len(key),
            'had_outer_whitespace': raw != key,
          }
          if not key:
            report['result']='missing_secret'
          else:
            url=os.environ['BASE_URL'].rstrip('/') + '/cpos?page=1&limit=1'
            req=urllib.request.Request(url,headers={'x-api-key':key,'Accept':'application/json','User-Agent':'tesla-charge-companion-data-lab/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                body=r.read()
                report.update({'http_status':r.status,'result':'authenticated','response_bytes':len(body)})
                try:
                  data=json.loads(body)
                  report['response_type']=type(data).__name__
                  if isinstance(data,list): report['count']=len(data)
                except Exception:
                  report['response_type']='non-json'
            except urllib.error.HTTPError as e:
              body=e.read()
              report.update({'http_status':e.code,'result':'unauthorized_or_http_error','error_preview':body[:300].decode('utf-8','replace')})
          pathlib.Path('artifacts/spain/reve/auth_diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report.get('result')!='authenticated': raise SystemExit(1)
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spain-reve-v9-auth-diagnostic
          path: artifacts/spain/reve/
          retention-days: 7
