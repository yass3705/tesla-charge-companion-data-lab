name: Hauts-de-France regional coverage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/hdf_regional_coverage.py"
      - "data/operator_direct/passpass_hdf_official.json"
      - "data/operator_direct/useda_dirve02_official_hdf.json"
      - "data/operator_direct/te80_somme_official_hdf.json"
      - ".github/workflows/hdf-regional-coverage.yml"

permissions:
  contents: write

concurrency:
  group: hdf-regional-coverage
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Consolidate current evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/hdf
          python -m py_compile scripts/hdf_regional_coverage.py
          python scripts/hdf_regional_coverage.py --out out/hdf 2> >(tee out/hdf/error.log >&2)
      - name: Validate coverage
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/hdf/hauts_de_france_regional_coverage.json').read_text())
          assert p['region']=='Hauts-de-France'
          assert p['departmentsTotal']==5
          assert p['coverage']['departmentsAccountedFor']==5
          assert p['coverage']['regionalPublicNetworkResearchCoverageComplete'] is True
          assert p['coverage']['singleUniversalRegionalTariff'] is False
          assert p['coverage']['directExactDepartmentFamilies']==2
          assert p['coverage']['passPassStationCategoryDepartments']==3
          assert p['coverage']['allDepartmentsHaveValidatedPricingRules'] is True
          assert p['coverage']['allStationsRankableWithoutStationMetadata'] is False
          assert p['tccDecision']['doNotInventDepartmentDefaults'] is True
          assert p['tccDecision']['roamingSeparate'] is True
          PY
      - name: Publish validated coverage
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/regional_coverage reports/hdf
          cp out/hdf/hauts_de_france_regional_coverage.json data/regional_coverage/hauts_de_france_regional_coverage.json
          cp out/hdf/SUMMARY.md reports/hdf/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regional_coverage/hauts_de_france_regional_coverage.json reports/hdf/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(hdf): publish regional public-network coverage [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/hdf
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/hdf/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without consolidator stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/hdf/latest_diagnostic.json').write_text(json.dumps({'dataset':'hdf-regional-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/hdf
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/hdf/latest_run_status.json').write_text(json.dumps({'dataset':'hdf-regional-run-status','region':'Hauts-de-France','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hdf/latest_run_status.json
          if [ "${JOB_STATUS}" = "success" ] && git ls-files --error-unmatch reports/hdf/latest_diagnostic.json >/dev/null 2>&1; then
            git rm -f reports/hdf/latest_diagnostic.json
          elif [ -f reports/hdf/latest_diagnostic.json ]; then
            git add reports/hdf/latest_diagnostic.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "status(hdf): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
