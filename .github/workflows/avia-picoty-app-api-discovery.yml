name: AVIA Picoty public app API discovery

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_app_discovery.py"
      - ".github/workflows/avia-picoty-app-api-discovery.yml"

permissions:
  contents: write

concurrency:
  group: avia-picoty-app-api-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download public AVIA VOLT Android package
        shell: bash
        run: |
          set -euo pipefail
          url='https://d.apkpure.com/b/APK/fr.picoty.app?version=latest'
          curl --fail --location --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0' "$url" -o /tmp/avia-picoty.apk
          test -s /tmp/avia-picoty.apk
          echo "downloaded bytes: $(wc -c </tmp/avia-picoty.apk)"
          file /tmp/avia-picoty.apk

      - name: Extract public API/config hints only
        run: |
          set -euo pipefail
          python scripts/avia_picoty_app_discovery.py /tmp/avia-picoty.apk

      - name: Validate discovery report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports/avia_picoty_app_api_discovery.json')
          d=json.loads(p.read_text())
          assert isinstance(d.get('hosts'),list)
          assert isinstance(d.get('interestingUrls'),list)
          assert isinstance(d.get('contextHits'),list)
          # We expect the Picoty/Deftpower white-label app to expose at least one
          # infrastructure/config hint. Fail closed if the downloaded package changes.
          assert d['hosts'] or d['interestingUrls'] or d['contextHits'], d
          print(json.dumps({k:d[k] for k in ('hosts','interestingUrls')}, indent=2))
          PY

      - name: Upload discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-public-app-api-discovery
          path: data/reports/avia_picoty_app_api_discovery.json
          retention-days: 14

      - name: Commit discovery report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_app_api_discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discover AVIA Picoty public app API configuration"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
