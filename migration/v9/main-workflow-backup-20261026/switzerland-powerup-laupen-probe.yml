name: Switzerland PowerUp Laupen Monta neighbor probe
on:
  push:
    paths:
      - 'scripts/probe_powerup_laupen_monta.py'
      - '.github/workflows/switzerland-powerup-laupen-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/probe_powerup_laupen_monta.py
      - name: Persist probe
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-powerup-laupen-monta-neighbor-probe-2026-09-28.json
          git commit -m 'docs(switzerland): probe PowerUp Laupen Monta neighbors' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
