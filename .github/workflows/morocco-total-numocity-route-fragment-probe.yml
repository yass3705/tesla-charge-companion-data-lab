name: Morocco TotalEnergies Numocity route fragment probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_total_numocity_route_fragment_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-total-numocity-route-fragment-probe.yml"

permissions:
  contents: write

concurrency:
  group: morocco-total-numocity-route-fragment-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_total_numocity_route_fragment_probe.py
      - name: Run static-only route-fragment probe
        run: python scripts/morocco_total_numocity_route_fragment_probe.py
      - name: Safety-check result
        run: |
          test -s artifacts/morocco-total-numocity-route-fragments/summary.json
          python scripts/public_safety_check.py artifacts/morocco-total-numocity-route-fragments
      - name: Persist sanitized report
        run: |
          mkdir -p reports/morocco/totalenergies
          cp artifacts/morocco-total-numocity-route-fragments/summary.json reports/morocco/totalenergies/latest-route-fragments.json
          python scripts/public_safety_check.py reports/morocco/totalenergies/latest-route-fragments.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/totalenergies/latest-route-fragments.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update Numocity route fragments [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
