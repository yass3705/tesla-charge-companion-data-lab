name: WAAT Monta module endpoint extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/waat-monta-module-endpoints.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Monta hub modules and extract endpoint strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/monta
          base='https://cdn.monta.app/control/hub/assets'
          files=(
            'use-public-tariffs-kFlP_gIp.js'
            'deeplinks-api-DfouvZRW.js'
            'charge-points-api-C25y_gLF.js'
            'price-groups-api-s7tBvtb3.js'
            'charge-point-detail-api-BDg_2hI1.js'
            'sites-search-api-Df3kz9OJ.js'
            'monta-urls-J6q9Peb-.js'
          )
          for f in "${files[@]}"; do
            echo "===== $f ====="
            code=$(curl -L -sS -o "/tmp/monta/$f" -w '%{http_code}' "$base/$f" || true)
            echo "HTTP $code bytes $(wc -c < "/tmp/monta/$f" 2>/dev/null || echo 0)"
            if [[ "$code" == 200 ]]; then
              python - "$f" <<'PY'
import re,sys,pathlib
p=pathlib.Path('/tmp/monta')/sys.argv[1]
s=p.read_text('utf-8','ignore')
patterns=[
 r'https?://[^"\'`\\\s]+',
 r'[/][A-Za-z0-9_.~?=&%{}:$\-]+(?:[/][A-Za-z0-9_.~?=&%{}:$\-]+)+',
]
seen=[]
for pat in patterns:
  for m in re.finditer(pat,s):
    x=m.group(0)
    if any(k in x.lower() for k in ['api','price','tariff','charge','deep','public','site','qr']):
      if x not in seen: seen.append(x)
for x in seen[:250]: print(x)
print('--- contextual hits ---')
for key in ['public tariff','publicTariff','tariff','price','deeplink','deepLink','chargePoint','charge-point','priceGroup','price-group','qr']:
  pos=0
  while True:
    i=s.lower().find(key.lower(),pos)
    if i<0: break
    a=max(0,i-240); b=min(len(s),i+500)
    print(f'[{key}] '+s[a:b].replace('\n',' ')[:760])
    pos=i+len(key)
PY
            fi
          done
