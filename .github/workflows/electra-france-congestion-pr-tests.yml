name: Test Electra FR congestion tariff compilation
on:
  pull_request:
    paths:
      - "scripts/electra_france_platform_snapshot.mjs"
      - "tests/electra-france-congestion-soc80.test.mjs"
      - ".github/workflows/electra-france-congestion-pr-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify eMSP pricing and congestion after 80% SOC
        run: node tests/electra-france-congestion-soc80.test.mjs
