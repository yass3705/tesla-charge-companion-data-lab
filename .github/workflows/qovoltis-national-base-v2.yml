name: Qovoltis national direct tariff base v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qovoltis-national-base-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Qovoltis national base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, re, time, hashlib
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote

          OUT=Path('data/qovoltis'); OUT.mkdir(parents=True,exist_ok=True)
          UA='TeslaChargeCompanion-DataLab/1.0 (+public-read-only)'
          api='https://www.data.gouv.fr/api/1/datasets/irve-statique-organisation-qovoltis/'
          def req(url,timeout=40):
            with urlopen(Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/csv,*/*'}),timeout=timeout) as r:
              return r.read(),getattr(r,'status',200),r.headers.get('content-type','')
          meta=json.loads(req(api)[0].decode('utf-8'))
          resources=[r for r in meta.get('resources',[]) if (r.get('format') or '').lower()=='csv']
          if not resources: raise SystemExit('No CSV in official Qovoltis data.gouv dataset')
          resources.sort(key=lambda r:str(r.get('last_modified') or r.get('latest') or ''),reverse=True)
          rsrc=resources[0]; raw,_,ctype=req(rsrc['url'],90)
          text=raw.decode('utf-8-sig','replace')
          try:dialect=csv.Sniffer().sniff(text[:12000],delimiters=',;\t')
          except Exception:dialect=csv.excel
          rows=list(csv.DictReader(io.StringIO(text),dialect=dialect))
          headers=list(rows[0].keys()) if rows else []
          def first(row,*names):
            d={str(k).strip().lower():v for k,v in row.items() if k is not None}
            for n in names:
              v=d.get(n.lower())
              if v is not None and str(v).strip(): return str(v).strip()
          def station_id(row): return first(row,'id_station_itinerance','id_station','id_station_local')
          def ref_site(s):
            if not s:return None
            x=re.sub(r'[^A-Za-z0-9]','',s).upper()
            if not x.startswith('FRQOV'):return None
            tail=x[5:]
            m=re.fullmatch(r'([A-Z0-9]+)(\d{5})',tail)
            return f'FR*QOV*{m.group(1)}-{m.group(2)}' if m else None

          sites={}; bad=[]
          for row in rows:
            sid=station_id(row); ref=ref_site(sid)
            if not ref:
              bad.append({'id_station':sid,'id_pdc_itinerance':first(row,'id_pdc_itinerance')}); continue
            s=sites.setdefault(ref,{
              'ref_site':ref,'id_station_itinerance':sid,'nom_station':first(row,'nom_station'),
              'adresse_station':first(row,'adresse_station'),'code_insee_commune':first(row,'code_insee_commune'),
              'coordonneesXY':first(row,'coordonneesXY'),'nom_operateur':first(row,'nom_operateur'),
              'nom_enseigne':first(row,'nom_enseigne'),'pdc_irve':[]})
            s['pdc_irve'].append({k:first(row,k) for k in ['id_pdc_itinerance','id_pdc_local','puissance_nominale','prise_type_2','prise_type_combo_ccs','prise_type_chademo','gratuit','tarification','condition_acces','accessibilite_pmr','horaires']})

          BSS='https://bss.qovoltis.com/api/borne/site-details?ref_site='
          def fetch(ref):
            url=BSS+quote(ref,safe='')
            for a in range(3):
              try:
                body,status,_=req(url,25); return ref,status,json.loads(body.decode('utf-8','replace')),None
              except HTTPError as e:
                if e.code in (429,500,502,503,504) and a<2: time.sleep(1+a); continue
                try:err=e.read().decode('utf-8','replace')[:500]
                except Exception:err=repr(e)
                return ref,e.code,None,err
              except Exception as e:
                if a<2:time.sleep(1+a);continue
                return ref,None,None,repr(e)
          fetched={}; failures=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
            fs=[ex.submit(fetch,r) for r in sorted(sites)]
            for f in as_completed(fs):
              ref,status,obj,err=f.result()
              if status==200 and obj is not None:fetched[ref]=obj
              else:failures.append({'ref_site':ref,'status':status,'error':err})

          price_keys={'pricing_syder','pricing_syder_currency','pricing_duration_syder','tarif_heures_creuses','tarif_heures_pleines','rate','time_threshold','begin_free_hour','end_free_hour','price_per_reference_unit','reference_unit'}
          keep=['reference','type_connector','power_max','status']+sorted(price_keys)
          def walk(x,path='$'):
            if isinstance(x,dict):
              yield path,x
              for k,v in x.items():yield from walk(v,path+'.'+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x):yield from walk(v,f'{path}[{i}]')
          out=[]; priced=0; values=[]
          for ref,s in sorted(sites.items()):
            rawsite=fetched.get(ref); tariffs=[]; seen=set()
            if rawsite is not None:
              for path,d in walk(rawsite):
                if not price_keys.intersection(d):continue
                t={'json_path':path}; t.update({k:d.get(k) for k in keep if k in d})
                sig=json.dumps(t,sort_keys=True,default=str)
                if sig in seen:continue
                seen.add(sig);tariffs.append(t)
                if t.get('pricing_syder') not in (None,''):
                  priced+=1
                  try:values.append(float(str(t['pricing_syder']).replace(',','.')))
                  except:pass
            out.append({**s,'tariff_api_ok':rawsite is not None,'tariffs':tariffs,'site_details_raw':rawsite})

          toussus=next((s for s in out if s['ref_site']=='FR*QOV*78-00027'),None)
          tp=[]
          if toussus:
            for t in toussus['tariffs']:
              try:
                if t.get('pricing_syder') not in (None,''):tp.append(float(str(t['pricing_syder']).replace(',','.')))
              except:pass
          now=datetime.now(timezone.utc).isoformat()
          source={'dataset_title':meta.get('title'),'dataset_last_update':meta.get('last_update'),'resource_id':rsrc.get('id'),'resource_title':rsrc.get('title'),'resource_last_modified':rsrc.get('last_modified'),'url':rsrc.get('url'),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'content_type':ctype}
          qa={'generated_at':now,'source':source,'csv_headers':headers,'csv_rows_total':len(rows),'unique_ref_sites':len(sites),'site_details_http_200':len(fetched),'site_details_failures':len(failures),'priced_records':priced,'distinct_pricing_syder':sorted(set(round(v,6) for v in values)),'unconvertible_rows':len(bad),'toussus':{'present':bool(toussus),'pricing_syder_values':sorted(set(tp)),'expected_0_3504_present':any(abs(v-.3504)<1e-9 for v in tp)},'publication_status':'STAGED_DATA_LAB_ONLY_NOT_PUBLISHED_TO_TCC'}
          payload={'schema_version':2,'generated_at':now,'operator':'Qovoltis','country':'FR','tariff_kind':'direct_public_ad_hoc','source_inventory':source,'source_tariff_api':BSS+'<REF_SITE>','publication_status':'STAGED_DATA_LAB_ONLY_NOT_PUBLISHED_TO_TCC','sites':out}
          (OUT/'qovoltis_national.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'unconvertible.json').write_text(json.dumps(bad,ensure_ascii=False,indent=2),encoding='utf-8')
          cols=['ref_site','id_station_itinerance','nom_station','adresse_station','reference','type_connector','power_max','status','pricing_syder','pricing_syder_currency','pricing_duration_syder','tarif_heures_creuses','tarif_heures_pleines','rate','time_threshold','begin_free_hour','end_free_hour','json_path']
          with (OUT/'qovoltis_tariffs.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader()
            for s in out:
              for t in s['tariffs']:
                z={k:t.get(k) for k in cols};z.update({k:s.get(k) for k in ['ref_site','id_station_itinerance','nom_station','adresse_station']});w.writerow(z)
          print(json.dumps(qa,ensure_ascii=False,indent=2))
          if not fetched:raise SystemExit('No public site-details success')
          PY
      - name: Commit staged data-lab base only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/qovoltis
          if ! git diff --cached --quiet; then git commit -m 'data(qovoltis): stage national direct tariff base'; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-national-base-v2
          path: data/qovoltis
          retention-days: 7
