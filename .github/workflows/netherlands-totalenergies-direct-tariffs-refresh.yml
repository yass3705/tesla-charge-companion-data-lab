name: Netherlands TotalEnergies direct PAYG tariff refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Netherlands DOT-NL canonical dataset"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "scripts/integrate_total_nl_chargingservices.py"
      - ".github/workflows/netherlands-totalenergies-direct-tariffs-refresh.yml"

permissions:
  contents: write

concurrency:
  group: netherlands-dotnl-canonical
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official TotalEnergies web API and integrate exact PAYG prices
        run: |
          set -euo pipefail
          python3 scripts/integrate_total_nl_chargingservices.py
          rm -rf data/national/netherlands_dotnl/runtime
          python3 scripts/dotnl_netherlands_runtime.py \
            data/national/netherlands_dotnl/normalized.json.gz \
            data/national/netherlands_dotnl/runtime \
            reports/netherlands_dotnl_runtime.json
          python3 scripts/dotnl_netherlands_access_patch.py \
            data/national/netherlands_dotnl/normalized.json.gz \
            data/national/netherlands_dotnl/runtime \
            reports/netherlands-dotnl-access-report.json

      - name: Validate direct-price guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          d=json.load(gzip.open('data/national/netherlands_dotnl/normalized.json.gz','rt',encoding='utf-8'))
          total=[]
          for s in d.get('stations',[]):
              if s.get('partyId')!='GFX': continue
              for e in s.get('evses',[]):
                  for c in e.get('connectors',[]):
                      for key in c.get('tariffKeys',[]):
                          if str(key).startswith('NL:GFX:TOTAL-PAYG:'):
                              total.append(key)
          assert total, 'TotalEnergies overlay is empty'
          assert all(d['tariffs'][key].get('type')=='AD_HOC_PAYMENT' for key in total)
          print({'totalExactDirectConnectors':len(total),'tariffKeys':len(set(total))})
          PY

      - name: Publish refreshed NL data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/national/netherlands_dotnl/normalized.json.gz \
            data/national/netherlands_dotnl/runtime \
            data/operator_direct/totalenergies_nl_payg_exact_overlay.json \
            reports/netherlands/totalenergies-direct-payg-live-integration-2026-10-04.json \
            reports/netherlands_dotnl_runtime.json \
            reports/netherlands-dotnl-access-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(nl): refresh TotalEnergies direct PAYG tariffs'
          git pull --rebase origin main
          git push origin HEAD:main
