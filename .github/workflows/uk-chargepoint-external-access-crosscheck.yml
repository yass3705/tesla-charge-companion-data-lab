name: UK ChargePoint independent venue access crosscheck
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/uk_chargepoint_external_access_crosscheck_20261011.py
      - reports/uk/chargepoint-official-site-access-evidence-2026-10-11.json
      - .github/workflows/uk-chargepoint-external-access-crosscheck.yml
permissions:
  contents: write
concurrency:
  group: uk-chargepoint-external-site-proof
  cancel-in-progress: false
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crossmatch 100 flagged public PCPR locations with operator official and independent site proofs
        run: python3 scripts/uk_chargepoint_external_access_crosscheck_20261011.py
      - name: Persist evidence matrix without overwriting other Data Lab work
        shell: bash
        run: |
          set -euo pipefail
          cp reports/uk/chargepoint-external-access-crosscheck-2026-10-11.json /tmp/cp-venue-report.json
          cp reports/uk/chargepoint-external-access-crosscheck-2026-10-11.csv /tmp/cp-venue-report.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cp-venue-report.json reports/uk/chargepoint-external-access-crosscheck-2026-10-11.json
            cp /tmp/cp-venue-report.csv reports/uk/chargepoint-external-access-crosscheck-2026-10-11.csv
            git add reports/uk/chargepoint-external-access-crosscheck-2026-10-11.json reports/uk/chargepoint-external-access-crosscheck-2026-10-11.csv
            if git diff --cached --quiet; then
              echo CHARGEPOINT_VENUE_CROSSCHECK_CURRENT
              exit 0
            fi
            git commit -m "reports(uk): ChargePoint venue access evidence crosscheck [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo CHARGEPOINT_VENUE_CROSSCHECK_PUBLISHED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Repeated update contention" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chargepoint-uk-venue-crosscheck-${{ github.run_id }}
          path: |
            reports/uk/chargepoint-external-access-crosscheck-2026-10-11.json
            reports/uk/chargepoint-external-access-crosscheck-2026-10-11.csv
          retention-days: 90
