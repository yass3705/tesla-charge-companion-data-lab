name: IZIVIA Express normalized tariff base v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-normalized-v1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build normalized IZIVIA Express direct tariff base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izivia
          python - <<'PY'
          import csv, json, uuid, urllib.request, urllib.error, urllib.parse, re, concurrent.futures, collections, datetime
          from pathlib import Path

          DATA='https://www.data.gouv.fr/api/1/datasets/r/95f96484-c602-4b2f-996d-702f61b2e8ab'
          BASE='https://fronts-map.izivia.com/api/'
          NET='67ab64d36b14f13fac39a82d'
          DEVICE=str(uuid.uuid4())
          FILTERS={'chargingConnectors':[],'supportsAutocharge':False,'onlyTwentyFourSeven':False,'onlyAvailable':False,'capabilityTypes':[],'marketingNetworkIds':[NET]}
          # Verified by exact name/address/coordinates against the public IZIVIA map.
          ALIASES={
            'FRE04POAZS2811':'281',
            'FRE04POAZS2812':'281',
            'FRE04POAZS292':'299',
            'FRE04POAZS297':'301',
          }

          def call(url,method='GET',body=None):
            headers={'User-Agent':'Mozilla/5.0 TCC-IZIVIA-Express-v1'}
            if url.startswith(BASE):
              headers.update({'Accept':'application/json','Accept-Language':'fr','Content-Type':'application/json','x-device-id':DEVICE})
            data=None if body is None else json.dumps(body,separators=(',',':')).encode()
            req=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read()
            except urllib.error.HTTPError as e:return e.code,e.read()

          def code_from_official(sid):
            m=re.search(r'OAZS(\d+)$',sid or '')
            return m.group(1) if m else ''
          def code_from_legacy(legacy):
            m=re.search(r'OAZS\*(\d+)\*',legacy or '')
            return m.group(1) if m else ''

          st,b=call(DATA)
          if st!=200: raise SystemExit(f'official inventory HTTP {st}')
          text=b.decode('utf-8-sig','replace')
          dialect=csv.Sniffer().sniff(text[:5000],delimiters=',;\t')
          rows=list(csv.DictReader(text.splitlines(),dialect=dialect))
          grouped=collections.defaultdict(list)
          for r in rows:
            sid=(r.get('id_station_itinerance') or '').strip()
            if sid: grouped[sid].append(r)
          if len(grouped)!=155: raise SystemExit(f'expected 155 official stations, got {len(grouped)}')
          if any((r.get('nom_operateur') or '').strip()!='IZIVIA' for r in rows): raise SystemExit('non-IZIVIA operator in official whitelist')

          mst,mb=call(BASE+'map/markers','POST',{'square':{'centerLng':2.2,'centerLat':46.2,'zoom':5},'filters':FILTERS})
          if mst!=200: raise SystemExit(f'markers HTTP {mst}')
          markers=json.loads(mb.decode())
          def get_detail(marker):
            sid=marker.get('id')
            s,b=call(BASE+f'charging-locations/{sid}','POST',{'filters':FILTERS})
            if s!=200:return {'_marker':marker,'_detailStatus':s}
            x=json.loads(b.decode());x['_marker']=marker;x['_detailStatus']=s;return x
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            details=list(ex.map(get_detail,markers))
          by_code={}
          for d in details:
            c=code_from_legacy(d.get('legacyId'))
            if c: by_code[c]=d

          resolved={}
          for official_id in grouped:
            official_code=code_from_official(official_id)
            map_code=ALIASES.get(official_id,official_code)
            d=by_code.get(map_code)
            if not d: raise SystemExit(f'unresolved official station {official_id} -> {map_code}')
            resolved[official_id]=(map_code,d)

          def get_pricing(d):
            params={}
            if d.get('legacyId') is not None: params['legacyId']=d.get('legacyId')
            if d.get('firstStationEmipId'): params['stationEmipId']=d.get('firstStationEmipId')
            qs=urllib.parse.urlencode(params)
            s,b=call(BASE+f"charging-locations/{d['id']}/pricing-info-items"+(('?'+qs) if qs else ''))
            raw=b.decode('utf-8','replace')
            try:data=json.loads(raw)
            except Exception:data=None
            return d['id'],s,data,raw

          unique_details={d['id']:d for _,d in resolved.values()}
          pricing_cache={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for location_id,ps,items,praw in ex.map(get_pricing,unique_details.values()):
              pricing_cache[location_id]=(ps,items,praw)

          # Feature-oriented normalization: exactness is conservative by design.
          def normalize_direct(raw):
            s=' '.join((raw or '').replace('\u00a0',' ').split())
            low=s.lower().replace(',','.')
            features=['energy_kwh'] if '/kwh' in low else []
            reasons=[]
            parsed={'raw':s,'currency':'EUR','features':features}
            prices=[float(x) for x in re.findall(r'(\d+(?:\.\d+)?)\s*€\s*/\s*kwh',low)]
            if prices: parsed['kwhPricesEur']=prices
            linear=[float(x) for x in re.findall(r'(\d+(?:\.\d+)?)\s*€\s*(?:par|/)\s*minute',low)]
            if linear:
              features.append('connected_time_linear');parsed['perMinuteEur']=linear
            if re.search(r'\d+(?:\.\d+)?\s*€\s*/\s*\d+\s*min',low):
              features.append('started_time_block');reasons.append('started_time_block_billing')
              parsed['startedBlocks']=[{'feeEur':float(fee),'minutes':int(mins)} for fee,mins in re.findall(r'(\d+(?:\.\d+)?)\s*€\s*/\s*(\d+)\s*min',low)]
            if 'post-charge' in low or 'post charge' in low:
              features.append('post_charge_fee');reasons.append('post_charge_phase')
            if any(x in low for x in ['après','apres','au-delà','au dela']): features.append('duration_threshold')
            if 'plafond' in low or 'plafonn' in low or 'facturation max' in low:
              features.append('cap');reasons.append('session_or_context_cap')
              caps=[float(x) for x in re.findall(r'(?:max\s*:\s*|plafond(?:\s+de)?\s*|plafonn\w*\s*(?:à|a)\s*)(\d+(?:\.\d+)?)\s*€',low)]
              if caps: parsed['capsEur']=caps
            if any(x in low for x in ['journée','journee','la nuit','de 7h','de 21h','23h','7h-23h','23h-7h']): features.append('time_window')
            if re.search(r'\d+(?:\.\d+)?\s*€\s+le branchement',low): features.append('connection_fee')
            if re.search(r'au del[aà]\s+de\s+\d+(?:\.\d+)?\s*kwh',low):
              features.append('included_energy_threshold');reasons.append('included_energy_threshold')
            if re.search(r'\d+(?:\.\d+)?\s*€\s+apr[eè]s\s+\d+\s*h',low) and re.search(r'puis\s+\d+(?:\.\d+)?\s*€\s*/\s*h',low):
              features.append('stepped_occupancy_fee');reasons.append('stepped_occupancy_fee')
            features=sorted(set(features));reasons=sorted(set(reasons))
            status='exact_current_v8' if not reasons and features in (['energy_kwh'],['connected_time_linear','energy_kwh']) else 'engine_extension_required'
            parsed.update({'features':features,'status':status,'extensionReasons':reasons})
            return parsed

          def direct_items(items): return [x for x in (items or []) if isinstance(x,dict) and x.get('itemType')=='charging_location']

          out=[]
          for official_id,rr in sorted(grouped.items()):
            official_code=code_from_official(official_id)
            map_code,d=resolved[official_id]
            ps,items,praw=pricing_cache[d['id']]
            if ps!=200 or not isinstance(items,list): raise SystemExit(f'pricing failed {official_id}: {ps}')
            raws=[]
            for item in direct_items(items):
              vals=item.get('rawPricingInfos') or item.get('pricingInfos') or []
              raws.extend(str(v) for v in vals if str(v).strip())
            raws=list(dict.fromkeys(raws))
            normalized=[normalize_direct(x) for x in raws]
            first=rr[0]
            powers=sorted({float(r.get('puissance_nominale')) for r in rr if (r.get('puissance_nominale') or '').strip()})
            pdc_ids=[(r.get('id_pdc_itinerance') or '').strip() for r in rr if (r.get('id_pdc_itinerance') or '').strip()]
            out.append({
              'officialStationId':official_id,
              'officialMapAliasCode':map_code if map_code!=official_code else None,
              'mapLocationId':d.get('id'),'mapLegacyId':d.get('legacyId'),
              'name':first.get('nom_station'),'address':first.get('adresse_station'),'coordinatesOfficial':first.get('coordonneesXY'),
              'operator':'IZIVIA','network':'Izivia Express','pdcCount':len(rr),'pdcIds':pdc_ids,'powersKw':powers,
              'mapConnectorStats':d.get('chargingConnectorsStats') or [],
              'directPricePublished':bool(raws),'directRawPricing':raws,'normalizedDirectPricing':normalized,
              'subscriptionPricingItems':[x for x in items if isinstance(x,dict) and x.get('itemType')=='subscription'],
              'otherPricingItems':[x for x in items if isinstance(x,dict) and x.get('itemType') not in ('charging_location','subscription')],
              'pricingSource':'IZIVIA public map API','inventorySource':DATA,
            })

          if len(out)!=155: raise SystemExit(f'expected 155 normalized stations, got {len(out)}')
          direct_available=sum(bool(st['directRawPricing']) for st in out)
          direct_unavailable=155-direct_available
          exact=sum(bool(st['normalizedDirectPricing']) and all(x.get('status')=='exact_current_v8' for x in st['normalizedDirectPricing']) for st in out)
          extension=sum(bool(st['normalizedDirectPricing']) and not all(x.get('status')=='exact_current_v8' for x in st['normalizedDirectPricing']) for st in out)
          raw_counts=collections.Counter();feature_counts=collections.Counter();reason_counts=collections.Counter()
          for station in out:
            for n in station['normalizedDirectPricing']:
              raw_counts[n['raw']]+=1;feature_counts.update(n['features']);reason_counts.update(n['extensionReasons'])
          meta={
            'schemaVersion':1,'operator':'IZIVIA','network':'Izivia Express','country':'FR',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'officialStations':155,'officialPdcRows':len(rows),'resolvedStations':len(out),'aliasMappings':ALIASES,
            'stationsDirectPricePublished':direct_available,'stationsDirectPriceNotPublished':direct_unavailable,
            'distinctDirectRawTariffs':len(raw_counts),'stationsExactCurrentV8':exact,'stationsEngineExtensionRequired':extension,
            'principle':'No roaming; no silent tariff approximation; only charging_location pricing is treated as direct simulation pricing.'
          }
          Path('izivia/izivia_express_station_tariffs_v1.json').write_text(json.dumps({'metadata':meta,'stations':out},ensure_ascii=False,indent=2),encoding='utf-8')
          report={
            'metadata':meta,'directRawTariffCounts':dict(raw_counts.most_common()),'featureCounts':dict(feature_counts.most_common()),
            'extensionReasonCounts':dict(reason_counts.most_common()),
            'directPriceNotPublishedStations':[{'officialStationId':st['officialStationId'],'name':st['name'],'address':st['address'],'subscriptionItems':len(st['subscriptionPricingItems'])} for st in out if not st['directPricePublished']],
            'extensionRequiredStations':[{'officialStationId':st['officialStationId'],'name':st['name'],'address':st['address'],'raw':st['directRawPricing'],'reasons':sorted({r for n in st['normalizedDirectPricing'] for r in n['extensionReasons']})} for st in out if st['normalizedDirectPricing'] and not all(n['status']=='exact_current_v8' for n in st['normalizedDirectPricing'])]
          }
          Path('izivia/izivia_express_normalization_report_v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps(meta,ensure_ascii=False))
          print('DIRECT NOT PUBLISHED')
          for st in report['directPriceNotPublishedStations']: print(st['officialStationId'],st['name'],st['address'],'subscriptionItems=',st['subscriptionItems'])
          print('EXTENSION REASONS',json.dumps(dict(reason_counts.most_common()),ensure_ascii=False))
          print('RAW TARIFFS')
          for raw,count in raw_counts.most_common(): print(count,raw)
          PY

      - name: Validate generated files
        run: |
          python -m json.tool izivia/izivia_express_station_tariffs_v1.json >/dev/null
          python -m json.tool izivia/izivia_express_normalization_report_v1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('izivia/izivia_express_station_tariffs_v1.json'))
          assert len(p['stations'])==155
          assert p['metadata']['resolvedStations']==155
          assert len({x['officialStationId'] for x in p['stations']})==155
          assert p['metadata']['stationsDirectPricePublished']+p['metadata']['stationsDirectPriceNotPublished']==155
          assert p['metadata']['stationsExactCurrentV8']+p['metadata']['stationsEngineExtensionRequired']==p['metadata']['stationsDirectPricePublished']
          print('VALIDATION OK: 155/155 physical stations resolved; direct-price publication state explicit')
          PY

      - name: Commit normalized base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izivia/izivia_express_station_tariffs_v1.json izivia/izivia_express_normalization_report_v1.json
          if git diff --cached --quiet; then
            echo 'No data change.'
          else
            git commit -m 'Build IZIVIA Express normalized direct tariff base v1'
            git push
          fi
