name: Electroverse app proof for four residual EVSEs
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_electroverse_app_exact_residuals_20261011.mjs
      - data/platforms/electroverse/validated-mappings/app-evidence-four-extra-exact-2026-10-11.json
      - .github/workflows/electroverse-extra-exact-app-proof-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/audit_electroverse_app_exact_residuals_20261011.mjs
      - name: Audit screenshot identities, prices, exact national IRVE owner
        run: node scripts/audit_electroverse_app_exact_residuals_20261011.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electroverse-app-four-residual-exact-qa
          path: reports/electroverse/app-extra-exact-evidence-audit-2026-10-11.json
          if-no-files-found: warn
      - name: Commit read-only QA result
        run: |
          set -euo pipefail
          cp reports/electroverse/app-extra-exact-evidence-audit-2026-10-11.json /tmp/app-qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/app-qa.json reports/electroverse/app-extra-exact-evidence-audit-2026-10-11.json
            git add reports/electroverse/app-extra-exact-evidence-audit-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(electroverse): record three exact app source-IRVE checks'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
