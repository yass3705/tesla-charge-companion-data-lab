name: France ChargePoint browser network probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/chargepoint-france-browser-network-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install -q playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Capture anonymous map calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/chargepoint
          python - <<'PY'
          import asyncio,json,pathlib,re
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(locale='fr-FR')
              page=await ctx.new_page()
              calls=[]
              async def resp(r):
                try:
                  req=r.request
                  if req.resource_type not in ('xhr','fetch'): return
                  ct=(r.headers.get('content-type') or '').lower(); body=''
                  try: body=(await r.text())[:150000]
                  except: pass
                  low=body.lower()
                  keep=any(x in low for x in ['station','port','price','pricing','tariff','connector','latitude','longitude'])
                  calls.append({'url':r.url,'status':r.status,'method':req.method,'postData':(req.post_data or '')[:20000],'contentType':ct,'body':body if keep else body[:2500]})
                except: pass
              page.on('response',resp)
              u='https://driver.chargepoint.com/mapCenter/48.8566/2.3522/13?view=list'
              err=None
              try:
                await page.goto(u,wait_until='domcontentloaded',timeout=45000)
                await page.wait_for_timeout(12000)
              except Exception as e: err=str(e)
              body=''
              try: body=(await page.locator('body').inner_text())[:40000]
              except: pass
              out={'url':page.url,'error':err,'body':body,'calls':calls[-250:]}
              await b.close(); return out
          out=asyncio.run(main())
          pathlib.Path('reports/france/chargepoint/browser-network-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          summ=[]
          for x in out['calls']:
            low=x['body'].lower()
            if any(t in low for t in ['price','pricing','tariff','station','port','connector']):
              summ.append({'url':x['url'],'status':x['status'],'method':x['method'],'postData':x['postData'],'body':x['body'][:30000]})
          pathlib.Path('reports/france/chargepoint/browser-network-summary.json').write_text(json.dumps({'pageUrl':out['url'],'body':out['body'],'calls':summ},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'pageUrl':out['url'],'body':out['body'][:10000],'callCount':len(out['calls']),'interesting':[{'url':x['url'],'status':x['status'],'method':x['method']} for x in summ]},ensure_ascii=False)[:40000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/chargepoint/browser-network-*.json
          git commit -m 'France ChargePoint: publish anonymous map network probe' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
