name: Analyze Electroverse France S30 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_s30_residual.mjs"
      - ".github/workflows/electroverse-s30-residual-analysis.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze S30 unpublished residual
        run: node scripts/analyze_electroverse_s30_residual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-s30-residual-analysis
          path: reports/electroverse/s30-residual-analysis.json
          retention-days: 14
