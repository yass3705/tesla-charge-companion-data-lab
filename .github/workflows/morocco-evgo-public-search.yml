name: Morocco EVGO public station search

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_evgo_public_station_search.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-evgo-public-search.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-public-search
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety and syntax
        run: |
          python scripts/public_safety_check.py scripts/morocco_evgo_public_station_search.py
          python -m py_compile scripts/morocco_evgo_public_station_search.py
      - name: Run public read-only station search
        run: python scripts/morocco_evgo_public_station_search.py
      - name: Validate and publish sanitized result
        run: |
          test -s artifacts/morocco-evgo-public-search/summary.json
          python scripts/public_safety_check.py artifacts/morocco-evgo-public-search
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/morocco-evgo-public-search/summary.json').read_text())
          assert p['policy']['read_only'] is True
          assert p['policy']['no_credentials'] is True
          assert p['policy']['raw_response_bodies_persisted'] is False
          PY
          mkdir -p reports/morocco/evgo
          cp artifacts/morocco-evgo-public-search/summary.json reports/morocco/evgo/latest-public-search.json
          python scripts/public_safety_check.py reports/morocco/evgo/latest-public-search.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-public-search.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(morocco): update EVGO public station search [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
