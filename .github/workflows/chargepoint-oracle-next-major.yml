name: France ChargePoint Electra residual crosswalk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chargepoint-oracle-next-major.yml'
      - 'data/platforms/electra/france/residuals.json.gz'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download latest national IRVE consolidation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/chargepoint data/operator_direct
          PAN_URL='https://proxy.transport.data.gouv.fr/resource/qualicharge-irve-statique'
          if ! curl -fL --retry 3 --max-time 300 --output national-irve.csv "$PAN_URL"; then
            echo 'Latest PAN endpoint failed; using the last pinned public consolidation as fallback'
            curl -fL --retry 3 --max-time 300 --output national-irve.csv 'https://static.data.gouv.fr/resources/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques-donnees-statiques/20260902-033409/consolidation-etalab-schema-irve-statique-v-2.3.1-20260902.csv'
          fi
          DYN_URL='https://proxy.transport.data.gouv.fr/resource/qualicharge-irve-dynamique'
          curl -fL --retry 3 --max-time 180 --output national-irve-dynamic.csv "$DYN_URL" || :
          gzip -dc data/platforms/electra/france/residuals.json.gz > electra-residuals.json
          wc -c national-irve.csv national-irve-dynamic.csv electra-residuals.json
      - name: Crosswalk ChargePoint residuals against PAN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,math,re,unicodedata,difflib,pathlib
          from collections import defaultdict,Counter
          from datetime import datetime,timezone
          def val(r,*names):
            for n in names:
              x=r.get(n)
              if x not in (None,''): return str(x).strip()
            return ''
          def norm(s): return re.sub(r'[^A-Z0-9]','',str(s or '').upper())
          def text(s):
            return re.sub(r'[^A-Z0-9 ]',' ',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().upper()).strip()
          def sim(a,b): return difflib.SequenceMatcher(None,text(a),text(b)).ratio()
          def coord(r):
            raw=val(r,'coordonneesXY','coordonnees_xy','coordonnees')
            z=re.findall(r'-?\d+(?:\.\d+)?',raw)
            if len(z)>=2:
              a,b=map(float,z[:2])
              if abs(a)<=10 and 40<=b<=52: return b,a
              if abs(b)<=10 and 40<=a<=52: return a,b
            try:
              return float(val(r,'latitude')),float(val(r,'longitude'))
            except: return None
          def dist(a,b):
            p=math.pi/180; x=(b[1]-a[1])*p*math.cos((a[0]+b[0])*p/2); y=(b[0]-a[0])*p
            return 6371000*math.hypot(x,y)
          residual=json.load(open('electra-residuals.json'))['locations']
          targets=[r for r in residual if str(r.get('cpo') or '').strip()=='ChargePoint']
          national=[]
          for source in ('national-irve.csv','national-irve-dynamic.csv'):
            try:
              with open(source,encoding='utf-8-sig',errors='replace',newline='') as fh:
                for r in csv.DictReader(fh):
                  c=coord(r)
                  national.append((r,c))
            except FileNotFoundError:
              pass
          by_evse=defaultdict(list); by_station=defaultdict(list)
          for r,c in national:
            eid=val(r,'id_pdc_itinerance','id_pdc_itinerance')
            sid=val(r,'id_station_itinerance','id_station_itinerance') or eid
            if eid: by_evse[norm(eid)].append((r,c))
            by_station[sid].append((r,c))
          exact=[]; exact_locations=set(); candidates=[]; ambiguities=[]; nearby=[]
          for e in targets:
            eids=[norm(x.get('evseId')) for x in e.get('evses',[]) if x.get('evseId')]
            hits=[]; seen=set()
            for eid in eids:
              for r,c in by_evse.get(eid,[]):
                key=(val(r,'id_station_itinerance'),val(r,'id_pdc_itinerance'))
                if key not in seen: hits.append((r,c));seen.add(key)
            if hits:
              exact_locations.add(e['electraLocationId'])
              exact.append({'electraLocationId':e['electraLocationId'],'name':e.get('name'),'operator':e.get('operator'),'electraEvseIds':[x.get('evseId') for x in e.get('evses',[])],'nationalEvseIds':[val(r,'id_pdc_itinerance') for r,c in hits],'nationalStationIds':sorted({val(r,'id_station_itinerance') for r,c in hits}),'source':'PAN exact normalized EVSE ID'})
          for e in targets:
            if e['electraLocationId'] in exact_locations: continue
            ec=coord({'latitude':str((e.get('coordinates') or {}).get('latitude','')),'longitude':str((e.get('coordinates') or {}).get('longitude',''))})
            if not ec: continue
            opts=[]
            for sid,rows in by_station.items():
              r,c=rows[0]
              if c is None: continue
              d=dist(ec,c)
              if d>15: continue
              score=sim((e.get('name') or '')+' '+(e.get('address') or ''),val(r,'nom_station','nom_amenageur','nom_enseigne')+' '+val(r,'adresse_station','adresse2_station'))
              if score>=.70: opts.append({'stationId':sid,'distanceMeters':round(d,2),'similarity':round(score,3),'nationalCpo':val(r,'nom_operateur','nom_amenageur'),'nationalName':val(r,'nom_station','nom_amenageur'),'nationalEvseIds':[val(x,'id_pdc_itinerance') for x,_ in rows]})
            unique={x['stationId']:x for x in opts}
            opts=sorted(unique.values(),key=lambda x:(x['distanceMeters'],-x['similarity']))
            if len(opts)==1: candidates.append({'electraLocationId':e['electraLocationId'],'name':e.get('name'),'address':e.get('address'),'city':e.get('city'),'postalCode':e.get('postalCode'),'operator':e.get('operator'),'candidate':opts[0]})
            elif len(opts)>1: ambiguities.append({'electraLocationId':e['electraLocationId'],'name':e.get('name'),'candidates':opts})
            # Keep the nearest <=250 m station as an exploration lead even when it fails the strict gate.
            allnear=[]
            for sid,rows in by_station.items():
              r,c=rows[0]
              if c is None: continue
              d=dist(ec,c)
              if d<=250:
                allnear.append({'stationId':sid,'distanceMeters':round(d,2),'similarity':round(sim((e.get('name') or '')+' '+(e.get('address') or ''),val(r,'nom_station','nom_amenageur','nom_enseigne')+' '+val(r,'adresse_station','adresse2_station')),3),'nationalCpo':val(r,'nom_operateur','nom_amenageur'),'nationalName':val(r,'nom_station','nom_amenageur'),'nationalEvseIds':[val(x,'id_pdc_itinerance') for x,_ in rows]})
            if allnear:
              nearby.append({'electraLocationId':e['electraLocationId'],'name':e.get('name'),'operator':e.get('operator'),'nearest':sorted(allnear,key=lambda x:(x['distanceMeters'],-x['similarity']))[:3]})
          out={'generatedAt':datetime.now(timezone.utc).isoformat(),'source':{'national':'QualiCharge/PAN latest static + dynamic endpoints with pinned static fallback','electraResidualSnapshot':residual and json.load(open('electra-residuals.json')).get('generatedAt'),'matching':'exact normalized EVSE ID first; then single station <=15m and name/address similarity >=0.70; no automatic publication'},'coverage':{'chargePointResidualLocations':len(targets),'exactIdLocations':len(exact),'strictUniqueCandidates':len(candidates),'ambiguous':len(ambiguities),'nearbyLeadLocations':len(nearby),'unresolved':len(targets)-len(exact)-len(candidates)},'exact':exact,'strictCandidates':candidates,'ambiguous':ambiguities,'nearbyLeads':nearby}
          pathlib.Path('data/operator_direct/chargepoint_electra_crosswalk_france.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('reports/france/chargepoint/electra-crosswalk-summary.json').write_text(json.dumps({'source':out['source'],'coverage':out['coverage'],'sampleExact':exact[:10],'sampleCandidates':candidates[:10],'sampleAmbiguous':ambiguities[:5],'sampleNearbyLeads':nearby[:20]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out['coverage'],ensure_ascii=False))
          PY
      - name: Publish report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/chargepoint_electra_crosswalk_france.json reports/france/chargepoint/electra-crosswalk-summary.json
          git commit -m 'France: crosswalk ChargePoint Electra residuals against latest PAN' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
