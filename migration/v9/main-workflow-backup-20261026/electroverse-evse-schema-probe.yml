name: Probe Electroverse EVSE schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_electroverse_evse_schema.mjs"
      - ".github/workflows/electroverse-evse-schema-probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe_electroverse_evse_schema.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-evse-schema-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist Electroverse EVSE schema probe"
            git pull --rebase origin main || true
            git push
          fi
