name: Analyze Electroverse parent-first-ordinal groups
on:
  push:
    branches: [audit/electroverse-parent-first-ordinal-groups]
    paths:
      - "scripts/analyze_electroverse_parent_first_ordinal_groups.mjs"
      - ".github/workflows/electroverse-parent-first-ordinal-groups.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/analyze_electroverse_parent_first_ordinal_groups.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/*-parent-first-ordinal.json
          git commit -m "audit: publish parent-first-ordinal analyses" || exit 0
          git push
