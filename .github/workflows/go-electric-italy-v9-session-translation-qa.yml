name: Go Electric Italy V9 session translation QA

on:
  workflow_dispatch:
  push:
    branches:
      - qa/go-electric-italy-v9-session-translation
    paths:
      - scripts/go_electric_italy_v9_session_translation_qa.py
      - .github/workflows/go-electric-italy-v9-session-translation-qa.yml

permissions:
  contents: read
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated cost-readiness candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/go_electric_cost_readiness
          gh run download 33457245459 \
            --repo "${GITHUB_REPOSITORY}" \
            --name go-electric-italy-v9-cost-readiness \
            --dir artifacts/go_electric_cost_readiness
          find artifacts/go_electric_cost_readiness -maxdepth 4 -type f -print

      - name: Translate exact energy plus session tariffs
        run: |
          CANDIDATE="$(find artifacts/go_electric_cost_readiness -name 'italy_v9_candidate_go_electric_cost_ready_qa.json.gz' -print -quit)"
          test -n "$CANDIDATE"
          python scripts/go_electric_italy_v9_session_translation_qa.py \
            --candidate "$CANDIDATE" \
            --out data/consolidation/italy_v9_candidate_go_electric_session_translation_qa.json.gz \
            --report data/reports/go_electric_italy_v9_session_translation_qa.json

      - name: Validate session translation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/reports/go_electric_italy_v9_session_translation_qa.json').read_text())
          assert p['publicationAllowed'] is False
          assert p['translation']['componentSet'] == 'energy+session'
          assert p['translation']['translatedEvse'] == 127
          assert p['translation']['builderSimulationTests'] == 127
          assert p['after']['rankableGoElectricEvse'] == 943
          assert p['after']['rankableDirectEvse'] == 26569
          assert p['after']['remainingBlockedGoElectric'] == 1271
          assert all(p['gates'].values()), p['gates']
          print(json.dumps(p, indent=2, ensure_ascii=False))
          PY

      - name: Upload session translation QA
        uses: actions/upload-artifact@v4
        with:
          name: go-electric-italy-v9-session-translation-qa
          path: |
            data/consolidation/italy_v9_candidate_go_electric_session_translation_qa.json.gz
            data/reports/go_electric_italy_v9_session_translation_qa.json
          retention-days: 14
