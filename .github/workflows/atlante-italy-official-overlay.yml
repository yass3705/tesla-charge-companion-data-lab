name: Atlante Italy official subscription overlay

on:
  workflow_dispatch:
  push:
    branches:
      - research/atlante-italy-probe
    paths:
      - scripts/atlante_italy_official.py
      - scripts/atlante_italy_pun_overlay.py
      - scripts/atlante_go_chargeleague_italy_overlay.py
      - .github/workflows/atlante-italy-official-overlay.yml

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate current official Atlante Italy offers
        run: python scripts/atlante_italy_official.py
      - name: Download latest normalized PUN Italy
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pun-italy-normalized.yml --branch research/pun-italy-normalized --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/pun
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n pun-italy-normalized -D /tmp/pun
          test -s /tmp/pun/national/pun_italy_national.json.gz
          echo "Using PUN run $RUN_ID"
      - name: Build PUN ATE Atlante Go overlay
        run: python scripts/atlante_italy_pun_overlay.py --pun /tmp/pun/national/pun_italy_national.json.gz
      - name: Build ChargeLeague partner overlay
        run: python scripts/atlante_go_chargeleague_italy_overlay.py --pun /tmp/pun/national/pun_italy_national.json.gz
      - name: Validate candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          own=json.loads(Path('data/reports/atlante_italy_pun_overlay_report.json').read_text())
          partners=json.loads(Path('data/reports/atlante_go_chargeleague_italy_report.json').read_text())
          print(json.dumps({'own':own,'partners':partners},indent=2))
          assert all(own['qualityGates'].values())
          assert own['counts']['evse'] > 1000
          assert own['directPayAsYouGoRankable'] is False
          assert all(partners['qualityGates'].values())
          assert partners['counts']['byPartner']['Electra']['evse'] > 0
          assert partners['counts']['byPartner']['IONITY']['evse'] > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlante-italy-official-overlay
          path: |
            data/reference/atlante_italy_offers.json
            data/national/atlante_go_italy_overlay.json.gz
            data/reports/atlante_italy_pun_overlay_report.json
            data/national/atlante_go_chargeleague_italy_overlay.json.gz
            data/reports/atlante_go_chargeleague_italy_report.json
          retention-days: 14
