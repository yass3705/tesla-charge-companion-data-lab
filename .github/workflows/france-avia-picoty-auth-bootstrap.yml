name: France AVIA Picoty authenticated bootstrap probe
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_authenticated_bootstrap_probe.py"
      - ".github/workflows/france-avia-picoty-auth-bootstrap.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AVIA_APIM_SUBSCRIPTION_KEY: ${{ secrets.AVIA_APIM_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/avia_picoty_authenticated_bootstrap_probe.py
      - run: python3 scripts/avia_picoty_authenticated_bootstrap_probe.py
      - name: Commit sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_authenticated_bootstrap_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(fr): record Picoty authenticated bootstrap probe"
          git pull --rebase origin main
          git push origin HEAD:main
