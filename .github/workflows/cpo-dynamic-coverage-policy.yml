name: CPO dynamic coverage policy

on:
  pull_request:
    paths:
      - docs/CPO_DYNAMIC_COVERAGE_POLICY.md
      - scripts/collect_uk_validated_open_feeds.py
      - scripts/zephyre/compile_zephyre_v9_offers.mjs
      - scripts/finalize_swiss_tcc_v9_production.py
      - tests/test_cpo_dynamic_coverage.py
      - .github/workflows/cpo-dynamic-coverage-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_cpo_dynamic_coverage.py
      - run: python -m py_compile scripts/collect_uk_validated_open_feeds.py scripts/ionity_station_tariffs.py scripts/uk_gridserve_v9_prepare.py scripts/finalize_swiss_tcc_v9_production.py scripts/france/build_france_irve_static_v9.py scripts/bump_tcc_ready_france.py
      - run: node --check scripts/zephyre/compile_zephyre_v9_offers.mjs
      - run: python scripts/public_safety_check.py .
