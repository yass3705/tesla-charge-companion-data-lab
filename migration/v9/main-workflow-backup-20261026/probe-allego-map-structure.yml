name: France Allego map structure probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-allego-map-structure.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract safe map markup and data callsites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/allego reports/france/allego
          curl -fLsS -A 'Mozilla/5.0' https://www.allego.eu/fr/trouvez-nous/ -o /tmp/allego/page.html
          curl -fLsS -A 'Mozilla/5.0' 'https://www.allego.eu/fr/wp-content/themes/allego/assets/js/main.js' -o /tmp/allego/main.js
          python - <<'PY'
          import re,json,pathlib
          html=pathlib.Path('/tmp/allego/page.html').read_text(errors='ignore');js=pathlib.Path('/tmp/allego/main.js').read_text(errors='ignore')
          def safe(s):
              s=re.sub(r'pk\.[A-Za-z0-9._-]{20,}','[REDACTED_MAP_CLIENT_TOKEN]',str(s))
              if re.search(r'(?i)data-api=',s):s=re.sub(r'data-api=["\'][^"\']+["\']','data-api="[REDACTED]"',s)
              return s
          out={'iframes':[safe(x) for x in re.findall(r'<iframe[^>]+>',html,re.I)],'dataAttrs':[],'htmlContexts':[],'jsContexts':[],'urls':[]}
          for m in re.finditer(r'data-[a-z0-9_-]+=["\'][^"\']*["\']',html,re.I):
              x=safe(m.group(0))
              if any(k in x.lower() for k in ('map','station','charger','lat','lng','price','api')):out['dataAttrs'].append(x)
          for u in re.findall(r'https?://[^\s"\'<>`]+|/[A-Za-z0-9_./?=&%-]+',html+'\n'+js):
              if re.search(r'(?i)mapbox|token|api.?key',u):continue
              if re.search(r'(?i)station|charger|charge|price|tarif|ajax|map',u) and u not in out['urls']:out['urls'].append(u[:1600])
          for needle in ('map-container','map-overlay','charger','price-value','single-station'):
              for m in re.finditer(re.escape(needle),html,re.I):
                  s=safe(html[max(0,m.start()-1200):min(len(html),m.end()+2500)])
                  if s not in out['htmlContexts']:out['htmlContexts'].append(s)
          for needle in ('ajax','fetch(','station','charger','price'):
              for m in re.finditer(re.escape(needle),js,re.I):
                  s=safe(js[max(0,m.start()-800):min(len(js),m.end()+1600)])
                  if s not in out['jsContexts']:out['jsContexts'].append(s)
          out={k:(v[:80] if isinstance(v,list) else v) for k,v in out.items()}
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n'
          if re.search(r'pk\.[A-Za-z0-9._-]{20,}',raw):raise SystemExit('redaction failed')
          pathlib.Path('reports/france/allego/map-structure.json').write_text(raw)
          print(json.dumps(out,ensure_ascii=False,indent=2)[:70000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/allego/map-structure.json
          git commit -m 'France Allego: publish safe map structure probe' || exit 0
          git pull --rebase origin main
          git push
