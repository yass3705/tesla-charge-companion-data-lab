name: UK Believ authenticated API test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-believ-auth-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BELIEV_CLIENT_ID: ${{ secrets.BELIEV_CLIENT_ID }}
      BELIEV_CLIENT_SECRET: ${{ secrets.BELIEV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Authenticate and fetch one documented EVSE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,hashlib
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ.get("BELIEV_CLIENT_ID","")
          secret=os.environ.get("BELIEV_CLIENT_SECRET","")
          if not cid or not secret:
              raise SystemExit("Believ credentials missing")

          base="https://api.believ.com"
          token_url=base+"/oauth/token"
          evse_label="A2955"

          form=urllib.parse.urlencode({
              "grant_type":"client_credentials",
              "client_id":cid,
              "client_secret":secret,
          }).encode()

          token_req=urllib.request.Request(
              token_url,
              data=form,
              method="POST",
              headers={
                  "Accept":"application/json",
                  "Content-Type":"application/x-www-form-urlencoded",
                  "User-Agent":"TeslaChargeCompanion/9"
              }
          )

          out={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "credentialsPresent":True,
              "tokenEndpoint":token_url,
              "testLabel":evse_label,
              "auth":{},
              "evse":{}
          }

          try:
              with urllib.request.urlopen(token_req,timeout=30) as r:
                  raw=r.read()
                  out["auth"]["status"]=r.status
                  token_json=json.loads(raw.decode("utf-8"))
          except urllib.error.HTTPError as e:
              raw=e.read()
              out["auth"]["status"]=e.code
              try:
                  j=json.loads(raw.decode("utf-8"))
                  out["auth"]["errorFields"]={k:j.get(k) for k in ("message","error","error_description") if k in j}
              except Exception:
                  out["auth"]["error"]="non_json_error"
              Path("reports/uk/believ-auth-discovery-latest.json").write_text(json.dumps(out,indent=2)+"\n")
              raise SystemExit("Believ authentication failed")

          token=token_json.get("access_token")
          if not token:
              out["auth"]["tokenReceived"]=False
              Path("reports/uk/believ-auth-discovery-latest.json").write_text(json.dumps(out,indent=2)+"\n")
              raise SystemExit("No access_token in Believ response")

          out["auth"].update({
              "tokenReceived":True,
              "tokenFingerprint":hashlib.sha256(token.encode()).hexdigest()[:16],
              "responseKeys":list(token_json.keys())
          })

          evse_req=urllib.request.Request(
              f"{base}/1.0/evses/{evse_label}",
              headers={
                  "Accept":"application/json",
                  "Authorization":"Bearer "+token,
                  "User-Agent":"TeslaChargeCompanion/9"
              }
          )

          try:
              with urllib.request.urlopen(evse_req,timeout=30) as r:
                  raw=r.read()
                  data=json.loads(raw.decode("utf-8"))
                  out["evse"]["status"]=r.status
                  out["evse"]["responseKeys"]=list(data.keys()) if isinstance(data,dict) else []
                  if isinstance(data,dict):
                      out["evse"]["id"]=data.get("id")
                      out["evse"]["evseStatus"]=data.get("status")
                      out["evse"]["location"]=data.get("location")
                      out["evse"]["connectors"]=data.get("connectors")
                      out["evse"]["tariffs"]=data.get("tariffs")
          except urllib.error.HTTPError as e:
              raw=e.read()
              out["evse"]["status"]=e.code
              try:
                  j=json.loads(raw.decode("utf-8"))
                  out["evse"]["errorFields"]={k:j.get(k) for k in ("message","error","detail") if k in j}
              except Exception:
                  out["evse"]["error"]="non_json_error"

          Path("reports/uk/believ-auth-discovery-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps({
              "auth":out["auth"],
              "evse":{
                  "status":out["evse"].get("status"),
                  "id":out["evse"].get("id"),
                  "evseStatus":out["evse"].get("evseStatus"),
                  "location":out["evse"].get("location"),
                  "connectors":out["evse"].get("connectors"),
                  "tariffs":out["evse"].get("tariffs")
              }
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/believ-auth-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): validate Believ authenticated EVSE API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
