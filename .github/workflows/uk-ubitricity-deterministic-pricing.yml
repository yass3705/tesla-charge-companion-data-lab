name: UK ubitricity deterministic pricing from snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-ubitricity-deterministic-pricing.yml"
      - "data/operator_direct/ubitricity_uk_official_payg_2026-10-01.json"
      - "data/operator_direct/ubitricity_uk_direct_access_exact_overlay_2026-10-03.json"
      - "data/national/uk_shell_ev_public_locations.json.gz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-ubitricity-deterministic-pricing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Build deterministic ubitricity pricing overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/uk
          python3 - <<'PY'
          import json,gzip,re,urllib.request,urllib.error
          from pathlib import Path
          from collections import Counter

          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)
          rules=json.loads(Path("data/operator_direct/ubitricity_uk_official_payg_2026-10-01.json").read_text())
          portal_overlay_path=Path("data/operator_direct/ubitricity_uk_direct_access_exact_overlay_2026-10-03.json")
          portal_overlay=json.loads(portal_overlay_path.read_text()) if portal_overlay_path.exists() else {}
          portal_rows={r.get("uid"):r for r in portal_overlay.get("rows",[]) if r.get("canonicalPromotionEligible")}

          def norm(s):
              return re.sub(r"[^a-z0-9 ]+"," ",str(s or "").lower()).strip()

          authority_aliases={}
          for raw in rules["explicitlyAffectedLocalAuthorities"]:
              base=re.sub(r"\s*\([^)]*\)\s*$","",raw).strip()
              authority_aliases[norm(base)]=raw

          # Known spelling variants returned by UK administrative datasets.
          aliases={
              "city of westminster":"Westminster",
              "royal borough of kensington and chelsea":"Kensington and Chelsea",
              "royal borough of kingston upon thames":"Kingston upon Thames",
              "royal borough of windsor and maidenhead":"Windsor and Maidenhead",
              "london borough of hammersmith and fulham":"Hammersmith and Fulham"
          }
          for k,v in aliases.items():
              authority_aliases[norm(k)]=v

          multi_tariff={norm(x) for x in ("Richmond upon Thames","Wandsworth","Greenwich","Tower Hamlets")}
          special_scope={norm("Waltham Forest")}

          ubi=[x for x in inv.get("locations",[]) if str(x.get("operatorName") or "")=="Migration Shell Recharge"]

          # Resolve postcode -> administrative district in bulk using Postcodes.io / ONSPD data.
          postcodes=[]
          for loc in ubi:
              pc=str((loc.get("address") or {}).get("postalCode") or "").strip().upper()
              if pc and pc not in postcodes:
                  postcodes.append(pc)

          postcode_admin={}
          for i in range(0,len(postcodes),100):
              batch=postcodes[i:i+100]
              body=json.dumps({"postcodes":batch}).encode()
              req=urllib.request.Request(
                  "https://api.postcodes.io/postcodes",
                  data=body,method="POST",
                  headers={"Content-Type":"application/json","User-Agent":"TeslaChargeCompanion/9 ubitricity-postcode-map"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.loads(r.read().decode("utf-8"))
              except Exception as e:
                  raise SystemExit(f"postcode lookup failed for batch {i//100}: {e}")
              for item in payload.get("result") or []:
                  query=str(item.get("query") or "").strip().upper()
                  result=item.get("result") or {}
                  postcode_admin[query]={
                      "adminDistrict":result.get("admin_district"),
                      "adminWard":result.get("admin_ward"),
                      "region":result.get("region"),
                      "country":result.get("country")
                  }

          rows=[]
          auth_counts=Counter()
          fail_reasons=Counter()
          priced_evse=0
          priced_connectors=0
          fail_evse=0
          fail_connectors=0

          for loc in ubi:
              addr=loc.get("address") or {}
              pc=str(addr.get("postalCode") or "").strip().upper()
              geo=postcode_admin.get(pc) or {}
              admin=norm(geo.get("adminDistrict"))
              matched_raw=authority_aliases.get(admin)
              evses=loc.get("evses") or []
              connector_count=sum(len(e.get("connectors") or []) for e in evses)

              if matched_raw and admin not in multi_tariff and admin not in special_scope:
                  status="priced_standard_time_bands"
                  authority=matched_raw
                  auth_counts[authority]+=1
                  tariff={
                    "standardTimeBands":rules["standardTimeBands"],
                    "fallbackWhenSmartChargingUnavailable":rules["fallbackWhenSmartChargingUnavailable"],
                    "idleFee":rules["idleFee"],
                    "connectionFeeGbp":rules["connectionFeeGbp"]
                  }
                  reason=None
                  priced_evse+=len(evses)
                  priced_connectors+=connector_count
              else:
                  status="fail_closed"
                  authority=matched_raw
                  tariff=None
                  if not pc:
                      reason="missing_postcode"
                  elif not geo:
                      reason="postcode_lookup_missing"
                  elif admin in multi_tariff:
                      reason="known_multi_tariff_exception"
                  elif admin in special_scope:
                      reason="special_scope_requires_site_proof"
                  elif not matched_raw:
                      reason="local_authority_not_in_official_affected_list"
                  else:
                      reason="unresolved"
                  fail_reasons[reason]+=1
                  fail_evse+=len(evses)
                  fail_connectors+=connector_count

              # Exact first-party portal detail overrides borough inference when
              # the portal exposes the standard four energy time bands. This is
              # station-level CPO PAYG evidence, not Shell/eMSP pricing.
              portal=portal_rows.get(loc.get("uid")) or {}
              pshape=portal.get("tariffShape") or {}
              pvals=pshape.get("pricesGbpPerKwh") or []
              if len(pvals)==4 and all(isinstance(v,(int,float)) for v in pvals):
                  if status=="fail_closed":
                      priced_evse+=len(evses)
                      priced_connectors+=connector_count
                      fail_evse-=len(evses)
                      fail_connectors-=connector_count
                      if reason:
                          fail_reasons[reason]-=1
                          if fail_reasons[reason] <= 0:
                              del fail_reasons[reason]
                  status="priced_portal_exact"
                  tariff={
                    "standardTimeBands":[
                      {"name":"off_peak","start":"00:00","end":"07:00","gbpPerKwh":pvals[0]},
                      {"name":"standard","windows":["07:00-16:00","20:00-24:00"],"gbpPerKwh":pvals[1]},
                      {"name":"peak","start":"16:00","end":"20:00","gbpPerKwh":pvals[2]}
                    ],
                    "fallbackWhenSmartChargingUnavailable":rules["fallbackWhenSmartChargingUnavailable"],
                    "idleFee":rules["idleFee"],
                    "connectionFeeGbp":rules["connectionFeeGbp"]
                  }
                  reason=None

              rows.append({
                "uid":loc.get("uid"),
                "externalId":loc.get("externalId"),
                "operatorId":loc.get("operatorId"),
                "operatorName":loc.get("operatorName"),
                "address":addr,
                "postcodeAdministrativeGeography":geo,
                "evseCount":len(evses),
                "connectorCount":connector_count,
                "matchedLocalAuthority":authority,
                "status":status,
                "tariff":tariff,
                "failClosedReason":reason,
                "portalEvseId":portal.get("evseId"),
                "portalStatus":portal.get("status"),
                "portalTariffId":(portal.get("tariff") or {}).get("id"),
                "portalRetrievedAt":portal_overlay.get("generatedAt") if portal else None
              })

          priced=[r for r in rows if r["status"]!="fail_closed"]
          fail=[r for r in rows if r["status"]=="fail_closed"]
          out={
            "schemaVersion":1,
            "country":"UK",
            "operator":"Shell Recharge ubitricity",
            "sourceInventory":"data/national/uk_shell_ev_public_locations.json.gz",
            "sourceTariffRule":"data/operator_direct/ubitricity_uk_official_payg_2026-10-01.json",
            "sourcePortalOverlay":"data/operator_direct/ubitricity_uk_direct_access_exact_overlay_2026-10-03.json",
            "postcodeResolver":"Postcodes.io / ONS Postcode Directory",
            "locationCount":len(rows),
            "pricedLocationCount":len(priced),
            "failClosedLocationCount":len(fail),
            "coveragePct":round(100*len(priced)/len(rows),2) if rows else 0,
            "pricedEvseCount":priced_evse,
            "pricedConnectorCount":priced_connectors,
            "failClosedEvseCount":fail_evse,
            "failClosedConnectorCount":fail_connectors,
            "pricedByLocalAuthority":dict(sorted(auth_counts.items())),
            "failClosedReasons":dict(fail_reasons),
            "rows":rows
          }
          Path("data/operator_direct/ubitricity_uk_deterministic_pricing.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          report={k:out[k] for k in (
            "locationCount","pricedLocationCount","failClosedLocationCount","coveragePct",
            "pricedEvseCount","pricedConnectorCount","failClosedEvseCount","failClosedConnectorCount",
            "pricedByLocalAuthority","failClosedReasons"
          )}
          Path("reports/uk/ubitricity-deterministic-pricing-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/ubitricity_uk_deterministic_pricing.json reports/uk/ubitricity-deterministic-pricing-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): publish deterministic ubitricity pricing overlay [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
