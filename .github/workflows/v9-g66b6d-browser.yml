name: V9 G6.6b-6d isolated real archive browser components
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/g66b6d-browser-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-electroverse-overlay-offline-audit
  cancel-in-progress: false
jobs:
  runtime:
    if: github.repository == 'yass3705/tesla-charge-companion-data-lab' && github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yass3705/tesla-charge-companion-production
          ref: 864327da54e85c133fddd351e9273a6de1c048d5
          path: production
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yass3705/tesla-charge-companion-production
          ref: e0fa68c28428720166abcc42a27503efa1ec3a30
          path: production-baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pins, runtime tests and safety
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('migration/v9/g66b6d-browser-request.json').read_text())
          assert r['purpose']=='offline_g66b6d_browser_component_recipe'
          assert all(r[k] is False for k in ('supplierCalls','automaticPublication','runtimeActivation'))
          assert subprocess.check_output(['git','-C','production','rev-parse','HEAD'],text=True).strip()==r['productionSha']
          # Retries can place the original audit parent beyond the shallow checkout.
          # Fetch only the immutable public Data Lab commit if it is absent.
          parent=r['dataLabParent']
          assert len(parent)==40 and all(c in '0123456789abcdef' for c in parent)
          if subprocess.run(['git','cat-file','-e',parent+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',parent],check=True)
          assert subprocess.check_output(['git','rev-parse',parent+'^{commit}'],text=True).strip()==parent
          print('Data Lab comparison parent verified:',parent)
          assert not subprocess.check_output(['git','diff','--name-only',r['dataLabParent'],'HEAD','--','scripts/audit_g66b6c_bump_complement.py','scripts/test_g66b6c_bump_complement.cjs','migration/v9/g66b6c-bump-complement-request.json','scripts/audit_g66b6c_multichannel.py','scripts/test_g66b6c_multichannel.cjs','migration/v9/g66b6c-multichannel-request.json','scripts/audit_g66b6b_ranking_transport.py','scripts/test_g66b6b_ranking_transport.cjs','migration/v9/g66b6b-ranking-transport-request.json','scripts/audit_g66b6a_runtime_transport.py','scripts/test_g66b6a_runtime_transport.cjs','migration/v9/g66b6a-runtime-transport-request.json','scripts/g66b5e_dynamic_gate.py','scripts/audit_g66b5e_dynamic_gate.py','migration/v9/g66b5e-dynamic-zero-request.json','scripts/g66b3_quote_gate.py','scripts/g66b5a_planner_gate.py','scripts/g66b5b_clock_gate.py','scripts/replay_g66b5b_clock_candidate.cjs','scripts/audit_g66b5b_clock_planner.py','scripts/audit_g66b5c_clock_review.py','scripts/replay_g66b5c_clock_candidate.cjs','scripts/audit_g66b5d_residual_evidence.py','migration/v9/g66b5d-residual-evidence-request.json','migration/v9/g66b5c-clock-review-request.json','migration/v9/g66b5b-clock-planner-request.json','migration/v9/g6-candidate','v9_rebuild','data'],text=True).strip()
          PY
          python -m py_compile scripts/audit_g66b6d_browser.py
          node --check scripts/test_g66b6d_browser.cjs
          (cd production && node --test tests/v9-archived-emsp-restoration.test.mjs tests/v9-direct-archived-profiles.test.mjs tests/v9-electra-plus-direct.test.mjs tests/v9-g66b6b-ranking-transport.test.mjs tests/v9-global-ranking-pages.test.mjs tests/v9-station-card-lot1.test.mjs tests/v9-g66b6-session-proof.test.mjs tests/v9-g66b5-planner-protocol.test.mjs tests/v9-deterministic-ranking-ties.test.mjs tests/v9-g66b4-dynamic-transport.test.mjs tests/v9-offer-exact-scope.test.mjs tests/v9-congestion-soc80.test.mjs tests/v9-tesla-autonomous-catalogue.test.mjs)
          python -m unittest discover -s tests -p test_g66b3_quote_gate.py
          python -m unittest discover -s tests -p test_g66b5a_planner_gate.py
          python -m unittest discover -s tests -p test_g66b5b_clock_gate.py
          python -m unittest discover -s tests -p test_g66b5d_residual_evidence.py
          python -m unittest discover -s tests -p test_g66b5e_dynamic_gate.py
          python scripts/public_safety_check.py .
      - name: Install pinned browser test dependency (no provider traffic)
        run: |
          npm install --prefix "$RUNNER_TEMP/g66-browser-deps" --no-audit --no-fund --save-exact playwright@1.51.1
          google-chrome --version
      - name: Replay pinned archives and test browser components
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/g66-browser-deps/node_modules
        run: python -m scripts.audit_g66b6d_browser migration/v9/g66b6d-browser-request.json "$RUNNER_TEMP/g66b6d-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-g66b6d-browser
          path: ${{ runner.temp }}/g66b6d-browser/results/
          if-no-files-found: error
          retention-days: 30
