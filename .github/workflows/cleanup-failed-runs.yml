name: One-shot cleanup failed runs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-failed-runs.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=failure&per_page=100" --jq '.workflow_runs[].id')
          count=0
          for id in $ids; do
            if [[ "$id" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id"
            count=$((count + 1))
          done
          printf 'repository=%s\ndeleted_failed_runs=%s\nrun_id=%s\n' "$GITHUB_REPOSITORY" "$count" "$GITHUB_RUN_ID" > .github/cleanup-failed-runs-result.txt

      - name: Publish cleanup result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/cleanup-failed-runs-result.txt
          git commit -m "chore(actions): record failed-run cleanup [skip ci]"
          git push origin HEAD:main
