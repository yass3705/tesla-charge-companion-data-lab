name: NL Agri Go Charge public QR payment route discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_agrigo_qr_discovery_20261011.py
      - .github/workflows/nl-agrigo-qr-discovery.yml
permissions:
  contents: write
concurrency:
  group: nl-agrigo-direct-qr-discovery
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect published exact AGO EVSEs and official QR payment entry
        run: |
          python3 -m py_compile scripts/nl_agrigo_qr_discovery_20261011.py
          python3 scripts/nl_agrigo_qr_discovery_20261011.py
      - name: Persist read-only endpoint finding and EVSE audit
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-agrigo-qr-endpoint-discovery-2026-10-11.json /tmp/nl-agrigo-qr-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-agrigo-qr-report.json reports/netherlands/nl-agrigo-qr-endpoint-discovery-2026-10-11.json
            git add reports/netherlands/nl-agrigo-qr-endpoint-discovery-2026-10-11.json
            if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
            git commit -m "reports(nl): Agri Go public QR endpoint evidence [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then echo NL_AGRIGO_QR_REPORT_PUBLISHED; exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-agrigo-qr-probe-${{ github.run_id }}
          path: reports/netherlands/nl-agrigo-qr-endpoint-discovery-2026-10-11.json
          retention-days: 90
