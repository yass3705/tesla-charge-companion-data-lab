name: Switzerland V9 complete CPO coverage audit
on:
  push:
    paths:
      - 'scripts/audit_switzerland_v9_complete_cpo_coverage.py'
      - '.github/workflows/switzerland-v9-complete-cpo-coverage-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/audit_switzerland_v9_complete_cpo_coverage.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-v9-complete-cpo-coverage-audit-2026-09-28.json
          git commit -m 'docs(switzerland): audit V9 complete CPO coverage' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
