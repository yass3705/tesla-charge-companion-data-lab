name: UK Wenea ownership tariff audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-wenea-ownership-tariff-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Wenea UK ownership and connector power
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import io,json,zipfile,urllib.request,collections
          from pathlib import Path
          from datetime import datetime,timezone
          url='https://wenea.com/apilocation/data.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9'})
          with urllib.request.urlopen(req,timeout=90) as r: zraw=r.read()
          z=zipfile.ZipFile(io.BytesIO(zraw))
          locs=json.loads(z.read('locations.json').decode('utf-8-sig'))
          tariffs=json.loads(z.read('tariffs.json').decode('utf-8-sig'))
          uk=[x for x in locs if isinstance(x,dict) and str(x.get('country') or '').upper() in ('GB','GBR','UNITED KINGDOM')]
          owners=collections.Counter(); operators=collections.Counter(); suboperators=collections.Counter(); refs=collections.Counter(); powers=collections.Counter(); standards=collections.Counter(); samples=[]
          for loc in uk:
              def nm(v): return str((v or {}).get('name') or '<none>') if isinstance(v,dict) else '<none>'
              owners[nm(loc.get('owner'))]+=1; operators[nm(loc.get('operator'))]+=1; suboperators[nm(loc.get('suboperator'))]+=1
              for ev in loc.get('evses') or []:
                  for c in ev.get('connectors') or []:
                      if not isinstance(c,dict): continue
                      for tid in c.get('tariff_ids') or []: refs[str(tid)]+=1
                      if c.get('tariff_id') is not None: refs[str(c.get('tariff_id'))]+=1
                      p=c.get('max_electric_power'); powers[str(p)]+=1
                      standards[str(c.get('standard'))]+=1
                      if len(samples)<20: samples.append({'location':loc.get('name'),'owner':nm(loc.get('owner')),'operator':nm(loc.get('operator')),'power':p,'standard':c.get('standard'),'tariff_ids':c.get('tariff_ids'),'tariff_id':c.get('tariff_id')})
          gbp=[t for t in tariffs if isinstance(t,dict) and str(t.get('currency') or '').upper()=='GBP']
          out={'country':'GB','network':'Wenea','retrievedAt':datetime.now(timezone.utc).isoformat(),'ukLocations':len(uk),'owners':dict(owners),'operators':dict(operators),'suboperators':dict(suboperators),'referencedTariffIds':dict(refs),'connectorPowerValues':dict(powers),'connectorStandards':dict(standards),'gbpTariffs':[{'id':t.get('id'),'elements':t.get('elements'),'last_updated':t.get('last_updated')} for t in gbp],'samples':samples}
          Path('reports/uk/wenea-ownership-tariff-audit-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/wenea-ownership-tariff-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit Wenea ownership and tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
