name: UK JOLT PCPR collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-jolt-pcpr-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-jolt-pcpr-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect JOLT UK PCPR data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json, gzip, urllib.request, urllib.parse, time
          from datetime import datetime, timezone
          from pathlib import Path

          API_KEY="890f53ea-e42c-469d-8e21-efdc6f30d6ba"
          LOC="https://api.joltcharge.com/v1/uk/public/locations?apiKey="+API_KEY
          UA="TeslaChargeCompanion/9 UK-JOLT-PCPR"

          def get(url, retries=5):
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e
                      time.sleep(min(10,2**i))
              raise RuntimeError(f"GET failed {url}: {last}")

          raw=get(LOC)

          def arrays(payload):
              if isinstance(payload,list): return payload
              if isinstance(payload,dict):
                  for k in ("data","locations","items","results"):
                      if isinstance(payload.get(k),list): return payload[k]
              return []

          locations=arrays(raw)

          # recursively discover all tariff identifiers exposed in location objects
          tariff_ids=set()
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      kl=k.lower()
                      if kl in ("tariff_id","tariffid") and v not in (None,""):
                          tariff_ids.add(str(v))
                      elif kl in ("tariff_ids","tariffids") and isinstance(v,list):
                          tariff_ids.update(str(z) for z in v if z not in (None,""))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(locations)

          tariffs=[]
          failures=[]
          for tid in sorted(tariff_ids):
              url="https://api.joltcharge.com/v1/uk/public/tariffs/"+urllib.parse.quote(tid,safe="")+"?apiKey="+API_KEY
              try:
                  p=get(url)
                  if isinstance(p,dict) and isinstance(p.get("data"),dict):
                      p=p["data"]
                  tariffs.append(p)
              except Exception as e:
                  failures.append({"tariffId":tid,"error":str(e)})
              time.sleep(0.15)

          evses=connectors=0
          parties=set()
          statuses={}
          for loc in locations:
              if not isinstance(loc,dict): continue
              if loc.get("party_id"): parties.add(str(loc["party_id"]))
              for evse in loc.get("evses") or []:
                  if not isinstance(evse,dict): continue
                  evses+=1
                  st=str(evse.get("status") or "UNKNOWN")
                  statuses[st]=statuses.get(st,0)+1
                  connectors+=sum(1 for c in (evse.get("connectors") or []) if isinstance(c,dict))

          out={
              "country":"GB",
              "network":"JOLT",
              "source":"official PCPR public API",
              "sourcePage":"https://support.joltcharge.com/hc/en-gb/articles/27955558493207-UK-Public-Charge-Point-Regulations-Open-Data-Request",
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "locations":locations,
              "tariffs":tariffs
          }
          summary={
              "country":"GB","network":"JOLT","retrievedAt":out["retrievedAt"],
              "locations":len(locations),"evses":evses,"connectors":connectors,
              "tariffIdsReferenced":len(tariff_ids),"tariffsRecovered":len(tariffs),
              "tariffFailures":failures,"partyIdsObserved":sorted(parties),
              "evseStatuses":statuses,
              "status":"complete" if locations and not failures and len(tariffs)==len(tariff_ids) else "partial"
          }
          with gzip.open("data/national/uk_jolt_pcpr.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/jolt-pcpr-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not locations:
              raise SystemExit("JOLT returned no locations")
          PY

      - name: Publish JOLT dataset and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_jolt_pcpr.json.gz reports/uk/jolt-pcpr-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect JOLT PCPR [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
