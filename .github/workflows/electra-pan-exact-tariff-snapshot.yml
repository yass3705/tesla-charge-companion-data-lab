name: France Electra PAN exact tariff snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/electra-pan-exact-tariff-snapshot.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Match Electra public map to France PAN and fetch tariffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/electra data/operator_direct /tmp/electra
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/refactor/unified-data-engine-v9/data/v9/france-static/all.json.gz' -o /tmp/electra/all.json.gz
          python - <<'PY'
          import requests,re,json,pathlib,html as htmllib,gzip,math,concurrent.futures,datetime
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          page=s.get('https://stations.go-electra.com/fr',timeout=30).text
          sm=re.search(r'<script[^>]+id=["\']stations-data["\'][^>]*>(.*?)</script>',page,re.I|re.S)
          web=json.loads(htmllib.unescape(sm.group(1))) if sm else []
          if isinstance(web,dict): web=web.get('features',[]) or web.get('stations',[]) or []
          all_public=[]; france_public=[]
          for x in web:
            if not isinstance(x,dict): continue
            p=x.get('properties',x); geom=x.get('geometry') if isinstance(x.get('geometry'),dict) else None
            co=geom.get('coordinates') if geom else None
            lat=p.get('lat') or p.get('latitude'); lon=p.get('lng') or p.get('lon') or p.get('longitude')
            if isinstance(co,list) and len(co)>=2: lon,lat=co[0],co[1]
            try: lat=float(lat); lon=float(lon)
            except: continue
            sid=p.get('id') or x.get('id')
            if not sid: continue
            ws={'id':str(sid),'name':p.get('name'),'lat':lat,'lon':lon,'country':p.get('country'),'city':p.get('city'),'postalCode':p.get('postalCode')}
            all_public.append(ws)
            if str(p.get('country','')).upper()=='FR': france_public.append(ws)
          # V9 compact station schema: [stationId,name,address,lat,lon,operator,pdcCount,hoursOr0,powerGroups,date,sourceName]
          rows=json.loads(gzip.open('/tmp/electra/all.json.gz','rt',encoding='utf-8').read())
          pan=[]
          for r in rows:
            if not isinstance(r,list) or len(r)<6: continue
            if str(r[5]).strip().lower()!='electra': continue
            try: lat=float(r[3]); lon=float(r[4])
            except: continue
            pan.append({'stationId':r[0],'name':r[1],'lat':lat,'lon':lon,'pdcCount':r[6] if len(r)>6 else None})
          def hav(a,b,c,d):
            R=6371000; p1=math.radians(a); p2=math.radians(c); dp=math.radians(c-a); dl=math.radians(d-b)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          # Match PAN to official FR public map; duplicates at same site can collapse to one official location.
          matched={}; pan_matches=[]; unmatched_pan=[]
          for pr in pan:
            best=None; bd=1e99
            for ws in france_public:
              if abs(ws['lat']-pr['lat'])>.02 or abs(ws['lon']-pr['lon'])>.03: continue
              d=hav(pr['lat'],pr['lon'],ws['lat'],ws['lon'])
              if d<bd: bd=d; best=ws
            if best and bd<=750:
              matched[best['id']]=best; pan_matches.append({'panStationId':pr['stationId'],'publicId':best['id'],'distanceM':round(bd,1)})
            else: unmatched_pan.append(pr)
          # Include every official Electra FR map station; PAN match is a coverage cross-check, not a prerequisite.
          gql='''query LocationLiveData($locationId: ID!) { location(id: $locationId) { id evses { id status connectors { id } } chargeTariffs { chargeTariffId currency currentPricePerKwh elements { restrictions { dayOfWeek startTime endTime } priceComponents { type price } } } } }'''
          endpoint='https://emsp.go-electra.com/graphql'
          def fetch_one(ws):
            try:
              rr=requests.post(endpoint,headers={'content-type':'application/json','User-Agent':'Mozilla/5.0'},json={'query':gql,'variables':{'locationId':ws['id']}},timeout=25)
              j=rr.json() if rr.ok else None; loc=(j or {}).get('data',{}).get('location') if isinstance(j,dict) else None
              return {'station':ws,'status':rr.status_code,'location':loc,'errors':(j or {}).get('errors') if isinstance(j,dict) else None}
            except Exception as e:return {'station':ws,'error':str(e)}
          stations=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
            for r in ex.map(fetch_one,france_public): stations.append(r)
          ok=[x for x in stations if x.get('location')]
          priced=[x for x in ok if (x.get('location') or {}).get('chargeTariffs')]
          out={'schemaVersion':'1.1.0','dataset':'electra-exact-france-public','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'country':'FR','operator':'Electra','sources':{'officialPublicMap':'https://stations.go-electra.com/fr','publicGraphql':endpoint,'panV9':'tesla-charge-companion-stable/refactor/unified-data-engine-v9/data/v9/france-static/all.json.gz'},'coverage':{'panElectraStations':len(pan),'publicMapStationsEurope':len(all_public),'officialPublicMapStationsFR':len(france_public),'panRowsMatchedToOfficialMap':len(pan_matches),'uniqueOfficialStationsMatchedFromPAN':len(matched),'unmatchedPanRows':len(unmatched_pan),'graphqlOk':len(ok),'stationsWithChargeTariffs':len(priced)},'panMatches':pan_matches,'unmatchedPanRows':unmatched_pan,'stations':stations}
          pathlib.Path('reports/france/electra/pan-exact-tariff-snapshot.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          # Official map is authoritative for Electra-direct station scope. Publish fail-closed only when almost every official FR station answers GraphQL.
          if len(france_public)>=350 and len(ok)>=int(.98*len(france_public)) and len(priced)>=int(.95*len(france_public)):
            pathlib.Path('data/operator_direct/electra_exact_france.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'coverage':out['coverage'],'samplePriced':[{'station':x['station'],'tariffs':x['location'].get('chargeTariffs')} for x in priced[:8]],'unmatchedPanSample':unmatched_pan[:8]},ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/electra/pan-exact-tariff-snapshot.json
          if [ -f data/operator_direct/electra_exact_france.json ]; then git add data/operator_direct/electra_exact_france.json; fi
          git commit -m 'France Electra: publish PAN-matched exact public tariffs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
