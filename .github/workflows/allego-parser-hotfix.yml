name: Allego parser hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/allego-parser-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relax Allego visible pricing labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/allego_official.py')
          s = p.read_text(encoding='utf-8')
          old = '''    patterns = {
              "ultraFast": r"(?:chargement ultra-rapide|ultra-fast charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
              "fast": r"(?:chargement rapide|fast charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
              "regular": r"(?:chargement regulier|regular charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
          }
          '''
          # Match the exact block regardless of indentation captured above.
          old = '''    patterns = {
              "ultraFast": r"(?:chargement ultra-rapide|ultra-fast charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
              "fast": r"(?:chargement rapide|fast charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
              "regular": r"(?:chargement regulier|regular charging)\\s+€?\\s*(\\d+(?:[.,]\\d+)?)\\s*€?\\s*/\\s*kwh",
          }
'''.replace('              ', '        ')
          new = '''    patterns = {
        "ultraFast": r"(?:(?:charg(?:ement|e)|recharge)\\s+)?(?:ultra(?:-|\\s)?rapide|ultra(?:-|\\s)?fast(?:\\s+charging)?).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
        "fast": r"(?:(?:charg(?:ement|e)|recharge)\\s+rapide|(?<!ultra-)fast\\s+charging).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
        "regular": r"(?:(?:charg(?:ement|e)|recharge)\\s+(?:regulier|normal(?:e)?)|regular\\s+charging).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
    }
'''
          if old not in s:
              raise SystemExit('Expected Allego pricing pattern block not found; refusing broad edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/allego_official.py

      - name: Commit Allego parser fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/allego_official.py
          git commit -m "fix(allego): accept current France pricing label variants"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
