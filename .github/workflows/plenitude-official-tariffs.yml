name: Plenitude official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/plenitude_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/plenitude-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: plenitude-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract official Plenitude France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/plenitude
          python -m py_compile scripts/plenitude_official.py
          python scripts/plenitude_official.py --out out/plenitude 2> >(tee out/plenitude/error.log >&2)
          cat out/plenitude/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/plenitude
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/plenitude/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/plenitude/latest_diagnostic.json').write_text(json.dumps({'dataset':'plenitude-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/plenitude/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(plenitude): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate Plenitude classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/plenitude/plenitude_official_france.json').read_text())
          assert p['classification']['consumerDirectTariffPublishedForFranceByPowerClass'] is True
          direct=p['operatorDirect']['payPerUseFranceOwnedNetwork']
          assert direct['quickAcUpTo22KwEurPerKwh'] == 0.45
          assert direct['fastDcUpTo75KwEurPerKwh'] == 0.55
          assert direct['fastPlusUltraFastDcFrom75KwEurPerKwh'] == 0.55
          assert p['roaming']['operatorDirect'] is False
          assert p['roaming']['exactPartnerTariffLookupRequired'] is True
          fee=p['fees']['blockingFee']
          assert fee['graceMinutesAfterEndOfCharge'] == 60
          assert fee['quickAcUpTo22Kw']['eurPerMin'] == 0.12
          assert fee['fastDcUpTo75Kw']['eurPerMin'] == 0.20
          assert fee['fastPlusUltraFastDcOver75Kw']['eurPerMin'] == 0.30
          promo=p['temporaryPromotions']['AUGUST26']
          assert promo['discountPercent'] == 40.0 and promo['maxChargingSessions'] == 3
          assert promo['defaultTariff'] is False
          assert p['b2bInteroperability']['consumerTariff'] is False
          print('Validated Plenitude France owned-network tariff, roaming separation and blocking fees')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/plenitude/plenitude_official_france.json')
          dst=Path('data/operator_direct/plenitude_official_france.json')
          rep=Path('reports/plenitude/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'temporaryPromotions':d.get('temporaryPromotions'),
                  'b2bInteroperability':d.get('b2bInteroperability'),
                  'network':d.get('network'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/plenitude/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Plenitude rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/plenitude_official_france.json reports/plenitude/latest_summary.md
          git commit -m "data(plenitude): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
