name: Operator batch controller

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Operator batch item
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "config/operator_batch.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: operator-batch-controller
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Resolve state transition
        id: state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTROLLER_RUN_ID: ${{ github.run_id }}
          PREVIOUS_RUN_ID: ${{ github.event.workflow_run.id }}
          PREVIOUS_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PREVIOUS_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          args=(
            --config config/operator_batch.json
            --state reports/batch/runtime_state.json
            --controller-run-id "$CONTROLLER_RUN_ID"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            args+=(
              --event workflow_run
              --previous-run-id "${PREVIOUS_RUN_ID:-0}"
              --previous-conclusion "${PREVIOUS_CONCLUSION:-unknown}"
              --previous-title "${PREVIOUS_TITLE:-}"
            )
          else
            args+=(--event launch)
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              args+=(--restart)
            fi
          fi
          python scripts/operator_batch_controller.py "${args[@]}" | tee controller-decision.json
          {
            echo "## Operator batch controller"
            echo
            echo '```json'
            cat controller-decision.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state before dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/batch
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('reports/batch/runtime_state.json').read_text())
          telemetry={
              'dataset':'operator-batch-controller-state',
              'batchId':state.get('batchId'),
              'controllerRunId':state.get('lastControllerRunId'),
              'inFlight':state.get('inFlight'),
              'halted':state.get('halted',False),
              'failedOperator':state.get('failedOperator'),
              'done':state.get('done',False),
              'lastEvent':state.get('lastEvent'),
              'lastDecision':state.get('lastDecision'),
              'dispatchStatus':state.get('dispatchStatus'),
          }
          Path('reports/batch/latest_controller_state.json').write_text(json.dumps(telemetry,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/batch/runtime_state.json reports/batch/latest_controller_state.json
          if ! git diff --cached --quiet; then
            git commit -m "state(batch): persist controller decision [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [[ "$attempt" == "3" ]]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Dispatch next operator immediately
        id: dispatch
        if: steps.state.outputs.should_dispatch == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OPERATOR: ${{ steps.state.outputs.next }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"operator":os.environ["NEXT_OPERATOR"]}}))
          PY
          )
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/operator-batch-item.yml/dispatches" \
            -d "$payload")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" != "204" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('reports/batch/runtime_state.json')
          s=json.loads(p.read_text())
          if s.get('inFlight') == os.environ['NEXT_OPERATOR']:
              s['inFlight']=None
          s['halted']=True
          s['failedOperator']=os.environ['NEXT_OPERATOR']
          s['failureReason']=f"workflow_dispatch_http_{os.environ.get('code_for_python','unknown')}"
          s['dispatchStatus']='failed'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          PY
            echo "Workflow dispatch failed with HTTP $code"
            cat response.txt
            exit 1
          fi
          echo "Dispatched operator: ${NEXT_OPERATOR}"
          echo "Next operator dispatched: **${NEXT_OPERATOR}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful dispatch
        if: steps.dispatch.outcome == 'success'
        env:
          NEXT_OPERATOR: ${{ steps.state.outputs.next }}
          DISPATCH_HTTP: ${{ steps.dispatch.outputs.http_code }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('reports/batch/runtime_state.json')
          s=json.loads(p.read_text())
          if s.get('inFlight') == os.environ.get('NEXT_OPERATOR'):
              s['dispatchStatus']='accepted'
              s['dispatchHttpCode']=os.environ.get('DISPATCH_HTTP')
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          telemetry={
              'dataset':'operator-batch-controller-state',
              'batchId':s.get('batchId'),
              'controllerRunId':s.get('lastControllerRunId'),
              'inFlight':s.get('inFlight'),
              'halted':s.get('halted',False),
              'failedOperator':s.get('failedOperator'),
              'done':s.get('done',False),
              'lastEvent':s.get('lastEvent'),
              'lastDecision':s.get('lastDecision'),
              'dispatchStatus':s.get('dispatchStatus'),
              'dispatchHttpCode':s.get('dispatchHttpCode'),
          }
          Path('reports/batch/latest_controller_state.json').write_text(json.dumps(telemetry,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/batch/runtime_state.json reports/batch/latest_controller_state.json
          if ! git diff --cached --quiet; then
            git commit -m "state(batch): confirm dispatch ${NEXT_OPERATOR} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Persist dispatch failure state
        if: failure() && steps.dispatch.outcome == 'failure'
        shell: bash
        env:
          NEXT_OPERATOR: ${{ steps.state.outputs.next }}
          DISPATCH_HTTP: ${{ steps.dispatch.outputs.http_code }}
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('reports/batch/runtime_state.json')
          s=json.loads(p.read_text()) if p.exists() else {}
          if s.get('inFlight') == os.environ.get('NEXT_OPERATOR'):
              s['inFlight']=None
          s['halted']=True
          s['failedOperator']=os.environ.get('NEXT_OPERATOR')
          s['failureReason']=f"workflow_dispatch_http_{os.environ.get('DISPATCH_HTTP') or 'unknown'}"
          s['dispatchStatus']='failed'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          Path('reports/batch/latest_controller_state.json').write_text(json.dumps({
              'dataset':'operator-batch-controller-state',
              'batchId':s.get('batchId'),
              'controllerRunId':s.get('lastControllerRunId'),
              'inFlight':s.get('inFlight'),
              'halted':True,
              'failedOperator':s.get('failedOperator'),
              'done':False,
              'lastDecision':'dispatch_failed',
              'dispatchStatus':'failed',
              'dispatchHttpCode':os.environ.get('DISPATCH_HTTP') or None,
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/batch/runtime_state.json reports/batch/latest_controller_state.json
          if ! git diff --cached --quiet; then
            git commit -m "state(batch): halt after dispatch failure [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Mark batch complete
        if: steps.state.outputs.done == '1'
        run: echo "Batch complete: all configured operator markers are present." >> "$GITHUB_STEP_SUMMARY"
