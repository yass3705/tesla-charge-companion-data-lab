name: V9 G6.6b-6e verified Electroverse recovery bundle
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/g66b6e-recovery-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-electroverse-overlay-offline-audit
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'yass3705/tesla-charge-companion-data-lab' && github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yass3705/tesla-charge-companion-production
          ref: 864327da54e85c133fddd351e9273a6de1c048d5
          path: production
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yass3705/tesla-charge-companion-production
          ref: e0fa68c28428720166abcc42a27503efa1ec3a30
          path: production-baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify isolated scope and public repository safety
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('migration/v9/g66b6e-recovery-request.json').read_text())
          assert r['purpose']=='offline_g66b6e_verified_recovery_bundle'
          assert all(r[k] is False for k in ('supplierCalls','automaticPublication','runtimeActivation','publicRawArchive'))
          assert subprocess.check_output(['git','-C','production','rev-parse','HEAD'],text=True).strip()==r['productionSha']
          assert subprocess.check_output(['git','-C','production-baseline','rev-parse','HEAD'],text=True).strip()==r['baselineProductionSha']
          parent=r['dataLabParent']
          assert len(parent)==40 and all(c in '0123456789abcdef' for c in parent)
          if subprocess.run(['git','cat-file','-e',parent+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',parent],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'scripts/audit_g66b6e_archive.py','.github/workflows/v9-g66b6e-recovery.yml','migration/v9/g66b6e-recovery-request.json','memory/CURRENT.md','memory/V9_REBUILD_PROGRESS.md','memory/HISTORY.md','docs/v9-rebuild/ELECTROVERSE_RECOVERY.md'}
          assert changed<=allowed,changed-allowed
          PY
          python -m py_compile scripts/audit_g66b6e_archive.py
          python scripts/public_safety_check.py .
      - name: Verify original ZIPs, restore ledger and replay exact pricing from local archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.audit_g66b6e_archive prepare migration/v9/g66b6e-recovery-request.json "$RUNNER_TEMP/g66b6e"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-g66b6e-private-recovery-bundle
          path: ${{ runner.temp }}/g66b6e/results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
