name: UK TotalEnergies app key validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-totalenergies-app-key-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract app key transiently and validate read-only BFF access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/total-xapk /tmp/total-unpack reports/uk data/national
          curl -fL --retry 3 --retry-delay 2             'https://d.apkpure.net/b/XAPK/com.total.europe?versionCode=3098'             -o /tmp/total-xapk/total.xapk
          unzip -q /tmp/total-xapk/total.xapk -d /tmp/total-unpack

          python3 - <<'PY'
          import json, pathlib, re, subprocess, hashlib, urllib.request, urllib.error, urllib.parse, gzip, os
          from datetime import datetime, timezone

          root=pathlib.Path('/tmp/total-unpack')
          base='https://prod.apix.alzp.tgscloud.net/evdc-bff-europe/v0.0.1'
          strings=[]
          for p in root.rglob('*.apk'):
              try:
                  s=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace',timeout=60).stdout
                  strings.append(s)
              except Exception:
                  pass
          blob='\n'.join(strings)

          # Look near the literal X-API-KEY for opaque app-key-like values, plus generic high-entropy tokens.
          candidates=[]
          for m in re.finditer(r'X-API-KEY',blob,re.I):
              chunk=blob[max(0,m.start()-4000):min(len(blob),m.end()+4000)]
              for t in re.findall(r'(?<![A-Za-z0-9])[A-Za-z0-9_\-]{20,120}(?![A-Za-z0-9])',chunk):
                  if any(x in t.lower() for x in ['flutter','android','application','google','sentry','stripe','totalenergies']):
                      continue
                  candidates.append(t)
          # Generic candidate pass, constrained and deduplicated.
          for t in re.findall(r'(?<![A-Za-z0-9])[A-Za-z0-9_\-]{28,80}(?![A-Za-z0-9])',blob):
              if t.count('_')+t.count('-')+sum(c.isdigit() for c in t) < 2: continue
              candidates.append(t)

          seen=set(); candidates=[x for x in candidates if not (x in seen or seen.add(x))]
          tests=[]
          working=None
          header_names=['X-API-KEY','x-api-key','Ocp-Apim-Subscription-Key','apikey']
          for token in candidates[:800]:
              for hn in header_names:
                  req=urllib.request.Request(base+'/v3/references/filters',headers={
                      'User-Agent':'ChargeEurope/1.25.2 Android',
                      'Accept':'application/json',
                      hn:token
                  })
                  status=None
                  try:
                      with urllib.request.urlopen(req,timeout=15) as r:
                          status=r.status
                          body=r.read(100000).decode('utf-8','replace')
                  except urllib.error.HTTPError as e:
                      status=e.code
                      body=e.read(1000).decode('utf-8','replace')
                  except Exception:
                      continue
                  if status != 403:
                      fp=hashlib.sha256(token.encode()).hexdigest()[:16]
                      working=(token,hn,status,fp,body)
                      tests.append({'header':hn,'status':status,'fingerprint':fp,'length':len(token)})
                      break
              if working: break

          out={
              'retrievedAt':datetime.now(timezone.utc).isoformat(),
              'package':'com.total.europe',
              'version':'1.25.2',
              'candidateCount':len(candidates),
              'workingCredentialFound':bool(working),
              'tests':tests
          }

          if working:
              token,hn,status,fp,body=working
              # Probe GB inventory using only the transient credential; never persist token.
              variants=[
                  ('/v3/infrastructure/locations',{'countryCode':'GB'}),
                  ('/v3/infrastructure/locations',{'country':'GB'}),
                  ('/v3/infrastructure/locations',{'supportedCountryCodes':'GB'}),
                  ('/v3/infrastructure/locations',{}),
              ]
              inventory=None
              attempts=[]
              for path,params in variants:
                  url=base+path
                  if params: url+='?'+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url,headers={'User-Agent':'ChargeEurope/1.25.2 Android','Accept':'application/json',hn:token})
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:
                          raw=r.read(12_000_000).decode('utf-8','replace')
                          attempts.append({'path':path,'params':params,'status':r.status,'bytes':len(raw)})
                          if r.status==200:
                              try:
                                  p=json.loads(raw)
                                  inventory=p
                                  break
                              except Exception:
                                  pass
                  except urllib.error.HTTPError as e:
                      attempts.append({'path':path,'params':params,'status':e.code})
                  except Exception as e:
                      attempts.append({'path':path,'params':params,'error':type(e).__name__})
              out['inventoryAttempts']=attempts
              if inventory is not None:
                  # Persist response only if it contains no obvious auth material.
                  txt=json.dumps(inventory,ensure_ascii=False)
                  if not re.search(r'(?i)(access[_-]?token|refresh[_-]?token|api[_-]?key|authorization)',txt):
                      with gzip.open('data/national/uk_totalenergies_charge_europe_locations.json.gz','wt',encoding='utf-8') as gz:
                          json.dump(inventory,gz,ensure_ascii=False)
                      out['inventorySaved']=True
                      if isinstance(inventory,list):
                          out['inventoryCount']=len(inventory)
                      elif isinstance(inventory,dict):
                          out['inventoryKeys']=list(inventory)[:100]
                          for k in ('locations','items','data','results','content'):
                              v=inventory.get(k)
                              if isinstance(v,list):
                                  out['inventoryListKey']=k
                                  out['inventoryCount']=len(v)
                                  if v and isinstance(v[0],dict): out['firstItemKeys']=list(v[0])[:100]
                                  break
                  else:
                      out['inventorySaved']=False
                      out['inventorySaveReason']='auth-like field detected'

          pathlib.Path('reports/uk/totalenergies-app-key-validation-latest.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

          rm -rf /tmp/total-xapk /tmp/total-unpack

      - name: Publish sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/totalenergies-app-key-validation-latest.json
          git add data/national/uk_totalenergies_charge_europe_locations.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): validate TotalEnergies Charge Europe app access [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
