name: Morocco FastVolt api-pages context

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco/probe_fastvolt_api_pages_context.py'
      - '.github/workflows/morocco-fastvolt-api-pages-context.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public client context (GET only)
        run: |
          mkdir -p reports/morocco/fastvolt
          python scripts/morocco/probe_fastvolt_api_pages_context.py > reports/morocco/fastvolt/latest-api-pages-context.json
      - name: Validate sanitized report
        run: |
          python - <<'PY'
          import json
          p='reports/morocco/fastvolt/latest-api-pages-context.json'
          d=json.load(open(p))
          assert d['policy']['read_only'] is True
          assert d['policy']['raw_bodies_persisted'] is False
          assert d['policy']['raw_context_persisted'] is False
          print(d['summary'])
          for a in d.get('assets',[]):
              if a.get('target_occurrences'):
                  print(a['url'], a['target_occurrences'], a.get('contexts'))
          if d.get('errors'): print('errors',d['errors'])
          PY
      - name: Commit report if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/fastvolt/latest-api-pages-context.json
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m "data(morocco): update FastVolt api/pages context [run $GITHUB_RUN_ID]"
            git push
          fi
