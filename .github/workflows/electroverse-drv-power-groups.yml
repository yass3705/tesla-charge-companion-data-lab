name: Audit Electroverse FR DRV power groups
on:
  push:
    branches:
      - audit/electroverse-drv-technical-identity
    paths:
      - "scripts/audit_electroverse_drv_power_groups.mjs"
      - ".github/workflows/electroverse-drv-power-groups.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit DRV power groups
        run: node scripts/audit_electroverse_drv_power_groups.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-drv-power-group-audit.json
          git commit -m "audit: publish DRV power-group audit" || exit 0
          git push
