name: Enel Italy second route probe

on:
  push:
    branches:
      - research/enel-v9-national
    paths:
      - scripts/enel_italy_second_route_probe.py
      - .github/workflows/enel-italy-second-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests selenium
      - name: Run GET-only second-route probe
        run: python scripts/enel_italy_second_route_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enel-italy-second-route-probe
          path: data/reports/enel_italy_second_route_probe.json
          retention-days: 14
