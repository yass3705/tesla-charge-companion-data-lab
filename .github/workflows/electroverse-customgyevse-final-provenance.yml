name: Audit CUSTOMGYEVSE final provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_customgyevse_final_provenance.mjs"
      - ".github/workflows/electroverse-customgyevse-final-provenance.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit_customgyevse_final_provenance.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/customgyevse-final-provenance-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist CUSTOMGYEVSE final provenance"
            git pull --rebase origin main || true
            git push
          fi
