name: UK Weev public map discovery

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/uk-weev-public-map-discovery.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Weev public network map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status,r.geturl(),r.read(8_000_000).decode("utf-8","replace"),r.headers.get("Content-Type")
              except urllib.error.HTTPError as e:
                  return e.code,url,e.read(3000).decode("utf-8","replace"),e.headers.get("Content-Type")

          st,final,html,ct=get("https://weev.ie/our-network")
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Weev","page":{"status":st,"finalUrl":final,"contentType":ct}}
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          urls=set(); paths=set(); contexts=[]
          bodies=[("html",html)]
          for s in scripts[:80]:
              bst,bfinal,b,bct=get(s)
              if bst==200:bodies.append((s,b))
          for source,b in bodies:
              for u in re.findall(r'https?://[^"\'\s<>()\\]+',b):
                  ul=u.lower()
                  if any(k in ul for k in ("weev","api","charge","location","station","charger","tariff")) and not any(k in ul for k in ("googleapis","gstatic","fonts.","mapbox")):
                      # redact query strings defensively
                      urls.add(u.split("?")[0][:500])
              for p in re.findall(r'["\']((?:/api/|/v[0-9]+/|/stations?|/locations?|/chargers?|/chargepoints?|/tariffs?|/prices?)[^"\']{0,180})["\']',b,re.I):
                  paths.add(p)
              for m in re.finditer(r'(?i)(fetch\(|axios|graphql|location|station|charger|tariff|price)',b):
                  c=b[max(0,m.start()-300):min(len(b),m.end()+700)]
                  c=re.sub(r'(?i)(token|key|secret)(["\']?\s*[:=]\s*["\'])[^"\']{8,}',r'\1\2<redacted>',c)
                  if re.search(r'/api/|fetch\(|axios|graphql|https?://',c,re.I):
                      contexts.append({"source":source,"context":c})
                      if len(contexts)>=160: break
              if len(contexts)>=160: break
          out["scripts"]=scripts[:80]; out["urlCandidates"]=sorted(urls)[:300]; out["relativePaths"]=sorted(paths)[:300]; out["contexts"]=contexts[:160]
          Path("reports/uk/weev-public-map-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"page":out["page"],"urls":out["urlCandidates"],"paths":out["relativePaths"],"contexts":len(contexts)},indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/weev-public-map-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Weev public network map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
