name: Switzerland IWB Swisscharge QR probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-iwb-swisscharge-qr-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Probe public Swisscharge QR pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          refs=["247322","247323","35375","35376","46250","46251"]
          rows=[]
          for ref in refs:
            url=f"https://cp.swisscharge.ch/public/cs/{ref}"
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/json"})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
                rows.append({
                  "reference":ref,
                  "status":r.status,
                  "finalUrl":r.geturl(),
                  "contentType":r.headers.get("Content-Type"),
                  "body":raw.decode("utf-8","replace")[:5000]
                })
            except urllib.error.HTTPError as e:
              rows.append({"reference":ref,"status":e.code,"finalUrl":e.geturl(),"body":e.read().decode("utf-8","replace")[:2000]})
            except Exception as e:
              rows.append({"reference":ref,"status":0,"error":type(e).__name__+": "+str(e)})
          out={"schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),"rows":rows}
          Path("docs/switzerland-iwb-swisscharge-qr-probe-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-iwb-swisscharge-qr-probe-2026-09-29.json
          git commit -m "research(ch): probe IWB Swisscharge QR pages" || exit 0
          git pull --rebase origin main
          git push origin main
