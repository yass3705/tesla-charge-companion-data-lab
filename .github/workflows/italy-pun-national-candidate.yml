name: Italy PUN national V9 extraction candidate (artifact only)

on:
  workflow_dispatch:
  push:
    branches:
      - audit/italy-v9-source-migration-20261014
    paths:
      - .github/workflows/italy-pun-national-candidate.yml
      - scripts/build_italy_pun_v9_tiles_candidate.py
      - scripts/verify_italy_v9_tile_contents.py

permissions:
  contents: read

concurrency:
  group: italy-pun-v9-national-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install PUN public client dependencies
        run: python -m pip install requests boto3 requests-aws4auth
      - name: Build national Italy PUN technical candidate
        run: |
          python scripts/pun_italy_national.py \
            --out /tmp/pun_italy_national.json.gz \
            --report /tmp/pun_italy_national_report.json
      - name: Gate national station and EVSE membership
        run: |
          python scripts/audit_italy_pun_evse_integrity.py \
            --input /tmp/pun_italy_national.json.gz \
            --report /tmp/pun_italy_evse_integrity_report.json
      - name: Generate experimental PUN tiles and verify static manifest shape
        run: |
          python scripts/build_italy_pun_v9_tiles_candidate.py --input /tmp/pun_italy_national.json.gz --out-dir /tmp/italy-static
          python scripts/verify_italy_v9_runtime_parity.py --candidate /tmp/italy-static/manifest.json --report /tmp/italy_manifest_parity_report.json
          python scripts/verify_italy_v9_tile_contents.py --dir /tmp/italy-static --report /tmp/italy_tile_content_report.json
      - name: Upload immutable candidate and diagnostics, do not publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-pun-national-v9-candidate
          path: |
            /tmp/pun_italy_national.json.gz
            /tmp/pun_italy_national_report.json
            /tmp/pun_italy_evse_integrity_report.json
            /tmp/italy_manifest_parity_report.json
            /tmp/italy_tile_content_report.json
            /tmp/italy-static/
          retention-days: 7
