name: AVIA Picoty full bootstrap summary

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_full_bootstrap_summary.py"
      - ".github/workflows/avia-picoty-full-bootstrap-summary.yml"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build safe compact summary
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_full_bootstrap_summary.py
          python scripts/avia_picoty_full_bootstrap_summary.py
      - name: Validate compact summary
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_full_guest_bootstrap_summary.json')
          d=json.loads(p.read_text())
          assert d['schemaVersion']=='1.0.0'
          assert d['operationSummary']
          raw=p.read_text()
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}',raw)
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}',raw)
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-full-bootstrap-summary
          path: data/reports/avia_picoty_full_guest_bootstrap_summary.json
          retention-days: 14
      - name: Commit summary
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_full_guest_bootstrap_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Summarize AVIA Picoty full guest bootstrap"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
