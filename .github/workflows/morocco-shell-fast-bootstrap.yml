name: Morocco Shell fast bootstrap

on:
  push:
    paths:
      - '.github/workflows/morocco-shell-fast-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Exact public bootstrap and station fetch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shell-fast
          mkdir -p /tmp/shell-fast/x reports/morocco/shell
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0' \
            'https://d.apkpure.net/b/APK/com.shell.shell_loyalty_app.morocco?version=latest' \
            -o /tmp/shell-fast/app.apk
          echo '388caa4c883a285ad996859db1ae231ffd3e909bf396475969a61225bae0acf4  /tmp/shell-fast/app.apk' | sha256sum -c -
          unzip -q /tmp/shell-fast/app.apk 'lib/x86_64/libnative-lib.so' -d /tmp/shell-fast/x
          python3 - <<'PY'
          import re,json,subprocess,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          so=Path('/tmp/shell-fast/x/lib/x86_64/libnative-lib.so')
          dis=subprocess.check_output(['objdump','-d',str(so)],text=True,errors='ignore')
          sec=subprocess.check_output(['readelf','-SW',str(so)],text=True,errors='ignore')
          sm=re.search(r'\s\.rodata\s+PROGBITS\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',sec)
          if not sm:raise SystemExit('rodata missing')
          ro_addr,ro_off,_=(int(x,16) for x in sm.groups());data=so.read_bytes()
          def gs(name):
              pat=rf'<Java_com_shell_shell_1loyalty_1app_utils_SecretAPIKeys_00024APIKeys_{re.escape(name)}[^>]*>:(.*?)(?=\n\n[0-9a-f]+ <)'
              m=re.search(pat,dis,re.S)
              if not m:return None
              lm=re.search(r'#\s*([0-9a-fA-F]+)\s*<',m.group(1))
              if not lm:return None
              p=ro_off+(int(lm.group(1),16)-ro_addr)
              while p<len(data) and (data[p]<33 or data[p]>126):p+=1
              e=data.find(b'\0',p)
              return data[p:e].decode('ascii','ignore') if e>p else None
          country_key=gs('countryConfigProdApiKey')
          app=gs('getApplicationKeyDataProdMorocco')
          platform=gs('getXPlatformCode')
          if not country_key or not app:raise SystemExit('bootstrap getters missing')
          body={'application':app,'view':'Country Configurations','segment':'Loyalty','parentKey':'countryList','imageKey':'countryFlag'}
          h={'Content-Type':'application/json','Accept':'application/json','Accept-Language':'en','country':'all','x-api-key':country_key}
          if platform:h['x-platform-code']=platform
          req=urllib.request.Request('https://3ns044xjg3.execute-api.eu-west-1.amazonaws.com/prod/getCountries/v1',data=json.dumps(body).encode(),headers=h,method='POST')
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:raw=resp.read();status=resp.status
          except urllib.error.HTTPError as e:raw=e.read();status=e.code
          report={'generated_at':datetime.now(timezone.utc).isoformat(),'bootstrap_http_status':status,'country_rows':None,'morocco_found':False,'station_fetch':None,'policy':{'read_only':True,'no_login':True,'no_user_data':True,'credentials_persisted':False}}
          try:o=json.loads(raw.decode('utf-8','ignore'))
          except:o=None
          if isinstance(o,dict):
              report['bootstrap_top_level_keys']=sorted(o.keys())
          elif isinstance(o,list):
              report['bootstrap_top_level_type']='list'
          else:
              report['bootstrap_top_level_type']=type(o).__name__

          # Walk response recursively: country payload shape varies by backend version.
          dicts=[]
          def walk(x,path='
          if ma:
              base=ma.get('apiBaseURL');key=ma.get('apiKey')
              report['morocco_safe']={'name':ma.get('name'),'countryCode':ma.get('countryCode'),'apiBaseURL':base,'apiKey_present':bool(key),'defaultLanguage':ma.get('defaultLanguage')}
              if base and key:
                  sh={'Content-Type':'application/json','Accept':'application/json','Accept-Language':'fr','country':'ma','x-app-version':'3.2.7','x-api-key':key}
                  if platform:sh['x-platform-code']=platform
                  sb={'amenities':'','latitude':'31.7917','limit':'1000','longitude':'-7.0926','m':'closest','radius':'2000','route':'1','type':'0'}
                  sreq=urllib.request.Request(base.rstrip('/')+'/getStations/v1',data=json.dumps(sb).encode(),headers=sh,method='POST')
                  try:
                      with urllib.request.urlopen(sreq,timeout=30) as resp:sraw=resp.read();ss=resp.status
                  except urllib.error.HTTPError as e:sraw=e.read();ss=e.code
                  rec={'http_status':ss,'base_url':base}
                  try:soj=json.loads(sraw.decode('utf-8','ignore'))
                  except:soj=None
                  srows=soj
                  if isinstance(soj,dict):
                      rec['top_level_keys']=sorted(soj.keys())
                      for k in ('data','result','stations'):
                          if isinstance(soj.get(k),list):srows=soj[k];break
                  if isinstance(srows,list):
                      rec['row_count']=len(srows);ev=[]
                      for st in srows:
                          if isinstance(st,dict) and (st.get('ev_charging') or st.get('ev_offering')):
                              ev.append({'id':st.get('id'),'name':st.get('name'),'lat':st.get('lat'),'lon':st.get('lon'),'loc':st.get('loc'),'ev_charging':st.get('ev_charging'),'ev_offering':st.get('ev_offering')})
                      rec['ev_row_count']=len(ev);rec['ev_rows']=ev
                  elif isinstance(soj,dict):rec['safe_message']={k:soj.get(k) for k in ('message','code','status','error') if k in soj}
                  report['station_fetch']=rec
          Path('reports/morocco/shell/fast-bootstrap-2026-09-27.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf /tmp/shell-fast
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/shell/fast-bootstrap-2026-09-27.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "diag(morocco): run fast Shell bootstrap [run $GITHUB_RUN_ID]" || exit 0
          git pull --rebase origin main
          git push origin main
):
              if isinstance(x,dict):
                  dicts.append((path,x))
                  for k,v in x.items():
                      walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x):
                      walk(v,path+f'[{i}]')
          walk(o)
          report['bootstrap_dict_count']=len(dicts)
          report['bootstrap_shapes']=[
              {'path':p,'keys':sorted(d.keys())[:80]}
              for p,d in dicts[:50]
          ]
          rows=[d for _,d in dicts if any(k in d for k in ('countryCode','country_code','apiBaseURL','apiKey','defaultLanguage'))]
          report['country_rows']=len(rows)
          ma=None
          for row in rows:
              cc=str(row.get('countryCode') or row.get('country_code') or row.get('code') or '').lower()
              name=str(row.get('name') or row.get('country') or '').lower()
              if cc=='ma' or 'morocco' in name or 'maroc' in name:
                  ma=row;break
          # Safe preview of country-like rows, with key material redacted.
          report['country_rows_safe']=[]
          for row in rows[:30]:
              safe={}
              for k,v in row.items():
                  if re.search(r'(?i)(key|secret|token|password)',str(k)):
                      safe[k]='<redacted>' if v not in (None,'') else v
                  elif isinstance(v,(str,int,float,bool)) or v is None:
                      safe[k]=v
              report['country_rows_safe'].append(safe)
          report['morocco_found']=bool(ma)
          if ma:
              base=ma.get('apiBaseURL');key=ma.get('apiKey')
              report['morocco_safe']={'name':ma.get('name'),'countryCode':ma.get('countryCode'),'apiBaseURL':base,'apiKey_present':bool(key),'defaultLanguage':ma.get('defaultLanguage')}
              if base and key:
                  sh={'Content-Type':'application/json','Accept':'application/json','Accept-Language':'fr','country':'ma','x-app-version':'3.2.7','x-api-key':key}
                  if platform:sh['x-platform-code']=platform
                  sb={'amenities':'','latitude':'31.7917','limit':'1000','longitude':'-7.0926','m':'closest','radius':'2000','route':'1','type':'0'}
                  sreq=urllib.request.Request(base.rstrip('/')+'/getStations/v1',data=json.dumps(sb).encode(),headers=sh,method='POST')
                  try:
                      with urllib.request.urlopen(sreq,timeout=30) as resp:sraw=resp.read();ss=resp.status
                  except urllib.error.HTTPError as e:sraw=e.read();ss=e.code
                  rec={'http_status':ss,'base_url':base}
                  try:soj=json.loads(sraw.decode('utf-8','ignore'))
                  except:soj=None
                  srows=soj
                  if isinstance(soj,dict):
                      rec['top_level_keys']=sorted(soj.keys())
                      for k in ('data','result','stations'):
                          if isinstance(soj.get(k),list):srows=soj[k];break
                  if isinstance(srows,list):
                      rec['row_count']=len(srows);ev=[]
                      for st in srows:
                          if isinstance(st,dict) and (st.get('ev_charging') or st.get('ev_offering')):
                              ev.append({'id':st.get('id'),'name':st.get('name'),'lat':st.get('lat'),'lon':st.get('lon'),'loc':st.get('loc'),'ev_charging':st.get('ev_charging'),'ev_offering':st.get('ev_offering')})
                      rec['ev_row_count']=len(ev);rec['ev_rows']=ev
                  elif isinstance(soj,dict):rec['safe_message']={k:soj.get(k) for k in ('message','code','status','error') if k in soj}
                  report['station_fetch']=rec
          Path('reports/morocco/shell/fast-bootstrap-2026-09-27.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf /tmp/shell-fast
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/shell/fast-bootstrap-2026-09-27.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "diag(morocco): run fast Shell bootstrap [run $GITHUB_RUN_ID]" || exit 0
          git pull --rebase origin main
          git push origin main
