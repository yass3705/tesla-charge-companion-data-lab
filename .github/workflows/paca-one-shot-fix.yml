name: PACA one-shot source witness fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/paca-one-shot-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relax only the redundant MAMP label witness
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/paca_regional_coverage.py')
          s=p.read_text()
          old='require(src["mamp_multi"]["text"], "trois opérateurs", "larecharge", label="MAMP multi-CPO")'
          new='require(src["mamp_multi"]["text"], "trois opérateurs", label="MAMP multi-CPO")'
          if old not in s:
              raise SystemExit('expected PACA witness line not found')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile scripts/paca_regional_coverage.py
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/paca_regional_coverage.py
          git commit -m "fix(paca): separate MAMP multi-CPO and larecharge witnesses"
          git pull --rebase origin main
          git push origin HEAD:main
