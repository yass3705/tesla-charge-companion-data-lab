name: V9 isolated direct evidence and signed archive checks
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/tariff-restoration-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-direct-and-archive-checks
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ['FR:electra_residual_audit', 'FR:treated_reliability', 'FR:fixed_tariff_core', 'FR:fixed_tariff_secondary', 'FR:greenspot', 'MA:fastvolt_inventory']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Renew and validate the preserved official method
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: python -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/tcc-v9-tariff-renewal" --workers 1 --attempts 1
      - name: Preserve validated immutable output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-tariff-renewal-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/tcc-v9-tariff-renewal/manifest.json
            ${{ runner.temp }}/tcc-v9-tariff-renewal/objects
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failures separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-tariff-renewal-failure-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/tcc-v9-tariff-renewal/manifest.json
            ${{ runner.temp }}/tcc-v9-tariff-renewal/failures
            ${{ runner.temp }}/tcc-v9-tariff-renewal/checkpoints
            ${{ runner.temp }}/tcc-v9-tariff-renewal/checkpoint-manifest.json
          if-no-files-found: ignore
          retention-days: 30
