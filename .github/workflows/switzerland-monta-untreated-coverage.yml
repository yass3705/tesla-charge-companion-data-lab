name: Switzerland Monta untreated coverage
on:
  push:
    paths:
      - 'scripts/audit_swiss_monta_untreated.py'
      - '.github/workflows/switzerland-monta-untreated-coverage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/audit_swiss_monta_untreated.py
      - name: Persist audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-monta-untreated-coverage-2026-09-28.json
          git commit -m 'docs(switzerland): audit Monta coverage for untreated CPOs' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
