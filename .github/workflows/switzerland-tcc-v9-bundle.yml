name: Switzerland TCC V9 bundle
on:
  push:
    branches: ['main']
    paths:
      - 'scripts/build_swiss_tcc_v9_bundle.py'
      - 'scripts/guard_swiss_bundle_refresh.py'
      - 'tests/test_guard_swiss_bundle_refresh.py'
      - 'data/switzerland/**'
      - 'data/swisscharge/**'
      - 'data/gofast/**'
      - 'docs/switzerland-cpo-progress-2026-09.json'
      - '.github/workflows/switzerland-tcc-v9-bundle.yml'
  pull_request:
    paths:
      - 'scripts/build_swiss_tcc_v9_bundle.py'
      - 'scripts/guard_swiss_bundle_refresh.py'
      - 'tests/test_guard_swiss_bundle_refresh.py'
      - '.github/workflows/switzerland-tcc-v9-bundle.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *'
permissions:
  contents: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_guard_swiss_bundle_refresh.py'
      - run: python3 -m py_compile scripts/build_swiss_tcc_v9_bundle.py scripts/guard_swiss_bundle_refresh.py
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -p 'test_guard_swiss_bundle_refresh.py'
      - run: python3 scripts/build_swiss_tcc_v9_bundle.py
      - name: Verify retained national input
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          report=json.loads(Path('docs/switzerland-v9-integration-2026-09-28.json').read_text())
          source=report['nationalSourceSnapshot']
          raw=gzip.decompress(Path(source['path']).read_bytes())
          assert len(raw)==source['rawBytes']
          assert hashlib.sha256(raw).hexdigest()==source['rawSha256']
          assert isinstance(json.loads(raw), (dict,list))
          print('SWISS_NATIONAL_INPUT_PRESERVED', source['rawBytes'], source['rawSha256'])
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tcc_v9/switzerland.json data/national/switzerland_oicp_source.json.gz docs/switzerland-v9-integration-2026-09-28.json
          git commit -m 'data(switzerland): build TCC V9 bundle' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - name: Compile canonical Swiss dataset after bundle persistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run switzerland-v9-integration.yml --ref main
