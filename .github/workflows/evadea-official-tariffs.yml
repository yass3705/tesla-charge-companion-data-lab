name: e-Vadea official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/evadea_official.py"
      - "scripts/evadea_tariff_image_discovery.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/evadea-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: evadea-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Install OCR language data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra

      - name: Extract e-Vadea official France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/evadea-final
          python -m py_compile scripts/evadea_tariff_image_discovery.py scripts/evadea_official.py
          python scripts/evadea_official.py --out out/evadea-final 2> >(tee out/evadea-final/error.log >&2)
          cat out/evadea-final/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/evadea
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/evadea-final/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/evadea/latest_final_diagnostic.json').write_text(json.dumps({'dataset':'evadea-final-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-50:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/evadea/latest_final_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(evadea): publish final extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification and tariff grid
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/evadea-final/evadea_official_france.json').read_text())
          assert p['dataset'] == 'evadea-official-france'
          assert p['country'] == 'FR'
          assert p['classification']['singleFlatNationalTariff'] is False
          assert p['classification']['tariffGridByRoadContextAndPower'] is True
          assert p['classification']['stationContextLookupRequiredForExactSimulation'] is True
          assert p['operatorDirect']['motorway']['lessThan100Kw']['eurPerKwh'] == 0.48
          assert p['operatorDirect']['motorway']['from100Kw']['eurPerKwh'] == 0.62
          assert p['operatorDirect']['offMotorway']['lessThan30Kw']['eurPerKwh'] == 0.40
          assert p['operatorDirect']['offMotorway']['from30To60Kw']['eurPerKwh'] == 0.48
          assert p['operatorDirect']['offMotorway']['from60Kw']['eurPerKwh'] == 0.58
          occ=p['fees']['occupancy']
          assert occ['gracePeriodMinutes'] == 5 and occ['billingBlockMinutes'] == 15
          assert occ['motorway']['lessThan100KwEurPerBlock'] == 6.0
          assert occ['motorway']['from100KwEurPerBlock'] == 6.0
          assert occ['offMotorway']['lessThan30KwEurPerBlock'] == 0.5
          assert occ['offMotorway']['from30To60KwEurPerBlock'] == 5.0
          assert occ['offMotorway']['from60KwEurPerBlock'] == 5.0
          assert p['operatorDirect']['bankCardPreauthorizationEur'] == 49.0
          assert p['roaming']['classification'] == 'third_party_eMSP'
          assert p['sourceEvidence']['officialOnly'] is True
          assert len(p['sourceEvidence']['tariffImageSha256']) == 64
          print('Validated e-Vadea France tariff grid and occupancy rules')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/evadea-final/evadea_official_france.json')
          dst=Path('data/operator_direct/evadea_official_france.json')
          rep=Path('reports/evadea/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'fees':d.get('fees'),
                  'energyBilling':d.get('energyBilling'),
                  'roaming':d.get('roaming'),
                  'inventory':d.get('inventory'),
                  'tariffImageSha256':(d.get('sourceEvidence') or {}).get('tariffImageSha256'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/evadea-final/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated e-Vadea rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/evadea_official_france.json reports/evadea/latest_summary.md
          git commit -m "data(evadea): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
