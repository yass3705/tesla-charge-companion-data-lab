name: UK Monta open-data probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-monta-open-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe Monta UK open-data endpoint
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path
          url='https://public-api.monta.com/api/v1/open-data/locations?per_page=100'
          out={'country':'GB','network':'Monta','url':url,'retrievedAt':datetime.now(timezone.utc).isoformat()}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanion/9 UK-Monta-probe','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read()
                  out['status']=r.status
                  out['headers']={k:v for k,v in r.headers.items() if k.lower() in ('content-type','content-length','x-total-count','link')}
                  p=json.loads(raw.decode('utf-8'))
                  out['jsonType']=type(p).__name__
                  if isinstance(p,dict):
                      out['topLevelKeys']=list(p)[:50]
                      out['topLevelScalarPreview']={k:v for k,v in p.items() if not isinstance(v,(list,dict)) and k.lower() not in ('token','secret')}
                      for key in ('data','locations','items','results'):
                          if isinstance(p.get(key),list):
                              out['arrayKey']=key
                              out['arrayLength']=len(p[key])
                              if p[key] and isinstance(p[key][0],dict):
                                  x=p[key][0]
                                  out['firstObjectKeys']=list(x)[:80]
                                  out['firstPartyId']=x.get('party_id')
                                  out['firstId']=x.get('id')
                                  evses=x.get('evses') or []
                                  if evses and isinstance(evses[0],dict):
                                      ev=evses[0]
                                      out['firstEvse']={
                                          'uid':ev.get('uid'),'evse_id':ev.get('evse_id'),'status':ev.get('status'),
                                          'keys':list(ev)[:80],
                                          'tariffs':ev.get('tariffs'),
                                          'connectors':[]
                                      }
                                      for con in (ev.get('connectors') or [])[:3]:
                                          if isinstance(con,dict):
                                              out['firstEvse']['connectors'].append({
                                                  'id':con.get('id'),
                                                  'keys':list(con)[:80],
                                                  'tariff_ids':con.get('tariff_ids'),
                                                  'tariff_id':con.get('tariff_id'),
                                                  'standard':con.get('standard'),
                                                  'max_electric_power':con.get('max_electric_power')
                                              })
                              break
                      for key in ('meta','pagination','links'):
                          if isinstance(p.get(key),dict):
                              out[key]=p[key]
                  elif isinstance(p,list):
                      out['arrayLength']=len(p)
          except urllib.error.HTTPError as e:
              out.update({'status':e.code,'error':str(e)})
              try: out['bodyPrefix']=e.read(1000).decode('utf-8',errors='replace')
              except Exception: pass
          except Exception as e:
              out.update({'status':None,'error':f'{type(e).__name__}: {e}'})
          # Follow-up probes against identifiers found in the sample.
          evse_id=((out.get('firstEvse') or {}).get('evse_id'))
          tariff_id=None
          connectors=((out.get('firstEvse') or {}).get('connectors') or [])
          if connectors:
              tids=connectors[0].get('tariff_ids') or []
              if tids: tariff_id=str(tids[0])

          sample_data=[]
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanion/9 UK-Monta-probe','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as rr:
                  pp=json.loads(rr.read().decode('utf-8'))
                  sample_data=pp.get('data') if isinstance(pp,dict) and isinstance(pp.get('data'),list) else []
          except Exception:
              sample_data=[]

          nonempty_inline=None
          status_counts={}
          party_counts={}
          tariff_ref_count=0
          for loc in sample_data:
              if not isinstance(loc,dict): continue
              pid=str(loc.get('party_id') or '')
              if pid: party_counts[pid]=party_counts.get(pid,0)+1
              for ev in (loc.get('evses') or []):
                  if not isinstance(ev,dict): continue
                  st=str(ev.get('status') or 'UNKNOWN'); status_counts[st]=status_counts.get(st,0)+1
                  if ev.get('tariffs') and nonempty_inline is None:
                      nonempty_inline={'locationId':loc.get('id'),'party_id':loc.get('party_id'),'evse_id':ev.get('evse_id'),'status':ev.get('status'),'tariffs':ev.get('tariffs')}
                  for con in (ev.get('connectors') or []):
                      if isinstance(con,dict):
                          tariff_ref_count += len(con.get('tariff_ids') or [])
          out['sample100']={'locations':len(sample_data),'partyCounts':party_counts,'evseStatusCounts':status_counts,'tariffRefs':tariff_ref_count,'firstNonEmptyInlineTariffs':nonempty_inline}

          follow=[]
          candidates=[]
          if evse_id:
              candidates.append(('afirStatus', 'https://public-api.monta.com/api/v1/afir/charge-points/'+urllib.parse.quote(evse_id,safe='')+'/status'))
          if tariff_id:
              candidates.extend([
                  ('openTariffById','https://public-api.monta.com/api/v1/open-data/tariffs/'+urllib.parse.quote(tariff_id,safe='')),
                  ('openTariffsFilter','https://public-api.monta.com/api/v1/open-data/tariffs?id='+urllib.parse.quote(tariff_id,safe='')),
                  ('tariffById','https://public-api.monta.com/api/v1/tariffs/'+urllib.parse.quote(tariff_id,safe=''))
              ])
          for label,u in candidates:
              row={'label':label,'url':u}
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'TeslaChargeCompanion/9 UK-Monta-probe','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=45) as rr:
                      raw2=rr.read(200000)
                      row['status']=rr.status
                      row['contentType']=rr.headers.get('Content-Type')
                      try:
                          q=json.loads(raw2.decode('utf-8'))
                          row['jsonType']=type(q).__name__
                          row['payload']=q
                      except Exception:
                          row['bodyPrefix']=raw2[:1000].decode('utf-8',errors='replace')
              except urllib.error.HTTPError as e:
                  row['status']=e.code
                  row['error']=str(e)
                  try: row['bodyPrefix']=e.read(1000).decode('utf-8',errors='replace')
                  except Exception: pass
              except Exception as e:
                  row['status']=None; row['error']=f'{type(e).__name__}: {e}'
              follow.append(row)
          out['followUp']=follow

          Path('reports/uk').mkdir(parents=True,exist_ok=True)
          Path('reports/uk/monta-open-data-probe-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/monta-open-data-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Monta open data [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
