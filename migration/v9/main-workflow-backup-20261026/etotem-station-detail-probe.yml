name: e-Totem station detail probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/etotem_station_detail_probe.mjs"
      - ".github/workflows/etotem-station-detail-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Probe station details
        run: node scripts/etotem_station_detail_probe.mjs
      - name: Publish probe result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/etotem_station_detail_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(etotem): publish station detail probe [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
