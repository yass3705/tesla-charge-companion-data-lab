name: UK Qwello public tariff collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-qwello-public-tariff-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Resolve Qwello base URL and collect UK tariff view
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk data/national
          python - <<'PY'
          import json,re,gzip,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          def get_text(url):
              req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9 Qwello","Accept":"application/javascript,application/json,text/plain,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(30_000_000).decode("utf-8","replace"),r.status

          utext,_=get_text("https://tariff.qwello.eu/url.js")
          m=re.search(r'BASE_URL\s*[:=]\s*["\']([^"\']+)["\']',utext)
          if not m:
              # support object/export formatting
              m=re.search(r'["\']?BASE_URL["\']?\s*:\s*["\']([^"\']+)["\']',utext)
          if not m: raise SystemExit("BASE_URL not found in url.js")
          base=m.group(1).rstrip("/")
          endpoint=base+"/tariff-view.json"
          raw,_=get_text(endpoint)
          rows=json.loads(raw)
          if not isinstance(rows,list): raise SystemExit("unexpected tariff-view payload")
          uk=[x for x in rows if isinstance(x,dict) and str(x.get("country") or "").upper() in ("GB","UK","UNITED KINGDOM")]
          if not uk:
              # country labels may be human-readable; inspect without failing prematurely
              uk=[x for x in rows if isinstance(x,dict) and any(str(i).upper().startswith("GB") for i in (x.get("id") or []))]
          ids=sum(len(x.get("id") or []) for x in uk if isinstance(x,dict))
          versions={}; currencies={}; cities=set()
          for x in uk:
              t=x.get("tariff") or {}
              v=str(t.get("version") or "UNKNOWN"); versions[v]=versions.get(v,0)+1
              c=str(x.get("currency") or "UNKNOWN"); currencies[c]=currencies.get(c,0)+1
              if x.get("city"): cities.add(str(x["city"]))
          now=datetime.now(timezone.utc).isoformat()
          out={"country":"GB","network":"Qwello","retrievedAt":now,"source":endpoint,"stations":uk}
          summary={"country":"GB","network":"Qwello","retrievedAt":now,"baseUrl":base,
                   "globalRows":len(rows),"ukStations":len(uk),"ukEvseIds":ids,
                   "tariffVersions":versions,"currencies":currencies,"cities":len(cities),
                   "status":"complete_tariff_view" if uk else "no_uk_rows"}
          with gzip.open("data/national/uk_qwello_tariff_view.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/qwello-tariff-view-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          # Persist structural URL evidence only, not unrelated frontend values.
          Path("reports/uk/qwello-url-module-latest.json").write_text(json.dumps({"retrievedAt":now,"baseUrl":base,"endpoint":endpoint},indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not uk: raise SystemExit(2)
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_qwello_tariff_view.json.gz reports/uk/qwello-tariff-view-latest.json reports/uk/qwello-url-module-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Qwello public tariff view [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
