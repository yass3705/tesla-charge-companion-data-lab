name: V9 isolated collection
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact source ID from v9_rebuild/sources.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preserved Belib PDF extractor
        if: ${{ inputs.source == 'FR:belib' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Install preserved Allego browser dependency
        if: ${{ inputs.source == 'FR:allego_stations' || inputs.source == 'FR:allego_official' }}
        run: python -m pip install --disable-pip-version-check -q selenium
      - name: Install preserved TE63 HTTP dependency
        if: ${{ inputs.source == 'FR:chargezy_te63' }}
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Install preserved EnergyVision XML parser
        if: ${{ inputs.source == 'BE:energyvision' }}
        run: python -m pip install --disable-pip-version-check -q defusedxml==0.7.1
      - name: Install preserved WAAT browser dependency
        if: ${{ inputs.source == 'FR:waat_monta_sharded' }}
        run: npm install --no-save playwright-core@1.55.0
      - name: Find the latest state for this source and branch
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ inputs.source }}
        run: python -m v9_rebuild.artifact_selection --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --source "$SOURCE_ID" --github-output "$GITHUB_OUTPUT"
      - name: Restore a technical checkpoint when requested
        if: ${{ steps.prior.outputs.checkpoint_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-checkpoints-${{ steps.prior.outputs.slug }}
          run-id: ${{ steps.prior.outputs.checkpoint_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/checkpoints
      - name: Restore the last validated state when requested
        if: ${{ steps.prior.outputs.state_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.slug }}
          run-id: ${{ steps.prior.outputs.state_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_state
      - name: Restore validated tariff dependency for the overlay
        if: ${{ inputs.source == 'FR:electroverse_overlay' && steps.prior.outputs.tariff_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.tariff_slug }}
          run-id: ${{ steps.prior.outputs.tariff_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/${{ steps.prior.outputs.tariff_slug }}
      - name: Restore validated national-status dependency for the overlay
        if: ${{ inputs.source == 'FR:electroverse_overlay' && steps.prior.outputs.status_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-FR_electroverse_status
          run-id: ${{ steps.prior.outputs.status_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/FR_electroverse_status
      - name: Restore validated WAAT inventory for Monta methods
        if: ${{ (inputs.source == 'FR:waat_monta_sharded' || inputs.source == 'FR:waat_monta_public') && steps.prior.outputs.inventory_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-FR_waat_inventory
          run-id: ${{ steps.prior.outputs.inventory_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/FR_waat_inventory
      - name: Restore validated Connected Kerb operator snapshot for guest app
        if: ${{ inputs.source == 'GB:connected_kerb_app' && steps.prior.outputs.operator_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-GB_connected_kerb_operator
          run-id: ${{ steps.prior.outputs.operator_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/GB_connected_kerb_operator
      - name: Restore validated Swiss eCarUp exact owner snapshot
        if: ${{ inputs.source == 'CH:ecarup_coordinate' && steps.prior.outputs.ecarup_owner_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-CH_ecarup_owner
          run-id: ${{ steps.prior.outputs.ecarup_owner_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/CH_ecarup_owner
      - name: Restore validated Swiss eCarUp coordinate overlay
        if: ${{ inputs.source == 'CH:ecarup_finalization' && steps.prior.outputs.ecarup_coordinate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-CH_ecarup_coordinate
          run-id: ${{ steps.prior.outputs.ecarup_coordinate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/CH_ecarup_coordinate
      - name: Restore validated Swiss Plenitude official state
        if: ${{ inputs.source == 'CH:plenitude_closeout' && steps.prior.outputs.plenitude_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-CH_plenitude_official
          run-id: ${{ steps.prior.outputs.plenitude_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/CH_plenitude_official
      - name: Restore validated Kilowatt public inventory for diagnostics
        if: ${{ (inputs.source == 'MA:kilowatt_reconcile' || inputs.source == 'MA:kilowatt_tariff_overlay') && steps.prior.outputs.kilowatt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-MA_kilowatt_inventory
          run-id: ${{ steps.prior.outputs.kilowatt_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/MA_kilowatt_inventory
      - name: Restore validated Swiss EBS first pass
        if: ${{ inputs.source == 'CH:ebs_closeout' && steps.prior.outputs.ebs_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-CH_ebs_ecarup
          run-id: ${{ steps.prior.outputs.ebs_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/CH_ebs_ecarup
      - name: Restore validated Swiss PowerUp/Monta first pass
        if: ${{ inputs.source == 'CH:powerup_closeout' && steps.prior.outputs.powerup_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-CH_powerup_monta
          run-id: ${{ steps.prior.outputs.powerup_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/CH_powerup_monta
      - name: Collect migrated sources into isolated artifacts
        env:
          SOURCE_ID: ${{ inputs.source }}
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
          BELGIUM_NAP_TOKEN: ${{ secrets.BELGIUM_NAP_TOKEN }}
          ATLANTE_API_SUBSCRIPTION_KEY: ${{ secrets.ATLANTE_API_SUBSCRIPTION_KEY }}
          BLINK_PCPR_TOKEN: ${{ secrets.BLINK_PCPR_TOKEN }}
          ALLEGO_UK_PCPR_TOKEN: ${{ secrets.ALLEGO_UK_PCPR_TOKEN }}
          SOURCE_EV_PCPR_TOKEN: ${{ secrets.SOURCE_EV_PCPR_TOKEN }}
          EVYVE_PCPR_TOKEN: ${{ secrets.EVYVE_PCPR_TOKEN }}
          GRIDSERVE_PCPR_API_KEY: ${{ secrets.GRIDSERVE_API_KEY }}
          GRIDSERVE_API_KEY: ${{ secrets.GRIDSERVE_API_KEY }}
          UBITRICITY_PCPR_TOKEN: ${{ secrets.UBITRICITY_PCPR_TOKEN || secrets.UBITRICITY_UK_PCPR_API_KEY || secrets.UBITRICITY_API_KEY }}
          CONNECTED_KERB_TOKEN: ${{ secrets.CONNECTED_KERB_TOKEN }}
          ECO_MOVEMENT_PCPR_TOKEN: ${{ secrets.ECO_MOVEMENT_PCPR_TOKEN }}
          ENERGYVISION_API_KEY: ${{ secrets.ENERGYVISION_API_KEY }}
          REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY || secrets.REVE_API_KEY }}
        run: python -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/tcc-v9-artifacts" --workers 1 --attempts 2
      - name: Preserve validated immutable outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.slug }}
          path: |
            ${{ runner.temp }}/tcc-v9-artifacts/manifest.json
            ${{ runner.temp }}/tcc-v9-artifacts/objects
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve failure manifest separately
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-failure-${{ steps.prior.outputs.slug }}
          path: |
            ${{ runner.temp }}/tcc-v9-artifacts/manifest.json
            ${{ runner.temp }}/tcc-v9-artifacts/failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain failed technical checkpoint for an explicit retry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-checkpoints-${{ steps.prior.outputs.slug }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/checkpoints
          if-no-files-found: ignore
          retention-days: 7
