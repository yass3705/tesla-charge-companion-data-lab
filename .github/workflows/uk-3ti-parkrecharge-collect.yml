name: UK 3ti ParkRecharge collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-3ti-parkrecharge-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-3ti-parkrecharge-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect 3ti and ParkRecharge public data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk data/national
          python - <<'PY'
          import json,gzip,re,urllib.request,urllib.parse,time
          from datetime import datetime,timezone
          from pathlib import Path

          UA="TeslaChargeCompanion/9 UK-public-collector"
          def get_json(url,retries=6):
              import urllib.error
              last=None
              for attempt in range(retries):
                  req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json,*/*"})
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.loads(r.read().decode("utf-8")),r.status,dict(r.headers.items())
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429: raise
                      wait=e.headers.get("Retry-After")
                      try: delay=float(wait) if wait else 20*(attempt+1)
                      except Exception: delay=20*(attempt+1)
                      time.sleep(min(120,delay))
                  except Exception as e:
                      last=e
                      time.sleep(min(60,5*(attempt+1)))
              raise last
          def arr(p):
              if isinstance(p,list): return p
              if isinstance(p,dict):
                  for k in ("data","locations","tariffs","items","results","devices"):
                      if isinstance(p.get(k),list): return p[k]
              return []

          now=datetime.now(timezone.utc).isoformat()
          summary={"retrievedAt":now}

          # 3ti: IDs are publicly embedded on its open-data page.
          page=urllib.request.urlopen(urllib.request.Request("https://3ti.co.uk/3ti-public-charge-points/",headers={"User-Agent":UA}),timeout=60).read().decode("utf-8","replace")
          ids=sorted(set(re.findall(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',page)))
          # Keep only UUIDs that are actually used as a selectable Fuuse site ID.
          contexts=[]
          used=[]
          for uid in ids:
              if uid in page and ("value=\""+uid+"\"" in page or "value='"+uid+"'" in page or uid=="59cb82f0-0b96-4651-b5bc-383d46b81d30"):
                  used.append(uid)
          if not used: used=ids
          locs=[]; tariffs=[]; failures=[]
          for uid in used:
              try:
                  lp,_,_=get_json(f"https://api.fuuse.io/opendata/{uid}/location")
                  tp,_,_=get_json(f"https://api.fuuse.io/opendata/{uid}/tariff")
                  locs.extend(arr(lp)); tariffs.extend(arr(tp))
              except Exception as e:
                  failures.append({"uuid":uid,"error":f"{type(e).__name__}: {e}"})
              time.sleep(12)
          # dedupe
          def dedupe(rows):
              d={}
              for x in rows:
                  if isinstance(x,dict):
                      k=str(x.get("id") or json.dumps(x,sort_keys=True)[:300])
                      d[k]=x
              return list(d.values())
          locs=dedupe(locs); tariffs=dedupe(tariffs)
          linked=set(); tids={str(t.get("id")) for t in tariffs if isinstance(t,dict) and t.get("id") is not None}
          evses=connectors=0; parties=set(); statuses={}
          for l in locs:
              if l.get("party_id"): parties.add(str(l["party_id"]))
              for e in l.get("evses") or []:
                  if not isinstance(e,dict): continue
                  evses+=1; st=str(e.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  for c in e.get("connectors") or []:
                      if not isinstance(c,dict): continue
                      connectors+=1
                      for tid in c.get("tariff_ids") or []: linked.add(str(tid))
          s3={"uuids":used,"locations":len(locs),"evses":evses,"connectors":connectors,"tariffs":len(tariffs),
              "partyIdsObserved":sorted(parties),"evseStatuses":statuses,"missingTariffIds":sorted(linked-tids),
              "failures":failures,"status":"complete" if locs and not failures and not (linked-tids) else "partial"}
          summary["3ti"]=s3
          with gzip.open("data/national/uk_3ti_fuuse.json.gz","wt",encoding="utf-8") as g:
              json.dump({"retrievedAt":now,"locations":locs,"tariffs":tariffs},g,ensure_ascii=False,separators=(",",":"))

          # ParkRecharge: public web app exposes this read key + endpoint in env.js.
          key="HUhggAh56wVW1px698UjlS2iWHXduNsT"
          url="https://hubeleon.io/devices/?format=json&key="+urllib.parse.quote(key)+"&data=full"
          pr={"url":"https://hubeleon.io/devices/?format=json&key=<public-webapp-key>&data=full"}
          try:
              p,st,h=get_json(url)
              pr["httpStatus"]=st; pr["payloadType"]=type(p).__name__
              if isinstance(p,dict): pr["topLevelKeys"]=list(p)[:50]
              devices=arr(p)
              # Some Hubeleon responses use a dict of devices; preserve that shape too.
              if not devices and isinstance(p,dict):
                  for k,v in p.items():
                      if isinstance(v,list) and v and isinstance(v[0],dict) and ("DeviceDBID" in v[0] or "Connectors" in v[0]):
                          devices=v; pr["arrayKey"]=k; break
              pr["devices"]=len(devices)
              pubs=[]
              for d in devices:
                  if not isinstance(d,dict): continue
                  # public app response itself is already scoped to public/guest-visible devices.
                  pubs.append(d)
              pr["publicDevices"]=len(pubs)
              pr["sampleKeys"]=list(pubs[0])[:80] if pubs else []
              fees=0; conns=0; available=0
              orgs=set()
              for d in pubs:
                  if d.get("Organisation"): orgs.add(str(d.get("Organisation")))
                  if d.get("Fees"): fees+=1
                  cs=d.get("Connectors") or []
                  if isinstance(cs,list):
                      conns+=len(cs)
                      for wrapper in cs:
                          c=wrapper.get("connector") if isinstance(wrapper,dict) else None
                          if isinstance(c,dict) and str(c.get("ConnectorStatus") or "").lower()=="available": available+=1
              pr.update({"connectors":conns,"availableConnectors":available,"devicesWithFees":fees,"organisations":sorted(orgs),
                         "status":"complete_public_app_surface" if pubs else "empty"})
              with gzip.open("data/national/uk_parkrecharge_public_devices.json.gz","wt",encoding="utf-8") as g:
                  json.dump({"retrievedAt":now,"source":pr["url"],"devices":pubs},g,ensure_ascii=False,separators=(",",":"))
          except Exception as e:
              pr.update({"status":"failed","error":f"{type(e).__name__}: {e}"})
          summary["ParkRecharge"]=pr

          Path("reports/uk/3ti-parkrecharge-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if s3["status"]!="complete" or pr["status"]=="failed": raise SystemExit(2)
          PY
      - name: Publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/3ti-parkrecharge-latest.json data/national/uk_3ti_fuuse.json.gz data/national/uk_parkrecharge_public_devices.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect 3ti and ParkRecharge public surfaces [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
