name: Probe Alize public map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-alize-public-map.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public map API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alize reports/france/alize
          curl -fLsS --retry 3 https://alize-map.azurewebsites.net/ -o /tmp/alize/index.html
          MAIN=$(grep -Eo 'main\.[a-z0-9]+\.js' /tmp/alize/index.html | head -1)
          curl -fLsS --retry 3 "https://alize-map.azurewebsites.net/$MAIN" -o /tmp/alize/main.js
          python - <<'PY'
          import pathlib,re,json,subprocess
          js=pathlib.Path('/tmp/alize/main.js').read_text(errors='ignore')
          needles=['/drive/markers','/drive/detail','drive-api.plugsurfing.com/drive/v1/geosearch/radius','price_components']
          contexts={}
          for n in needles:
              arr=[]
              for m in re.finditer(re.escape(n),js): arr.append(js[max(0,m.start()-1500):min(len(js),m.end()+1500)])
              contexts[n]=arr[:10]
          pathlib.Path('reports/france/alize/bundle-context.json').write_text(json.dumps(contexts,ensure_ascii=False,indent=2)+'\n')
          PY
          API='https://alize-map-api-faezg8gfgjfngab9.francecentral-01.azurewebsites.net'
          for spec in 'markers:/drive/markers' 'detail:/drive/detail'; do
            name=${spec%%:*}; path=${spec#*:}
            for method in GET POST OPTIONS; do
              code=$(curl -sS -o "/tmp/alize/${name}-${method}.txt" -w '%{http_code}' -X "$method" -H 'content-type: application/json' --data '{}' "$API$path" || true)
              echo "$name $method $code $(wc -c < /tmp/alize/${name}-${method}.txt) bytes"
            done
          done
          python - <<'PY'
          import pathlib,json
          out={}
          for p in pathlib.Path('/tmp/alize').glob('*-*.txt'):
              out[p.name]=p.read_text(errors='ignore')[:20000]
          pathlib.Path('reports/france/alize/api-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish probe reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/alize/
          git commit -m 'France Alize: publish API endpoint probe' || exit 0
          git push
