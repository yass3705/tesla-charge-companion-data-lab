name: Fastned Direct station inventory France

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/fastned_station_inventory.py"
      - "tests/test_fastned_station_inventory.py"
      - ".github/workflows/fastned-direct-station-inventory.yml"

permissions:
  contents: write

concurrency:
  group: fastned-direct-station-inventory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: python -m unittest tests/test_fastned_station_inventory.py -v

      - name: Build official Fastned France map
        run: python scripts/fastned_station_inventory.py

      - name: Validate generated map
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          path=Path('data/national/fastned_direct_stations_france.json.gz')
          with gzip.open(path,'rt',encoding='utf-8') as handle:
              p=json.load(handle)
          assert p['dataset']=='fastned-direct-operated-stations-france'
          assert p['operator']=='Fastned' and p['country']=='FR'
          scope=p['scope']
          assert scope['officialFastnedLocationPagesOnly'] is True
          assert scope['onlyFastnedCpoLocations'] is True
          assert scope['partnerOperatorLocationsIncluded'] is False
          assert scope['liveStatusIncluded'] is False
          assert scope['subscriptionTariffIncluded'] is True
          assert scope['subscriptionId']=='fastned-gold'
          assert scope['fastnedDiscountsApplyAtPartnerOperators'] is False
          assert scope['roamingTariffsIncluded'] is False
          locations=p['locations']
          assert 50 <= len(locations) <= 120, len(locations)
          assert p['counts']['franceLocationCount']==len(locations)
          assert p['counts']['candidateLocationPageCount'] >= 300
          assert len({x['stationId'] for x in locations})==len(locations)
          assert all(x['country']=='FR' for x in locations)
          assert all(41 <= x['latitude'] <= 52 and -6 <= x['longitude'] <= 10.5 for x in locations)
          assert all(x['chargingPoints'] > 0 and x['maxPowerKw'] >= 50 for x in locations)
          profiles={x['id']:x for x in p['pricingProfiles']}
          app=profiles['fastned-app-direct']; std=profiles['fastned-standard']; gold=profiles['fastned-gold']
          assert app['subscriptionRequired'] is False and std['subscriptionRequired'] is False
          assert gold['subscriptionRequired'] is True and gold['subscriptionId']=='fastned-gold'
          assert 0.10 <= gold['pricePerKwhEur'] <= app['pricePerKwhEur'] <= std['pricePerKwhEur'] <= 2.0
          assert abs(app['pricePerKwhEur']-round(std['pricePerKwhEur']*0.9,3)) < 1e-9
          assert all(abs(x['stationStandardEurPerKwh']-std['pricePerKwhEur']) < 0.001 for x in locations)
          assert all(abs(x['stationGoldEurPerKwh']-gold['pricePerKwhEur']) < 0.001 for x in locations)
          print(p['counts'])
          print(p['pricingProfiles'])
          PY

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Publish updated map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/fastned_direct_stations_france.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(fastned): publish Direct France station inventory [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
