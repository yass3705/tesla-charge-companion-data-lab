name: UK Connekt APK static inspect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-connekt-apk-static-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download and inspect Connekt Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/connekt
          curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/com.connektcharging.getconnekted?version=latest"             -o /tmp/connekt/app.xapk
          unzip -q /tmp/connekt/app.xapk -d /tmp/connekt/x
          mkdir -p /tmp/connekt/apks
          for apk in /tmp/connekt/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/connekt/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"
            unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os
          from pathlib import Path
          from datetime import datetime,timezone
          urls=set(); hosts=set(); strings=[]
          needles=["api","ocpi","location","tariff","charger","station","graphql","socket","token","guest","anonymous","baseurl","base_url"]
          for fn in glob.glob("/tmp/connekt/apks/**/*",recursive=True):
            if not os.path.isfile(fn): continue
            try:
              if os.path.getsize(fn)>45_000_000: continue
              b=open(fn,"rb").read()
            except Exception: continue
            for raw in re.findall(rb'[ -~]{12,500}',b):
              try:s=raw.decode("utf-8","ignore")
              except:continue
              sl=s.lower()
              if "http" in sl:
                for u in re.findall(r'https?://[^\s"\'<>]{5,400}',s):
                  if any(k in u.lower() for k in needles): urls.add(u)
              if any(k in sl for k in needles) and ("http" in sl or "/api" in sl or "/v1/" in sl or "baseurl" in sl):
                strings.append({"file":fn.replace("/tmp/connekt/apks/",""),"text":s})
            for h in re.findall(rb'(?i)([a-z0-9][a-z0-9.-]+\.(?:com|co\.uk|uk|io|app|net|eu|cloud))',b):
              try:
                hs=h.decode().lower()
                if any(k in hs for k in ("connekt","api","charge","ocpi","firebase","monta","fuuse","amp","virta","greenflux","driivz")): hosts.add(hs)
              except: pass
          # dedupe useful strings
          seen=set(); sel=[]
          for x in strings:
            k=x["text"][:240]
            if k in seen: continue
            seen.add(k); sel.append(x)
            if len(sel)>=600: break
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"package":"com.connektcharging.getconnekted",
               "urls":sorted(urls)[:800],"hosts":sorted(hosts)[:400],"strings":sel}
          Path("reports/uk/connekt-apk-static-inspect-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"urls":out["urls"],"hosts":out["hosts"],"strings":sel[:220]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/uk/connekt-apk-static-inspect-latest.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/connekt-apk-static-inspect-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Connekt Android app statically [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
