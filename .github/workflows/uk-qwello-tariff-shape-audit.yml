name: UK Qwello tariff shape audit
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/uk-qwello-tariff-shape-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect UK row shape
        run: |
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          url="https://tariff-locations-file-production.s3.eu-central-1.amazonaws.com/tariff-view.json"
          req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r: rows=json.loads(r.read().decode())
          uk=[x for x in rows if isinstance(x,dict) and (str(x.get("country") or "").upper() in ("GB","UK","UNITED KINGDOM") or any(str(i).upper().startswith("GB") for i in (x.get("id") or [])))]
          sample=uk[0] if uk else {}
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"ukRows":len(uk),
               "topKeys":list(sample.keys()),"tariffKeys":list((sample.get("tariff") or {}).keys()),
               "hasLatitude":any(k.lower() in ("latitude","lat") for k in sample),
               "hasLongitude":any(k.lower() in ("longitude","lng","lon") for k in sample),
               "sampleWithoutTariff":{k:v for k,v in sample.items() if k!="tariff"}}
          Path("reports/uk/qwello-tariff-shape-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/qwello-tariff-shape-latest.json
          git commit -m "diag(uk): audit Qwello tariff row shape [run ${GITHUB_RUN_ID}]" || exit 0
          for attempt in 1 2 3; do git pull --rebase origin main; git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
