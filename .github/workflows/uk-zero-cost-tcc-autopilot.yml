name: UK zero-cost TCC autopilot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/uk_zero_cost_autopilot.py"
      - ".github/workflows/uk-zero-cost-tcc-autopilot.yml"

permissions:
  contents: write

concurrency:
  group: uk-tcc-state-writer
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run one deterministic UK step
        id: autopilot
        shell: bash
        run: |
          set +e
          python scripts/uk_zero_cost_autopilot.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist state, report and validated datasets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve exactly the files generated by this run, then rebase the
          # publication step onto the latest main without trying to merge
          # machine-generated snapshots. This avoids conflicts with manual
          # snapshots or other concurrent low-impact writes.
          tmpdir="$(mktemp -d)"
          files=(
            reports/uk/autopilot-state.json
            reports/uk/autopilot-latest.json
            reports/uk/autopilot-latest.md
            reports/uk/canonical-reconcile-latest.json
            reports/uk/validated-open-feeds-latest.json
            reports/uk/fastned-direct-uk-latest.json
            reports/uk/ionity-direct-uk-latest.json
            reports/uk/lidl-official-pricing-latest.json
            data/national/uk_lidl_official_pricing.json
            data/national/uk_validated_open_feeds.json.gz
            data/national/fastned_direct_stations_uk.json.gz
            data/national/ionity_direct_stations_uk.json.gz
          )

          canonical="docs/uk-cpo-progress-2026-09.json"
          if ! git diff --quiet -- "$canonical"; then
            files+=("$canonical")
          fi

          changed=0
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp -p "$p" "$tmpdir/$p"
              if ! git diff --quiet -- "$p" || ! git diff --cached --quiet -- "$p"; then
                changed=1
              fi
            fi
          done

          # Even when git diff is clean, report/state may have been freshly
          # generated to the same bytes. In that case there is nothing to publish.
          if [ "$changed" -eq 0 ]; then
            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No persisted change: idle run."
              exit 0
            fi
          fi

          git fetch origin main
          git reset --hard origin/main

          for p in "${files[@]}"; do
            if [ -f "$tmpdir/$p" ]; then
              mkdir -p "$(dirname "$p")"
              cp -p "$tmpdir/$p" "$p"
            fi
          done

          git add "${files[@]}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Generated state already present on latest main."
            exit 0
          fi

          git commit -m "chore(uk): zero-cost autopilot checkpoint [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main

      - name: Surface deterministic failure
        if: steps.autopilot.outputs.rc != '0'
        run: |
          echo "The UK deterministic worker recorded a failed task. State/report were preserved." >&2
          exit 1
