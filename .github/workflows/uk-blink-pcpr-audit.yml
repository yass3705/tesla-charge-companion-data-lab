name: UK Blink PCPR exact connector validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/uk-blink-pcpr-audit.yml
      - scripts/uk_blink_pcpr_validate.py
permissions:
  contents: write
concurrency:
  group: uk-blink-pcpr-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independent source and tariff verification
        run: python3 scripts/uk_blink_pcpr_validate.py
      - name: Publish audited source evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(mktemp)"
          cp reports/uk/blink-pcpr-validation-latest.json "$evidence"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$evidence" reports/uk/blink-pcpr-validation-latest.json
            git add reports/uk/blink-pcpr-validation-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(uk): attest Blink exact CPO connector prices [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((n * 2))"
          done
          exit 1
