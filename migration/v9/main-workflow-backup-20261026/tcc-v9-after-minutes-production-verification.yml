name: TCC V9 official deferred fee and cap production verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_after_minutes_production_20261011.cjs
      - .github/workflows/tcc-v9-after-minutes-production-verification.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable current-production engine and direct subscriptions
        env:
          TCC_SHA: ae2dd2537737a2d0d73d7893214bedcb873746d2
        run: |
          set -euo pipefail
          mkdir -p /tmp/tcc-pricing
          origin="https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/$TCC_SHA"
          curl -fsSL --retry 3 --connect-timeout 10 "$origin/v9-production-runtime/assets/v9/pricing-engine.js" -o /tmp/tcc-pricing/engine.js
          curl -fsSL --retry 3 --connect-timeout 10 "$origin/v9-production-runtime/data/v9/france-direct-offers.json" -o /tmp/tcc-pricing/direct.json
          curl -fsSL --retry 3 --connect-timeout 10 "$origin/v9-production-runtime/data/v9/france-emsp-offers.json" -o /tmp/tcc-pricing/emsp.json
          node --check /tmp/tcc-pricing/engine.js
          node --check scripts/audit_after_minutes_production_20261011.cjs
      - name: Run official tariff and 84-offer risk controls without production changes
        run: |
          node scripts/audit_after_minutes_production_20261011.cjs /tmp/tcc-pricing/engine.js /tmp/tcc-pricing/direct.json /tmp/tcc-pricing/emsp.json
      - name: Save report artifact even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-after-minutes-official-qa
          path: reports/tariff-scenarios/after-minutes-production-verification-2026-10-11.json
          if-no-files-found: warn
      - name: Archive passing report only
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/after-minutes-production-verification-2026-10-11.json /tmp/tcc_afterminutes_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tcc_afterminutes_report.json reports/tariff-scenarios/after-minutes-production-verification-2026-10-11.json
            git add reports/tariff-scenarios/after-minutes-production-verification-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(pricing): record official 84-offer after-minute engine regression'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
