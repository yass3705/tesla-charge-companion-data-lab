name: Powerdot ID mapping probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/powerdot-id-mapping-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download national IRVE
        run: |
          mkdir -p tmp reports data/national
          curl -fL --retry 3 'https://www.data.gouv.fr/api/1/datasets/r/eb76d20a-8501-400e-b336-d85724de5435' -o tmp/irve.csv
      - name: Compare known QR codes with IRVE identifiers
        run: |
          python - <<'PY'
          import csv, gzip, json, re, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          known = {
              'champniers': 'MRB_CHP_KPC20001',
              'soustons': 'NET_SST_KPS20001',
          }
          path = Path('tmp/irve.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as fh:
              sample = fh.read(65536); fh.seek(0)
              try: dialect = csv.Sniffer().sniff(sample, delimiters=',;\t')
              except Exception: dialect = csv.excel
              reader = csv.DictReader(fh, dialect=dialect)
              fields = list(reader.fieldnames or [])
              powerdot = []
              matches = {'champniers': [], 'soustons': []}
              for row in reader:
                  blob = ' '.join(str(v or '') for v in row.values()).lower()
                  operator_blob = ' '.join(str(row.get(k) or '') for k in ['nom_operateur','n_operateur','nom_amenageur','n_amenageur','nom_enseigne','n_enseigne']).lower().replace(' ','')
                  if 'powerdot' not in operator_blob:
                      continue
                  powerdot.append(row)
                  if 'champniers' in blob or ('mr' in blob and 'bricolage' in blob and '16430' in blob):
                      matches['champniers'].append(row)
                  if 'soustons' in blob or ('netto' in blob and '40140' in blob):
                      matches['soustons'].append(row)

          def pick(row):
              keys = ['nom_station','n_station','adresse_station','ad_station','id_station_itinerance','id_station_local','id_pdc_itinerance','id_pdc_local','puissance_nominale','puiss_max','tarification','nom_operateur','n_operateur']
              return {k: row.get(k) for k in keys if k in row and row.get(k) not in (None,'')}

          def fetch(url, limit=1500000):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 TCC-Powerdot-probe'})
              try:
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      return {'status':resp.status,'finalUrl':resp.geturl(),'contentType':resp.headers.get('content-type',''),'body':resp.read(limit),'error':None}
              except urllib.error.HTTPError as e:
                  try: body=e.read(200000)
                  except Exception: body=b''
                  return {'status':e.code,'finalUrl':url,'contentType':e.headers.get('content-type','') if e.headers else '','body':body,'error':None}
              except Exception as e:
                  return {'status':None,'finalUrl':url,'contentType':'','body':b'','error':repr(e)}

          qr = {}
          assets = []
          for key, code in known.items():
              url = 'https://qrcode-manager.powerdot-ev.com/' + code
              result = fetch(url)
              html = result['body'].decode('utf-8','replace')
              qr[key] = {
                  'code':code,'status':result['status'],'finalUrl':result['finalUrl'],
                  'contentType':result['contentType'],'length':len(result['body']),'error':result['error'],
                  'htmlPricingTerms':bool(re.search(r'(?i)price|pricing|tariff|tarif|kwh|eur|€',html)),
                  'scripts':re.findall(r'''(?is)<script[^>]+src=["']([^"']+)''',html)[:20],
              }
              for src in qr[key]['scripts'][:10]:
                  asset_url=urljoin(result['finalUrl'] or url,src)
                  ar=fetch(asset_url,2000000)
                  js=ar['body'].decode('utf-8','replace')
                  api_urls=sorted(set(re.findall(r'''https?://[^"'\s)]+''',js)))
                  api_urls=[u for u in api_urls if any(x in u.lower() for x in ['api','price','tariff','powerdot','charge'])]
                  snippets=[]
                  for m in re.finditer(r'(?i)price|pricing|tariff|tarif|connector|evse',js):
                      s=re.sub(r'\s+',' ',js[max(0,m.start()-100):min(len(js),m.end()+180)])
                      if s not in snippets: snippets.append(s)
                      if len(snippets)>=20: break
                  assets.append({'known':key,'url':asset_url,'status':ar['status'],'length':len(ar['body']),'apiUrls':api_urls[:50],'snippets':snippets})

          station_ids = set()
          evse_ids = set()
          tariff_texts = set()
          for row in powerdot:
              for key in ['id_station_itinerance','id_station_local']:
                  if row.get(key): station_ids.add(row[key])
              for key in ['id_pdc_itinerance','id_pdc_local']:
                  if row.get(key): evse_ids.add(row[key])
              if row.get('tarification'): tariff_texts.add(row['tarification'])

          payload = {
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'source':'data.gouv IRVE 2026-08-25',
              'operator':'Power Dot France',
              'counts':{'rows':len(powerdot),'stationIds':len(station_ids),'evseIds':len(evse_ids),'tarificationTexts':len(tariff_texts)},
              'csvFields':fields,
              'knownMatches':{k:[pick(r) for r in v] for k,v in matches.items()},
              'knownQr':qr,
              'assetFindings':assets,
              'tarificationTexts':sorted(tariff_texts)[:100],
          }
          with gzip.open('data/national/powerdot_id_mapping_probe.json.gz','wt',encoding='utf-8') as fh:
              json.dump(payload,fh,ensure_ascii=False,indent=2)

          report=['# Powerdot ID mapping probe','',f"Powerdot rows: {len(powerdot)}",f"Station IDs: {len(station_ids)}",f"EVSE IDs: {len(evse_ids)}",f"Unique IRVE tarification texts: {len(tariff_texts)}",'']
          for key in ['champniers','soustons']:
              report += [f"## {key}",f"Known QR: {known[key]}",f"QR HTTP: {qr[key]['status']} final={qr[key]['finalUrl']} len={qr[key]['length']}",'IRVE rows:']
              for row in payload['knownMatches'][key]: report.append('- '+json.dumps(row,ensure_ascii=False))
              report.append('')
          report += ['## Frontend/API findings','']
          for asset in assets:
              report.append(f"- {asset['url']} HTTP={asset['status']} len={asset['length']}")
              for u in asset['apiUrls'][:10]: report.append('  - URL '+u)
              for s in asset['snippets'][:4]: report.append('  - '+s[:350])
          Path('reports/powerdot_id_mapping_probe.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print(json.dumps(payload['counts'],indent=2))
          print('champniers matches',len(matches['champniers']),'soustons matches',len(matches['soustons']))
          print('QR statuses',{k:v['status'] for k,v in qr.items()})
          PY
      - name: Publish results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/powerdot_id_mapping_probe.md data/national/powerdot_id_mapping_probe.json.gz
          git commit -m "data(powerdot): publish ID mapping probe [run ${GITHUB_RUN_ID}]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
