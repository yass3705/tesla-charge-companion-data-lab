name: UK ChargePoint residual classification

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargepoint-residual-classification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Classify unpriced ChargePoint sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import json,gzip
          from pathlib import Path
          from collections import Counter,defaultdict
          from datetime import datetime,timezone

          residual=json.loads(Path("reports/uk/chargepoint-shell-full-latest.json").read_text())["noTariffUids"]
          with gzip.open("data/national/uk_chargepoint_shell_tariffs.json.gz","rt",encoding="utf-8") as g:
              ds=json.load(g)
          byuid={x["uid"]:x for x in ds.get("locations",[])}

          rows=[]
          for uid in residual:
              row=byuid.get(uid,{})
              evses=row.get("evseIds") or []
              rows.append({
                  "uid":uid,
                  "httpStatus":row.get("httpStatus"),
                  "connectorCount":row.get("connectorCount",0),
                  "evseIds":evses,
                  "evsePrefixes":sorted(set((e.split("*")[0]+"*"+e.split("*")[1]) if isinstance(e,str) and e.count("*")>=1 else str(e) for e in evses))
              })

          # Also inspect the source Shell inventory metadata, which is richer than the tariff derivative.
          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)
          invby={}
          for x in inv.get("locations",[]):
              uid=str(x.get("uid") or x.get("externalId") or "")
              if uid: invby[uid]=x

          metaKeys=Counter()
          opNames=Counter(); subOps=Counter(); access=Counter(); auth=Counter(); status=Counter()
          enriched=[]
          for r in rows:
              x=invby.get(r["uid"],{})
              for k in x: metaKeys[k]+=1
              opNames[str(x.get("operatorName"))]+=1
              subOps[str(x.get("subOperatorName"))]+=1
              for k in ("accessType","access","parkingType","locationType","type"):
                  if x.get(k) is not None: access[f"{k}={x.get(k)}"]+=1
              for k in ("authenticationMethods","authMethods","paymentMethods"):
                  v=x.get(k)
                  if isinstance(v,list):
                      for a in v: auth[str(a)]+=1
                  elif v is not None: auth[str(v)]+=1
              for k in ("status","availability"):
                  if x.get(k) is not None: status[f"{k}={x.get(k)}"]+=1
              enriched.append({"uid":r["uid"],"tariffRow":r,"inventory":x})

          out={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "residualCount":len(rows),
              "inventoryMatched":sum(1 for x in enriched if x["inventory"]),
              "operatorNames":dict(opNames),
              "subOperatorNames":dict(subOps),
              "accessSignals":dict(access),
              "authenticationSignals":dict(auth),
              "statusSignals":dict(status),
              "inventoryMetadataKeys":dict(metaKeys),
              "rows":enriched
          }
          Path("reports/uk/chargepoint-residual-classification-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({
              "residualCount":out["residualCount"],
              "inventoryMatched":out["inventoryMatched"],
              "operatorNames":out["operatorNames"],
              "subOperatorNames":out["subOperatorNames"],
              "accessSignals":out["accessSignals"],
              "authenticationSignals":out["authenticationSignals"],
              "statusSignals":out["statusSignals"],
              "topMetadataKeys":dict(metaKeys.most_common(30))
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/uk/chargepoint-residual-classification-latest.json /tmp/chargepoint-residual-classification-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/chargepoint-residual-classification-latest.json reports/uk/chargepoint-residual-classification-latest.json
            git add reports/uk/chargepoint-residual-classification-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): classify ChargePoint unpriced residuals [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
