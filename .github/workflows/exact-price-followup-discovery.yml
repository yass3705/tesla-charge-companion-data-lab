name: Exact price follow-up discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/freshmile_route_semantics_probe.py"
      - "scripts/powerdot_public_qr_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/exact-price-followup-discovery.yml"

permissions:
  contents: write

concurrency:
  group: exact-price-followup-discovery
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Compile probes
        run: |
          python -m py_compile scripts/freshmile_route_semantics_probe.py
          python -m py_compile scripts/powerdot_public_qr_probe.py

      - name: Final Freshmile public route probe
        run: |
          python scripts/freshmile_route_semantics_probe.py
          cat out/exact-price-stage4/freshmile/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Powerdot public QR discovery
        run: |
          python scripts/powerdot_public_qr_probe.py
          cat out/exact-price/powerdot/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate sanitized outputs
        run: |
          python scripts/public_safety_check.py out
          python - <<'PY'
          import json
          from pathlib import Path
          fm=json.loads(Path('out/exact-price-stage4/freshmile/freshmile_public_exact_price_stage4.json').read_text())
          pd=json.loads(Path('out/exact-price/powerdot/powerdot_public_qr_probe.json').read_text())
          assert fm['method']['authenticated'] is False
          assert fm['method']['mobilePackageUsed'] is False
          assert fm['method']['httpMethods'] == ['GET']
          assert pd['method']['authenticated'] is False
          assert pd['method']['paymentSubmitted'] is False
          assert pd['method']['chargingSessionStarted'] is False
          assert pd['method']['qrImageDecoded'] is False
          assert pd['method']['httpMethods'] == ['GET']
          print('Freshmile:', fm['conclusion'])
          print('Powerdot:', pd['conclusion'])
          PY

      - name: Publish sanitized reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/exact-price-stage4 reports/exact-price
          cp out/exact-price-stage4/freshmile/freshmile_public_exact_price_stage4.json reports/exact-price-stage4/freshmile_latest.json
          cp out/exact-price/powerdot/powerdot_public_qr_probe.json reports/exact-price/powerdot_latest.json
          python scripts/public_safety_check.py reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact-price-stage4/freshmile_latest.json reports/exact-price/powerdot_latest.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "data(pricing): publish Freshmile Powerdot follow-up discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
