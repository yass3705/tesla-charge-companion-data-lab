name: Build Vianeo official identity replay
on:
  push:
    branches:
      - electroverse-via-official-direct-lab-v2
    paths:
      - "scripts/build_vianeo_official_identity_map.mjs"
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - "data/operator_direct/vianeo_official_identity_map.json"
      - ".github/workflows/vianeo-official-identity-replay.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Persisted validation pass.
      - name: Refresh Vianeo official identity map
        run: node --max-old-space-size=4096 scripts/build_vianeo_official_identity_map.mjs
      - name: Build Electroverse France overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare replay against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
      - name: Persist replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/vianeo_official_identity_map.json reports/electroverse-fr-via-official-identity-audit.json data/platforms/electroverse/france-evse
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "lab: publish Vianeo official identity replay"
            git pull --rebase origin electroverse-via-official-direct-lab-v2
            git push
          fi
