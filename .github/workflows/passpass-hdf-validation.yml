name: Hauts-de-France Pass Pass validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/passpass_hdf_official.py"
      - ".github/workflows/passpass-hdf-validation.yml"

permissions:
  contents: write

concurrency:
  group: hdf-passpass-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/passpass_hdf
          python -m py_compile scripts/passpass_hdf_official.py
          python scripts/passpass_hdf_official.py --out out/passpass_hdf 2> >(tee out/passpass_hdf/error.log >&2)
      - name: Validate tariff model
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/passpass_hdf/passpass_hdf_official.json').read_text())
          assert p['dataset']=='passpass-electrique-official-hdf'
          assert p['region']=='Hauts-de-France'
          assert p['effectiveFrom']=='2025-04-01'
          assert p['tariffs']['normal']['subscriber']['energyEurPerKwh']==0.32
          assert p['tariffs']['normal']['nonSubscriber']['energyEurPerKwh']==0.38
          assert p['tariffs']['rapid']['subscriber']['energyEurPerKwh']==0.44
          assert p['tariffs']['rapid']['nonSubscriber']['energyEurPerKwh']==0.51
          assert p['tariffs']['rapid']['subscriber']['freeConnectedMinutes']==90
          assert p['tariffs']['ultraRapid']['subscriber']['freeConnectedMinutes']==45
          assert p['tariffs']['longStay']['subscriber']['freeConnectedMinutes']==840
          assert p['tccDecision']['networkRulesClassable'] is True
          assert p['tccDecision']['stationDisplayedTariffHasPriority'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/passpass_hdf
          cp out/passpass_hdf/passpass_hdf_official.json data/operator_direct/passpass_hdf_official.json
          cp out/passpass_hdf/SUMMARY.md reports/passpass_hdf/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/passpass_hdf_official.json reports/passpass_hdf/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(hdf): publish Pass Pass official tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/passpass_hdf
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/passpass_hdf/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/passpass_hdf/latest_diagnostic.json').write_text(json.dumps({'dataset':'passpass-hdf-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/passpass_hdf
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/passpass_hdf/latest_run_status.json').write_text(json.dumps({'dataset':'passpass-hdf-run-status','operator':'Pass Pass Electrique','region':'Hauts-de-France','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/passpass_hdf/latest_run_status.json reports/passpass_hdf/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(passpass-hdf): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
