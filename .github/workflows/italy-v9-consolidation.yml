name: Italy V9 consolidated candidate

on:
  workflow_dispatch:
  push:
    branches:
      - research/italy-consolidation-v9-a2a
      - research/duferco-v9-national
    paths:
      - scripts/italy_consolidate_v9.py
      - scripts/duferco_italy_pun_direct.py
      - scripts/atlante_italy_official.py
      - scripts/atlante_italy_pun_overlay.py
      - scripts/atlante_go_chargeleague_italy_overlay.py
      - .github/workflows/italy-v9-consolidation.yml

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check selenium requests pypdf
      - name: Download latest successful normalized PUN artifact
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pun-italy-normalized.yml --branch research/pun-italy-normalized --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/pun data/national
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n pun-italy-normalized -D /tmp/pun
          cp /tmp/pun/national/pun_italy_national.json.gz data/national/pun_italy_national.json.gz
          test -s data/national/pun_italy_national.json.gz
          echo "Using PUN run $RUN_ID"
      - name: Download validated A2A national candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow a2a-italy-national-build.yml --branch research/a2a-italy-national --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/a2a data/reports
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n a2a-direct-italy-candidate -D /tmp/a2a
          cp /tmp/a2a/national/a2a_direct_stations_italy.json.gz data/national/a2a_direct_stations_italy.json.gz
          cp /tmp/a2a/reports/a2a_italy_national_report.json data/reports/a2a_italy_national_report.json
          test -s data/national/a2a_direct_stations_italy.json.gz
          echo "Using A2A run $RUN_ID"
      - name: Revalidate A2A against current PUN
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open('data/national/pun_italy_national.json.gz','rt',encoding='utf-8') as fh:pun=json.load(fh)
          with gzip.open('data/national/a2a_direct_stations_italy.json.gz','rt',encoding='utf-8') as fh:a2a=json.load(fh)
          pun_ids={str(e.get('evseId')) for e in pun.get('evses',[]) if str(e.get('partyId') or '').upper()=='A2M' and e.get('evseId')}
          direct={str(e.get('evseId')) for e in a2a.get('evses',[]) if e.get('rankableDirectTariff') is True and e.get('evseId')}
          coverage=len(pun_ids & direct)/len(pun_ids) if pun_ids else 0
          print(json.dumps({'punA2mEvse':len(pun_ids),'rankableA2aEvse':len(direct),'coverage':coverage},indent=2))
          assert direct <= pun_ids
          assert coverage >= .95
          PY
      - name: Download validated GES NextCharge eMSP candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ges-nextcharge-national-candidate.yml --branch research/ges-italy-probe --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/ges
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n nextcharge-ges-italy-national-candidate -D /tmp/ges
          cp /tmp/ges/national/nextcharge_ges_italy_candidate.json.gz data/national/nextcharge_ges_italy_candidate.json.gz
          cp /tmp/ges/reports/ges_nextcharge_italy_national_report.json data/reports/ges_nextcharge_italy_national_report.json
          test -s data/national/nextcharge_ges_italy_candidate.json.gz
          echo "Using GES NextCharge run $RUN_ID"
      - name: Build Plenitude candidate
        run: python scripts/plenitude_italy_apply.py
      - name: Build Duferco candidate
        run: python scripts/duferco_italy_pun_direct.py --pun data/national/pun_italy_national.json.gz
      - name: Validate current official Atlante Italy offers
        run: python scripts/atlante_italy_official.py
      - name: Build Atlante Go own-network overlay
        run: python scripts/atlante_italy_pun_overlay.py --pun data/national/pun_italy_national.json.gz
      - name: Build Atlante Go ChargeLeague overlay
        run: python scripts/atlante_go_chargeleague_italy_overlay.py --pun data/national/pun_italy_national.json.gz
      - name: Consolidate Italy V9 candidate
        run: python scripts/italy_consolidate_v9.py
      - name: Validate consolidated candidate
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          p=Path('data/consolidation/italy_v9_candidate.json.gz')
          assert p.exists() and p.stat().st_size > 100000
          with gzip.open(p,'rt',encoding='utf-8') as fh:
              d=json.load(fh)
          c=d['counts']
          own=json.loads(Path('data/reports/atlante_italy_pun_overlay_report.json').read_text())
          partners=json.loads(Path('data/reports/atlante_go_chargeleague_italy_report.json').read_text())
          ges=json.loads(Path('data/reports/ges_nextcharge_italy_national_report.json').read_text())
          duferco=json.loads(Path('data/reports/duferco_italy_pun_direct_report.json').read_text())
          print(json.dumps(c,ensure_ascii=False,indent=2))
          assert d['country'] == 'IT'
          assert d['backbone'] == 'GSE PUN'
          assert c['punEvseCount'] > 10000
          assert c['rankableDirectEvseCount'] > 25000
          assert c['rankableDirectByOperator'].get('Plenitude On The Road',0) > 5000
          assert c['rankableDirectByOperator'].get('A2A e-moving',0) > 100
          assert c['rankableDirectByOperator'].get('Duferco Mobility',0) == duferco['counts']['rankableDirectEvse']
          assert c['rankableDirectByOperator'].get('Duferco Mobility',0) > 1500
          assert duferco['counts']['powerCoveragePct'] == 100.0
          assert c['blockedReasons'].get('cross_operator_evse_conflict',0) == 0
          assert d['rules']['calendarAwareDirectTariffsSupported'] is True
          assert d['rules']['unknownStationSpecificPostChargeFeesFailClosed'] is True
          assert d['rules']['subscriptionTariffsRankableOnlyWhenSelected'] is True
          assert d['rules']['subscriptionTariffsNeverOverwriteDirectTariff'] is True
          assert d['subscriptions']['atlante_go']['italyAtlanteEurPerKwh'] == 0.49
          assert d['subscriptions']['atlante_go']['italyChargeLeagueEurPerKwh'] == 0.59
          assert all(own['qualityGates'].values())
          assert own['counts']['evse'] > 1000
          assert own['directPayAsYouGoRankable'] is False
          assert all(partners['qualityGates'].values())
          assert partners['counts']['byPartner']['Electra']['evse'] > 0
          assert partners['counts']['byPartner']['IONITY']['evse'] > 0
          assert c['rankableSelectedSubscriptionEvseCount'] >= own['counts']['evse']
          assert all(ges['qualityGates'].values())
          assert d['rules']['emspTariffsNeverMasqueradeAsCpoDirect'] is True
          assert d['emspProviders']['nextcharge']['notCpoDirect'] is True
          assert c['rankableEmspByProvider'].get('NextCharge',0) > 100
          assert c['rankableEmspEvseCount'] == ges['counts']['usableNextChargeEmspTariffEvse']
          PY
      - name: Upload consolidated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-v9-consolidated-candidate
          path: |
            data/consolidation/italy_v9_candidate.json.gz
            data/reports/italy_v9_consolidation_report.json
            data/reports/plenitude_italy_apply_report.json
            data/reports/a2a_italy_national_report.json
            data/reports/duferco_italy_pun_direct_report.json
            data/reference/atlante_italy_offers.json
            data/reports/atlante_italy_pun_overlay_report.json
            data/reports/atlante_go_chargeleague_italy_report.json
            data/reports/ges_nextcharge_italy_national_report.json
          retention-days: 14
