name: France IZIVIA station pricing probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-station-pricing.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate station exposing direct pricing identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia
          python - <<'PY'
          import json,subprocess,pathlib,uuid,urllib.parse,concurrent.futures
          base='https://fronts-map.izivia.com/api'; device=str(uuid.uuid4())
          common=['-sS','-A','Mozilla/5.0','-H','accept: application/json','-H','Accept-Language: fr','-H',f'x-device-id: {device}']
          def call(method,path,body=None):
              cmd=['curl',*common,'-w','\n%{http_code}','-X',method]
              if body is not None: cmd += ['-H','content-type: application/json','--data',json.dumps(body,separators=(',',':'))]
              cmd += [base+path]
              r=subprocess.run(cmd,capture_output=True,text=True)
              payload,status=r.stdout.rsplit('\n',1) if '\n' in r.stdout else (r.stdout,'')
              try:data=json.loads(payload)
              except:data=payload
              return int(status or 0),data
          ms,markers=call('POST','/map/markers',{'square':{'centerLat':48.8566,'centerLng':2.3522,'zoom':9},'filters':{}})
          markers=markers if isinstance(markers,list) else []
          def detail(m):
              st,d=call('POST',f"/charging-locations/{m['id']}",{'filters':{}})
              return m,st,d
          scanned=[]; selected=None
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for m,st,d in ex.map(detail,markers[:240]):
                  rec={'marker':m,'status':st,'legacyId':d.get('legacyId') if isinstance(d,dict) else None,'firstStationEmipId':d.get('firstStationEmipId') if isinstance(d,dict) else None,'name':d.get('name') if isinstance(d,dict) else None}
                  scanned.append(rec)
                  if rec['legacyId'] is not None and rec['firstStationEmipId']:
                      selected=(m,d);break
          out={'markersStatus':ms,'markerCount':len(markers),'scannedCount':len(scanned),'legacyIdFound':selected is not None,'scanned':scanned[:80]}
          if selected:
              m,d=selected; legacy=d['legacyId'];emip=d['firstStationEmipId']
              q=urllib.parse.urlencode({'legacyId':legacy,'stationEmipId':emip})
              ps,p=call('GET',f"/charging-locations/{m['id']}/pricing-info-items?{q}")
              out['selected']={'id':m['id'],'name':d.get('name'),'legacyId':legacy,'firstStationEmipId':emip,'detailKeys':list(d)}
              out['pricingStatus']=ps;out['pricing']=p
          pathlib.Path('reports/france/izivia/station-pricing-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='scanned'},ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/izivia/station-pricing-probe.json
          git commit -m 'France IZIVIA: publish direct pricing station probe' || exit 0
          git pull --rebase origin main
          git push
