name: Switzerland IONITY missing national context
on:
  push:
    paths:
      - 'scripts/probe_swiss_ionity_missing_national.py'
      - '.github/workflows/switzerland-ionity-missing-context.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/probe_swiss_ionity_missing_national.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-ionity-national-missing-context-2026-09-28.json
          git commit -m 'docs(switzerland): inspect missing IONITY national EVSE context' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
