name: UK Zest auth flow static audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-zest-auth-flow-static-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract Zest auth and API contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/zest
          curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/com.uk.zest.app?version=latest"             -o /tmp/zest/app.xapk
          unzip -q /tmp/zest/app.xapk -d /tmp/zest/x
          mkdir -p /tmp/zest/apks
          for apk in /tmp/zest/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/zest/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"
            unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os
          from pathlib import Path
          from datetime import datetime,timezone

          needles=[
            "v1/locations","v1/consumers","login","signin","sign-in","token","bearer",
            "guest","anonymous","firebase","appcheck","app-check","authorization",
            "client_id","client_secret","openid","oauth","migrationActivate","register"
          ]
          contexts=[]
          strings=[]
          for fn in glob.glob("/tmp/zest/apks/**/*",recursive=True):
            if not os.path.isfile(fn): continue
            try:
              if os.path.getsize(fn)>45_000_000: continue
              b=open(fn,"rb").read()
            except Exception: continue
            printable=re.findall(rb'[ -~]{20,700}',b)
            for raw in printable:
              try: s=raw.decode("utf-8","ignore")
              except Exception: continue
              sl=s.lower()
              if any(n.lower() in sl for n in needles):
                strings.append({"file":fn.replace("/tmp/zest/apks/",""),"text":s})
          # keep high-signal strings
          def score(x):
            s=x["text"].lower()
            return sum(3 if n in ("v1/locations","v1/consumers","bearer","authorization","client_id","oauth","openid","guest","anonymous") and n in s else 1 if n in s else 0 for n in [k.lower() for k in needles])
          strings=sorted(strings,key=score,reverse=True)
          seen=set(); selected=[]
          for x in strings:
            t=x["text"]
            key=t[:250]
            if key in seen: continue
            seen.add(key); selected.append(x)
            if len(selected)>=500: break
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"package":"com.uk.zest.app","strings":selected}
          Path("reports/uk/zest-auth-flow-static-audit-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"top":selected[:220]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/zest-auth-flow-static-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit Zest auth flow statically [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
