name: UK Osprey API route extract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-osprey-api-route-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract Osprey portal API route literals
        run: |
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          url="https://account.ospreycharging.co.uk/assets/index.418e1aeb.js"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/javascript,*/*"})
          with urllib.request.urlopen(req,timeout=90) as r: txt=r.read().decode("utf-8","replace")
          terms=("charger","station","location","map","tariff","price","connector","evse","site","search")
          findings=[]
          seen=set()
          # Literal strings and template fragments around likely API calls/routes.
          for m in re.finditer(r'["\x60]([^"\x60]{1,180})["\x60]',txt):
              s=m.group(1)
              if any(t in s.lower() for t in terms) and ("/" in s or "?" in s):
                  ctx=txt[max(0,m.start()-300):min(len(txt),m.end()+500)]
                  if any(k in ctx for k in (".get(", ".post(", ".request(", "rt.", "axios", "baseURL")):
                      rec={"literal":s,"context":ctx}
                      key=s+"|"+ctx[:100]
                      if key not in seen: seen.add(key); findings.append(rec)
          # Explicit relative paths embedded anywhere.
          for pat in [r'/(?:chargers?|stations?|locations?|sites?|tariffs?|prices?|connectors?|evses?)[A-Za-z0-9_/?&=.:{}$-]*']:
              for m in re.finditer(pat,txt,re.I):
                  s=m.group(0)
                  rec={"route":s,"context":txt[max(0,m.start()-250):min(len(txt),m.end()+450)]}
                  key="route:"+s
                  if key not in seen: seen.add(key); findings.append(rec)
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"baseURL":"https://apigw.ospreycharging.co.uk/portal","asset":url,"findings":findings[:1500]}
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/osprey-api-route-extract-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"findings":len(findings)},indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/osprey-api-route-extract-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): extract Osprey portal API routes [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
