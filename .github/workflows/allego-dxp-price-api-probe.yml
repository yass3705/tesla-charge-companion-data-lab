name: Allego DXP price API probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/allego-dxp-price-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe direct Allego DXP chargepoint price API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          BASE='https://p-dxp-api-acg8edbwd7g2eheg.a01.azurefd.net/api/dxp/poi/chargepoints'
          for ID in \
            FRALLEGO800130 FRALLEGO8001301 \
            FRALLEGO800990 FRALLEGO8009901 \
            FRALLEGO900108 FRALLEGO9001081 \
            FRALLEGO999088 FRALLEGO9990881 \
            FRALLEGO800261 FRALLEGO8002611; do
            echo "===== $ID ====="
            curl -sS -L --max-time 20 \
              -A 'Mozilla/5.0' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Origin: https://app.allego.eu' \
              -H 'Referer: https://app.allego.eu/' \
              -D "probe/${ID}.headers" "$BASE/$ID" -o "probe/${ID}.body" || true
            sed -n '1,30p' "probe/${ID}.headers" || true
            echo '--- body ---'
            head -c 12000 "probe/${ID}.body" || true
            echo
          done

      - name: Parse returned tariff structures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          summary=[]
          for p in sorted(Path('probe').glob('*.body')):
              raw=p.read_text(errors='replace')
              row={'id':p.stem,'bytes':len(raw.encode())}
              try:
                  obj=json.loads(raw)
                  row['json']=True
                  row['topType']=type(obj).__name__
                  # Keep a compact field/path inventory for tariff-related keys.
                  hits=[]
                  def walk(x,path='$'):
                      if isinstance(x,dict):
                          for k,v in x.items():
                              np=f'{path}.{k}'
                              if any(w in k.lower() for w in ('price','tariff','rate','cost','fee','amount','currency','kwh','owner','address','id')):
                                  hits.append((np,v if not isinstance(v,(dict,list)) else type(v).__name__))
                              walk(v,np)
                      elif isinstance(x,list):
                          for i,v in enumerate(x[:20]): walk(v,f'{path}[{i}]')
                  walk(obj)
                  row['hits']=hits[:100]
                  row['preview']=obj
              except Exception as e:
                  row['json']=False; row['text']=raw[:1000]
              summary.append(row)
          for row in summary:
              print('\n====',row['id'],'====')
              print(json.dumps(row,ensure_ascii=False,indent=2)[:18000])
          Path('probe/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: allego-dxp-price-api-probe
          path: probe
          retention-days: 3
