name: Switzerland MOVE CCC CPO-level finalization
on:
  push:
    paths:
      - 'scripts/finalize_swiss_ccc_cpo_level.py'
      - '.github/workflows/switzerland-ccc-cpo-level-finalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/finalize_swiss_ccc_cpo_level.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/ccc-move-cpo-tariffs-national.json docs/switzerland-ccc-finalization-2026-09-28.json
          git commit -m 'data(switzerland): finalize MOVE CH*CCC CPO-level tariffs' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
