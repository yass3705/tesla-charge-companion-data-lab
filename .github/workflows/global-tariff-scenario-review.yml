name: GLOBAL tariff scenario inventory and France V9 pricing regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-tariff-scenario-review.yml'
      - 'scripts/tariff_global_inventory_20261009.py'
      - 'scripts/tesla_global_tariff_inventory_20261009.py'
      - 'scripts/tesla_global_pricing_real_rule_pilot_20261009.cjs'
      - 'scripts/tariff_after_minutes_candidate_20261009.cjs'
      - 'scripts/tesla_complete_config_pricing_audit_20261009.cjs'
      - 'scripts/france_runtime_offer_fixtures_20261009.py'
      - 'scripts/france_pricing_real_offer_pilot_20261009.cjs'
      - 'scripts/archive_global_tariff_scenario_review.py'
permissions:
  contents: write
concurrency:
  group: global-tariff-scenario-review-main
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Tesla worldwide official-catalogue structures by all nine TCC countries
        env:
          TCC_TESLA_SOURCE_REF: main
        run: python scripts/tesla_global_tariff_inventory_20261009.py
      - name: All-country source schema inventory and true France eMSP offer census
        run: python scripts/tariff_global_inventory_20261009.py
      - name: Download frozen V9 production pricing engine
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 20 --max-time 90 --retry 3 \
            "https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/${TCC_V9_PRICING_SHA}/v9-production-runtime/assets/v9/pricing-engine.js" \
            -o /tmp/tcc-v9-pinned-pricing-engine.js
          test -s /tmp/tcc-v9-pinned-pricing-engine.js
      - name: Download frozen Tesla V9 adapter
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: |
          curl -fsSL --connect-timeout 20 --max-time 90 --retry 3 \
            "https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/${TCC_V9_PRICING_SHA}/v9-production-runtime/assets/v9/adapters/tesla-json.js" \
            -o /tmp/tcc-v9-pinned-tesla-adapter.js
          test -s /tmp/tcc-v9-pinned-tesla-adapter.js
      - name: Extract genuine France compiled direct CPO and subscription offer examples
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: python scripts/france_runtime_offer_fixtures_20261009.py
      - name: France-first real offer and deterministic calculation regression
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: node scripts/france_pricing_real_offer_pilot_20261009.cjs /tmp/tcc-v9-pinned-pricing-engine.js
      - name: Pilot French duration-after-threshold fees in staging only
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: node scripts/tariff_after_minutes_candidate_20261009.cjs /tmp/tcc-v9-pinned-pricing-engine.js
      - name: Tesla all-country real rule formats and power-band regression
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: node scripts/tesla_global_pricing_real_rule_pilot_20261009.cjs /tmp/tcc-v9-pinned-pricing-engine.js /tmp/tcc-v9-pinned-tesla-adapter.js
      - name: Tesla complete source-rule windows, currency and power-curve validation
        env:
          TCC_V9_PRICING_SHA: 38ac26e029ba1c4779d4d8fa43e7d5d300858624
        run: node scripts/tesla_complete_config_pricing_audit_20261009.cjs /tmp/tcc-v9-pinned-pricing-engine.js /tmp/tcc-v9-pinned-tesla-adapter.js
      - name: Validate inventory and regression evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/tariff-scenarios')
          inv=json.loads((p/'global-inventory-latest.json').read_text())
          pilot=json.loads((p/'france-pricing-pilot-latest.json').read_text())
          tesla=json.loads((p/'tesla-global-inventory-latest.json').read_text())
          tesla_pilot=json.loads((p/'tesla-global-pricing-pilot-latest.json').read_text())
          after=json.loads((p/'france-after-minutes-candidate-latest.json').read_text())
          tesla_deep=json.loads((p/'tesla-complete-config-pricing-audit-latest.json').read_text())
          assert all(x['pass'] for x in tesla_deep['checks'])
          assert tesla_deep['fixtureConfigurations']>=9
          assert tesla['completeConfigurationFixtureCount']==tesla_deep['fixtureConfigurations']
          assert all(c in tesla_deep['byCountry'] for c in ('FR','IT','CH','DE','ES','NL','UK','MA','BE'))
          assert after['status']=='staging_checks_pass'
          assert after['summary']['offers']>0
          assert after['summary']['regressionMismatch']==0
          assert all(x['pass'] for x in tesla_pilot['checks'])
          assert tesla_pilot['fixtureCount']>0
          assert set(inv['scopeCountries'])==set(tesla['scopeCountries'])
          assert tesla['sourceTotalStations']>0
          assert inv['sourceScope']['externalTeslaCatalogue']['sha256']==tesla['sourceSha256']
          assert 'MA' in tesla['countries'] and 'FR' in tesla['countries']
          assert set(('FR','IT','CH','DE','ES','NL','UK','MA','BE'))<=set(inv['scopeCountries'])
          assert inv['sourceFilesScanned']>=100
          assert pilot['samplesTested']>200
          assert len(pilot['syntheticCases'])==17 and all(x['pass'] for x in pilot['syntheticCases'])
          assert isinstance(pilot['incompleteReasons'],dict)
          assert isinstance(pilot['unmodeledLegacyFields'],dict)
          print('Global scenario audit integrity OK:',inv['sourceFilesScanned'],'Data Lab source files +',tesla['sourceTotalStations'],'Tesla global stations, and',pilot['samplesTested'],'real France tariff samples')
          PY
      - name: Version results, provenance and historical comparison
        run: python scripts/archive_global_tariff_scenario_review.py
      - name: Persist complete audit outputs, never modify V9 pricing/runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tariff-scenarios
          if git diff --cached --quiet; then
            echo 'No new changes'
            exit 0
          fi
          git commit -m "reports: global tariff scenario audit and France regression [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Conflict: refusing to overwrite saved report data.' >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'GLOBAL_TARIFF_SCENARIOS_PERSISTED'
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-tariff-scenario-review-${{ github.run_id }}
          path: reports/tariff-scenarios/
          retention-days: 90
