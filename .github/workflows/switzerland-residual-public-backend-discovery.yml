name: Switzerland residual public backend discovery
on:
  push:
    paths:
      - 'scripts/swiss_residual_public_backend_discovery.py'
      - '.github/workflows/switzerland-residual-public-backend-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/swiss_residual_public_backend_discovery.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-residual-public-backend-discovery-2026-09-28.json
          git commit -m 'docs(switzerland): discover residual public backends' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
