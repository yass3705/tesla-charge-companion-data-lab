name: Switzerland eCarUp finalization
on:
  push:
    paths:
      - 'data/switzerland/ecarup-owner-direct-tariffs.json'
      - 'data/switzerland/ecarup-owner-coordinate-safe-overlay.json'
      - 'scripts/finalize_swiss_ecarup_owner.py'
      - '.github/workflows/switzerland-ecarup-finalization.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/finalize_swiss_ecarup_owner.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-ecarup-finalization-2026-09-28.json
          git commit -m 'docs(switzerland): finalize eCarUp owner coverage' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
