name: France Powerdot current V9 audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-powerdot-current-v9.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit current Powerdot legacy layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/powerdot /tmp/powerdot
          curl -fLsS --retry 3 https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/refactor/unified-data-engine-v9/data/powerdot_direct_france.json.gz -o /tmp/powerdot/data.json.gz
          python - <<'PY'
          import gzip,json,collections,pathlib
          d=json.loads(gzip.open('/tmp/powerdot/data.json.gz','rt',encoding='utf-8').read())
          chargers=d.get('chargers',[]) if isinstance(d,dict) else []
          summary={
            'topType':type(d).__name__,'topKeys':list(d) if isinstance(d,dict) else [],
            'generatedAt':d.get('generatedAt') if isinstance(d,dict) else None,
            'source':d.get('source') if isinstance(d,dict) else None,
            'irveSource':d.get('irveSource') if isinstance(d,dict) else None,
            'counts':d.get('counts') if isinstance(d,dict) else None,
            'componentCounts':d.get('componentCounts') if isinstance(d,dict) else None,
            'energyRateDistribution':d.get('energyRateDistribution') if isinstance(d,dict) else None,
            'tariffIdCounts':d.get('tariffIdCounts') if isinstance(d,dict) else None,
            'chargerCount':len(chargers),
            'chargerSample':chargers[:8],
            'chargerKeys':sorted({k for x in chargers[:100] if isinstance(x,dict) for k in x}),
            'unmappedPdcSample':(d.get('unmappedPdcSample') or [])[:20] if isinstance(d,dict) else [],
            'failureSample':(d.get('failureSample') or [])[:20] if isinstance(d,dict) else []
          }
          pathlib.Path('reports/france/powerdot/current-v9-audit.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/powerdot/current-v9-audit.json
          git commit -m 'France Powerdot: deepen current V9 audit' || exit 0
          git pull --rebase origin main
          git push
