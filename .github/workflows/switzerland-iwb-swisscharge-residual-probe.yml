name: Switzerland IWB Swisscharge residual probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-iwb-swisscharge-residual-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Probe six IWB residual EVSEs against Swisscharge adhoc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, http.cookiejar
          from pathlib import Path
          from datetime import datetime,timezone

          BASE="https://adhoc.swisscharge.ch"
          TENANT="Swisscharge_CH"
          UA="Mozilla/5.0 TCC-V9-IWB-Residual"
          evses=[
            "CH*IWB*E247322","CH*IWB*E247323",
            "CH*IWB*E35375","CH*IWB*E35376",
            "CH*IWB*E46250","CH*IWB*E46251",
          ]
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def get(url,headers=None):
            req=urllib.request.Request(url,headers=headers or {},method="GET")
            try:
              with op.open(req,timeout=30) as r:return r.status,r.read()
            except urllib.error.HTTPError as e:return e.code,e.read()
            except Exception as e:return 0,(type(e).__name__+": "+str(e)).encode()
          def safe_json(raw):
            try:return json.loads(raw.decode())
            except:return {"raw":raw.decode("utf-8","replace")[:500]}
          rows=[]
          for eid in evses:
            suffix=eid.split("*E",1)[1]
            variants=[eid,suffix]
            attempts=[]
            for ref in variants:
              page=f"{BASE}/tenant/{TENANT}/session-start/{urllib.parse.quote(ref,safe='')}"
              api=f"{BASE}/api/v1/charge-points?evsePhysicalReference={urllib.parse.quote(ref,safe='')}"
              get(page,{"User-Agent":UA})
              st,raw=get(api,{"Accept":"application/json","Tenant":TENANT,"tenant-path":page,"Referer":page,"User-Agent":UA})
              body=safe_json(raw)
              data=(body or {}).get("data") if isinstance(body,dict) else None
              evs=(data or {}).get("evses") or []
              slim=[]
              for ev in evs:
                tariff=ev.get("tariff") or {}; pricing=tariff.get("pricing") or {}; restrictions=tariff.get("restrictions") or {}
                slim.append({
                  "physicalReference":ev.get("physicalReference"),
                  "emi3Id":ev.get("emi3Id"),
                  "chargePointId":(data.get("chargePoint") or {}).get("id"),
                  "locationName":(data.get("chargePoint") or {}).get("locationName"),
                  "address":(data.get("chargePoint") or {}).get("address"),
                  "city":(data.get("chargePoint") or {}).get("city"),
                  "tariff":{
                    "id":tariff.get("id"),"name":tariff.get("name"),"currency":tariff.get("currency"),
                    "pricing":pricing,"restrictions":restrictions
                  }
                })
              attempts.append({"reference":ref,"httpStatus":st,"evses":slim,"bodyError":None if slim else body})
            rows.append({"requestedEvseId":eid,"attempts":attempts})
          out={"schemaVersion":1,"country":"CH","operatorId":"CH*IWB","generatedAt":datetime.now(timezone.utc).isoformat(),"rows":rows}
          Path("docs/switzerland-iwb-swisscharge-residual-probe-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-iwb-swisscharge-residual-probe-2026-09-29.json
          git commit -m "research(ch): probe IWB residuals via Swisscharge adhoc" || exit 0
          git pull --rebase origin main
          git push origin main
