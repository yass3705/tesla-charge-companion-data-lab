name: Audit Electroverse FR VIA national tech
on:
  push:
    branches:
      - audit/electroverse-via-national-tech
    paths:
      - "scripts/audit_electroverse_via_national_tech.mjs"
      - ".github/workflows/electroverse-via-national-tech.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect VIA national metadata
        run: node --max-old-space-size=4096 scripts/audit_electroverse_via_national_tech.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-via-national-tech.json
          git commit -m "audit: publish VIA national technical metadata" || exit 0
          git push
