name: Plug Inn fast charge official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "57 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/pluginn_fastcharge_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/pluginn-fastcharge-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: pluginn-fastcharge-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract Plug Inn fast charge official France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/pluginn
          python -m py_compile scripts/pluginn_fastcharge_official.py
          python scripts/pluginn_fastcharge_official.py --out out/pluginn 2> >(tee out/pluginn/error.log >&2)
          cat out/pluginn/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/pluginn
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/pluginn/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/pluginn/latest_diagnostic.json').write_text(json.dumps({'dataset':'pluginn-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pluginn/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(pluginn): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification and tariff rules
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/pluginn/pluginn_fastcharge_official_france.json').read_text())
          assert p['dataset'] == 'pluginn-fastcharge-official-france'
          assert p['classification']['singleNationalBankCardDirectTariff'] is True
          assert p['classification']['chargePassIsMobilityServiceLayer'] is True
          assert p['operatorDirect']['bankCard']['eurPerKwh'] == 0.59
          assert p['mobilityService']['basic']['plugInnEurPerKwh'] == 0.46
          assert p['mobilityService']['basic']['monthlyFeeEur'] == 0.0
          assert p['mobilityService']['intense']['plugInnEurPerKwh'] == 0.39
          assert p['mobilityService']['intense']['monthlyFeeEur'] == 5.99
          assert p['fees']['overstayOrParkingDuration']['thresholdMinutes'] == 60
          assert p['fees']['overstayOrParkingDuration']['eurPerMinuteAfterThreshold'] == 0.30
          assert p['operatorDirect']['network']['maxPowerKwPublished'] == 320
          assert p['roaming']['operatorDirect'] is False
          assert p['sourceEvidence']['officialOnly'] is True
          print('Validated Plug Inn fast charge France direct/member/roaming separation')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/pluginn/pluginn_fastcharge_official_france.json')
          dst=Path('data/operator_direct/pluginn_fastcharge_official_france.json')
          rep=Path('reports/pluginn/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'mobilityService':d.get('mobilityService'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/pluginn/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Plug Inn rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/pluginn_fastcharge_official_france.json reports/pluginn/latest_summary.md
          git commit -m "data(pluginn): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
