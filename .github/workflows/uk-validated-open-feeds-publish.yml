name: UK validated open feeds publish
# trigger marker: 2026-09-28

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect_uk_validated_open_feeds.py"
      - ".github/workflows/uk-validated-open-feeds-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-validated-open-feeds-publish
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect all validated UK feeds
        id: collect
        shell: bash
        run: |
          set +e
          mkdir -p artifacts reports/uk data/national
          python scripts/collect_uk_validated_open_feeds.py --output artifacts/uk-validated-open-feeds.json
          rc=$?
          echo "collector_rc=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          src=Path('artifacts/uk-validated-open-feeds.json')
          if not src.exists():
              raise SystemExit('collector did not produce artifact')
          raw=src.read_bytes()
          with gzip.open('data/national/uk_validated_open_feeds.json.gz','wb',compresslevel=9) as g:
              g.write(raw)
          p=json.loads(raw)
          report={
              'country':'GB',
              'retrievedAt':p.get('retrievedAt'),
              'summary':p.get('summary'),
              'failures':p.get('failures',[]),
              'sources':[{
                  'name':s.get('name'),
                  'summary':s.get('summary'),
                  'endpoints':s.get('endpoints')
              } for s in p.get('sources',[])]
          }
          Path('reports/uk/validated-open-feeds-latest.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          exit 0

      - name: Publish dataset and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_validated_open_feeds.json.gz reports/uk/validated-open-feeds-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): publish validated open feeds [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Mark partial collection
        if: steps.collect.outputs.collector_rc != '0'
        run: |
          echo "One or more UK sources failed; partial dataset/report was still persisted." >&2
          exit 1
