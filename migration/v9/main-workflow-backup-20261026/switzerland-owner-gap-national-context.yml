name: Switzerland owner-gap national context
on:
  push:
    paths:
      - 'scripts/inspect_swiss_owner_gap_context.py'
      - '.github/workflows/switzerland-owner-gap-national-context.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/inspect_swiss_owner_gap_context.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-owner-gap-national-context-2026-09-28.json
          git commit -m 'docs(switzerland): persist owner-gap national context' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
