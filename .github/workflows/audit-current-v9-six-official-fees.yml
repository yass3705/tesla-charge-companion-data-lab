name: Current V9 six official deferred fees regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_after_minutes_live_verified_20261011.cjs
      - .github/workflows/audit-current-v9-six-official-fees.yml
permissions:
  contents: write
jobs:
  verified_catalogue_fees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current engine and actual live stable catalogues
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/main/v9-production-runtime'
          curl -fsSL --retry 3 "$base/assets/v9/pricing-engine.js" -o /tmp/pricing-engine-live.js
          curl -fsSL --retry 3 "$base/data/v9/france-direct-offers.json" -o /tmp/france-direct-offers-live.json
          curl -fsSL --retry 3 "$base/data/v9/france-emsp-offers.json" -o /tmp/france-emsp-offers-live.json
          node --check /tmp/pricing-engine-live.js
          node --check scripts/audit_after_minutes_live_verified_20261011.cjs
      - name: Validate six real live rules against current engine
        run: node scripts/audit_after_minutes_live_verified_20261011.cjs /tmp/pricing-engine-live.js /tmp/france-direct-offers-live.json /tmp/france-emsp-offers-live.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-source-verified-live-duration-fees
          path: reports/tariff-scenarios/current-v9-after-minutes-official-six-2026-10-11.json
          if-no-files-found: warn
      - name: Commit validated report only
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/current-v9-after-minutes-official-six-2026-10-11.json /tmp/current_six_verified.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/tariff-scenarios
            cp /tmp/current_six_verified.json reports/tariff-scenarios/current-v9-after-minutes-official-six-2026-10-11.json
            git add reports/tariff-scenarios/current-v9-after-minutes-official-six-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(v9): validate six live source-proven deferred fees'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
