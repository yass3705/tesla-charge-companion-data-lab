name: France TotalEnergies map API probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-totalenergies-map-api.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe official map API JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/te reports/france/totalenergies
          URL='https://totalms.webgeoservices.com/maps/api/js/?clientId=gme-totalraffinagemarketing1&languageTranslation=fr_fr'
          curl -fLsS -A 'Mozilla/5.0' "$URL" -o /tmp/te/api.js
          python - <<'PY'
          import re,json,pathlib
          txt=pathlib.Path('/tmp/te/api.js').read_text(errors='ignore')
          urls=[];routes=[];contexts=[]
          for u in re.findall(r'https?://[^\s"\'<>`]+',txt):
              if re.search(r'(?i)token|key=',u):continue
              if u not in urls:urls.append(u[:1800])
          for q in re.findall(r'["\']([^"\']{2,220})["\']',txt):
              if re.search(r'(?i)store|station|search|price|tarif|poi|business|location|detail',q) and ('/' in q or '?' in q):
                  if re.search(r'(?i)token|api.?key|secret',q):continue
                  if q not in routes:routes.append(q)
          for n in ('showPrices','storeId','business','search','detail','price','stores'):
              for m in re.finditer(re.escape(n),txt,re.I):
                  s=txt[max(0,m.start()-600):min(len(txt),m.end()+1300)]
                  if re.search(r'(?i)token|api.?key|secret',s):continue
                  if s not in contexts:contexts.append(s)
          report={'bytes':len(txt),'urls':urls[:300],'routes':routes[:1000],'contexts':contexts[:100]}
          pathlib.Path('reports/france/totalenergies/map-api-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'bytes':len(txt),'urls':urls[:60],'routes':routes[:120]},ensure_ascii=False,indent=2)[:40000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/totalenergies/map-api-probe.json
          git commit -m 'France TotalEnergies: publish map API probe' || exit 0
          git pull --rebase origin main
          git push
