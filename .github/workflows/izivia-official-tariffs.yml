name: IZIVIA official tariffs
# maintenance-trigger: safety-fix-2026-10-01

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/izivia_official.py"
      - "scripts/izivia_station_tariffs.py"
      - "scripts/izivia_fast_probe.py"
      - "scripts/test_izivia_station_tariffs.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/izivia-official-tariffs.yml"
  pull_request:
    paths:
      - "scripts/izivia_station_tariffs.py"
      - "scripts/izivia_fast_probe.py"
      - "scripts/test_izivia_station_tariffs.py"
      - ".github/workflows/izivia-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: izivia-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Prepare browser fallback
        run: |
          python -m pip install --disable-pip-version-check --quiet "selenium>=4.20,<5"
          (google-chrome --version || chromium --version || chromium-browser --version || true)

      - name: Extract official IZIVIA tariff families
        id: extract
        run: |
          python -m py_compile scripts/izivia_official.py
          python scripts/izivia_official.py --out out/izivia
          cat out/izivia/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -f out/izivia/DIAGNOSTIC.json || exit 0
          mkdir -p reports/izivia
          cp out/izivia/DIAGNOSTIC.json reports/izivia/latest_diagnostic.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/izivia/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(izivia): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            git push origin HEAD:main
          fi

      - name: Validate classification and tariff bounds
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/izivia/izivia_official_france.json').read_text())
          assert p['classification']['singleNationalOperatorTariff'] is False, p['classification']
          nets={x['network']:x for x in p['operatorDirectNetworks']}
          assert {'IZIVIA FAST','IZIVIA Express','IZIVIA Grand Lyon'} <= set(nets), nets.keys()
          fast=nets['IZIVIA FAST']['pricing']['happyHourFloorEurPerKwh']
          assert 0.10 <= fast <= 1.50, fast
          exp=nets['IZIVIA Express']['pricing']
          assert 0.10 <= exp['minEurPerKwh'] <= exp['maxEurPerKwh'] <= 1.50, exp
          gl=nets['IZIVIA Grand Lyon']['pricing']
          assert gl['day']['upTo50Kw']['visitorEurPerKwh'] == 0.45, gl
          assert gl['day']['from100Kw']['visitorEurPerKwh'] == 0.55, gl
          assert gl['day']['from100Kw']['idleEurPerMin'] == 0.20, gl
          assert gl['night']['upTo7Kw']['afterIncludedEurPerKwh'] == 0.38, gl
          roaming=p['mobilityProvider']['thirdPartyNetworks']['currentDefaultServiceFeePercent']
          assert 0 <= roaming <= 50, roaming
          assert p['mobilityProvider']['thirdPartyNetworks']['stationLevelPriceLookupRequired'] is True
          print('Validated IZIVIA tariff families')
          PY

      - name: Publish only when tariff evidence changes
        if: success()
        id: publish
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          new_path=Path('out/izivia/izivia_official_france.json')
          dest=Path('data/operator_direct/izivia_official_france.json')
          report_dest=Path('reports/izivia/latest_summary.md')
          new=json.loads(new_path.read_text())

          def signature(d):
              return {
                  'classification': d.get('classification'),
                  'operatorDirectNetworks': d.get('operatorDirectNetworks'),
                  'mobilityProvider': d.get('mobilityProvider'),
                  'fingerprint': (d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus': d.get('publicationStatus'),
              }

          changed=True
          if dest.exists():
              old=json.loads(dest.read_text())
              changed=signature(old)!=signature(new)

          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dest.parent.mkdir(parents=True, exist_ok=True)
              report_dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(new_path, dest)
              shutil.copy2('out/izivia/SUMMARY.md', report_dest)
              print('IZIVIA tariff evidence changed: publication prepared')
          else:
              print('IZIVIA tariff evidence unchanged: no repository commit needed')
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated IZIVIA rule set
        if: success() && steps.publish.outputs.changed == '1' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/izivia_official_france.json reports/izivia/latest_summary.md
          git commit -m "data(izivia): publish official tariff families [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main

  station-tariffs:
    # The daily network-page check and station-card check are independent. This
    # still runs when extraction of a general tariff page needs attention.
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture official FAST and Express direct station tariffs
        run: |
          python -m unittest discover -s scripts -p 'test_izivia_station_tariffs.py'
          python -m py_compile scripts/izivia_station_tariffs.py scripts/izivia_fast_probe.py
          python scripts/izivia_station_tariffs.py
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('out/izivia-station-tariffs-latest.json'))
          changes=json.load(open('out/izivia-station-tariff-changes.json'))['changes']
          print('## IZIVIA FAST and Express official station cards')
          for network,summary in data['summary'].items():
              change=changes[network]
              print(f"- {network}: {summary['mapStations']} map stations, {summary['withDirectPrice']} with direct prices; "
                    f"{len(change['tariffChangedMapIds'])} changed tariffs, {len(change['addedMapIds'])} added, "
                    f"{len(change['removedMapIds'])} removed.")
          print(f"- Semantic SHA-256: `{data['semanticSha256']}`")
          PY

      - name: Public-safety scan
        if: success()
        run: python scripts/public_safety_check.py .

      - name: Publish changed station tariff cards to Data Lab
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source=Path('out/izivia-station-tariffs-latest.json')
          target=Path('data/operator_direct/izivia_station_tariffs_latest.json')
          new=json.loads(source.read_text())
          old=json.loads(target.read_text()) if target.exists() else None
          if old and old.get('semanticSha256') == new['semanticSha256']:
              Path('out/izivia-station-changed.flag').write_text('0')
              print('No station or direct-tariff change')
          else:
              shutil.copy2(source,target)
              Path('out/izivia-station-changed.flag').write_text('1')
              print('Validated station-level FAST/Express change prepared')
          PY
          if [ "$(cat out/izivia-station-changed.flag)" = 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/operator_direct/izivia_station_tariffs_latest.json
            git commit -m "data(izivia): refresh FAST and Express station tariffs [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izivia-fast-express-station-tariffs
          path: out/izivia-station-*.json
          if-no-files-found: ignore
          retention-days: 14
