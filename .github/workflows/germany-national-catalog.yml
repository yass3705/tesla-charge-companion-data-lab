name: Germany national non-Tesla catalog staging

on:
  push:
    branches: [feature/germany-national-base]
    paths:
      - 'scripts/germany_national_catalog.py'
      - 'scripts/germany_national_catalog_tariff_overlay.py'
      - '.github/workflows/germany-national-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest validated persistent AFIR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/germany
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=germany-afir-dynamic-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No validated germany-afir-dynamic-state artifact found" >&2
            exit 1
          fi
          echo "Restoring persistent AFIR state artifact $ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/afir-state.zip
          unzip -q /tmp/afir-state.zip -d data/germany
          test -s data/germany/afir_dynamic_state.json.gz

      - name: Restore latest validated AFIR tariff classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=germany-afir-tariff-classification&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No validated germany-afir-tariff-classification artifact found" >&2
            exit 1
          fi
          echo "Restoring AFIR tariff classification artifact $ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/afir-tariff-classification.zip
          unzip -q /tmp/afir-tariff-classification.zip -d data/germany
          test -s data/germany/afir_tariff_classification.json.gz

      - name: Rebuild BNetzA dynamic enrichment
        run: python scripts/germany_bnetza_dynamic_enrichment.py

      - name: Build current normalized AFIR static snapshot
        run: python scripts/germany_afir_static_normalize.py

      - name: Build staged national non-Tesla catalogue
        run: python scripts/germany_national_catalog.py

      - name: Attach safe AFIR tariff candidates
        run: python scripts/germany_national_catalog_tariff_overlay.py

      - name: Validate national catalogue invariants
        run: |
          python - <<'PY'
          import gzip, json, re, unicodedata
          from pathlib import Path

          p=Path('data/germany/germany_non_tesla_catalog_staging.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as f:
              d=json.load(f)
          m=json.loads(Path('data/germany/germany_non_tesla_catalog_staging_manifest.json').read_text(encoding='utf-8'))

          assert d['dataset']=='germany-national-non-tesla-catalog-staging'
          assert d['scope']['stagedOnly'] is True
          assert d['scope']['publishesToTcc'] is False
          assert d['scope']['nonTeslaOnly'] is True
          assert d['scope']['tariffsRankable'] is False
          assert d['scope']['unknownIsNeverOutOfService'] is True
          assert d['scope']['ambiguousAfirMatchesAreQuarantined'] is True
          s=d['stats']
          assert s['bnetzaPhysicalSitesInput'] > 50000, s
          assert s['nonTeslaSites'] > 50000, s
          assert s['teslaSitesExcluded'] > 0, s
          assert s['safeAfirSitesAttached'] > 8000, s
          assert s['safeAfirSitesWithRawTariff'] > 5000, s
          assert sum(s['serviceStateDistribution'].values()) == s['nonTeslaSites'], s
          assert len(d['sites']) == s['nonTeslaSites']
          assert m['stats'] == s
          assert m['stagedOnly'] is True and m['publishesToTcc'] is False

          def norm(x):
              t=unicodedata.normalize('NFKD',str(x or ''))
              t=''.join(c for c in t if not unicodedata.combining(c)).lower().replace('ß','ss')
              return re.sub(r'[^a-z0-9]+',' ',t).split()

          for site in d['sites']:
              assert 'tesla' not in norm(site.get('operator')), site['id']
              state=site['service']['state']
              assert state in {'operational','out_of_service','unknown'}, site['id']
              if state == 'out_of_service':
                  assert site['service']['knownDynamicPointCount'] > 0, site['id']
                  dist=site['service']['pointStateDistribution']
                  assert dist.get('operational',0) == 0, site['id']
                  assert dist.get('unknown',0) == 0, site['id']
              if site['afir']['matchStatus'] != 'matched_safe':
                  assert site['afir']['data'] is None, site['id']
              assert site['pricing']['rankable'] is False

          ep=Path('data/germany/germany_non_tesla_catalog_staging_tariff_classified.json.gz')
          with gzip.open(ep,'rt',encoding='utf-8') as f:
              e=json.load(f)
          em=json.loads(Path('data/germany/germany_non_tesla_catalog_staging_tariff_classified_manifest.json').read_text(encoding='utf-8'))
          assert e['dataset']=='germany-national-non-tesla-catalog-staging-tariff-classified'
          assert e['scope']['stagedOnly'] is True
          assert e['scope']['publishesToTcc'] is False
          assert e['scope']['tariffsRankable'] is False
          assert e['scope']['safeAfirTariffCandidatesIncluded'] is True
          es=e['stats']
          assert es['stagingRankableAfirCandidateSites'] > 500, es
          assert es['afirTariffClassificationMissingForAttachedSite'] == 0, es
          assert set(es['stagingRankableAfirCandidatesByProvider']) <= {'eround'}, es
          assert len(e['sites']) == es['nonTeslaSites']
          assert em['stats'] == es
          candidate_count=0
          for site in e['sites']:
              pricing=site['pricing']
              assert pricing['rankable'] is False
              if pricing.get('stagingRankableCandidate'):
                  candidate_count += 1
                  assert site['afir']['matchStatus']=='matched_safe', site['id']
                  assert site['afir']['data']['provider']=='eround', site['id']
                  assert pricing['stagingEffectiveEurPerKwh'] is not None, site['id']
                  ac=pricing['afirClassification']
                  assert ac['classification']=='uniform_simple_kwh_rankable', site['id']
                  assert set(ac['rateClassDistribution']) == {'simple_kwh_tax_included'}, site['id']
          assert candidate_count == es['stagingRankableAfirCandidateSites'], (candidate_count,es)
          print('TCC_GERMANY_NATIONAL_CATALOG_VALIDATED='+json.dumps(es,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: germany-national-non-tesla-catalog-staging
          path: |
            data/germany/germany_non_tesla_catalog_staging.json.gz
            data/germany/germany_non_tesla_catalog_staging_manifest.json
            data/germany/germany_non_tesla_catalog_staging_tariff_classified.json.gz
            data/germany/germany_non_tesla_catalog_staging_tariff_classified_manifest.json
          if-no-files-found: error
          retention-days: 30
