name: UK Midhope exact verified summer source build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/uk_midhope_build_verified_runtime.py
      - .github/workflows/uk-midhope-build-verified-runtime.yml
permissions:
  contents: write
concurrency:
  group: uk-midhope-verified-runtime-source
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert reviewed source and exact four connectors
        run: python3 scripts/uk_midhope_build_verified_runtime.py
      - name: Persist candidate and provable scope
        shell: bash
        run: |
          set -euo pipefail
          cp data/national/uk_connected_kerb_midhope_verified_v9.json.gz /tmp/midhope-verified-v9.json.gz
          cp reports/uk/connected-kerb-midhope-runtime-stage-2026-10-10.json /tmp/midhope-stage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/midhope-verified-v9.json.gz data/national/uk_connected_kerb_midhope_verified_v9.json.gz
            cp /tmp/midhope-stage.json reports/uk/connected-kerb-midhope-runtime-stage-2026-10-10.json
            git add data/national/uk_connected_kerb_midhope_verified_v9.json.gz reports/uk/connected-kerb-midhope-runtime-stage-2026-10-10.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): verified Midhope exact four connector V9 summer source [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
