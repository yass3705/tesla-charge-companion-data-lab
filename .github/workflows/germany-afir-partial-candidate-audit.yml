name: Germany AFIR partial-candidate audit
# canonical Data Lab audit; compact ranking touch 2026-10-01
on:
  push:
    paths:
      - ".github/workflows/germany-afir-partial-candidate-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: germany-afir-partial-candidate-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical Germany staging catalog
        run: |
          python - <<'PY'
          import gzip,json,pathlib,collections,re
          with gzip.open("data/national/germany_non_tesla_catalog_staging_direct_cpo.json.gz","rt",encoding="utf-8") as f:d=json.load(f)
          agg={}
          for s in d.get("sites",[]):
            op=(s.get("operator") or "").strip()
            if not op: continue
            a=agg.setdefault(op,{"sites":0,"matchedSafe":0,"rawTariffSites":0,"evseIds":set(),"providers":collections.Counter(),"samples":[]})
            a["sites"]+=1;a["evseIds"].update(s.get("evseIds") or [])
            af=s.get("afir") or {}; ad=af.get("data") or {}
            if af.get("matchStatus")=="matched_safe":
              a["matchedSafe"]+=1
              pr=(af.get("match") or {}).get("provider")
              if pr:a["providers"][pr]+=1
            if ad.get("hasRawTariff"):
              a["rawTariffSites"]+=1
              if len(a["samples"])<4:a["samples"].append({"siteId":s.get("id"),"powerKw":s.get("maxConnectionPowerKw"),"evseIds":s.get("evseIds"),"provider":ad.get("provider"),"rawTariffs":ad.get("rawTariffs")})
          rows=[]
          for op,a in agg.items():
            if a["rawTariffSites"]<=0:continue
            rows.append({"operator":op,"sites":a["sites"],"matchedSafe":a["matchedSafe"],"rawTariffSites":a["rawTariffSites"],"rawCoverage":round(a["rawTariffSites"]/a["sites"],4),"evseIdCount":len(a["evseIds"]),"providers":dict(a["providers"]),"samples":a["samples"]})
          rows.sort(key=lambda x:(x["rawCoverage"],x["rawTariffSites"],x["sites"]),reverse=True)
          out={"schemaVersion":1,"country":"DE","source":"data/national/germany_non_tesla_catalog_staging_direct_cpo.json.gz","operatorsWithRawTariff":len(rows),"operators":rows}
          pathlib.Path("docs/germany-afir-operator-coverage-2026-10-01.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          compact={"schemaVersion":1,"country":"DE","operatorsWithRawTariff":len(rows),"operators":[{k:r[k] for k in ("operator","sites","matchedSafe","rawTariffSites","rawCoverage","evseIdCount","providers")} for r in rows]}\n          pathlib.Path("docs/germany-afir-operator-coverage-compact-2026-10-01.json").write_text(json.dumps(compact,ensure_ascii=False,indent=2)+"\\n")\n          print(json.dumps([{k:r[k] for k in ("operator","sites","matchedSafe","rawTariffSites","rawCoverage","evseIdCount")} for r in rows[:80]],ensure_ascii=False,indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/germany-afir-operator-coverage-2026-10-01.json docs/germany-afir-operator-coverage-compact-2026-10-01.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(de): map partial candidates against national AFIR staging"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
