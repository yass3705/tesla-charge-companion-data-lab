name: NRG4YOU ReStation noauth station probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nrg4you-restation-noauth-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe public noauth station API
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          from pathlib import Path

          jsurl='https://customer.restation.eu/main-es2015.b18fc01a6c41432f5296.js'
          api='https://api-app.restation.eu'
          ua='Mozilla/5.0 TCC-V9-readonly-probe'

          def fetch(url, accept='application/json,text/plain,*/*'):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':accept})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                b=r.read(2_000_000)
                return {'url':url,'status':r.status,'contentType':r.headers.get('Content-Type',''),'bytes':len(b),'body':b.decode('utf-8','replace')}
            except urllib.error.HTTPError as e:
              b=e.read(200000)
              return {'url':url,'status':e.code,'contentType':e.headers.get('Content-Type',''),'bytes':len(b),'body':b.decode('utf-8','replace')}
            except Exception as e:
              return {'url':url,'error':type(e).__name__+': '+str(e)[:300]}

          j=fetch(jsurl,'application/javascript,*/*')
          text=j.get('body','')
          endpoints=['/noauth/station/get','/noauth/station/getAlll','/noauth/station/search']
          contexts={}
          for ep in endpoints:
            hits=[]
            start=0
            while True:
              i=text.find(ep,start)
              if i<0: break
              hits.append(text[max(0,i-1200):i+2200])
              start=i+len(ep)
              if len(hits)>=20: break
            contexts[ep]=hits

          probes=[fetch(api+ep) for ep in endpoints]

          out={
            'schemaVersion':1,
            'subject':'NRG4YOU/ReStation public noauth station API probe',
            'apiBase':api,
            'endpointContexts':contexts,
            'getWithoutParams':probes,
            'safety':'Public unauthenticated GET only. No POST, login, payment, recharge action, mutation, credentials or session creation.'
          }
          p=Path('data/reports/nrg4you_restation_noauth_probe_latest.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'contexts':{k:len(v) for k,v in contexts.items()},'statuses':[x.get('status') for x in probes]}))
          PY

      - name: Publish probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/nrg4you_restation_noauth_probe_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(italy): probe NRG4YOU ReStation noauth station API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
