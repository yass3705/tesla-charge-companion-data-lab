name: Build France Electroverse S30 structured-child lab
on:
  push:
    branches:
      - electroverse-s30-structured-child-lab
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-s30-structured-child-lab.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build S30 lab overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Materialize generated lab overlay in HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/france-evse
          if ! git diff --cached --quiet; then
            git commit -m "lab: materialize S30 structured-child overlay"
          fi
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare materialized lab against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
      - name: Push validated lab branch
        run: git push origin HEAD:electroverse-s30-structured-child-lab
