name: Belgium NAP schema diagnostic
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/belgium-nap-schema-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect first NAP page
        shell: bash
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          from collections import Counter
          p=Path('data/belgium/pages/nap-belgium-000000.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as f: x=json.load(f)
          keys=Counter(); string_samples={}
          def walk(y,path=''):
              if isinstance(y,dict):
                  for k,v in y.items():
                      keys[k]+=1
                      if isinstance(v,str) and k not in string_samples:
                          string_samples[k]={'path':path+'/'+k,'value':v[:200]}
                      walk(v,path+'/'+k)
              elif isinstance(y,list):
                  for i,v in enumerate(y[:50]): walk(v,path+f'[{i}]')
          walk(x)
          first_evse=((x.get('locations') or [{}])[0].get('stations') or [{}])[0].get('evses',[{}])[0]
          out={'topKeys':keys.most_common(100),'stringSamples':string_samples,'firstEvse':first_evse,'rootType':type(x).__name__,'rootLen':len(x) if hasattr(x,'__len__') else None}
          Path('reports/belgium/belgium-nap-schema-diagnostic-2026-09-29.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/belgium-nap-schema-diagnostic-2026-09-29.json
          git commit -m "diag(be): inspect NAP page schema" || exit 0
          git pull --rebase origin main
          git push

