name: Qovoltis APK route extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-apk-route-extraction.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and decompile official Qovoltis Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -sS -L --max-time 120 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=443' -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          BASE_APK=$(find work/xapk -type f -name '*.apk' | sort | head -1)
          cp "$BASE_APK" work/base.apk
          URL=$(python - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/skylot/jadx/releases/latest',headers={'User-Agent':'qovoltis-probe'})
          obj=json.load(urllib.request.urlopen(req,timeout=30))
          for a in obj['assets']:
              n=a['name'].lower()
              if n.startswith('jadx-') and n.endswith('.zip') and 'gui' not in n:
                  print(a['browser_download_url']); break
          PY
          )
          curl -sS -L --max-time 120 "$URL" -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx
          work/jadx/bin/jadx --show-bad-code --no-res --threads-count 2 -d work/src work/base.apk >out/jadx.log 2>&1 || true

      - name: Extract exact API base construction and tariff routes
        shell: bash
        run: |
          set +e
          {
            echo '=== ApiGateway / Retrofit base construction ==='
            grep -RInE -C 12 'qoapi\.qovoltis\.com|baseUrl\(|Retrofit\.Builder|BASE_URL|API_URL|getStationDetailsService|getMainMapService' work/src/sources/com/qovoltis/client 2>/dev/null | head -5000
            echo '=== station/map APIs ==='
            grep -RInE -C 8 '@(GET|POST).*borne/(map-station|emsp-map-station)|map-station-preview|map-station-list|emsp-map-station-list' work/src/sources/com/qovoltis/client 2>/dev/null | head -3000
            echo '=== tariff response model fields ==='
            grep -RInE -C 3 'tarif_heures_creuses|tarif_heures_pleines|price_per_reference_unit|pricing_default_price_currency|reference_unit|duration_rate|PricingTotal|DurationRate' work/src/sources/com/qovoltis/client/mainmap 2>/dev/null | head -5000
            echo '=== request model constructors ==='
            grep -RInE -C 10 'class StationFilterRequest|class MapStationListQueryRequest|MapStationListQueryRequest\(|StationFilterRequest\(' work/src/sources/com/qovoltis/client/mainmap 2>/dev/null | head -4000
          } > out/deep-evidence.txt
          sed -n '1,1200p' out/deep-evidence.txt

      - name: Probe exact discovered endpoints on plausible base variants
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import requests,json,itertools
          from pathlib import Path
          bases=['https://qoapi.qovoltis.com/','https://qoapi.qovoltis.com/api/']
          gets=[
            ('app/get-public-settings',{}),
            ('app/getSetting',{}),
            ('borne/map-station-list',{}),
            ('borne/map-station-preview',{'station_id':'1'}),
          ]
          report=[]
          for base in bases:
            for path,params in gets:
              url=base+path
              try:
                r=requests.get(url,params=params,timeout=20,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'},allow_redirects=False)
                report.append({'method':'GET','url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'location':r.headers.get('location'),'body':r.text[:2000]})
              except Exception as e:
                report.append({'method':'GET','url':url,'error':repr(e)})
          # Conservative POST probes to the station-list endpoint only, using harmless empty/default bodies.
          for base in bases:
            for qs in [
              {'side':'0','minlng':'-180','minlat':'-90','emsp':'0'},
              {'side':'100','minlng':'1.9','minlat':'48.6','emsp':'0'},
              {'side':'100','minlng':'2.0','minlat':'48.7','emsp':'0'},
            ]:
              for body in [{}, {'filters':[]}, {'power':[]}, {'operators':[]}]:
                url=base+'borne/emsp-map-station-list'
                try:
                  r=requests.post(url,params=qs,json=body,timeout=20,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json'},allow_redirects=False)
                  report.append({'method':'POST','url':r.url,'request_body':body,'status':r.status_code,'content_type':r.headers.get('content-type'),'location':r.headers.get('location'),'body':r.text[:4000]})
                except Exception as e:
                  report.append({'method':'POST','url':url,'params':qs,'request_body':body,'error':repr(e)})
          Path('out/base-variant-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          for x in report:
            print(json.dumps(x,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-apk-route-extraction
          path: out
          retention-days: 5
