name: GES NextCharge APK xrefs

on:
  push:
    branches:
      - research/ges-nextcharge-v9
    paths:
      - scripts/nextcharge_station_xrefs.py
      - .github/workflows/ges-nextcharge-apk-xrefs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install androguard
        run: pip install --disable-pip-version-check androguard
      - name: Fetch NextCharge APK 6.2.02
        run: |
          python - <<'PY'
          import urllib.request
          url='https://download.apkcombo.com/com.goelectricstations.nextcharge/NextCharge_6.2.02_apkcombo.com.apk'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=120) as r, open('/tmp/nextcharge.apk','wb') as f:
                  f.write(r.read())
          except Exception:
              raise SystemExit('APK fetch failed; use uploaded APK analysis evidence only')
          PY
      - name: Analyze DEX xrefs
        run: python scripts/nextcharge_station_xrefs.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-apk-xrefs
          path: data/reports/nextcharge_station_xrefs.json
          retention-days: 14
