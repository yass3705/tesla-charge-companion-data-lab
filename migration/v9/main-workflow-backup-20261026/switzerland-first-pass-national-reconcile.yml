name: Switzerland first-pass national reconciliation

on:
  push:
    paths:
      - 'scripts/reconcile_swiss_first_pass_national.py'
      - '.github/workflows/switzerland-first-pass-national-reconcile.yml'
  workflow_run:
    workflows: ["Switzerland untreated CPO first pass"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/reconcile_swiss_first_pass_national.py
      - name: Persist reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-first-pass-national-reconciliation-2026-09-28.json
          git commit -m 'docs(switzerland): reconcile first-pass files to national EVSE scope' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
