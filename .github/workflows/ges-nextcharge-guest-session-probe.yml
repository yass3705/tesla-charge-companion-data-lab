name: GES NextCharge guest session probe

on:
  push:
    branches:
      - research/ges-nextcharge-v9
    paths:
      - scripts/nextcharge_ges_guest_session_probe.py
      - .github/workflows/ges-nextcharge-guest-session-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Probe guest stations session and station call
        run: python scripts/nextcharge_ges_guest_session_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-guest-session-probe
          path: data/reports/nextcharge_ges_guest_session_probe.json
          retention-days: 14
