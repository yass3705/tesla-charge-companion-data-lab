name: e-Vadea off-motorway validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/evadea_offmotorway_validation_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/evadea-offmotorway-validation.yml"

permissions:
  contents: write

concurrency:
  group: evadea-offmotorway-validation
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Compile probe
        run: python -m py_compile scripts/evadea_offmotorway_validation_probe.py

      - name: Validate off-motorway subset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evadea_offmotorway_validation_probe.py
          cat out/exact-price/evadea-offmotorway/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate sanitized output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/public_safety_check.py out/exact-price/evadea-offmotorway
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/exact-price/evadea-offmotorway/evadea_offmotorway_validation.json').read_text())
          assert p['method']['authenticated'] is False
          assert p['method']['mobilePackageUsed'] is False
          assert p['method']['paymentSubmitted'] is False
          assert p['method']['chargingSessionStarted'] is False
          assert p['method']['persistRawBodies'] is False
          assert p['method']['httpMethods'] == ['GET']
          print(json.dumps(p['conclusion'],ensure_ascii=False))
          PY

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/exact-price
          cp out/exact-price/evadea-offmotorway/evadea_offmotorway_validation.json reports/exact-price/evadea_offmotorway_latest.json
          python scripts/public_safety_check.py reports/exact-price/evadea_offmotorway_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact-price/evadea_offmotorway_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(pricing): publish e-Vadea off-motorway validation [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
