name: Morocco FastVolt public GraphQL

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco/probe_fastvolt_public_graphql.py'
      - '.github/workflows/morocco-fastvolt-public-graphql.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public GraphQL endpoint with query-only payload
        run: |
          mkdir -p reports/morocco/fastvolt
          python scripts/morocco/probe_fastvolt_public_graphql.py > reports/morocco/fastvolt/latest-public-graphql.json
      - name: Validate sanitized output
        run: |
          python - <<'PY'
          import json
          p='reports/morocco/fastvolt/latest-public-graphql.json'
          d=json.load(open(p))
          assert d['policy']['read_only'] is True
          assert d['policy']['no_mutations'] is True
          assert d['policy']['raw_response_body_persisted'] is False
          print(json.dumps(d, indent=2))
          PY
      - name: Commit report if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/fastvolt/latest-public-graphql.json
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m "data(morocco): update FastVolt public GraphQL probe [run $GITHUB_RUN_ID]"
            git push
          fi
