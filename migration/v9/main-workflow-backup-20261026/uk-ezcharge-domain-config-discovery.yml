# manual batch trigger 2026-10-01
name: UK EZ-Charge domain config discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-ezcharge-domain-config-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect domain and tenant configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ez /tmp/ezunpack reports/uk
          curl -fL --retry 3 --retry-delay 2             'https://d.apkpure.net/b/XAPK/com.urbanintegrateduk.ezcharge?version=latest'             -o /tmp/ez/app.xapk
          unzip -q /tmp/ez/app.xapk -d /tmp/ezunpack
          python3 - <<'PY'
          import pathlib,re,subprocess,json,hashlib
          from datetime import datetime,timezone
          root=pathlib.Path('/tmp/ezunpack')
          chunks=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              if p.suffix.lower() in {'.apk','.dex','.so','.js','.bundle','.json','.xml','.properties'}:
                  try:
                      if p.suffix.lower() in {'.apk','.dex','.so'}:
                          t=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace',timeout=60).stdout
                      else:
                          t=p.read_text(errors='replace')
                      chunks.append((str(p.relative_to(root)),t))
                  except: pass
          domre=re.compile(r'(?i)(?<![a-z0-9.-])(?:[a-z0-9-]+\.)+(?:com|net|io|co\.uk|uk|app|cloud|dev)(?::\d{2,5})?(?![a-z0-9.-])')
          domains=set(); contexts=[]
          needles=['tenantEndpoint','AUTH0_PROD_DOMAINS_NAMES','baseUrl','base_url','apiUrl','api_url','CPI_CPO_GET_TARIFF','OcpiEmspGetTariff','site-areas']
          for fn,t in chunks:
              for d in domre.findall(t):
                  dl=d.lower()
                  if any(k in dl for k in ['ez','urban','charge','auth0','ev','cpms','api','cloud','azure','tenant']):
                      domains.add(d)
              low=t.lower()
              for n in needles:
                  pos=0
                  for _ in range(30):
                      i=low.find(n.lower(),pos)
                      if i<0: break
                      s=t[max(0,i-3000):min(len(t),i+7000)]
                      ds=sorted(set(domre.findall(s)))
                      if ds or re.search(r'https?://',s,re.I):
                          s=re.sub(r'([?&](?:token|key|api_key|apikey|code)=)[^&#\s"\']+',r'\1<redacted>',s,flags=re.I)
                          contexts.append({"file":fn,"needle":n,"domains":ds,"context":s[:9000]})
                      pos=i+len(n)
          out={
             "retrievedAt":datetime.now(timezone.utc).isoformat(),
             "package":"com.urbanintegrateduk.ezcharge",
             "domains":sorted(domains),
             "contexts":contexts[:180]
          }
          pathlib.Path('reports/uk/ezcharge-domain-config-discovery-latest.json').write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps({"domains":out["domains"],"contextCount":len(out["contexts"])},ensure_ascii=False,indent=2))
          PY
          rm -rf /tmp/ez /tmp/ezunpack
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/ezcharge-domain-config-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect EZ-Charge tenant domains [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
