name: UK Qwello public springspinne probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-qwello-public-springspinne-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe Qwello public mobile routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          evse="GBQWCEJ259211"
          urls=[
            f"https://api.qwello.eu/springspinne/v1/pub/evses/{urllib.parse.quote(evse,safe='')}",
            "https://api.qwello.eu/springspinne/v1/locations_groups",
            "https://api.qwello.eu/springspinne/v1/locations_groups?limit=10",
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"evseId":evse,"results":[]}
          for url in urls:
              item={"url":url}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Qwello/3.9.5 TeslaChargeCompanion/9","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read(3_000_000)
                      item.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw)})
                      try:
                          p=json.loads(raw.decode("utf-8"))
                          item["json"]=True;item["jsonType"]=type(p).__name__
                          if isinstance(p,dict):
                              item["keys"]=list(p)[:100];item["sample"]=p
                          elif isinstance(p,list):
                              item["count"]=len(p);item["sample"]=p[:3]
                      except Exception:
                          item["json"]=False;item["prefix"]=raw.decode("utf-8","replace")[:2000]
              except urllib.error.HTTPError as e:
                  raw=e.read(100000)
                  item.update({"status":e.code,"error":str(e),"bodyPrefix":raw.decode("utf-8","replace")[:1500]})
              except Exception as e:
                  item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
              out["results"].append(item)
          Path("reports/uk/qwello-public-springspinne-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/qwello-public-springspinne-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Qwello public mobile API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
