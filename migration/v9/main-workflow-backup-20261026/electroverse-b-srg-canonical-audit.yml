name: Audit B SRG canonical PDC profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_srg_canonical_pdcs.mjs"
      - ".github/workflows/electroverse-b-srg-canonical-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit_b_srg_canonical_pdcs.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-srg-canonical-pdc-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B SRG canonical PDC profiles"
            git pull --rebase origin main || true
            git push
          fi
