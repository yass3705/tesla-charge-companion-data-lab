name: UK validated open feeds smoke - Data Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_uk_validated_open_feeds.py'
      - '.github/workflows/uk-validated-open-feeds-smoke.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test Go Zero open feed
        run: |
          python scripts/collect_uk_validated_open_feeds.py --only 'Go Zero' --output artifacts/uk-smoke-gozero.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/uk-smoke-gozero.json'))
          assert d['summary']['failedSources']==0
          assert d['summary']['completeSources']==1
          assert d['sources'][0]['summary']['partyIdsObserved']==['GOZ']
          PY