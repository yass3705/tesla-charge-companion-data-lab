name: IZIVIA Express missing four diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-missing-four-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose 4 unmatched official IZIVIA Express station ids
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,uuid,urllib.request,urllib.error,re,math,concurrent.futures

          DATA='https://www.data.gouv.fr/api/1/datasets/r/95f96484-c602-4b2f-996d-702f61b2e8ab'
          BASE='https://fronts-map.izivia.com/api/'
          NET='67ab64d36b14f13fac39a82d'
          DEVICE=str(uuid.uuid4())
          FILTERS={'chargingConnectors':[],'supportsAutocharge':False,'onlyTwentyFourSeven':False,'onlyAvailable':False,'capabilityTypes':[],'marketingNetworkIds':[NET]}
          TARGET={'FRE04POAZS2811','FRE04POAZS2812','FRE04POAZS292','FRE04POAZS297'}

          def req(url,method='GET',body=None):
            h={'User-Agent':'Mozilla/5.0 TCC-IZIVIA-Diagnostic'}
            if url.startswith(BASE): h.update({'Accept':'application/json','Accept-Language':'fr','Content-Type':'application/json','x-device-id':DEVICE})
            data=None if body is None else json.dumps(body,separators=(',',':')).encode()
            r=urllib.request.Request(url,data=data,headers=h,method=method)
            try:
              with urllib.request.urlopen(r,timeout=25) as x:return x.status,x.read()
            except urllib.error.HTTPError as e:return e.code,e.read()

          st,b=req(DATA); txt=b.decode('utf-8-sig','replace'); d=csv.Sniffer().sniff(txt[:5000],delimiters=',;\t')
          rows=list(csv.DictReader(txt.splitlines(),dialect=d))
          off={}
          for r in rows:
            sid=(r.get('id_station_itinerance') or '').strip()
            if sid in TARGET: off.setdefault(sid,[]).append(r)

          def parse_xy(s):
            nums=[float(x.replace(',','.')) for x in re.findall(r'-?\d+(?:[\.,]\d+)?',s or '')]
            if len(nums)>=2:
              a,b=nums[0],nums[1]
              # IRVE convention commonly [lon,lat]
              return (b,a) if abs(a)<=10 and 40<=b<=52 else (a,b)
            return None

          print('OFFICIAL TARGETS')
          for sid,rr in sorted(off.items()):
            r=rr[0]
            print('\n',sid,'PDC',len(rr))
            print(json.dumps({k:r.get(k) for k in ['nom_station','adresse_station','coordonneesXY','code_insee_commune','nbre_pdc','puissance_nominale','date_maj']},ensure_ascii=False))

          mst,mb=req(BASE+'map/markers','POST',{'square':{'centerLng':2.2,'centerLat':46.2,'zoom':5},'filters':FILTERS})
          markers=json.loads(mb.decode())
          def one(m):
            mid=m['id']; st,b=req(BASE+f'charging-locations/{mid}','POST',{'filters':FILTERS})
            if st!=200:return None
            x=json.loads(b.decode()); return x
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            details=[x for x in ex.map(one,markers) if x]

          def hav(a,b):
            lat1,lon1=a;lat2,lon2=b
            p1,p2=math.radians(lat1),math.radians(lat2);dp=math.radians(lat2-lat1);dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 6371*2*math.atan2(math.sqrt(q),math.sqrt(1-q))

          for sid,rr in sorted(off.items()):
            r=rr[0]; xy=parse_xy(r.get('coordonneesXY'))
            print('\n=== NEAREST FOR',sid,r.get('nom_station'),'xy=',xy,'===')
            scored=[]
            for x in details:
              c=x.get('coordinates') or []
              if len(c)<2 or not xy: continue
              cand=(float(c[1]),float(c[0]))
              scored.append((hav(xy,cand),x))
            for dist,x in sorted(scored,key=lambda z:z[0])[:8]:
              print(f'{dist:.3f} km',json.dumps({'id':x.get('id'),'name':x.get('name'),'address':x.get('address'),'legacyId':x.get('legacyId'),'power':x.get('chargingConnectorsStats')},ensure_ascii=False))
          PY
