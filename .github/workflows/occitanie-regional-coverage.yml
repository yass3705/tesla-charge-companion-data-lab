name: Occitanie regional coverage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/occitanie_regional_coverage.py"
      - ".github/workflows/occitanie-regional-coverage.yml"
      - "data/operator_direct/alize_toulouse_official.json"

permissions:
  contents: write

concurrency:
  group: occitanie-regional-coverage
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public safety
        run: python scripts/public_safety_check.py .

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'

      - name: Extract and consolidate official evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/occitanie
          python -m py_compile scripts/occitanie_regional_coverage.py
          python scripts/occitanie_regional_coverage.py --out out/occitanie 2> >(tee out/occitanie/error.log >&2)
          cat out/occitanie/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate tariff models and regional coverage
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('out/occitanie')
          p=json.loads((r/'occitanie_regional_coverage.json').read_text())
          assert p['region']=='Occitanie'
          assert p['departmentsTotal']==13
          assert p['coverage']['departmentsAccountedFor']==13
          assert p['coverage']['regionalPublicNetworkResearchCoverageComplete'] is True
          assert p['coverage']['reveoDepartmentalMembers']==10
          assert p['coverage']['singleUniversalRegionalTariff'] is False
          assert p['coverage']['allIdentifiedLiveTariffsResolved'] is False
          assert p['tccDecision']['doNotInventDepartmentDefaults'] is True
          assert p['tccDecision']['roamingSeparate'] is True
          assert p['sourceHealth']['officialSourcesReachableAtRun'] >= 10

          rv=json.loads((r/'reveo_official_occitanie.json').read_text())
          assert rv['access']['badgePriceEur']==12.0
          assert rv['access']['subscriptionEurPerMonthPerBadge']==1.5
          assert rv['tccDecision']['genericCurrentDirectTariffClassable'] is False
          assert rv['heraultOutsideMontpellier']['subscriber']['ultraDcGt50']['energyEurPerKwh']==0.50
          assert rv['heraultOutsideMontpellier']['otherUsers']['ultraDcGt50']['energyEurPerKwh']==0.59

          hg=json.loads((r/'sdehg_freshmile_official_occitanie.json').read_text())
          assert hg['networkSnapshot']['stations']==108
          assert hg['directTariff']=={'connectionFeeEur':0.15,'energyEurPerKwh':0.40,'afterConnectionMinutes':240,'timeEurPerHour':4.50}

          g=json.loads((r/'te32_freshmile_official_occitanie.json').read_text())
          assert g['directTariff']=={'acceleratedEurPerKwh':0.25,'rapidEurPerKwh':0.35}

          m=json.loads((r/'montpellier_metropole_etotem_official_occitanie.json').read_text())
          assert m['eCity']['normal7_4']['publicEurPerKwh']==0.45
          assert m['eFast']['normal100']['publicEurPerKwh']==0.59
          assert m['eFast']['postCharge']=={'graceMinutes':10,'eurPer15Min':3.0}

          a=json.loads((r/'aqui_sydeel66_alize_official_occitanie.json').read_text())
          assert a['deployment']['newChargePointsByEnd2026']==306
          assert a['deployment']['ultraRapidPoints']==116
          assert a['tccDecision']['directTariffClassable'] is False

          s=json.loads((r/'sde82_freshmile_official_occitanie.json').read_text())
          assert s['networkSnapshot']['stations']==102
          assert s['latestPublishedTariff']['dcGt24OrAcGt22']['energyEurPerKwh']==0.59
          assert s['latestPublishedTariff']['sessionCapEur']==50.0
          assert s['tccDecision']['directTariffClassableFor2026'] is False
          PY

      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct data/regional_coverage reports/occitanie
          for f in reveo_official_occitanie.json sdehg_freshmile_official_occitanie.json te32_freshmile_official_occitanie.json montpellier_metropole_etotem_official_occitanie.json aqui_sydeel66_alize_official_occitanie.json sde82_freshmile_official_occitanie.json; do
            cp "out/occitanie/$f" "data/operator_direct/$f"
          done
          cp out/occitanie/occitanie_regional_coverage.json data/regional_coverage/
          cp out/occitanie/SUMMARY.md reports/occitanie/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/reveo_official_occitanie.json data/operator_direct/sdehg_freshmile_official_occitanie.json data/operator_direct/te32_freshmile_official_occitanie.json data/operator_direct/montpellier_metropole_etotem_official_occitanie.json data/operator_direct/aqui_sydeel66_alize_official_occitanie.json data/operator_direct/sde82_freshmile_official_occitanie.json data/regional_coverage/occitanie_regional_coverage.json reports/occitanie/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(occitanie): publish validated regional public-network evidence [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/occitanie
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/occitanie/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/occitanie/latest_diagnostic.json').write_text(json.dumps({'dataset':'occitanie-regional-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-60:]},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/occitanie
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/occitanie/latest_run_status.json').write_text(json.dumps({'dataset':'occitanie-regional-run-status','region':'Occitanie','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/occitanie/latest_run_status.json
          if [ "${JOB_STATUS}" = "success" ] && git ls-files --error-unmatch reports/occitanie/latest_diagnostic.json >/dev/null 2>&1; then
            git rm -f reports/occitanie/latest_diagnostic.json
          elif [ -f reports/occitanie/latest_diagnostic.json ]; then
            git add reports/occitanie/latest_diagnostic.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "status(occitanie): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
