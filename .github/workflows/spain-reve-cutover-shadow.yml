name: Spain REVE checkpoint cutover shadow audit (no collection)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/audit_reve_cutover_checkpoint.py
      - .github/workflows/spain-reve-cutover-shadow.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit durable REVE checkpoints without calling the API
        run: python scripts/audit_reve_cutover_checkpoint.py --root . --report reports/migration/reve-cutover-shadow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spain-reve-cutover-shadow
          path: reports/migration/reve-cutover-shadow.json
          retention-days: 14
