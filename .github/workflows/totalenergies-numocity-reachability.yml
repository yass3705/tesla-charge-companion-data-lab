name: TotalEnergies Numocity reachability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/totalenergies_numocity_reachability.py"
      - ".github/workflows/totalenergies-numocity-reachability.yml"

permissions:
  contents: write

concurrency:
  group: totalenergies-numocity-reachability
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/totalenergies_numocity_reachability.py
      - name: Probe Numocity routes read-only
        run: python scripts/totalenergies_numocity_reachability.py
      - name: Validate and publish sanitized report
        run: |
          test -s artifacts/totalenergies-numocity-reachability/summary.json
          python scripts/public_safety_check.py artifacts/totalenergies-numocity-reachability
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/totalenergies-numocity-reachability/summary.json').read_text())
          assert p['policy']['read_only'] is True
          assert p['policy']['no_login'] is True
          assert p['policy']['no_mutations'] is True
          assert p['policy']['no_query_parameters'] is True
          PY
          mkdir -p reports/morocco/totalenergies
          cp artifacts/totalenergies-numocity-reachability/summary.json reports/morocco/totalenergies/latest-numocity-reachability.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/totalenergies/latest-numocity-reachability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(morocco): update TotalEnergies Numocity reachability [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
