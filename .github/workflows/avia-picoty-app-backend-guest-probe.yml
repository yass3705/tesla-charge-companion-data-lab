name: AVIA Picoty app-backend guest probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/avia_picoty_app_backend_guest_probe.py"
      - ".github/workflows/avia-picoty-app-backend-guest-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe documented public guest app-backend routes
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_app_backend_guest_probe.py
          python scripts/avia_picoty_app_backend_guest_probe.py
      - name: Validate read-only report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/reports/avia_picoty_app_backend_guest_probe.json').read_text())
          assert d['schemaVersion']=='1.0.0'
          assert d['credentialsSent'] is False
          assert d['writeMethodsUsed'] is False
          assert len(d['results']) >= 50
          print(d['statusCounts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-app-backend-guest-probe
          path: data/reports/avia_picoty_app_backend_guest_probe.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_app_backend_guest_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe AVIA Picoty public app-backend guest routes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
