name: Bump mobile API discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_mobile_api_discovery.py"
      - ".github/workflows/bump-mobile-api-discovery.yml"

permissions:
  contents: write

concurrency:
  group: bump-mobile-api-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anonymous Google Play downloader
        run: python -m pip install --disable-pip-version-check "goopdl==1.2.1"

      - name: Acquire anonymous FR token
        id: anon_auth
        continue-on-error: true
        run: timeout 120 goopdl auth --country FR

      - name: Download current Bump APK and splits from Google Play
        id: play_download
        if: steps.anon_auth.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf /tmp/bump-apks
          mkdir -p /tmp/bump-apks
          timeout 360 goopdl download bump.charge.com.app --country FR --no-extras -o /tmp/bump-apks
          count="$(find /tmp/bump-apks -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$count" -ge 1
          echo "Downloaded Google Play APK/split count: $count"

      - name: Fallback — download public Bump XAPK for static inspection
        if: steps.anon_auth.outcome != 'success' || steps.play_download.outcome != 'success'
        run: |
          set -euo pipefail
          rm -rf /tmp/bump-apks /tmp/bump-xapk
          mkdir -p /tmp/bump-apks /tmp/bump-xapk
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request, zipfile
          from pathlib import Path

          PAGE='https://apkpure.net/bump/bump.charge.com.app/download'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          req=urllib.request.Request(PAGE, headers={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req, timeout=45) as r:
              page=r.read(2_000_000).decode('utf-8','replace')
          links=re.findall(r'''href=["']([^"']*d\.apkpure\.net/[^"']+)["']''', page, re.I)
          links=[html.unescape(x) for x in links]
          if not links:
              raise SystemExit('No APKPure direct XAPK/APK download link found')
          url=urllib.parse.urljoin(PAGE, links[0])
          out=Path('/tmp/bump-xapk/bump.xapk')
          req=urllib.request.Request(url, headers={'User-Agent':UA,'Referer':PAGE})
          h=hashlib.sha256(); size=0
          with urllib.request.urlopen(req, timeout=90) as r, out.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  size += len(chunk)
                  if size > 350_000_000: raise SystemExit('Unexpectedly large XAPK')
                  h.update(chunk); f.write(chunk)
          if size < 1_000_000: raise SystemExit(f'Download too small: {size}')
          if not zipfile.is_zipfile(out): raise SystemExit('Downloaded file is not a ZIP/XAPK')
          with zipfile.ZipFile(out) as z:
              names=z.namelist()
              manifest={}
              for candidate in ('manifest.json','manifest.json.json'):
                  if candidate in names:
                      try: manifest=json.loads(z.read(candidate))
                      except Exception: pass
                      break
              package=(manifest.get('package_name') or manifest.get('package') or manifest.get('packageName') or '') if isinstance(manifest,dict) else ''
              if package and package != 'bump.charge.com.app':
                  raise SystemExit(f'Unexpected XAPK package: {package}')
              apks=[n for n in names if n.lower().endswith('.apk') and '/' not in n.strip('/')]
              if not apks: apks=[n for n in names if n.lower().endswith('.apk')]
              if not apks: raise SystemExit('No APK payload in XAPK')
              for i,name in enumerate(apks):
                  data=z.read(name)
                  Path('/tmp/bump-apks', f'{i:03d}-{Path(name).name}').write_bytes(data)
          print(json.dumps({'source':'APKPure public XAPK','bytes':size,'sha256':h.hexdigest(),'apkCount':len(apks),'package':package or 'not-declared'}))
          PY

      - name: Verify APK payload exists
        run: |
          count="$(find /tmp/bump-apks -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$count" -ge 1
          echo "APK/split count for static analysis: $count"

      - name: Static API/tariff discovery
        run: python scripts/bump_mobile_api_discovery.py /tmp/bump-apks

      - name: Ensure no APK is staged or persisted
        run: |
          set -euo pipefail
          rm -rf /tmp/bump-apks /tmp/bump-xapk ~/.config/goopdl
          if find . -type f \( -name '*.apk' -o -name '*.apks' -o -name '*.aab' -o -name '*.xapk' \) -print -quit | grep -q .; then
            echo 'Refusing to persist app binaries in repository'
            exit 1
          fi

      - name: Validate sanitized report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/mobile_api_discovery_latest.json').read_text())
          assert p['package']=='bump.charge.com.app'
          assert p['method']['staticAnalysisOnly'] is True
          assert p['method']['appExecuted'] is False
          assert p['method']['authenticatedToBump'] is False
          assert p['method']['queriesOrFragmentsPersisted'] is False
          assert p['counts']['apkCount'] >= 1
          for row in p['candidateUrls']:
              assert '?' not in row['url'] and '#' not in row['url']
          print(p['counts'])
          PY

      - name: Publish sanitized discovery report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/mobile_api_discovery_latest.json reports/bump/mobile_api_discovery_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(bump): publish mobile API discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
