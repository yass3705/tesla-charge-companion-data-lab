name: Bump direct inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_direct_inventory.py"
      - "tests/test_bump_direct_inventory.py"
      - ".github/workflows/bump-direct-inventory.yml"

permissions:
  contents: write

concurrency:
  group: bump-direct-inventory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Bump parser
        run: python -m unittest tests/test_bump_direct_inventory.py -v

      - name: Build official Bump direct inventory
        run: python scripts/bump_direct_inventory.py

      - name: Validate generated inventory
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          p = json.loads(gzip.decompress(Path('data/national/bump_direct_inventory_france.json.gz').read_bytes()))
          assert p['operator'] == 'Bump'
          assert p['country'] == 'FR'
          assert p['scope']['roamingPartnerStationsIncluded'] is False
          assert p['scope']['rankableTariffsPublished'] is False
          assert p['counts']['stationCount'] >= 25
          assert p['counts']['pointCount'] >= p['counts']['stationCount']
          assert p['counts']['bumpOperatedRows'] == p['counts']['pointCount']
          assert all(str(s['operator']).lower().startswith('bump') for s in p['stations'])
          print(p['counts'])
          PY

      - name: Publish inventory and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/bump_direct_inventory_france.json.gz reports/bump_direct_inventory_france.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(bump): publish official France direct inventory [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
