name: Audit Electroverse FR EVC deep
on:
  push:
    branches:
      - audit/electroverse-evc-deep
    paths:
      - "scripts/audit_electroverse_evc_deep.mjs"
      - ".github/workflows/electroverse-evc-deep-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect EVC location
        run: node scripts/audit_electroverse_evc_deep.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-evc-location-4062802.json
          git commit -m "audit: publish EVC residual location report" || exit 0
          git push
