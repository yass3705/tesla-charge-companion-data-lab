name: Grand Est Colmar Freshmile validation
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["scripts/colmar_freshmile_official.py", ".github/workflows/colmar-freshmile-grandest-validation.yml"]
permissions: {contents: write}
concurrency: {group: grandest-colmar-freshmile-validation, cancel-in-progress: true}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official tariff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/colmar_freshmile
          python -m py_compile scripts/colmar_freshmile_official.py
          python scripts/colmar_freshmile_official.py --out out/colmar_freshmile 2> >(tee out/colmar_freshmile/error.log >&2)
      - name: Validate classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/colmar_freshmile/colmar_freshmile_official_grandest.json').read_text())
          assert p['operatorDirect']['energyEurPerKwh']==0.30
          assert p['operatorDirect']['connectedTimeEurPerMinute']==0.03
          assert p['operatorDirect']['timeFeeContinuesWhilePlugged'] is True
          assert p['tccDecision']['directTariffClassable'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/colmar_freshmile
          cp out/colmar_freshmile/colmar_freshmile_official_grandest.json data/operator_direct/colmar_freshmile_official_grandest.json
          cp out/colmar_freshmile/SUMMARY.md reports/colmar_freshmile/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/colmar_freshmile_official_grandest.json reports/colmar_freshmile/latest_summary.md
          if ! git diff --cached --quiet; then git commit -m "data(colmar): publish official Freshmile tariff [run ${GITHUB_RUN_ID}]"; git pull --rebase origin main; git push origin HEAD:main; fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/colmar_freshmile
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/colmar_freshmile/error.log');s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr';s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/colmar_freshmile/latest_diagnostic.json').write_text(json.dumps({'dataset':'colmar-freshmile-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env: {JOB_STATUS: "${{ job.status }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/colmar_freshmile
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/colmar_freshmile/latest_run_status.json').write_text(json.dumps({'dataset':'colmar-freshmile-run-status','operator':'Colmar / Freshmile','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/colmar_freshmile/latest_run_status.json reports/colmar_freshmile/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "status(colmar): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"; for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done; exit 1; fi
