name: Morocco FastVolt EVOne client-context probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_fastvolt_evone_client_context_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-fastvolt-evone-client-context.yml"

permissions:
  contents: write

concurrency:
  group: morocco-fastvolt-evone-client-context
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_fastvolt_evone_client_context_probe.py
      - name: Run static-only client-context probe
        run: python scripts/morocco_fastvolt_evone_client_context_probe.py
      - name: Validate sanitized report
        run: |
          test -s artifacts/morocco-fastvolt-evone-client-context/summary.json
          python scripts/public_safety_check.py artifacts/morocco-fastvolt-evone-client-context
      - name: Persist report
        run: |
          mkdir -p reports/morocco/fastvolt-evone
          cp artifacts/morocco-fastvolt-evone-client-context/summary.json reports/morocco/fastvolt-evone/latest-client-context.json
          python scripts/public_safety_check.py reports/morocco/fastvolt-evone/latest-client-context.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/fastvolt-evone/latest-client-context.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update FastVolt EVOne client context [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
