name: Morocco EVGO AMPECO path-prefix probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_evgo_ampeco_prefix_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-evgo-ampeco-prefix-probe.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-ampeco-prefix-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_evgo_ampeco_prefix_probe.py
      - name: Run read-only path-prefix probe
        run: python scripts/morocco_evgo_ampeco_prefix_probe.py
      - name: Safety-check result
        run: |
          test -s artifacts/morocco-evgo-ampeco-prefix/summary.json
          python scripts/public_safety_check.py artifacts/morocco-evgo-ampeco-prefix
      - name: Persist sanitized report
        run: |
          mkdir -p reports/morocco/evgo
          cp artifacts/morocco-evgo-ampeco-prefix/summary.json reports/morocco/evgo/latest-ampeco-prefix-probe.json
          python scripts/public_safety_check.py reports/morocco/evgo/latest-ampeco-prefix-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-ampeco-prefix-probe.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update EVGO AMPECO prefix probe [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
