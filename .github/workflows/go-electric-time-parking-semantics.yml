name: Go Electric time parking semantics

on:
  push:
    branches:
      - research/go-electric-time-parking-semantics
    paths:
      - scripts/go_electric_nextcharge_tariff_ui_semantics.py
      - .github/workflows/go-electric-time-parking-semantics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/go_electric_nextcharge_tariff_ui_semantics.py
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/go_electric_nextcharge_tariff_ui_semantics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-electric-time-parking-semantics
          path: artifacts/go_electric_nextcharge_tariff_ui_semantics.json
          if-no-files-found: warn
