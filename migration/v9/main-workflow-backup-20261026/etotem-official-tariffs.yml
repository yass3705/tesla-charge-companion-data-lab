name: e-Totem official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/etotem_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/etotem-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: etotem-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract official e-Totem France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/etotem
          python -m py_compile scripts/etotem_official.py
          python scripts/etotem_official.py --out out/etotem 2> >(tee out/etotem/error.log >&2)
          cat out/etotem/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/etotem
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/etotem/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/etotem/latest_diagnostic.json').write_text(json.dumps({'dataset':'etotem-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/etotem/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(etotem): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate e-Totem classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/etotem/etotem_official_france.json').read_text())
          c=p['classification']
          assert c['singleGuaranteedNationalCpoDirectTariff'] is False
          assert c['stationOrNetworkLevelLookupRequiredForExactCpoDirect'] is True
          direct=p['operatorDirect']['directlyOperatedNetworks']
          assert direct['badgeCommissionPercent'] == 0.0
          assert direct['badgeMonthlyFeeEur'] == 0.0
          assert direct['exactPriceLookupRequired'] is True
          semob=p['regionalOffers']['SEMOB']
          assert semob['generalNationalTariff'] is False
          assert semob['monthlyMinimumEur'] == 45.0
          assert semob['includedKwh'] == 100.0
          assert semob['effectiveEurPerKwh'] == 0.45
          assert semob['referenceNonSubscriberEurPerKwh'] == 0.59
          sample=p['representativeNetworkChecks'][0]
          assert sample['tariffs']['eCityNormalBoost7_4To22KwEurPerKwh'] == 0.39
          assert sample['tariffs']['eFast100To180KwEurPerKwh'] == 0.49
          assert sample['postCharge']['graceMinutes'] == 10
          assert len(p['managedNetworkIdsObserved']) >= 5
          print('Validated e-Totem tariff-layer separation and representative local-network rules')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/etotem/etotem_official_france.json')
          dst=Path('data/operator_direct/etotem_official_france.json')
          rep=Path('reports/etotem/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'mobilityProviderLayer':d.get('mobilityProviderLayer'),
                  'regionalOffers':d.get('regionalOffers'),
                  'fees':d.get('fees'),
                  'representativeNetworkChecks':d.get('representativeNetworkChecks'),
                  'managedNetworkIdsObserved':d.get('managedNetworkIdsObserved'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/etotem/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated e-Totem rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/etotem_official_france.json reports/etotem/latest_summary.md
          git commit -m "data(etotem): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
