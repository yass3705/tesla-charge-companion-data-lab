name: Morocco EVGO vendor-domain lite

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/evgo_vendor_domain_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-evgo-vendor-domain-lite.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-vendor-domain-lite
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/evgo_vendor_domain_probe.py
      - name: Run lightweight read-only probe
        run: python scripts/evgo_vendor_domain_probe.py
      - name: Validate generated output
        run: |
          test -s artifacts/evgo-vendor-domain-lite/summary.json
          python scripts/public_safety_check.py artifacts/evgo-vendor-domain-lite
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/evgo-vendor-domain-lite/summary.json').read_text())
          assert p['policy']['read_only'] is True
          assert p['policy']['no_login'] is True
          assert p['policy']['no_mutations'] is True
          assert p['policy']['raw_package_persisted'] is False
          assert p['policy']['raw_credentials_persisted'] is False
          assert p['policy']['raw_lines_persisted'] is False
          print('vendors:', p.get('vendor_keyword_counts',{}))
          print('markers:', p.get('marker_counts',{}))
          print('candidate domains:', p.get('candidate_domains',[])[:30])
          PY
      - name: Persist sanitized summary
        run: |
          mkdir -p reports/morocco/evgo
          cp artifacts/evgo-vendor-domain-lite/summary.json reports/morocco/evgo/latest-vendor-domain-lite.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-vendor-domain-lite.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update EVGO vendor-domain lite report [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
