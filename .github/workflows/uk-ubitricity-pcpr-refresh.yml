name: Ubitricity UK authenticated PCPR refresh
on:
  schedule:
    - cron: '23 6 * * 3'
  push:
    branches: [main]
    paths:
      - scripts/uk_ubitricity_pcpr_collect.py
      - .github/workflows/uk-ubitricity-pcpr-refresh.yml
  workflow_dispatch:
    inputs:
      secret_name:
        description: Existing Actions secret name (never the token value)
        required: false
        default: UBITRICITY_UK_TOKEN
permissions:
  contents: write
concurrency:
  group: uk-ubitricity-pcpr-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect operator-supplied feed
        env:
          UBITRICITY_PCPR_TOKEN: ${{ secrets[inputs.secret_name || 'UBITRICITY_UK_TOKEN'] || secrets.UBITRICITY_PCPR_TOKEN || secrets.UBITRICITY_UK_PCPR_API_KEY || secrets.UBITRICITY_API_KEY }}
        run: python -u scripts/uk_ubitricity_pcpr_collect.py
      - name: Persist collected evidence
        shell: bash
        run: |
          set -euo pipefail
          files=(data/national/uk_ubitricity_pcpr.json.gz reports/uk/ubitricity-pcpr-latest.json)
          checkpoint="$(mktemp -d)"
          for p in "${files[@]}"; do
            mkdir -p "$checkpoint/$(dirname "$p")"
            cp "$p" "$checkpoint/$p"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in "${files[@]}"; do cp "$checkpoint/$p" "$p"; done
            git add "${files[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): Ubitricity authenticated PCPR evidence [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
