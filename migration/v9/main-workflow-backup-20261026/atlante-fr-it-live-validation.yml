name: Atlante FR + IT daily refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/atlante-fr-it-live-validation.yml"
      - "scripts/atlante/extract_atlante.py"
      - "scripts/atlante/bootstrap_subscription_key.sh"

permissions:
  contents: write

concurrency:
  group: atlante-fr-it-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ATLANTE_API_SUBSCRIPTION_KEY: ${{ secrets.ATLANTE_API_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve technical app header
        shell: bash
        run: bash scripts/atlante/bootstrap_subscription_key.sh

      - name: Extract France and Italy
        run: |
          python scripts/atlante/extract_atlante.py \
            --countries FR IT \
            --out results/atlante-live \
            --workers 8 \
            --resume

      - name: Validate both countries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "FR": {"cpo": "FRATL", "minimum": 100},
              "IT": {"cpo": "ITATE", "minimum": 300},
          }
          for country, rule in expected.items():
              report = json.loads(
                  Path(f"results/atlante-live/{country}/report.json").read_text()
              )
              assert report["cpo"] == rule["cpo"], report
              assert report["inventoryStations"] >= rule["minimum"], report
              assert report["extractedStations"] == report["inventoryStations"], report
              assert not report["errors"], report["errors"][:10]
              assert report["connectorCount"] > 0, report
              assert report["pricedConnectors"] == report["connectorCount"], report
              assert report["unpricedConnectors"] == 0, report
              assert report["unmatchedTariffs"] == 0, report
              print(country, {
                  "stations": report["extractedStations"],
                  "connectors": report["connectorCount"],
                  "pricedConnectors": report["pricedConnectors"],
                  "tariffRecords": report["tariffRecords"],
              })
          PY

      - name: Build stable current snapshots
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path

          target = Path("data/national")
          target.mkdir(parents=True, exist_ok=True)
          names = {
              "FR": "atlante_direct_stations_france_latest.json.gz",
              "IT": "atlante_direct_stations_italy_latest.json.gz",
          }
          for country, name in names.items():
              source = Path(f"results/atlante-live/{country}/stations.json")
              target.joinpath(name).write_bytes(
                  gzip.compress(source.read_bytes(), compresslevel=9, mtime=0)
              )
          PY

      - name: Publish current snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/national/atlante_direct_stations_france_latest.json.gz \
            data/national/atlante_direct_stations_italy_latest.json.gz
          if git diff --cached --quiet; then
            echo "Atlante snapshots unchanged."
            exit 0
          fi
          git commit -m "data(atlante): refresh France and Italy direct tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlante-fr-it-live-${{ github.run_id }}
          path: |
            results/atlante-live/FR/report.json
            results/atlante-live/IT/report.json
          retention-days: 30
          if-no-files-found: error
