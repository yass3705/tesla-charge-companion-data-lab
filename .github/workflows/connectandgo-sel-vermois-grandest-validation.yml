name: Grand Est Connectandgo Sel et Vermois validation
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["scripts/connectandgo_sel_vermois_official.py", ".github/workflows/connectandgo-sel-vermois-grandest-validation.yml"]
permissions: {contents: write}
concurrency: {group: grandest-connectandgo-sel-vermois-validation, cancel-in-progress: true}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/connectandgo_sel_vermois
          python -m py_compile scripts/connectandgo_sel_vermois_official.py
          python scripts/connectandgo_sel_vermois_official.py --out out/connectandgo_sel_vermois 2> >(tee out/connectandgo_sel_vermois/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/connectandgo_sel_vermois/connectandgo_sel_vermois_official_grandest.json').read_text())
          assert p['dataset']=='connectandgo-sel-vermois-official-grandest'
          assert p['network']['publishedPlannedStationCount']==28 and p['network']['publishedMunicipalityCount']==11
          assert p['network']['publishedConnectorPowerKw']==[22,25,120]
          assert p['operatorDirect']['withoutSubscription']['day']['below30Kw']=={'eurPerKwh':0.27,'eurPerMinute':0.025}
          assert p['operatorDirect']['withoutSubscription']['day']['above30Kw']=={'eurPerKwh':0.45,'eurPerMinute':0.025}
          assert p['operatorDirect']['withoutSubscription']['idle']['above30Kw']=={'afterMinutes':60,'eurPerMinute':0.20,'condition':'without_consumption'}
          assert p['operatorDirect']['withSubscription']['monthlyEur']==3.0
          assert p['operatorDirect']['withSubscription']['day']['above30Kw']=={'eurPerKwh':0.43,'eurPerMinute':0.02}
          assert p['operatorDirect']['withSubscription']['idle']['above30Kw']=={'afterMinutes':90,'eurPerMinute':0.15,'condition':'without_consumption'}
          assert p['tccDecision']['directTariffClassable'] is True and p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/connectandgo_sel_vermois
          cp out/connectandgo_sel_vermois/connectandgo_sel_vermois_official_grandest.json data/operator_direct/connectandgo_sel_vermois_official_grandest.json
          cp out/connectandgo_sel_vermois/SUMMARY.md reports/connectandgo_sel_vermois/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/connectandgo_sel_vermois_official_grandest.json reports/connectandgo_sel_vermois/latest_summary.md
          if ! git diff --cached --quiet; then git commit -m "data(connectandgo): publish Sel et Vermois tariff rules [run ${GITHUB_RUN_ID}]"; git pull --rebase origin main; git push origin HEAD:main; fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/connectandgo_sel_vermois
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/connectandgo_sel_vermois/error.log');s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr';s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s);Path('reports/connectandgo_sel_vermois/latest_diagnostic.json').write_text(json.dumps({'dataset':'connectandgo-sel-vermois-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env: {JOB_STATUS: "${{ job.status }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/connectandgo_sel_vermois
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/connectandgo_sel_vermois/latest_run_status.json').write_text(json.dumps({'dataset':'connectandgo-sel-vermois-run-status','operator':'Connect&go - Sel et Vermois','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/connectandgo_sel_vermois/latest_run_status.json
          if [ -f reports/connectandgo_sel_vermois/latest_diagnostic.json ]; then git add reports/connectandgo_sel_vermois/latest_diagnostic.json; fi
          if ! git diff --cached --quiet; then git commit -m "status(connectandgo-sel-vermois): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"; for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done; exit 1; fi
