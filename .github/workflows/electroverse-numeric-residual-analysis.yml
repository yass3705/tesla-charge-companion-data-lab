name: Analyze Electroverse France numeric residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_numeric_residual.mjs"
      - ".github/workflows/electroverse-numeric-residual-analysis.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze unpublished numeric identities
        run: node scripts/analyze_electroverse_numeric_residual.mjs
      - name: Persist validated numeric mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/validated-mappings/numeric-residual.json
          if git diff --cached --quiet; then
            echo "No mapping changes"
          else
            git commit -m "data: publish validated Electroverse numeric residual mappings"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - name: Persist numeric residual analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/numeric-residual-analysis.json data/platforms/electroverse/validated-mappings/numeric-residual.json
          if git diff --cached --quiet; then
            echo "No numeric analysis changes"
          else
            git commit -m "data: persist Electroverse numeric residual analysis"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-numeric-residual-analysis
          path: reports/electroverse/numeric-residual-analysis.json
          retention-days: 14
