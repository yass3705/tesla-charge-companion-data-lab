name: IONITY Direct station tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/ionity_station_tariffs.py"
      - "tests/test_ionity_station_tariffs.py"
      - ".github/workflows/ionity-direct-station-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: ionity-direct-station-tariffs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test strict IONITY CPO extraction
        run: python -m unittest tests/test_ionity_station_tariffs.py -v

      - name: Build current France Direct map
        run: python scripts/ionity_station_tariffs.py

      - name: Validate generated map
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          with gzip.open(Path('data/national/ionity_direct_stations_france.json.gz'),'rt',encoding='utf-8') as handle:
              p=json.load(handle)
          assert p['operator']=='IONITY'
          assert p['scope']['requiredCpoIdentifier']=='IONITY_CPO'
          assert p['scope']['subscriberTariffsIncluded'] is False
          assert p['counts']['franceLocationCount'] >= 50
          assert p['counts']['franceConnectorCount'] >= p['counts']['franceLocationCount']
          assert all(x['country']=='FR' and x['cpoIdentifier']=='IONITY_CPO' for x in p['locations'])
          assert all(c['pricePerKwhEur'] > 0 for x in p['locations'] for c in x['connectors'])
          print(p['counts'])
          PY

      - name: Publish updated map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/ionity_direct_stations_france.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(ionity): publish Direct France station tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
