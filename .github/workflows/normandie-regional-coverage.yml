name: Normandie regional coverage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/normandie_regional_coverage.py"
      - ".github/workflows/normandie-regional-coverage.yml"

permissions:
  contents: write

concurrency:
  group: normandie-regional-coverage
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'
      - name: Extract and consolidate current evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/normandie
          python -m py_compile scripts/normandie_regional_coverage.py
          python scripts/normandie_regional_coverage.py --out out/normandie 2> >(tee out/normandie/error.log >&2)
      - name: Validate tariff models and coverage
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/normandie')
          m=json.loads((root/'mobisdec_calvados_official_normandie.json').read_text())
          assert m['directTariffs']['7kva']['energyEurPerKwh']==0.42
          assert m['directTariffs']['150kvaPlus']['energyEurPerKwh']==0.62
          assert m['idleFee']['eurPerMin']==0.21
          e=json.loads((root/'siege27_eure_official_normandie.json').read_text())
          assert e['directTariffs']['ac22']['energyEurPerKwh']==0.40
          assert e['directTariffs']['dcUnder36']['energyEurPerKwh']==0.45
          assert e['directTariffs']['dc90To150']['energyEurPerKwh']==0.50
          c=json.loads((root/'echarge50_manche_official_normandie.json').read_text())
          assert c['subscription']['monthlyFeeEur']==1.0
          assert c['directTariffs']['subscriber']['dcAbove30']==0.45
          assert c['directTariffs']['nonSubscriber']['dcAbove30']==0.55
          o=json.loads((root/'mobility61_orne_official_normandie.json').read_text())
          assert o['directTariffs']['accelerated22']=={'energyEurPerKwh':0.46,'connectedTimeEurPerMin':0.03}
          assert o['directTariffs']['rapid50AndVeryHigh160']=={'energyEurPerKwh':0.60,'connectedTimeEurPerMin':0.12}
          s=json.loads((root/'sde76_mobiplus_official_normandie.json').read_text())
          assert s['directTariffs']['ac22']['connectedTimeEurPerMin']==0.08
          assert s['directTariffs']['dc50']['energyEurPerKwh']==0.50
          assert s['directTariffs']['dc100']['energyEurPerKwh']==0.60
          r=json.loads((root/'rouen_mobi_official_normandie.json').read_text())
          assert r['directTariffs']['normal22']['memberDayEnergyEurPerKwh']==0.44
          assert r['directTariffs']['normal22']['memberNightEnergyEurPerKwh']==0.22
          assert r['directTariffs']['rapid90']['itinerantEnergyEurPerKwh']==0.65
          h=json.loads((root/'le_havre_public_irve_official_normandie.json').read_text())
          assert h['tccDecision']['directTariffClassableAtMetropolitanDefault'] is False
          assert h['tccDecision']['resolveByStationManager'] is True
          p=json.loads((root/'normandie_regional_coverage.json').read_text())
          assert p['region']=='Normandie'
          assert p['departmentsTotal']==5
          assert p['coverage']['departmentsAccountedFor']==5
          assert p['coverage']['regionalPublicNetworkResearchCoverageComplete'] is True
          assert p['coverage']['identifiedEstablishedPublicNetworkFamiliesAccountedFor'] is True
          assert p['coverage']['allDepartmentMainPublicNetworksHaveExactClassableTariffs'] is True
          assert p['coverage']['allLocalMetropolitanFamiliesHaveUniversalTariff'] is False
          assert p['tccDecision']['doNotInventDepartmentDefaults'] is True
          assert p['tccDecision']['roamingSeparate'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct data/regional_coverage reports/normandie
          for f in mobisdec_calvados_official_normandie.json siege27_eure_official_normandie.json echarge50_manche_official_normandie.json mobility61_orne_official_normandie.json sde76_mobiplus_official_normandie.json rouen_mobi_official_normandie.json le_havre_public_irve_official_normandie.json; do
            cp "out/normandie/$f" "data/operator_direct/$f"
          done
          cp out/normandie/normandie_regional_coverage.json data/regional_coverage/
          cp out/normandie/SUMMARY.md reports/normandie/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/mobisdec_calvados_official_normandie.json data/operator_direct/siege27_eure_official_normandie.json data/operator_direct/echarge50_manche_official_normandie.json data/operator_direct/mobility61_orne_official_normandie.json data/operator_direct/sde76_mobiplus_official_normandie.json data/operator_direct/rouen_mobi_official_normandie.json data/operator_direct/le_havre_public_irve_official_normandie.json data/regional_coverage/normandie_regional_coverage.json reports/normandie/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(normandie): publish validated regional public-network evidence [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/normandie
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/normandie/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/normandie/latest_diagnostic.json').write_text(json.dumps({'dataset':'normandie-regional-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-50:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/normandie
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/normandie/latest_run_status.json').write_text(json.dumps({'dataset':'normandie-regional-run-status','region':'Normandie','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/normandie/latest_run_status.json
          if [ "${JOB_STATUS}" = "success" ] && git ls-files --error-unmatch reports/normandie/latest_diagnostic.json >/dev/null 2>&1; then
            git rm -f reports/normandie/latest_diagnostic.json
          elif [ -f reports/normandie/latest_diagnostic.json ]; then
            git add reports/normandie/latest_diagnostic.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "status(normandie): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
