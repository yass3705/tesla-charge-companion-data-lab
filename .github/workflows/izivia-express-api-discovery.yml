name: IZIVIA Express public map API discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-api-discovery.yml"

permissions:
  contents: read

concurrency:
  group: izivia-express-api-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe IZIVIA public charging map network calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python -m pip install --disable-pip-version-check -q selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json, time
          from pathlib import Path

          PAGE='https://fronts-map.izivia.com/'
          opt=Options()
          opt.page_load_strategy='eager'
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--window-size=1440,1600')
          opt.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opt)
          d.set_page_load_timeout(25)
          d.execute_cdp_cmd('Network.enable', {})
          try:
              d.get(PAGE)
              time.sleep(12)
              body=d.find_element('tag name','body').text
              Path('probe/page_body.txt').write_text(body[:100000])
              Path('probe/page_source.html').write_text(d.page_source[:1000000])

              requests=[]
              candidate=[]
              logs=d.get_log('performance')
              responses=[]
              for item in logs:
                  try: msg=json.loads(item['message'])['message']
                  except Exception: continue
                  method=msg.get('method')
                  params=msg.get('params') or {}
                  if method=='Network.requestWillBeSent':
                      req=params.get('request') or {}
                      url=req.get('url','')
                      typ=params.get('type')
                      if typ in ('XHR','Fetch','Script'):
                          requests.append({
                              'requestId':params.get('requestId'),
                              'url':url,
                              'method':req.get('method'),
                              'type':typ,
                              'headerNames':sorted((req.get('headers') or {}).keys()),
                              'postData':req.get('postData')
                          })
                  elif method=='Network.responseReceived':
                      resp=params.get('response') or {}
                      typ=params.get('type')
                      if typ in ('XHR','Fetch'):
                          responses.append({'requestId':params.get('requestId'),'url':resp.get('url',''),'status':resp.get('status'),'mimeType':resp.get('mimeType'),'type':typ})

              for resp in responses:
                  mime=(resp.get('mimeType') or '').lower()
                  if 'json' not in mime and 'text/plain' not in mime:
                      continue
                  try:
                      got=d.execute_cdp_cmd('Network.getResponseBody', {'requestId':resp['requestId']})
                      text=got.get('body','')
                  except Exception as e:
                      text='[response body unavailable: %s]' % (e,)
                  candidate.append({**resp,'body':text[:250000]})

              out={'page':PAGE,'currentUrl':d.current_url,'title':d.title,'body':body[:30000],'requests':requests,'candidateResponses':candidate}
              Path('probe/izivia_public_map_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
              for r in requests[:200]: print('REQ',json.dumps(r,ensure_ascii=False))
          finally:
              d.quit()
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: izivia-express-api-discovery
          path: probe
          retention-days: 3
