name: Bump public map tariff identifier probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/bump_public_map_probe.py"
      - "scripts/bump_direct_inventory.py"
      - ".github/workflows/bump-public-map-probe.yml"

permissions:
  contents: write

concurrency:
  group: bump-public-map-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public Bump map/search routes
        run: python scripts/bump_public_map_probe.py
      - name: Validate bounded read-only report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/public_map_probe_latest.json').read_text())
          m=p['method']
          assert m['unauthenticated'] and m['publicReadOnlySearchOnly'] and m['postUsedForSearchEndpointsOnly']
          assert not m['credentialsUsed'] and not m['cookiesUsed'] and not m['mutationsUsed'] and not m['personalDataQueried']
          assert m['sampleFromOfficialBumpIrve']
          assert p['sample']['stationIdentifier'].startswith('FRBMP')
          assert p['sample']['evseIdentifier'].startswith('FRBMP')
          assert p['attemptCount'] <= 30
          print({'attempts':p['attemptCount'],'http200':p['http200Count'],'useful':p['usefulCount']})
          PY
      - name: Publish sanitized probe report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/public_map_probe_latest.json reports/bump/public_map_probe_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(bump): publish public map probe [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
