name: UK ChargePoint via Shell full collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargepoint-shell-full.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-api-global
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect all UK ChargePoint tariffs visible through Shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 UK-ChargePoint-Shell-Full"; PROVIDER="Shell_RP_2"
          last=0.0; token=None; refreshes=0

          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token,refreshes
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr:
                  token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1
          auth()

          def get(uid):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")+"?"+urllib.parse.urlencode({"providerId":PROVIDER})
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+token,"Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:2000]}
                  except Exception as e:
                      return 0,{"error":repr(e)}
              return 0,{}

          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)
          locs=inv.get("locations") or []
          targets=[]
          for x in locs:
              if str(x.get("operatorName") or "")!="ChargePoint": continue
              uid=str(x.get("uid") or x.get("externalId") or "")
              if uid: targets.append(uid)
          targets=list(dict.fromkeys(targets))

          rows=[]; stats={"targetCount":len(targets),"http200":0,"http429":0,"otherHttp":0,"withTariff":0,"withoutTariff":0,"tariffObjects":0,"connectors":0}
          for i,uid in enumerate(targets,1):
              st,body=get(uid)
              tariffs=[]; connectors=0; evses=[]
              data=body.get("data") if isinstance(body,dict) else None
              if isinstance(data,list) and data: data=data[0]
              if isinstance(data,dict):
                  for ev in data.get("evses") or []:
                      evses.append(ev.get("evseId"))
                      for conn in ev.get("connectors") or []:
                          connectors+=1
                          for t in conn.get("tariffs") or []:
                              tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
              if st==200: stats["http200"]+=1
              elif st==429: stats["http429"]+=1
              else: stats["otherHttp"]+=1
              stats["connectors"]+=connectors; stats["tariffObjects"]+=len(tariffs)
              if tariffs: stats["withTariff"]+=1
              elif st==200: stats["withoutTariff"]+=1
              rows.append({"uid":uid,"httpStatus":st,"evseIds":evses,"connectorCount":connectors,"tariffCount":len(tariffs),"tariffs":tariffs})
              print(f"[{i}/{len(targets)}] {uid} HTTP {st} tariffs={len(tariffs)}",flush=True)

          coverage=(100*stats["withTariff"]/stats["targetCount"]) if stats["targetCount"] else 0
          report={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),"providerId":PROVIDER,
              **stats,"coveragePct":round(coverage,2),"tokenRefreshCount":refreshes,
              "failClosedCount":stats["withoutTariff"]+stats["http429"]+stats["otherHttp"],
              "noTariffUids":[x["uid"] for x in rows if x["httpStatus"]==200 and x["tariffCount"]==0],
              "errorUids":[x["uid"] for x in rows if x["httpStatus"]!=200]
          }
          Path("reports/uk/chargepoint-shell-full-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          with gzip.open("data/national/uk_chargepoint_shell_tariffs.json.gz","wt",encoding="utf-8") as g:
              json.dump({"retrievedAt":report["retrievedAt"],"providerId":PROVIDER,"locations":rows},g,ensure_ascii=False)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish ChargePoint dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/national/uk_chargepoint_shell_tariffs.json.gz /tmp/uk_chargepoint_shell_tariffs.json.gz
          cp reports/uk/chargepoint-shell-full-latest.json /tmp/chargepoint-shell-full-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/uk_chargepoint_shell_tariffs.json.gz data/national/uk_chargepoint_shell_tariffs.json.gz
            cp /tmp/chargepoint-shell-full-latest.json reports/uk/chargepoint-shell-full-latest.json
            git add data/national/uk_chargepoint_shell_tariffs.json.gz reports/uk/chargepoint-shell-full-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): collect ChargePoint tariffs via Shell [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with another writer; retrying (${attempt}/5)"
            sleep $((attempt * 2))
          done
          exit 1
