name: Switzerland eCarUp residual name batch

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/resolve_swiss_ecarup_residual_name_batch.py'
      - '.github/workflows/switzerland-ecarup-residual-name-batch.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve next batch
        run: python3 scripts/resolve_swiss_ecarup_residual_name_batch.py
      - name: Persist results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/ecarup-residual-name-search-overlay-2026-09-29.json
          git add docs/switzerland-ecarup-residual-name-search-batch-2026-09-29.json
          git add docs/switzerland-cpo-progress-2026-09.json
          git commit -m 'data(switzerland): resolve next eCarUp residual name batch' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
