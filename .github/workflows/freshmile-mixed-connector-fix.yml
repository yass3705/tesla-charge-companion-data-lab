name: Repair Freshmile mixed connector classification

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/freshmile-mixed-connector-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply systemic mixed-EVSE fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/freshmile_build_tcc_v8.py')
          s=p.read_text(encoding='utf-8')

          helper="""def connector_kind(point_kind,connector):
           standard=norm((connector or {}).get('standard'))
           if any(token in standard for token in ('combo','chademo','ccs')):return 'DC'
           if any(token in standard for token in ('type 2','t2','mennekes')):return 'AC'
           return point_kind if point_kind in {'AC','DC'} else ''
          """
          marker='def read_gzip(path):return json.load(gzip.open(path,\'rt\',encoding=\'utf-8\'))'
          if 'def connector_kind(point_kind,connector):' not in s:
              if marker not in s: raise SystemExit('Freshmile builder marker missing')
              s=s.replace(marker,helper+marker,1)

          old="point_kind=str(point.get('kind') or '').upper()\n   if point_kind not in {'AC','DC'}:rejection['unsupported_connector_kind']+=rankable_on_point;continue"
          new="point_kind=str(point.get('kind') or '').upper()\n   if point_kind not in {'AC','DC','MIXED'}:rejection['unsupported_connector_kind']+=rankable_on_point;continue"
          if old in s:s=s.replace(old,new,1)
          elif "point_kind not in {'AC','DC','MIXED'}" not in s:raise SystemExit('Freshmile point-kind gate not found')

          old="connector=tariff.get('connector') or {}\n    try:connector_power=float(connector.get('powerKw') or point.get('powerKw') or 0)"
          new="connector=tariff.get('connector') or {}\n    kind=connector_kind(point_kind,connector)\n    if kind not in {'AC','DC'}:\n     rejection['unsupported_connector_kind']+=1;continue\n    try:connector_power=float(connector.get('powerKw') or point.get('powerKw') or 0)"
          if old in s:s=s.replace(old,new,1)
          elif 'kind=connector_kind(point_kind,connector)' not in s:raise SystemExit('Freshmile connector classification insertion point missing')

          old="accepted_records+=1;power_key=(point_kind,round(connector_power,3));"
          new="accepted_records+=1;power_key=(kind,round(connector_power,3));"
          if old in s:s=s.replace(old,new,1)
          elif 'power_key=(kind,round(connector_power,3))' not in s:raise SystemExit('Freshmile power grouping marker missing')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate connector semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/freshmile_build_tcc_v8.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('fm','scripts/freshmile_build_tcc_v8.py')
          fm=importlib.util.module_from_spec(spec);spec.loader.exec_module(fm)
          assert fm.connector_kind('MIXED',{'standard':'IEC_62196_T2'})=='AC'
          assert fm.connector_kind('MIXED',{'standard':'CHADEMO'})=='DC'
          assert fm.connector_kind('MIXED',{'standard':'IEC_62196_T2_COMBO'})=='DC'
          assert fm.connector_kind('AC',{'standard':'UNKNOWN'})=='AC'
          print('Freshmile mixed connector semantics OK')
          PY

      - name: Commit builder fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/freshmile_build_tcc_v8.py
          if git diff --cached --quiet; then
            echo 'Freshmile builder already repaired.'
          else
            git commit -m 'fix(freshmile): classify mixed EVSE connectors individually'
            git push origin HEAD:main
          fi
