name: Qovoltis QoAPI exact interface extract

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-qoapi-interface-extract.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and decode official Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work probe/interfaces probe/models probe/http
          curl -sS -L --max-time 120 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=443' \
            -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          BASE=$(find work/xapk -type f -name '*.apk' | sort | head -1)
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool >/dev/null
          apktool d -f "$BASE" -o work/decoded >/dev/null 2>&1

      - name: Extract exact Retrofit method annotations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json

          root=Path('work/decoded')
          api_files=[]
          for p in root.rglob('*.smali'):
              try: t=p.read_text(errors='replace')
              except: continue
              if 'Lretrofit2/http/' not in t: continue
              low=str(p).lower()
              if any(k in low for k in ('mainmap','locateterminal','qrscanner','subscription','profileapi','network')):
                  api_files.append(p)

          methods=[]
          for p in sorted(api_files):
              t=p.read_text(errors='replace')
              # Preserve exact relevant interfaces for review.
              rel=str(p).split('/com/qovoltis/client/',1)[-1].replace('/','__')
              Path('probe/interfaces',rel).write_text(t,encoding='utf-8')
              blocks=re.findall(r'(?ms)^\.method\s+.*?^\.end method\s*$',t)
              for b in blocks:
                  hm=re.search(r'Lretrofit2/http/(GET|POST|PUT|DELETE|PATCH);',b)
                  if not hm: continue
                  http=hm.group(1)
                  # Path is the value inside the HTTP annotation block.
                  ann=re.search(r'(?ms)\.annotation runtime Lretrofit2/http/'+http+r';(.*?)\.end annotation',b)
                  path=None
                  if ann:
                      vm=re.search(r'value\s*=\s*"([^"]*)"',ann.group(1))
                      if vm: path=vm.group(1)
                  decl=b.splitlines()[0].strip()
                  pname=re.search(r'\.method\s+[^ ]+\s+([^\(]+)',decl)
                  method_name=pname.group(1) if pname else decl
                  params=[]
                  for typ,val in re.findall(r'(?ms)\.annotation runtime Lretrofit2/http/(Path|Query|QueryMap|Header|HeaderMap|Body|Field|FieldMap);(.*?)\.end annotation',b):
                      vm=re.search(r'value\s*=\s*"([^"]*)"',val)
                      params.append({'type':typ,'value':vm.group(1) if vm else None})
                  methods.append({
                      'file':str(p).split('work/decoded/',1)[-1],
                      'method':method_name,
                      'declaration':decl,
                      'http':http,
                      'path':path,
                      'params':params
                  })

          Path('probe/retrofit-methods.json').write_text(json.dumps(methods,ensure_ascii=False,indent=2),encoding='utf-8')
          with Path('probe/retrofit-methods.txt').open('w',encoding='utf-8') as f:
              for m in methods:
                  f.write(f"{m['http']}\t{m['path']}\t{m['method']}\t{m['file']}\t{m['params']}\n")
          print(Path('probe/retrofit-methods.txt').read_text()[:60000])
          PY

      - name: Extract station and pricing response/request models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/decoded')
          names=('MapStationListQueryRequest','StationFilterRequest','MapStationListResponse','DataMapStationList','StationDetailsResponse','DataStationDetails','Stations','PricingTotal','DurationRate','SubscriptionData','ChargeSocketDataResponse','FetchStationsListRequestBody','FetchStationsListResponseBody')
          out=[]
          for name in names:
              matches=list(root.rglob(name+'.smali'))
              for p in matches:
                  t=p.read_text(errors='replace')
                  Path('probe/models',name+'__'+p.parent.name+'.smali').write_text(t,encoding='utf-8')
                  fields=[]
                  for line in t.splitlines():
                      if line.startswith('.field '): fields.append(line.strip())
                  strings=[]
                  for m in re.finditer(r'const-string\s+[^,]+,\s*"([^"]+)"',t):
                      s=m.group(1)
                      if len(s)<180 and any(k in s.lower() for k in ('price','pricing','tariff','kwh','rate','station','borne','coord','connector','offer','duration','power','ref')):
                          strings.append(s)
                  out.append('### '+str(p).split('work/decoded/',1)[-1]+'\n'+'\n'.join(fields)+'\nSTRINGS:\n'+'\n'.join(dict.fromkeys(strings)))
          Path('probe/model-summary.txt').write_text('\n\n'.join(out),encoding='utf-8')
          print(Path('probe/model-summary.txt').read_text()[:60000])
          PY

      - name: Probe only exact non-mutating anonymous routes
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          methods=json.loads(Path('probe/retrofit-methods.json').read_text())
          base='https://qoapi.qovoltis.com/api/'
          rows=[]
          n=0
          for m in methods:
              path=m.get('path') or ''
              name=(m.get('method') or '').lower()
              http=m.get('http')
              # Safe read-only probes only. POST is allowed only for methods explicitly named as retrieval/list/map operations.
              safe=(http=='GET') or (http=='POST' and any(x in name for x in ('getmapstationlist','fetchstations','getstations','stationlist')))
              if not safe or not path: continue
              # Skip routes requiring path substitution until a real station id is obtained.
              if '{' in path or '}' in path: continue
              n+=1
              if n>30: break
              url=base+path.lstrip('/')
              bodyfile=Path(f'probe/http/{n}.body')
              hdrfile=Path(f'probe/http/{n}.headers')
              cmd=['curl','-sS','-L','--max-time','20','-A','Qovoltis-Discovery/1.0','-H','Accept: application/json','-D',str(hdrfile),'-o',str(bodyfile),'-w','%{http_code}']
              if http=='POST': cmd += ['-H','Content-Type: application/json','-X','POST','--data','{}']
              cmd += [url]
              try: code=subprocess.check_output(cmd,text=True).strip()
              except Exception as e: code='ERR'
              size=bodyfile.stat().st_size if bodyfile.exists() else 0
              sample=bodyfile.read_text(errors='replace')[:1200] if bodyfile.exists() else ''
              rows.append({'http':http,'path':path,'method':m.get('method'),'code':code,'bytes':size,'sample':sample})
          Path('probe/http/results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          for r in rows:
              print(r['code'],r['bytes'],r['http'],r['path'],r['method'],repr(r['sample'][:250]))
          PY

      - name: Upload exact interface evidence
        uses: actions/upload-artifact@v4
        with:
          name: qovoltis-qoapi-exact-interfaces
          path: probe
          retention-days: 3
