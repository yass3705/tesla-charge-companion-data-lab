name: Debug B SRG top mappings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/debug_b_srg_top_mappings.mjs"
      - ".github/workflows/electroverse-b-srg-top-debug.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/debug_b_srg_top_mappings.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-srg-top-mapping-debug.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B SRG top mapping debug"
            git pull --rebase origin main || true
            git push
          fi
