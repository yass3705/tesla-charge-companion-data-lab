name: Switzerland Partino Baden point tariff

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-partino-baden-point-tariff.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch exact public Partino point tariff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,urllib.error,http.cookiejar
          from pathlib import Path
          from datetime import datetime,timezone
          BASE="https://partino-chf.evc-net.com"; UA="Mozilla/5.0 TCC-V9-Partino-Point"
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def get(url,params=None,headers=None):
            if params: url += ("&" if "?" in url else "?")+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers=headers or {"User-Agent":UA},method="GET")
            try:
              with op.open(req,timeout=45) as r:return r.status,r.read()
            except urllib.error.HTTPError as e:return e.code,e.read()
            except Exception as e:return 0,(type(e).__name__+": "+str(e)).encode()
          get(BASE+"/Locations",headers={"User-Agent":UA,"Accept":"text/html,*/*"})
          req0={"handler":"\\LMS\\EV\\AsyncServices\\DashboardAsyncService","method":"spotsStatusPointData","params":{"deviceIds":[89615556],"tariffProvider":438}}
          st,raw=get(BASE+"/api/ajax",{
            "requests":json.dumps({"0":req0},separators=(",",":")),
            "metricKey":"DeviceMap_1037"
          },{"User-Agent":UA,"Accept":"application/json","Referer":BASE+"/Locations","X-Requested-With":"XMLHttpRequest"})
          try: body=json.loads(raw.decode("utf-8"))
          except: body={"_raw":raw.decode("utf-8","replace")[:10000]}
          out={
            "schemaVersion":1,"country":"CH","cpo":"Partino","operatorId":"CH*PAR",
            "generatedAt":datetime.now(timezone.utc).isoformat(),
            "source":{"portal":BASE+"/Locations","api":BASE+"/api/ajax","method":"spotsStatusPointData","deviceId":89615556,"tariffProvider":438,"authentication":"anonymous public portal"},
            "httpStatus":st,"response":body
          }
          Path("docs/switzerland-partino-baden-point-tariff-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-partino-baden-point-tariff-2026-09-29.json
          git commit -m "research(ch): capture Partino Baden point tariff" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
