name: Morocco Kilowatt public station inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco/kilowatt_public_station_inventory.py'
      - '.github/workflows/morocco-kilowatt-public-station-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract public Kilowatt station inventory safely
        run: python scripts/morocco/kilowatt_public_station_inventory.py
      - name: Commit sanitized inventory if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/kilowatt/latest-public-station-inventory.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
          else
            git commit -m 'data(morocco): publish Kilowatt public station inventory [run ${{ github.run_id }}]'
            git push
          fi
