name: Belgium ChargePlus static analysis
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-chargeplus-static-analysis.txt"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download temporary Charge+ XAPK and inspect endpoint strings
        run: python scripts/belgium_chargeplus_static_analysis.py
      - name: Persist sanitized report only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/chargeplus-static-analysis-2026-09-28.json
          git commit -m "Analyze Charge+ endpoints for Belgium tariffs" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
