name: UK Qwello tariff API module inspect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-qwello-tariff-api-module.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch Qwello tariff modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Qwello","modules":[]}
          for url in ["https://tariff.qwello.eu/api.js","https://tariff.qwello.eu/search.js"]:
              req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9","Accept":"application/javascript,text/plain,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(1000000).decode("utf-8","replace")
              # redact token-like values defensively
              safe=re.sub(r'(?i)(token|key|secret)(["\']?\s*[:=]\s*["\'])[^"\']{8,}',r'\1\2<redacted>',body)
              out["modules"].append({"url":url,"bytes":len(body),"body":safe})
          Path("reports/uk/qwello-tariff-api-module-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/qwello-tariff-api-module-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Qwello tariff frontend modules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
