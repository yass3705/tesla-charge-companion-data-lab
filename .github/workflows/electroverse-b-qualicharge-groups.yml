name: Audit B QualiCharge technical groups
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_qualicharge_technical_groups.py"
      - ".github/workflows/electroverse-b-qualicharge-groups.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_b_qualicharge_technical_groups.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-qualicharge-technical-group-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B QualiCharge technical groups"
            git pull --rebase origin main || true
            git push
          fi
