name: France E55C verified PAN identity crosswalk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/e55c_pan_identity_crosswalk.py"
      - ".github/workflows/e55c-pan-identity-crosswalk.yml"
permissions:
  contents: write
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and validate the 54 exact E55C identity aliases
        run: |
          python -m py_compile scripts/e55c_pan_identity_crosswalk.py
          python scripts/e55c_pan_identity_crosswalk.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/operator_direct/e55c_pan_identity_crosswalk_france.json').read_text())
          assert p['matchedCount']==54 and p['unmatchedCount']==1
          assert not p['directTariffPromotionAuthorized']
          assert all(not x['directConsumerTariffValidated'] for x in p['records'])
          assert p['unmatched'][0]['panPdcId']=='FR55CEFR84160178MA103'
          PY
      - name: Publish proven identity aliases only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/e55c_pan_identity_crosswalk_france.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fr): publish E55C 54 exact PAN alias proofs [run ${GITHUB_RUN_ID}]"
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((n*2))
            done
            exit 1
          fi
