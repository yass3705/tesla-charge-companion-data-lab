name: Audit DREE Ferdinand Braun all PAN rows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_dree_ferdinand_braun_pan.py"
      - ".github/workflows/electroverse-b-dree-pan-all.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_dree_ferdinand_braun_pan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-dree-ferdinand-braun-pan-all.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist all DREE Ferdinand Braun PAN rows"
            git pull --rebase origin main || true
            git push
          fi
