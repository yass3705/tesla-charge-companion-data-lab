name: UK Weev targeted bundle audit
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/uk-weev-targeted-bundle-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect only Weev first-party bundles
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          urls=[
            "https://weev.ie/build/assets/maps-BFV4ss5j.js",
            "https://weev.ie/build/assets/app-BWNgRQEY.js",
            "https://weev.ie/build/assets/axios-CCb-kr4I.js"
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Weev","assets":[]}
          for url in urls:
              req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9","Accept":"application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r: body=r.read(8000000).decode("utf-8","replace")
              hosts=sorted(set(re.findall(r'https?://([A-Za-z0-9.-]+)',body)))
              full=[]
              for u in re.findall(r'https?://[^"\'\s<>()\\]+',body):
                  if any(k in u.lower() for k in ("weev","api","station","charger","location","tariff","evse")):
                      full.append(u.split("?")[0][:500])
              strings=[]
              for s in re.findall(r'["\']([^"\']{3,240})["\']',body):
                  if any(k in s.lower() for k in ("api","station","charger","location","tariff","evse")):
                      if not any(k in s.lower() for k in ("google","font","analytics","zoho")):
                          strings.append(s)
              ctx=[]
              for m in re.finditer(r'(?i)(axios|fetch\(|baseURL|station|charger|location|tariff|evse)',body):
                  c=body[max(0,m.start()-350):min(len(body),m.end()+700)]
                  if any(x in c for x in ("axios","fetch(","baseURL","http","/api/")):
                      c=re.sub(r'(?i)(token|key|secret)(["\']?\s*[:=]\s*["\'])[^"\']{8,}',r'\1\2<redacted>',c)
                      ctx.append(c)
                      if len(ctx)>=80: break
              out["assets"].append({"url":url,"bytes":len(body),"hosts":hosts,"urls":sorted(set(full))[:100],"strings":sorted(set(strings))[:200],"contexts":ctx[:80]})
          Path("reports/uk/weev-targeted-bundle-audit-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/weev-targeted-bundle-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit Weev first-party map bundles [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
