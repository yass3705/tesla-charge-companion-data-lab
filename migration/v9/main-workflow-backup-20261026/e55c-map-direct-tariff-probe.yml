name: France E55C public direct tariff map probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/e55c-map-direct-tariff-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe map.e55c.com and exact tariff surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/e55c /tmp/e55c
          python - <<'PY'
          import requests,re,json,pathlib,urllib.parse
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'})
          out={'operator':'Electric 55 Charging','country':'FR','base':'https://map.e55c.com/'}
          attempts=[]
          for u in ['https://map.e55c.com/','https://map.e55c.com']:
            try:
              r=S.get(u,timeout=30,allow_redirects=True)
              attempts.append({'url':u,'finalUrl':r.url,'status':r.status_code,'contentType':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:500000]})
            except Exception as e: attempts.append({'url':u,'error':type(e).__name__+': '+str(e)[:200]})
          out['pageAttempts']=[{k:v for k,v in a.items() if k!='text'} for a in attempts]
          scripts=[]; candidates=set(); snippets=[]
          for a in attempts:
            txt=a.get('text','')
            if not txt: continue
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',txt,re.I):
              scripts.append(urllib.parse.urljoin(a.get('finalUrl') or a['url'],src))
            for uu in re.findall(r'https?://[^"\'\\\s<>)]+',txt): candidates.add(uu)
            low=txt.lower()
            for term in ['api','station','tarif','price','charge','payment','stripe','connector','evse']:
              pos=0
              while True:
                i=low.find(term,pos)
                if i<0: break
                snippets.append(txt[max(0,i-200):i+700]); pos=i+len(term)
                if len(snippets)>120: break
          asset_findings=[]
          for u in list(dict.fromkeys(scripts))[:100]:
            try:
              r=S.get(u,timeout=30); txt=r.text
              urls=sorted(set(re.findall(r'https?://[^"\'\\\s<>)]+',txt)))
              paths=sorted(set(re.findall(r'["\'](/[^"\']{2,160})["\']',txt)))
              rel=[p for p in paths if any(t in p.lower() for t in ['api','station','tarif','price','charge','payment','connector','evse','session'])]
              sn=[]; low=txt.lower()
              for term in ['tariff','tarif','price','pricing','evse','connector','station','payment','stripe','api/']:
                pos=0
                while True:
                  i=low.find(term,pos)
                  if i<0: break
                  sn.append(txt[max(0,i-200):i+700]); pos=i+len(term)
                  if len(sn)>=100: break
              asset_findings.append({'url':u,'status':r.status_code,'bytes':len(r.content),'urls':[x for x in urls if any(t in x.lower() for t in ['api','charge','station','tarif','price','payment','stripe'])][:200],'paths':rel[:300],'snippets':sn[:100]})
            except Exception as e: asset_findings.append({'url':u,'error':type(e).__name__})
          out['scripts']=scripts
          out['candidateUrls']=sorted(candidates)[:400]
          out['pageSnippets']=snippets[:120]
          out['assetFindings']=asset_findings
          pathlib.Path('reports/france/e55c/map-direct-tariff-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'pageAttempts':out['pageAttempts'],'scripts':scripts,'assetFindings':[{k:v for k,v in x.items() if k!='snippets'} for x in asset_findings]},ensure_ascii=False)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/e55c/map-direct-tariff-probe.json
          git commit -m 'France E55C: publish public direct tariff map probe' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
