name: WAAT Monta guest API probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/waat-monta-guest-api-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce Monta Web Map guest API flow
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA='Mozilla/5.0 TeslaChargeCompanion/1.0'
          BASE='https://api.monta.app'
          ORIGIN='https://maps.monta.app'
          out={'generatedAt':datetime.now(timezone.utc).isoformat(),'guestAttempts':[],'apiProbes':[]}

          def req(url,method='GET',body_marker=False,token=None,extra_headers=None,limit=900000):
            headers={'User-Agent':UA,'Accept':'application/json','Origin':ORIGIN,'Referer':ORIGIN+'/'}
            if extra_headers: headers.update(extra_headers)
            data=None
            if body_marker:
              data=b''
            if token: headers['Authorization']='Bearer '+token
            r=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(r,timeout=35) as h:return h.status,h.geturl(),dict(h.headers),h.read(limit).decode('utf-8','ignore')
            except urllib.error.HTTPError as e:return e.code,e.geturl(),dict(e.headers),e.read(limit).decode('utf-8','ignore')

          def find_token(x):
            if isinstance(x,dict):
              for k,v in x.items():
                if k.lower() in ('access_token','accesstoken') and isinstance(v,str) and len(v)>20:return v
              for v in x.values():
                z=find_token(v)
                if z:return z
            elif isinstance(x,list):
              for v in x:
                z=find_token(v)
                if z:return z
            return None

          attempts=[
            {'Operator':'monta'},
            {'Operator':'monta','Application':'monta-web-map'},
            {'Operator':'monta','Application':'monta-web-map','Application-Version':'1.0.0'},
            {'Operator':'monta','Application':'monta-web-map','Version':'1.0.0'},
            {'Operator':'monta','Operation':'monta-web-map'},
          ]
          token=None; winning_headers=None
          for hset in attempts:
            st,fu,he,txt=req(BASE+'/api/v1/auth/guest','POST',True,None,hset)
            safe={'headers':hset,'status':st,'contentType':he.get('Content-Type'),'tokenFound':False,'bodyPreview':txt[:1800]}
            try:
              d=json.loads(txt); tok=find_token(d)
              if tok:
                token=tok; winning_headers=hset
                safe['tokenFound']=True; safe['tokenLength']=len(tok); safe['bodyPreview']='[guest token redacted] top-level keys='+str(list(d.keys()) if isinstance(d,dict) else type(d).__name__)
            except Exception: pass
            out['guestAttempts'].append(safe)
            if token: break

          if token:
            common=winning_headers or {'Operator':'monta'}
            urls=[
              BASE+'/api/v1/operators/current',
              BASE+'/api/v1/charge_points/218305',
              BASE+'/api/v1/charge_points/179509',
              BASE+'/api/v1/charge_points/map?top=51.2&bottom=41.2&left=-5.5&right=9.8&zoom=5&center_lat=46.5&center_lng=2.2&segmented=1',
              BASE+'/api/v1/charge_points/by_country?country=FR&page=1&per_page=20',
            ]
            for u in urls:
              st,fu,he,txt=req(u,'GET',False,token,common)
              item={'url':u,'status':st,'contentType':he.get('Content-Type')}
              try:
                d=json.loads(txt)
                item['json']=d
              except Exception:
                item['bodyPreview']=txt[:8000]
              out['apiProbes'].append(item)

          p=Path('data/reports/waat_monta_guest_api_probe.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          summary={'guestAttempts':out['guestAttempts'],'apiProbeSummary':[]}
          for x in out['apiProbes']:
            d=x.get('json')
            entry={'url':x['url'],'status':x['status']}
            if isinstance(d,dict): entry['keys']=list(d.keys())[:50]
            entry['containsPricing']=('pric' in json.dumps(d,ensure_ascii=False).lower()) if d is not None else False
            summary['apiProbeSummary'].append(entry)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit guest API report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/waat_monta_guest_api_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish WAAT Monta guest API probe"
          for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
