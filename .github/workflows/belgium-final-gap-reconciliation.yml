name: Belgium final gap reconciliation
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-final-gap-reconciliation.txt"
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_finalize_gap_reconciliation.py
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/shell_belgium_official_2026-09-28.json reports/belgium/belgium-final-gap-reconciliation-2026-09-28.json
          git commit -m "Finalize Belgium tariff gap reconciliation" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
