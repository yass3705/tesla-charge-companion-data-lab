name: Qovoltis latest binary strings

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-latest-binary-strings.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and unpack latest Qovoltis app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/apk probe
          curl -fSsL --max-time 180 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?version=latest' \
            -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          BASE=$(find work/xapk -type f -name 'com.qovoltis.client.apk' | head -1)
          unzip -q "$BASE" -d work/apk
          echo "$BASE" > probe/base.txt
          find work/apk -maxdepth 3 -type f -printf '%p\t%s\n' | sort > probe/file-list.txt
          grep -Ei 'flutter|react|bundle|assets|libapp|classes.*dex|hermes' probe/file-list.txt | head -1000 > probe/framework-files.txt || true
          cat probe/framework-files.txt

      - name: Extract URL and pricing strings from DEX assets and native libs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          root=Path('work/apk')
          candidates=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=str(p.relative_to(root)).lower()
              if (p.name.startswith('classes') and p.suffix=='.dex') or rel.startswith('assets/') or rel.startswith('lib/'):
                  candidates.append(p)
          url_rows=[]; hit_rows=[]; domain_rows=[]
          key=re.compile(r'qovoltis|qoapi|qoreal|https?://|/api/|station|borne|charge|connector|connecteur|price|pricing|tarif|kwh|offer|subscription|nomad|emsp|map',re.I)
          urlpat=re.compile(r'https?://[^\s"\'<>]{4,220}',re.I)
          for p in candidates:
              try:
                  r=subprocess.run(['strings','-a','-n','4',str(p)],capture_output=True,text=True,errors='replace',timeout=45)
                  lines=r.stdout.splitlines()
              except Exception:
                  continue
              rel=str(p.relative_to(root))
              for i,s in enumerate(lines):
                  if 'qovoltis' in s.lower() or 'qoapi' in s.lower() or 'qoreal' in s.lower():
                      domain_rows.append(f'{rel}:{i+1}\t{s[:1000]}')
                  for u in urlpat.findall(s):
                      if any(k in u.lower() for k in ('qovoltis','api','charge','station','map','borne')):
                          url_rows.append(f'{rel}:{i+1}\t{u[:1000]}')
                  if key.search(s) and len(s) <= 1200:
                      lo=max(0,i-2); hi=min(len(lines),i+3)
                      hit_rows.append(f'===== {rel}:{i+1} =====\n'+'\n'.join(lines[lo:hi]))
          Path('probe/domain-strings.txt').write_text('\n'.join(domain_rows),encoding='utf-8')
          Path('probe/url-strings.txt').write_text('\n'.join(dict.fromkeys(url_rows)),encoding='utf-8')
          Path('probe/context-strings.txt').write_text('\n\n'.join(hit_rows[:12000]),encoding='utf-8')
          print('=== DOMAIN ===')
          print(Path('probe/domain-strings.txt').read_text(errors='replace')[:60000])
          print('=== URLS ===')
          print(Path('probe/url-strings.txt').read_text(errors='replace')[:60000])
          print('=== CONTEXT ===')
          print(Path('probe/context-strings.txt').read_text(errors='replace')[:100000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-latest-binary-strings
          path: probe
          retention-days: 3
