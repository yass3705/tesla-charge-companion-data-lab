name: Enel Italy national tariff candidate

on:
  push:
    branches:
      - research/enel-italy-probe
    paths:
      - scripts/enel_italy_national_tariffs.py
      - scripts/enel_italy_finalize_candidate.py
      - scripts/enel_italy_apply_live_tariff_override.py
      - .github/workflows/enel-italy-national-tariffs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests requests-aws4auth selenium
      - name: Rebuild current PUN Italy inventory
        run: python scripts/pun_italy_national.py --workers 8
      - name: Build national Enel tariff candidate
        run: python scripts/enel_italy_national_tariffs.py --workers 16
      - name: Retry gaps and add future tariff schedule
        run: python scripts/enel_italy_finalize_candidate.py --retry-workers 4
      - name: Apply verified live tariff card values
        run: python scripts/enel_italy_apply_live_tariff_override.py
      - name: Validate national candidate
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path('data/national/enel_direct_stations_italy_final_candidate.json.gz')
          assert p.exists() and p.stat().st_size > 100000
          r = json.loads(gzip.decompress(p.read_bytes()))
          c = r['counts']
          policy = r['operatorTariffPolicy']
          assert r['country'] == 'IT'
          assert r['schemaVersion'] == 2
          assert c['punEnxEvseCount'] > 20000
          assert c['punEnxStationSerialCount'] > 9000
          assert c['directRankableTariffEvseCount'] > 17000
          assert c['officialFutureScheduleRankableEvseCount'] > 20000
          assert c['officialFutureScheduleCoveragePct'] > 99
          assert c['observedSnapshotPriceMismatchCount'] == 0
          assert policy['priceSelectionBasis'] == 'session_start_local_time'
          assert policy['basicEurPerKwh']['AC'] == {'day': 0.67, 'night': 0.58}
          assert policy['basicEurPerKwh']['DC'] == {'day': 0.75, 'night': 0.64}
          assert policy['basicEurPerKwh']['HPC'] == {'day': 0.82, 'night': 0.82}
          assert policy['liveRenderedCardEvidence']['plugAndGoExplorerEurPerKwh']['HPC'] == {'day': 0.72, 'night': 0.72}
          assert policy['liveRenderedCardEvidence']['plugAndGoSuperEurPerKwh']['HPC'] == {'day': 0.77, 'night': 0.77}
          assert policy['plans']['plug_and_go_super']['discountFromBasicEurPerKwh'] == 0.05
          assert policy['plans']['plug_and_go_explorer']['discountFromBasicEurPerKwh'] == 0.10
          print(json.dumps(c, ensure_ascii=False, indent=2))
          print(json.dumps(r['gapDiagnostics'], ensure_ascii=False, indent=2)[:12000])
          print(json.dumps(policy['liveRenderedCardEvidence'], ensure_ascii=False, indent=2))
          PY
      - name: Upload Enel national candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enel-direct-italy-final-candidate
          path: |
            data/national/enel_direct_stations_italy.json.gz
            data/national/enel_direct_stations_italy_final_candidate.json.gz
            data/reports/enel_italy_national_tariffs_report.json
            data/reports/enel_italy_finalization_report.json
          retention-days: 14
