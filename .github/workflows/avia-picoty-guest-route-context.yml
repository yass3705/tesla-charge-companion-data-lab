name: AVIA Picoty Deftpower guest route context

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_guest_route_context.py"
      - ".github/workflows/avia-picoty-guest-route-context.yml"

permissions:
  contents: write

concurrency:
  group: avia-picoty-guest-route-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract redacted public guest route context
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_guest_route_context.py
          python scripts/avia_picoty_guest_route_context.py

      - name: Validate report safety and content
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_guest_route_context.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          raw=p.read_text(encoding='utf-8')
          assert d['schemaVersion']=='1.0.0'
          assert any(f.get('matches') for f in d['files']), d
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}',raw)
          print({f['path']:len(f.get('matches',[])) for f in d['files']})
          PY

      - name: Upload route-context report
        uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-guest-route-context
          path: data/reports/avia_picoty_guest_route_context.json
          retention-days: 14

      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_guest_route_context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract AVIA Picoty Deftpower guest route context"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
