name: UK ChargePoint Shell residual provider matrix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargepoint-shell-residual-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-api-global
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe alternate providers for all ChargePoint residuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 UK-ChargePoint-Residual-Matrix"
          PROVIDERS=["Shell_RP_2","Shell_RP_1","Shell_RP",None]
          last=0.0; token=None; refreshes=0

          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token,refreshes
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr:
                  token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1
          auth()

          def call(uid,provider):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")
                  if provider is not None:
                      url+="?"+urllib.parse.urlencode({"providerId":provider})
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+token,"Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:1000]}
                  except Exception as e:
                      return 0,{"error":repr(e)}
              return 0,{}

          base=json.loads(Path("reports/uk/chargepoint-shell-full-latest.json").read_text())
          targets=base["noTariffUids"]
          results=[]
          for i,uid in enumerate(targets,1):
              row={"uid":uid,"probes":[]}
              for provider in PROVIDERS:
                  st,body=call(uid,provider)
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data: data=data[0]
                  tariffs=[]; connectors=0
                  if isinstance(data,dict):
                      for ev in data.get("evses") or []:
                          for conn in ev.get("connectors") or []:
                              connectors+=1
                              for t in conn.get("tariffs") or []:
                                  tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
                  row["probes"].append({
                      "providerId":provider,"httpStatus":st,"connectorCount":connectors,
                      "tariffCount":len(tariffs),"tariffs":tariffs
                  })
              results.append(row)
              print(f"[{i}/{len(targets)}] {uid} resolved={any(p['tariffCount']>0 for p in row['probes'])}",flush=True)

          resolved=[]
          for r in results:
              provs=[p["providerId"] for p in r["probes"] if p["tariffCount"]>0]
              if provs: resolved.append({"uid":r["uid"],"providers":provs})
          out={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "targetCount":len(targets),"resolvedCount":len(resolved),
              "stillNoTariffCount":len(targets)-len(resolved),
              "tokenRefreshCount":refreshes,
              "resolved":resolved,
              "stillNoTariffUids":[r["uid"] for r in results if not any(p["tariffCount"]>0 for p in r["probes"])],
              "results":results
          }
          Path("reports/uk/chargepoint-shell-residual-matrix-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:out[k] for k in ["targetCount","resolvedCount","stillNoTariffCount","tokenRefreshCount","resolved"]},ensure_ascii=False,indent=2))
          PY

      - name: Publish residual matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/uk/chargepoint-shell-residual-matrix-latest.json /tmp/chargepoint-shell-residual-matrix-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/chargepoint-shell-residual-matrix-latest.json reports/uk/chargepoint-shell-residual-matrix-latest.json
            git add reports/uk/chargepoint-shell-residual-matrix-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): probe ChargePoint Shell residual providers [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with another writer; retrying (${attempt}/5)"
            sleep $((attempt * 2))
          done
          exit 1
