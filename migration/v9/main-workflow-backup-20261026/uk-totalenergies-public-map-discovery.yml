name: UK TotalEnergies public map discovery
# rerun 2026-09-28-1306
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/uk-totalenergies-public-map-discovery.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect TotalEnergies public charger map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read(8000000).decode("utf-8","replace"),r.geturl()
          html,final=get("https://chargingservices.totalenergies.com/en/find-a-charger")
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          hosts=set(); paths=set(); contexts=[]
          bodies=[("html",html)]
          for s in scripts[:80]:
              try:bodies.append((s,get(s)[0]))
              except Exception:pass
          for source,b in bodies:
              for h in re.findall(r'https?://([A-Za-z0-9.-]+)',b):
                  if any(k in h.lower() for k in ("total","charge","api","ev")): hosts.add(h)
              for p in re.findall(r'["\']((?:/api/|/v[0-9]+/|/stations?|/locations?|/chargers?|/chargepoints?|/tariffs?|/prices?)[^"\']{0,180})["\']',b,re.I):
                  paths.add(p)
              for m in re.finditer(r'(?i)(fetch\(|axios|graphql|station|location|charger|tariff)',b):
                  c=b[max(0,m.start()-250):min(len(b),m.end()+550)]
                  c=re.sub(r'(?:pk|sk)\.[A-Za-z0-9._-]{20,}','<redacted>',c,flags=re.I)
                  if re.search(r'/api/|fetch\(|axios|graphql|https?://',c,re.I):
                      contexts.append({"source":source,"context":c})
                      if len(contexts)>=120:break
              if len(contexts)>=120:break
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"TotalEnergies UK","scripts":scripts[:80],"hosts":sorted(hosts)[:100],"paths":sorted(paths)[:300],"contexts":contexts[:120]}
          Path("reports/uk/totalenergies-public-map-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"hosts":out["hosts"],"paths":out["paths"],"contexts":len(contexts)},indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/totalenergies-public-map-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect TotalEnergies public charger map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
