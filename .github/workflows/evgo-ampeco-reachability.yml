name: EVGO AMPECO reachability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/evgo_ampeco_reachability_probe.py"
      - ".github/workflows/evgo-ampeco-reachability.yml"

permissions:
  contents: write

concurrency:
  group: evgo-ampeco-reachability
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/evgo_ampeco_reachability_probe.py
      - name: Probe candidate tenants read-only
        run: python scripts/evgo_ampeco_reachability_probe.py
      - name: Validate and publish sanitized report
        run: |
          test -s artifacts/evgo-ampeco-reachability/summary.json
          python scripts/public_safety_check.py artifacts/evgo-ampeco-reachability
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/evgo-ampeco-reachability/summary.json').read_text())
          assert p['policy']['read_only'] is True
          assert p['policy']['no_login'] is True
          assert p['policy']['no_mutations'] is True
          assert set(p['hosts'])=={'evgo.eu-evgo.charge.ampeco.tech','echo.eu-evgo.charge.ampeco.tech'}
          PY
          mkdir -p reports/morocco/evgo
          cp artifacts/evgo-ampeco-reachability/summary.json reports/morocco/evgo/latest-ampeco-reachability.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-ampeco-reachability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(morocco): update EVGO AMPECO reachability [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
