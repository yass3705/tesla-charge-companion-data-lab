name: Fix IZIVIA builder guard once
on:
  push:
    paths:
      - ".github/workflows/fix-izivia-builder-once.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix metadata assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-izivia-express-tcc-v8.yml')
          s=p.read_text()
          old="assert len(src.get('directRawTariffCounts') or {})==18"
          new="assert meta.get('distinctDirectRawTariffs')==18"
          if old not in s: raise SystemExit('target assertion not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-izivia-express-tcc-v8.yml
          git commit -m 'Fix IZIVIA compact builder metadata guard'
          git push
