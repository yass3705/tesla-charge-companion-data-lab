name: A2A Italy public map discovery

on:
  push:
    branches:
      - research/enel-italy-probe
    paths:
      - scripts/a2a_italy_public_map_discovery.py
      - .github/workflows/a2a-italy-public-map-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check selenium
      - name: Discover A2A public map traffic
        run: python scripts/a2a_italy_public_map_discovery.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/reports/a2a_italy_public_map_discovery.json')
          assert p.exists() and p.stat().st_size > 1000
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['security']['accountCredentialsUsed'] is False
          assert r['security']['authorizationMaterialPersisted'] is False
          assert r['counts']['interestingRequests'] >= 1
          print(json.dumps(r['counts'], ensure_ascii=False, indent=2))
          for req in r['requests']:
              if req.get('resourceType') in {'XHR','Fetch'} or req.get('jsonShape'):
                  print(json.dumps(req, ensure_ascii=False, indent=2)[:6000])
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-italy-public-map-discovery
          path: data/reports/a2a_italy_public_map_discovery.json
          retention-days: 14
