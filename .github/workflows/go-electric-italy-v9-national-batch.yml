name: Go Electric Italy V9 bounded national batch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/go_electric_nextcharge_national_batch_probe.py'
      - '.github/workflows/go-electric-italy-v9-national-batch.yml'

permissions:
  contents: read

jobs:
  bounded-national-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bounded national probe
        run: python -m py_compile scripts/go_electric_nextcharge_national_batch_probe.py
      - name: Run bounded national Go Electric tariff batch
        env:
          GO_ELECTRIC_BATCH_LIMIT: '24'
        run: |
          mkdir -p artifacts
          python scripts/go_electric_nextcharge_national_batch_probe.py
      - name: Validate bounded national batch guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/go_electric_nextcharge_national_batch_probe.json').read_text())
          p=r['policy']; s=r['summary']; c=r['catalogue']; a=r['requestAudit']
          assert c['goElectricStationCount'] == 1136, c
          assert c['goElectricEvseCount'] == 2413, c
          assert p['readOnly'] is True
          assert p['authenticated'] is False
          assert p['remoteMutation'] is False
          assert p['browserUiUsed'] is False
          assert p['boundedNationalProbe'] is True
          assert p['nationalScrape'] is False
          assert p['batchLimit'] == 24
          assert p['exactPunEvseSuffixRequiredForAttribution'] is True
          assert p['coordinateOnlyAttributionAllowed'] is False
          assert p['chargingActionsAllowed'] is False
          assert p['paymentActionsAllowed'] is False
          assert p['reservationActionsAllowed'] is False
          assert p['accountActionsAllowed'] is False
          assert p['sessionMutationAllowed'] is False
          assert p['directCpoPublicationAllowed'] is False
          assert a['allRequestsDeclaredReadOnly'] is True
          assert set(a['endpoints']) <= set(p['allowedReadPostEndpoints'])
          assert s['targetStations'] >= 16, s
          assert s['queriedStations'] == s['targetStations'], s
          assert s['gridSuccessStations'] >= 1, s
          assert s['exactMatchedStations'] >= 1, s
          assert s['exactConnectorMatches'] >= 1, s
          print(json.dumps({
            'catalogue': c,
            'summary': s,
            'requestAudit': a,
            'publicationAllowed': p['directCpoPublicationAllowed'],
            'publicationReason': p['publicationReason'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-electric-italy-v9-national-batch
          path: artifacts/go_electric_nextcharge_national_batch_probe.json
          if-no-files-found: warn
