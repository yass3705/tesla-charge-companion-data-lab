name: Switzerland TCC V9 shard bundle
on:
  push:
    paths:
      - 'scripts/shard_swiss_tcc_v9_bundle.py'
      - '.github/workflows/switzerland-tcc-v9-shards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/build_swiss_tcc_v9_bundle.py
      - run: python3 scripts/shard_swiss_tcc_v9_bundle.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tcc_v9/switzerland.json data/tcc_v9/switzerland docs/switzerland-v9-integration-2026-09-28.json
          git commit -m 'data(switzerland): publish sharded TCC V9 bundle' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
