name: Morocco FastVolt bootstrap token mapping

on:
  push:
    paths:
      - '.github/workflows/morocco-fastvolt-bootstrap-token-map.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare FastVolt and Blutter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-requests cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone --depth 1 https://github.com/worawit/blutter.git /tmp/blutter
          mkdir -p /tmp/fv/xapk /tmp/fv/lib/arm64-v8a
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0'             'https://d.apkpure.net/b/XAPK/ma.fastgo?version=latest'             -o /tmp/fv/current.xapk
          echo "af476c969bf7982b1561cd0769a26f322b90257b347aa858f2c438d4e73fcf97  /tmp/fv/current.xapk" | sha256sum -c -
          unzip -q /tmp/fv/current.xapk -d /tmp/fv/xapk
          ARM_APK="$(find /tmp/fv/xapk -maxdepth 1 -name 'config.arm64_v8a.apk' -print -quit)"
          unzip -p "$ARM_APK" lib/arm64-v8a/libapp.so > /tmp/fv/lib/arm64-v8a/libapp.so
          unzip -p "$ARM_APK" lib/arm64-v8a/libflutter.so > /tmp/fv/lib/arm64-v8a/libflutter.so
          cd /tmp/blutter
          python3 blutter.py /tmp/fv/lib/arm64-v8a /tmp/fv/blutter-out

      - name: Map FFAppState field 0x2f
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/morocco/fastvolt
          python3 - <<'PY'
          import json,re,os
          from datetime import datetime, timezone

          root='/tmp/fv/blutter-out/asm'
          p=os.path.join(root,'evplug/app_state.dart')
          lines=open(p,errors='ignore').read().splitlines()

          def sanitize(s):
              # Preserve source structure and storage/config key names, redact only long opaque literals.
              return re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_+/=.:-]{80,}(?![A-Za-z0-9])','<redacted-opaque>',s)[:1400]

          def func_start(i):
              j=i
              while j>=0:
                  if re.match(r'^  (?:static )?[_A-Za-z].*\{\s*$',lines[j]):
                      return max(0,j-5)
                  j-=1
              return max(0,i-100)

          def block(i,before=25,after=45):
              s=func_start(i)
              s=max(s,i-before)
              return [sanitize(x) for x in lines[s:min(len(lines),i+after)]]

          field_hits=[]
          patterns=('field_2f','field_2b','field_33')
          for i,l in enumerate(lines):
              if 'field_2f' in l:
                  field_hits.append({'line':i+1,'context':block(i)})

          # Capture constructor and persisted-state loader in full bounded chunks.
          named={}
          for needle in ['class FFAppState extends ChangeNotifier',
                         'initializePersistedState',
                         'FFAppState(',
                         'ff_token',
                         'ff_',
                         'FlutterSecureStorage::read',
                         'set _ token=',
                         'deleteToken']:
              hits=[]
              for i,l in enumerate(lines):
                  if needle in l:
                      hits.append({'line':i+1,'context':block(i,35,80)})
                      if len(hits)>=30: break
              named[needle]=hits

          # Extract string keys near every load/store of the target field.
          associations=[]
          for h in field_hits:
              ctx='\n'.join(h['context'])
              keys=sorted(set(re.findall(r'"(ff_[A-Za-z0-9_]+)"',ctx)))
              strings=sorted(set(re.findall(r'r\d+ = "([^"]{1,100})"',ctx)))
              funcs=[]
              for x in h['context']:
                  m=re.search(r'\[package:evplug/[^\]]+\] ([^;]+)',x)
                  if m: funcs.append(m.group(1))
              associations.append({
                'line':h['line'],
                'storage_keys':keys,
                'short_literals':strings[:30],
                'function_refs':sorted(set(funcs))[:30]
              })

          # Search all evplug asm for calls that load FFAppState and immediately field_2f.
          external=[]
          for dp,_,fs in os.walk(os.path.join(root,'evplug')):
              for f in fs:
                  if not f.endswith('.dart'): continue
                  fp=os.path.join(dp,f)
                  try: ls=open(fp,errors='ignore').read().splitlines()
                  except Exception: continue
                  for i,l in enumerate(ls):
                      if 'field_2f' in l and ('LoadField:' in l or 'StoreField:' in l):
                          ctx=ls[max(0,i-15):min(len(ls),i+25)]
                          if any('FFAppState' in x for x in ctx) or fp==p:
                              external.append({
                                'file':os.path.relpath(fp,root),
                                'line':i+1,
                                'context':[sanitize(x) for x in ctx]
                              })
                              if len(external)>=100: break
                  if len(external)>=100: break
              if len(external)>=100: break

          out={
            'schema_version':1,
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'FastVolt',
            'source':{'package':'ma.fastgo','version':'2.8.9','tool':'Blutter','dart':'3.9.2'},
            'policy':{'static_analysis_only':True,'no_runtime_tokens':True,'opaque_literals_redacted':True},
            'target':'FFAppState field_2f used as Authorization token input for AuthAPIcallsGroup.loginCheck',
            'field_hits':field_hits,
            'associations':associations,
            'named_context':named,
            'external_uses':external
          }
          with open('reports/morocco/fastvolt/bootstrap-token-field-map-2026-09-26.json','w') as f:
              json.dump(out,f,indent=2,ensure_ascii=False);f.write('\n')
          PY
          rm -rf /tmp/fv /tmp/blutter

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/fastvolt/bootstrap-token-field-map-2026-09-26.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(morocco): map FastVolt bootstrap auth token [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push
