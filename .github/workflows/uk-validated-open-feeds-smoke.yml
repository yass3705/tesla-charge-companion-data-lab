name: UK validated open feeds smoke - Data Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_uk_validated_open_feeds.py'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect validated UK feeds
        run: python scripts/collect_uk_validated_open_feeds.py --output artifacts/uk-validated-open-feeds.json