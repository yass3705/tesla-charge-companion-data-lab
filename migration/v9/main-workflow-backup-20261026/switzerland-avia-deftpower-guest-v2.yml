name: Switzerland AVIA Deftpower exact guest routes
on:
  push:
    paths:
      - 'scripts/probe_swiss_avia_deftpower_guest_v2.py'
      - '.github/workflows/switzerland-avia-deftpower-guest-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AVIA_DEFTPOWER_SUBSCRIPTION_KEY: ${{ secrets.AVIA_DEFTPOWER_SUBSCRIPTION_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/probe_swiss_avia_deftpower_guest_v2.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-avia-deftpower-guest-probe-v2-2026-09-28.json
          git commit -m 'docs(switzerland): probe exact AVIA Deftpower guest routes' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
