name: UK Zest production API probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-zest-production-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe read-only Zest production routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          bases=[
            "https://mobile-api.msp.zest.uk.com",
            "https://csus.msp.zest.uk.com"
          ]
          paths=[
            "/",
            "/v1/locations",
            "/v1/locations?page=1",
            "/v1/locations?page=1&page_size=10",
            "/v1/locations/evse-statuses"
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"results":[]}
          for base in bases:
            for path in paths:
              url=base+path
              item={"url":url}
              try:
                req=urllib.request.Request(url,headers={
                  "User-Agent":"Zest Charging/4.3.15 TeslaChargeCompanion/9",
                  "Accept":"application/json",
                  "X-Requested-With":"com.uk.zest.app"
                })
                with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read(2_000_000)
                  item.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw)})
                  try:
                    p=json.loads(raw.decode("utf-8"))
                    item["json"]=True; item["jsonType"]=type(p).__name__
                    if isinstance(p,dict):
                      item["keys"]=list(p)[:80]
                      for k in ("data","locations","items","results"):
                        if isinstance(p.get(k),list):
                          item["arrayKey"]=k; item["count"]=len(p[k])
                          if p[k] and isinstance(p[k][0],dict): item["firstKeys"]=list(p[k][0])[:100]
                          break
                    elif isinstance(p,list):
                      item["count"]=len(p)
                      if p and isinstance(p[0],dict): item["firstKeys"]=list(p[0])[:100]
                  except Exception:
                    item["json"]=False; item["prefix"]=raw.decode("utf-8","replace")[:1200]
              except urllib.error.HTTPError as e:
                raw=e.read(100000)
                item.update({"status":e.code,"error":str(e),"bodyPrefix":raw.decode("utf-8","replace")[:1200]})
              except Exception as e:
                item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
              out["results"].append(item)
          Path("reports/uk/zest-production-api-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/zest-production-api-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Zest production read-only API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
