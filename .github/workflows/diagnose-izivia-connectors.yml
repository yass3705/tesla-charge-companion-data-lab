name: Audit IZIVIA connector classifications
on:
  push:
    paths:
      - ".github/workflows/diagnose-izivia-connectors.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List connector standards and powers
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p=json.load(open('izivia/izivia_express_station_tariffs_v1.json'))
          c=Counter()
          low=[]
          for st in p['stations']:
            for x in st.get('mapConnectorStats') or []:
              std=str(x.get('standard','')).lower();kw=float(x.get('maxPowerInW') or 0)/1000
              c[(std,kw)]+=1
              if kw<=25: low.append((std,kw,st['officialStationId'],st['name']))
          print('STANDARD_POWER_COUNTS')
          for k,n in sorted(c.items(),key=lambda x:(x[0][0],x[0][1])): print(k,n)
          print('LOW_POWER_EXAMPLES')
          for x in low[:100]: print(x)
          PY
