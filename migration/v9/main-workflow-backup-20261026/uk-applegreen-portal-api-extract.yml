name: UK Applegreen portal API extract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-applegreen-portal-api-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract Applegreen Driivz portal read APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          root="https://driver.applegreenelectric.com/findCharger"
          req=urllib.request.Request(root,headers={"User-Agent":UA,"Accept":"text/html,*/*"})
          with urllib.request.urlopen(req,timeout=60) as r:
              html=r.read(3_000_000).decode("utf-8","replace"); final=r.geturl()

          assets=sorted(set(urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)))
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"root":final,"assets":[]}
          needles=[
            "findSitesInBounds","findStationsInBounds","findStationById","findSiteListDataBySiteIds",
            "getBillingDisplayTariffMessage","StationsApi","BillingApi","billingFacade","stationFacade",
            "findStationModelConnectors","findStationsByIds"
          ]
          for u in assets:
              item={"url":u,"contexts":[]}
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"application/javascript,*/*"})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read(7_000_000).decode("utf-8","replace")
                  item["bytes"]=len(body)
                  for needle in needles:
                      for m in re.finditer(re.escape(needle),body,re.I):
                          item["contexts"].append({"needle":needle,"context":body[max(0,m.start()-900):min(len(body),m.end()+1800)]})
                          if len(item["contexts"])>=180: break
              except Exception as e:
                  item["error"]=f"{type(e).__name__}: {e}"
              if item["contexts"]: out["assets"].append(item)
          Path("reports/uk/applegreen-portal-api-extract-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/applegreen-portal-api-extract-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): extract Applegreen portal read APIs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
