name: Audit Powerdot official inventory schema
on:
  push:
    branches:
      - audit/electroverse-pd1-powerdot-power-groups
    paths:
      - "scripts/audit_powerdot_official_inventory_shape.mjs"
      - ".github/workflows/powerdot-official-inventory-shape.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect official Powerdot CSV
        run: node scripts/audit_powerdot_official_inventory_shape.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/powerdot-official-inventory-shape.json
          git commit -m "audit: publish Powerdot official inventory schema" || exit 0
          git push
