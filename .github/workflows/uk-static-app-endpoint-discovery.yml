name: UK static app endpoint discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-static-app-endpoint-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect public HTML and JS assets
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          targets=[
            {"name":"ScottishPower Recharge","url":"https://www.scottishpower.co.uk/public-ev-charging"},
            {"name":"ParkRecharge webapp","url":"https://parkrecharge.app/"},
          ]
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          domain_re=re.compile(r'https?://[^"\'\\s<>]+',re.I)
          uuid_re=re.compile(r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b')
          keyword_re=re.compile(r'(?i)(?:api\.fuuse\.io|opendata|open-data|ocpi|/locations?|/tariffs?|graphql|api[_/-])')

          def get(url,max_bytes=6000000):
            req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=45) as r:
              b=r.read(max_bytes)
              return b.decode("utf-8","replace"),r.status,r.headers.get("Content-Type")

          out={"country":"GB","retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":[]}
          for t in targets:
            rec={"name":t["name"],"url":t["url"],"assets":[],"candidates":[],"uuids":[]}
            try:
              html,status,ctype=get(t["url"])
              rec["status"]=status; rec["contentType"]=ctype
              srcs=re.findall(r'''(?:src|href)=["']([^"'<>]+)["']''',html,re.I)
              assets=[]
              for src in srcs:
                full=urllib.parse.urljoin(t["url"],src)
                if re.search(r'(?i)\.(?:js|mjs)(?:\?|$)',full) or "/_next/static/" in full:
                  if full not in assets: assets.append(full)
              texts=[("html",t["url"],html)]
              for full in assets[:40]:
                a={"url":full}
                try:
                  txt,st,ct=get(full)
                  a.update({"status":st,"contentType":ct,"bytes":len(txt.encode("utf-8","ignore"))})
                  texts.append(("asset",full,txt))
                except Exception as e:
                  a["error"]=f"{type(e).__name__}: {e}"
                rec["assets"].append(a)

              candidates=[]; uuids=set()
              for kind,source,txt in texts:
                for u in uuid_re.findall(txt): uuids.add(u)
                for m in domain_re.findall(txt):
                  clean=m.rstrip("),;]}")
                  if keyword_re.search(clean) or any(k in clean.lower() for k in ("fuuse","parkrecharge","scottishpower","hubeleon")):
                    candidates.append({"source":source,"value":clean[:1000]})
                # capture useful string neighborhoods even for relative endpoints
                low=txt.lower()
                for kw in ("api.fuuse.io","opendata","open-data","ocpi","tariff","location","apiurl","api_url","baseurl","base_url","graphql"):
                  pos=0; hits=0
                  while hits<12:
                    i=low.find(kw,pos)
                    if i<0: break
                    frag=txt[max(0,i-180):min(len(txt),i+500)]
                    candidates.append({"source":source,"keyword":kw,"context":frag})
                    pos=i+len(kw); hits+=1
              # exact dedupe by JSON string
              seen=set(); dedup=[]
              for x in candidates:
                k=json.dumps(x,sort_keys=True)
                if k not in seen:
                  seen.add(k); dedup.append(x)
              rec["candidates"]=dedup[:400]
              rec["uuids"]=sorted(uuids)
            except Exception as e:
              rec["error"]=f"{type(e).__name__}: {e}"
            out["targets"].append(rec)

          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/static-app-endpoint-discovery-latest.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
            "retrievedAt":out["retrievedAt"],
            "targets":[{
              "name":x["name"],"status":x.get("status"),"assets":len(x.get("assets",[])),
              "uuids":x.get("uuids"),"candidateCount":len(x.get("candidates",[])),
              "error":x.get("error")
            } for x in out["targets"]]
          },indent=2))
          PY
      - name: Publish discovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/static-app-endpoint-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect public app endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
