name: Exact price public discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/public_exact_price_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/exact-price-public-discovery.yml"

permissions:
  contents: write

concurrency:
  group: exact-price-public-discovery
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [freshmile, qovoltis]
    steps:
      - uses: actions/checkout@v4

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Compile probe
        run: python -m py_compile scripts/public_exact_price_probe.py

      - name: Discover public exact-price endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/exact-price/${{ matrix.target }}"
          python scripts/public_exact_price_probe.py \
            --target "${{ matrix.target }}" \
            --out "out/exact-price/${{ matrix.target }}"
          cat "out/exact-price/${{ matrix.target }}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate sanitized output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/public_safety_check.py out/exact-price
          python - <<'PY'
          import json
          from pathlib import Path
          target='${{ matrix.target }}'
          p=Path(f'out/exact-price/{target}/{target}_public_exact_price_probe.json')
          d=json.loads(p.read_text())
          assert d['method']['authenticated'] is False
          assert d['method']['mobilePackageUsed'] is False
          assert d['method']['persistRawHtmlOrJs'] is False
          assert d['method']['httpMethods'] == ['GET']
          assert all('?' not in x['url'] and '#' not in x['url'] for x in d['candidateEndpoints'])
          print(json.dumps(d['conclusion'], ensure_ascii=False))
          PY

      - name: Upload discovery result
        uses: actions/upload-artifact@v4
        with:
          name: exact-price-${{ matrix.target }}
          path: out/exact-price/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish sanitized discovery summaries
    needs: probe
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: exact-price-*
          path: out/exact-price
          merge-multiple: false

      - name: Build public sanitized reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/exact-price
          python - <<'PY'
          import json
          from pathlib import Path
          for target in ('freshmile','qovoltis'):
              matches=list(Path('out/exact-price').glob(f'exact-price-{target}/{target}_public_exact_price_probe.json'))
              if len(matches)!=1:
                  raise SystemExit(f'{target}: artifact result not found')
              d=json.loads(matches[0].read_text())
              public={
                  'schemaVersion':'1.0.0',
                  'dataset':d['dataset'],
                  'generatedAt':d['generatedAt'],
                  'target':d['target'],
                  'pages':d['pages'],
                  'sameVendorScriptsInspected':d['sameVendorScriptsInspected'],
                  'candidateEndpoints':d['candidateEndpoints'],
                  'candidateEndpointCount':d['candidateEndpointCount'],
                  'pricingCandidateCount':d['pricingCandidateCount'],
                  'stationCandidateCount':d['stationCandidateCount'],
                  'freshmileLegacyWebMapRetired':d['freshmileLegacyWebMapRetired'],
                  'conclusion':d['conclusion'],
                  'errors':d['errors'],
                  'safety':d['method'],
              }
              Path(f'reports/exact-price/{target}_latest.json').write_text(json.dumps(public,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py reports/exact-price

      - name: Commit reports when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact-price/freshmile_latest.json reports/exact-price/qovoltis_latest.json
          if git diff --cached --quiet; then
            echo "No discovery report change"
            exit 0
          fi
          git commit -m "data(pricing): publish Freshmile Qovoltis public discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
