name: AVIA Picoty CarburantIQ public API probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_carburantiq_api_probe.py"
      - ".github/workflows/avia-picoty-carburantiq-api-probe.yml"

permissions:
  contents: write

concurrency:
  group: avia-picoty-carburantiq-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public charging endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_carburantiq_api_probe.py
          python scripts/avia_picoty_carburantiq_api_probe.py data/reports/avia_picoty_carburantiq_api_probe.json
      - name: Validate report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/reports/avia_picoty_carburantiq_api_probe.json').read_text())
          assert d['policy']=='public_unauthenticated_endpoints_only'
          assert len(d['samples'])>=9
          print('operator prices status',d['operatorPrices']['response'].get('status'))
          for x in d['samples']:
              print(x['sample']['name'],x['nearestResponseMeta'].get('status'),len(x['picotyFindings']),len(x['stationDetails']))
          PY
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-carburantiq-api-probe
          path: data/reports/avia_picoty_carburantiq_api_probe.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_carburantiq_api_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh AVIA Picoty CarburantIQ public API probe"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
