name: Bretagne manual verifications

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/station_verifications/ouestcharge_sde22_pledaran_app_2026_08_22.json"
      - "data/station_verifications/brest_easycharge_place_des_delisseurs_app_visibility_2026_08_22.json"
      - "scripts/bretagne_manual_verification_overlay.py"
      - ".github/workflows/bretagne-sde22-manual-verification.yml"

permissions:
  contents: write

concurrency:
  group: bretagne-manual-verifications
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public safety
        run: python scripts/public_safety_check.py .

      - name: Rebuild Bretagne evidence and apply manual overlay
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/bretagne
          python -m py_compile scripts/bretagne_regional_coverage.py scripts/bretagne_manual_verification_overlay.py
          python scripts/bretagne_regional_coverage.py --out out/bretagne 2> >(tee out/bretagne/error.log >&2)
          python scripts/bretagne_manual_verification_overlay.py --out out/bretagne

      - name: Validate manual station evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/bretagne')
          o=json.loads((root/'ouestcharge_bretagne_official.json').read_text())
          c=o['departments']["Côtes-d'Armor"]
          assert c['pricingRuleStatus']=='station_app_verified_precedence'
          assert c['verifiedStationTariffClassable'] is True
          assert c['stationDisplayedTariffHasPriority'] is True
          con={(x['connector'],x['powerKw']):x for x in c['manualAppVerification']['connectors']}
          assert con[('TYPE2',22)]['energyEurPerKwh']==0.40
          assert con[('CCS',47)]['energyEurPerKwh']==0.40
          assert c['manualAppVerification']['connectionTimeRuleDisplayed']['eurPerMinute']==0.20
          assert c['manualAppVerification']['connectionTimeRuleDisplayed']['startsAfterConnectedMinutes']==300
          assert c['manualAppVerification']['connectionTimeRuleDisplayed']['activeLocalWindow']=='07:00-21:00'

          b=json.loads((root/'brest_easycharge_transition_bretagne.json').read_text())
          check=b['manualAppVisibilityCheck']
          assert check['station']=='Place des Délisseurs'
          assert check['operatorAppVisible'] is False
          assert check['liveStatus']=='not_confirmed_in_operator_app'
          assert b['tccDecision']['directEnergyTariffClassable'] is False
          assert b['tccDecision']['placeDesDelisseursLiveVerified'] is False

          p=json.loads((root/'bretagne_regional_coverage.json').read_text())
          assert 'SDE22 / Ouest Charge via app-displayed station tariff' in p['coverage']['stationLevelResolvedFamilies']
          assert p['tccDecision']['stationDisplayedTariffHasPriorityForSDE22'] is True
          assert p['tccDecision']['brestEasyChargePlaceDesDelisseursLiveVerified'] is False
          PY

      - name: Publish resolved Bretagne evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct data/regional_coverage reports/bretagne
          cp out/bretagne/ouestcharge_bretagne_official.json data/operator_direct/
          cp out/bretagne/morbihan_energies_official_bretagne.json data/operator_direct/
          cp out/bretagne/rennes_cpark_official_bretagne.json data/operator_direct/
          cp out/bretagne/brest_easycharge_transition_bretagne.json data/operator_direct/
          cp out/bretagne/bretagne_regional_coverage.json data/regional_coverage/
          cp out/bretagne/SUMMARY.md reports/bretagne/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/ouestcharge_bretagne_official.json data/operator_direct/morbihan_energies_official_bretagne.json data/operator_direct/rennes_cpark_official_bretagne.json data/operator_direct/brest_easycharge_transition_bretagne.json data/regional_coverage/bretagne_regional_coverage.json reports/bretagne/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(bretagne): apply manual verifications [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/bretagne
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/bretagne/latest_manual_verification_status.json').write_text(json.dumps({'dataset':'bretagne-manual-verification-run-status','region':'Bretagne','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bretagne/latest_manual_verification_status.json
          if ! git diff --cached --quiet; then
            git commit -m "status(bretagne-manual): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
