name: Switzerland AVIA guest pricing

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_avia_switzerland_guest.py"
      - ".github/workflows/switzerland-avia-guest-pricing.yml"
  schedule:
    - cron: "20 23 * * *"

permissions:
  contents: write

concurrency:
  group: switzerland-avia-guest-pricing
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      AVIA_APIM_SUBSCRIPTION_KEY: ${{ secrets.AVIA_APIM_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate collector syntax
        run: python3 -m py_compile scripts/collect_avia_switzerland_guest.py

      - name: Check AVIA runtime secret
        id: secret
        shell: bash
        run: |
          if [ -z "$AVIA_APIM_SUBSCRIPTION_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AVIA_APIM_SUBSCRIPTION_KEY is not configured; skipping collection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify AVIA secret fingerprint
        if: steps.secret.outputs.configured == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, sys
          k=os.environ.get("AVIA_APIM_SUBSCRIPTION_KEY","")
          ok=hashlib.sha256(k.encode()).hexdigest().startswith("5ffa9f705f9f")
          print("avia_secret_fingerprint_match=" + ("true" if ok else "false"))
          sys.exit(0 if ok else 3)
          PY

      - name: Collect AVIA Switzerland guest prices
        if: steps.secret.outputs.configured == 'true'
        run: python3 scripts/collect_avia_switzerland_guest.py

      - name: Reconcile AVIA snapshot with Swiss national source
        if: steps.secret.outputs.configured == 'true'
        run: python3 scripts/reconcile_avia_switzerland_guest.py

      - name: Sanity check sanitized output
        if: steps.secret.outputs.configured == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p="data/switzerland/avia-guest-direct-tariffs.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["country"]=="CH"
          assert d["operatorId"]=="CH*AVI"
          assert d["counts"]["pricedConnectors"]>=583, d["counts"]
          assert d["counts"]["uniquePricedEvses"]>=583, d["counts"]
          r=json.load(open("docs/switzerland-avia-guest-reconciliation-2026-09-29.json",encoding="utf-8"))
          assert r["counts"]["nationalEvseCount"]==583, r["counts"]
          assert r["counts"]["missingNationalEvseCount"]<=1, r["counts"]
          # Accepted final state may retain exactly one stale national EVSE id
          # that is closed by the deterministic successor alias overlay.
          if r["counts"]["missingNationalEvseCount"]==1:
              alias=json.load(open("data/switzerland/avia-successor-alias-overlay.json",encoding="utf-8"))
              assert alias, "missing accepted successor alias overlay"
          raw=open(p,encoding="utf-8").read().lower()
          for forbidden in ("subscription-key","authorization","bearer ","ocp-apim"):
              assert forbidden not in raw, forbidden
          print(d["counts"])
          PY

      - name: Commit refreshed sanitized AVIA prices
        if: steps.secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the validated collector outputs outside the worktree.
          # This lets us resync to a moving main branch without rebasing
          # generated AVIA files and creating conflicts.
          cp data/switzerland/avia-guest-direct-tariffs.json /tmp/avia-guest-direct-tariffs.json
          cp docs/switzerland-avia-guest-reconciliation-2026-09-29.json /tmp/switzerland-avia-guest-reconciliation.json

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/avia-guest-direct-tariffs.json data/switzerland/avia-guest-direct-tariffs.json
            cp /tmp/switzerland-avia-guest-reconciliation.json docs/switzerland-avia-guest-reconciliation-2026-09-29.json

            git add data/switzerland/avia-guest-direct-tariffs.json docs/switzerland-avia-guest-reconciliation-2026-09-29.json
            if git diff --cached --quiet; then
              echo "No AVIA data changes after resync."
              exit 0
            fi

            git commit -m "data(ch): refresh AVIA guest exact prices"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; retrying clean publish attempt $attempt/6."
            sleep $((attempt*2))
          done

          echo "Unable to publish validated AVIA outputs after 6 clean retries."
          exit 1
