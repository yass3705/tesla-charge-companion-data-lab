name: V9 tariff restoration renewal
on:
  push:
    branches: [rebuild/v9-20261020]
    paths: [migration/v9/tariff-restoration-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-tariff-restoration
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ['FR:electra_platform', 'CH:swiss_bundle']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preserve Belib PDF extraction dependency
        if: matrix.source == 'FR:belib'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Exercise failure, retry, artifact and last-good contracts offline
        run: |
          python -m unittest discover -s tests -p test_v9_orchestrator.py
          python -m unittest discover -s tests -p test_v9_artifact_selection.py
      - name: Renew the existing method outside checkout
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: python -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/tcc-v9-tariff-renewal" --workers 1 --attempts 1
      - name: Preserve validated immutable output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-tariff-renewal-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/tcc-v9-tariff-renewal/manifest.json
            ${{ runner.temp }}/tcc-v9-tariff-renewal/objects
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failures separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-tariff-renewal-failure-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/tcc-v9-tariff-renewal/manifest.json
            ${{ runner.temp }}/tcc-v9-tariff-renewal/failures
            ${{ runner.temp }}/tcc-v9-tariff-renewal/checkpoints
          if-no-files-found: ignore
          retention-days: 7

  integrate_swiss:
    name: collect (CH:swiss_integration)
    needs: collect
    if: always() && github.ref == 'refs/heads/rebuild/v9-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Retrieve only the Swiss artifact from this exact workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tcc-v9-tariff-renewal-1
          path: ${{ runner.temp }}/tcc-v9-swiss-integration/input_dependencies/CH_swiss_bundle
      - name: Validate dependency SHA and run historical Swiss integration
        run: python -m v9_rebuild.orchestrator --source CH:swiss_integration --out "$RUNNER_TEMP/tcc-v9-swiss-integration" --workers 1 --attempts 1
      - name: Preserve only validated integration output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-swiss-integration
          path: |
            ${{ runner.temp }}/tcc-v9-swiss-integration/manifest.json
            ${{ runner.temp }}/tcc-v9-swiss-integration/objects
          if-no-files-found: error
          retention-days: 30
