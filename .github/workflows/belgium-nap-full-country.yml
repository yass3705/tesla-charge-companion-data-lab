name: Belgium NAP full country

on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-nap-full-country.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BELGIUM_NAP_TOKEN: ${{ secrets.BELGIUM_NAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract every Belgium NAP page
        run: python scripts/belgium_nap_full_country.py

      - name: Upload raw paginated snapshots
        uses: actions/upload-artifact@v4
        with:
          name: belgium-nap-raw-pages
          path: artifacts/belgium-nap-raw-pages/*.json.gz
          retention-days: 7
          compression-level: 0

      - name: Persist canonical country pages and ledgers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/data/belgium/pages" "$tmpdir/data/belgium" "$tmpdir/reports" "$tmpdir/docs"
          cp -p data/belgium/pages/*.json.gz "$tmpdir/data/belgium/pages/"
          cp -p data/belgium/nap-belgium-manifest.json "$tmpdir/data/belgium/"
          cp -p reports/belgium-national-full-extraction-2026-09-28.json "$tmpdir/reports/"
          cp -p reports/belgium-missing-price-evses-2026-09-28.json "$tmpdir/reports/"
          cp -p docs/belgium-cpo-progress-2026-09.json "$tmpdir/docs/"

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main

            rm -f data/belgium/nap-belgium-full.json
            mkdir -p data/belgium/pages
            rm -f data/belgium/pages/*.json.gz
            cp -p "$tmpdir"/data/belgium/pages/*.json.gz data/belgium/pages/
            cp -p "$tmpdir/data/belgium/nap-belgium-manifest.json" data/belgium/
            cp -p "$tmpdir/reports/belgium-national-full-extraction-2026-09-28.json" reports/
            cp -p "$tmpdir/reports/belgium-missing-price-evses-2026-09-28.json" reports/
            cp -p "$tmpdir/docs/belgium-cpo-progress-2026-09.json" docs/

            git add -A data/belgium reports/belgium-national-full-extraction-2026-09-28.json reports/belgium-missing-price-evses-2026-09-28.json docs/belgium-cpo-progress-2026-09.json
            if git diff --cached --quiet; then
              echo "No Belgium country changes"
              exit 0
            fi
            git commit -m "Extract complete paginated Belgium NAP dataset [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/8)"
            sleep $((attempt * 2))
          done
          echo "::error::Could not persist full Belgium extraction"
          exit 1
