name: Netherlands exact unpriced CPO residual EVSE inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_cpo_direct_residual_inventory_20261011.py
      - .github/workflows/nl-cpo-direct-residual-inventory.yml
permissions:
  contents: write
concurrency:
  group: nl-cpo-residual-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory exact DOT-NL connectors and reasons for missing direct CPO tariff
        run: |
          python3 -m py_compile scripts/nl_cpo_direct_residual_inventory_20261011.py
          python3 scripts/nl_cpo_direct_residual_inventory_20261011.py
      - name: Persist evidence without overwriting concurrent Data Lab changes
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.json /tmp/nl-residual.json
          cp reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.csv /tmp/nl-residual.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-residual.json reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.json
            cp /tmp/nl-residual.csv reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.csv
            git add reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.json reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.csv
            if git diff --cached --quiet; then echo NL_CPO_RESIDUAL_UNCHANGED; exit 0; fi
            git commit -m "reports(nl): source-exact direct CPO missing EVSE audit [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then echo NL_CPO_RESIDUAL_PUBLISHED; exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-cpo-residual-${{ github.run_id }}
          path: |
            reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.json
            reports/netherlands/nl-cpo-unpriced-evse-inventory-2026-10-11.csv
          retention-days: 90
