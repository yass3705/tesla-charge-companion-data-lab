name: Switzerland first-pass national reconciliation\non:\n  push:\n    paths:\n      - 'scripts/reconcile_swiss_first_pass_national.py'\n      - '.github/workflows/switzerland-first-pass-national-reconcile.yml'\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  reconcile:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - run: python3 scripts/reconcile_swiss_first_pass_national.py\n      - name: Persist reconciliation\n        run: |\n          set -euo pipefail\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add docs/switzerland-first-pass-national-reconciliation-2026-09-28.json\n          git commit -m 'docs(switzerland): reconcile first-pass files to national EVSE scope' || exit 0\n          for attempt in 1 2 3 4 5 6; do\n            git pull --rebase origin main\n            if git push origin HEAD:main; then exit 0; fi\n            sleep $((attempt*2))\n          done\n          exit 1\n