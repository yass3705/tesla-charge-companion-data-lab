name: Switzerland Swisscharge live response shape probe

on:
  push:
    paths:
      - '.github/workflows/switzerland-swisscharge-live-response-shape-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect successful ad-hoc response shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,urllib.parse,urllib.error,http.cookiejar
          from pathlib import Path
          from datetime import datetime,timezone
          BASE="https://adhoc.swisscharge.ch"; TENANT="Swisscharge_CH"
          REFS=["6931","7632","1322","207534","2999","6117","207539","9138"]
          UA="Mozilla/5.0 TCC-V9-Swisscharge-Shape"
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def req(url,headers=None):
              try:
                  with op.open(urllib.request.Request(url,headers=headers or {},method="GET"),timeout=30) as r:
                      raw=r.read()
                      try:return r.status,json.loads(raw.decode())
                      except:return r.status,{"raw":raw.decode("utf-8","replace")[:3000]}
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try:b=json.loads(raw.decode())
                  except:b={"raw":raw.decode("utf-8","replace")[:3000]}
                  return e.code,b
          rows=[]
          for ref in REFS:
              page=f"{BASE}/tenant/{TENANT}/session-start/{urllib.parse.quote(ref,safe='')}"
              api=f"{BASE}/api/v1/charge-points?evsePhysicalReference={urllib.parse.quote(ref,safe='')}"
              req(page,{"User-Agent":UA})
              time.sleep(.5)
              h={"Accept":"application/json","Tenant":TENANT,"tenant-path":page,"Referer":page,"User-Agent":UA}
              st,p=req(api,h)
              rows.append({"reference":ref,"status":st,"response":p})
              print(ref,st, list(p.keys()) if isinstance(p,dict) else type(p), flush=True)
          out={"schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),"tenant":TENANT,"rows":rows}
          Path("docs/switzerland-swisscharge-live-response-shape-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-swisscharge-live-response-shape-2026-09-29.json
          git commit -m "research(ch): inspect Swisscharge live response shape" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
