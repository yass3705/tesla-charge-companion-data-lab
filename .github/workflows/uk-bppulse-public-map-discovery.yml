name: UK bp pulse public map discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-bppulse-public-map-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect bp pulse live map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          seed="https://network.bppulse.co.uk/live-map/"
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"seed":seed,"assets":[],"candidates":[]}
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(6_000_000).decode("utf-8","replace"),r.geturl(),r.status,dict(r.headers.items())
          try:
              html,final,st,h=get(seed)
              out.update({"status":st,"finalUrl":final,"bytes":len(html),"contentType":h.get("Content-Type")})
              blobs=[("html",html)]
              for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
                  u=urllib.parse.urljoin(final,s)
                  try:
                      body,af,ast,ah=get(u)
                      out["assets"].append({"url":u,"status":ast,"bytes":len(body),"contentType":ah.get("Content-Type")})
                      blobs.append((u,body))
                  except Exception as e:
                      out["assets"].append({"url":u,"error":f"{type(e).__name__}: {e}"})
              pats=("api","graphql","location","station","charger","chargepoint","tariff","price","availability","status","socket")
              cand=[]
              for source,txt in blobs:
                  for m in re.finditer(r'https?://[^"\'\s<>()\\]+',txt):
                      v=m.group(0)
                      if any(k in v.lower() for k in pats): cand.append({"source":source,"value":v[:600]})
                  for m in re.finditer(r'["\']([^"\']{2,260})["\']',txt):
                      v=m.group(1); low=v.lower()
                      if any(x in low for x in ("/api/","graphql","locations","stations","chargers","chargepoints","tariffs","pricing")):
                          cand.append({"source":source,"value":v[:600]})
              seen=set(); ded=[]
              for x in cand:
                  k=(x["source"],x["value"])
                  if k not in seen:
                      seen.add(k); ded.append(x)
              out["candidates"]=ded[:1500]
          except Exception as e:
              out["error"]=f"{type(e).__name__}: {e}"
          Path("reports/uk/bppulse-public-map-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/bppulse-public-map-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover bp pulse public map backend [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
