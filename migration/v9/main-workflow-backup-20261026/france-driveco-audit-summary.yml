name: France DRIVECO exact audit summary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/france-driveco-audit-summary.yml']
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write compact summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,datetime
          p=pathlib.Path('reports/france/driveco/exact-audit.json')
          d=json.loads(p.read_text())
          inv=d.get('inventory',{})
          out={
            'schemaVersion':'1.0.0',
            'operator':'DRIVECO',
            'evaluatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'candidateRecordCount':d.get('candidateRecordCount'),
            'candidateExactIdCount':d.get('candidateExactIdCount'),
            'candidateExactIdUnique':d.get('candidateExactIdUnique'),
            'officialInventoryRows':inv.get('rows'),
            'officialInventoryEvseColumns':inv.get('evseColumns'),
            'bestExactJoin':inv.get('bestExactJoin'),
            'matchSamples':inv.get('matchSamples',[])[:5],
            'gapSamples':inv.get('gapSamples',[])[:5]
          }
          pathlib.Path('reports/france/driveco/exact-audit-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/driveco/exact-audit-summary.json
          git commit -m 'France DRIVECO: publish exact audit summary' || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
