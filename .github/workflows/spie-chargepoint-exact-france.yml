name: France SPIE CityNetworks exact tariffs via ChargePoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/spie-chargepoint-exact-france.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build exact fail-closed SPIE overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/france/spie-citynetworks
          python - <<'PY'
          import csv,io,json,re,requests,pathlib,urllib.parse,concurrent.futures
          from datetime import datetime,timezone
          PAN='https://static.data.gouv.fr/resources/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques-donnees-statiques/20260902-033409/consolidation-etalab-schema-irve-statique-v-2.3.1-20260902.csv'
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/1.0','Accept':'application/json,*/*'})
          rows=list(csv.DictReader(io.StringIO(S.get(PAN,timeout=90).content.decode('utf-8-sig',errors='replace'))))
          def v(r,*ns):
            for n in ns:
              if r.get(n): return str(r[n]).strip()
            return ''
          def nrm(s):return re.sub('[^A-Z0-9]','',str(s).upper())
          def coord(r):
            z=re.findall(r'-?\d+(?:\.\d+)?',v(r,'coordonneesXY','coordonnees_xy'))
            if len(z)>=2:
              a,b=map(float,z[:2])
              if abs(a)<=10 and 40<=b<=52:return b,a
              if abs(b)<=10 and 40<=a<=52:return a,b
          target=[]
          for r in rows:
            hay=' | '.join([v(r,'nom_amenageur'),v(r,'nom_operateur'),v(r,'nom_enseigne'),v(r,'contact_amenageur')]).lower()
            if 'spie citynetworks' in hay or 'spie city networks' in hay:target.append(r)
          byc={}
          for r in target:
            c=coord(r)
            if c:byc.setdefault((round(c[0],6),round(c[1],6)),[]).append(r)
          MAP='https://mc.chargepoint.com/map-prod/v2?';INFO='https://mc.chargepoint.com/map-prod/v3/station/info?deviceId='
          filt={x:False for x in ['price_free','status_available','dc_fast_charging','disabled_parking','van_accessible','network_chargepoint','network_mercedes','connector_l1','connector_l2','connector_l2_nema_1450','connector_l2_tesla','connector_chademo','connector_combo','connector_tesla']}
          def near(c):
            lat,lon=c;d=.0025;q={'station_list':{'screen_width':800,'screen_height':800,'ne_lat':lat+d,'ne_lon':lon+d,'sw_lat':lat-d,'sw_lon':lon-d,'page_size':60,'page_offset':'','sort_by':'distance','reference_lat':lat,'reference_lon':lon,'include_map_bound':True,'filter':filt,'bound_output':True}}
            u=MAP+urllib.parse.quote(json.dumps(q,separators=(',',':')),safe='{}:,"')
            try:
              r=S.post(u,timeout=18);j=r.json() if r.ok else {};return c,[x.get('device_id') for x in ((j.get('station_list')or{}).get('stations')or[]) if x.get('device_id')]
            except:return c,[]
          cds={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
            for c,ds in ex.map(near,byc):cds[c]=ds
          devs=sorted({d for ds in cds.values() for d in ds})
          def inf(d):
            try:r=S.get(INFO+str(d),timeout=18);return d,(r.json() if r.ok else None)
            except:return d,None
          infos={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=56) as ex:
            for d,j in ex.map(inf,devs):infos[d]=j
          idx={}
          for d,j in infos.items():
            if not j:continue
            attr=' '.join([str(j.get('hostName')or''),str((j.get('network')or{}).get('displayName')or''),str((j.get('network')or{}).get('name')or'')]).lower()
            if 'spie' not in attr:continue
            for p in ((j.get('portsInfo')or{}).get('ports')or[]):
              if p.get('evseId'):idx[nrm(p['evseId'])]=(p['evseId'],d,j,p)
          exact=[];gaps=[]
          for r in target:
            pid=v(r,'id_pdc_itinerance');x=idx.get(nrm(pid))
            if x and x[2].get('stationPrice') is not None:
              eid,d,j,p=x;exact.append({'id_pdc_itinerance':pid,'id_station_itinerance':v(r,'id_station_itinerance'),'deviceId':d,'evseId':eid,'stationName':(j.get('name')or[None])[0],'hostName':j.get('hostName'),'network':j.get('network'),'stationPrice':j.get('stationPrice'),'sourceUrl':INFO+str(d)})
            else:gaps.append({'id_pdc_itinerance':pid,'reason':'no_exact_spie_attributed_chargepoint_evse_price'})
          out={'generatedAt':datetime.now(timezone.utc).isoformat(),'operator':'SPIE CityNetworks','classification':{'sourceType':'public_third_party_station_detail','source':'ChargePoint public driver map','exactEvseMatchRequired':True,'operatorAttributionRequired':True,'failClosed':True,'treated':bool(exact)},'coverage':{'panRows':len(target),'uniquePanCoordinates':len(byc),'candidateDeviceIds':len(devs),'attributedVisibleEvseIds':len(idx),'exactRows':len(exact),'missingRows':len(gaps),'coveragePct':round(100*len(exact)/len(target),2) if target else 0},'exact':exact,'gaps':gaps}
          pathlib.Path('data/operator_direct/spie_citynetworks_chargepoint_exact_france.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('reports/france/spie-citynetworks/chargepoint-exact-summary.json').write_text(json.dumps({'classification':out['classification'],'coverage':out['coverage'],'sampleExact':exact[:10]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'classification':out['classification'],'coverage':out['coverage'],'sampleExact':exact[:3]},ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/spie_citynetworks_chargepoint_exact_france.json reports/france/spie-citynetworks/chargepoint-exact-summary.json
          git commit -m 'data(spie): publish exact ChargePoint-attributed EVSE tariffs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
