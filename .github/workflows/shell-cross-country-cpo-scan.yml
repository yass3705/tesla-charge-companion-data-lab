name: Shell cross-country CPO reconnaissance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/shell-cross-country-cpo-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan Shell EV API across active TCC countries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/cross-country
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error,math
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Cross-Country-Scan"; PROVIDER="Shell_RP_2"
          last=0.0; token=None; refreshes=0

          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token,refreshes
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr:
                  token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1

          auth()

          def get(path,params=None):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+path
                  if params: url+="?"+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+token,"Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:2000]}
              return 0,{}

          # Bounding boxes and grid density chosen to keep this a reconnaissance pass.
          countries={
              "FR":{"bbox":(-5.2,41.2,9.7,51.3),"grid":(4,3)},
              "BE":{"bbox":(2.5,49.45,6.5,51.6),"grid":(2,2)},
              "DE":{"bbox":(5.8,47.2,15.1,55.1),"grid":(4,3)},
              "IT":{"bbox":(6.6,36.5,18.6,47.2),"grid":(4,3)},
              "ES":{"bbox":(-9.5,35.8,3.4,43.9),"grid":(4,3)},
              "MA":{"bbox":(-13.2,27.5,-0.9,35.95),"grid":(3,2)}
          }

          target_terms=("shell","ubitricity","newmotion","chargepoint","instavolt","bp pulse","totalenergies")
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"providerId":PROVIDER,"tokenRefreshCount":0,"countries":{}}

          for cc,cfg in countries.items():
              west,south,east,north=cfg["bbox"]; nx,ny=cfg["grid"]
              markers=[]
              for iy in range(ny):
                  s=south+(north-south)*iy/ny; n=south+(north-south)*(iy+1)/ny
                  for ix in range(nx):
                      w=west+(east-west)*ix/nx; e=west+(east-west)*(ix+1)/nx
                      st,body=get("/v2/locations/markers",{"west":w,"south":s,"east":e,"north":n,"zoom":12})
                      data=body.get("data") if isinstance(body,dict) else None
                      if st==200 and isinstance(data,list): markers.extend(data)

              # dedupe
              uniq={}
              for m in markers:
                  if not isinstance(m,dict): continue
                  coords=m.get("coordinates") or {}
                  key=(m.get("locationUid"),coords.get("latitude"),coords.get("longitude"),m.get("operatorName"),m.get("markerType"))
                  uniq[key]=m
              markers=list(uniq.values())

              singles=[m for m in markers if m.get("markerType")=="SingleLocation" and m.get("locationUid")]
              opcounts={}
              for m in singles:
                  op=str(m.get("operatorName") or "UNKNOWN")
                  opcounts[op]=opcounts.get(op,0)+1

              candidates=[]
              for m in singles:
                  op=str(m.get("operatorName") or "")
                  if any(t in op.lower() for t in target_terms):
                      candidates.append(m)

              # limit detail probes to 5 per operator to measure tariff viability
              byop={}
              for m in candidates:
                  byop.setdefault(str(m.get("operatorName") or "UNKNOWN"),[]).append(m)

              probes=[]
              for op,rows in sorted(byop.items()):
                  for m in rows[:5]:
                      uid=str(m.get("locationUid"))
                      st,body=get("/v2/locations/"+urllib.parse.quote(uid,safe=""),{"providerId":PROVIDER})
                      data=body.get("data") if isinstance(body,dict) else None
                      if isinstance(data,list) and data: data=data[0]
                      tariff_count=0; connector_count=0
                      if isinstance(data,dict):
                          for ev in data.get("evses") or []:
                              for conn in ev.get("connectors") or []:
                                  connector_count+=1
                                  tariff_count+=len(conn.get("tariffs") or [])
                      probes.append({
                          "operatorName":op,"uid":uid,"httpStatus":st,
                          "connectorCount":connector_count,"tariffCount":tariff_count
                      })

              out["countries"][cc]={
                  "markerCount":len(markers),
                  "singleLocationCount":len(singles),
                  "operatorCounts":dict(sorted(opcounts.items(),key=lambda kv:(-kv[1],kv[0]))),
                  "targetOperators":sorted(byop.keys()),
                  "probes":probes
              }

          out["tokenRefreshCount"]=refreshes
          Path("reports/cross-country/shell-cpo-scan-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps({
              cc:{
                  "singleLocationCount":v["singleLocationCount"],
                  "targetOperators":v["targetOperators"],
                  "probeSummary":[{
                      "operatorName":p["operatorName"],"httpStatus":p["httpStatus"],"tariffCount":p["tariffCount"]
                  } for p in v["probes"]]
              } for cc,v in out["countries"].items()
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/cross-country/shell-cpo-scan-latest.json /tmp/shell-cpo-scan-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/shell-cpo-scan-latest.json reports/cross-country/shell-cpo-scan-latest.json
          git add reports/cross-country/shell-cpo-scan-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: scan Shell EV API across active TCC countries [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
