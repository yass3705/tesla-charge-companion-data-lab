name: Allego parser hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/allego-parser-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relax Allego visible pricing labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/allego_official.py')
          s = p.read_text(encoding='utf-8')
          fn = s.index('def parse_country_direct')
          start = s.index('    patterns = {', fn)
          end = s.index('    out = {}', start)
          new = '''    patterns = {
              "ultraFast": r"(?:(?:charg(?:ement|e)|recharge)\\s+)?(?:ultra(?:-|\\s)?rapide|ultra(?:-|\\s)?fast(?:\\s+charging)?).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
              "fast": r"(?:(?:charg(?:ement|e)|recharge)\\s+rapide|(?<!ultra-)fast\\s+charging).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
              "regular": r"(?:(?:charg(?:ement|e)|recharge)\\s+(?:regulier|normal(?:e)?)|regular\\s+charging).{0,180}?(?:€\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:€\\s*)?/\\s*kwh",
          }
'''.replace('              ', '        ')
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
          python -m py_compile scripts/allego_official.py

      - name: Commit Allego parser fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/allego_official.py
          git commit -m "fix(allego): accept current France pricing label variants"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
