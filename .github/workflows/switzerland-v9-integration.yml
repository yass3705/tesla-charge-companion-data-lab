name: Switzerland V9 canonical integration
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_switzerland_v9_dataset.py"
      - "data/switzerland/**"
      - "data/swisscharge/**"
      - "data/gofast/**"
      - "docs/switzerland-cpo-progress-2026-09.json"
      - ".github/workflows/switzerland-v9-integration.yml"
permissions:
  contents: write
concurrency:
  group: switzerland-v9-integration-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build Switzerland V9 dataset
        run: python3 scripts/build_switzerland_v9_dataset.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/national/switzerland_public_charging_v9.json").read_text())
          s=p["summary"]
          assert p["country"]=="CH"
          assert s["nationalEvseCount"] > 10000
          assert s["directResolvedEvseCount"] > 0
          assert s["directResolvedEvseCount"] + s["directUnresolvedEvseCount"] == s["nationalEvseCount"]
          assert p["overlayPolicy"]["unresolvedPriceKeepsEvseVisible"] is True
          assert p["overlayPolicy"]["blockedCpoDoesNotHideResolvedEvses"] is True
          print(s)
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/national/switzerland_public_charging_v9.json docs/switzerland-v9-integration-2026-09-28.json
          git commit -m 'data(switzerland): publish V9 canonical integration' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
