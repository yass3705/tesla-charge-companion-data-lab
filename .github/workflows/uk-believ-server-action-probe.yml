name: UK Believ server action probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-believ-server-action-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe read-only Believ Next server actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          url="https://charge.believ.com/map"
          location_id="efd97cd1-4345-4083-824f-11fb8b7e43ed"
          actions={
            "getLocations":"405356f63ba570cc8fc4c395a98a38b45438cdf400",
            "getLocation":"40e38953f0e05f6ffd386075b7abfdae5f725d59e8",
            "getChargingStationsByLocation":"40ed5a602385af62845cf9866945f0fc7284fcc025"
          }
          payloads={
            "getLocations":[
              [{"charging_speed_ids":[],"origin_lat":51.5,"origin_lng":-0.1,"radius":100000,"limit":5}],
              {"charging_speed_ids":[],"origin_lat":51.5,"origin_lng":-0.1,"radius":100000,"limit":5}
            ],
            "getLocation":[[{"locationId":location_id}],{"locationId":location_id},[location_id]],
            "getChargingStationsByLocation":[[{"locationId":location_id}],{"locationId":location_id},[location_id]]
          }
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"locationId":location_id,"results":[]}
          for name,aid in actions.items():
            for idx,payload in enumerate(payloads[name]):
              body=json.dumps(payload).encode()
              headers={
                "User-Agent":"Mozilla/5.0 TeslaChargeCompanion/9",
                "Accept":"text/x-component",
                "Content-Type":"text/plain;charset=UTF-8",
                "Next-Action":aid,
                "Origin":"https://charge.believ.com",
                "Referer":"https://charge.believ.com/map"
              }
              item={"action":name,"variant":idx,"payload":payload}
              try:
                req=urllib.request.Request(url,data=body,headers=headers,method="POST")
                with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read(2_000_000)
                  txt=raw.decode("utf-8","replace")
                  item.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw),"prefix":txt[:2500]})
                  # harvest likely prices / station fields from RSC text
                  item["signals"]={k:(k in txt.lower()) for k in ["tariff","price","connector","charging_station","kwh","gbp"]}
              except urllib.error.HTTPError as e:
                raw=e.read(100000)
                item.update({"status":e.code,"error":str(e),"bodyPrefix":raw.decode("utf-8","replace")[:2000]})
              except Exception as e:
                item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
              out["results"].append(item)
          Path("reports/uk/believ-server-action-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/believ-server-action-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Believ read-only server actions [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
