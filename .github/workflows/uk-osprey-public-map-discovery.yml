name: UK Osprey public map discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-osprey-public-map-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Osprey map assets
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          page="https://www.ospreycharging.co.uk/find-our-ev-charging-stations"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          def get(u):
            q=urllib.request.Request(u,headers={"User-Agent":ua,"Accept":"*/*"})
            with urllib.request.urlopen(q,timeout=60) as r:return r.read(8000000).decode("utf-8","replace"),r.status,r.headers.get("Content-Type")
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Osprey Charging","page":page,"assets":[],"candidates":[]}
          try:
            html,st,ct=get(page);out["status"]=st;out["contentType"]=ct
            srcs=re.findall(r'''(?:src|href)=["']([^"'<>]+)["']''',html,re.I)
            assets=[]
            for s in srcs:
              u=urllib.parse.urljoin(page,s)
              if re.search(r'(?i)\.(?:js|mjs)(?:\?|$)',u) or "/_next/static/" in u:
                if u not in assets:assets.append(u)
            texts=[(page,html)]
            for u in assets[:60]:
              row={"url":u}
              try:
                txt,st,ct=get(u);row.update({"status":st,"bytes":len(txt.encode()),"contentType":ct});texts.append((u,txt))
              except Exception as e:row["error"]=f"{type(e).__name__}: {e}"
              out["assets"].append(row)
            vals=[]
            urlre=re.compile(r'https?://[^"\'\\s<>]+',re.I)
            for source,txt in texts:
              for u in urlre.findall(txt):
                if any(k in u.lower() for k in ("api","map","location","station","charger","ocpi","osprey")):
                  vals.append({"source":source,"url":u[:1500]})
              low=txt.lower()
              for kw in ("graphql","apiurl","api_url","apiendpoint","api_endpoint","locations","stations","chargers","mapbox","ocpi","hubject","osprey"):
                p=0;n=0
                while n<15:
                  i=low.find(kw,p)
                  if i<0:break
                  vals.append({"source":source,"keyword":kw,"context":txt[max(0,i-200):min(len(txt),i+600)]})
                  p=i+len(kw);n+=1
            seen=set();ded=[]
            for x in vals:
              k=json.dumps(x,sort_keys=True)
              if k not in seen:seen.add(k);ded.append(x)
            out["candidates"]=ded[:800]
          except Exception as e:out["error"]=f"{type(e).__name__}: {e}"
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/osprey-public-map-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"status":out.get("status"),"assets":len(out["assets"]),"candidateCount":len(out["candidates"]),"error":out.get("error")},indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/osprey-public-map-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover Osprey public map backend [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
