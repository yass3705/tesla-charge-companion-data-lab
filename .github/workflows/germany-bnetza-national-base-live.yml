name: Germany BNetzA national baseline live

on:
  workflow_dispatch:
  push:
    branches: ["feature/germany-national-base"]
    paths:
      - "scripts/germany_bnetza_catalog.py"
      - "scripts/germany_bnetza_live.py"
      - "tests/test_germany_bnetza_catalog.py"
      - "tests/test_germany_bnetza_live.py"
      - ".github/workflows/germany-bnetza-national-base-live.yml"

permissions:
  contents: read

concurrency:
  group: germany-bnetza-national-base-live
  cancel-in-progress: true

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test BNetzA normalizer and live layout
        run: python -m unittest tests/test_germany_bnetza_catalog.py tests/test_germany_bnetza_live.py -v

      - name: Build current national baseline
        run: python scripts/germany_bnetza_live.py

      - name: Validate current national baseline
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          path=Path('data/germany/bnetza_baseline.json.gz')
          assert path.is_file(), 'German BNetzA artifact missing'
          with gzip.open(path,'rt',encoding='utf-8') as handle:
              p=json.load(handle)
          s=p['stats']
          assert p['dataset']=='germany-bnetza-static-baseline'
          assert p['countryCode']=='DE'
          assert p['source']['authority']=='Bundesnetzagentur'
          assert p['source']['license']=='CC BY 4.0'
          assert p['source']['attribution']=='bundesnetzagentur.de'
          assert p['scope']['dynamicStatusIncluded'] is False
          assert p['scope']['tariffsIncluded'] is False
          assert p['scope']['teslaExcluded'] is False
          assert s['stationRows'] >= 50000, s
          assert s['declaredChargePoints'] >= 150000, s
          assert s['operators'] >= 100, s
          assert s['skippedWithoutCoordinates'] < max(1000, s['stationRows'] * .02), s
          assert all(x['address']['countryCode']=='DE' for x in p['stations'][:1000])
          assert all(x['operationalStatus']=='unknown' for x in p['stations'][:1000])
          print('TCC_GERMANY_STATS=' + json.dumps(s, ensure_ascii=False, sort_keys=True))
          print('TCC_GERMANY_SOURCE=' + p['source']['url'])
          print('TCC_GERMANY_PARSE=' + json.dumps({
              'headerRow': p['parse']['headerRow'],
              'mappedColumns': p['parse']['mappedColumns'],
              'connectorGroups': len(p['parse']['connectorGroups']),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: germany-bnetza-baseline-live-${{ github.run_id }}
          path: data/germany/bnetza_baseline.json.gz
          if-no-files-found: error
          retention-days: 7
