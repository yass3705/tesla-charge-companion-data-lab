name: France SPIE Metropolis exact tariffs
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 2"
  push:
    branches: [main]
    paths: ['.github/workflows/metropolis-spie-exact-france.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build fail-closed Metropolis overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/france/spie-citynetworks
          python - <<'PY'
          import csv,io,json,re,requests,pathlib
          from datetime import datetime,timezone
          META='https://www.data.gouv.fr/api/1/datasets/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques/'
          meta=requests.get(META,timeout=30).json()
          cand=[]
          for x in meta.get('resources') or []:
            if str(x.get('format') or '').lower()!='csv': continue
            title=str(x.get('title') or ''); tl=title.lower(); url=str(x.get('url') or '').lower()
            if 'consolidation' not in tl or 'documentation' in tl or 'ref-table' in url: continue
            score=(2 if 'dernière version' in tl or 'derniere version' in tl else 1,
                   str(x.get('last_modified') or x.get('modified') or x.get('created_at') or ''))
            cand.append((score,x))
          cand.sort(key=lambda z:z[0],reverse=True)
          if not cand: raise SystemExit('no current PAN consolidation CSV')
          PAN=cand[0][1]['url']
          SRC='https://www.metropolis-recharge.fr/'
          rr=requests.get(PAN,timeout=120); rr.raise_for_status()
          text=rr.content.decode('utf-8-sig',errors='replace')
          try:d=csv.Sniffer().sniff(text[:100000],delimiters=',;\t')
          except:d=csv.excel
          rows=list(csv.DictReader(io.StringIO(text),dialect=d))
          def v(r,*ns):
            for n in ns:
              if r.get(n):return str(r[n]).strip()
            return ''
          target=[]
          for r in rows:
            hay=' | '.join([v(r,'nom_operateur'),v(r,'nom_enseigne'),v(r,'nom_station'),v(r,'nom_amenageur')]).lower()
            if ('spie citynetworks' in hay or 'spie city networks' in hay) and 'metropolis' in hay.replace('é','e'):
              target.append(r)
          exact=[];gaps=[]
          for r in target:
            pid=v(r,'id_pdc_itinerance'); name=v(r,'nom_station'); addr=v(r,'adresse_station'); commune=v(r,'code_insee_commune')
            try:p=float(v(r,'puissance_nominale') or 0)
            except:p=0
            n=name.lower().replace('é','e')
            energy=None; post=None; rule=None; extra={}
            # Apply only explicitly covered official classes. Unknown intermediate power on Express stays fail-closed.
            if 'proxim' in n and 0 < p <= 7.4:
              energy=.44 if p <= 3.7 else .53
              post=.10; rule='Metropolis Proximite official 2026 grid'
            elif 'citadine' in n and 0 < p <= 25:
              energy=.44 if p <= 3.7 else .53
              post=.10; rule='Metropolis Citadine official 2026 grid'
            elif 'express' in n and p >= 150 and p <= 180:
              energy=.63; post=.20; rule='Metropolis Express 150-180kW official 2026 grid'
            elif 'express' in n and 20 <= p <= 25:
              energy=.53; post=.20; rule='Metropolis 22kW connector on Express station official 2026 exception'
            if energy is None:
              gaps.append({'id_pdc_itinerance':pid,'id_station_itinerance':v(r,'id_station_itinerance'),'station':name,'powerKw':p,'reason':'official_grid_does_not_unambiguously_cover_this_pan_power_station_type'})
              continue
            # Neuilly-sur-Seine post-charge exception is time-dependent and retained as exact schedule.
            if 'neuilly-sur-seine' in (addr+' '+name).lower() or 'neuilly sur seine' in (addr+' '+name).lower():
              extra['postChargeSchedule']=[{'start':'08:00','end':'20:00','eurPerMinute':.20},{'start':'20:00','end':'08:00','eurPerMinute':.10}]
              post=None
            exact.append({'id_pdc_itinerance':pid,'id_station_itinerance':v(r,'id_station_itinerance'),'station':name,'address':addr,'powerKw':p,'energyEurPerKwh':energy,'postChargeGraceMinutes':10,'postChargeEurPerMinute':post,**extra,'rule':rule,'sourceUrl':SRC})
          out={'schemaVersion':'1.0.0','dataset':'metropolis-spie-official-2026-france','generatedAt':datetime.now(timezone.utc).isoformat(),'operator':'SPIE CityNetworks','network':'Metropolis','country':'FR','classification':{'officialSource':True,'exactRuleMatchRequired':True,'failClosed':True,'treatedNetwork':True,'treatedCpo':False,'note':'This resolves the Metropolis subnetwork of SPIE CityNetworks only; it does not declare the whole SPIE CPO treated.'},'officialGrid':{'3.7kW':{'energyEurPerKwh':.44,'postChargeEurPerMinute':.10},'3.7_to_22_25kW':{'energyEurPerKwh':.53,'postChargeEurPerMinute':.10},'Express_150_to_180kW':{'energyEurPerKwh':.63,'postChargeEurPerMinute':.20},'Express_22kW':{'energyEurPerKwh':.53,'postChargeEurPerMinute':.20},'graceMinutes':10,'neuillyPostCharge':{'08:00-20:00':.20,'20:00-08:00':.10}},'coverage':{'metropolisPanRows':len(target),'exactRows':len(exact),'gaps':len(gaps),'coveragePct':round(100*len(exact)/len(target),2) if target else 0},'exact':exact,'gaps':gaps,'sources':[{'url':SRC,'retrievedDate':datetime.now(timezone.utc).date().isoformat()},{'url':'https://www.metropolis-recharge.fr/wp-content/uploads/2026/01/CGAUV-Metropolis-2026-01.pdf'},{'url':PAN,'type':'current-national-irve-consolidation'}]}
          pathlib.Path('data/operator_direct/metropolis_spie_official_france.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('reports/france/spie-citynetworks/metropolis-summary.json').write_text(json.dumps({'classification':out['classification'],'coverage':out['coverage'],'sampleExact':exact[:8],'sampleGaps':gaps[:12]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'coverage':out['coverage'],'sampleExact':exact[:3]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/metropolis_spie_official_france.json reports/france/spie-citynetworks/metropolis-summary.json
          git commit -m 'data(spie): publish exact Metropolis 2026 tariff overlay' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
