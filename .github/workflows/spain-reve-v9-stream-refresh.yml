name: Spain REVE V9 fresh national tariff/status collection
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: spain-reve-v9-stream-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY || secrets.REVE_API_KEY }}
      REVE_DATA_DIR: data/spain_reve/full_20261018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test fresh checkpoint integrity
        run: python -m unittest tests/test_reve_es_stream_collect.py -v
      - name: Collect next pages without using historical checkpoint
        id: collect
        continue-on-error: true
        run: python scripts/reve_es_stream_collect.py --collect
      - name: Validate persisted checkpoint independently of supplier availability
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.reve_es_stream_collect import STATE,TARIFF_STORE,STATUS_STORE,LAST_RUN,load_json,load_gzip,validate_checkpoint
          state=load_json(STATE,{})
          validate_checkpoint(state,load_gzip(TARIFF_STORE),load_gzip(STATUS_STORE))
          report=load_json(LAST_RUN,{})
          assert report.get('requestsAttempted',0)<=5
          print(json.dumps({'checkpointValid':True,'supplierBatchSucceeded':report.get('requestsAttempted')==report.get('requestsSucceeded'),'nextTariffPage':state['nextTariffPage'],'nextStatusPage':state['nextStatusPage'],'complete':state['complete']}))
          PY
      - name: Persist isolated collection progress
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spain_reve/full_20261018
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(spain): advance fresh REVE national collection [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
