name: Morocco Club EV-Charge exact runtime entrypoint probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morocco-club-evcharge-runtime-entrypoint.yml'
      - 'scripts/morocco_club_evcharge_runtime_entrypoint_probe.py'
      - 'reports/morocco/totalenergies/club-ev-charge-public-root-assets-2026-09-01.json'
      - 'reports/morocco/totalenergies/club-ev-charge-runtime-entrypoint-2026-09-01.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/morocco-club-evcharge-runtime-entrypoint.yml'
      - 'scripts/morocco_club_evcharge_runtime_entrypoint_probe.py'
      - 'reports/morocco/totalenergies/club-ev-charge-public-root-assets-2026-09-01.json'
      - 'reports/morocco/totalenergies/club-ev-charge-runtime-entrypoint-2026-09-01.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect exact public Flutter runtime entrypoint
        run: python3 scripts/morocco_club_evcharge_runtime_entrypoint_probe.py

      - name: Validate isolated read-only fail-closed contract
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          d=json.loads(Path('artifacts/morocco-club-evcharge-runtime-entrypoint/summary.json').read_text())
          assert d.get('schema_version')==2
          p=d.get('policy',{})
          for key in (
              'public_shell_record_gate',
              'anonymous_read_only_get_only',
              'exact_same_origin_entrypoint_only',
              'entrypoint_must_be_explicitly_named_by_public_bootstrap',
              'no_discovered_route_requests',
              'no_path_enumeration',
              'no_redirects_followed',
              'no_query_parameters',
              'no_request_body',
              'no_login',
              'no_credentials',
              'no_cookies',
              'no_station_or_connector_ids',
              'no_charging_or_account_actions',
              'sanitized_read_only_api_candidates_only',
              'ui_navigation_routes_excluded',
          ):
              assert p.get(key) is True, key
          assert p.get('raw_runtime_body_persisted') is False
          assert p.get('arbitrary_strings_persisted') is False

          gate=d.get('evidence_gate',{})
          assert gate.get('gate_passed') is True
          req=d.get('request',{})
          assert req.get('url')=='https://csmstotalenergiesma.numocity.com/main.dart.js'
          assert req.get('path')=='/main.dart.js'
          assert req.get('request_count')==1
          assert req.get('method')=='GET'
          assert req.get('status')==200
          assert 'javascript' in (req.get('content_type') or '').lower()
          assert req.get('bytes',0)>0
          assert req.get('sha256')
          assert req.get('limit_exceeded') is False
          assert not urlsplit(req.get('url')).query
          assert d.get('network',{}).get('total_request_count')==1
          assert d.get('network',{}).get('cross_origin_request_count')==0
          assert d.get('production_decision')=='no_promotion'

          model=d.get('modeling',{})
          assert model.get('cpo_operator')=='unresolved_station_specific'
          assert model.get('app_source_access_network')=='Club EV-Charge / TotalEnergies Marketing Maroc'
          assert model.get('numocity_role')=='unverified_current_production_backend'

          findings=d.get('safe_findings',{})
          assert findings.get('safe_numocity_absolute_url_count')==len(findings.get('safe_numocity_absolute_urls',[]))
          assert findings.get('safe_numocity_base_literal_count')==len(findings.get('safe_numocity_base_literals',[]))
          assert findings.get('safe_read_only_api_path_candidate_count')==len(findings.get('safe_read_only_api_path_candidates',[]))
          for value in findings.get('safe_numocity_absolute_urls',[]):
              u=urlsplit(value)
              assert u.scheme=='https'
              assert u.hostname=='numocity.com' or (u.hostname or '').endswith('.numocity.com')
              assert not u.query and not u.fragment
          for value in findings.get('safe_numocity_base_literals',[]):
              u=urlsplit(value)
              assert u.scheme=='https'
              assert u.hostname=='numocity.com' or (u.hostname or '').endswith('.numocity.com')
              assert not u.query and not u.fragment
          for path in findings.get('safe_read_only_api_path_candidates',[]):
              u=urlsplit(path)
              lower=path.lower()
              assert path.startswith('/') and not u.scheme and not u.netloc and not u.query and not u.fragment
              assert lower.startswith(('/api/','/poc/api/','/chargestation/'))
              assert '%' not in path
              segments={segment.lower() for segment in path.split('/') if segment}
              assert not any(re.fullmatch(r'(?:[0-9]{4,}|[0-9a-f]{8}-[0-9a-f-]{27,}|[A-Za-z0-9_-]{24,})',segment,re.I) for segment in segments)

          relations=findings.get('getstationstate_marker_relations',{})
          assert relations.get('getstationstate_occurrence_count',0) >= 0
          assert isinstance(relations.get('nearest_marker_distance_chars',{}),dict)
          assert isinstance(relations.get('marker_within_256_chars',{}),dict)
          assert isinstance(relations.get('marker_within_1024_chars',{}),dict)

          forbidden={'raw_body','raw_html','text','content','source_context'}
          def walk(value):
              if isinstance(value,dict):
                  assert forbidden.isdisjoint(value)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(d)

          assert d.get('technical_result')=='runtime_public_readonly_request_shape_evidence_identified'

          print(json.dumps({
              'ok':True,
              'status':req.get('status'),
              'bytes':req.get('bytes'),
              'absolute_urls':findings.get('safe_numocity_absolute_url_count'),
              'base_literals':findings.get('safe_numocity_base_literal_count'),
              'read_only_api_paths':findings.get('safe_read_only_api_path_candidate_count'),
              'relations':relations,
              'technical_result':d.get('technical_result'),
          },ensure_ascii=False))
          PY

      - name: Validate published runtime record matches live probe
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          live=json.loads(Path('artifacts/morocco-club-evcharge-runtime-entrypoint/summary.json').read_text())
          record=json.loads(Path('reports/morocco/totalenergies/club-ev-charge-runtime-entrypoint-2026-09-01.json').read_text())
          assert record.get('schema_version')==2
          source=record.get('source',{})
          assert source.get('workflow_run_id')==33538726691
          assert source.get('workflow_conclusion')=='success'
          assert source.get('head_sha')=='754d75142f95829d358f57e9d21479ccc821bd3d'
          assert source.get('artifact_id')==9812701285
          assert source.get('artifact_sha256')=='0e1727285f0f2f85935bf16fe9c53319280ce0c0d5fe3bd9432d663d49ce1fff'
          for key in (
              'subject',
              'policy',
              'limits',
              'evidence_gate',
              'request',
              'safe_findings',
              'network',
              'modeling',
              'technical_result',
              'production_decision',
              'next_step',
          ):
              assert record.get(key)==live.get(key), key
          assert record.get('safe_findings',{}).get('safe_read_only_api_path_candidates')==[
              '/poc/api/charge-location/info'
          ]
          assert record.get('production_decision')=='no_promotion'
          print(json.dumps({'ok':True,'runtime_record_matches_live_probe':True},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: morocco-club-evcharge-runtime-entrypoint
          path: artifacts/morocco-club-evcharge-runtime-entrypoint/summary.json
          if-no-files-found: error
          retention-days: 3
