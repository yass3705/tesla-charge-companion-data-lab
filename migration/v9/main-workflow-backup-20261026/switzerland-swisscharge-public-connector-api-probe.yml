name: Switzerland Swisscharge public connector API probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-swisscharge-public-connector-api-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect frontend API and probe public connector routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,http.cookiejar
          from pathlib import Path
          from datetime import datetime,timezone

          BASE="https://cp.swisscharge.ch"; UA="Mozilla/5.0 TCC-V9-Swisscharge-Public-API"
          js=urllib.request.urlopen(urllib.request.Request(BASE+"/js/app.js?id=dbae0f17a4ee0b5bead42af136027639",headers={"User-Agent":UA}),timeout=60).read().decode("utf-8","replace")
          needles=["/api/v1/cpc/1/connector/","/api/v1/app/session/start","connector/","tariff","price"]
          snippets=[]
          for n in needles:
            pos=0;count=0
            while True:
              i=js.find(n,pos)
              if i<0 or count>=15:break
              snippets.append({"needle":n,"offset":i,"text":js[max(0,i-2200):min(len(js),i+5000)]})
              pos=i+len(n);count+=1

          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json,text/html,*/*"})
            try:
              with op.open(req,timeout=30) as r:return r.status,r.geturl(),dict(r.headers.items()),r.read()
            except urllib.error.HTTPError as e:return e.code,e.geturl(),dict(e.headers.items()),e.read()
            except Exception as e:return 0,url,{},(type(e).__name__+": "+str(e)).encode()

          refs=["290524","290525","290526","1717","25665","25666","27986"]
          routes=[]
          for ref in refs:
            get(BASE+"/public/cs/"+ref)
            for path in [
              f"/api/v1/cpc/1/connector/{ref}",
              f"/api/v1/cpc/1/connector/{ref}?public=true",
              f"/api/v1/cpc/1/connector/{ref}?code={ref}"
            ]:
              st,fu,h,raw=get(BASE+path)
              try:body=json.loads(raw.decode())
              except:body={"raw":raw.decode("utf-8","replace")[:3000]}
              routes.append({"reference":ref,"path":path,"status":st,"finalUrl":fu,"body":body})
          out={"schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),"snippets":snippets,"routes":routes}
          Path("docs/switzerland-swisscharge-public-connector-api-probe-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps([{"reference":r["reference"],"path":r["path"],"status":r["status"],"keys":list(r["body"].keys()) if isinstance(r["body"],dict) else None} for r in routes],ensure_ascii=False))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-swisscharge-public-connector-api-probe-2026-09-29.json
          git commit -m "research(ch): probe Swisscharge public connector API" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
