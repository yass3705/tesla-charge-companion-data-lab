name: V9 isolated collection
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact source ID from v9_rebuild/sources.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preserved Belib PDF extractor
        if: ${{ inputs.source == 'FR:belib' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Install preserved Allego browser dependency
        if: ${{ inputs.source == 'FR:allego_stations' || inputs.source == 'FR:allego_official' }}
        run: python -m pip install --disable-pip-version-check -q selenium
      - name: Find the latest state for this source and branch
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ inputs.source }}
        run: python -m v9_rebuild.artifact_selection --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --source "$SOURCE_ID" --github-output "$GITHUB_OUTPUT"
      - name: Restore a technical checkpoint when requested
        if: ${{ steps.prior.outputs.checkpoint_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-checkpoints-${{ steps.prior.outputs.slug }}
          run-id: ${{ steps.prior.outputs.checkpoint_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/checkpoints
      - name: Restore the last validated state when requested
        if: ${{ steps.prior.outputs.state_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.slug }}
          run-id: ${{ steps.prior.outputs.state_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_state
      - name: Restore validated tariff dependency for the overlay
        if: ${{ inputs.source == 'FR:electroverse_overlay' && steps.prior.outputs.tariff_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.tariff_slug }}
          run-id: ${{ steps.prior.outputs.tariff_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/${{ steps.prior.outputs.tariff_slug }}
      - name: Restore validated national-status dependency for the overlay
        if: ${{ inputs.source == 'FR:electroverse_overlay' && steps.prior.outputs.status_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tcc-v9-collection-FR_electroverse_status
          run-id: ${{ steps.prior.outputs.status_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/input_dependencies/FR_electroverse_status
      - name: Collect migrated sources into isolated artifacts
        env:
          SOURCE_ID: ${{ inputs.source }}
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
          BELGIUM_NAP_TOKEN: ${{ secrets.BELGIUM_NAP_TOKEN }}
          ATLANTE_API_SUBSCRIPTION_KEY: ${{ secrets.ATLANTE_API_SUBSCRIPTION_KEY }}
          BLINK_PCPR_TOKEN: ${{ secrets.BLINK_PCPR_TOKEN }}
          ALLEGO_UK_PCPR_TOKEN: ${{ secrets.ALLEGO_UK_PCPR_TOKEN }}
          SOURCE_EV_PCPR_TOKEN: ${{ secrets.SOURCE_EV_PCPR_TOKEN }}
          EVYVE_PCPR_TOKEN: ${{ secrets.EVYVE_PCPR_TOKEN }}
          GRIDSERVE_PCPR_API_KEY: ${{ secrets.GRIDSERVE_API_KEY }}
          GRIDSERVE_API_KEY: ${{ secrets.GRIDSERVE_API_KEY }}
        run: python -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/tcc-v9-artifacts" --workers 1 --attempts 2
      - name: Preserve validated immutable outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-collection-${{ steps.prior.outputs.slug }}
          path: |
            ${{ runner.temp }}/tcc-v9-artifacts/manifest.json
            ${{ runner.temp }}/tcc-v9-artifacts/objects
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve failure manifest separately
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-failure-${{ steps.prior.outputs.slug }}
          path: |
            ${{ runner.temp }}/tcc-v9-artifacts/manifest.json
            ${{ runner.temp }}/tcc-v9-artifacts/failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain failed technical checkpoint for an explicit retry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-checkpoints-${{ steps.prior.outputs.slug }}
          path: ${{ runner.temp }}/tcc-v9-artifacts/checkpoints
          if-no-files-found: ignore
          retention-days: 7
