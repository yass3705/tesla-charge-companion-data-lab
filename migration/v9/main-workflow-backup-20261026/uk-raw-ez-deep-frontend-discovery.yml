name: UK RAW EZ deep frontend discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-raw-ez-deep-frontend-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect current frontend assets and source maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error,pathlib
          from datetime import datetime,timezone

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          targets={
            "RAW Charging":[
              "https://rawcharging.com/driver-support",
              "https://rawcharging.com/drivers",
              "https://rawcharging.com/"
            ],
            "EZ-Charge":[
              "https://ez-charge.co.uk/drivers/"
            ]
          }

          def get(url,limit=10_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.status,r.geturl(),r.read(limit).decode("utf-8","replace"),dict(r.headers.items())

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":{}}
          for name,urls in targets.items():
              rec={"pages":[],"assets":[],"hosts":[],"routes":[],"contexts":[]}
              assets=set(); blobs=[]
              for url in urls:
                  try:
                      st,final,html,h=get(url)
                      rec["pages"].append({"url":url,"status":st,"finalUrl":final,"bytes":len(html)})
                      blobs.append(("html",final,html))
                      for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
                          assets.add(urllib.parse.urljoin(final,s))
                      for s in re.findall(r'<link[^>]+href=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',html,re.I):
                          assets.add(urllib.parse.urljoin(final,s))
                  except Exception as e:
                      rec["pages"].append({"url":url,"error":type(e).__name__+": "+str(e)})

              # fetch JS and any source maps
              fetched=set()
              for a in list(assets)[:120]:
                  try:
                      st,final,txt,h=get(a,12_000_000)
                      fetched.add(final)
                      blobs.append(("asset",final,txt))
                      rec["assets"].append({"url":final,"status":st,"bytes":len(txt)})
                      m=re.search(r'//# sourceMappingURL=([^\s]+)',txt)
                      if m:
                          sm=urllib.parse.urljoin(final,m.group(1))
                          try:
                              sst,sfinal,smtxt,sh=get(sm,18_000_000)
                              blobs.append(("sourcemap",sfinal,smtxt))
                              rec["assets"].append({"url":sfinal,"status":sst,"bytes":len(smtxt),"sourceMap":True})
                          except Exception:
                              pass
                  except Exception:
                      pass

              hosts=set(); routes=set(); contexts=[]
              needles=("ocpi","tariff","price","pricing","location","station","charger","evse","connector",
                       "azurewebsites","functionapp","blob.core.windows.net","sitearea","tenant","baseurl","apiurl")
              for kind,src,txt in blobs:
                  for u in re.findall(r'https?://[^\s"\'<>\\]{5,900}',txt):
                      ul=u.lower()
                      if any(n in ul for n in needles):
                          try: hosts.add(urllib.parse.urlparse(u).netloc.lower())
                          except: pass
                  for rr in re.findall(r'["\'](/[^"\']{0,220}(?:ocpi|tariff|price|locations?|stations?|chargers?|evses?|connectors?)[^"\']{0,220})["\']',txt,re.I):
                      routes.add(rr[:450])
                  low=txt.lower()
                  for needle in needles:
                      pos=0
                      for _ in range(20):
                          i=low.find(needle,pos)
                          if i<0: break
                          chunk=txt[max(0,i-500):min(len(txt),i+1400)]
                          if re.search(r'https?://|/api|/ocpi|tariff|pricing|functionapp|blob\.core',chunk,re.I):
                              chunk=re.sub(r'([?&](?:code|key|api_key|apikey|token)=)[^&#\s"\']+',r'\1<redacted>',chunk,flags=re.I)
                              contexts.append({"source":kind,"url":src,"needle":needle,"context":chunk[:1900]})
                          pos=i+len(needle)

              rec["hosts"]=sorted(hosts)
              rec["routes"]=sorted(routes)[:600]
              rec["contexts"]=contexts[:350]
              out["targets"][name]=rec

          pathlib.Path("reports/uk/raw-ez-deep-frontend-discovery-latest.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({
            k:{"pages":v["pages"],"hosts":v["hosts"],"routes":v["routes"][:80],
               "contextCount":len(v["contexts"])}
            for k,v in out["targets"].items()
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/raw-ez-deep-frontend-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): deep inspect RAW and EZ frontend routes [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
