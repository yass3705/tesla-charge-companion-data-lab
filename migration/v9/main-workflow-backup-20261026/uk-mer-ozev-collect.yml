name: UK Mer OZEV collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-mer-ozev-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-mer-ozev-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect Mer UK OZEV open data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json,gzip,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path

          URL="https://uk.mer.eco/wp-json/ozev/v1/data"
          req=urllib.request.Request(URL,headers={"User-Agent":"TeslaChargeCompanion/9 UK-Mer-OZEV","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read()
              payload=json.loads(raw.decode("utf-8"))

          # Discover OCPI-shaped arrays wherever Mer wraps them.
          locations=[]; tariffs=[]
          def walk(x,path="root"):
              nonlocal_locations=None
              if isinstance(x,dict):
                  for k,v in x.items():
                      kl=str(k).lower()
                      if kl in ("locations","location") and isinstance(v,list):
                          locations.extend([z for z in v if isinstance(z,dict)])
                      if kl in ("tariffs","tariff") and isinstance(v,list):
                          tariffs.extend([z for z in v if isinstance(z,dict)])
                      walk(v,path+"."+str(k))
              elif isinstance(x,list):
                  # Heuristic: top-level OCPI location objects.
                  if x and all(isinstance(z,dict) for z in x):
                      keys=set().union(*(set(z.keys()) for z in x[:5]))
                      if {"address","coordinates"} & keys and "evses" in keys:
                          locations.extend(x)
                      if "elements" in keys and "currency" in keys:
                          tariffs.extend(x)
                  for i,v in enumerate(x[:100000]): walk(v,f"{path}[{i}]")
          walk(payload)

          # Deduplicate.
          def dedupe(rows):
              out=[]; seen=set()
              for x in rows:
                  key=(str(x.get("country_code")),str(x.get("party_id")),str(x.get("id")))
                  if key not in seen:
                      seen.add(key); out.append(x)
              return out
          locations=dedupe(locations); tariffs=dedupe(tariffs)

          evses=connectors=0; statuses={}; parties=set(); linked=set()
          for loc in locations:
              if loc.get("party_id"): parties.add(str(loc["party_id"]))
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1; st=str(ev.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  for c in ev.get("connectors") or []:
                      if not isinstance(c,dict): continue
                      connectors+=1
                      for tid in c.get("tariff_ids") or []: linked.add(str(tid))
                      if c.get("tariff_id") is not None: linked.add(str(c.get("tariff_id")))
          tids={str(t.get("id")) for t in tariffs if isinstance(t,dict) and t.get("id") is not None}
          missing=sorted(linked-tids)

          out={"country":"GB","network":"Mer UK","source":URL,"retrievedAt":datetime.now(timezone.utc).isoformat(),
               "raw":payload,"locations":locations,"tariffs":tariffs}
          summary={"country":"GB","network":"Mer UK","source":URL,"retrievedAt":out["retrievedAt"],
                   "payloadType":type(payload).__name__,
                   "topLevelKeys":list(payload)[:50] if isinstance(payload,dict) else None,
                   "locations":len(locations),"evses":evses,"connectors":connectors,"tariffs":len(tariffs),
                   "partyIdsObserved":sorted(parties),"evseStatuses":statuses,
                   "connectorTariffIds":len(linked),"resolvedTariffIds":len(linked&tids),
                   "missingTariffIds":missing,
                   "status":"complete" if locations and not missing else ("partial" if locations else "schema_probe_only")}
          with gzip.open("data/national/uk_mer_ozev.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/mer-ozev-latest.json").write_text(json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY

      - name: Publish Mer dataset and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_mer_ozev.json.gz reports/uk/mer-ozev-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Mer OZEV open data [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
