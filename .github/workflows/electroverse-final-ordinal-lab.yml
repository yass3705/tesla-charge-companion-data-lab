name: Build France Electroverse final-ordinal lab
on:
  push:
    branches:
      - electroverse-final-ordinal-subgroup-lab
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-final-ordinal-lab.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build lab overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Persist lab overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/france-evse
          git commit -m "lab: publish final-ordinal Electroverse overlay" || exit 0
          git push
