name: One-shot cleanup failed runs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/cleanup-failed-runs-one-shot.trigger"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tesla-charge-companion-data-lab-cleanup'
          }

          def api_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def delete_run(rid):
              url = f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
              last = None
              for attempt in range(1, 4):
                  req = urllib.request.Request(url, headers=headers, method='DELETE')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          r.read()
                      return True, None
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return True, 'already-gone'
                      body = e.read().decode('utf-8', 'replace')[:1000]
                      last = {'status': e.code, 'body': body, 'attempt': attempt}
                      if e.code in (409, 429, 500, 502, 503, 504):
                          time.sleep(attempt * 2)
                          continue
                      return False, last
                  except Exception as e:
                      last = {'status': 'exception', 'body': repr(e), 'attempt': attempt}
                      time.sleep(attempt * 2)
              return False, last

          deleted, errors = [], {}
          passes = 0
          while passes < 20:
              passes += 1
              data = api_json(f'https://api.github.com/repos/{repo}/actions/runs?status=failure&per_page=100&page=1')
              runs = data.get('workflow_runs', [])
              if not runs:
                  break
              progress = 0
              for run in runs:
                  rid = int(run['id'])
                  ok, info = delete_run(rid)
                  if ok:
                      deleted.append(rid)
                      progress += 1
                  else:
                      errors[str(rid)] = info
              if progress == 0:
                  break
              time.sleep(1)

          verify = api_json(f'https://api.github.com/repos/{repo}/actions/runs?status=failure&per_page=100&page=1')
          remaining_runs = verify.get('workflow_runs', [])
          result = {
              'repository': repo,
              'deleted_failed_runs': len(set(deleted)),
              'passes': passes,
              'remaining_failed_runs': int(verify.get('total_count', len(remaining_runs))),
              'remaining_run_ids_first_page': [int(r['id']) for r in remaining_runs],
              'delete_errors': errors,
              'deleted_run_ids': sorted(set(deleted)),
          }
          out = Path('tests/maintenance/cleanup_failed_runs_data_lab_result.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Publish cleanup result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/maintenance/cleanup_failed_runs_data_lab_result.json || true
          if git diff --cached --quiet; then
            echo "No cleanup result change"
          else
            git commit -m "chore(actions): record data-lab failed-run cleanup [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
