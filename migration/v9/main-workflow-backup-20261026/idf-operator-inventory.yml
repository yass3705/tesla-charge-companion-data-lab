name: IDF operator inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/idf_operator_inventory.py'
      - '.github/workflows/idf-operator-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sanitized IDF operator inventory
        run: python scripts/idf_operator_inventory.py --out reports/idf_operator_inventory/latest.json
      - name: Commit inventory when changed
        run: |
          if git diff --quiet -- reports/idf_operator_inventory/latest.json; then
            echo 'No inventory change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/idf_operator_inventory/latest.json
          git commit -m 'audit(idf): refresh operator inventory'
          git push
