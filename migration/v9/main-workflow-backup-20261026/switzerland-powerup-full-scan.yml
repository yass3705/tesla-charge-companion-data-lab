name: Switzerland PowerUp full direct-tariff scan v2

on:
  push:
    paths:
      - '.github/workflows/switzerland-powerup-full-scan.yml'
      - 'scripts/collect_swiss_atlas_cpo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Collect PowerUp CH*POW
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/switzerland docs
          python3 scripts/collect_swiss_atlas_cpo.py \
            --operator 'CH*POW' \
            --name 'PowerUp by AGROLA' \
            --output 'data/switzerland/powerup-direct-tariffs.json' \
            --delay 0.15 \
            --provider-customer-tariffs

      - name: Write finalization status
        shell: python
        run: |
          import json,pathlib
          p=pathlib.Path('data/switzerland/powerup-direct-tariffs.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          s=x['summary']
          doc={
            'schemaVersion':1,
            'country':'CH',
            'cpo':'PowerUp by AGROLA',
            'operatorId':'CH*POW',
            'status':s['status'],
            'stationCount':s['stationCount'],
            'stationsWithDirectTariff':s['stationsWithDirectTariff'],
            'stationsWithoutDirectTariff':s['stationsWithoutDirectTariff'],
            'coveragePct':s['coveragePct'],
            'directTariffDetailCount':s['directTariffDetailCount'],
            'directPaymentTariffDetailCount':s['directPaymentTariffDetailCount'],
            'method':'Swiss eMobility Ladepreisatlas public frontend API; direct-only filter is_roaming=false and EMP=CPO; provider_customer_tariffs=true',
            'policy':'No cross-station tariff extrapolation. Remaining gaps go to targeted second pass.',
            'productionSource':str(p)
          }
          pathlib.Path('docs/switzerland-powerup-atlas-finalization-2026-09-28.json').write_text(
            json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(doc,ensure_ascii=False,indent=2))

      - name: Persist PowerUp result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/switzerland/powerup-direct-tariffs.json docs/switzerland-powerup-atlas-finalization-2026-09-28.json
          git commit -m 'data: scan PowerUp CH*POW direct tariffs'
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            git pull --rebase origin main
            sleep 2
          done
          exit 1
