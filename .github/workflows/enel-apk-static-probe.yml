name: Enel APK static endpoint probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/enel-v9-national
    paths:
      - .github/workflows/enel-apk-static-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Enel On Your Way APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enel-apk data/reports
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.enel.mobile.recharge2'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          req=urllib.request.Request(API,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'})
          with urllib.request.urlopen(req,timeout=45) as r:
              obj=json.load(r)
          app=obj.get('nodes',{}).get('meta',{}).get('data',{}) or obj.get('data',{}) or {}
          file=app.get('file') or {}
          raw=file.get('path') or file.get('path_alt')
          if not isinstance(raw,str) or not raw.strip():
              raise SystemExit('No APK URL in Aptoide metadata')
          url=raw.strip()
          if url.startswith('//'): url='https:'+url
          elif url.startswith('/'): url='https://pool.apk.aptoide.com'+url
          elif '://' not in url: url='https://'+url.lstrip('/')
          meta={
            'package':app.get('package') or 'com.enel.mobile.recharge2',
            'name':app.get('name'),
            'versionName':file.get('vername') or app.get('version_name'),
            'versionCode':file.get('vercode') or app.get('version_code'),
            'md5sum':file.get('md5sum'),
            'downloadHost':urllib.request.urlparse(url).hostname if hasattr(urllib.request,'urlparse') else None
          }
          pathlib.Path('data/reports/enel_apk_fetch_meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          apk_req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/vnd.android.package-archive,*/*'})
          h=hashlib.sha256()
          total=0
          with urllib.request.urlopen(apk_req,timeout=180) as r, open('/tmp/enel-apk/enel.apk','wb') as out:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  out.write(chunk); h.update(chunk); total+=len(chunk)
          meta['bytes']=total
          meta['sha256']=h.hexdigest()
          pathlib.Path('data/reports/enel_apk_fetch_meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          if total < 5_000_000:
              raise SystemExit(f'APK unexpectedly small: {total}')
          PY

      - name: Extract endpoint and tariff/payment strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enel-apk/unpack
          unzip -q /tmp/enel-apk/enel.apk -d /tmp/enel-apk/unpack
          find /tmp/enel-apk/unpack -type f \( -name 'classes*.dex' -o -name '*.so' -o -name '*.json' -o -name '*.js' -o -name '*.xml' -o -name '*.txt' \) -print0 |
            xargs -0 -r strings -a -n 5 > /tmp/enel-apk/all_strings.txt
          python - <<'PY'
          import json,re,pathlib
          meta=json.loads(pathlib.Path('data/reports/enel_apk_fetch_meta.json').read_text())
          lines=pathlib.Path('/tmp/enel-apk/all_strings.txt').read_text(errors='replace').splitlines()
          keys=('guest','directpayment','directpaymenth','payperuse','pay_per_use','pay per use','ad-hoc','adhoc','charging/station','payment','tariff','price','penalty','occupancy','qr','emobility.enelx.com')
          hits=[]; seen=set()
          for line in lines:
              low=line.lower()
              if not any(k in low for k in keys): continue
              s=line.strip()
              if 4 <= len(s) <= 700 and s not in seen:
                  seen.add(s); hits.append(s)
              if len(hits)>=5000: break
          urls=[]; useen=set()
          for line in lines:
              for m in re.findall(r'https?://[^\s"\'<>]{4,350}',line):
                  if ('enel' in m.lower() or 'emobility' in m.lower()) and m not in useen:
                      useen.add(m); urls.append(m)
                  if len(urls)>=1000: break
              if len(urls)>=1000: break
          exact={k:[] for k in ('directPaymenthPrice','directPaymenthTypePrice','directPaymenthPenaltyPrice','PayPerUse','Guest')}
          for line in lines:
              for k in exact:
                  if k.lower() in line.lower() and len(exact[k])<100:
                      exact[k].append(line.strip()[:1000])
          report={
            'schemaVersion':1,'scope':'static_public_apk_string_probe',
            'package':meta.get('package'),'versionName':meta.get('versionName'),'versionCode':meta.get('versionCode'),
            'sha256':meta.get('sha256'),'bytes':meta.get('bytes'),
            'security':{'credentialsUsed':False,'runtimeTrafficCaptured':False,'apkSource':'public Aptoide API'},
            'counts':{'matchingStrings':len(hits),'enelUrls':len(urls)},
            'exactTokenHits':exact,'matchingStrings':hits,'enelUrls':urls,
          }
          pathlib.Path('data/reports/enel_apk_static_probe_20260929.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'versionName':report['versionName'],'versionCode':report['versionCode'],'sha256':report['sha256'],'counts':report['counts'],'exactTokenHits':exact,'sample':hits[:180]},ensure_ascii=False,indent=2))
          PY

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enel-apk-static-probe
          path: |
            data/reports/enel_apk_fetch_meta.json
            data/reports/enel_apk_static_probe_20260929.json
          if-no-files-found: warn
          retention-days: 14
