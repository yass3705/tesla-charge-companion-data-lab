name: UK Pod public map discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-pod-public-map-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Pod public charging map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          seeds=[
            "https://charge.pod-point.com/",
            "https://charge.pod-point.com/address/capital-industrial-llp-ql8l/lois-finn"
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"pages":[],"assets":[],"candidates":[]}
          seen=set()
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(5_000_000).decode("utf-8","replace"),r.geturl(),r.status,dict(r.headers.items())
          blobs=[]
          for seed in seeds:
              try:
                  body,final,st,h=get(seed)
                  out["pages"].append({"url":seed,"status":st,"finalUrl":final,"bytes":len(body),"contentType":h.get("Content-Type")})
                  blobs.append(("html:"+seed,body))
                  for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',body,re.I):
                      u=urllib.parse.urljoin(final,s)
                      if u in seen: continue
                      seen.add(u)
                      try:
                          ab,af,ast,ah=get(u)
                          out["assets"].append({"url":u,"status":ast,"bytes":len(ab),"contentType":ah.get("Content-Type")})
                          blobs.append((u,ab))
                      except Exception as e:
                          out["assets"].append({"url":u,"error":f"{type(e).__name__}: {e}"})
              except Exception as e:
                  out["pages"].append({"url":seed,"error":f"{type(e).__name__}: {e}"})
          pats=["api","map","charger","chargepoint","location","connector","tariff","price","availability","status","graphql"]
          for source,txt in blobs:
              for m in re.finditer(r'https?://[^"\'\s<>()\\]+',txt):
                  u=m.group(0)
                  if any(k in u.lower() for k in pats):
                      out["candidates"].append({"source":source,"value":u[:500]})
              for m in re.finditer(r'["\']([^"\']{2,240})["\']',txt):
                  v=m.group(1)
                  low=v.lower()
                  if any(("/api/" in low, "/graphql" in low, "chargepoint" in low, "chargers" in low, "/locations" in low, "/tariffs" in low, "/pricing" in low)):
                      out["candidates"].append({"source":source,"value":v[:500]})
          # de-dupe
          ded=[]; seen2=set()
          for x in out["candidates"]:
              k=(x["source"],x["value"])
              if k not in seen2:
                  seen2.add(k); ded.append(x)
          out["candidates"]=ded[:1000]
          Path("reports/uk/pod-public-map-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/pod-public-map-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover Pod public map backend [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
