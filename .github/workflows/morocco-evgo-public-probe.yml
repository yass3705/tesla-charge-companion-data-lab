name: Morocco EVGO focused public probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_evgo_public_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-evgo-public-probe.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-focused-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_evgo_public_probe.py
      - name: Run focused EVGO probe
        run: python scripts/morocco_evgo_public_probe.py
      - name: Validate generated report
        run: |
          test -s artifacts/morocco-evgo-public/summary.json
          python scripts/public_safety_check.py artifacts/morocco-evgo-public
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/morocco-evgo-public/summary.json').read_text())
          assert p['package']=='ma.evgo.cp.app'
          assert p['policy']['read_only'] is True
          assert p['policy']['no_login'] is True
          assert p['policy']['raw_package_persisted'] is False
          assert p['policy']['raw_tokens_persisted'] is False
          print('EVGO sanitized report validated')
          PY
      - name: Persist sanitized report
        run: |
          mkdir -p reports/morocco
          cp artifacts/morocco-evgo-public/summary.json reports/morocco/evgo-latest-summary.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo-latest-summary.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update EVGO sanitized backend report [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
