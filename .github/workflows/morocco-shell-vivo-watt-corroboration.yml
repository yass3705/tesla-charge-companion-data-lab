name: Morocco Shell Vivo WATT corroboration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morocco-shell-vivo-watt-corroboration.yml'
      - 'scripts/morocco_shell_vivo_watt_public_page_probe.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/morocco-shell-vivo-watt-corroboration.yml'
      - 'scripts/morocco_shell_vivo_watt_public_page_probe.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public Shell Vivo page as secondary evidence only
        run: python3 scripts/morocco_shell_vivo_watt_public_page_probe.py
      - name: Validate modeling guardrails
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/morocco-shell-vivo-watt/summary.json').read_text())
          assert d.get('http_status')==200
          assert d.get('watt_indexed_station_count')==7
          assert d.get('all_expected_station_names_found') is True
          p=d.get('policy',{})
          assert p.get('read_only') is True
          assert p.get('secondary_aggregation_evidence_only') is True
          assert p.get('do_not_infer_native_cpo') is True
          assert p.get('do_not_infer_tariff') is True
          assert p.get('do_not_infer_live_status') is True
          for s in d.get('stations') or []:
            assert s.get('site_brand')=='Shell'
            assert s.get('cpo_operator')=='unresolved'
            assert s.get('app_source_access_network')=='WATT.ma public map'
            assert s.get('tariff_channel') is None
            assert s.get('status_source') is None
            assert s.get('production_role')=='diagnostic_corroboration_only'
          print(json.dumps({'ok':True,'stations':7,'melloussa':'secondary corroboration only'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: morocco-shell-vivo-watt-corroboration
          path: artifacts/morocco-shell-vivo-watt/summary.json
          if-no-files-found: error
          retention-days: 3
