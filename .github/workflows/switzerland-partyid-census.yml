name: Switzerland party-id census
on:
  push:
    paths:
      - 'scripts/census_swiss_party_ids.py'
      - '.github/workflows/switzerland-partyid-census.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/census_swiss_party_ids.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-partyid-census-2026-09-28.json
          git commit -m 'docs(switzerland): audit canonical EVSE party IDs' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
