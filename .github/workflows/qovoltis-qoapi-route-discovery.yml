name: Qovoltis QoAPI route discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-qoapi-route-discovery.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work probe
          curl -sS -L --max-time 120 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=443' \
            -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          find work/xapk -type f -name '*.apk' -printf '%p %s\n' | tee probe/apks.txt
          BASE=$(find work/xapk -type f -name '*.apk' | sort | head -1)
          cp "$BASE" work/base.apk
          echo "BASE=$BASE" | tee probe/base.txt

      - name: Decode APK and extract Retrofit routes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool >/dev/null
          apktool d -f work/base.apk -o work/decoded >/dev/null 2>&1 || true
          {
            echo '# QoAPI / Retrofit evidence'
            grep -RIna -E 'qoapi\.qovoltis\.com|retrofit2/http/(GET|POST|PUT|DELETE|PATCH)|FetchStations|StationDetails|MapStation|Offers|pricing_default_price|ChargeSocket' work/decoded 2>/dev/null | head -5000 || true
          } > probe/route-evidence.txt
          sed -n '1,1500p' probe/route-evidence.txt

      - name: Extract route-like strings from decoded smali
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          rows=[]
          pats=('station','borne','charge','offer','pricing','price','tariff','socket','map','location','connector')
          for p in Path('work/decoded').rglob('*.smali'):
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              joined='\n'.join(lines)
              if not any(k.lower() in joined.lower() for k in ('qoapi','StationDetails','FetchStations','MapStation','Offer','Pricing','ChargeSocket')):
                  continue
              for i,line in enumerate(lines):
                  if 'const-string' in line:
                      m=re.search(r'"([^"\\]*(?:\\.[^"\\]*)*)"',line)
                      if not m: continue
                      s=m.group(1)
                      low=s.lower()
                      if ('/' in s and any(k in low for k in pats)) or any(k in low for k in ('qoapi','pricing_default_price')):
                          lo=max(0,i-12); hi=min(len(lines),i+13)
                          rows.append(f'FILE {p}\n'+'\n'.join(lines[lo:hi])+'\n---')
          Path('probe/route-context.txt').write_text('\n'.join(rows[:2000]),encoding='utf-8')
          print(Path('probe/route-context.txt').read_text()[:60000])
          PY

      - name: Build conservative GET candidate list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text=(Path('probe/route-evidence.txt').read_text(errors='replace')+'\n'+Path('probe/route-context.txt').read_text(errors='replace'))
          vals=set()
          for m in re.finditer(r'"([^"\n]{1,180})"',text):
              s=m.group(1).replace('\\/','/')
              if '/' not in s: continue
              low=s.lower()
              if any(k in low for k in ('station','borne','charge','offer','pricing','price','tariff','socket','map','location','connector')) and not s.startswith(('http://','https://')):
                  if re.fullmatch(r'[A-Za-z0-9_./{}?=&%:*+-]+',s): vals.add(s)
          out='\n'.join(sorted(vals))
          Path('probe/route-candidates.txt').write_text(out,encoding='utf-8')
          print(out[:30000])
          PY

      - name: Probe only discovered public GET candidates
        shell: bash
        run: |
          set +e
          mkdir -p probe/http
          : > probe/http/status.tsv
          n=0
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            case "$route" in
              *'{'*|*'}'*|*':'*) continue ;;
            esac
            route="${route#/}"
            url="https://qoapi.qovoltis.com/api/${route}"
            n=$((n+1))
            [ "$n" -le 80 ] || break
            code=$(curl -sS -L --max-time 15 -A 'Mozilla/5.0' -H 'Accept: application/json' -o "probe/http/$n.body" -D "probe/http/$n.headers" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c < "probe/http/$n.body" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\t%s\n' "$code" "$bytes" "$route" "$url" >> probe/http/status.tsv
          done < probe/route-candidates.txt
          cat probe/http/status.tsv
          python - <<'PY'
          from pathlib import Path
          import json,re
          out=[]
          status=Path('probe/http/status.tsv')
          if status.exists(): out.append(status.read_text(errors='replace'))
          for p in sorted(Path('probe/http').glob('*.body')):
              t=p.read_text(errors='replace')
              if not t.strip(): continue
              hits=[]
              for m in re.finditer(r'.{0,100}(price|pricing|tariff|kwh|offer|station|connector|borne).{0,240}',t,re.I|re.S):
                  hits.append(re.sub(r'\s+',' ',m.group(0))[:500])
              if hits:
                  out.append(f'\n== {p.name} ==\n'+'\n'.join(hits[:30]))
          Path('probe/http/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print(Path('probe/http/summary.txt').read_text()[:50000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-qoapi-route-discovery
          path: probe
          retention-days: 3
