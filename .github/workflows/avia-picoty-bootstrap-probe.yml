name: AVIA Picoty public guest bootstrap probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_bootstrap_probe.py"
      - ".github/workflows/avia-picoty-bootstrap-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run anonymous guest bootstrap probe
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_bootstrap_probe.py
          python scripts/avia_picoty_bootstrap_probe.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports/avia_picoty_bootstrap_probe.json')
          d=json.loads(p.read_text())
          assert d['schemaVersion']=='1.0.0'
          assert d['anonymousReadOnlyProbes']
          print({k:len(v) if isinstance(v,list) else v for k,v in d['candidates'].items() if k!='snippets'})
          print([(x['url'],x['status']) for x in d['anonymousReadOnlyProbes']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-bootstrap-probe
          path: data/reports/avia_picoty_bootstrap_probe.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_bootstrap_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe AVIA Picoty public guest bootstrap"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
