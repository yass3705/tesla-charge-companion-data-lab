name: Switzerland eCarUp national station-id reconciliation
on:
  push:
    paths:
      - 'scripts/reconcile_swiss_ecarup_stationids.py'
      - '.github/workflows/switzerland-ecarup-national-stationids.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/reconcile_swiss_ecarup_stationids.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-ecarup-national-stationid-reconciliation-2026-09-28.json
          git commit -m 'docs(switzerland): reconcile eCarUp national station IDs' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
