name: Electroverse targeted station evidence

on:
  push:
    branches:
      - fix/electroverse-targeted-stations
    paths:
      - scripts/electroverse_targeted_station_probe.mjs
      - .github/workflows/electroverse-targeted-station-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe current location and tariffs near reported stations
        run: node scripts/electroverse_targeted_station_probe.mjs
      - name: Validate and publish exact source joins
        run: |
          set -euo pipefail
          python3 scripts/integrate_electroverse_targeted_probe.py
          node scripts/electroverse_cache_audit.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/electroverse/irve_location_mapping.json data/electroverse/tariff_cache/manifest.json data/electroverse/tariff_cache/shard-089.json data/electroverse/tariff_cache/shard-093.json reports/electroverse/targeted-station-probe.json
          git commit -m "data(electroverse): verify Lidl Dole and Electra Bois-d'Arcy prices"
          git push origin HEAD:fix/electroverse-targeted-stations
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electroverse-targeted-stations
          path: reports/electroverse/targeted-station-probe.json
          if-no-files-found: warn
