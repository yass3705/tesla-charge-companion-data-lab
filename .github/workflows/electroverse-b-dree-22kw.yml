name: Audit DREE 22kW source group
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_dree_22kw_sources.mjs"
      - ".github/workflows/electroverse-b-dree-22kw.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit_b_dree_22kw_sources.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-dree-22kw-source-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist DREE 22kW source evidence"
            git pull --rebase origin main || true
            git push
          fi
