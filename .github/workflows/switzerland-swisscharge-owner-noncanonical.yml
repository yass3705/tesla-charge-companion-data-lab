name: Switzerland Swisscharge owner noncanonical tariffs
on:
  push:
    paths:
      - 'scripts/collect_swisscharge_owner_noncanonical.py'
      - '.github/workflows/switzerland-swisscharge-owner-noncanonical.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/collect_swisscharge_owner_noncanonical.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/swisscharge-owner-noncanonical-tariffs.json docs/switzerland-swisscharge-owner-noncanonical-2026-09-28.json
          git commit -m 'data(switzerland): collect Swisscharge owner noncanonical tariffs' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
