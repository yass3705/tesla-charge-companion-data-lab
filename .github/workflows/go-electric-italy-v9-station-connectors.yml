name: Go Electric Italy V9 station connectors

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/go_electric_nextcharge_station_connectors_probe.py'
      - 'scripts/go_electric_nextcharge_multi_station_tariff_probe.py'
      - '.github/workflows/go-electric-italy-v9-station-connectors.yml'

permissions:
  contents: read

jobs:
  station-connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile station connector probes
        run: |
          python -m py_compile scripts/go_electric_nextcharge_station_connectors_probe.py
          python -m py_compile scripts/go_electric_nextcharge_multi_station_tariff_probe.py
      - name: Install Chromium dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Read exact public stationConnectors payload
        run: |
          mkdir -p artifacts
          python scripts/go_electric_nextcharge_station_connectors_probe.py
      - name: Validate single exact EVSE tariff mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/go_electric_nextcharge_station_connectors_probe.json').read_text())
          p=r['policy']
          assert p['readOnly'] is True
          assert p['authenticated'] is False
          assert p['remoteMutation'] is False
          assert p['chargingActionsAllowed'] is False
          assert p['paymentActionsAllowed'] is False
          assert p['reservationActionsAllowed'] is False
          assert p['accountActionsAllowed'] is False
          assert p['sessionMutationAllowed'] is False
          assert p['targetPUNOperator'] == 'Go Electric Stations SRLS'
          assert p['stationConnectorsOnlyForTarget'] == 'gir.vat.mx.0245db'
          assert p['reservable'] == 0
          assert p['publicationAllowed'] is False
          good=[x for x in r['connectorResponses'] if x.get('status') == 200 and x.get('json') is True]
          assert good, r
          payload=good[0].get('redactedPayload') or {}
          rows=payload.get('data') or []
          ids={str(x.get('uidConnector')) for x in rows}
          assert {'812715456','812715457','812715458'} <= ids, ids
          print(json.dumps({
            'responses': len(good),
            'connectorCount': len(rows),
            'mappedIds': sorted(ids),
            'stationProvider': (r.get('interaction') or {}).get('station',{}).get('provider'),
          }, indent=2))
          PY
      - name: Validate representative Go Electric tariff sample
        run: python scripts/go_electric_nextcharge_multi_station_tariff_probe.py
      - name: Validate multi-station attribution prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/go_electric_nextcharge_multi_station_tariff_probe.json').read_text())
          p=r['policy']; s=r['summary']
          assert p['readOnly'] is True
          assert p['authenticated'] is False
          assert p['remoteMutation'] is False
          assert p['nationalScrape'] is False
          assert p['representativeStationCount'] == 4
          assert p['officialGoElectricB2CChannel'] == 'https://nextcharge.app'
          assert p['operatorAuthorizedPlatformAttributionCandidate'] is True
          assert p['nationalPublicationAllowed'] is False
          assert p['chargingActionsAllowed'] is False
          assert p['paymentActionsAllowed'] is False
          assert p['reservationActionsAllowed'] is False
          assert s['successfulStations'] >= 3, s
          assert s['exactConnectorIdMatches'] >= 3, s
          assert s['tariffedConnectors'] >= 3, s
          assert s['allSuccessfulStationsHaveExactConnectorMatch'] is True, s
          print(json.dumps({
            'summary': s,
            'stations': [{
              'class': x['powerClass'],
              'station': x['nextChargeStationId'],
              'status': x.get('httpStatus'),
              'exactMatches': x.get('exactConnectorIdMatches'),
              'unmatched': x.get('unmatchedExpectedPunEvseSuffixes'),
              'tariffs': [{
                'uid': c.get('uidConnector'),
                'power': c.get('powerMax'),
                'currency': (c.get('tariff') or {}).get('currency'),
                'prices': (c.get('tariff') or {}).get('prices'),
              } for c in x.get('connectors', [])]
            } for x in r['targets']],
            'nationalPublicationAllowed': p['nationalPublicationAllowed'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-electric-italy-v9-station-connectors
          path: |
            artifacts/go_electric_nextcharge_station_connectors_probe.json
            artifacts/go_electric_nextcharge_multi_station_tariff_probe.json
          if-no-files-found: error
