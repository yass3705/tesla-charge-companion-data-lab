name: Filter Electroverse NUMERIC by IRVE access

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_electroverse_numeric_access_filter.mjs'
      - 'reports/electroverse/numeric-analysis.json'
      - 'reports/france/irve-public-access-validation-ledger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply access filter and Total tariff audit
        run: node scripts/analyze_electroverse_numeric_access_filter.mjs
      - name: Persist reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/numeric-access-filtered.json reports/electroverse/total-tariff-coherence-candidates.json
          git diff --cached --quiet || git commit -m "audit electroverse numeric access and total tariff coherence"
          git fetch origin main
          git rebase origin/main
          git push
