name: Electra eMSP 78 deferred-fee evidence matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_electra_78_afterminutes_evidence_matrix_20261011.cjs
      - .github/workflows/electra-78-afterminutes-evidence-matrix.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 78-offer review matrix
        run: |
          node --check scripts/build_electra_78_afterminutes_evidence_matrix_20261011.cjs
          node scripts/build_electra_78_afterminutes_evidence_matrix_20261011.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: electra-78-deferred-fee-evidence
          path: reports/tariff-scenarios/electra-78-afterminutes-evidence-matrix-2026-10-11.json
      - name: Publish review matrix only
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/electra-78-afterminutes-evidence-matrix-2026-10-11.json /tmp/electra78-matrix.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/electra78-matrix.json reports/tariff-scenarios/electra-78-afterminutes-evidence-matrix-2026-10-11.json
            git add reports/tariff-scenarios/electra-78-afterminutes-evidence-matrix-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(electra): inventory 78 roaming offers pending fee semantics'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
