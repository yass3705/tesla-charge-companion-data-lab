name: UK Osprey public map pricing

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-osprey-public-map-pricing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Collect Osprey public map and official pricing profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json,gzip,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          url="https://apigw.ospreycharging.co.uk/portal/location/map/all"
          req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9 UK-Osprey","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=75) as r: locs=json.loads(r.read().decode("utf-8"))
          if not isinstance(locs,list) or not locs: raise SystemExit("empty Osprey map")
          evses=connectors=0; statuses={}
          for loc in locs:
              if not isinstance(loc,dict): continue
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1; st=str(ev.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  connectors+=sum(1 for c in (ev.get("connectors") or []) if isinstance(c,dict))
          pricing=[
            {"id":"osprey-contactless","priceGbpPerKwh":0.87,"payment":"contactless","schedule":"all_times"},
            {"id":"osprey-app-standard","priceGbpPerKwh":0.82,"payment":"osprey_app","schedule":"weekdays_07:00-20:00"},
            {"id":"osprey-app-weekend","priceGbpPerKwh":0.79,"payment":"osprey_app","schedule":"sat_sun_07:00-20:00"},
            {"id":"osprey-app-overnight","priceGbpPerKwh":0.69,"payment":"osprey_app_or_osprey_go","schedule":"daily_20:00-07:00"}
          ]
          now=datetime.now(timezone.utc).isoformat()
          out={"country":"GB","network":"Osprey Charging","retrievedAt":now,"source":url,
               "pricingSources":["https://www.ospreycharging.co.uk/pricing-and-payment","https://www.ospreycharging.co.uk/osprey-saver-rates"],
               "pricingProfiles":pricing,"locations":locs}
          report={"country":"GB","network":"Osprey Charging","retrievedAt":now,"locations":len(locs),
                  "evses":evses,"connectors":connectors,"evseStatuses":statuses,
                  "pricingProfiles":pricing,"status":"complete"}
          with gzip.open("data/national/uk_osprey_public_map_priced.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/osprey-public-map-priced-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_osprey_public_map_priced.json.gz reports/uk/osprey-public-map-priced-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Osprey public map with official pricing [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
