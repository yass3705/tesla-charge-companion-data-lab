name: Build France Electroverse PD1 technical preserve-generic lab
on:
  push:
    branches:
      - electroverse-pd1-technical-preserve-generic-lab
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-pd1-technical-preserve-generic-lab.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Persisted validation pass with generic-set preservation.
      - name: Build PD1 preserve-generic lab overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Persist lab overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/france-evse
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "lab: publish PD1 preserve-generic Electroverse overlay"
            git pull --rebase origin electroverse-pd1-technical-preserve-generic-lab
            git push
          fi
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare persisted lab against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
