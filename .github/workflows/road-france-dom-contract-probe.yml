name: France Road DOM contract probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/road-france-dom-contract-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install -q playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Inspect DOM before and after connector click
        shell: bash
        run: |
          mkdir -p reports/france/road
          python - <<'PY'
          import asyncio,json,pathlib,re
          from playwright.async_api import async_playwright
          async def main():
            out=[]
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              page=await b.new_page()
              for k in ['0012801','0001063','0014337']:
                await page.goto(f'https://chargestation.road.io/evse/{k}',wait_until='networkidle',timeout=45000)
                elems=[]
                for sel in ['button','a','[role="button"]','input','label','div[class]']:
                  loc=page.locator(sel); n=min(await loc.count(),300)
                  for i in range(n):
                    try:
                      el=loc.nth(i); txt=' '.join((await el.inner_text()).split())[:1000]
                      if not txt: continue
                      low=txt.lower()
                      if any(x in low for x in ['connector','kw','efl','charge now','pricing']):
                        elems.append({'selector':sel,'index':i,'text':txt,'tag':await el.evaluate('(e)=>e.tagName'),'class':await el.get_attribute('class'),'testid':await el.get_attribute('data-testid')})
                    except: pass
                out.append({'id':k,'body':(await page.locator('body').inner_text())[:30000],'elements':elems[:300]})
              await b.close()
            return out
          data=asyncio.run(main())
          pathlib.Path('reports/france/road/dom-contract-probe.json').write_text(json.dumps({'results':data},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(data,ensure_ascii=False)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/road/dom-contract-probe.json
          git commit -m 'France Road: publish connector DOM contract probe' || exit 0
          git pull --rebase origin main && git push
