name: Morocco FastVolt map semantic context

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco/probe_fastvolt_map_semantic_context.py'
      - '.github/workflows/morocco-fastvolt-map-semantic-context.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public map semantic context (GET only)
        run: |
          mkdir -p reports/morocco/fastvolt
          python scripts/morocco/probe_fastvolt_map_semantic_context.py > reports/morocco/fastvolt/latest-map-semantic-context.json
      - name: Validate sanitized report
        run: |
          python - <<'PY'
          import json
          p='reports/morocco/fastvolt/latest-map-semantic-context.json'
          d=json.load(open(p))
          assert d['policy']['read_only'] is True
          assert d['policy']['get_only'] is True
          assert d['policy']['raw_bodies_persisted'] is False
          assert d['policy']['raw_context_persisted'] is False
          print('assets', len(d.get('assets',[])))
          for a in d.get('assets',[]):
              if a.get('semantic_context_count'):
                  print(a['url'], a['semantic_context_count'])
          if d.get('errors'): print('errors', d['errors'])
          PY
      - name: Commit report if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/fastvolt/latest-map-semantic-context.json
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m "data(morocco): update FastVolt map semantic context [run $GITHUB_RUN_ID]"
            git push
          fi
