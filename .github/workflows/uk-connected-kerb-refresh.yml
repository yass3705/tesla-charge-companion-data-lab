name: Connected Kerb UK API refresh

on:
  push:
    branches: [main]
    paths:
      - scripts/uk_connected_kerb_collect.py
      - .github/workflows/uk-connected-kerb-refresh.yml
      - triggers/uk-connected-kerb-refresh.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-connected-kerb-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect and audit operator API
        env:
          CONNECTED_KERB_TOKEN: ${{ secrets.CONNECTED_KERB_TOKEN }}
        run: python scripts/uk_connected_kerb_collect.py
      - name: Publish snapshot and reconcile current UK progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          checkpoint="$(mktemp -d)"
          files=(data/national/uk_connected_kerb_locations.json.gz data/national/uk_connected_kerb_tariffs.json.gz reports/uk/connected-kerb-latest.json)
          for p in "${files[@]}"; do
            mkdir -p "$checkpoint/$(dirname "$p")"
            cp "$p" "$checkpoint/$p"
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in "${files[@]}"; do
              mkdir -p "$(dirname "$p")"
              cp "$checkpoint/$p" "$p"
            done
            python scripts/uk_connected_kerb_collect.py --update-progress
            git add "${files[@]}" docs/uk-cpo-progress-2026-09.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): Connected Kerb authenticated API snapshot [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
