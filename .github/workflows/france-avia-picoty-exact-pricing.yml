name: France AVIA Picoty exact Deftpower pricing

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_avia_picoty_france_guest.py"
      - ".github/workflows/france-avia-picoty-exact-pricing.yml"

permissions:
  contents: write

concurrency:
  group: france-avia-picoty-exact-pricing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      AVIA_APIM_SUBSCRIPTION_KEY: ${{ secrets.AVIA_APIM_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector syntax
        run: python3 -m py_compile scripts/collect_avia_picoty_france_guest.py
      - name: Check AVIA runtime secret
        run: |
          test -n "$AVIA_APIM_SUBSCRIPTION_KEY" || { echo "AVIA_APIM_SUBSCRIPTION_KEY missing"; exit 2; }
      - name: Collect exact Picoty guest prices
        run: python3 scripts/collect_avia_picoty_france_guest.py
      - name: Sanity check sanitized output
        run: |
          python3 - <<'PY'
          import json
          p="data/operator_direct/avia_picoty_deftpower_exact_france.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["country"]=="FR" and d["operatorId"]=="FR*PY2"
          assert d["counts"]["pricedConnectors"]>0
          raw=open(p,encoding="utf-8").read().lower()
          for forbidden in ("subscription-key","authorization","bearer ","ocp-apim"):
              assert forbidden not in raw, forbidden
          print(d["counts"])
          PY
      - name: Commit sanitized exact Picoty prices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/avia_picoty_deftpower_exact_france.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(fr): refresh AVIA Picoty exact Deftpower prices"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
