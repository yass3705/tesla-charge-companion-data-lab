name: Electroverse UK national source chunks
on:
  pull_request:
    paths:
      - .github/workflows/electroverse-uk-national-chunks.yml
  workflow_dispatch:
    inputs:
      first_offset:
        description: First uncollected PK offset in the pinned candidate queue
        required: true
        default: '110'
      chunks:
        description: Sequential 100-PK chunks, maximum 10 per run
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector and pinned queue
        run: |
          node --test tests/test_electroverse_uk_national_details.mjs
          echo '6e55ea8c0c633646f0b8b4e70a7bddc4ad345057eb08074e9f8feb8d305959b5  data/platforms/electroverse/uk-coarse-location-candidates.json.gz' | sha256sum -c -
      - name: Collect sequential bounded chunks
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
          FIRST_OFFSET: ${{ inputs.first_offset }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          [[ "$FIRST_OFFSET" =~ ^[0-9]+$ ]] && [[ "$CHUNKS" =~ ^[0-9]+$ ]]
          (( CHUNKS >= 1 && CHUNKS <= 10 ))
          (( FIRST_OFFSET < 24448 ))
          for (( i=0; i<CHUNKS; i++ )); do
            offset=$(( FIRST_OFFSET + i * 100 ))
            (( offset < 24448 )) || break
            size=$(( 24448 - offset ))
            (( size <= 100 )) || size=100
            node scripts/electroverse_uk_national_details.mjs "$offset" "$size"
            if (( i + 1 < CHUNKS )); then sleep 30; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: electroverse-uk-national-details-chunks
          path: reports/emsp-national/electroverse-uk-details/*.json.gz
          if-no-files-found: warn
          retention-days: 7
