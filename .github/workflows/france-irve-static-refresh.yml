name: France IRVE static refresh and residual audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 3 * * *" # dynamic-only recovery slot after PAN outage
  push:
    branches: [main]
    paths:
      - ".github/workflows/france-irve-static-refresh.yml"
      - "scripts/france/build_france_irve_static_v9.py"
      - "scripts/france/build_france_irve_dynamic_status_v9.py"
      - "scripts/france/audit_france_irve_residuals.py"
      - "data/platforms/electra/france/residuals.json.gz"

permissions:
  contents: write

concurrency:
  group: france-irve-static-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current PAN static IRVE source
        if: github.event.schedule != '17 3 * * *'
        id: static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/france-irve" data/national/france-irve-static-v9
          URL='https://proxy.transport.data.gouv.fr/resource/consolidation-transport-irve-statique'
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 \
            -D "$RUNNER_TEMP/france-irve/static.headers" \
            -o "$RUNNER_TEMP/france-irve/static.csv" "$URL"
          test -s "$RUNNER_TEMP/france-irve/static.csv"
          SHA="$(sha256sum "$RUNNER_TEMP/france-irve/static.csv" | awk '{print $1}')"
          BYTES="$(wc -c < "$RUNNER_TEMP/france-irve/static.csv" | tr -d ' ')"
          LAST_MODIFIED="$(awk 'BEGIN{IGNORECASE=1} /^last-modified:/ {sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); value=$0} END{print value}' "$RUNNER_TEMP/france-irve/static.headers")"
          RETRIEVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$SHA" > "$RUNNER_TEMP/france-irve/static.sha256"
          printf '%s\n' "$BYTES" > "$RUNNER_TEMP/france-irve/static.bytes"
          printf '%s\n' "$LAST_MODIFIED" > "$RUNNER_TEMP/france-irve/static.last-modified"
          printf '%s\n' "$RETRIEVED_AT" > "$RUNNER_TEMP/france-irve/static.retrieved-at"
          OLD_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/national/france-irve-static-v9/manifest.json')
          try: print(json.loads(p.read_text()).get('sourceSha256',''))
          except Exception: print('')
          PY
          )"
          if [ "$SHA" = "$OLD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "National static source unchanged: $SHA ($BYTES bytes)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "National static source changed: $OLD_SHA -> $SHA ($BYTES bytes)"
          fi
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Rebuild normalized static runtime base
        if: steps.static.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/france/build_france_irve_static_v9.py \
            --input "$RUNNER_TEMP/france-irve/static.csv" \
            --out-dir data/national/france-irve-static-v9 \
            --source-sha256 "$(cat "$RUNNER_TEMP/france-irve/static.sha256")" \
            --source-bytes "$(cat "$RUNNER_TEMP/france-irve/static.bytes")" \
            --source-last-modified "$(cat "$RUNNER_TEMP/france-irve/static.last-modified")" \
            --source-retrieved-at "$(cat "$RUNNER_TEMP/france-irve/static.retrieved-at")"

      - name: Download latest dynamic snapshot for exact-ID verification
        id: dynamic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/france-irve"
          # The national dynamic feed is a separate, intermittently unavailable beta source.
          # Its HTTP 503 must not block a validated static refresh or overwrite last good data.
          HTTP_STATUS_FILE="$RUNNER_TEMP/france-irve/dynamic.http-status"
          if ! curl -fsSL --retry 6 --retry-delay 15 --retry-max-time 180 --connect-timeout 30 --max-time 300 \
            -w '%{http_code}' -o "$RUNNER_TEMP/france-irve/dynamic.csv" \
            'https://proxy.transport.data.gouv.fr/resource/consolidation-nationale-irve-dynamique' > "$HTTP_STATUS_FILE"; then
            HTTP_STATUS="$(cat "$HTTP_STATUS_FILE")"
            rm -f "$RUNNER_TEMP/france-irve/dynamic.csv"
            # Transient rate-limit/server/network outages may use the last validated snapshot.
            # Permanent client/URL errors (400/401/403/404) must still fail visibly.
            case "$HTTP_STATUS" in
              000|429|5??) ;;
              *) echo "::error title=IRVE dynamic configuration failure::HTTP $HTTP_STATUS is not a transient outage."; exit 1 ;;
            esac
            test -s data/national/france-irve-dynamic-status-v9.json.gz
            test -s reports/france/irve/irve-residual-crosswalk-latest.json
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PAN IRVE dynamic unavailable::HTTP $HTTP_STATUS; previous dynamic snapshot and residual audit retained; static refresh remains independent."
            echo "### ⚠️ IRVE dynamique indisponible" >> "$GITHUB_STEP_SUMMARY"
            echo "Le téléchargement PAN a échoué. Snapshot dynamique et audit antérieurs conservés **sans les présenter comme actualisés**. Nouvelle tentative au prochain créneau." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s "$RUNNER_TEMP/france-irve/dynamic.csv"
          echo "retrieved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python scripts/france/build_france_irve_dynamic_status_v9.py \
            --static-all data/national/france-irve-static-v9/all.json.gz \
            --dynamic-csv "$RUNNER_TEMP/france-irve/dynamic.csv" \
            --out data/national/france-irve-dynamic-status-v9.json.gz
          python scripts/france/audit_france_irve_residuals.py \
            --static-all data/national/france-irve-static-v9/all.json.gz \
            --static-manifest data/national/france-irve-static-v9/manifest.json \
            --dynamic-csv "$RUNNER_TEMP/france-irve/dynamic.csv" \
            --residuals data/platforms/electra/france/residuals.json.gz \
            --out reports/france/irve/irve-residual-crosswalk-latest.json
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed Data Lab base and CPO manifest
        if: steps.static.outputs.changed == 'true' || steps.dynamic.outputs.available == 'true'
        shell: bash
        env:
          STATIC_CHANGED: ${{ steps.static.outputs.changed }}
          DYNAMIC_AVAILABLE: ${{ steps.dynamic.outputs.available }}
          DYNAMIC_RETRIEVED_AT: ${{ steps.dynamic.outputs.retrieved_at }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Protect the newly built static tiles before rebasing on a busy main.
          checkpoint="$(mktemp -d)"
          if [[ "$STATIC_CHANGED" == 'true' ]]; then
            cp -a data/national/france-irve-static-v9 "$checkpoint/static"
          fi

          # Recompute derived outputs against the newest main on EVERY attempt:
          # never rebase binary gzip or an old residual audit across concurrent writes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [[ "$STATIC_CHANGED" == 'true' ]]; then
              rm -rf data/national/france-irve-static-v9
              cp -a "$checkpoint/static" data/national/france-irve-static-v9
              git add -A data/national/france-irve-static-v9
            fi

            if [[ "$DYNAMIC_AVAILABLE" == 'true' ]]; then
              python scripts/france/build_france_irve_dynamic_status_v9.py \
                --static-all data/national/france-irve-static-v9/all.json.gz \
                --dynamic-csv "$RUNNER_TEMP/france-irve/dynamic.csv" \
                --retrieved-at "$DYNAMIC_RETRIEVED_AT" \
                --out data/national/france-irve-dynamic-status-v9.json.gz
              python scripts/france/audit_france_irve_residuals.py \
                --static-all data/national/france-irve-static-v9/all.json.gz \
                --static-manifest data/national/france-irve-static-v9/manifest.json \
                --dynamic-csv "$RUNNER_TEMP/france-irve/dynamic.csv" \
                --residuals data/platforms/electra/france/residuals.json.gz \
                --out reports/france/irve/irve-residual-crosswalk-latest.json
              git add data/national/france-irve-dynamic-status-v9.json.gz reports/france/irve/irve-residual-crosswalk-latest.json
            fi

            if git diff --cached --quiet; then
              echo 'No base or manifest changes to persist.'
              exit 0
            fi
            git commit -m "data(france): refresh national IRVE base and residual audit [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo "IRVE publication succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning title=IRVE Git main advanced::Push race on attempt $attempt; refetching and recomputing exact-ID audit."
            sleep "$((attempt * 2))"
          done
          echo "::error title=IRVE persistence failed::Main advanced during all 5 optimistic retries."
          exit 1
