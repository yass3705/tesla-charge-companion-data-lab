name: France Vianeo exact tariff endpoint probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vianeo-exact-tariff-endpoint-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract Vianeo PAN EVSE IDs and probe read-only tariff flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/vianeo /tmp/vianeo
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/refactor/unified-data-engine-v9/data/v9/france-static/all.json.gz' -o /tmp/vianeo/all.json.gz
          python - <<'PY'
          import gzip,json,re,pathlib,requests,urllib.parse
          rows=json.loads(gzip.open('/tmp/vianeo/all.json.gz','rt',encoding='utf-8').read())
          # V9 compact schema [stationId,name,address,lat,lon,operator,pdcCount,hours,powerGroups,date,sourceName]
          matches=[]; evse_ids=[]
          def collect_strings(x):
            if isinstance(x,str):
              v=x.strip()
              if re.match(r'(?i)^FR[A-Z0-9]{5,}$',v) and v not in evse_ids: evse_ids.append(v)
            elif isinstance(x,list):
              for v in x: collect_strings(v)
            elif isinstance(x,dict):
              for v in x.values(): collect_strings(v)
          for r in rows:
            if not isinstance(r,list) or len(r)<6: continue
            op=str(r[5] or '')
            name=str(r[1] or '') if len(r)>1 else ''
            if 'vianeo' in op.lower() or 'vianeo' in name.lower():
              matches.append({'stationId':r[0] if r else None,'name':name,'operator':op,'lat':r[3] if len(r)>4 else None,'lon':r[4] if len(r)>4 else None})
              # compact power groups are index 8; group last item is list of EVSE/PDC roaming IDs
              if len(r)>8: collect_strings(r[8])
          def variants(v):
            out=[v]
            # Common OCPI canonical rendering: FR + 3-char party + E... => FR*XXX*E...
            if len(v)>5 and v[:2].upper()=='FR':
              party=v[2:5]; rest=v[5:]
              out += [f'FR*{party}*{rest}', f'FR*{party}{rest}', f'FR{party}*{rest}']
            return list(dict.fromkeys(out))
          base='https://backend-api.engie-vianeo.com'
          def safe_body(r):
            txt=r.text[:12000]
            txt=re.sub(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}','[JWT_REDACTED]',txt)
            txt=re.sub(r'(?i)(token|secret|key)\s*[":=]+\s*["\']?[A-Za-z0-9._~-]{16,}',r'\1:[REDACTED]',txt)
            return txt
          attempts=[]
          # Test diverse IDs across network, not only first station.
          sample=[]
          if evse_ids:
            stride=max(1,len(evse_ids)//24)
            sample=list(dict.fromkeys(evse_ids[:8]+evse_ids[::stride][:24]))[:32]
          for raw in sample:
            for evse in variants(raw):
              sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://charge.engie-vianeo.com','Referer':'https://charge.engie-vianeo.com/'})
              q=urllib.parse.quote(evse,safe='')
              local=[]
              for step,method,path in [('detail','GET',f'/locations/evses/detail/{q}'),('tariff_direct','GET',f'/ca/tariff/{q}')]:
                try:
                  rr=sess.request(method,base+path,timeout=18)
                  rec={'raw':raw,'candidate':evse,'step':step,'status':rr.status_code,'body':safe_body(rr)}
                  attempts.append(rec); local.append(rec)
                except Exception as e: attempts.append({'raw':raw,'candidate':evse,'step':step,'error':str(e)})
              # Anonymous select is part of the public web flow and does not start charging/payment.
              try:
                rr=sess.put(f'{base}/ca/select-evse/{q}',timeout=18)
                attempts.append({'raw':raw,'candidate':evse,'step':'select','status':rr.status_code,'body':safe_body(rr)})
                rr2=sess.get(f'{base}/ca/tariff/{q}',timeout=18)
                attempts.append({'raw':raw,'candidate':evse,'step':'tariff_after_select','status':rr2.status_code,'body':safe_body(rr2)})
              except Exception as e: attempts.append({'raw':raw,'candidate':evse,'step':'select_flow','error':str(e)})
          good=[a for a in attempts if a.get('status') in (200,201,204)]
          price=[]
          for a in good:
            b=a.get('body','')
            if re.search(r'(?i)(price|tariff|tarif|kwh|eur|€|amount|cost)',b): price.append(a)
          out={'matchedStations':len(matches),'evseIdCount':len(evse_ids),'stationSamples':matches[:20],'evseIdSamples':evse_ids[:80],'testedRawIds':sample,'attempts':attempts,'successful':good,'priceLikeSuccesses':price}
          pathlib.Path('reports/france/vianeo/exact-tariff-endpoint-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'matchedStations':len(matches),'evseIdCount':len(evse_ids),'evseIdSamples':evse_ids[:30],'testedRawIds':sample,'successCount':len(good),'successes':good[:30],'priceLikeSuccesses':price[:20]},ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/vianeo/exact-tariff-endpoint-probe.json
          git commit -m 'France Vianeo: publish compact PAN EVSE tariff probe' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
