name: Morocco Kilowatt public tariff schema
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/morocco/kilowatt_public_tariff_schema_probe.py'
      - '.github/workflows/morocco-kilowatt-public-tariff-schema.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run sanitized read-only probe
        run: python3 scripts/morocco/kilowatt_public_tariff_schema_probe.py
      - name: Commit sanitized report
        run: |
          if git diff --quiet -- reports/morocco/kilowatt/latest-public-tariff-schema.json; then
            echo 'No report change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/kilowatt/latest-public-tariff-schema.json
          git commit -m 'data(morocco): update Kilowatt public tariff schema'
          git push
