name: Build France Electroverse trimmed-suffix lab
on:
  push:
    branches:
      - electroverse-trimmed-suffix-lab
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-trimmed-suffix-lab.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build lab overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare lab against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
      - name: Persist lab overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/france-evse
          git commit -m "lab: publish trimmed-suffix Electroverse overlay" || exit 0
          git push
