name: UK ScottishPower Fuuse diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-scottishpower-fuuse-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe Fuuse endpoints
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          base="https://api.fuuse.io/opendata/e11a667d-c56a-468f-b8d3-a50b41628292"
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"ScottishPower Recharge","results":[]}
          for path in ("location","tariff"):
            u=f"{base}/{path}"; row={"kind":path,"url":u}
            try:
              req=urllib.request.Request(u,headers={"User-Agent":"TeslaChargeCompanion/9 ScottishPower-diagnostic","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as r:
                raw=r.read(5000000); row["status"]=r.status; row["bytes"]=len(raw); row["contentType"]=r.headers.get("Content-Type")
                try:
                  p=json.loads(raw.decode("utf-8"))
                  row["jsonType"]=type(p).__name__
                  if isinstance(p,list):
                    row["records"]=len(p)
                    if p and isinstance(p[0],dict): row["firstKeys"]=list(p[0])[:60]
                  elif isinstance(p,dict):
                    row["topLevelKeys"]=list(p)[:60]
                    for k,v in p.items():
                      if isinstance(v,list):
                        row.setdefault("arrays",{})[k]=len(v)
                        if v and isinstance(v[0],dict): row.setdefault("firstKeysByArray",{})[k]=list(v[0])[:60]
                except Exception as e:
                  row["parseError"]=f"{type(e).__name__}: {e}"; row["bodyPrefix"]=raw[:500].decode("utf-8","replace")
            except urllib.error.HTTPError as e:
              row["status"]=e.code; row["error"]=str(e)
              try: row["bodyPrefix"]=e.read(500).decode("utf-8","replace")
              except Exception: pass
            except Exception as e:
              row["error"]=f"{type(e).__name__}: {e}"
            out["results"].append(row)
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/scottishpower-fuuse-diagnostic-latest.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/scottishpower-fuuse-diagnostic-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe ScottishPower Fuuse endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
