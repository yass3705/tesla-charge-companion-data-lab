name: Spain REVE V9 key fingerprint diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/spain-reve-v9-main-bootstrap.yml

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY }}
    steps:
      - name: Print SHA256 fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, hashlib
          raw=os.environ.get('REVE_API_KEY','').strip()
          print('secret_present=', bool(raw))
          print('secret_length=', len(raw))
          print('secret_sha256=', hashlib.sha256(raw.encode()).hexdigest() if raw else '')
          if not raw:
              raise SystemExit(1)
          PY
