name: Switzerland Partino EVC-Net frontend probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-partino-evcnet-frontend-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect public Partino EVC-Net frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          base="https://partino-chf.evc-net.com"
          def fetch(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TCC-V9-Partino","Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.geturl(),r.headers.get("Content-Type"),r.read()

          final,ctype,raw=fetch(base+"/Locations")
          html=raw.decode("utf-8","replace")
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          css=re.findall(r'<link[^>]+href=["\']([^"\']+)["\']',html,re.I)
          assets=[]
          for src in scripts:
            url=urllib.parse.urljoin(final,src)
            try:
              fu,ct,b=fetch(url); txt=b.decode("utf-8","replace")
              urls=sorted(set(re.findall(r'https?://[^"\'\\\s<>]+',txt)))
              api_paths=sorted(set(re.findall(r'["\']([^"\']*(?:api|location|tariff|price|chargepoint|charger)[^"\']*)["\']',txt,re.I)))
              assets.append({
                "url":fu,"contentType":ct,"bytes":len(b),
                "urls":[u[:500] for u in urls[:100]],
                "apiLikeStrings":[s[:500] for s in api_paths[:300]]
              })
            except Exception as e:
              assets.append({"url":url,"error":type(e).__name__+": "+str(e)})
          out={
            "schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),
            "page":{"finalUrl":final,"contentType":ctype,"scripts":scripts,"styles":css},
            "assets":assets
          }
          Path("docs/switzerland-partino-evcnet-frontend-probe-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-partino-evcnet-frontend-probe-2026-09-29.json
          git commit -m "research(ch): inspect Partino EVC-Net frontend" || exit 0
          git pull --rebase origin main
          git push origin main
