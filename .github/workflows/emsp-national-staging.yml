name: eMSP national inventory staging
on:
  pull_request:
    paths:
      - .github/workflows/emsp-national-staging.yml
      - scripts/electra_nl_emsp_national_stage.py
      - scripts/electroverse_uk_national_seeds.py
      - scripts/electroverse_uk_national_tiles.mjs
      - scripts/electroverse_uk_cpo_pilot.mjs
      - tests/test_electra_nl_national_stage.py
      - tests/test_electroverse_uk_national_seeds.py
  workflow_dispatch:
    inputs:
      batch_index:
        description: Zero-based UK tile batch index
        required: true
        default: '0'
      batch_size:
        description: Tiles per run, maximum 60
        required: true
        default: '40'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local guards
        run: |
          python3 -m unittest tests/test_electra_nl_national_stage.py tests/test_electroverse_uk_national_seeds.py tests/test_emsp_allowed_connectors.py
          node --check scripts/electroverse_uk_national_tiles.mjs
          node --test tests/test_electroverse_uk_gps_group.mjs
      - name: Run bounded UK Electroverse tile inventory
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
        run: node scripts/electroverse_uk_national_tiles.mjs "${{ inputs.batch_index }}" "${{ inputs.batch_size }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: electroverse-uk-national-tiles
          path: reports/emsp-national/electroverse-uk-tiles/*.json.gz
          if-no-files-found: warn
          retention-days: 7
