name: Bump public GraphQL probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_graphql_public_probe.py"
      - "scripts/bump_tariff_schema_probe.py"
      - "scripts/bump_tariff_detail_probe.py"
      - "scripts/bump_evse_sample_probe.py"
      - "scripts/bump_location_search_runtime_probe.py"
      - "scripts/bump_location_search_extract_probe.py"
      - "scripts/bump_location_search_legacy_extract_probe.py"
      - "scripts/bump_direct_inventory.py"
      - ".github/workflows/bump-graphql-public-probe.yml"

permissions:
  contents: write

concurrency:
  group: bump-public-graphql-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public GraphQL endpoint/schema
        run: python scripts/bump_graphql_public_probe.py
      - name: Probe public tariff description schema
        run: python scripts/bump_tariff_schema_probe.py
      - name: Probe one public EVSE from Bump official IRVE inventory
        run: python scripts/bump_evse_sample_probe.py
      - name: Probe public GraphQL location map search
        run: python scripts/bump_location_search_runtime_probe.py
      - name: Extract safe public map identifiers
        run: python scripts/bump_location_search_extract_probe.py
      - name: Compare public location search v1/v2
        run: python scripts/bump_location_search_legacy_extract_probe.py
      - name: Resolve public tariff detail for verified EVSE
        run: python scripts/bump_tariff_detail_probe.py
      - name: Validate sanitized read-only outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/graphql_public_probe_latest.json').read_text())
          assert p['method']['unauthenticated'] and p['method']['readOnlyGraphqlQueriesOnly']
          t=json.loads(Path('reports/bump/tariff_schema_latest.json').read_text())
          assert t['method']['unauthenticated'] and t['method']['introspectionOnly']
          q=json.loads(Path('reports/bump/evse_sample_probe_latest.json').read_text())
          assert q['method']['unauthenticated'] and q['method']['publicReadOnlyQuery'] and q['method']['sampleFromOfficialBumpIrve']
          s=json.loads(Path('reports/bump/location_search_runtime_latest.json').read_text())
          assert s['method']['unauthenticated'] and s['method']['publicReadOnlySearchOnly'] and s['method']['sampleFromOfficialBumpIrve']
          x=json.loads(Path('reports/bump/location_search_extract_latest.json').read_text())
          assert x['method']['unauthenticated'] and x['method']['publicReadOnlySearchOnly'] and x['method']['schemaDerivedSafeSelection']
          l=json.loads(Path('reports/bump/location_search_legacy_extract_latest.json').read_text())
          assert l['method']['unauthenticated'] and l['method']['publicReadOnlySearchOnly'] and l['method']['schemaDerivedSafeSelection']
          d=json.loads(Path('reports/bump/tariff_detail_latest.json').read_text())
          assert d['method']['unauthenticated'] and d['method']['publicReadOnlyTariffQueryOnly'] and d['method']['schemaDerivedPricingFieldsOnly']
          for m in (p['method'],t['method'],q['method'],s['method'],x['method'],l['method'],d['method']):
              assert not m.get('mutationsSent',False) and not m.get('credentialsUsed',False) and not m.get('personalDataQueried',False)
          print({'tariffTypes':list(t['types'])})
          print({'tariffResolved':d['tariffResolved'],'attempts':[{'label':a['label'],'status':a['status'],'errors':a['errors']} for a in d['attempts']]})
          PY
      - name: Publish sanitized GraphQL, EVSE and tariff reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/graphql_public_probe_latest.json reports/bump/graphql_public_probe_latest.md reports/bump/tariff_schema_latest.json reports/bump/tariff_schema_latest.md reports/bump/evse_sample_probe_latest.json reports/bump/evse_sample_probe_latest.md reports/bump/location_search_runtime_latest.json reports/bump/location_search_extract_latest.json reports/bump/location_search_legacy_extract_latest.json reports/bump/tariff_detail_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(bump): publish GraphQL public probe [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
