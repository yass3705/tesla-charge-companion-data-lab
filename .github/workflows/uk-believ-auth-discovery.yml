name: UK Believ authenticated API batch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-believ-auth-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BELIEV_CLIENT_ID: ${{ secrets.BELIEV_CLIENT_ID }}
      BELIEV_CLIENT_SECRET: ${{ secrets.BELIEV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Authenticate and probe mapped Believ labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse,urllib.error,hashlib
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ["BELIEV_CLIENT_ID"]
          secret=os.environ["BELIEV_CLIENT_SECRET"]
          base="https://api.believ.com"

          labels=[
            "A2877","A0841","A2514","A0028","A0506","A3262","A0576","A0577","A1446","A1461","A2587","A0776","A3499","A1462","A2663","A3304","A0777","A0916","A2535","A2884","A1223","A1224","A3100","A3138","A3473"
          ]

          form=urllib.parse.urlencode({
              "grant_type":"client_credentials",
              "client_id":cid,
              "client_secret":secret,
          }).encode()
          token_req=urllib.request.Request(
              base+"/oauth/token",data=form,method="POST",
              headers={"Accept":"application/json","Content-Type":"application/x-www-form-urlencoded","User-Agent":"TeslaChargeCompanion/9"}
          )
          with urllib.request.urlopen(token_req,timeout=30) as r:
              tj=json.loads(r.read().decode("utf-8"))
          token=tj["access_token"]

          out={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "source":"Believ authenticated EVSE API",
              "tokenEndpoint":base+"/oauth/token",
              "endpointTemplate":base+"/1.0/evses/{label}",
              "ratePolicy":{"sleepSeconds":1.1,"batchSize":len(labels)},
              "tokenFingerprint":hashlib.sha256(token.encode()).hexdigest()[:16],
              "results":[]
          }

          for i,label in enumerate(labels):
              req=urllib.request.Request(
                  f"{base}/1.0/evses/{label}",
                  headers={"Accept":"application/json","Authorization":"Bearer "+token,"User-Agent":"TeslaChargeCompanion/9"}
              )
              rec={"label":label}
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=json.loads(r.read().decode("utf-8"))
                      rec.update({
                          "httpStatus":r.status,
                          "id":data.get("id"),
                          "status":data.get("status"),
                          "location":data.get("location"),
                          "connectors":data.get("connectors"),
                          "tariffs":data.get("tariffs")
                      })
              except urllib.error.HTTPError as e:
                  rec["httpStatus"]=e.code
                  try:
                      j=json.loads(e.read().decode("utf-8"))
                      rec["message"]=j.get("message") or j.get("error")
                  except Exception:
                      rec["message"]="non_json_error"
              out["results"].append(rec)
              print(json.dumps({"label":label,"httpStatus":rec.get("httpStatus"),"location":(rec.get("location") or {}).get("name"),"tariffs":rec.get("tariffs")},ensure_ascii=False))
              if i < len(labels)-1:
                  time.sleep(1.1)

          ok=[r for r in out["results"] if r.get("httpStatus")==200]
          out["summary"]={
              "requested":len(labels),
              "success200":len(ok),
              "notFound404":sum(1 for r in out["results"] if r.get("httpStatus")==404),
              "other":sum(1 for r in out["results"] if r.get("httpStatus") not in (200,404)),
              "distinctTariffIds":sorted({t.get("id") for r in ok for t in (r.get("tariffs") or []) if t.get("id") is not None}),
              "distinctPrices":sorted({pc.get("price") for r in ok for t in (r.get("tariffs") or []) for e in (t.get("elements") or []) for pc in (e.get("price_components") or []) if pc.get("price") is not None})
          }
          Path("reports/uk/believ-auth-batch-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out["summary"],ensure_ascii=False,indent=2))
          PY

      - name: Publish sanitized batch result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/believ-auth-batch-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): validate Believ authenticated label batch [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
