name: Enel APK DEX callsite probe

on:
  push:
    branches:
      - research/enel-v9-national
    paths:
      - scripts/enel_apk_callsite_probe.py
      - .github/workflows/enel-apk-callsite-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: pip install --disable-pip-version-check androguard
      - name: Fetch current Enel APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enel-apk data/reports
          python - <<'PY'
          import json,urllib.request,pathlib
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.enel.mobile.recharge2'
          UA='Mozilla/5.0'
          with urllib.request.urlopen(urllib.request.Request(API,headers={'User-Agent':UA}),timeout=45) as r:
              obj=json.load(r)
          app=obj.get('nodes',{}).get('meta',{}).get('data',{}) or obj.get('data',{}) or {}
          file=app.get('file') or {}
          url=file.get('path') or file.get('path_alt')
          if url.startswith('//'): url='https:'+url
          elif url.startswith('/'): url='https://pool.apk.aptoide.com'+url
          elif '://' not in url: url='https://'+url.lstrip('/')
          req=urllib.request.Request(url,headers={'User-Agent':UA})
          with urllib.request.urlopen(req,timeout=180) as r, open('/tmp/enel-apk/enel.apk','wb') as out:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  out.write(b)
          print(pathlib.Path('/tmp/enel-apk/enel.apk').stat().st_size)
          PY
      - name: Analyze DEX callsites
        run: python scripts/enel_apk_callsite_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enel-apk-callsite-probe
          path: data/reports/enel_apk_callsite_probe_20260929.json
          retention-days: 14
