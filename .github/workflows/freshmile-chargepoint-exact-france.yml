name: France Freshmile exact tariffs via ChargePoint public map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/freshmile-chargepoint-exact-france.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build exact fail-closed Freshmile overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/france/freshmile
          python - <<'PY'
          import csv,io,json,re,requests,pathlib,urllib.parse,concurrent.futures
          from datetime import datetime,timezone
          PAN_URL='https://static.data.gouv.fr/resources/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques-donnees-statiques/20260902-033409/consolidation-etalab-schema-irve-statique-v-2.3.1-20260902.csv'
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/1.0','Accept':'application/json,text/plain,*/*'})
          text=S.get(PAN_URL,timeout=90).content.decode('utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO(text)))
          def val(r,*names):
            for n in names:
              if n in r and r[n] not in (None,''): return str(r[n]).strip()
            return ''
          target=[]
          for r in rows:
            hay=' | '.join([val(r,'nom_amenageur'),val(r,'nom_operateur'),val(r,'nom_enseigne'),val(r,'contact_amenageur')]).lower()
            pid=val(r,'id_pdc_itinerance').upper(); sid=val(r,'id_station_itinerance').upper()
            if 'freshmile' in hay or pid.startswith('FRFR1') or sid.startswith('FRFR1'):
              target.append(r)
          def coords(r):
            s=val(r,'coordonneesXY','coordonnees_xy'); nums=re.findall(r'-?\d+(?:\.\d+)?',s)
            if len(nums)>=2:
              a,b=map(float,nums[:2])
              if abs(a)<=10 and 40<=b<=52:return b,a
              if abs(b)<=10 and 40<=a<=52:return a,b
            return None
          def norm(s):return re.sub(r'[^A-Z0-9]','',str(s).upper())
          by_coord={}
          for r in target:
            c=coords(r)
            if c:by_coord.setdefault((round(c[0],6),round(c[1],6)),[]).append(r)
          MAP='https://mc.chargepoint.com/map-prod/v2?'; INFO='https://mc.chargepoint.com/map-prod/v3/station/info?deviceId='
          filt={k:False for k in ['price_free','status_available','dc_fast_charging','disabled_parking','van_accessible','network_chargepoint','network_mercedes','connector_l1','connector_l2','connector_l2_nema_1450','connector_l2_tesla','connector_chademo','connector_combo','connector_tesla']}
          def near(c):
            lat,lon=c; d=.0025
            q={'station_list':{'screen_width':800,'screen_height':800,'ne_lat':lat+d,'ne_lon':lon+d,'sw_lat':lat-d,'sw_lon':lon-d,'page_size':60,'page_offset':'','sort_by':'distance','reference_lat':lat,'reference_lon':lon,'include_map_bound':True,'filter':filt,'bound_output':True}}
            u=MAP+urllib.parse.quote(json.dumps(q,separators=(',',':')),safe='{}:,"')
            try:
              r=S.post(u,timeout=20); j=r.json() if r.ok else {}; return c,[x.get('device_id') for x in ((j.get('station_list') or {}).get('stations') or []) if x.get('device_id')]
            except:return c,[]
          coord_devices={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=36) as ex:
            for c,ds in ex.map(near,by_coord):coord_devices[c]=ds
          alldev=sorted({d for ds in coord_devices.values() for d in ds})
          def getinfo(d):
            try:
              r=S.get(INFO+str(d),timeout=20); return d,(r.json() if r.ok else None)
            except:return d,None
          infos={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
            for d,j in ex.map(getinfo,alldev):infos[d]=j
          idx={}
          for d,j in infos.items():
            if not j:continue
            # Accept only records whose public ChargePoint detail explicitly attributes pricing/network to Freshmile.
            attrib=(' '.join([str(j.get('hostName') or ''),str((j.get('network') or {}).get('displayName') or ''),str((j.get('network') or {}).get('name') or '')])).lower()
            if 'freshmile' not in attrib:continue
            for p in ((j.get('portsInfo') or {}).get('ports') or []):
              eid=p.get('evseId')
              if eid:idx[norm(eid)]=(eid,d,j,p)
          exact=[]; gaps=[]
          for r in target:
            pid=val(r,'id_pdc_itinerance'); x=idx.get(norm(pid))
            if x and x[2].get('stationPrice') is not None:
              eid,d,j,p=x
              exact.append({'id_pdc_itinerance':pid,'id_station_itinerance':val(r,'id_station_itinerance'),'deviceId':d,'evseId':eid,'stationName':(j.get('name') or [None])[0],'hostName':j.get('hostName'),'network':j.get('network'),'power':p.get('powerRange'),'stationPrice':j.get('stationPrice'),'sourceUrl':INFO+str(d)})
            else:gaps.append({'id_pdc_itinerance':pid,'reason':'no_exact_freshmile_attributed_chargepoint_evse_price'})
          out={'schemaVersion':'1.0.0','dataset':'freshmile-chargepoint-public-exact-france','generatedAt':datetime.now(timezone.utc).isoformat(),'operator':'Freshmile','country':'FR','classification':{'sourceType':'public_third_party_station_detail','source':'ChargePoint public driver map','exactEvseMatchRequired':True,'freshmileAttributionRequired':True,'failClosed':True,'treated':bool(exact),'note':'A tariff is accepted only when ChargePoint public station info contains the exact PAN EVSE ID, a stationPrice object, and explicitly attributes the station/network to Freshmile. Unmatched rows receive no Freshmile overlay.'},'coverage':{'panRows':len(target),'uniquePanCoordinates':len(by_coord),'candidateDeviceIds':len(alldev),'freshmileEvseIdsVisible':len(idx),'exactRows':len(exact),'missingRows':len(gaps),'coveragePct':round(100*len(exact)/len(target),2) if target else 0},'exact':exact,'gaps':gaps,'sources':[{'key':'PAN','url':PAN_URL},{'key':'ChargePoint public station detail','url':'https://mc.chargepoint.com/map-prod/v3/station/info'}]}
          pathlib.Path('data/operator_direct/freshmile_chargepoint_exact_france.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('reports/france/freshmile/chargepoint-exact-summary.json').write_text(json.dumps({'classification':out['classification'],'coverage':out['coverage'],'sampleExact':exact[:10]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'classification':out['classification'],'coverage':out['coverage'],'sampleExact':exact[:3]},ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operator_direct/freshmile_chargepoint_exact_france.json reports/france/freshmile/chargepoint-exact-summary.json
          git commit -m 'data(freshmile): publish exact ChargePoint-attributed EVSE tariffs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
