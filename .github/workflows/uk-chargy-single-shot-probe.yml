name: UK chargy single-shot probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargy-single-shot-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe char.gy full locations and exact tariff endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,time
          from pathlib import Path
          from datetime import datetime,timezone
          targets={
            'locations':'https://char.gy/open-ocpi/locations',
            'tariffs':'https://char.gy/open-ocpi/tariffs/GB/CGY',
          }
          out={'country':'GB','network':'char.gy','retrievedAt':datetime.now(timezone.utc).isoformat(),'results':{}}
          for k,url in targets.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanion/9 UK-char.gy-single','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); p=json.loads(raw.decode('utf-8'))
              arr=p.get('data') if isinstance(p,dict) else p if isinstance(p,list) else []
              out['results'][k]={'url':url,'bytes':len(raw),'records':len(arr) if isinstance(arr,list) else None,'topKeys':list(p) if isinstance(p,dict) else None}
              if isinstance(arr,list) and arr and isinstance(arr[0],dict): out['results'][k]['firstKeys']=list(arr[0])
              time.sleep(2)
          Path('reports/uk/chargy-single-shot-probe-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/chargy-single-shot-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe char.gy single-shot feed [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
