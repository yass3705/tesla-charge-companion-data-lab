name: Grand Est remaining public networks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/fdea_modulo_official.py"
      - "scripts/selestat_freshmile_official.py"
      - "scripts/obernai_municipal_official.py"
      - "scripts/barr_municipal_official.py"
      - "scripts/tea_alsace_official.py"
      - "scripts/grand_reims_official.py"
      - "scripts/sdea_elinvest_official.py"
      - "scripts/grand_nancy_official.py"
      - ".github/workflows/grandest-remaining-public-networks.yml"

permissions:
  contents: write
concurrency:
  group: grandest-remaining-public-networks
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'
      - name: Run official validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/{fdea_modulo,selestat,obernai,barr,tea_alsace,grand_reims,sdea_elinvest,grand_nancy}
          python scripts/fdea_modulo_official.py --out out/fdea_modulo
          python scripts/selestat_freshmile_official.py --out out/selestat
          python scripts/obernai_municipal_official.py --out out/obernai
          python scripts/barr_municipal_official.py --out out/barr
          python scripts/tea_alsace_official.py --out out/tea_alsace
          python scripts/grand_reims_official.py --out out/grand_reims
          python scripts/sdea_elinvest_official.py --out out/sdea_elinvest
          python scripts/grand_nancy_official.py --out out/grand_nancy
      - name: Validate classifications
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def j(p): return json.loads(Path(p).read_text())
          f=j('out/fdea_modulo/fdea_modulo_official_grandest.json'); assert f['operatorDirect']['subscriber']['acType2EurPerHour']==2.0 and f['operatorDirect']['subscriber']['dcChademoComboEurPerHour']==3.0 and f['tccDecision']['directTariffClassable']
          s=j('out/selestat/selestat_freshmile_official_grandest.json'); assert s['operatorDirect']['energyEurPerKwh']==0.0 and s['tccDecision']['applyOnlyToMunicipalChargers']
          o=j('out/obernai/obernai_municipal_official_grandest.json'); assert o['operatorDirect']['energyEurPerKwh']==0.30 and o['operatorDirect']['parking']['fromFifthHourEurPerMinute']==0.10
          b=j('out/barr/barr_municipal_official_grandest.json'); assert b['operatorDirect']['energyEurPerKwh']==0.32 and b['operatorDirect']['connectedTime']['eurPerStartedHourAfterThreshold']==2.0
          t=j('out/tea_alsace/tea_alsace_official_grandest.json'); assert t['network']['currentOfficialDemonstrationChargers']==6 and not t['tccDecision']['directTariffClassable']
          r=j('out/grand_reims/grand_reims_official_grandest.json'); assert r['network']['privateActorMobilization'] and not r['tccDecision']['directTariffClassable']
          a=j('out/sdea_elinvest/sdea_elinvest_official_grandest.json'); assert a['network']['plannedChargePoints']==228 and a['network']['plannedStations']==57 and not a['tccDecision']['directTariffClassable']
          n=j('out/grand_nancy/grand_nancy_official_grandest.json'); assert n['legacyNetwork']['serviceOperator']=='Modulo Energies' and n['expansion']['operator']=='Easy Charge Services' and n['expansion']['plannedChargePoints']==266
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/grandest_remaining
          for d in fdea_modulo selestat obernai barr tea_alsace grand_reims sdea_elinvest grand_nancy; do
            cp out/$d/*_official_grandest.json data/operator_direct/
          done
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data(grandest): publish remaining public network evidence [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/grandest_remaining
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/grandest_remaining/latest_run_status.json').write_text(json.dumps({'dataset':'grandest-remaining-public-networks-run-status','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/grandest_remaining/latest_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "status(grandest-remaining): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
            exit 1
          fi
