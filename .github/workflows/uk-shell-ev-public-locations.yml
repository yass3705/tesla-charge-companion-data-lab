name: UK Shell EV Public Locations collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-ev-public-locations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-shell-ev-public-locations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Authenticate and collect Shell EV public locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python3 - <<'PY'
          import os,json,uuid,time,urllib.request,urllib.parse,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ.get("SHELL_EV_CLIENT_ID","").strip()
          secret=os.environ.get("SHELL_EV_CLIENT_SECRET","").strip()
          if not cid or not secret:
              raise SystemExit("SHELL_EV_CLIENT_ID / SHELL_EV_CLIENT_SECRET missing")

          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev/v2/locations"
          UA="TeslaChargeCompanion/9 Shell-EV-Locations"

          form=urllib.parse.urlencode({
              "client_id":cid,
              "client_secret":secret,
              "grant_type":"client_credentials"
          }).encode()
          req=urllib.request.Request(AUTH,data=form,method="POST",headers={
              "Content-Type":"application/x-www-form-urlencoded",
              "Accept":"application/json",
              "User-Agent":UA
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              tok=json.loads(r.read().decode("utf-8"))
          token=tok["access_token"]

          def get(params):
              url=BASE+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status,dict(r.headers.items()),json.loads(r.read().decode("utf-8"))

          # Diagnose actual v2.1.2 response shapes first, then collect.
          diag={}
          def probe(path,params=None):
              url="https://api-test.shell.com/ev"+path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              try:
                  with urllib.request.urlopen(req,timeout=60) as rr:
                      raw=rr.read().decode("utf-8")
                      jj=json.loads(raw)
                      diag[path]={
                          "httpStatus":rr.status,
                          "topLevelType":type(jj).__name__,
                          "topLevelKeys":list(jj.keys())[:50] if isinstance(jj,dict) else None,
                          "sample":jj if len(raw)<12000 else (list(jj)[:2] if isinstance(jj,list) else {k:jj[k] for k in list(jj)[:8]})
                      }
                      return jj
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  diag[path]={"httpStatus":e.code,"errorBodyPrefix":body[:2000]}
                  return None

          first=probe("/v2/locations")
          markers=probe("/v2/locations/markers")
          # Nearby requires coordinates in some deployments; use central London as a harmless read-only probe.
          nearby=probe("/v2/locations/nearby",{"latitude":51.5074,"longitude":-0.1278})

          def extract_items(j):
              if isinstance(j,list): return j
              if not isinstance(j,dict): return []
              candidates=[j]
              for k in ("data","result","response"):
                  v=j.get(k)
                  if isinstance(v,dict): candidates.append(v)
                  elif isinstance(v,list): return v
              for d in candidates:
                  for k in ("items","locations","content","results","records"):
                      v=d.get(k) if isinstance(d,dict) else None
                      if isinstance(v,list): return v
              return []

          all_items=extract_items(first)
          # If paginated and first page is non-empty, follow common documented pagination fields.
          if isinstance(first,dict):
              data=first.get("data") if isinstance(first.get("data"),dict) else first
              page=int(data.get("page") or data.get("pageNumber") or 0)
              total_pages=data.get("totalPages") or data.get("total_pages")
              page_size=int(data.get("size") or data.get("pageSize") or max(len(all_items),1))
              while total_pages is not None and page+1<int(total_pages) and page<199:
                  page+=1
                  jj=probe("/v2/locations",{"page":page,"size":page_size})
                  items=extract_items(jj)
                  if not items: break
                  all_items.extend(items)
                  time.sleep(.2)

          # Some Sandbox tenants expose marker payloads but not full paged locations.
          marker_items=extract_items(markers)
          if not all_items and marker_items:
              all_items=marker_items

          def country_of(x):
              vals=[
                  x.get("country"),
                  (x.get("address") or {}).get("country") if isinstance(x.get("address"),dict) else None,
                  x.get("countryCode"),
                  x.get("country_code")
              ]
              return " ".join(str(v) for v in vals if v).upper()

          uk=[x for x in all_items if any(k in country_of(x) for k in ("GB","GBR","UNITED KINGDOM","UK"))]
          now=datetime.now(timezone.utc).isoformat()
          payload={"retrievedAt":now,"source":BASE,"locations":uk}
          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","wt",encoding="utf-8") as g:
              json.dump(payload,g,ensure_ascii=False,separators=(",",":"))

          # Summarise schema and operator/network names without assuming exact field names.
          names=set()
          tariffs=0
          evses=0
          connectors=0
          for loc in uk:
              for k in ("operatorName","networkName","providerName","operator","network","provider"):
                  v=loc.get(k)
                  if isinstance(v,str): names.add(v)
                  elif isinstance(v,dict):
                      for kk in ("name","displayName"):
                          if v.get(kk): names.add(str(v.get(kk)))
              ev=loc.get("evses") or loc.get("chargingUnits") or loc.get("chargePoints") or []
              if isinstance(ev,list):
                  evses+=len(ev)
                  for e in ev:
                      cs=e.get("connectors") or []
                      if isinstance(cs,list):
                          connectors+=len(cs)
                          for c in cs:
                              if c.get("tariff") or c.get("tariffs") or c.get("price") or c.get("pricing"):
                                  tariffs+=1

          report={
              "retrievedAt":now,
              "diagnostics":diag,
              "locationCount":len(uk),
              "evseLikeCount":evses,
              "connectorLikeCount":connectors,
              "connectorsWithPricingSignal":tariffs,
              "operatorNetworkNames":sorted(names)[:200],
              "firstLocationKeys":list(uk[0].keys()) if uk else []
          }
          Path("reports/uk/shell-ev-public-locations-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_shell_ev_public_locations.json.gz reports/uk/shell-ev-public-locations-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Shell EV public locations [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
