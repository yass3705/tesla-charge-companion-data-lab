name: Bump official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "29 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/bump-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: bump-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract official Bump France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/bump
          python -m py_compile scripts/bump_official.py
          python scripts/bump_official.py --out out/bump 2> >(tee out/bump/error.log >&2)
          cat out/bump/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/bump
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/bump/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/bump/latest_diagnostic.json').write_text(json.dumps({'dataset':'bump-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(bump): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate Bump classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/bump/bump_official_france.json').read_text())
          c=p['classification']
          assert c['singleGuaranteedNationalCpoDirectTariff'] is False
          assert c['stationLevelPriceLookupRequiredForExactCpoDirect'] is True
          direct=p['operatorDirect']['bumpOperatedStations']
          assert direct['priceModel'] == 'site_specific'
          assert direct['exactPriceLookupRequired'] is True
          payment=p['operatorDirect']['paymentMethods']
          assert payment['bumpApp'] and payment['bumpCardOrPass'] and payment['compatibleRfid'] and payment['bankCardDirect']
          assert p['roaming']['operatorDirect'] is False
          assert p['roaming']['bumpCanModifyPartnerPrice'] is False
          minimum=p['fees']['minimumTariff']
          assert minimum['networkWide'] is False
          assert minimum['generalStartingAmountEur'] == 0.50
          pre=p['fees']['paymentPreauthorization']
          assert pre['minEur'] == 15.0 and pre['maxEur'] == 45.0
          assert p['inventory']['publisherSaysUpdatedDaily'] is True
          assert p['inventory']['liveAvailability'] is False
          print('Validated Bump site-specific direct pricing, roaming separation and fee/payment rules')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/bump/bump_official_france.json')
          dst=Path('data/operator_direct/bump_official_france.json')
          rep=Path('reports/bump/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'technical':d.get('technical'),
                  'inventory':d.get('inventory'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/bump/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Bump rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/bump_official_france.json reports/bump/latest_summary.md
          git commit -m "data(bump): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
