name: UK Wenea open-data collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-wenea-open-data-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Wenea UK official ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import io,json,gzip,zipfile,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone

          url='https://wenea.com/apilocation/data.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9','Accept':'application/zip,*/*'})
          with urllib.request.urlopen(req,timeout=90) as r: raw=r.read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          locations=json.loads(z.read('locations.json').decode('utf-8-sig'))
          tariffs=json.loads(z.read('tariffs.json').decode('utf-8-sig'))
          uk=[x for x in locations if isinstance(x,dict) and str(x.get('country') or '').upper() in ('GB','GBR','UNITED KINGDOM')]
          # Fallback to UK time zone only if country field disappears upstream.
          if not uk:
              uk=[x for x in locations if isinstance(x,dict) and str(x.get('time_zone') or '')=='Europe/London']
          referenced=set(); evses=connectors=0; statuses={}; parties=set()
          for loc in uk:
              if loc.get('party_id'): parties.add(str(loc.get('party_id')))
              for ev in loc.get('evses') or []:
                  if not isinstance(ev,dict): continue
                  evses+=1; st=str(ev.get('status') or 'UNKNOWN'); statuses[st]=statuses.get(st,0)+1
                  for con in ev.get('connectors') or []:
                      if not isinstance(con,dict): continue
                      connectors+=1
                      for tid in con.get('tariff_ids') or []: referenced.add(str(tid))
                      if con.get('tariff_id') is not None: referenced.add(str(con.get('tariff_id')))
          byid={str(t.get('id')):t for t in tariffs if isinstance(t,dict) and t.get('id') is not None}
          selected=[byid[x] for x in sorted(referenced) if x in byid]
          upstream_missing=sorted(referenced-set(byid))
          # The official ZIP currently references one absent UK tariff ID on all connectors.
          # All UK records are owned+operated by Wenea Mobile Energy. Use Wenea's current
          # public direct PAYG prices by exact connector power band, preserving upstream IDs.
          direct={
            'WENEA-DIRECT-AC':{'price':0.55,'min_w':0,'max_w':22000,'label':'AC 3.5-22 kW'},
            'WENEA-DIRECT-DC':{'price':0.75,'min_w':22001,'max_w':60000,'label':'DC 30-60 kW'},
            'WENEA-DIRECT-HPC':{'price':0.85,'min_w':60001,'max_w':400000,'label':'HPC 61-400 kW'},
          }
          for loc in uk:
              for ev in loc.get('evses') or []:
                  for con in ev.get('connectors') or []:
                      if not isinstance(con,dict): continue
                      p=int(con.get('max_electric_power') or 0)
                      tid=None
                      if 0 < p <= 22000: tid='WENEA-DIRECT-AC'
                      elif 22000 < p <= 60000: tid='WENEA-DIRECT-DC'
                      elif 60000 < p <= 400000: tid='WENEA-DIRECT-HPC'
                      if tid:
                          con['_source_tariff_ids']=list(con.get('tariff_ids') or [])
                          con['tariff_ids']=[tid]
                          con['tcc_direct_price_gbp_per_kwh']=direct[tid]['price']
          selected=[{'country_code':'GB','party_id':'WEN','id':tid,'currency':'GBP','elements':[{'price_components':[{'type':'ENERGY','price':v['price'],'step_size':1}]}],'source':'https://wenea.com/uk/charging-tariffs/','source_label':v['label'],'tcc_current_direct_tariff':True} for tid,v in direct.items()]
          unresolved_power=[]
          for loc in uk:
              for ev in loc.get('evses') or []:
                  for con in ev.get('connectors') or []:
                      if isinstance(con,dict) and not con.get('tariff_ids'): unresolved_power.append({'location':loc.get('id'),'connector':con.get('id'),'power':con.get('max_electric_power')})
          retrieved=datetime.now(timezone.utc).isoformat()
          out={'country':'GB','network':'Wenea','retrievedAt':retrieved,'sourceUrl':url,'officialPricingUrl':'https://wenea.com/uk/charging-tariffs/','locations':uk,'tariffs':selected}
          summary={'country':'GB','network':'Wenea','retrievedAt':retrieved,'zipLocationsTotal':len(locations),'ukLocations':len(uk),'evses':evses,'connectors':connectors,'partyIdsObserved':sorted(parties),'evseStatuses':statuses,'upstreamTariffIdsReferenced':sorted(referenced),'upstreamMissingTariffIds':upstream_missing,'directTariffs':direct,'unresolvedPowerConnectors':unresolved_power,'status':'complete_with_official_direct_price_fallback' if uk and not unresolved_power else 'partial'}
          with gzip.open('data/national/uk_wenea_open_data.json.gz','wt',encoding='utf-8') as g: json.dump(out,g,ensure_ascii=False,separators=(',',':'))
          Path('reports/uk/wenea-open-data-latest.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not uk or unresolved_power: raise SystemExit(2)
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_wenea_open_data.json.gz reports/uk/wenea-open-data-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Wenea official open data [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
