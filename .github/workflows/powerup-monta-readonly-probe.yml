name: PowerUp Monta read-only API probe

on:
  push:
    paths:
      - '.github/workflows/powerup-monta-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Probe guest auth and charge-point read endpoint
        shell: python
        run: |
          import json,urllib.request,urllib.error,pathlib,re
          base='https://management.charge.agrola.ch'
          ua={'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json'}

          def call(method,url,body=None,headers=None):
              h=dict(ua); h.update(headers or {})
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      try:p=json.loads(raw)
                      except:p={'raw':raw[:5000]}
                      return r.status,p
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:p=json.loads(raw)
                  except:p={'raw':raw[:5000]}
                  return e.code,p
              except Exception as e:
                  return 0,{'error':type(e).__name__+': '+str(e)}

          report={'base':base,'sampleChargePointId':'5017670'}

          # try same-origin first, then /api prefix variants if needed
          guest_paths=['/api/v1/auth/guest','/api/api/v1/auth/guest']
          token=None
          guest_attempts=[]
          for gp in guest_paths:
              st,p=call('POST',base+gp,{})
              guest_attempts.append({'path':gp,'status':st,'keys':list(p.keys()) if isinstance(p,dict) else None})
              if isinstance(p,dict):
                  token=p.get('access_token') or p.get('accessToken') or (p.get('data') or {}).get('access_token') or (p.get('data') or {}).get('accessToken')
              if token:
                  report['guestPath']=gp
                  break
          report['guestAttempts']=guest_attempts
          report['tokenObtained']=bool(token)

          cps=[]
          for path in ['/api/v1/charge_points/5017670','/api/api/v1/charge_points/5017670']:
              hdr={}
              if token: hdr['Authorization']='Bearer '+token
              st,p=call('GET',base+path,headers=hdr)
              # sanitize any auth-ish values before persistence
              def scrub(v):
                  if isinstance(v,dict):
                      out={}
                      for k,z in v.items():
                          if re.search(r'(token|secret|authorization|client_secret)',k,re.I):
                              out[k]='[REDACTED]'
                          else: out[k]=scrub(z)
                      return out
                  if isinstance(v,list): return [scrub(z) for z in v]
                  if isinstance(v,str) and len(v)>120 and re.match(r'^[A-Za-z0-9._~+/=-]+$',v):
                      return '[REDACTED_LONG_TOKEN]'
                  return v
              cps.append({'path':path,'status':st,'payload':scrub(p)})
          report['chargePointAttempts']=cps

          pathlib.Path('docs/switzerland-powerup-monta-readonly-probe-2026-09-28.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps({
              'guestAttempts':guest_attempts,
              'tokenObtained':bool(token),
              'chargePointStatuses':[{'path':x['path'],'status':x['status']} for x in cps]
          },ensure_ascii=False,indent=2))

      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-powerup-monta-readonly-probe-2026-09-28.json
          git commit -m "docs(switzerland): probe PowerUp Monta read-only API"
          for i in 1 2 3 4 5; do git push origin main && exit 0 || git pull --rebase origin main; sleep 2; done
          exit 1
