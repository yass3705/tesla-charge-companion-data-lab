name: UK Wenea open-data inspect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-wenea-open-data-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and inspect Wenea official open-data ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk artifacts/wenea
          python - <<'PY'
          import io,json,zipfile,urllib.request,csv,hashlib
          from pathlib import Path
          from datetime import datetime,timezone

          url="https://wenea.com/apilocation/data.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TeslaChargeCompanion/9","Accept":"application/zip,*/*"})
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read()
              status=r.status
              ct=r.headers.get("Content-Type")
          z=zipfile.ZipFile(io.BytesIO(raw))
          report={"country":"GB","network":"Wenea","retrievedAt":datetime.now(timezone.utc).isoformat(),
                  "sourceUrl":url,"httpStatus":status,"contentType":ct,"zipBytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),"files":[]}
          for info in z.infolist():
              item={"name":info.filename,"size":info.file_size,"compressed":info.compress_size}
              if not info.is_dir():
                  b=z.read(info)
                  low=info.filename.lower()
                  try:
                      txt=b.decode("utf-8-sig")
                  except Exception:
                      try: txt=b.decode("latin-1")
                      except Exception: txt=None
                  if txt is not None:
                      item["prefix"]=txt[:1000]
                      if low.endswith(".json"):
                          try:
                              p=json.loads(txt)
                              item["jsonType"]=type(p).__name__
                              if isinstance(p,list):
                                  item["records"]=len(p)
                                  item["firstKeys"]=list(p[0].keys()) if p and isinstance(p[0],dict) else []
                              elif isinstance(p,dict):
                                  item["topKeys"]=list(p)[:50]
                                  for k,v in p.items():
                                      if isinstance(v,list):
                                          item.setdefault("arrays",{})[k]=len(v)
                          except Exception as e: item["parseError"]=str(e)
                      elif low.endswith((".csv",".txt")):
                          try:
                              rows=list(csv.reader(io.StringIO(txt)))
                              item["rows"]=len(rows)
                              item["header"]=rows[0] if rows else []
                              item["sampleRows"]=rows[1:4]
                          except Exception as e: item["parseError"]=str(e)
              report["files"].append(item)
          Path("reports/uk/wenea-open-data-inspect-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/wenea-open-data-inspect-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Wenea official open-data ZIP [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
