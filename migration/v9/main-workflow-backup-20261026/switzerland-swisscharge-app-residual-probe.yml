name: Switzerland Swisscharge app residual probe
# rerun-2026-09-29-app-residual
# source-fallback-apkpure-net

on:
  push:
    paths:
      - '.github/workflows/switzerland-swisscharge-app-residual-probe.yml'
      - 'scripts/probe_swisscharge_app_residuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download Swisscharge XAPK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/cs.swisscharge?version=latest"             -o /tmp/swisscharge.xapk
          test "$(stat -c%s /tmp/swisscharge.xapk)" -gt 50000000
      - name: Probe residuals through Swisscharge app API
        run: python3 scripts/probe_swisscharge_app_residuals.py
      - name: Persist sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-swisscharge-app-residual-probe-2026-09-29.json
          git commit -m "research(ch): probe Swisscharge residuals via app API" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
