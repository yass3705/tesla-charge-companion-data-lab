name: Germany Mobilithek AFIR noauth probe

on:
  workflow_dispatch:
  push:
    branches: ["feature/germany-national-base"]
    paths:
      - "scripts/germany_mobilithek_payload_probe.py"
      - ".github/workflows/germany-mobilithek-noauth-probe.yml"

permissions:
  contents: read

concurrency:
  group: germany-mobilithek-afir-noauth-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe anonymous AFIR payload access
        run: python scripts/germany_mobilithek_payload_probe.py

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: germany-mobilithek-noauth-${{ github.run_id }}
          path: data/germany/mobilithek_noauth_probe.json
          if-no-files-found: error
          retention-days: 7
