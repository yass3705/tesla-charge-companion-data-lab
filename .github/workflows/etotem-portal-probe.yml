name: e-Totem public portal probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/etotem_portal_probe.py"
      - ".github/workflows/etotem-portal-probe.yml"

permissions:
  contents: write

concurrency:
  group: etotem-portal-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe public SPA
        run: python scripts/etotem_portal_probe.py
      - name: Publish probe result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/etotem_portal_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(etotem): publish public portal endpoint probe [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
