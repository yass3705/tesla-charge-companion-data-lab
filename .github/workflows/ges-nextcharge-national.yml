name: GES NextCharge national reconciliation

on:
  push:
    branches:
      - main
    paths:
      - scripts/nextcharge_ges_national.py
      - scripts/pun_italy_national.py
      - .github/workflows/ges-nextcharge-national.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests requests-aws4auth
      - name: Rebuild current PUN Italy
        run: python scripts/pun_italy_national.py --workers 8
      - name: Reconcile GES with NextCharge
        run: python scripts/nextcharge_ges_national.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-national
          path: |
            data/reports/nextcharge_ges_national_report.json
            data/national/nextcharge_ges_national.json.gz
          retention-days: 14
