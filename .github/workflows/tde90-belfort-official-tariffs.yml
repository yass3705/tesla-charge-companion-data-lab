name: TDE 90 Belfort official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tde90-belfort-official-tariffs.yml"
      - "config/operator_manifests/tde90_belfort.json"
      - "scripts/operator_manifest_runner.py"
      - "scripts/public_safety_check.py"

permissions:
  contents: write

concurrency:
  group: tde90-belfort-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract and validate official evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/tde90_belfort
          python -m py_compile scripts/operator_manifest_runner.py
          python scripts/operator_manifest_runner.py --operator tde90_belfort --out out/tde90_belfort 2> >(tee out/tde90_belfort/error.log >&2)
          cat out/tde90_belfort/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/tde90_belfort
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/tde90_belfort/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/tde90_belfort/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'tde90-belfort-individual-diagnostic',
              'operator':"Territoire d'Énergie 90",
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-60:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tde90_belfort/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(tde90): publish operator diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate output envelope
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/operator_manifests/tde90_belfort.json').read_text())
          p=json.loads((Path('out/tde90_belfort')/m['outputFile']).read_text())
          assert p['dataset'] == 'tde90-belfort-official-france'
          assert p['operator'] == "Territoire d'Énergie 90"
          assert p['country'] == 'FR'
          assert p['publicationStatus'] == 'candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['classification']['networkOwner'] == "Territoire d'Énergie 90"
          assert p['classification']['serviceProvider'] == 'Electromaps'
          a=p['operatorDirect']['accelerated22Kw']
          r=p['operatorDirect']['rapid50Kw']
          u=p['operatorDirect']['ultraRapid100Kw']
          assert a['eurPerKwh'] == 0.60
          assert a['connectionTimeFee']['freeMinutes'] == 180
          assert a['connectionTimeFee']['eurPerMinuteAfter'] == 0.02
          assert a['connectionTimeFee']['nightWindow'] == '19:00-09:00'
          assert a['connectionTimeFee']['nightTimeFeeWaived'] is True
          assert a['connectionTimeFee']['energyChargeStillAppliesAtNight'] is True
          assert r['eurPerKwh'] == 0.60
          assert r['connectionTimeFee']['freeMinutes'] == 90
          assert r['connectionTimeFee']['eurPerMinuteAfter'] == 0.03
          assert u['eurPerKwh'] == 0.60
          assert u['connectionTimeFee']['freeMinutes'] == 60
          assert u['connectionTimeFee']['eurPerMinuteAfter'] == 0.05
          assert p['access']['qrRegistrationRequired'] is False
          assert p['access']['contactlessBankCardUniversal'] is False
          assert p['roaming']['mustRemainSeparateFromTde90PublishedTariff'] is True
          print('Validated TDE 90 Belfort output envelope')
          PY

      - name: Publish validated rule set only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          m=json.loads(Path('config/operator_manifests/tde90_belfort.json').read_text())
          src=Path('out/tde90_belfort')/m['outputFile']
          dst=Path('data/operator_direct')/m['outputFile']
          rep=Path('reports/tde90_belfort/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/tde90_belfort/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated TDE 90 rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          output=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/operator_manifests/tde90_belfort.json').read_text())['outputFile'])
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/operator_direct/$output" reports/tde90_belfort/latest_summary.md
          git commit -m "data(tde90): publish official Belfort tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
