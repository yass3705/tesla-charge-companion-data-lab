name: Shell Recharge official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/shell_recharge_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/shell-recharge-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: shell-recharge-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract official Shell Recharge France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/shell_recharge
          python -m py_compile scripts/shell_recharge_official.py
          python scripts/shell_recharge_official.py --out out/shell_recharge 2> >(tee out/shell_recharge/error.log >&2)
          cat out/shell_recharge/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/shell_recharge
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/shell_recharge/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/shell_recharge/latest_diagnostic.json').write_text(json.dumps({'dataset':'shell-recharge-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/shell_recharge/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(shell): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate Shell Recharge classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/shell_recharge/shell_recharge_official_france.json').read_text())
          c=p['classification']
          assert c['singleNationalFastShellRechargeCardTariffRule'] is True
          assert c['exactCurrentKwhAmountAutoExtracted'] is False
          direct=p['operatorDirect']['fastShellRechargeWithShellCard']
          assert direct['uniformAcrossFastShellRechargeStations'] is True
          assert direct['representativeCurrentEurPerKwh'] == 0.64
          assert direct['monthlySubscriptionFeeEur'] == 0.0
          assert direct['cardOrderFeeEur'] == 0.0
          assert p['operatorDirect']['renderedFirstPartySamples']['count'] >= 5
          assert p['fees']['representativeShellAppSessionFeeEur'] == 0.35
          assert p['payment']['preauthorization']['shellCardOrAppEur'] == 45.0
          assert p['payment']['preauthorization']['bankCardEur'] == 65.0
          assert p['payment']['adHocQrOnline'] is True
          assert p['payment']['contactlessBankCardFastChargers'] is True
          assert p['roaming']['operatorDirect'] is False
          assert p['roaming']['shellTransactionFeePerSessionEur'] == 0.35
          assert p['roaming']['exactPartnerPriceLookupRequired'] is True
          assert {50,150,300}.issubset(set(p['technical']['representativePowerClassesKw']))
          print('Validated Shell Recharge uniform fast-rate rule, payment, preauthorization and roaming separation')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/shell_recharge/shell_recharge_official_france.json')
          dst=Path('data/operator_direct/shell_recharge_official_france.json')
          rep=Path('reports/shell_recharge/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'payment':d.get('payment'),
                  'fees':d.get('fees'),
                  'roaming':d.get('roaming'),
                  'representativeStationChecks':d.get('representativeStationChecks'),
                  'technical':d.get('technical'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/shell_recharge/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Shell Recharge rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/shell_recharge_official_france.json reports/shell_recharge/latest_summary.md
          git commit -m "data(shell): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
