name: Audit Electroverse reverse parent suffix
on:
  push:
    branches:
      - audit/electroverse-heterogeneous-subgroups
    paths:
      - "scripts/audit_electroverse_reverse_parent_suffix.mjs"
      - ".github/workflows/electroverse-reverse-parent-suffix-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audit
        run: node scripts/audit_electroverse_reverse_parent_suffix.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-reverse-parent-suffix-audit.json
          git commit -m "audit: publish reverse parent suffix report" || exit 0
          git push
