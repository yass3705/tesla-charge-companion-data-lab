name: Qovoltis QoAPI route discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-qoapi-route-discovery.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work probe
          curl -sS -L --max-time 120 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=443' \
            -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          find work/xapk -type f -name '*.apk' -printf '%p %s\n' | tee probe/apks.txt
          BASE=$(find work/xapk -type f -name '*.apk' | sort | head -1)
          cp "$BASE" work/base.apk
          echo "BASE=$BASE" | tee probe/base.txt

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool >/dev/null
          apktool d -f work/base.apk -o work/decoded >/dev/null 2>&1 || true

      - name: Extract targeted QoAPI classes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('work/decoded')
          outdir = Path('probe/targeted')
          outdir.mkdir(parents=True, exist_ok=True)
          wanted_names = {
              'NetworkConfiguration$Definitions.smali',
              'ApiGateway.smali',
              'StationDetailsApi.smali',
              'MainMapApi.smali',
              'QoSocketApi.smali',
              'StationsNetworkDataProvider.smali',
          }
          triggers = (
              'FetchStationsUseCase', 'StationDetailsUseCase', 'MapStationsMultiplexedUseCase',
              'Retrofit$Builder', 'OkHttpClient', 'Authorization', 'Bearer', 'x-api-key',
              'api-key', 'client-id', 'qoapi.qovoltis.com',
          )
          selected = []
          for p in root.rglob('*.smali'):
              rel = str(p.relative_to(root))
              low = rel.lower()
              try:
                  text = p.read_text(errors='replace')
              except Exception:
                  continue
              if (p.name in wanted_names or '/api/qoapi/' in low or any(t in text for t in triggers)):
                  dest = outdir / rel.replace('/', '__')
                  dest.write_text(text, encoding='utf-8')
                  selected.append(rel)
          Path('probe/targeted-files.txt').write_text('\n'.join(selected), encoding='utf-8')
          print(f'selected={len(selected)}')
          print('\n'.join(selected[:500]))
          PY

      - name: Build focused Retrofit and auth evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          keys = re.compile(
              r'retrofit2/http/(?:GET|POST|PUT|DELETE|PATCH|Path|Query|QueryMap|Header|Headers|Body|Field|FieldMap)'
              r'|Authorization|Bearer|x-api-key|api-key|client-id|User-Agent|baseUrl|Retrofit\$Builder|OkHttpClient'
              r'|qoapi\.qovoltis\.com|qoreal\.qovoltis\.com|pricing_default_price|pricing_default_label'
              r'|FetchStations|StationDetails|MapStations|StationDto|ChargeSocketDto', re.I)
          chunks = []
          literals = []
          for p in sorted(Path('probe/targeted').glob('*.smali')):
              lines = p.read_text(errors='replace').splitlines()
              hit_idx = [i for i,l in enumerate(lines) if keys.search(l)]
              if not hit_idx:
                  continue
              merged = []
              for i in hit_idx:
                  lo=max(0,i-35); hi=min(len(lines),i+36)
                  if merged and lo <= merged[-1][1] + 1:
                      merged[-1]=(merged[-1][0], max(merged[-1][1],hi))
                  else:
                      merged.append((lo,hi))
              for lo,hi in merged:
                  chunks.append(f'===== FILE {p.name} L{lo+1}-{hi} =====\n' + '\n'.join(lines[lo:hi]))
              for i,l in enumerate(lines):
                  if 'const-string' in l:
                      m=re.search(r'"([^"\\]*(?:\\.[^"\\]*)*)"', l)
                      if m:
                          s=m.group(1)
                          if ('/' in s or any(k in s.lower() for k in ('authorization','bearer','api-key','client-id','price','station','socket','map','offer'))):
                              literals.append(f'{p.name}:{i+1}\t{s}')
          Path('probe/focused-context.txt').write_text('\n\n'.join(chunks), encoding='utf-8')
          Path('probe/string-literals.txt').write_text('\n'.join(literals), encoding='utf-8')
          print(Path('probe/focused-context.txt').read_text(errors='replace')[:120000])
          print('\n===== LITERALS =====')
          print(Path('probe/string-literals.txt').read_text(errors='replace')[:60000])
          PY

      - name: Extract Retrofit annotation windows from all decoded smali
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('work/decoded')
          marker=re.compile(r'Lretrofit2/http/(?:GET|POST|PUT|DELETE|PATCH|Path|Query|QueryMap|Header|Headers|Body|Field|FieldMap);')
          rows=[]
          for p in root.rglob('*.smali'):
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              idx=[i for i,l in enumerate(lines) if marker.search(l)]
              if not idx: continue
              for i in idx:
                  lo=max(0,i-20); hi=min(len(lines),i+26)
                  rows.append(f'===== {p} L{i+1} =====\n'+'\n'.join(lines[lo:hi]))
          Path('probe/all-retrofit-annotations.txt').write_text('\n\n'.join(rows),encoding='utf-8')
          print(f'annotation_windows={len(rows)}')
          print(Path('probe/all-retrofit-annotations.txt').read_text(errors='replace')[:140000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-qoapi-targeted-extraction
          path: probe
          retention-days: 3
