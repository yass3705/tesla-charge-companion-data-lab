name: UK public webapp API discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-public-webapp-api-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-public-webapp-api-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect public webapp bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from datetime import datetime,timezone
          from pathlib import Path

          targets=[
            ("ParkRecharge","https://parkrecharge.app/"),
            ("3ti","https://3ti.co.uk/3ti-public-charge-points/"),
            ("Go Zero","https://www.gozerocharge.com/public-charge-point-open-data/")
          ]
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":[]}
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
            with urllib.request.urlopen(req,timeout=45) as r:
              return r.status,r.geturl(),r.read(4_000_000).decode("utf-8","replace"),dict(r.headers.items())

          for name,url in targets:
            item={"name":name,"url":url,"assets":[],"apiCandidates":[]}
            try:
              st,final,html,h=get(url); item.update({"status":st,"finalUrl":final,"htmlBytes":len(html)})
              # absolute + relative scripts
              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
              srcs=[urllib.parse.urljoin(final,s) for s in srcs]
              for s in srcs[:30]:
                a={"url":s}
                try:
                  ast,afinal,body,ah=get(s); a.update({"status":ast,"bytes":len(body)})
                  # collect absolute URLs and likely API-relative paths/hostnames
                  candidates=set()
                  for m in re.findall(r'https?://[^"\'\s<>()\\]+',body):
                    if any(k in m.lower() for k in ("api","ocpi","charge","fuuse","hubeleon","location","tariff","socket","station")):
                      candidates.add(m[:500])
                  for m in re.findall(r'["\']([^"\']{1,220})["\']',body):
                    ml=m.lower()
                    if ("/api/" in ml or "ocpi" in ml or "locations" in ml or "tariffs" in ml or "chargepoints" in ml or "chargers" in ml) and not ml.startswith("data:"):
                      candidates.add(m[:500])
                  a["candidates"]=sorted(candidates)[:150]
                  item["apiCandidates"].extend(a["candidates"])
                except Exception as e:
                  a["error"]=f"{type(e).__name__}: {e}"
                item["assets"].append(a)
              # HTML candidates too
              for m in re.findall(r'https?://[^"\'\s<>()\\]+',html):
                if any(k in m.lower() for k in ("api","ocpi","fuuse","location","tariff")):
                  item["apiCandidates"].append(m[:500])
              item["apiCandidates"]=sorted(set(item["apiCandidates"]))[:500]
            except Exception as e:
              item["error"]=f"{type(e).__name__}: {e}"
            out["targets"].append(item)
          Path("reports/uk/public-webapp-api-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/public-webapp-api-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover public webapp APIs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
