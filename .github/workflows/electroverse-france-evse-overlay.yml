name: Build France Electroverse EVSE overlay
on:
  push:
    branches: [main, electroverse-duration-bands-lab]
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-france-evse-overlay.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: electroverse-france-evse-overlay
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact EVSE-level Electroverse overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Persist validated EVSE overlay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/platforms/electroverse/france-evse scripts/build_electroverse_france_evse_overlay.mjs .github/workflows/electroverse-france-evse-overlay.yml
          git commit -m 'data: publish France Electroverse EVSE-level national overlay' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
