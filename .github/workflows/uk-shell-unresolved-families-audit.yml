name: UK Shell unresolved families audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-unresolved-families-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-api-global
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit unresolved Shell-visible UK operator families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,gzip,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; sec=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 UK-Shell-Unresolved-Families"; PROVIDER="Shell_RP_2"
          last=0.0; token=None; refreshes=0
          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()
          def auth():
              global token,refreshes
              throttle()
              data=urllib.parse.urlencode({"client_id":cid,"client_secret":sec,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=data,method="POST",headers={"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr: token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1
          def get(uid):
              global token
              for a in range(2):
                  throttle()
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")+"?"+urllib.parse.urlencode({"providerId":PROVIDER})
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json","RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr: return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and a==0: auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:1000]}
              return 0,{}
          auth()
          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)
          fams={
              "GB*BPL":[],
              "GB*SGB":[],
              "EVCOM Sub Operator":[]
          }
          for x in inv.get("locations",[]):
              oid=str(x.get("operatorId") or "")
              on=str(x.get("operatorName") or "")
              for fam in fams:
                  if (fam.startswith("GB*") and oid==fam) or (fam=="EVCOM Sub Operator" and on==fam):
                      fams[fam].append(x)

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"providerId":PROVIDER,"families":{}}
          for fam,rows in fams.items():
              res=[]
              for i,x in enumerate(rows,1):
                  uid=str(x.get("uid") or x.get("externalId") or "")
                  if not uid: continue
                  st,body=get(uid)
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data: data=data[0]
                  tariffs=[]; connectors=0; evseStatuses=[]; auths=[]
                  if isinstance(data,dict):
                      for ev in data.get("evses") or []:
                          evseStatuses.append(ev.get("status"))
                          auths.extend(ev.get("authorizationMethods") or [])
                          for conn in ev.get("connectors") or []:
                              connectors+=1
                              for t in conn.get("tariffs") or []:
                                  tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
                  res.append({
                      "uid":uid,"httpStatus":st,"operatorId":(data or {}).get("operatorId") if isinstance(data,dict) else oid,
                      "operatorName":(data or {}).get("operatorName") if isinstance(data,dict) else on,
                      "subOperatorName":(data or {}).get("subOperatorName") if isinstance(data,dict) else x.get("subOperatorName"),
                      "address":(data or {}).get("address") if isinstance(data,dict) else x.get("address"),
                      "accessibility":(data or {}).get("accessibility") if isinstance(data,dict) else x.get("accessibility"),
                      "evseStatuses":evseStatuses,"authorizationMethods":sorted(set(str(a) for a in auths)),
                      "connectorCount":connectors,"tariffCount":len(tariffs),"tariffs":tariffs
                  })
              out["families"][fam]={
                  "locationCount":len(res),
                  "http200":sum(1 for r in res if r["httpStatus"]==200),
                  "withTariff":sum(1 for r in res if r["tariffCount"]>0),
                  "tariffObjects":sum(r["tariffCount"] for r in res),
                  "connectors":sum(r["connectorCount"] for r in res),
                  "results":res
              }
          out["tokenRefreshCount"]=refreshes
          Path("reports/uk/shell-unresolved-families-audit-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:{kk:v[kk] for kk in ["locationCount","http200","withTariff","tariffObjects","connectors"]} for k,v in out["families"].items()},indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/uk/shell-unresolved-families-audit-latest.json /tmp/shell-unresolved-families-audit-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/shell-unresolved-families-audit-latest.json reports/uk/shell-unresolved-families-audit-latest.json
            git add reports/uk/shell-unresolved-families-audit-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(uk): audit unresolved Shell-visible families [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
