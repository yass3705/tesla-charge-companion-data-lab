name: UK TotalEnergies ChargePlus inventory

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-totalenergies-chargeplus-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect TotalEnergies UK inventory from public ChargePlus BFF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk data/national
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, concurrent.futures, time, gzip, pathlib, collections
          from datetime import datetime, timezone

          BASE="https://public.mycardprd.alzp.tgscloud.net/chargeplus-bff/v2"
          UA="tesla-charge-companion-data-lab/1.0"
          centers=[
            ("London",51.5074,-0.1278,50),
            ("Birmingham",52.4862,-1.8904,25),
          ]

          def get_json(url, timeout=35):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":UA})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode("utf-8","replace")
                      return r.status,json.loads(raw)
              except urllib.error.HTTPError as e:
                  try: obj=json.loads(e.read().decode("utf-8","replace"))
                  except Exception: obj={}
                  return e.code,obj
              except Exception as e:
                  return 0,{"error":type(e).__name__+": "+str(e)}

          summaries={}
          listing_meta=[]
          for label,lat,lon,radius in centers:
              q=urllib.parse.urlencode({"latitude":lat,"longitude":lon,"poiType":2,"radius":radius})
              st,obj=get_json(BASE+"/pois?"+q,60)
              data=(obj.get("data") or []) if isinstance(obj,dict) else []
              listing_meta.append({"center":label,"status":st,"count":len(data),"radiusKm":radius})
              for p in data:
                  pid=p.get("id")
                  if pid: summaries[pid]=p

          def detail(pid):
              url=BASE+"/pois/2-"+urllib.parse.quote(pid,safe="")+"/details"
              st,obj=get_json(url,35)
              d=obj.get("data") if isinstance(obj,dict) else None
              return pid,st,d

          total=[]
          statuses=collections.Counter()
          # Details are public, read-only. Moderate bounded concurrency.
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              futs=[ex.submit(detail,pid) for pid in summaries]
              for i,f in enumerate(concurrent.futures.as_completed(futs),1):
                  pid,st,d=f.result()
                  statuses[str(st)]+=1
                  if isinstance(d,dict):
                      marker=" ".join(str(d.get(k) or "") for k in ("networkName","networkId","name","cpoVendorId","cpoOrganizationId")).lower()
                      network_id=str(d.get("networkId") or "").upper()
                      # UK TotalEnergies/Source London lineage is exposed as GB*BPL / source-london / SLMS.
                      if (
                          "totalenergies" in marker or "total energies" in marker
                          or network_id=="GB*BPL"
                          or "source-london" in marker
                          or str(d.get("cpoVendorId") or "").upper()=="SLMS"
                      ):
                          total.append(d)

          # Deduplicate by stable POI id.
          byid={str(x.get("id")):x for x in total if x.get("id")}
          total=list(byid.values())

          chargepoints=[]
          connectors=[]
          network_ids=collections.Counter()
          vendor_ids=collections.Counter()
          power_counts=collections.Counter()
          for d in total:
              if d.get("networkId"): network_ids[str(d["networkId"])]+=1
              if d.get("cpoVendorId"): vendor_ids[str(d["cpoVendorId"])]+=1
              for cp in d.get("chargePoints") or []:
                  chargepoints.append((d,cp))
                  for c in cp.get("connectors") or []:
                      connectors.append((d,cp,c))
                      try:
                          p=float(c.get("power"))
                          power_counts[str(round(p,3))]+=1
                      except Exception: pass

          payload={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "source":"public ChargePlus BFF validated previously in Belgium",
              "sourceBase":BASE,
              "scope":{"officialTotalEnergiesUK":"Greater London + Birmingham","aliases":["TotalEnergies","source-london","GB*BPL","SLMS"],"centers":listing_meta},
              "summary":{
                  "uniqueListedPois":len(summaries),
                  "detailStatusCounts":dict(statuses),
                  "totalEnergiesLocations":len(total),
                  "chargePoints":len(chargepoints),
                  "connectors":len(connectors),
                  "networkIds":dict(network_ids),
                  "cpoVendorIds":dict(vendor_ids),
                  "connectorPowerKwDistribution":dict(sorted(power_counts.items(),key=lambda kv:float(kv[0])))
              },
              "locations":total
          }

          pathlib.Path("reports/uk/totalenergies-chargeplus-inventory-latest.json").write_text(
              json.dumps({k:v for k,v in payload.items() if k!="locations"},ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          with gzip.open("data/national/uk_totalenergies_chargeplus_locations.json.gz","wt",encoding="utf-8") as gz:
              json.dump(payload,gz,ensure_ascii=False)

          print(json.dumps(payload["summary"],ensure_ascii=False,indent=2))
          PY

      - name: Publish validated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/totalenergies-chargeplus-inventory-latest.json data/national/uk_totalenergies_chargeplus_locations.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect TotalEnergies inventory via public ChargePlus BFF [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
