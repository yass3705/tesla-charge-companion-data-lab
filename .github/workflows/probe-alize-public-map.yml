name: Probe Alize public map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-alize-public-map.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe live public map API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alize reports/france/alize
          API='https://alize-map-api-faezg8gfgjfngab9.francecentral-01.azurewebsites.net'
          UP='https://drive-api.plugsurfing.com/drive/v1/geosearch/radius?latitude=48.8566&longitude=2.3522&distance=30000&aggregate=false'
          curl -fLsS -X POST "$API/drive/markers" -H 'content-type: application/json' -H 'key: BYESKEY' -H 'accept: */*' -H "url: $UP" --data '{"filters":[]}' -o /tmp/alize/markers-live.json
          python - <<'PY'
          import json,pathlib,subprocess,urllib.parse
          data=json.loads(pathlib.Path('/tmp/alize/markers-live.json').read_text())
          locs=data.get('locations',[])
          out={'locationCount':len(locs),'attempts':[]}
          for loc in locs[:5]:
              lid=str(loc.get('id') or '')
              urls=[]
              if loc.get('location_url'): urls.append(loc['location_url'])
              if lid:
                  urls.append('https://drive-api.plugsurfing.com/drive/v1/locations/'+lid)
                  urls.append('https://drive-api.plugsurfing.com/drive/v1/locations/'+urllib.parse.quote(lid,safe=''))
              for u in dict.fromkeys(urls):
                  for mode in ('header','query'):
                      cmd=['curl','-sS','-w','\n%{http_code}','-H','key: BYESKEY','-H','accept: */*']
                      target='https://alize-map-api-faezg8gfgjfngab9.francecentral-01.azurewebsites.net/drive/detail'
                      if mode=='header': cmd += ['-H','url: '+u,target]
                      else: cmd += [target+'?url='+urllib.parse.quote(u,safe='')]
                      r=subprocess.run(cmd,capture_output=True,text=True)
                      body,status=r.stdout.rsplit('\n',1) if '\n' in r.stdout else (r.stdout,'')
                      parsed=None
                      try: parsed=json.loads(body)
                      except: pass
                      out['attempts'].append({'locationName':loc.get('name'),'evseIds':[e.get('evse_id') for e in loc.get('evses',[])[:5]],'upstreamUrl':u,'mode':mode,'status':status,'bodyKeys':list(parsed) if isinstance(parsed,dict) else [],'bodySample':body[:2500]})
          pathlib.Path('reports/france/alize/detail-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Publish probe report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/alize/detail-probe.json
          git commit -m 'France Alize: publish detail proxy probe' || exit 0
          git push
