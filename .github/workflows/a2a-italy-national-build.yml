name: A2A Italy national direct tariff candidate

on:
  workflow_dispatch:
  push:
    branches:
      - research/a2a-italy-national
    paths:
      - scripts/a2a_italy_national.py
      - .github/workflows/a2a-italy-national-build.yml

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check selenium
      - name: Download latest successful normalized PUN artifact
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pun-italy-normalized.yml --branch research/pun-italy-normalized --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/pun
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n pun-italy-normalized -D /tmp/pun
          test -s /tmp/pun/national/pun_italy_national.json.gz
          echo "Using PUN run $RUN_ID"
      - name: Build A2A national candidate
        run: python scripts/a2a_italy_national.py --pun /tmp/pun/national/pun_italy_national.json.gz
      - name: Validate fail-closed gates
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          report=json.loads(Path('data/reports/a2a_italy_national_report.json').read_text(encoding='utf-8'))
          with gzip.open('/tmp/pun/national/pun_italy_national.json.gz','rt',encoding='utf-8') as fh:
              pun=json.load(fh)
          with gzip.open('data/national/a2a_direct_stations_italy.json.gz','rt',encoding='utf-8') as fh:
              dataset=json.load(fh)

          pun_a2m={str(e.get('evseId')) for e in pun.get('evses',[]) if str(e.get('partyId') or '').upper() == 'A2M' and e.get('evseId')}
          rankable={str(e.get('evseId')) for e in dataset.get('evses',[]) if e.get('rankableDirectTariff') is True and e.get('evseId')}
          covered=len(pun_a2m & rankable)
          coverage=covered / len(pun_a2m) if pun_a2m else 0.0

          print(json.dumps(report['counts'],ensure_ascii=False,indent=2))
          print(json.dumps(report['qualityGates'],ensure_ascii=False,indent=2))
          print(json.dumps({
              'punA2mEvse': len(pun_a2m),
              'rankableA2aEvse': len(rankable),
              'coveredPunA2mEvse': covered,
              'punA2mDirectTariffCoverage': round(coverage,6),
              'legacySourceSafeJoinRateDiagnostic': report['counts'].get('safePunMatchRate'),
          },ensure_ascii=False,indent=2))

          assert report['security']['accountCredentialsUsed'] is False
          assert report['counts']['rankableEvse'] > 100
          assert report['qualityGates']['detailsSuccessRateGte99pct']
          assert report['qualityGates']['conflictingTariffEvseZero']
          assert coverage >= 0.95
          assert rankable <= pun_a2m
          PY
      - name: Upload candidate and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-direct-italy-candidate
          path: |
            data/national/a2a_direct_stations_italy.json.gz
            data/reports/a2a_italy_national_report.json
          retention-days: 14
