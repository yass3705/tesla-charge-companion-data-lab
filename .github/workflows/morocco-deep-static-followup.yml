name: Morocco deep static follow-up

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_fastvolt_evone_resource_keys_probe.py"
      - "scripts/morocco_numocity_url_construction_probe.py"
      - ".github/workflows/morocco-deep-static-followup.yml"

permissions:
  contents: write

concurrency:
  group: morocco-deep-static-followup
  cancel-in-progress: true

jobs:
  static-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_fastvolt_evone_resource_keys_probe.py
          python -m py_compile scripts/morocco_numocity_url_construction_probe.py

      - name: Run FastVolt EVOne static key probe
        run: python scripts/morocco_fastvolt_evone_resource_keys_probe.py

      - name: Run Numocity static URL-construction probe
        run: python scripts/morocco_numocity_url_construction_probe.py

      - name: Validate generated outputs
        run: |
          test -s artifacts/morocco-fastvolt-evone-resource-keys/summary.json
          test -s artifacts/morocco-numocity-url-construction/summary.json
          python scripts/public_safety_check.py artifacts/morocco-fastvolt-evone-resource-keys
          python scripts/public_safety_check.py artifacts/morocco-numocity-url-construction

      - name: Persist sanitized reports
        run: |
          set -euo pipefail
          mkdir -p reports/morocco/fastvolt-evone reports/morocco/totalenergies
          cp artifacts/morocco-fastvolt-evone-resource-keys/summary.json reports/morocco/fastvolt-evone/latest-resource-keys.json
          cp artifacts/morocco-numocity-url-construction/summary.json reports/morocco/totalenergies/latest-url-construction.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/fastvolt-evone/latest-resource-keys.json reports/morocco/totalenergies/latest-url-construction.json
          if git diff --cached --quiet; then
            echo "No report change to commit"
            exit 0
          fi
          git commit -m "data(morocco): update deep static client-context reports [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
