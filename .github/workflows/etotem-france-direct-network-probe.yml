name: France e-Totem direct network probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/etotem-france-direct-network-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct network filters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/etotem
          python - <<'PY'
          import requests,json,pathlib,datetime,collections
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          base='https://www.e-totem.fr/api'
          ar=s.post(base+'/ConnexionAnonyme',timeout=30);ad=ar.json()
          def tok(x):
            if isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,str) and ('token' in k.lower() or (v.count('.')==2 and len(v)>60)):return v
              for v in x.values():
                z=tok(v)
                if z:return z
            if isinstance(x,list):
              for v in x:
                z=tok(v)
                if z:return z
          t=tok(ad);assert t
          h={'Authorization':'Bearer '+t,'Accept':'application/json'}
          vals=['E-TOTEM TI','ETOTEM TI','E-Totem TI','TI','SEMOB','3M','G1O','SUPER U','CARREFOUR','E-TOTEM']
          out=[]
          common={'fLatSudOuest':'41','fLongSudOuest':'-5.8','fLatNordEst':'51.6','fLongNordEst':'10','bUniquementBornesDisponibles':'0','bCompatibleAutocharge':'0','nZoom':'16','bNePasClusteriser':'1','nBornesPrivees':'0','bRecupererBorneLaPlusProche':'0'}
          for v in vals:
            p=dict(common);p['sReseauBorne']=v
            r=s.get(base+'/Stations',params=p,headers=h,timeout=50)
            try:d=r.json()
            except:d={}
            elems=d.get('aElements',[]) if isinstance(d,dict) else []
            types=collections.Counter(str(x.get('szTypeMarqueur')) for x in elems if isinstance(x,dict))
            keys=collections.Counter(k for x in elems[:100] if isinstance(x,dict) for k in x)
            out.append({'filter':v,'status':r.status_code,'count':len(elems),'markerTypes':types,'keys':keys.most_common(),'samples':elems[:5]})
          clean={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'probes':out}
          pathlib.Path('reports/france/etotem/direct-network-probe.json').write_text(json.dumps(clean,ensure_ascii=False,indent=2,default=lambda x:dict(x))+'\n')
          print(json.dumps(clean,ensure_ascii=False,default=lambda x:dict(x))[:120000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/etotem/direct-network-probe.json
          git commit -m 'France e-Totem: publish direct network filter probe' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1