name: Morocco FastVolt userid provenance

on:
  push:
    paths:
      - '.github/workflows/morocco-fastvolt-userid-provenance.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare FastVolt and Blutter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-requests cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone --depth 1 https://github.com/worawit/blutter.git /tmp/blutter
          mkdir -p /tmp/fv/xapk /tmp/fv/lib/arm64-v8a
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0'             'https://d.apkpure.net/b/XAPK/ma.fastgo?version=latest' -o /tmp/fv/current.xapk
          echo "af476c969bf7982b1561cd0769a26f322b90257b347aa858f2c438d4e73fcf97  /tmp/fv/current.xapk" | sha256sum -c -
          unzip -q /tmp/fv/current.xapk -d /tmp/fv/xapk
          ARM_APK="$(find /tmp/fv/xapk -maxdepth 1 -name 'config.arm64_v8a.apk' -print -quit)"
          unzip -p "$ARM_APK" lib/arm64-v8a/libapp.so > /tmp/fv/lib/arm64-v8a/libapp.so
          unzip -p "$ARM_APK" lib/arm64-v8a/libflutter.so > /tmp/fv/lib/arm64-v8a/libflutter.so
          cd /tmp/blutter
          python3 blutter.py /tmp/fv/lib/arm64-v8a /tmp/fv/blutter-out

      - name: Trace userid writes and auth response mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/morocco/fastvolt
          python3 - <<'PY'
          import os,re,json
          from datetime import datetime, timezone
          root='/tmp/fv/blutter-out/asm'
          app=os.path.join(root,'evplug/app_state.dart')
          al=open(app,errors='ignore').read().splitlines()

          def sanitize(s):
              return re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_+/=.:-]{80,}(?![A-Za-z0-9])','<redacted-opaque>',s)[:1500]

          def start(lines,i):
              j=i
              while j>=0:
                  if re.match(r'^  (?:static )?[_A-Za-z].*\{\s*$',lines[j]):
                      return max(0,j-4)
                  j-=1
              return max(0,i-80)

          setter_addr=None
          for i,l in enumerate(al):
              if 'set _ userid=' in l:
                  for j in range(i,min(len(al),i+10)):
                      m=re.search(r'\*\* addr: (0x[0-9a-f]+)',al[j])
                      if m:
                          setter_addr=m.group(1);break
                  break

          xrefs=[]
          needle='#'+setter_addr[2:] if setter_addr else None
          for dp,_,fs in os.walk(os.path.join(root,'evplug')):
              for f in fs:
                  if not f.endswith('.dart'): continue
                  p=os.path.join(dp,f)
                  try: lines=open(p,errors='ignore').read().splitlines()
                  except: continue
                  for i,l in enumerate(lines):
                      if needle and needle in l and ('bl ' in l or 'blr' in l):
                          s=start(lines,i)
                          xrefs.append({
                            'file':os.path.relpath(p,root),'line':i+1,
                            'context':[sanitize(x) for x in lines[s:min(len(lines),i+110)]]
                          })

          # Auth/provider files: capture functions mentioning userid/user_id/token + successful response parsing.
          auth_hits=[]
          term_re=re.compile(r'userid|user_id|ff_userid|verifyPhoneOTP|verify_otp|send_verification_otp|auth/login|auth/signup|reference_id|token',re.I)
          for dp,_,fs in os.walk(os.path.join(root,'evplug')):
              for f in fs:
                  if not f.endswith('.dart'): continue
                  rel=os.path.relpath(os.path.join(dp,f),root)
                  if not any(k in rel.lower() for k in ('auth','otp','login','signup','provider','api_calls','main.dart')):
                      continue
                  p=os.path.join(dp,f)
                  try: lines=open(p,errors='ignore').read().splitlines()
                  except: continue
                  for i,l in enumerate(lines):
                      if term_re.search(l):
                          s=start(lines,i)
                          ctx=lines[s:min(len(lines),i+100)]
                          if any('ApiCallResponse' in x or 'getJsonField' in x or 'FFAppState' in x or 'call()' in x for x in ctx):
                              auth_hits.append({'file':rel,'line':i+1,'context':[sanitize(x) for x in ctx]})
                              if len(auth_hits)>=120: break
                  if len(auth_hits)>=120: break
              if len(auth_hits)>=120: break

          # Search exact JSONPath-like strings in the whole object pool/decompiled output.
          literals=set()
          for dp,_,fs in os.walk(root):
              for f in fs:
                  p=os.path.join(dp,f)
                  try:
                      if os.path.getsize(p)>30_000_000: continue
                      txt=open(p,errors='ignore').read()
                  except: continue
                  for m in re.findall(r'"([^"]{1,120})"',txt):
                      low=m.lower()
                      if any(t in low for t in ('userid','user_id','token','reference_id','login','otp')):
                          if not re.search(r'[A-Za-z0-9_-]{80,}',m):
                              literals.add(m)

          out={
            'schema_version':1,'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'FastVolt',
            'source':{'package':'ma.fastgo','version':'2.8.9','tool':'Blutter'},
            'policy':{'static_analysis_only':True,'no_credentials':True,'no_runtime_tokens':True,'opaque_literals_redacted':True},
            'userid_setter_address':setter_addr,
            'userid_setter_crossrefs':xrefs[:60],
            'auth_response_contexts':auth_hits[:120],
            'relevant_literals':sorted(literals)[:400]
          }
          with open('reports/morocco/fastvolt/userid-provenance-2026-09-26.json','w') as f:
              json.dump(out,f,indent=2,ensure_ascii=False);f.write('\n')
          PY
          rm -rf /tmp/fv /tmp/blutter

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/fastvolt/userid-provenance-2026-09-26.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(morocco): trace FastVolt userid provenance [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push
