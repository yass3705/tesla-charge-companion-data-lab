name: WAAT Monta public tariff endpoint probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/waat-monta-public-tariff-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public Monta Hub tariff routes without authentication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
            'https://hub.monta.app/api/gateway/api/v1/operator/1/grid-data/tariffs-creator?publicOnly=true&size=5',
            'https://hub.monta.app/api/gateway/api/v1/operator/1/grid-data/tariffs?size=5',
            'https://hub.monta.app/api/gateway/api/v1/grid-data/zones',
            'https://hub.monta.app/api/gateway/api/v1/countries',
            'https://hub.monta.app/api/gateway/api/v1/reference-data/countries',
          ]
          for url in urls:
            print('===== '+url+' =====')
            req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanion-data-lab/1.0','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read(12000).decode('utf-8','ignore')
                print('STATUS',r.status,'FINAL',r.geturl(),'CONTENT-TYPE',r.headers.get('content-type'))
                print(body)
            except urllib.error.HTTPError as e:
              body=e.read(12000).decode('utf-8','ignore')
              print('STATUS',e.code,'FINAL',e.geturl(),'CONTENT-TYPE',e.headers.get('content-type'))
              print(body)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e))
          PY
