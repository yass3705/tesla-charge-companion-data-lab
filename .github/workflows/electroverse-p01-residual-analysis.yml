name: Analyze Electroverse France P01 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_p01_residual.mjs"
      - ".github/workflows/electroverse-p01-residual-analysis.yml"
permissions:
  contents: write
concurrency:
  group: electroverse-p01-residual-analysis
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze P01 unpublished residual
        run: node scripts/analyze_electroverse_p01_residual.mjs
      - name: Persist P01 residual analysis
        run: |
          cp reports/electroverse/p01-residual-analysis.json /tmp/p01-residual-analysis.json
          cp data/platforms/electroverse/validated-mappings/p01-structured-residual.json /tmp/p01-structured-residual.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports/electroverse data/platforms/electroverse/validated-mappings
          cp /tmp/p01-residual-analysis.json reports/electroverse/p01-residual-analysis.json
          cp /tmp/p01-structured-residual.json data/platforms/electroverse/validated-mappings/p01-structured-residual.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/p01-residual-analysis.json data/platforms/electroverse/validated-mappings/p01-structured-residual.json
          if git diff --cached --quiet; then
            echo "No P01 analysis changes"
          else
            git commit -m "data: persist Electroverse P01 residual analysis"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-p01-residual-analysis
          path: reports/electroverse/p01-residual-analysis.json
          retention-days: 14
