name: Probe final B live EVSE statuses
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_b_final13_live_status.mjs"
      - ".github/workflows/electroverse-b-final13-live-status.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe_b_final13_live_status.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-final13-live-status-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist live EVSE status probe for final B residuals"
            git pull --rebase origin main || true
            git push
          fi
