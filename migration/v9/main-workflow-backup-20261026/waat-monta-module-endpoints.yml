name: WAAT Monta module endpoint extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/waat-monta-module-endpoints.yml"
      - "scripts/inspect_monta_public_modules.py"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract Monta public tariff module endpoints
        run: |
          set -euo pipefail
          python -m py_compile scripts/inspect_monta_public_modules.py
          python scripts/inspect_monta_public_modules.py
      - name: Commit endpoint report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/waat_monta_module_endpoints.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WAAT Monta public module endpoint report"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
