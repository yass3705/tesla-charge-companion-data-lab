name: IZIVIA FAST recovery validation (no publication)

on:
  push:
    branches: ["fix/izivia-fast-recover-map-prices-20261012"]
    paths:
      - "scripts/izivia_fast_capture.py"
      - ".github/workflows/izivia-fast-recovery-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Public-safety scan
        run: python scripts/public_safety_check.py .
      - name: Capture national FAST inventory, retry failures
        run: python scripts/izivia_fast_capture.py
      - name: Build evidence-only direct offers
        run: |
          python scripts/build_izivia_fast_offers.py out/izivia-fast-national-capture.json.gz out/izivia-fast-direct-france.json --inventory-output out/izivia-fast-inventory-france.json
      - name: Audit missing stations and recovery counts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/izivia-fast-national-summary.json')
          if not p.exists():
              print('No national capture report produced')
          else:
              d=json.loads(p.read_text())
              print(json.dumps({k:d.get(k) for k in ('inventoryStations','mapMarkers','mapFastCodes','statuses','recoveredDetailRequests','recoveredPricingStations','unresolvedDetailRequests')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izivia-fast-recovery-diagnostic
          path: |
            out/izivia-fast-national-summary.json
            out/izivia-fast-national-capture.json.gz
            out/izivia-fast-direct-france.json
            out/izivia-fast-inventory-france.json
          retention-days: 7
          if-no-files-found: ignore
