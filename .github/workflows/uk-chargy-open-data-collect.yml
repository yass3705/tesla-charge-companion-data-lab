name: UK char.gy open data collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargy-open-data-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-chargy-open-data-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect char.gy locations and tariffs
        run: |
          python - <<'PY'
          import json,gzip,time,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          BASE="https://char.gy/open-ocpi"
          UA="TeslaChargeCompanion/9 char.gy collector"

          def get(path,limit=500,offset=0,retries=8):
              url=f"{BASE}/{path}?"+urllib.parse.urlencode({"limit":limit,"offset":offset})
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=75) as r:
                          p=json.loads(r.read().decode("utf-8"))
                          h={k.lower():v for k,v in r.headers.items()}
                          return p,h,url
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code not in (403,429,500,502,503,504): raise
                  except Exception as e:
                      last=e
                  time.sleep(min(45,2**i))
              raise RuntimeError(f"GET failed {url}: {last}")

          def collect(path):
              rows=[]; offset=0; total=None; pages=0; seen=set()
              while True:
                  p,h,url=get(path,500,offset)
                  batch=p.get("data") if isinstance(p,dict) else None
                  if not isinstance(batch,list): raise RuntimeError(f"unexpected {path} payload")
                  if total is None:
                      try: total=int(h.get("x-total-count")) if h.get("x-total-count") else None
                      except Exception: total=None
                  for x in batch:
                      if not isinstance(x,dict): continue
                      key=str(x.get("id")) if x.get("id") is not None else json.dumps(x,sort_keys=True)
                      if key not in seen: seen.add(key); rows.append(x)
                  pages+=1
                  if not batch or (total is not None and len(rows)>=total) or len(batch)<500: break
                  offset += len(batch)
                  if pages>100: raise RuntimeError("pagination guard")
                  time.sleep(0.35)
              return rows,{"pages":pages,"advertisedTotal":total}

          locations,lmeta=collect("locations")
          tariffs,tmeta=collect("tariffs")
          evses=connectors=0; refs=set(); parties=set(); statuses={}
          for loc in locations:
              if loc.get("party_id"): parties.add(str(loc["party_id"]))
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1
                  st=str(ev.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  for con in ev.get("connectors") or []:
                      if not isinstance(con,dict): continue
                      connectors+=1
                      for tid in con.get("tariff_ids") or []: refs.add(str(tid))
                      if con.get("tariff_id") is not None: refs.add(str(con["tariff_id"]))
          tids={str(x.get("id")) for x in tariffs if isinstance(x,dict) and x.get("id") is not None}
          missing=sorted(refs-tids)
          out={
            "country":"GB","network":"char.gy","retrievedAt":datetime.now(timezone.utc).isoformat(),
            "source":"official anonymous OCPI-shaped open data",
            "locations":locations,"tariffs":tariffs
          }
          summary={
            "country":"GB","network":"char.gy","retrievedAt":out["retrievedAt"],
            "locations":len(locations),"evses":evses,"connectors":connectors,
            "tariffs":len(tariffs),"tariffIdsReferenced":len(refs),
            "missingTariffIds":missing,"partyIdsObserved":sorted(parties),
            "evseStatuses":statuses,"locationPagination":lmeta,"tariffPagination":tmeta,
            "status":"complete" if locations and not missing else "partial"
          }
          Path("data/national").mkdir(parents=True,exist_ok=True)
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          with gzip.open("data/national/uk_chargy_open_data.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/chargy-open-data-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not locations: raise SystemExit("no locations")
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_chargy_open_data.json.gz reports/uk/chargy-open-data-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect char.gy open data [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
