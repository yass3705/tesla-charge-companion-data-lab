name: WAAT Monta pricing evidence summary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waat-monta-pricing-evidence-summary.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract pricing-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          src=json.loads(Path('data/reports/waat_monta_browser_direct_probe.json').read_text())
          key_re=re.compile(r'(price|pricing|tariff|currency|fee|cost|kwh|minute|time|sales|subscription|payment|operator|team|public|visibility)',re.I)
          sens=re.compile(r'(token|authorization|cookie|secret|password|jwt)',re.I)
          def extract(o,path=''):
              out=[]
              if isinstance(o,dict):
                  for k,v in o.items():
                      p=f'{path}.{k}' if path else k
                      if sens.search(k):
                          continue
                      if key_re.search(k):
                          # Keep scalar values and compact structured pricing values.
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              out.append({'path':p,'value':v})
                          elif isinstance(v,(list,dict)) and len(json.dumps(v,ensure_ascii=False)) < 12000:
                              out.append({'path':p,'value':v})
                      out.extend(extract(v,p))
              elif isinstance(o,list):
                  for i,v in enumerate(o): out.extend(extract(v,f'{path}[{i}]'))
              return out
          summary=[]
          for r in src.get('results',[]):
              rr={'target':r.get('target'),'waatMapObjects':[],'detailEvidence':[]}
              for x in r.get('waatMapObjects',[]):
                  rr['waatMapObjects'].append({k:x.get(k) for k in ['document','id','name','operator_name','max_kw','min_kw','type_label','price_label','currency','kwh_sales_fixed_prices','min_price_by_kw_threshold.3','min_price_by_kw_threshold.11','min_price_by_kw_threshold.22','visibility','charge_point_count','charge_point_public_available_count','charge_point_public_total_count']})
              for d in r.get('details',[]):
                  rr['detailEvidence'].append({'endpoint':d.get('endpoint'),'status':d.get('status'),'pricingFields':extract(d.get('detail') or {})})
              summary.append(rr)
          out={'source':'waat_monta_browser_direct_probe.json','summary':summary}
          Path('data/reports/waat_monta_pricing_evidence_summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit summary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/waat_monta_pricing_evidence_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: summarize WAAT Monta pricing evidence"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
