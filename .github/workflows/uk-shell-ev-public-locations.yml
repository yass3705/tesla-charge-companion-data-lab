name: UK Shell EV Public Locations collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-ev-public-locations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-shell-ev-public-locations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Authenticate and collect Shell EV public locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python3 - <<'PY'
          import os,json,uuid,time,urllib.request,urllib.parse,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ.get("SHELL_EV_CLIENT_ID","").strip()
          secret=os.environ.get("SHELL_EV_CLIENT_SECRET","").strip()
          if not cid or not secret:
              raise SystemExit("SHELL_EV_CLIENT_ID / SHELL_EV_CLIENT_SECRET missing")

          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev/v2/locations"
          UA="TeslaChargeCompanion/9 Shell-EV-Locations"

          form=urllib.parse.urlencode({
              "client_id":cid,
              "client_secret":secret,
              "grant_type":"client_credentials"
          }).encode()
          req=urllib.request.Request(AUTH,data=form,method="POST",headers={
              "Content-Type":"application/x-www-form-urlencoded",
              "Accept":"application/json",
              "User-Agent":UA
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              tok=json.loads(r.read().decode("utf-8"))
          token=tok["access_token"]

          def get(params):
              url=BASE+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status,dict(r.headers.items()),json.loads(r.read().decode("utf-8"))

          # Diagnose actual v2.1.2 response shapes first, then collect.
          diag={}
          def probe(path,params=None,diag_key=None):
              url="https://api-test.shell.com/ev"+path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              dkey=diag_key or path
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              try:
                  with urllib.request.urlopen(req,timeout=60) as rr:
                      raw=rr.read().decode("utf-8")
                      jj=json.loads(raw)
                      diag[dkey]={
                          "httpStatus":rr.status,
                          "topLevelType":type(jj).__name__,
                          "topLevelKeys":list(jj.keys())[:50] if isinstance(jj,dict) else None,
                          "dataCount":len(jj.get("data") or []) if isinstance(jj,dict) and isinstance(jj.get("data"),list) else (len(jj) if isinstance(jj,list) else None),
                          "firstDataItemKeys":list((jj.get("data") or [{}])[0].keys()) if isinstance(jj,dict) and isinstance(jj.get("data"),list) and jj.get("data") else None
                      }
                      return jj
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  diag[dkey]={"httpStatus":e.code,"errorBodyPrefix":body[:2000]}
                  return None

          first=probe("/v2/locations")
          # UK-wide marker inventory using the parameters required by the documented v2.1.2 route.
          markers=probe("/v2/locations/markers",{
              "west":-8.7,
              "south":49.8,
              "east":1.9,
              "north":60.9,
              "zoom":5
          })
          # Nearby is retained as an independent London control sample.
          nearby=probe("/v2/locations/nearby",{"latitude":51.5074,"longitude":-0.1278})

          def extract_items(j):
              if isinstance(j,list):
                  return j
              if not isinstance(j,dict):
                  return []
              # Shell EV Public Locations v2.1.2 observed shape:
              # {"requestId": "...", "status": "SUCCESS", "data": [LocationV2, ...]}
              if isinstance(j.get("data"),list):
                  return j["data"]
              candidates=[j]
              for k in ("data","result","response"):
                  v=j.get(k)
                  if isinstance(v,dict):
                      candidates.append(v)
              for d in candidates:
                  for k in ("items","locations","content","results","records"):
                      v=d.get(k) if isinstance(d,dict) else None
                      if isinstance(v,list):
                          return v
              return []

          all_items=extract_items(first)

          # Prefer the UK-wide marker inventory as the canonical index when available.
          marker_items=extract_items(markers)
          nearby_items=extract_items(nearby)

          # Marker endpoint clusters at low zoom. Query a UK tile grid at high zoom so
          # individual-location markers can surface, then resolve any identifiers found.
          fine_markers=[]
          lon_edges=[-8.7,-6.0,-3.5,-1.0,1.9]
          lat_edges=[49.8,52.0,54.0,56.0,58.0,60.9]
          for yi in range(len(lat_edges)-1):
              for xi in range(len(lon_edges)-1):
                  west,east=lon_edges[xi],lon_edges[xi+1]
                  south,north=lat_edges[yi],lat_edges[yi+1]
                  mm=probe("/v2/locations/markers",{
                      "west":west,"south":south,"east":east,"north":north,"zoom":12
                  },diag_key=f"/v2/locations/markers tile {yi}-{xi}")
                  fine_markers.extend(extract_items(mm))
                  time.sleep(.05)

          # Dedupe marker objects by stable identity if present, else by coordinate+type.
          unique_markers=[]
          seen_marker=set()
          for m in fine_markers:
              if not isinstance(m,dict): continue
              coords=m.get("coordinates") or {}
              mk=(
                  m.get("id") or m.get("locationId") or m.get("uid") or m.get("externalId"),
                  coords.get("latitude"),coords.get("longitude"),
                  m.get("markerType")
              )
              if mk in seen_marker: continue
              seen_marker.add(mk)
              unique_markers.append(m)

          resolved=[]
          seen_ids=set()
          for m in unique_markers:
              mid=m.get("id") or m.get("locationId") or m.get("uid") or m.get("externalId")
              if not mid:
                  continue
              mid=str(mid)
              if mid in seen_ids:
                  continue
              seen_ids.add(mid)
              detail=probe("/v2/locations/"+urllib.parse.quote(mid,safe=""))
              if isinstance(detail,dict):
                  di=extract_items(detail)
                  if di:
                      resolved.extend(di)
                  elif isinstance(detail.get("data"),dict):
                      resolved.append(detail["data"])
              time.sleep(.05)

          # If markers still do not expose ids, use nearby probes centered on each fine marker
          # and dedupe full LocationV2 records by uid/externalId.
          if not resolved and unique_markers:
              loc_by_id={}
              for m in unique_markers:
                  coords=m.get("coordinates") or {}
                  lat,lon=coords.get("latitude"),coords.get("longitude")
                  if lat is None or lon is None: continue
                  jj=probe("/v2/locations/nearby",{"latitude":lat,"longitude":lon},diag_key=f"/v2/locations/nearby marker {len(loc_by_id)}")
                  for loc in extract_items(jj):
                      if not isinstance(loc,dict): continue
                      lid=str(loc.get("uid") or loc.get("externalId") or "")
                      if lid:
                          loc_by_id[lid]=loc
                  time.sleep(.05)
              resolved=list(loc_by_id.values())

          if resolved:
              all_items=resolved
          elif nearby_items:
              all_items=nearby_items

          def country_of(x):
              vals=[
                  x.get("country"),
                  (x.get("address") or {}).get("country") if isinstance(x.get("address"),dict) else None,
                  x.get("countryCode"),
                  x.get("country_code")
              ]
              return " ".join(str(v) for v in vals if v).upper()

          # Exact country-code matching avoids accidental substring matches.
          uk=[]
          for x in all_items:
              addr=x.get("address") if isinstance(x.get("address"),dict) else {}
              cc=str(addr.get("country") or x.get("countryCode") or x.get("country_code") or x.get("country") or "").upper().strip()
              if cc in ("GB","GBR","UK","UNITED KINGDOM"):
                  uk.append(x)
          now=datetime.now(timezone.utc).isoformat()
          payload={"retrievedAt":now,"source":BASE,"locations":uk}
          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","wt",encoding="utf-8") as g:
              json.dump(payload,g,ensure_ascii=False,separators=(",",":"))

          # Summarise schema and operator/network names without assuming exact field names.
          names=set()
          tariffs=0
          evses=0
          connectors=0
          operator_counts={}
          location_tariff_signals=0
          evse_tariff_signals=0
          for loc in uk:
              op=str(loc.get("operatorName") or loc.get("subOperatorName") or loc.get("operatorId") or "UNKNOWN")
              operator_counts[op]=operator_counts.get(op,0)+1
              if any(loc.get(k) is not None for k in ("tariff","tariffs","price","pricing")):
                  location_tariff_signals+=1
              for k in ("operatorName","networkName","providerName","operator","network","provider"):
                  v=loc.get(k)
                  if isinstance(v,str): names.add(v)
                  elif isinstance(v,dict):
                      for kk in ("name","displayName"):
                          if v.get(kk): names.add(str(v.get(kk)))
              ev=loc.get("evses") or loc.get("chargingUnits") or loc.get("chargePoints") or []
              if isinstance(ev,list):
                  evses+=len(ev)
                  for e in ev:
                      if any(e.get(k) is not None for k in ("tariff","tariffs","price","pricing")):
                          evse_tariff_signals+=1
                      cs=e.get("connectors") or []
                      if isinstance(cs,list):
                          connectors+=len(cs)
                          for c in cs:
                              if c.get("tariff") or c.get("tariffs") or c.get("price") or c.get("pricing"):
                                  tariffs+=1

          report={
              "retrievedAt":now,
              "diagnostics":diag,
              "locationCount":len(uk),
              "evseLikeCount":evses,
              "connectorLikeCount":connectors,
              "connectorsWithPricingSignal":tariffs,
              "locationsWithPricingSignal":location_tariff_signals,
              "evsesWithPricingSignal":evse_tariff_signals,
              "operatorCounts":dict(sorted(operator_counts.items(),key=lambda kv:(-kv[1],kv[0]))),
              "operatorNetworkNames":sorted(names)[:200],
              "firstLocationKeys":list(uk[0].keys()) if uk else [],
              "coarseMarkerCount":len(marker_items),
              "fineMarkerCount":len(unique_markers),
              "fineMarkerSamples":unique_markers[:10]
          }
          Path("reports/uk/shell-ev-public-locations-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_shell_ev_public_locations.json.gz reports/uk/shell-ev-public-locations-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Shell EV public locations [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
