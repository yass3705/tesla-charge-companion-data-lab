name: NL Agri Go official map exact site match
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_agrigo_official_map_match_20261011.py
      - .github/workflows/nl-agrigo-official-map-match.yml
permissions:
  contents: write
concurrency:
  group: nl-agrigo-official-map-match
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match official map GPS markers to 927 AGO stations with <=10m unicity gate
        run: |
          python3 -m py_compile scripts/nl_agrigo_official_map_match_20261011.py
          python3 scripts/nl_agrigo_official_map_match_20261011.py
      - name: Persist source identity only, no tariff pricing
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-agrigo-official-map-match-2026-10-11.json /tmp/agrigo-geo.json
          cp reports/netherlands/nl-agrigo-official-map-match-2026-10-11.csv /tmp/agrigo-geo.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/agrigo-geo.json reports/netherlands/nl-agrigo-official-map-match-2026-10-11.json
            cp /tmp/agrigo-geo.csv reports/netherlands/nl-agrigo-official-map-match-2026-10-11.csv
            git add reports/netherlands/nl-agrigo-official-map-match-2026-10-11.json reports/netherlands/nl-agrigo-official-map-match-2026-10-11.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): Agri Go map exact location reconciliation [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agrigo-public-map-match-${{ github.run_id }}
          path: |
            reports/netherlands/nl-agrigo-official-map-match-2026-10-11.json
            reports/netherlands/nl-agrigo-official-map-match-2026-10-11.csv
          retention-days: 90
