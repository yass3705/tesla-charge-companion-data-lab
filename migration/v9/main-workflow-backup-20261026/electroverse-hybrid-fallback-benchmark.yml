name: TEST NON-TESLA — Electroverse hybrid fallback benchmark
on:
  push:
    paths:
      - tests/non-tesla/active/run-electroverse-hybrid-fallback-benchmark.trigger
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/electroverse_hybrid_fallback_benchmark.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/hybrid-fallback-benchmark.json
          git commit -m "test(electroverse): record hybrid fallback benchmark" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin main
            git push origin HEAD:main && break
            sleep $((i * 2))
          done
