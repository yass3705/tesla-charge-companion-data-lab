name: Audit current V9 afterMinutes thresholds and caps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_after_minutes_current_v9_20261011.cjs
      - .github/workflows/audit-current-v9-after-minutes-20261011.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download current stable production pricing engine (not the old Oct 9 pin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/main/v9-production-runtime/assets/v9/pricing-engine.js' \
            -o /tmp/tcc-v9-current-pricing-engine.js
          test -s /tmp/tcc-v9-current-pricing-engine.js
          node --check /tmp/tcc-v9-current-pricing-engine.js
          node --check scripts/audit_after_minutes_current_v9_20261011.cjs
      - name: Test current engine on all afterMinutes source offers, no promotion
        env:
          CURRENT_ENGINE_ORIGIN: yass3705/tesla-charge-companion-stable@main/v9-production-runtime/assets/v9/pricing-engine.js
        run: node scripts/audit_after_minutes_current_v9_20261011.cjs /tmp/tcc-v9-current-pricing-engine.js
      - name: Archive raw audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-v9-after-minutes-audit
          if-no-files-found: warn
          path: reports/tariff-scenarios/current-v9-after-minutes-audit-2026-10-11.json
      - name: Commit audited outcomes only
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/current-v9-after-minutes-audit-2026-10-11.json /tmp/audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/tariff-scenarios
            cp /tmp/audit.json reports/tariff-scenarios/current-v9-after-minutes-audit-2026-10-11.json
            git add reports/tariff-scenarios/current-v9-after-minutes-audit-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(v9): current afterMinutes engine evidence and unresolved semantics'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
