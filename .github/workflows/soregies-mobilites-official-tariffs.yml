name: Sorégies Mobilités official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "31 9 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/soregies-mobilites-official-tariffs.yml"
      - "scripts/soregies_mobilites_official.py"
      - "scripts/public_safety_check.py"

permissions:
  contents: write

concurrency:
  group: soregies-mobilites-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public-safety scan
        run: python scripts/public_safety_check.py .
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Extract and validate official Sorégies evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/soregies
          python -m py_compile scripts/soregies_mobilites_official.py
          python scripts/soregies_mobilites_official.py 2> >(tee out/soregies/error.log >&2)
          cat out/soregies/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/soregies
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/soregies/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/soregies/latest_diagnostic.json').write_text(json.dumps({'dataset':'soregies-individual-diagnostic','operator':'Sorégies Mobilités','sanitized':True,'runId':'${{ github.run_id }}','errorTail':[x for x in text.splitlines() if x.strip()][-80:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/soregies/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(soregies): publish operator diagnostic [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate output envelope
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/soregies/soregies_mobilites_official_vienne.json').read_text())
          assert p['dataset']=='soregies-mobilites-official-vienne'
          assert p['publicationStatus']=='candidate_validated_source_current_price_manual_check_required'
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['classification']['operator']=='Sorégies'
          assert p['classification']['currentRetailModelAmbiguous'] is True
          g=p['officialGridDated2025_11_01']
          assert g['accessFeeEurPerSession']==0.99
          assert g['rapidUpTo200Kw']['subscriber']['offPeakEurPerKwh']==0.42
          assert g['rapidUpTo200Kw']['public']['peakEurPerKwh']==0.71
          assert g['acceleratedUpTo50Kw']['eurPerMinuteAfter']==0.16
          assert g['normalUpTo22Kw']['timeFeeAfterMinutes']==420
          assert p['currentMarketingOffer']['mobilitesPlusMonthlyEur']==4.99
          assert p['currentMarketingOffer']['mobilitesPlusHeadlineEurPerKwh']==0.22
          assert p['currentMarketingOffer']['classicHeadlineEurPerKwh']==0.27
          assert p['tccDecision']['currentExactCalculatorGridValidated'] is False
          assert len(p['technical']['stationExamplesFromOfficialDataset'])==3
          print('Validated Sorégies evidence; current exact retail mapping remains intentionally unresolved')
          PY
      - name: Publish validated candidate only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/soregies/soregies_mobilites_official_vienne.json')
          dst=Path('data/operator_direct/soregies_mobilites_official_vienne.json')
          rep=Path('reports/soregies/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d): return {k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}}
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
            dst.parent.mkdir(parents=True,exist_ok=True); rep.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(src,dst); shutil.copy2(Path('out/soregies/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .
      - name: Commit Sorégies candidate
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/soregies_mobilites_official_vienne.json reports/soregies/latest_summary.md
          git commit -m "data(soregies): publish verified Vienne tariff evidence [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
