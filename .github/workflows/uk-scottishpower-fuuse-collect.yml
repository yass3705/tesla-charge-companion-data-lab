name: UK ScottishPower Fuuse open data collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-scottishpower-fuuse-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect ScottishPower Recharge Fuuse open data
        run: |
          python - <<'PY'
          import json,gzip,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone

          uuid="e11a667d-c56a-468f-b8d3-a50b41628292"
          base=f"https://api.fuuse.io/opendata/{uuid}"
          def get(path):
              req=urllib.request.Request(base+"/"+path,headers={"User-Agent":"TeslaChargeCompanion/9 ScottishPower-Fuuse","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=75) as r:
                  return json.loads(r.read().decode("utf-8"))
          lp=get("location"); tp=get("tariff")
          def arr(p):
              if isinstance(p,list): return p
              if isinstance(p,dict):
                  for k in ("data","locations","tariffs","items","results"):
                      if isinstance(p.get(k),list): return p[k]
              return []
          locations=arr(lp); tariffs=arr(tp)
          evses=connectors=0; refs=set(); statuses={}; parties=set()
          for loc in locations:
              if not isinstance(loc,dict): continue
              if loc.get("party_id"): parties.add(str(loc["party_id"]))
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1
                  st=str(ev.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  for con in ev.get("connectors") or []:
                      if not isinstance(con,dict): continue
                      connectors+=1
                      for tid in con.get("tariff_ids") or []: refs.add(str(tid))
                      if con.get("tariff_id") is not None: refs.add(str(con["tariff_id"]))
          tids={str(t.get("id")) for t in tariffs if isinstance(t,dict) and t.get("id") is not None}
          missing=sorted(refs-tids)
          retrieved=datetime.now(timezone.utc).isoformat()
          out={"country":"GB","network":"ScottishPower Recharge","retrievedAt":retrieved,"source":"official Fuuse open data","locations":locations,"tariffs":tariffs}
          summary={
            "country":"GB","network":"ScottishPower Recharge","retrievedAt":retrieved,
            "locations":len(locations),"evses":evses,"connectors":connectors,"tariffs":len(tariffs),
            "tariffIdsReferenced":len(refs),"missingTariffIds":missing,
            "partyIdsObserved":sorted(parties),"evseStatuses":statuses,
            "status":"complete" if locations and not missing else "partial"
          }
          Path("data/national").mkdir(parents=True,exist_ok=True); Path("reports/uk").mkdir(parents=True,exist_ok=True)
          with gzip.open("data/national/uk_scottishpower_fuuse.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/scottishpower-fuuse-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not locations: raise SystemExit("no ScottishPower locations")
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_scottishpower_fuuse.json.gz reports/uk/scottishpower-fuuse-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect ScottishPower Recharge Fuuse [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
