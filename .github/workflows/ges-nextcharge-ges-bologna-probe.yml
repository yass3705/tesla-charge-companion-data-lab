name: GES-only NextCharge Bologna probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/ges-italy-probe
    paths:
      - scripts/ges_nextcharge_ges_bologna_probe.py
      - .github/workflows/ges-nextcharge-ges-bologna-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install --disable-pip-version-check selenium
      - name: Probe GES-only Bologna station data
        run: python scripts/ges_nextcharge_ges_bologna_probe.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports/ges_nextcharge_ges_bologna_probe.json')
          assert p.exists() and p.stat().st_size > 500
          r=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(r.get('counts'),ensure_ascii=False,indent=2))
          print(json.dumps(r.get('details'),ensure_ascii=False,indent=2)[:120000])
          assert r['security']['accountCredentialsUsed'] is False
          assert r['security']['sessionTokenSent'] is False
          assert r['security']['captchaBypassed'] is False
          assert r['requestPolicy']['owner'] == 'ITGES'
          assert r['counts']['gridStations'] >= 0
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-ges-bologna-probe
          path: data/reports/ges_nextcharge_ges_bologna_probe.json
          retention-days: 14
