name: Grand Est Molsheim-Mutzig validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/molsheim_mutzig_official.py"
      - ".github/workflows/molsheim-mutzig-grandest-validation.yml"

permissions:
  contents: write

concurrency:
  group: grandest-molsheim-mutzig-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public safety
        run: python scripts/public_safety_check.py .

      - name: Extract current official tariff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/molsheim_mutzig
          python -m py_compile scripts/molsheim_mutzig_official.py
          python scripts/molsheim_mutzig_official.py --out out/molsheim_mutzig 2> >(tee out/molsheim_mutzig/error.log >&2)

      - name: Validate classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/molsheim_mutzig/molsheim_mutzig_official_grandest.json').read_text())
          assert p['dataset']=='molsheim-mutzig-official-grandest'
          assert p['operatorDirect']['energy']['eurPerStartedKwh']==0.38
          assert p['operatorDirect']['idle']['denseZones']['thresholdAfterChargeStartMinutes']==390
          assert p['operatorDirect']['idle']['denseZones']['eurPer15MinutesWithoutEnergy']==0.40
          assert p['operatorDirect']['idle']['nonDenseZones']['thresholdAfterChargeStartMinutes']==870
          assert p['operatorDirect']['idle']['nonDenseZones']['eurPer15MinutesWithoutEnergy']==0.40
          assert p['tccDecision']['directTariffClassable'] is True
          assert p['tccDecision']['startedKwhRoundingMustBeModeled'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          PY

      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/molsheim_mutzig
          cp out/molsheim_mutzig/molsheim_mutzig_official_grandest.json data/operator_direct/molsheim_mutzig_official_grandest.json
          cp out/molsheim_mutzig/SUMMARY.md reports/molsheim_mutzig/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/molsheim_mutzig_official_grandest.json reports/molsheim_mutzig/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(molsheim-mutzig): publish official Grand Est tariff [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/molsheim_mutzig
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/molsheim_mutzig/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/molsheim_mutzig/latest_diagnostic.json').write_text(json.dumps({'dataset':'molsheim-mutzig-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/molsheim_mutzig
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/molsheim_mutzig/latest_run_status.json').write_text(json.dumps({'dataset':'molsheim-mutzig-run-status','operator':'CCRMM Molsheim-Mutzig','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/molsheim_mutzig/latest_run_status.json reports/molsheim_mutzig/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(molsheim-mutzig): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
