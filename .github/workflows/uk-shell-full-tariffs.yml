name: UK Shell full tariff collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-full-tariffs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-shell-full-tariffs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect Shell and ubitricity tariffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ.get("SHELL_EV_CLIENT_ID")
          secret=os.environ.get("SHELL_EV_CLIENT_SECRET")
          if not cid or not secret:
              raise SystemExit("SHELL_EV_CLIENT_ID / SHELL_EV_CLIENT_SECRET missing")

          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Full-Tariffs"
          PROVIDER_ID="Shell_RP_2"
          MIN_INTERVAL=7.5
          last=0.0

          def throttle():
              global last
              now=time.monotonic()
              wait=MIN_INTERVAL-(now-last)
              if wait>0:
                  time.sleep(wait)
              last=time.monotonic()

          token=None
          token_refreshes=0

          def refresh_token():
              global token, token_refreshes
              throttle()
              form=urllib.parse.urlencode({
                  "client_id":cid,
                  "client_secret":secret,
                  "grant_type":"client_credentials"
              }).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Accept":"application/json",
                  "User-Agent":UA
              })
              with urllib.request.urlopen(req,timeout=30) as rr:
                  tok=json.loads(rr.read().decode("utf-8"))
              token=tok["access_token"]
              token_refreshes+=1
              return tok

          refresh_token()

          def fetch_detail_once(uid):
              throttle()
              url=BASE+"/v2/locations/"+urllib.parse.quote(str(uid),safe="")+"?"+urllib.parse.urlencode({"providerId":PROVIDER_ID})
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as rr:
                      return rr.status,json.loads(rr.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  return e.code,{"errorBody":e.read().decode("utf-8","replace")[:3000]}
              except Exception as e:
                  return 0,{"error":repr(e)}

          def fetch_detail(uid):
              status,body=fetch_detail_once(uid)
              if status==401:
                  # OAuth token can expire during a long national pass.
                  refresh_token()
                  status,body=fetch_detail_once(uid)
              return status,body

          inv_path=Path("data/national/uk_shell_ev_public_locations.json.gz")
          if not inv_path.exists():
              raise SystemExit("Missing UK Shell inventory dataset")

          with gzip.open(inv_path,"rt",encoding="utf-8") as g:
              inv=json.load(g)
          locations=inv.get("locations") or []

          targets=[]
          for loc in locations:
              op=str(loc.get("operatorName") or "")
              oid=str(loc.get("operatorId") or "")
              if op in ("Migration Shell Recharge","Shell Recharge") or oid.upper().startswith(("DE*UBI","GB*UBI","GB*TNM","GB*SHE")):
                  uid=loc.get("uid") or loc.get("externalId")
                  if uid:
                      targets.append({
                          "uid":str(uid),
                          "operatorId":loc.get("operatorId"),
                          "operatorName":loc.get("operatorName"),
                          "address":loc.get("address")
                      })

          # Stable dedupe by location UID.
          uniq={}
          for x in targets:
              uniq[x["uid"]]=x
          targets=list(uniq.values())

          existing={}
          out_path=Path("data/national/uk_shell_tariffs.json.gz")
          if out_path.exists():
              try:
                  with gzip.open(out_path,"rt",encoding="utf-8") as g:
                      old=json.load(g)
                  existing={x.get("uid"):x for x in old.get("locations",[]) if x.get("uid")}
              except Exception:
                  existing={}

          results=[]
          stats={"http200":0,"http429":0,"otherHttp":0,"withTariff":0,"withoutTariff":0,"tariffObjects":0,"connectors":0}
          now=datetime.now(timezone.utc).isoformat()

          for i,t in enumerate(targets,1):
              uid=t["uid"]
              status,body=fetch_detail(uid)
              rec={**t,"httpStatus":status,"retrievedAt":now,"providerId":PROVIDER_ID,"tariffs":[],"connectorCount":0}
              if status==200 and isinstance(body,dict):
                  stats["http200"]+=1
                  data=body.get("data")
                  if isinstance(data,list) and data:
                      data=data[0]
                  if isinstance(data,dict):
                      rec["location"]=data
                      for ev in data.get("evses") or []:
                          for conn in ev.get("connectors") or []:
                              rec["connectorCount"]+=1
                              ts=conn.get("tariffs") or []
                              for tariff in ts:
                                  rec["tariffs"].append({
                                      "evseId":ev.get("evseId"),
                                      "evseUid":ev.get("uid"),
                                      "connectorUid":conn.get("uid"),
                                      "tariff":tariff
                                  })
                  stats["connectors"]+=rec["connectorCount"]
                  stats["tariffObjects"]+=len(rec["tariffs"])
                  if rec["tariffs"]:
                      stats["withTariff"]+=1
                  else:
                      stats["withoutTariff"]+=1
              elif status==429:
                  stats["http429"]+=1
                  rec["error"]=body
              else:
                  stats["otherHttp"]+=1
                  rec["error"]=body

              results.append(rec)
              print(f"[{i}/{len(targets)}] {uid} HTTP {status} tariffs={len(rec['tariffs'])}",flush=True)

          payload={
              "retrievedAt":now,
              "source":"Shell EV Public Locations v2.1.2 sandbox",
              "providerId":PROVIDER_ID,
              "targetCount":len(targets),
              "locations":results
          }
          with gzip.open(out_path,"wt",encoding="utf-8") as g:
              json.dump(payload,g,ensure_ascii=False,separators=(",",":"))

          report={
              "retrievedAt":now,
              "providerId":PROVIDER_ID,
              "targetCount":len(targets),
              **stats,
              "coveragePct":round(100*stats["withTariff"]/len(targets),2) if targets else 0,
              "failClosedCount":stats["withoutTariff"]+stats["http429"]+stats["otherHttp"],
              "tokenRefreshCount":token_refreshes,
              "noTariffUids":[x["uid"] for x in results if x["httpStatus"]==200 and not x["tariffs"]],
              "errorUids":[x["uid"] for x in results if x["httpStatus"]!=200]
          }
          Path("reports/uk/shell-full-tariffs-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish tariff dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_shell_tariffs.json.gz reports/uk/shell-full-tariffs-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Shell and ubitricity tariffs [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
