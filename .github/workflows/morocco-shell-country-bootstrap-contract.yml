name: Morocco Shell country bootstrap contract

on:
  push:
    paths:
      - '.github/workflows/morocco-shell-country-bootstrap-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Decompile and isolate getCountries contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shellcountry /tmp/jadx
          mkdir -p /tmp/shellcountry reports/morocco/shell
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0'             'https://d.apkpure.net/b/APK/com.shell.shell_loyalty_app.morocco?version=latest'             -o /tmp/shellcountry/app.apk
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240             'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'             -o /tmp/shellcountry/jadx.zip
          unzip -q /tmp/shellcountry/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/shellcountry/out /tmp/shellcountry/app.apk >/dev/null 2>&1 || true
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/tmp/shellcountry/out/sources')
          hits=[]
          for p in root.rglob('*.java'):
              try:t=p.read_text(errors='ignore')
              except:continue
              if 'getCountries/v1' in t or re.search(r'(?i)(Country.*Request|Countries.*Request|AppConfig.*Request)',t):
                  # redact any direct secret literals
                  t=re.sub(r'(?i)(apiKey\s*[=:]\s*")[^"]+(")',r'\1<redacted>\2',t)
                  hits.append({'file':str(p.relative_to(root)),'source':t[:50000]})
          # Find constructor call sites for request classes found above.
          names=set()
          for h in hits:
              for m in re.finditer(r'class\s+([A-Za-z0-9_$]+)',h['source']):
                  n=m.group(1)
                  if re.search(r'(?i)(country|config).*request',n):names.add(n)
          calls=[]
          for p in root.rglob('*.java'):
              try:t=p.read_text(errors='ignore')
              except:continue
              if any(('new '+n+'(') in t for n in names) or 'getCountries/v1' in t:
                  chunks=[]
                  for n in names:
                      idx=t.find('new '+n+'(')
                      if idx>=0:chunks.append(t[max(0,idx-5000):idx+12000])
                  if 'getCountries/v1' in t:
                      idx=t.find('getCountries/v1');chunks.append(t[max(0,idx-5000):idx+12000])
                  calls.append({'file':str(p.relative_to(root)),'chunks':chunks[:10]})
          report={'schema_version':1,'generated_at':datetime.now(timezone.utc).isoformat(),'client':{'package':'com.shell.shell_loyalty_app.morocco','version':'3.2.7'},'request_class_names':sorted(names),'files':hits,'call_sites':calls}
          Path('reports/morocco/shell/country-bootstrap-contract-2026-09-27.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf /tmp/shellcountry /tmp/jadx
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/shell/country-bootstrap-contract-2026-09-27.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "diag(morocco): isolate Shell country bootstrap contract [run $GITHUB_RUN_ID]" || exit 0
          git pull --rebase origin main
          git push origin main
