name: UK Monta open-data collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-monta-open-data-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-monta-open-data-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect Monta MON UK open data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json,gzip,urllib.request,urllib.parse,time
          from datetime import datetime,timezone
          from pathlib import Path

          BASE="https://public-api.monta.com/api/v1/open-data/locations"
          UA="TeslaChargeCompanion/9 UK-Monta-collector"
          rows=[]; after=None; pages=0; seen=set()
          while True:
              q={"per_page":"100","party_id":"MON"}
              if after is not None: q["after"]=str(after)
              url=BASE+"?"+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  p=json.loads(r.read().decode("utf-8"))
              batch=p.get("data") if isinstance(p,dict) else None
              if not isinstance(batch,list): raise SystemExit(f"unexpected payload at {url}")
              for x in batch:
                  if not isinstance(x,dict): continue
                  k=str(x.get("id"))
                  if k not in seen:
                      seen.add(k); rows.append(x)
              pages+=1
              pag=((p.get("meta") or {}).get("pagination") or {}) if isinstance(p,dict) else {}
              has_more=bool(pag.get("has_more"))
              nxt=pag.get("after")
              if not has_more or not batch: break
              if nxt is None or str(nxt)==str(after): raise SystemExit("cursor did not advance")
              after=nxt
              if pages>1000: raise SystemExit("pagination guard")
              time.sleep(0.25)

          # Keep only GB records defensively even though MON is a UK party id.
          gb=[x for x in rows if str(x.get("country_code") or "").upper()=="GB" or str(x.get("country") or "").upper() in ("GB","GBR","UNITED KINGDOM")]
          if gb: rows=gb

          evses=connectors=0; statuses={}; tariff_ids=set(); parties=set()
          for loc in rows:
              if loc.get("party_id"): parties.add(str(loc["party_id"]))
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1; st=str(ev.get("status") or "UNKNOWN"); statuses[st]=statuses.get(st,0)+1
                  for c in ev.get("connectors") or []:
                      if not isinstance(c,dict): continue
                      connectors+=1
                      for tid in c.get("tariff_ids") or []: tariff_ids.add(str(tid))
                      if c.get("tariff_id") is not None: tariff_ids.add(str(c.get("tariff_id")))

          out={"country":"GB","network":"Monta","partyId":"MON","retrievedAt":datetime.now(timezone.utc).isoformat(),"locations":rows}
          summary={"country":"GB","network":"Monta","partyId":"MON","retrievedAt":out["retrievedAt"],
                   "pages":pages,"locations":len(rows),"evses":evses,"connectors":connectors,
                   "partyIdsObserved":sorted(parties),"evseStatuses":statuses,
                   "tariffIdsReferenced":sorted(tariff_ids),
                   "status":"locations_complete_tariffs_pending" if rows else "failed_empty"}
          with gzip.open("data/national/uk_monta_mon_locations.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/monta-open-data-collect-latest.json").write_text(json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,indent=2))
          if not rows: raise SystemExit("no MON locations")
          PY
      - name: Publish dataset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_monta_mon_locations.json.gz reports/uk/monta-open-data-collect-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Monta MON locations [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
