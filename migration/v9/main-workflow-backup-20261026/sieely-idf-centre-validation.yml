name: SIE-ELY IDF-Centre validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sieely_official.py"
      - ".github/workflows/sieely-idf-centre-validation.yml"

permissions:
  contents: write

concurrency:
  group: sieely-idf-centre-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/sieely
          python -m py_compile scripts/sieely_official.py
          python scripts/sieely_official.py --out out/sieely 2> >(tee out/sieely/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/sieely/sieely_official_idf_centre.json').read_text())
          assert p['dataset']=='sieely-official-idf-centre'
          assert p['classification']['directPublicTariff'] is True
          a=p['directTariff']['upTo7_4Kw']; b=p['directTariff']['upTo22Kw']
          assert a['connectionFeeEur']==1.0 and a['energyEurPerKwh']==0.30
          assert a['parkingDay0800To2000EurPerHour']==0.50 and a['parkingNight2000To0800EurPerHour']==0.0
          assert b['connectionFeeEur']==1.0 and b['energyEurPerKwh']==0.30
          assert b['parkingDay0800To2000First2HoursEurPerHour']==1.0
          assert b['parkingDay0800To2000After2HoursEurPerHour']==4.0
          assert b['parkingNight2000To0800EurPerHour']==0.30
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['sourceEvidence']['tariffValuesHumanValidatedFromFirstPartyAssets'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/sieely
          cp out/sieely/sieely_official_idf_centre.json data/operator_direct/sieely_official_idf_centre.json
          cp out/sieely/SUMMARY.md reports/sieely/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/sieely_official_idf_centre.json reports/sieely/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(sieely): publish official IDF-Centre tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/sieely
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/sieely/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/sieely/latest_diagnostic.json').write_text(json.dumps({'dataset':'sieely-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/sieely
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/sieely/latest_run_status.json').write_text(json.dumps({'dataset':'sieely-run-status','operator':'SIE-ELY','regions':['Ile-de-France','Centre-Val de Loire'],'runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sieely/latest_run_status.json reports/sieely/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(sieely): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
