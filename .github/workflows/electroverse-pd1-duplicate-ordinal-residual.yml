name: Audit Electroverse FR PD1 duplicate ordinals
on:
  push:
    branches:
      - audit/electroverse-pd1-duplicate-ordinal-residual
    paths:
      - "scripts/audit_electroverse_pd1_duplicate_ordinal_residual.mjs"
      - ".github/workflows/electroverse-pd1-duplicate-ordinal-residual.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit PD1 duplicate ordinals
        run: node scripts/audit_electroverse_pd1_duplicate_ordinal_residual.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-pd1-duplicate-ordinal-residual.json
          git commit -m "audit: publish PD1 duplicate ordinal residual report" || exit 0
          git push
