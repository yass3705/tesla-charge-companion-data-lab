name: TEST NON-TESLA — Electroverse change marker probe
on:
  push:
    paths:
      - tests/non-tesla/active/run-electroverse-change-marker-probe.trigger
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/electroverse_change_marker_probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/change-marker-probe.json
          git commit -m "test(electroverse): record change marker probe" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
