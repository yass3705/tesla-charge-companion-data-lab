name: Qovoltis guest station API probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-guest-api-key-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract current mobile client key at runtime
        id: client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work probe
          curl -sS -L --max-time 180 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=50012' \
            -o work/app.xapk
          unzip -q work/app.xapk -d work/xapk
          BASE=$(find work/xapk -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          unzip -p "$BASE" assets/index.android.bundle > work/index.android.bundle
          KEY=$(strings -a work/index.android.bundle | grep -Eo 'qvk_live_[A-Za-z0-9_-]+' | head -1 || true)
          if [ -z "$KEY" ]; then
            echo 'Current mobile client key not found' >&2
            exit 1
          fi
          echo "key_length=${#KEY}" > probe/client-key-status.txt
          echo "key_present=true" >> probe/client-key-status.txt
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Probe public configuration and direct station endpoints
        env:
          MOBILE_KEY: ${{ steps.client.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, json
          key=os.environ['MOBILE_KEY']
          base='https://qorest.qovoltis.com/api'
          tests=[
            ('GET','/v1/configurations/public',None),
            ('GET','/v2/evcps/stations?station_id=TEST&type=QOVOLTIS',None),
            ('GET','/v2/evcps/stations?type=QOVOLTIS',None),
            ('POST','/v1/evcps/emsp-stations?emsp=QOVOLTIS&side=25&minlat=48.70&minlng=2.00',{}),
            ('POST','/v1/evcps/emsp-stations?emsp=QOV&side=25&minlat=48.70&minlng=2.00',{}),
            ('POST','/v1/evcps/emsp-stations?emsp=QVI&side=25&minlat=48.70&minlng=2.00',{}),
          ]
          out=[]
          for i,(method,path,payload) in enumerate(tests,1):
              body=Path(f'probe/test-{i}.body')
              cmd=['curl','-sS','--max-time','25','-A','Qovoltis/5.0.1','-H','Accept: application/json','-H',f'X-API-KEY: {key}','-o',str(body),'-w','%{http_code}|%{content_type}',base+path]
              if method=='POST':
                  cmd[1:1]=['-X','POST','-H','Content-Type: application/json','--data',json.dumps(payload,separators=(',',':'))]
              try:
                  meta=subprocess.check_output(cmd,text=True).strip()
              except subprocess.CalledProcessError as e:
                  meta=(e.output or 'ERR').strip()
              txt=body.read_text(errors='replace') if body.exists() else ''
              out.append({'method':method,'path':path,'meta':meta,'bytes':len(txt.encode()),'sample':txt[:12000]})
          Path('probe/initial-results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          for r in out:
              print(r['meta'],r['bytes'],r['method'],r['path'],repr(r['sample'][:600]))
          PY

      - name: Find Toussus candidate and retrieve direct preview
        env:
          MOBILE_KEY: ${{ steps.client.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,json,re,subprocess
          key=os.environ['MOBILE_KEY']
          base='https://qorest.qovoltis.com/api'
          res=json.loads(Path('probe/initial-results.json').read_text())
          candidates=[]
          for r in res:
              if 'emsp-stations' not in r['path'] or not r['meta'].startswith('200|'):
                  continue
              try: obj=json.loads(r['sample'])
              except Exception: continue
              def walk(x,path=''):
                  if isinstance(x,dict):
                      text=json.dumps(x,ensure_ascii=False)
                      low=text.lower()
                      if any(k in low for k in ('toussus','78117','aérodrome','aerodrome','air & co','air and co')):
                          candidates.append({'path':path,'object':x})
                      for k,v in x.items(): walk(v,path+'/'+str(k))
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,path+'/'+str(i))
              walk(obj)
          Path('probe/toussus-candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          ids=[]
          for c in candidates:
              o=c['object']
              for k,v in o.items():
                  if isinstance(v,(str,int)) and any(t in k.lower() for t in ('station','id','reference','ref')):
                      s=str(v)
                      if 1 <= len(s) <= 120: ids.append(s)
          ids=list(dict.fromkeys(ids))[:20]
          previews=[]
          for j,sid in enumerate(ids,1):
              url=base+'/v2/evcps/stations?station_id='+sid+'&type=QOVOLTIS'
              body=Path(f'probe/preview-{j}.body')
              cmd=['curl','-sS','--max-time','25','-A','Qovoltis/5.0.1','-H','Accept: application/json','-H',f'X-API-KEY: {key}','-o',str(body),'-w','%{http_code}|%{content_type}',url]
              try: meta=subprocess.check_output(cmd,text=True).strip()
              except subprocess.CalledProcessError as e: meta=(e.output or 'ERR').strip()
              txt=body.read_text(errors='replace') if body.exists() else ''
              previews.append({'station_id':sid,'meta':meta,'bytes':len(txt.encode()),'body':txt[:30000]})
          Path('probe/toussus-previews.json').write_text(json.dumps(previews,ensure_ascii=False,indent=2),encoding='utf-8')
          print('candidate_objects',len(candidates),'candidate_ids',len(ids))
          for p in previews:
              low=p['body'].lower()
              tariff_hit=any(x in low for x in ('0.20','0.2','0.27','pricing','tariff','price','kwh'))
              print(p['meta'],p['station_id'],'tariff_like='+str(tariff_hit),repr(p['body'][:1000]))
          PY

      - name: Upload sanitized responses
        uses: actions/upload-artifact@v4
        with:
          name: qovoltis-guest-api-key-probe
          path: |
            probe/client-key-status.txt
            probe/initial-results.json
            probe/toussus-candidates.json
            probe/toussus-previews.json
            probe/test-*.body
            probe/preview-*.body
          retention-days: 3
