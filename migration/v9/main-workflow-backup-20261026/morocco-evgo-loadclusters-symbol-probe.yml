name: Morocco EVGO loadClusters symbol probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_evgo_loadclusters_symbol_probe.py"
      - ".github/workflows/morocco-evgo-loadclusters-symbol-probe.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-loadclusters-symbol-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_evgo_loadclusters_symbol_probe.py
      - name: Run static-only probe
        run: python scripts/morocco_evgo_loadclusters_symbol_probe.py
      - name: Persist sanitized report
        run: |
          test -s artifacts/morocco-evgo-loadclusters-symbols/summary.json
          python scripts/public_safety_check.py artifacts/morocco-evgo-loadclusters-symbols
          mkdir -p reports/morocco/evgo
          cp artifacts/morocco-evgo-loadclusters-symbols/summary.json reports/morocco/evgo/latest-loadclusters-symbols.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-loadclusters-symbols.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(morocco): update EVGO loadClusters symbols [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
