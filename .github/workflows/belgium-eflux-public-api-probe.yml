name: Belgium E-Flux public API probe
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-eflux-public-api-probe.txt"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_eflux_public_api_probe.py
      - name: Persist sanitized report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/road/eflux-public-api-probe-2026-09-29.json
          git commit -m "Probe E-Flux public map API" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
