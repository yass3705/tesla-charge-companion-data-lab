name: Build Electroverse final residual recovery plan
on:
  push:
    branches:
      - electroverse-final-residual-recovery-lab
    paths:
      - "scripts/build_electroverse_final_residual_recovery_plan.mjs"
      - ".github/workflows/electroverse-final-residual-recovery-plan.yml"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build recovery plan
        run: node scripts/build_electroverse_final_residual_recovery_plan.mjs
      - name: Persist recovery plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/validated-mappings/final-residual-recovery-plan.json
          git commit -m "audit: persist final Electroverse residual recovery plan" || exit 0
          git pull --rebase origin electroverse-final-residual-recovery-lab
          git push
