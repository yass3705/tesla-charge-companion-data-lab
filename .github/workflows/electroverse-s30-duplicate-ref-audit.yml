name: Audit Electroverse France S30 duplicate references
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_electroverse_s30_duplicate_refs.mjs"
      - ".github/workflows/electroverse-s30-duplicate-ref-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit S30 duplicate physical references
        run: node scripts/audit_electroverse_s30_duplicate_refs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-s30-duplicate-ref-audit
          path: reports/electroverse/s30-duplicate-physicalref-analysis.json
          retention-days: 14
