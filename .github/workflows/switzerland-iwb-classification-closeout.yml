name: Switzerland IWB classification closeout
on:
  push:
    paths:
      - 'scripts/finalize_swiss_iwb_classification.py'
      - '.github/workflows/switzerland-iwb-classification-closeout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/finalize_swiss_iwb_classification.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-iwb-finalization-2026-09-28.json
          git commit -m 'docs(switzerland): classify IWB owner scope' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
