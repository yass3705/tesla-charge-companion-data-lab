name: AVIA Picoty live guest route probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_guest_live_probe.py"
      - ".github/workflows/avia-picoty-guest-live-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe live guest routes without credentials
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_guest_live_probe.py
          python scripts/avia_picoty_guest_live_probe.py
      - name: Validate read-only report
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_guest_live_probe.json')
          d=json.loads(p.read_text())
          assert d['credentialsSent'] is False and d['writeMethodsUsed'] is False
          assert d['results']
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}',p.read_text())
          print([(x['kind'],x.get('sample'),x['host'],x['prefix'],x['response']['status']) for x in d['results']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-guest-live-probe
          path: data/reports/avia_picoty_guest_live_probe.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_guest_live_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe AVIA Picoty live guest routes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
