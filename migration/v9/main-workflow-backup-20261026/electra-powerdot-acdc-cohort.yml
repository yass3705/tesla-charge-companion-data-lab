name: Powerdot AC DC rigorous cohort audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/france/audit_powerdot_acdc_strict_cohort.mjs"
      - ".github/workflows/electra-powerdot-acdc-cohort.yml"
permissions:
  contents: write
concurrency:
  group: powerdot-acdc-strict-cohort
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derive AC/DC evidence from exact national IRVE EVSE identities
        run: node scripts/france/audit_powerdot_acdc_strict_cohort.mjs
      - name: Save evaluated cohort only, no price publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/electra/powerdot-acdc-strict-cohort-audit-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: guard Powerdot per-EVSE AC/DC price family using explicit connector kinds'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
