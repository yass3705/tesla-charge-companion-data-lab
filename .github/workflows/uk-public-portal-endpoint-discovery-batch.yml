name: UK public portal endpoint discovery batch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-public-portal-endpoint-discovery-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect public portals and bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9 UK-public-discovery"
          targets=[
            ("Believ","https://charge.believ.com/"),
            ("Qwello","https://qwello.uk/"),
            ("EZ-Charge","https://ez-charge.co.uk/drivers/"),
            ("RAW Charging","https://rawcharging.com/find-a-charger/"),
            ("Connekt","https://www.connektcharging.com/"),
          ]
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status,r.geturl(),r.read(5_000_000).decode("utf-8","replace"),dict(r.headers.items())

          def sanitize(text):
              text=str(text)
              text=re.sub(r'(?i)([?&](?:code|key|token|sig|signature|subscription[-_]?key|api[-_]?key)=)[^&#"\\'\\s]+', r'\\1[REDACTED]', text)
              text=re.sub(r'(?i)((?:api[-_ ]?key|function[-_ ]?key|token|secret|client[-_ ]?secret|subscription[-_ ]?key)["\\']?\\s*[:=]\\s*["\\']?)[A-Za-z0-9._~+/-]{16,}', r'\\1[REDACTED]', text)
              text=re.sub(r'(?i)(x-functions-key["\\']?\\s*[:=]\\s*["\\']?)[^"\\'\\s,}]+', r'\\1[REDACTED]', text)
              return text
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"targets":[]}
          for name,url in targets:
              item={"name":name,"url":url,"assets":[],"candidates":[]}
              try:
                  st,final,html,h=get(url)
                  item.update({"status":st,"finalUrl":final,"htmlBytes":len(html)})
                  bodies=[("html",html)]
                  srcs=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
                  for s in srcs[:40]:
                      a={"url":s}
                      try:
                          ast,afinal,body,ah=get(s); a.update({"status":ast,"bytes":len(body)})
                          bodies.append((s,body))
                      except Exception as e: a["error"]=f"{type(e).__name__}: {e}"
                      item["assets"].append(a)
                  cand=[]
                  for source,body in bodies:
                      urls=set(re.findall(r'https?://[^"\'\s<>()\\]+',body))
                      rels=set(re.findall(r'["\']([^"\']{1,240})["\']',body))
                      for x in list(urls)+list(rels):
                          xl=x.lower()
                          if any(k in xl for k in ("api","graphql","ocpi","station","charger","chargepoint","location","tariff","price","map","evse","socket")):
                              if not xl.startswith("data:"):
                                  cand.append({"source":source,"value":sanitize(x[:500])})
                  # contexts for call sites
                  contexts=[]
                  for source,body in bodies:
                      for needle in ("fetch(","axios","$.ajax","getJSON(","graphql","ocpi","tariff","chargepoint","locations","stations"):
                          for m in re.finditer(re.escape(needle),body,re.I):
                              contexts.append({"source":source,"needle":needle,"context":sanitize(body[max(0,m.start()-350):min(len(body),m.end()+700)])})
                              if len(contexts)>=250: break
                          if len(contexts)>=250: break
                      if len(contexts)>=250: break
                  # dedupe
                  seen=set(); uniq=[]
                  for c in cand:
                      k=(c["source"],c["value"])
                      if k not in seen:
                          seen.add(k); uniq.append(c)
                  item["candidates"]=uniq[:500]
                  item["contexts"]=contexts[:250]
              except Exception as e:
                  item["error"]=f"{type(e).__name__}: {e}"
              out["targets"].append(item)
          Path("reports/uk/public-portal-endpoint-discovery-batch-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2)[:180000])
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/public-portal-endpoint-discovery-batch-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover public portal endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
