name: UK Mer and Go Zero validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-mer-gozero-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate feeds
        shell: bash
        run: |
          set +e
          mkdir -p artifacts reports/uk data/national
          python scripts/collect_uk_validated_open_feeds.py \
            --only "Mer UK" --only "Go Zero" \
            --output artifacts/uk-mer-gozero.json
          rc=$?
          python - <<'PY'
          import json,gzip
          from pathlib import Path
          src=Path("artifacts/uk-mer-gozero.json")
          if not src.exists(): raise SystemExit("no collector output")
          p=json.loads(src.read_text())
          report={
            "country":"GB","retrievedAt":p.get("retrievedAt"),
            "summary":p.get("summary"),"failures":p.get("failures",[]),
            "sources":[{"name":x.get("name"),"summary":x.get("summary"),"endpoints":x.get("endpoints")} for x in p.get("sources",[])]
          }
          Path("reports/uk/mer-gozero-validation-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          with gzip.open("data/national/uk_mer_gozero.json.gz","wt",encoding="utf-8") as g:
            json.dump(p,g,ensure_ascii=False,separators=(",",":"))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          exit $rc
      - name: Publish even if partial
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/mer-gozero-validation-latest.json data/national/uk_mer_gozero.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): validate Mer and Go Zero [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
