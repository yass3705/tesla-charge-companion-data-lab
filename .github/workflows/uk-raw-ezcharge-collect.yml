name: UK RAW and EZ Charge collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-raw-ezcharge-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Collect EZ-Charge public site data and RAW public OCPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk data/national
          python - <<'PY'
          import json,re,gzip,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          now=datetime.now(timezone.utc).isoformat()
          summary={"retrievedAt":now}

          def fetch(url,headers=None,limit=8_000_000):
              h={"User-Agent":UA,"Accept":"application/json,text/html,application/javascript,*/*"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=75) as r:
                  return r.status,r.geturl(),r.read(limit),dict(r.headers.items())

          # EZ-Charge: public blob used by official driver page.
          ezurl="https://ezchargesitedata.blob.core.windows.net/public/site-areas.json"
          ez={"source":ezurl}
          try:
              st,final,raw,h=fetch(ezurl)
              p=json.loads(raw.decode("utf-8-sig"))
              areas=p.get("siteAreas") if isinstance(p,dict) else None
              if not isinstance(areas,list): areas=[]
              ez.update({"httpStatus":st,"siteAreas":len(areas),
                         "topLevelKeys":list(p)[:30] if isinstance(p,dict) else [],
                         "firstAreaKeys":list(areas[0])[:80] if areas and isinstance(areas[0],dict) else []})
              price_fields={}; coord_fields={}; statuses={}
              def walk(x):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          kl=str(k).lower()
                          if any(w in kl for w in ("price","tariff","cost","fee","rate")): price_fields[kl]=price_fields.get(kl,0)+1
                          if any(w in kl for w in ("lat","lon","lng","coordinate")): coord_fields[kl]=coord_fields.get(kl,0)+1
                          if kl=="status": statuses[str(v)]=statuses.get(str(v),0)+1
                          walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(areas)
              ez.update({"pricingFields":price_fields,"coordinateFields":coord_fields,"statusValues":statuses,
                         "status":"inventory_source_usable" if areas else "empty"})
              with gzip.open("data/national/uk_ezcharge_site_areas.json.gz","wt",encoding="utf-8") as g:
                  json.dump({"retrievedAt":now,"source":ezurl,"siteAreas":areas},g,ensure_ascii=False,separators=(",",":"))
          except Exception as e:
              ez.update({"status":"failed","error":f"{type(e).__name__}: {e}"})
          summary["EZ-Charge"]=ez

          # RAW: discover public runtime client config in memory only.
          rawsum={}
          try:
              st,final,htmlb,h=fetch("https://rawcharging.com/")
              html=htmlb.decode("utf-8","replace")
              scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
              bodies=[]
              for s in scripts[:80]:
                  try:
                      _,_,b,_=fetch(s,limit=6_000_000)
                      txt=b.decode("utf-8","replace")
                      if "/ocpi/locations" in txt or "reservations-prod-functionapp-flex.azurewebsites.net" in txt:
                          bodies.append(txt)
                  except Exception: pass
              combined="\n".join(bodies)
              hostm=re.search(r'https://reservations-prod-functionapp-flex\.azurewebsites\.net',combined,re.I)
              if not hostm: raise RuntimeError("RAW API host not recovered")
              base=hostm.group(0)
              # Function code/key may be embedded as a query parameter in the public web client.
              # Capture only in memory; never persist/log it.
              key=None
              for pat in [
                  r'[?&]code=([A-Za-z0-9._~+/%=-]{12,})',
                  r'["\']x-functions-key["\']\s*[:,]\s*["\']([^"\']+)["\']',
                  r'NEXT_PUBLIC_[A-Z0-9_]*(?:KEY|CODE)[^"\']*["\']([^"\']{12,})["\']'
              ]:
                  m=re.search(pat,combined,re.I)
                  if m:
                      key=urllib.parse.unquote(m.group(1)); break

              def rawcall(path):
                  candidates=[]
                  # First anonymous; then public-client function key if needed.
                  for mode in ("anon","key"):
                      if mode=="key" and not key: continue
                      u=base+"/api"+path
                      headers={"Origin":"https://rawcharging.com","Referer":"https://rawcharging.com/"}
                      if mode=="key": headers["x-functions-key"]=key
                      try:
                          st,fu,b,h=fetch(u,headers=headers)
                          return st,json.loads(b.decode("utf-8")),mode
                      except urllib.error.HTTPError as e:
                          candidates.append({"mode":mode,"status":e.code})
                      except Exception as e:
                          candidates.append({"mode":mode,"error":type(e).__name__})
                  raise RuntimeError("RAW endpoint unavailable "+json.dumps(candidates))

              lp,lobj,lmode=rawcall("/ocpi/locations")
              tp,tobj,tmode=rawcall("/ocpi/tariffs/GB/CPIE")
              def arr(x):
                  if isinstance(x,list): return x
                  if isinstance(x,dict):
                      for k in ("data","locations","tariffs","items","results"):
                          if isinstance(x.get(k),list): return x[k]
                  return []
              locs=arr(lobj); tariffs=arr(tobj)
              refs=set(); tids={str(x.get("id")) for x in tariffs if isinstance(x,dict) and x.get("id") is not None}
              evses=connectors=0; statuses={}; parties=set()
              for loc in locs:
                  if not isinstance(loc,dict): continue
                  if loc.get("party_id"): parties.add(str(loc.get("party_id")))
                  for ev in loc.get("evses") or []:
                      if not isinstance(ev,dict): continue
                      evses+=1; ss=str(ev.get("status") or "UNKNOWN"); statuses[ss]=statuses.get(ss,0)+1
                      for con in ev.get("connectors") or []:
                          if not isinstance(con,dict): continue
                          connectors+=1
                          for tid in con.get("tariff_ids") or []: refs.add(str(tid))
                          if con.get("tariff_id") is not None: refs.add(str(con.get("tariff_id")))
              missing=sorted(refs-tids)
              rawsum={"apiHost":base,"locationsHttp":lp,"tariffsHttp":tp,
                      "accessMode":"anonymous" if lmode=="anon" and tmode=="anon" else "public_web_client_runtime_key",
                      "locations":len(locs),"evses":evses,"connectors":connectors,"tariffs":len(tariffs),
                      "partyIdsObserved":sorted(parties),"evseStatuses":statuses,
                      "referencedTariffIds":len(refs),"resolvedTariffIds":len(refs & tids),"missingTariffIds":missing,
                      "status":"complete" if locs and not missing else ("partial" if locs else "empty")}
              with gzip.open("data/national/uk_raw_charging_ocpi.json.gz","wt",encoding="utf-8") as g:
                  json.dump({"retrievedAt":now,"source":base+"/api/ocpi","locations":locs,"tariffs":tariffs},g,ensure_ascii=False,separators=(",",":"))
          except Exception as e:
              rawsum={"status":"failed","error":f"{type(e).__name__}: {e}"}
          summary["RAW Charging"]=rawsum

          Path("reports/uk/raw-ezcharge-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Publish sanitized datasets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/raw-ezcharge-latest.json data/national/uk_ezcharge_site_areas.json.gz data/national/uk_raw_charging_ocpi.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect RAW and EZ-Charge public data [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
