name: Electroverse partial status gate shadow QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_electroverse_partial_status_rebuild.mjs
      - .github/workflows/electroverse-partial-status-shadow-qa.yml
permissions:
  contents: write
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and audit available saved partitions
        run: |
          node --check scripts/audit_electroverse_partial_status_rebuild.mjs
          node scripts/audit_electroverse_partial_status_rebuild.mjs
      - name: Upload dry run evidence
        uses: actions/upload-artifact@v4
        with:
          name: electroverse-status-shadow-qa
          path: reports/electroverse/partial-status-rebuild-preview.json
      - name: Publish dry run report only
        run: |
          set -euo pipefail
          cp reports/electroverse/partial-status-rebuild-preview.json /tmp/electroverse_status_shadow_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/electroverse_status_shadow_report.json reports/electroverse/partial-status-rebuild-preview.json
            git add reports/electroverse/partial-status-rebuild-preview.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit(electroverse): publish read-only partial status gate QA results'
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
