name: SIGEIF official tariffs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sigeif_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/sigeif-operator-validation.yml"

permissions:
  contents: write

concurrency:
  group: sigeif-operator-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Fetch and validate official SIGEIF evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile scripts/sigeif_official.py
          mkdir -p out/sigeif
          python scripts/sigeif_official.py 2> >(tee out/sigeif/error.log >&2)
          cat out/sigeif/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/sigeif
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/sigeif/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/sigeif/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'sigeif-diagnostic',
              'operator':'SIGEIF / IZIVIA',
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-80:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sigeif/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(sigeif): publish validation diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate current tariff envelope
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/sigeif/sigeif_official_ile_de_france.json').read_text())
          assert p['dataset']=='sigeif-official-ile-de-france'
          assert p['country']=='FR'
          assert p['publicationStatus']=='candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['classification']['exactTariffFullyMachineVerifiedForAllPowerClasses'] is True
          d=p['operatorDirect']
          assert d['upTo7Kw']['eurPerKwh'] == 0.39
          assert d['upTo22Kw']['eurPerKwh'] == 0.39
          assert d['upTo24Kw']['eurPerKwh'] == 0.45
          assert d['upTo50Kw']['eurPerKwh'] == 0.49
          assert d['upTo100Kw']['eurPerKwh'] == 0.49
          assert d['upTo7Kw']['connectionOrParkingFee']['freeMinutes'] == 180
          assert d['upTo24Kw']['connectionOrParkingFee']['freeMinutes'] == 120
          assert d['upTo50Kw']['connectionOrParkingFee']['freeMinutes'] == 60
          assert d['upTo100Kw']['connectionOrParkingFee']['eurPerMinuteAfter'] == 0.30
          assert p['roaming']['mustRemainSeparateFromDirectTariff'] is True
          print('SIGEIF current official envelope: OK')
          PY

      - name: Publish validated candidate only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/sigeif/sigeif_official_ile_de_france.json')
          dst=Path('data/operator_direct/sigeif_official_ile_de_france.json')
          rep=Path('reports/sigeif/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/sigeif/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit SIGEIF candidate
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/sigeif_official_ile_de_france.json reports/sigeif/latest_summary.md
          git commit -m "data(sigeif): publish verified official tariff model [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
