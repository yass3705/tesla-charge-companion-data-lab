name: IONITY payment public probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ionity-payment-public-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public portal shell and JS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/assets
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          for URL in 'https://payment.ionity.eu/' 'https://payment.ionity.eu/charger-detail/2110'; do
            NAME=$(printf '%s' "$URL" | sed 's#https://payment.ionity.eu/##; s#[^A-Za-z0-9]#_#g')
            [ -n "$NAME" ] || NAME=root
            curl -sS -L --max-time 30 -A "$UA" -D "probe/${NAME}.headers" "$URL" -o "probe/${NAME}.html" || true
            echo "===== $URL ====="
            sed -n '1,25p' "probe/${NAME}.headers" || true
            head -c 4000 "probe/${NAME}.html" || true
            echo
          done

          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse, subprocess
          base='https://payment.ionity.eu/'
          seen=set(); queue=[]
          for p in Path('probe').glob('*.html'):
              text=p.read_text(errors='replace')
              refs=[]
              refs += re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)
              refs += re.findall(r'<link[^>]+rel=["\']modulepreload["\'][^>]+href=["\']([^"\']+)', text, re.I)
              refs += re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']modulepreload["\']', text, re.I)
              queue += [urllib.parse.urljoin(base,x) for x in refs]
          while queue and len(seen)<120:
              u=queue.pop(0)
              if u in seen or not u.startswith(base): continue
              seen.add(u)
              name=re.sub(r'[^A-Za-z0-9._-]','_',urllib.parse.urlparse(u).path.strip('/')) or 'asset.js'
              out=Path('probe/assets')/name
              print('ASSET',u,'->',out)
              subprocess.run(['curl','-sS','-L','--max-time','30','-A','Mozilla/5.0',u,'-o',str(out)],check=False)
              if out.exists():
                  t=out.read_text(errors='replace')
                  for ref in re.findall(r'["\'](chunk-[A-Za-z0-9_-]+\.js)["\']',t):
                      queue.append(urllib.parse.urljoin(base,ref))
                  for ref in re.findall(r'import\(["\']([^"\']+\.js)["\']\)',t):
                      queue.append(urllib.parse.urljoin(u,ref))
          print('asset_count',len(seen))
          PY

      - name: Extract endpoint and tariff candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pats=[r'https?://[^"\'`\\ ]+',r'/api/[A-Za-z0-9_./?=&${}:~-]+',r'graphql',r'charger[^"\'`]{0,180}',r'tariff[^"\'`]{0,220}',r'price[^"\'`]{0,220}',r'kwh[^"\'`]{0,180}',r'connector[^"\'`]{0,180}',r'location[^"\'`]{0,180}']
          for p in sorted(Path('probe/assets').glob('*')):
              t=p.read_text(errors='replace')
              hits=[]
              for pat in pats:
                  for m in re.finditer(pat,t,re.I):
                      s=re.sub(r'\s+',' ',m.group(0))[:600]
                      if s not in hits: hits.append(s)
              if hits:
                  print('\n====',p.name,'bytes',len(t.encode()),'====')
                  for h in hits[:500]: print(h)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ionity-payment-public-probe
          path: probe
          retention-days: 3
