name: Pricing after-minutes staged engine QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_after_minutes_staging_20261011.cjs'
      - '.github/workflows/after-minutes-staging-validation-20261011.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download staged V9 engine and signed-off operator tariffs
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/fix/after-minutes-connected-time-caps-20261011/v9-production-runtime'
          curl -fLSs --retry 3 "$base/assets/v9/pricing-engine.js" -o /tmp/tcc-v9-new-pricing.js
          curl -fLSs --retry 3 "$base/data/v9/france-direct-offers.json" -o /tmp/tcc-v9-new-direct-offers.json
          curl -fLSs --retry 3 "$base/data/v9/france-emsp-offers.json" -o /tmp/tcc-v9-new-emsp-offers.json
          node --check /tmp/tcc-v9-new-pricing.js
          node --check scripts/audit_after_minutes_staging_20261011.cjs
      - name: France existing deterministic regression (17 scenarios)
        run: node scripts/france_pricing_real_offer_pilot_20261009.cjs /tmp/tcc-v9-new-pricing.js
      - name: Verified connected-time and night-cap regression
        run: |
          node scripts/audit_after_minutes_staging_20261011.cjs /tmp/tcc-v9-new-pricing.js /tmp/tcc-v9-new-direct-offers.json /tmp/tcc-v9-new-emsp-offers.json
      - name: Archive read-only validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-after-minutes-staging-validation
          path: reports/tariff-scenarios/after-minutes-staging-validation-2026-10-11.json
          if-no-files-found: warn
      - name: Publish staging audit without touching production
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/after-minutes-staging-validation-2026-10-11.json /tmp/after_minutes_staging_validated.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/after_minutes_staging_validated.json reports/tariff-scenarios/after-minutes-staging-validation-2026-10-11.json
            git add reports/tariff-scenarios/after-minutes-staging-validation-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(pricing): validate source-scoped after-minute fees on proposed runtime'
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
