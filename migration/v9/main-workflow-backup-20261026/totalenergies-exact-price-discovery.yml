name: TotalEnergies exact-price discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/totalenergies_public_map_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/totalenergies-exact-price-discovery.yml"

permissions:
  contents: write

concurrency:
  group: totalenergies-exact-price-discovery
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Compile probe
        run: python -m py_compile scripts/totalenergies_public_map_probe.py

      - name: Discover TotalEnergies Charge+ public station-price surface
        shell: bash
        run: |
          set -euo pipefail
          python scripts/totalenergies_public_map_probe.py
          cat out/exact-price/totalenergies/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate sanitized output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/public_safety_check.py out/exact-price/totalenergies
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/exact-price/totalenergies/totalenergies_public_map_probe.json').read_text())
          assert p['method']['authenticated'] is False
          assert p['method']['mobilePackageUsed'] is False
          assert p['method']['qrImageDecoded'] is False
          assert p['method']['paymentSubmitted'] is False
          assert p['method']['chargingSessionStarted'] is False
          assert p['method']['httpMethods'] == ['GET']
          print(json.dumps(p['conclusion'], ensure_ascii=False))
          PY

      - name: Publish sanitized report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/exact-price
          cp out/exact-price/totalenergies/totalenergies_public_map_probe.json reports/exact-price/totalenergies_latest.json
          python scripts/public_safety_check.py reports/exact-price/totalenergies_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact-price/totalenergies_latest.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "data(pricing): publish TotalEnergies exact-price discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
