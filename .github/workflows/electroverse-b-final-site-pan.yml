name: Audit final B same-site PAN inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_final_site_extra_pan.py"
      - ".github/workflows/electroverse-b-final-site-pan.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_b_final_site_extra_pan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-final-site-extra-pan-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist same-site PAN inventory for final B"
            git pull --rebase origin main || true
            git push
          fi
