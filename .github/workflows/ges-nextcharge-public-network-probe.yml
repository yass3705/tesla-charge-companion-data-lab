name: GES NextCharge public map network probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/ges-italy-probe
    paths:
      - scripts/ges_nextcharge_public_network_probe.py
      - .github/workflows/ges-nextcharge-public-network-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check selenium
      - name: Discover public NextCharge map endpoints
        run: python scripts/ges_nextcharge_public_network_probe.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports/ges_nextcharge_public_network_probe.json')
          assert p.exists() and p.stat().st_size > 1000
          r=json.loads(p.read_text(encoding='utf-8'))
          c=r['counts']
          print(json.dumps(c,ensure_ascii=False,indent=2))
          print(json.dumps(r['hosts'],ensure_ascii=False,indent=2))
          for row in r['endpointResponses']:
              print(json.dumps({k:row.get(k) for k in ('url','method','status','mimeType','resourceType','postData','jsonShape','jsonSample','apiLikeTextFragments')},ensure_ascii=False,indent=2)[:15000])
          assert r['security']['accountCredentialsUsed'] is False
          assert r['security']['requestHeadersPersisted'] is False
          assert c['firstPartyResponses'] > 0
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-public-network-probe
          path: data/reports/ges_nextcharge_public_network_probe.json
          retention-days: 14
