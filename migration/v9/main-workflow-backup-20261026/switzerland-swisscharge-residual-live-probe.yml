name: Switzerland Swisscharge residual live probe
# rerun-2026-09-29-1921

on:
  push:
    paths:
      - '.github/workflows/switzerland-swisscharge-residual-live-probe.yml'
      - 'scripts/probe_swisscharge_residual_live.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe current Swisscharge residuals
        run: python3 scripts/probe_swisscharge_residual_live.py
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-swisscharge-residual-live-probe-2026-09-29.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Swisscharge residual live probe"
          git push origin main
