name: UK Shell residual tariff probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-residual-tariff-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe five bounded no-tariff locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]
          secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Residual-Probe"
          MIN_INTERVAL=7.5
          last=0.0

          def throttle():
              global last
              now=time.monotonic()
              wait=MIN_INTERVAL-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def token():
              throttle()
              form=urllib.parse.urlencode({
                  "client_id":cid,"client_secret":secret,"grant_type":"client_credentials"
              }).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Accept":"application/json","User-Agent":UA
              })
              with urllib.request.urlopen(req,timeout=30) as rr:
                  return json.loads(rr.read().decode())["access_token"]

          access=token()

          def call(uid,provider):
              global access
              for attempt in range(2):
                  throttle()
                  params={} if provider is None else {"providerId":provider}
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")
                  if params: url+="?"+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+access,
                      "Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),
                      "User-Agent":UA
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          access=token()
                          continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:3000]}
              return 0,{"error":"unreachable"}

          uids=["GB*TNM*5220","DE*UBI*8507","DE*UBI*1747","DE*UBI*1743","DE*UBI*112"]
          providers=["Shell_RP_2","Shell_RP_1","Shell_RP",None]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"results":[]}

          for uid in uids:
              item={"uid":uid,"probes":[]}
              for provider in providers:
                  st,body=call(uid,provider)
                  tariffs=[]
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data: data=data[0]
                  if isinstance(data,dict):
                      for ev in data.get("evses") or []:
                          for conn in ev.get("connectors") or []:
                              for t in conn.get("tariffs") or []:
                                  tariffs.append({
                                      "evseId":ev.get("evseId"),
                                      "connectorUid":conn.get("uid"),
                                      "tariff":t
                                  })
                  item["probes"].append({
                      "providerId":provider,
                      "httpStatus":st,
                      "status":body.get("status") if isinstance(body,dict) else None,
                      "tariffCount":len(tariffs),
                      "tariffs":tariffs
                  })
              out["results"].append(item)

          out["resolvedUids"]=[
              x["uid"] for x in out["results"]
              if any(p["tariffCount"]>0 for p in x["probes"])
          ]
          out["stillNoTariffUids"]=[
              x["uid"] for x in out["results"]
              if all(p["tariffCount"]==0 for p in x["probes"])
          ]
          Path("reports/uk/shell-residual-tariff-probe-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps({
              "resolvedUids":out["resolvedUids"],
              "stillNoTariffUids":out["stillNoTariffUids"],
              "summary":[
                  {"uid":x["uid"],"providers":[
                      {"providerId":p["providerId"],"httpStatus":p["httpStatus"],"tariffCount":p["tariffCount"]}
                      for p in x["probes"]
                  ]} for x in out["results"]
              ]
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish residual report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/uk/shell-residual-tariff-probe-latest.json /tmp/shell-residual-tariff-probe-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/shell-residual-tariff-probe-latest.json reports/uk/shell-residual-tariff-probe-latest.json
          git add reports/uk/shell-residual-tariff-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): probe residual Shell tariffs [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
