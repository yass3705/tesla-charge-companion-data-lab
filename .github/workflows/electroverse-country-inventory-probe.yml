name: TEST NON-TESLA — Electroverse DE GB inventory probe
on:
  workflow_dispatch:
  push:
    paths:
      - tests/non-tesla/active/run-electroverse-country-inventory-probe.trigger
  push:
    paths:
      - tests/non-tesla/active/run-electroverse-country-inventory-probe.trigger
permissions:
  contents: read
jobs:
  probe-de:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
      ELECTROVERSE_INVENTORY_ZOOM: '9'
      ELECTROVERSE_TILE_CONCURRENCY: '8'
      COUNTRY: 'DE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/electroverse_country_inventory_probe.mjs
  probe-gb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
      ELECTROVERSE_INVENTORY_ZOOM: '9'
      ELECTROVERSE_TILE_CONCURRENCY: '8'
      COUNTRY: 'GB'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/electroverse_country_inventory_probe.mjs
