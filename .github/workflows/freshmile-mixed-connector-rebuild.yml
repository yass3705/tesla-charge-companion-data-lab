name: Rebuild Freshmile after mixed connector fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/freshmile-mixed-connector-rebuild.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Freshmile full scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run freshmile-direct-tariffs-full.yml --repo "${{ github.repository }}" --ref main
