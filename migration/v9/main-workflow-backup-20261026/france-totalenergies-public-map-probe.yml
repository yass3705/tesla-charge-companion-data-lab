name: France TotalEnergies public map tariff probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/france-totalenergies-public-map-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe public find-a-charger surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/totalenergies
          python - <<'PY'
          import requests,re,json,pathlib,urllib.parse,datetime
          base='https://chargingservices.totalenergies.com/en/find-a-charger'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          r=s.get(base,timeout=30); html=r.text
          assets=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)',r'<link[^>]+href=["\']([^"\']+)']:
            for x in re.findall(pat,html,re.I):
              u=urllib.parse.urljoin(base,x)
              if u not in assets: assets.append(u)
          scripts=[]
          for u in assets:
            if not ('.js' in u): continue
            try:
              rr=s.get(u,timeout=40); t=rr.text
              urls=sorted(set(re.findall(r'https?://[^"\'\\\s<>]+',t)))
              paths=sorted(set(x for x in re.findall(r'["\'](/[^"\']{2,180})["\']',t) if any(k in x.lower() for k in ['api','station','location','charger','tariff','price','evse','connector','pay'])))
              strings=[]
              for m in re.findall(r'["\']([^"\'\\]{3,180})["\']',t):
                ml=m.lower()
                if any(k in ml for k in ['tariff','pricing','price','evse','connector','station','charger']) and m not in strings: strings.append(m)
              scripts.append({'url':u,'status':rr.status_code,'length':len(t),'urls':urls[:250],'paths':paths[:400],'interestingStrings':strings[:500]})
            except Exception as e: scripts.append({'url':u,'error':str(e)})
          out={'schemaVersion':'1.0.0','operator':'TotalEnergies','evaluatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'home':{'url':base,'status':r.status_code,'length':len(html)},'assets':assets,'scripts':scripts}
          pathlib.Path('reports/france/totalenergies/public-map-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          compact={'home':out['home'],'assets':assets,'scripts':[{'url':x.get('url'),'status':x.get('status'),'length':x.get('length'),'urls':x.get('urls',[])[:40],'paths':x.get('paths',[])[:100],'interestingStrings':x.get('interestingStrings',[])[:120]} for x in scripts]}
          pathlib.Path('reports/france/totalenergies/public-map-probe-summary.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(compact,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/totalenergies/public-map-probe*.json
          git commit -m 'France TotalEnergies: publish public map tariff probe' || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
