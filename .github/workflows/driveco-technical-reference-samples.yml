name: Audit Driveco technical reference samples
on:
  push:
    branches:
      - audit/electroverse-drv-technical-identity
    paths:
      - "scripts/audit_driveco_technical_reference_samples.mjs"
      - ".github/workflows/driveco-technical-reference-samples.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Driveco reference
        run: node scripts/audit_driveco_technical_reference_samples.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/driveco-technical-reference-samples.json
          git commit -m "audit: publish Driveco technical reference samples" || exit 0
          git push
