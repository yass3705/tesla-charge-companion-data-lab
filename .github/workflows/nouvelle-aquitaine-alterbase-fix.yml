name: Nouvelle-Aquitaine AlterBase decimal fix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nouvelle-aquitaine-alterbase-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize AlterBase decimal witnesses
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/nouvelle_aquitaine_regional_coverage.py')
          s = p.read_text()
          old = "require(src['alterbase']['text'],'18€','0.432','0.528','0.612','0.996',label='AlterBase')"
          new = "require(src['alterbase']['text'],'18€','0,432','0,528','0,612','0,996',label='AlterBase')"
          if old not in s:
              raise SystemExit('AlterBase witness line not found or already changed')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile scripts/nouvelle_aquitaine_regional_coverage.py
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nouvelle_aquitaine_regional_coverage.py
          git commit -m "fix(nouvelle-aquitaine): accept French AlterBase decimals"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
