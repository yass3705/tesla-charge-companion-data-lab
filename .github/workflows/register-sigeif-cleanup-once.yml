name: Register validated cleanup targets once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/register-sigeif-cleanup-once.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register SIGEIF and Révéo in cleanup and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/cleanup_operator_runs.py')
          s=p.read_text()
          anchor='    "alize_toulouse": {"workflow": "alize-toulouse-official-tariffs.yml", "marker": "data/operator_direct/alize_toulouse_official.json", "legacy_workflows": []},\n'
          additions=[
              '    "sigeif": {"workflow": "sigeif-operator-validation.yml", "marker": "data/operator_direct/sigeif_official_ile_de_france.json", "legacy_workflows": []},\n',
              '    "reveo": {"workflow": "reveo-official-tariffs.yml", "marker": "data/operator_direct/reveo_official_france.json", "legacy_workflows": []},\n',
          ]
          if any(x not in s for x in additions):
              if anchor not in s:
                  raise SystemExit('cleanup target anchor missing')
              block=anchor+''.join(x for x in additions if x not in s)
              s=s.replace(anchor, block, 1)
              p.write_text(s)

          w=Path('.github/workflows/cleanup-operator-runs.yml')
          y=w.read_text()

          list_anchor='      - Alizé Toulouse official tariffs\n'
          list_add='      - SIGEIF official tariffs\n      - Révéo official tariffs\n'
          if '      - SIGEIF official tariffs\n' not in y or '      - Révéo official tariffs\n' not in y:
              if list_anchor not in y: raise SystemExit('workflow list anchor missing')
              extra=''
              if '      - SIGEIF official tariffs\n' not in y: extra+='      - SIGEIF official tariffs\n'
              if '      - Révéo official tariffs\n' not in y: extra+='      - Révéo official tariffs\n'
              y=y.replace(list_anchor, list_anchor+extra, 1)

          choice_anchor='          - alize_toulouse\n'
          if '          - sigeif\n' not in y or '          - reveo\n' not in y:
              if choice_anchor not in y: raise SystemExit('choice anchor missing')
              extra=''
              if '          - sigeif\n' not in y: extra+='          - sigeif\n'
              if '          - reveo\n' not in y: extra+='          - reveo\n'
              y=y.replace(choice_anchor, choice_anchor+extra, 1)

          case_anchor='              "Alizé Toulouse official tariffs") target="alize_toulouse" ;;\n'
          if '              "SIGEIF official tariffs") target="sigeif" ;;\n' not in y or '              "Révéo official tariffs") target="reveo" ;;\n' not in y:
              if case_anchor not in y: raise SystemExit('case anchor missing')
              extra=''
              if '              "SIGEIF official tariffs") target="sigeif" ;;\n' not in y: extra+='              "SIGEIF official tariffs") target="sigeif" ;;\n'
              if '              "Révéo official tariffs") target="reveo" ;;\n' not in y: extra+='              "Révéo official tariffs") target="reveo" ;;\n'
              y=y.replace(case_anchor, case_anchor+extra, 1)

          w.write_text(y)
          PY

          git rm .github/workflows/register-sigeif-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cleanup_operator_runs.py .github/workflows/cleanup-operator-runs.yml
          git commit -m "cleanup: register SIGEIF and Révéo"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
