name: Audit Electroverse FR DRV SIG QOV
on:
  push:
    branches:
      - audit/electroverse-drv-sig-qov
    paths:
      - "scripts/audit_electroverse_drv_sig_qov.mjs"
      - ".github/workflows/electroverse-drv-sig-qov-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audits
        run: node scripts/audit_electroverse_drv_sig_qov.mjs
      - name: Persist reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-drv-unmatched.json reports/electroverse-fr-sig-unmatched.json reports/electroverse-fr-qov-unmatched.json
          git commit -m "audit: publish DRV SIG QOV unmatched reports" || exit 0
          git push
