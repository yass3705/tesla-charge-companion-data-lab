name: UK Charge My Street map collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-charge-my-street-map-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse embedded Drupal map data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import re,json,gzip,urllib.request,html
          from pathlib import Path
          from datetime import datetime,timezone
          url='https://chargemystreet.co.uk/map'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9','Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=60) as r: raw=r.read().decode('utf-8','replace')
          m=re.search(r'<script type="application/json" data-drupal-selector="drupal-settings-json">(.*?)</script>',raw,re.S)
          if not m: raise SystemExit('Drupal settings JSON not found')
          settings=json.loads(html.unescape(m.group(1)))
          md=settings.get('mapData') or []
          flat=[]
          def walk(x):
              if isinstance(x,dict) and ('marker' in x or 'popup' in x): flat.append(x)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
          walk(md)
          dedup={}
          for x in flat:
              marker=x.get('marker')
              key=json.dumps(marker,sort_keys=True,ensure_ascii=False)+str(x.get('popup') or '')
              dedup[key]=x
          rows=list(dedup.values())
          marker_types={}; prices=[]; popup_text=[]
          for x in rows:
              mk=x.get('marker')
              typ=None
              if isinstance(mk,list) and len(mk)>1: typ=str(mk[1])
              marker_types[typ or 'UNKNOWN']=marker_types.get(typ or 'UNKNOWN',0)+1
              p=html.unescape(str(x.get('popup') or ''))
              text=re.sub(r'<[^>]+>',' ',p); text=re.sub(r'\s+',' ',text).strip()
              popup_text.append(text)
              for z in re.findall(r'(?i)(?:£\s*)?(\d{1,3}(?:\.\d+)?)\s*p(?:ence)?\s*/?\s*kwh|£\s*(0?\.\d+)\s*/?\s*kwh',text):
                  prices.append(z)
          retrieved=datetime.now(timezone.utc).isoformat()
          out={'country':'GB','network':'Charge My Street','retrievedAt':retrieved,'sourceUrl':url,'mapData':rows}
          summary={'country':'GB','network':'Charge My Street','retrievedAt':retrieved,'mapRecords':len(rows),'markerTypes':marker_types,'pricePatternHits':prices[:100],'popupSamples':popup_text[:25],'status':'map_inventory_complete' if rows else 'failed_empty'}
          with gzip.open('data/national/uk_charge_my_street_map.json.gz','wt',encoding='utf-8') as g: json.dump(out,g,ensure_ascii=False,separators=(',',':'))
          Path('reports/uk/charge-my-street-map-latest.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not rows: raise SystemExit(2)
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_charge_my_street_map.json.gz reports/uk/charge-my-street-map-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Charge My Street public map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
