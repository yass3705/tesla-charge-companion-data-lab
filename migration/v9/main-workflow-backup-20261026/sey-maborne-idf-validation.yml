name: IDF SEY Ma Borne validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sey_maborne_official.py"
      - ".github/workflows/sey-maborne-idf-validation.yml"

permissions:
  contents: write

concurrency:
  group: idf-sey-maborne-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/sey_maborne
          python -m py_compile scripts/sey_maborne_official.py
          python scripts/sey_maborne_official.py --out out/sey_maborne 2> >(tee out/sey_maborne/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/sey_maborne/sey_maborne_official_idf.json').read_text())
          assert p['dataset']=='sey-maborne-official-idf'
          assert p['effectiveFrom']=='2026-03-01'
          assert p['classification']['directTariff'] is True
          assert p['access']['subscriptionRequired'] is False
          assert p['access']['badgePurchaseEur']==9.60
          assert p['directTariff']['ac22Kw']['energyEurPerKwh']==0.36
          assert p['directTariff']['ac22Kw']['firstHoursTimeFeeFree']==2.0
          assert p['directTariff']['ac22Kw']['after2hDayEurPerHour']==4.0
          assert p['directTariff']['ac22Kw']['after2hNight2000To0800EurPerHour']==0.30
          assert p['directTariff']['dc36Kw']['energyEurPerKwh']==0.46
          assert p['directTariff']['dc36Kw']['dayEurPerHour']==4.0
          assert p['directTariff']['dc36Kw']['night2000To0800EurPerHour']==1.0
          assert p['roaming']['otherMobilityProviderMayAddSurcharge'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/sey_maborne
          cp out/sey_maborne/sey_maborne_official_idf.json data/operator_direct/sey_maborne_official_idf.json
          cp out/sey_maborne/SUMMARY.md reports/sey_maborne/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/sey_maborne_official_idf.json reports/sey_maborne/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(sey-maborne): publish official IDF tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/sey_maborne
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/sey_maborne/error.log')
          s=p.read_text(errors='replace') if p.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/sey_maborne/latest_diagnostic.json').write_text(json.dumps({'dataset':'sey-maborne-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/sey_maborne
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/sey_maborne/latest_run_status.json').write_text(json.dumps({'dataset':'sey-maborne-run-status','operator':'SEY Ma Borne','region':'Ile-de-France','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sey_maborne/latest_run_status.json reports/sey_maborne/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(sey-maborne): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
