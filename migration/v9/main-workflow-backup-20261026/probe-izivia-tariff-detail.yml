name: France IZIVIA tariff detail probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-tariff-detail.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe one public charging location and pricing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia /tmp/izt
          python - <<'PY'
          import json,pathlib,subprocess,urllib.parse
          base='https://fronts-map.izivia.com/api'; loc='693f6fee3fdcff3315e3814d'
          def call(method,url,body=None):
              cmd=['curl','-sS','-w','\n%{http_code}','-X',method,'-H','accept: application/json']
              if body is not None: cmd += ['-H','content-type: application/json','--data',body]
              cmd += [url]; r=subprocess.run(cmd,capture_output=True,text=True)
              raw,status=r.stdout.rsplit('\n',1) if '\n' in r.stdout else (r.stdout,'')
              try: parsed=json.loads(raw)
              except: parsed=None
              return status,parsed,raw
          st,detail,raw=call('POST',f'{base}/charging-locations/{loc}','{"filters":{}}')
          result={'locationId':loc,'detailStatus':st,'detail':detail,'pricingAttempts':[]}
          if st=='200' and isinstance(detail,dict):
              emip=detail.get('firstStationEmipId')
              candidates=[loc,emip,'']
              seen=set()
              for legacy in candidates:
                  if legacy in seen or not emip: continue
                  seen.add(legacy)
                  qs=urllib.parse.urlencode({'legacyId':legacy,'stationEmipId':emip})
                  url=f'{base}/charging-locations/{loc}/pricing-info-items?{qs}'
                  for method,body in [('GET',None),('POST','{}')]:
                      s,p,r=call(method,url,body)
                      result['pricingAttempts'].append({'legacyId':legacy,'stationEmipId':emip,'method':method,'status':s,'payload':p if s=='200' else None,'sample':r[:5000]})
                      if s=='200': result['pricing']=p; result['workingLegacyId']=legacy; result['workingMethod']=method; break
                  if 'pricing' in result: break
          pathlib.Path('reports/france/izivia/tariff-detail-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'detailStatus':result.get('detailStatus'),'firstStationEmipId':(detail or {}).get('firstStationEmipId') if isinstance(detail,dict) else None,'workingLegacyId':result.get('workingLegacyId'),'workingMethod':result.get('workingMethod'),'pricingAttempts':result.get('pricingAttempts')},ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git pull --rebase origin main || true
            git add reports/france/izivia/tariff-detail-probe.json
            git commit -m 'France IZIVIA: publish tariff detail probe' || true
            git push && exit 0
            git reset --soft HEAD~1 || true
            sleep $((i*2))
          done
          exit 1