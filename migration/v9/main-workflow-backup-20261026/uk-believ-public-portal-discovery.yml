name: UK Believ public portal discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-believ-public-portal-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Believ public portal bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          def get(url,limit=6_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(limit).decode("utf-8","replace"),r.geturl(),r.status,r.headers.get("Content-Type")

          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Believ"}
          html,final,st,ct=get("https://charge.believ.com/map")
          out["page"]={"status":st,"finalUrl":final,"bytes":len(html)}
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          out["scripts"]=scripts
          candidates=set(); contexts=[]
          patterns=("api","graphql","location","evse","tariff","charger","station","map")
          bodies=[("html",html)]
          for s in scripts[:80]:
              try:
                  b,_,bst,bct=get(s)
                  bodies.append((s,b))
              except Exception as e:
                  contexts.append({"source":s,"error":f"{type(e).__name__}: {e}"})
          for source,b in bodies:
              for u in re.findall(r'https?://[^"\'\s<>()\\]+',b):
                  if any(k in u.lower() for k in ("api","believ","charge","location","evse","tariff")):
                      candidates.add(u[:600])
              for m in re.finditer(r'(?i)(api|graphql|location|evse|tariff|charger|station)',b):
                  ctx=b[max(0,m.start()-450):min(len(b),m.end()+900)]
                  if re.search(r'https?://|fetch\(|axios|/api/|graphql|location|tariff|evse',ctx,re.I):
                      contexts.append({"source":source,"context":ctx})
                      if len(contexts)>=250: break
              if len(contexts)>=250: break
          out["urlCandidates"]=sorted(candidates)[:500]
          out["contexts"]=contexts[:250]
          Path("reports/uk/believ-public-portal-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/believ-public-portal-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Believ public portal [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
