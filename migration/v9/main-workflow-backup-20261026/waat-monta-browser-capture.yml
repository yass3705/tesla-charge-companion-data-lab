name: WAAT Monta browser pricing capture

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/waat-monta-browser-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Probe real WAAT stations through Monta public web map
        run: |
          set -euo pipefail
          cat > capture-waat-monta.mjs <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import { chromium } from 'playwright-core';

          const src=JSON.parse(zlib.gunzipSync(fs.readFileSync('data/national/waat_direct_stations_france.json.gz')));
          const eligible=(src.stations||[]).filter(s=>Array.isArray(s.coordinates)&&s.coordinates.length>=2);
          const byPower=[...eligible].sort((a,b)=>(b.maxPowerKw||0)-(a.maxPowerKw||0));
          const byGeo=[...eligible].sort((a,b)=>(a.coordinates[0]-b.coordinates[0])||(a.coordinates[1]-b.coordinates[1]));
          const selected=[];
          const seen=new Set();
          function add(s){ if(!s||seen.has(s.stationIdNormalized)) return; seen.add(s.stationIdNormalized); selected.push(s); }
          byPower.slice(0,4).forEach(add);
          for(const q of [0,.15,.3,.45,.6,.75,.9,1]) add(byGeo[Math.min(byGeo.length-1,Math.floor(q*(byGeo.length-1)))]);
          const samples=selected.slice(0,10);

          const chromeCandidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=chromeCandidates.find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('No Chromium/Chrome executable found');
          const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const context=await browser.newContext({locale:'fr-FR',userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',viewport:{width:1280,height:900}});

          const results=[];
          const operatorRe=/(^|[^a-z0-9])(waat|fr\s*\*?\s*wa2|frwa2)([^a-z0-9]|$)/i;
          function loc(o){
            if(!o) return null;
            if(typeof o.location==='string') { const p=o.location.split(',').map(Number); if(p.length>=2&&p.every(Number.isFinite)) return [p[0],p[1]]; }
            if(Number.isFinite(o.latitude)&&Number.isFinite(o.longitude)) return [o.latitude,o.longitude];
            return null;
          }
          function distM(a,b){
            if(!a||!b) return null; const R=6371000, rad=x=>x*Math.PI/180;
            const dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);
            const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(h));
          }
          function cleanHeaders(h){
            const out={};
            for(const [k,v] of Object.entries(h||{})) {
              const lk=k.toLowerCase();
              if(['host','content-length','cookie','authorization'].includes(lk)) continue;
              if(lk.startsWith('sec-')||lk.startsWith(':')) continue;
              out[k]=v;
            }
            return out;
          }
          function sanitize(v,depth=0){
            if(depth>8) return '[depth-limited]';
            if(Array.isArray(v)) return v.slice(0,100).map(x=>sanitize(x,depth+1));
            if(v&&typeof v==='object'){
              const o={};
              for(const [k,x] of Object.entries(v)){
                if(/token|cookie|authori[sz]ation|password|secret|email|phone|zendesk|jwt/i.test(k)) continue;
                o[k]=sanitize(x,depth+1);
              }
              return o;
            }
            return v;
          }
          function pricingFields(v,path='$',out=[]){
            if(out.length>500||v==null) return out;
            if(Array.isArray(v)) v.forEach((x,i)=>pricingFields(x,`${path}[${i}]`,out));
            else if(typeof v==='object') for(const [k,x] of Object.entries(v)){
              if(/pric|tariff|fee|cost|currency|kwh|minute|parking|idle|time_price|sales_fixed/i.test(k)) out.push({path:`${path}.${k}`,value:typeof x==='object'?JSON.stringify(sanitize(x)).slice(0,3000):x});
              pricingFields(x,`${path}.${k}`,out);
            }
            return out;
          }

          for(const s of samples){
            const [lat,lng]=s.coordinates;
            const page=await context.newPage();
            const maps=[]; let guestOk=false; let mapHeaders={};
            page.on('response',async r=>{
              const u=r.url();
              if(u.includes('/api/v1/auth/guest')&&r.status()===201) guestOk=true;
              if(!u.includes('api.monta.app/api/v1/charge_points/map')) return;
              try { maps.push({url:u,status:r.status(),json:JSON.parse(await r.text())}); mapHeaders=await r.request().allHeaders(); } catch {}
            });
            const pageUrl=`https://maps.monta.app/?lat=${lat}&lng=${lng}&zoom=17&locale=fr`;
            let pageStatus=null;
            try { const rr=await page.goto(pageUrl,{waitUntil:'domcontentloaded',timeout:60000}); pageStatus=rr?.status()??null; await page.waitForTimeout(8500); } catch(e) {}
            const items=[];
            for(const m of maps) for(const key of ['list','single_list']) if(Array.isArray(m.json?.[key])) for(const x of m.json[key]) items.push(x);
            const dedup=[...new Map(items.map(x=>[`${x.document||''}:${x.id}`,x])).values()];
            const nearby=dedup.map(x=>({x,d:distM([lat,lng],loc(x))})).filter(y=>y.d==null||y.d<600).sort((a,b)=>(a.d??1e9)-(b.d??1e9));
            const direct=nearby.filter(y=>operatorRe.test(String(y.x.operator_name||y.x.operator||'')));
            const chosen=direct[0]||null;
            let detail=null;
            if(chosen?.x?.id){
              const endpoint=chosen.x.document==='charge_point_group'?`https://api.monta.app/api/v1/charge_point_groups/${chosen.x.id}`:`https://api.monta.app/api/v1/charge_points/${chosen.x.id}`;
              try {
                detail=await page.evaluate(async ({endpoint,headers})=>{
                  const r=await fetch(endpoint,{headers}); const t=await r.text(); let j=null; try{j=JSON.parse(t)}catch{}; return {status:r.status,contentType:r.headers.get('content-type'),json:j,body:j?null:t.slice(0,1000)};
                },{endpoint,headers:cleanHeaders(mapHeaders)});
              } catch(e) { detail={error:String(e)}; }
            }
            results.push({
              target:{stationId:s.stationIdNormalized,name:s.stationName,address:s.address,coordinates:s.coordinates,maxPowerKw:s.maxPowerKw,evseIds:(s.evses||[]).map(e=>e.evseIdNormalized)},
              pageStatus,guestOk,mapRequestCount:maps.length,
              directCandidates:direct.slice(0,5).map(y=>({distanceM:y.d,document:y.x.document,id:y.x.id,name:y.x.name,operatorName:y.x.operator_name,location:y.x.location,maxKw:y.x.max_kw,priceLabel:y.x.price_label,currency:y.x.currency,kwhSalesFixedPrices:y.x.kwh_sales_fixed_prices,pricingHits:pricingFields(y.x)})),
              nearestContext:nearby.slice(0,5).map(y=>({distanceM:y.d,document:y.x.document,id:y.x.id,name:y.x.name,operatorName:y.x.operator_name,location:y.x.location,maxKw:y.x.max_kw,priceLabel:y.x.price_label})),
              detail:detail?sanitize(detail):null,
              detailPricingHits:detail?.json?pricingFields(detail.json):[]
            });
            await page.close();
          }

          await browser.close();
          const directMatched=results.filter(r=>r.directCandidates.length).length;
          const detailOk=results.filter(r=>r.detail?.status===200).length;
          const withPricing=results.filter(r=>r.directCandidates.some(x=>x.priceLabel||x.pricingHits?.length)||r.detailPricingHits.length).length;
          const report={generatedAt:new Date().toISOString(),source:'Monta public web map via real browser guest flow',operator:'WAAT',operatorPrefix:'FR*WA2',sampleCount:results.length,directMatched,detailOk,withPricing,results};
          fs.mkdirSync('data/reports',{recursive:true});
          fs.writeFileSync('data/reports/waat_monta_browser_capture.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({sampleCount:report.sampleCount,directMatched,detailOk,withPricing,summary:results.map(r=>({station:r.target.stationId,name:r.target.name,guestOk:r.guestOk,mapRequestCount:r.mapRequestCount,direct:r.directCandidates.map(x=>({operator:x.operatorName,name:x.name,price:x.priceLabel,id:x.id,document:x.document,distanceM:x.distanceM})),detailStatus:r.detail?.status||null,detailPricingHits:r.detailPricingHits.slice(0,8)}))},null,2));
          JS
          node capture-waat-monta.mjs
          rm -f capture-waat-monta.mjs
      - name: Commit sanitized browser report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/waat_monta_browser_capture.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish WAAT-targeted Monta browser pricing capture"
          for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
