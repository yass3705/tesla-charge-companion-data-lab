name: Switzerland MMN Move finalization
on:
  push:
    paths:
      - 'scripts/finalize_swiss_mmn_move.py'
      - '.github/workflows/switzerland-mmn-finalization.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/finalize_swiss_mmn_move.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/mmn-move-cpo-tariffs.json docs/switzerland-mmn-finalization-2026-09-28.json
          git commit -m 'data(switzerland): finalize MMN via Move CPO tariff' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
