name: Analyze Electroverse France 01DC180 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_01dc180_residual.mjs"
      - ".github/workflows/electroverse-01dc180-residual-analysis.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze 01DC180 unpublished residual
        run: node scripts/analyze_electroverse_01dc180_residual.mjs
      - name: Persist 01DC180 residual analysis
        run: |
          test -s reports/electroverse/01dc180-residual-analysis.json
          node -e "JSON.parse(require('fs').readFileSync('reports/electroverse/01dc180-residual-analysis.json','utf8'))"
          cp reports/electroverse/01dc180-residual-analysis.json /tmp/01dc180-residual-analysis.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports/electroverse
          cp /tmp/01dc180-residual-analysis.json reports/electroverse/01dc180-residual-analysis.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/01dc180-residual-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist Electroverse 01DC180 residual analysis"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-01dc180-residual-analysis
          path: reports/electroverse/01dc180-residual-analysis.json
          retention-days: 14
