name: NL available and occupied Type2 CCS missing tariff audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Netherlands DOT-NL canonical dataset", "Netherlands TotalEnergies direct PAYG tariff refresh"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - scripts/nl_dotnl_active_supported_tariff_gaps_20261011.py
      - .github/workflows/netherlands-active-evse-tariff-gaps.yml
permissions:
  contents: write
concurrency:
  group: netherlands-active-evse-tariff-gaps
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute missing CPO national tariffs for Type 2 CCS and domestic, AVAILABLE/CHARGING
        run: |
          python3 -m py_compile scripts/nl_dotnl_active_supported_tariff_gaps_20261011.py
          python3 scripts/nl_dotnl_active_supported_tariff_gaps_20261011.py
      - name: Save exact EVSE audit and summary without overwriting other work
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/dotnl-active-type2-ccs-tariff-audit-latest.json /tmp/nl-inservice-gap.json
          cp reports/netherlands/dotnl-active-type2-ccs-unpriced-connectors-latest.csv /tmp/nl-inservice-gap.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-inservice-gap.json reports/netherlands/dotnl-active-type2-ccs-tariff-audit-latest.json
            cp /tmp/nl-inservice-gap.csv reports/netherlands/dotnl-active-type2-ccs-unpriced-connectors-latest.csv
            git add reports/netherlands/dotnl-active-type2-ccs-tariff-audit-latest.json reports/netherlands/dotnl-active-type2-ccs-unpriced-connectors-latest.csv
            if git diff --cached --quiet; then
              echo NL_ACTIVE_EVSE_TARIFF_AUDIT_CURRENT
              exit 0
            fi
            git commit -m "reports(nl): Type 2 CCS domestic available/charging tariff gaps [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo NL_ACTIVE_EVSE_TARIFF_AUDIT_PUBLISHED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Unable to publish after retries" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-inservice-supported-evse-tariff-gaps-${{ github.run_id }}
          path: |
            reports/netherlands/dotnl-active-type2-ccs-tariff-audit-latest.json
            reports/netherlands/dotnl-active-type2-ccs-unpriced-connectors-latest.csv
          retention-days: 90
