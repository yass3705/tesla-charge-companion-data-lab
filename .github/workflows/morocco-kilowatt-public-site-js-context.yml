name: Morocco Kilowatt public site JS context

on:
  push:
    paths:
      - '.github/workflows/morocco-kilowatt-public-site-js-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract safe current-site contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/morocco/kilowatt
          python3 - <<'PY'
          import requests,re,json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          u='https://kilowatt.ma/assets/index-Dew6ykkr.js'
          r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0 TCC-Public-Research/1.0'})
          r.raise_for_status(); s=r.text
          terms=['/api/charging-stations','/api/public-connectors-count','chargingStations','Price','price','connectors']
          contexts=[]
          secret=re.compile(r'(eyJ[A-Za-z0-9._-]{80,}|sb_(?:publishable|secret)_[A-Za-z0-9._-]{20,})')
          for term in terms:
              start=0; n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  frag=s[max(0,i-2200):min(len(s),i+4200)]
                  frag=secret.sub('<redacted-key-like>',frag)
                  contexts.append({'term':term,'offset':i,'context':frag})
                  n+=1
                  if n>=10: break
                  start=i+len(term)
          report={
            'schema_version':1,'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'Kilowatt',
            'asset':{'url_path':'/assets/index-Dew6ykkr.js','sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content)},
            'policy':{'public_asset_only':True,'no_login':True,'no_mutations':True,'key_like_values_redacted':True},
            'contexts':contexts
          }
          Path('reports/morocco/kilowatt/public-site-js-context-2026-09-27.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/kilowatt/public-site-js-context-2026-09-27.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(morocco): inspect Kilowatt public site JS [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push origin main
