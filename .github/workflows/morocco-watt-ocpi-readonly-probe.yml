name: Morocco WATT OCPI read-only probe

on:
  workflow_dispatch:
  push:
    branches: [investigation/morocco-watt-ocpi-readonly-20260901]
    paths:
      - '.github/workflows/morocco-watt-ocpi-readonly-probe.yml'
      - 'scripts/morocco_watt_ocpi_public_probe.py'
      - 'scripts/morocco_watt_public_client_static_inspect.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe documented public GET surfaces only
        run: python3 scripts/morocco_watt_ocpi_public_probe.py

      - name: Statically inspect public same-origin client assets
        run: python3 scripts/morocco_watt_public_client_static_inspect.py

      - name: Validate sanitized artifact contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          probe=json.loads(Path('artifacts/morocco-watt-ocpi-public-probe/summary.json').read_text())
          static=json.loads(Path('artifacts/morocco-watt-public-client-static/summary.json').read_text())
          pol=probe.get('policy',{})
          assert pol.get('read_only') is True
          assert pol.get('http_methods') == ['GET']
          assert pol.get('credentials_used') is False
          assert pol.get('cookies_used') is False
          assert pol.get('session_or_command_routes_used') is False
          assert pol.get('raw_payloads_committed') is False
          assert probe.get('production_decision') == 'diagnostic_only_until_source_contract_and_identity_mapping_are_validated'
          spol=static.get('policy',{})
          assert spol.get('read_only') is True
          assert spol.get('http_methods') == ['GET']
          assert spol.get('same_origin_only') is True
          assert spol.get('credentials_used') is False
          assert spol.get('cookies_used') is False
          assert spol.get('discovered_routes_invoked') is False
          assert spol.get('command_or_session_routes_invoked') is False
          assert spol.get('raw_html_or_js_committed') is False
          print(json.dumps({
            'locations': probe.get('locations_summary',{}).get('record_count'),
            'tariffs': probe.get('tariffs_summary',{}).get('record_count'),
            'locations_http': probe.get('locations_endpoint',{}).get('http_status'),
            'tariffs_http': probe.get('tariffs_endpoint',{}).get('http_status'),
            'static_assets': len(static.get('assets_inspected') or []),
            'likely_data_candidates': static.get('likely_data_candidate_paths')
          }, ensure_ascii=False))
          PY

      - name: Upload sanitized WATT diagnostic summaries
        uses: actions/upload-artifact@v4
        with:
          name: morocco-watt-ocpi-readonly-summary
          path: |
            artifacts/morocco-watt-ocpi-public-probe/summary.json
            artifacts/morocco-watt-public-client-static/summary.json
          if-no-files-found: error
          retention-days: 3
