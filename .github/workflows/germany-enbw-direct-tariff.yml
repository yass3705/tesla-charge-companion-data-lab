name: Germany EnBW direct tariff

on:
  push:
    branches: [feature/germany-national-base]
    paths:
      - 'scripts/germany_enbw_direct_tariff.py'
      - '.github/workflows/germany-enbw-direct-tariff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract official EnBW intercharge direct tariff
        run: python scripts/germany_enbw_direct_tariff.py
      - name: Validate EnBW tariff artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/germany/enbw_direct_tariff.json').read_text(encoding='utf-8'))
          assert d['dataset']=='germany-enbw-direct-tariff'
          assert d['scope']['stagedOnly'] is True
          assert d['scope']['publishesToTcc'] is False
          assert d['scope']['siteScalarPriceSafe'] is False
          assert d['scope']['requiresConnectorClass'] is True
          own=d['directOwnNetwork']; t=own['connectorClassTariffs']
          assert own['accessMethod']=='intercharge direct'
          assert own['monthlyFeeEur']==0.0
          assert t['AC']['eurPerKwh']==0.70
          assert t['AC']['blockingFee']=={'afterMinutes':120,'eurPerMinute':0.12}
          assert t['DC']['eurPerKwh']==0.79
          assert t['DC']['blockingFee']=={'afterMinutes':30,'eurPerMinute':0.24}
          assert t['AC']['taxIncluded'] is True and t['DC']['taxIncluded'] is True
          assert d['operator']['bnetzaExactOperators']==['EnBW mobility+ AG und Co.KG']
          print('TCC_ENBW_DIRECT_TARIFF_VALIDATED='+json.dumps(own,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: germany-enbw-direct-tariff
          path: data/germany/enbw_direct_tariff.json
          if-no-files-found: error
          retention-days: 30
