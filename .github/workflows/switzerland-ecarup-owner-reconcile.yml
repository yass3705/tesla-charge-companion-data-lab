name: Switzerland eCarUp owner reconciliation
on:
  push:
    paths:
      - 'scripts/reconcile_swiss_ecarup_owner.py'
      - '.github/workflows/switzerland-ecarup-owner-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/reconcile_swiss_ecarup_owner.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          f=json.load(open('docs/switzerland-ecarup-owner-reconciliation-2026-09-28.json',encoding='utf-8'))
          assert f['nationalEvseCount'] == 6764, f
          assert f['pricedEvseCount'] + f['classifiedNoPublicDirectTariffCount'] + f['unresolvedEvseCount'] == f['nationalEvseCount'], f
          print(json.dumps(f,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/ecarup-owner-direct-tariffs.json docs/switzerland-ecarup-owner-reconciliation-2026-09-28.json
          git commit -m 'data(switzerland): reconcile current eCarUp owner scope' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

