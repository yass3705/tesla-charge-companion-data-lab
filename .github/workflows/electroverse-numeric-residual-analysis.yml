name: Analyze Electroverse France numeric residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_numeric_residual.mjs"
      - ".github/workflows/electroverse-numeric-residual-analysis.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze unpublished numeric identities
        run: node scripts/analyze_electroverse_numeric_residual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-numeric-residual-analysis
          path: reports/electroverse/numeric-residual-analysis.json
          retention-days: 14
# numeric-trigger-2026-10-01-singular-pk
