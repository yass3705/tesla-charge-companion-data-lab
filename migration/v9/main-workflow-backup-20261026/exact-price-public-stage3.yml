name: Exact price public stage 3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/public_exact_price_stage3.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/exact-price-public-stage3.yml"

permissions:
  contents: write

concurrency:
  group: exact-price-public-stage3
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [freshmile, qovoltis]
    steps:
      - uses: actions/checkout@v4
      - name: Safety
        run: python scripts/public_safety_check.py .
      - name: Run focused probe
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/public_exact_price_stage3.py
          mkdir -p "out/exact-price-stage3/${{ matrix.target }}"
          python scripts/public_exact_price_stage3.py --target "${{ matrix.target }}" --out "out/exact-price-stage3/${{ matrix.target }}"
          python scripts/public_safety_check.py "out/exact-price-stage3/${{ matrix.target }}"
          cat "out/exact-price-stage3/${{ matrix.target }}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-price-stage3-${{ matrix.target }}
          path: out/exact-price-stage3/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: probe
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-price-stage3-*
          path: out/exact-price-stage3
          merge-multiple: false
      - name: Publish reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/exact-price-stage3
          cp out/exact-price-stage3/exact-price-stage3-freshmile/freshmile_stage3.json reports/exact-price-stage3/freshmile_latest.json
          cp out/exact-price-stage3/exact-price-stage3-qovoltis/qovoltis_stage3.json reports/exact-price-stage3/qovoltis_latest.json
          python scripts/public_safety_check.py reports/exact-price-stage3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact-price-stage3/freshmile_latest.json reports/exact-price-stage3/qovoltis_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(pricing): publish Freshmile Qovoltis stage3 discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
