name: Qovoltis ChargeNow public discovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qovoltis-chargenow-public-discovery.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public ChargeNow frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for page in index.html QovoltisBornes.html; do
            url="https://chargenow.qovoltis.com/${page/index.html/}"
            curl -sS -L --max-time 30 -A 'Mozilla/5.0' "$url" -o "out/$page"
          done
          python - <<'PY'
          from pathlib import Path
          import re,urllib.parse,subprocess
          refs=[]
          for p in [Path('out/index.html'),Path('out/QovoltisBornes.html')]:
              html=p.read_text(errors='replace')
              print(f'===== {p.name} =====')
              print(html[:40000])
              for pat in [r'href=["\']([^"\']+)',r'src=["\']([^"\']+)',r'action=["\']([^"\']+)']:
                  refs += re.findall(pat,html,re.I)
          refs=list(dict.fromkeys(refs))
          Path('out/refs.txt').write_text('\n'.join(refs))
          scripts=[]
          for x in refs:
              u=urllib.parse.urljoin('https://chargenow.qovoltis.com/',x)
              if urllib.parse.urlparse(u).netloc=='chargenow.qovoltis.com' and (u.endswith('.js') or '/build/' in u): scripts.append(u)
          for i,u in enumerate(scripts,1):
              subprocess.run(['curl','-sS','-L','--max-time','30','-A','Mozilla/5.0',u,'-o',f'out/script-{i}.js'])
          PY
          grep -RInE 'https?://|fetch\(|axios|XMLHttpRequest|/api/|tarif|price|pricing|kwh|station|borne|chargepoint|connector|session|payment|paygreen|qorest|qoapi|ocpi|gireve|ref_site' out --exclude='*.svg' --exclude='*.png' | head -5000 > out/hits.txt || true
          cat out/hits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-chargenow-public-discovery
          path: out
          retention-days: 3
