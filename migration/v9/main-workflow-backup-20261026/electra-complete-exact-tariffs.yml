name: France Electra complete exact tariffs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/electra-complete-exact-tariffs.yml']
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover rate-limited tariffs sequentially and publish direct dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/france/electra
          python - <<'PY'
          import json,pathlib,requests,time,datetime
          p=pathlib.Path('reports/france/electra/pan-exact-tariff-snapshot.json')
          d=json.loads(p.read_text())
          gql='''query LocationLiveData($locationId: ID!) { location(id: $locationId) { id evses { id status connectors { id } } chargeTariffs { chargeTariffId currency currentPricePerKwh elements { restrictions { dayOfWeek startTime endTime } priceComponents { type price } } } } }'''
          endpoint='https://emsp.go-electra.com/graphql'
          s=requests.Session(); s.headers.update({'content-type':'application/json','User-Agent':'Mozilla/5.0'})
          recovered=0; still_bad=0
          for idx,x in enumerate(d.get('stations',[])):
            if x.get('location') and (x.get('location') or {}).get('chargeTariffs'): continue
            sid=(x.get('station') or {}).get('id')
            if not sid: still_bad+=1; continue
            loc=None; last_status=None; errors=None
            for attempt in range(1,6):
              try:
                r=s.post(endpoint,json={'query':gql,'variables':{'locationId':sid}},timeout=25)
                last_status=r.status_code
                if r.status_code==429:
                  time.sleep(1.5*attempt); continue
                j=r.json() if r.ok else None
                loc=(j or {}).get('data',{}).get('location') if isinstance(j,dict) else None
                errors=(j or {}).get('errors') if isinstance(j,dict) else None
                if loc and loc.get('chargeTariffs'): break
              except Exception as e:
                errors=[{'message':str(e)}]
              time.sleep(1.2*attempt)
            if loc:
              x['status']=last_status; x['location']=loc; x['errors']=errors; x.pop('error',None); recovered+=1
            else:
              x['status']=last_status; x['errors']=errors; still_bad+=1
            time.sleep(.32)
          ok=[x for x in d.get('stations',[]) if x.get('location')]
          priced=[x for x in ok if (x.get('location') or {}).get('chargeTariffs')]
          cov=d.setdefault('coverage',{})
          cov['graphqlOk']=len(ok); cov['stationsWithChargeTariffs']=len(priced); cov['rateLimitRecoveredThisRun']=recovered; cov['remainingWithoutTariffs']=len(d.get('stations',[]))-len(priced)
          d['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          total=cov.get('officialPublicMapStationsFR',len(d.get('stations',[])))
          publish=(total>=350 and len(ok)>=int(.98*total) and len(priced)>=int(.95*total))
          if publish:
            pathlib.Path('data/operator_direct/electra_exact_france.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'coverage':cov,'recovered':recovered,'stillBad':still_bad,'publishDirect':publish},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/electra/pan-exact-tariff-snapshot.json
          if [ -f data/operator_direct/electra_exact_france.json ]; then git add data/operator_direct/electra_exact_france.json; fi
          git commit -m 'France Electra: complete exact public station tariffs' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
