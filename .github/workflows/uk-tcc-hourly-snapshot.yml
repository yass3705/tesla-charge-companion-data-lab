# cross-country-refresh-audit: 2026-10-01
name: UK TCC hourly snapshot

on:
  push:
    paths:
      - "docs/uk-cpo-progress-2026-09.json"
      - "reports/uk/autopilot-state.json"
      - "scripts/uk_generate_hourly_snapshot.py"
      - ".github/workflows/uk-tcc-hourly-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-tcc-hourly-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate independent audit snapshot
        run: python scripts/uk_generate_hourly_snapshot.py

      - name: Publish snapshot with race-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          files=(
            reports/uk/autopilot-latest.json
            reports/uk/autopilot-latest.md
          )

          for p in "${files[@]}"; do
            test -f "$p"
            mkdir -p "$tmpdir/$(dirname "$p")"
            cp -p "$p" "$tmpdir/$p"
          done

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            for p in "${files[@]}"; do
              mkdir -p "$(dirname "$p")"
              cp -p "$tmpdir/$p" "$p"
            done

            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "Snapshot already present."
              exit 0
            fi

            git commit -m "chore(uk): independent hourly snapshot [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Unable to publish snapshot after retries." >&2
          exit 1
