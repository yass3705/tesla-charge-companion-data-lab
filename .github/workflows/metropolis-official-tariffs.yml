name: Métropolis official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/metropolis_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/metropolis-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: metropolis-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract Métropolis official rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/metropolis
          python -m py_compile scripts/metropolis_official.py
          python scripts/metropolis_official.py --out out/metropolis 2> >(tee out/metropolis/error.log >&2)
          cat out/metropolis/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/metropolis
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/metropolis/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/metropolis/latest_diagnostic.json').write_text(json.dumps({'dataset':'metropolis-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-50:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/metropolis/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(metropolis): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification and tariffs
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/metropolis/metropolis_official_grand_paris.json').read_text())
          assert p['dataset'] == 'metropolis-official-grand-paris'
          assert p['classification']['singleFlatPublicTariff'] is False
          public=p['operatorDirect']['publicNoSubscription']
          assert public['proximityUpTo3_7Kw']['eurPerKwh'] == 0.44
          assert public['cityAbove3_7To22_25Kw']['eurPerKwh'] == 0.53
          assert public['express150To180Kw']['eurPerKwh'] == 0.63
          fees=p['fees']['postCharge']
          assert fees['graceMinutes'] == 10
          assert fees['default']['proximityUpTo3_7KwEurPerMinute'] == 0.10
          assert fees['default']['cityAbove3_7To22_25KwEurPerMinute'] == 0.10
          assert fees['default']['express150To180KwEurPerMinute'] == 0.20
          assert fees['exceptions']['neuillySurSeine']['day0800To2000EurPerMinute'] == 0.20
          assert fees['exceptions']['neuillySurSeine']['night2000To0800EurPerMinute'] == 0.10
          assert fees['exceptions']['22KwOnExpressSitesEurPerMinute'] == 0.20
          sub=p['operatorDirect']['subscriptions']
          assert sub['liberte']['feeEurPerYear'] == 10.0
          assert sub['mensuel']['feeEurPerMonth'] == 9.90 and sub['mensuel']['expressEurPerKwh'] == 0.53
          assert p['operatorDirect']['bankCardPreauthorizationEur'] == 49.0
          assert p['roaming']['incomingThirdPartyBadge']['operatorDirect'] is False
          assert p['roaming']['outgoingMétropolisBadge']['usableOnOtherNetworksCurrentOfficialFaq'] is False
          assert p['sourceEvidence']['officialOnly'] is True
          print('Validated Métropolis public, subscription, post-charge and roaming layers')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/metropolis/metropolis_official_grand_paris.json')
          dst=Path('data/operator_direct/metropolis_official_grand_paris.json')
          rep=Path('reports/metropolis/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'fees':d.get('fees'),
                  'roaming':d.get('roaming'),
                  'network':d.get('network'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/metropolis/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Métropolis rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/metropolis_official_grand_paris.json reports/metropolis/latest_summary.md
          git commit -m "data(metropolis): publish official Grand Paris tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
