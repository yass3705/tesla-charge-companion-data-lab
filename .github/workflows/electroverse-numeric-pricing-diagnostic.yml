name: Audit Electroverse FR numeric pricing diagnostic
on:
  push:
    branches:
      - audit/electroverse-numeric-pricing-diagnostic
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-numeric-pricing-diagnostic.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build diagnostic overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs /tmp/electroverse-numeric-diagnostic
