name: Ze-Watt France refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 3'
  push:
    paths:
      - 'scripts/zewatt/extract_zewatt_france.mjs'
      - 'scripts/zewatt/compile_zewatt_v9_offers.mjs'
      - '.github/workflows/zewatt-france-refresh.yml'

permissions:
  contents: write

concurrency:
  group: zewatt-france-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Ze-Watt France
        run: |
          mkdir -p /tmp/zewatt-refresh
          node scripts/zewatt/extract_zewatt_france.mjs \
            --concurrency 4 \
            --out /tmp/zewatt-refresh/zewatt.json.gz \
            --summary /tmp/zewatt-refresh/summary.json

      - name: Validate refresh and protect previous snapshot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const next=JSON.parse(fs.readFileSync('/tmp/zewatt-refresh/summary.json','utf8'));
          const currentPath='data/zewatt/france/current/summary.json';
          const current=fs.existsSync(currentPath)?JSON.parse(fs.readFileSync(currentPath,'utf8')):null;

          function assert(ok,msg){if(!ok)throw new Error(msg);}
          assert(next.staticRows>=800,`static inventory too small: ${next.staticRows}`);
          assert(next.dynamicRows>=800,`dynamic inventory too small: ${next.dynamicRows}`);
          assert(next.uniqueSerials>=600,`unique serial inventory too small: ${next.uniqueSerials}`);
          assert(next.companyOk>=100,`too few Ze-Watt company endpoint successes: ${next.companyOk}`);
          assert(next.directGuestStations>0,'no visitor_stripe direct guest stations recovered');

          if(current){
            assert(next.uniqueSerials>=Math.floor(current.uniqueSerials*0.90),
              `serial coverage regressed: ${next.uniqueSerials} < 90% of ${current.uniqueSerials}`);
            assert(next.companyOk>=Math.floor(current.companyOk*0.80),
              `company endpoint coverage regressed: ${next.companyOk} < 80% of ${current.companyOk}`);
          }
          console.log(JSON.stringify({validated:true,next,current},null,2));
          NODE

      - name: Publish validated snapshot
        run: |
          mkdir -p data/zewatt/france/current
          mv /tmp/zewatt-refresh/zewatt.json.gz data/zewatt/france/current/zewatt.json.gz
          mv /tmp/zewatt-refresh/summary.json data/zewatt/france/current/summary.json

      - name: Compile V9 Ze-Watt direct offers
        run: |
          node scripts/zewatt/compile_zewatt_v9_offers.mjs \
            --snapshot data/zewatt/france/current/zewatt.json.gz \
            --out v9-production-runtime/data/v9/france-zewatt-offers.json

      - name: Validate V9 Ze-Watt offers
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='v9-production-runtime/data/v9/france-zewatt-offers.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.country!=='FR'||d.mode!=='verified_zewatt_direct') throw new Error('unexpected Ze-Watt payload');
          if(!Array.isArray(d.directOffers)||d.directOffers.length<30) throw new Error(`Ze-Watt profiles incomplete: ${d.directOffers?.length||0}`);
          if(d.directOffers.some(x=>!Array.isArray(x.evseIds)||!x.evseIds.length)) throw new Error('Ze-Watt offer without exact EVSE IDs');
          if(d.directOffers.some(x=>x.metadata?.visitorStripeRequired!==true)) throw new Error('non-guest Ze-Watt context leaked into direct offers');
          const evses=new Set(d.directOffers.flatMap(x=>x.evseIds||[]));
          if(evses.size<500) throw new Error(`Ze-Watt exact EVSE coverage incomplete: ${evses.size}`);
          const raw=JSON.stringify(d.directOffers);
          for(const field of ['chargePerMinute','afterMinutesRate','postChargeRate','connectionFee']){
            if(raw.includes(`"${field}"`)) throw new Error(`legacy unsupported pricing field leaked: ${field}`);
          }
          console.log(`validated ${d.directOffers.length} Ze-Watt profiles / ${evses.size} exact EVSEs`);
          NODE

      - name: Commit refreshed Ze-Watt snapshot and V9 offers
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/zewatt/france/current v9-production-runtime/data/v9/france-zewatt-offers.json)" ]; then
            echo "No Ze-Watt data change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zewatt/france/current v9-production-runtime/data/v9/france-zewatt-offers.json
          git commit -m "data(france): refresh Ze-Watt direct snapshot and V9 offers"

          git fetch origin main
          changed_since_start="$(git diff --name-only "$GITHUB_SHA"..origin/main || true)"
          if printf '%s\n' "$changed_since_start" | grep -Eq '^(scripts/zewatt/|\.github/workflows/zewatt-france-refresh\.yml$)'; then
            echo "Ze-Watt refresh logic changed on main while this run was executing; refusing stale output."
            printf '%s\n' "$changed_since_start"
            exit 1
          fi

          git rebase origin/main
          git push origin HEAD:main
