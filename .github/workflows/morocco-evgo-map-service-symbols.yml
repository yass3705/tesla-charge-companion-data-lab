name: Morocco EVGO map-service symbols

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/morocco_evgo_map_service_symbols_probe.py"
      - ".github/workflows/morocco-evgo-map-service-symbols.yml"

permissions:
  contents: write

concurrency:
  group: morocco-evgo-map-service-symbols
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/morocco_evgo_map_service_symbols_probe.py
      - name: Run static map-service symbol probe
        run: python scripts/morocco_evgo_map_service_symbols_probe.py
      - name: Persist sanitized report
        run: |
          set -euo pipefail
          test -s artifacts/morocco-evgo-map-service-symbols/summary.json
          python scripts/public_safety_check.py artifacts/morocco-evgo-map-service-symbols
          mkdir -p reports/morocco/evgo
          cp artifacts/morocco-evgo-map-service-symbols/summary.json reports/morocco/evgo/latest-map-service-symbols.json
          python scripts/public_safety_check.py reports/morocco/evgo/latest-map-service-symbols.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/evgo/latest-map-service-symbols.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update EVGO map-service symbols [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
