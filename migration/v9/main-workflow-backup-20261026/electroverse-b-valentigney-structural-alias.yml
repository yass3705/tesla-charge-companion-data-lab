name: Audit Valentigney repeated alias structure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_valentigney_structural_alias.mjs"
      - ".github/workflows/electroverse-b-valentigney-structural-alias.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/audit_b_valentigney_structural_alias.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-valentigney-structural-alias-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist Valentigney repeated alias structure"
            git pull --rebase origin main || true
            git push
          fi
