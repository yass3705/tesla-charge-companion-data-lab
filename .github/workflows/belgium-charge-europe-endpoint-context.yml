name: Belgium Charge Europe endpoint context
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-charge-europe-endpoint-context.txt"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_charge_europe_string_context.py
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/charge-europe-string-context-2026-09-28.json
          git commit -m "Inspect Charge Europe pricing endpoint context" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
