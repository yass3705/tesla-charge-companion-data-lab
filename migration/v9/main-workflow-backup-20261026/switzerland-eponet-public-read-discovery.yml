name: Switzerland Eponet public read discovery
on:
  push:
    paths:
      - 'scripts/probe_swiss_eponet_public_read_discovery.py'
      - '.github/workflows/switzerland-eponet-public-read-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/probe_swiss_eponet_public_read_discovery.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-eponet-public-read-discovery-2026-09-28.json
          git commit -m 'docs(switzerland): probe Eponet public read routes' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
