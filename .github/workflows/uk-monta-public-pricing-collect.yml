name: UK Monta public pricing collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-monta-public-pricing-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect and join Monta UK public pricing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json,gzip,urllib.request,urllib.parse,time,re,html as htmllib
          from html.parser import HTMLParser
          from pathlib import Path
          from datetime import datetime,timezone

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None; self.buf=[]; self.tag=None
              def handle_starttag(self,tag,attrs):
                  if tag=='tr': self.row=[]
                  elif tag in ('td','th') and self.row is not None: self.cell=tag; self.buf=[]
              def handle_data(self,data):
                  if self.cell: self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell:
                      self.row.append(re.sub(r'\s+',' ',' '.join(self.buf)).strip()); self.cell=None; self.buf=[]
                  elif tag=='tr' and self.row is not None:
                      if self.row: self.rows.append(self.row)
                      self.row=None

          base='https://app.monta.app/roaming/monta-as-a-cpo-pricing'
          all_rows=[]; header=None; pages=0
          for page in range(1,250):
              url=base+'?'+urllib.parse.urlencode({'country':'all','page':page,'per_page':200})
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9','Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=90) as r: raw=r.read().decode('utf-8','replace')
              p=TableParser(); p.feed(raw)
              rows=p.rows
              # Identify the pricing table by rows containing EVSE-like ids / header.
              if header is None:
                  for rr in rows:
                      low=[x.lower() for x in rr]
                      if any('evse' in x for x in low) and any(('price' in x or 'tariff' in x) for x in low): header=rr; break
              data=[]
              for rr in rows:
                  if any(re.fullmatch(r'[A-Z]{2}\*?[A-Z0-9]{3}\*?E[A-Z0-9]+',x.strip()) for x in rr): data.append(rr)
              all_rows.extend(data); pages+=1
              print(json.dumps({'page':page,'tableRows':len(rows),'dataRows':len(data)}))
              if len(data)<200: break
              time.sleep(.35)

          # Infer useful fields from each row by patterns, preserving the raw row for audit.
          parsed=[]
          for rr in all_rows:
              evse=next((x for x in rr if re.fullmatch(r'[A-Z]{2}\*?[A-Z0-9]{3}\*?E[A-Z0-9]+',x.strip())),None)
              tariff=next((x for x in reversed(rr) if re.fullmatch(r'GB[A-Z0-9-]*T\d+',x.strip())),None)
              currency=next((x.lower() for x in rr if x.lower() in ('gbp','eur','dkk','sek','nok','chf','usd')),None)
              # Price is normally the numeric cell immediately preceding optional fee cells and currency.
              nums=[]
              for i,x in enumerate(rr):
                  try:
                      if re.fullmatch(r'-?\d+(?:\.\d+)?',x.strip()): nums.append((i,float(x)))
                  except Exception: pass
              # Based on public table columns: power precedes price; pick numeric immediately before currency when possible.
              price=None; power=None
              ci=next((i for i,x in enumerate(rr) if x.lower()==(currency or '')),None)
              if ci is not None:
                  before=[(i,v) for i,v in nums if i<ci]
                  if before:
                      # currency is after several fee columns which may be blank; last nonblank numeric before it is usually price or a fee.
                      # Prefer the second numeric after address/country when available: first is power, second is energy price.
                      if len(before)>=2: power=before[0][1]; price=before[1][1]
                      else: price=before[-1][1]
              parsed.append({'evseId':evse,'tariffId':tariff,'currency':currency,'powerKw':power,'energyPrice':price,'raw':rr})

          # Load persisted successful MON inventory, restrict to active EVSEs.
          with gzip.open('data/national/uk_monta_mon_locations.json.gz','rt',encoding='utf-8') as g: snap=json.load(g)
          active=[]
          for loc in snap.get('locations') or []:
              for ev in loc.get('evses') or []:
                  if not isinstance(ev,dict) or str(ev.get('status') or '').upper()=='REMOVED': continue
                  for con in ev.get('connectors') or []:
                      if not isinstance(con,dict): continue
                      active.append({'locationId':loc.get('id'),'locationName':loc.get('name'),'evseId':ev.get('evse_id'),'status':ev.get('status'),'connectorId':con.get('id'),'tariffIds':[str(x) for x in (con.get('tariff_ids') or [])]})
          by_evse={str(x.get('evseId')):x for x in parsed if x.get('evseId')}
          joined=[]; missing=[]; mismatch=[]
          for a in active:
              p=by_evse.get(str(a.get('evseId')))
              if not p: missing.append(a); continue
              row={**a,'pricing':p}; joined.append(row)
              if a['tariffIds'] and p.get('tariffId') and p['tariffId'] not in a['tariffIds']: mismatch.append(row)
          # Tariff-level consistency check: one tariff should normally map to one energy price/currency.
          tariff_values={}
          for p in parsed:
              tid=p.get('tariffId')
              if not tid: continue
              tariff_values.setdefault(tid,set()).add((p.get('energyPrice'),p.get('currency')))
          conflicts={k:sorted([list(v) for v in vals],key=str) for k,vals in tariff_values.items() if len(vals)>1}
          retrieved=datetime.now(timezone.utc).isoformat()
          out={'country':'GB','network':'Monta platform','retrievedAt':retrieved,'sourceUrl':base,'header':header,'pages':pages,'pricingRows':parsed,'activeJoined':joined}
          summary={'country':'GB','network':'Monta platform','retrievedAt':retrieved,'pages':pages,'pricingRows':len(parsed),'activeConnectors':len(active),'joinedActiveConnectors':len(joined),'missingActiveConnectors':len(missing),'joinCoveragePct':round(100*len(joined)/len(active),2) if active else None,'tariffIdMismatches':len(mismatch),'distinctPricingTariffs':len(tariff_values),'tariffPriceConflicts':conflicts,'header':header,'firstRows':parsed[:5],'status':'complete' if active and not missing and not mismatch and not conflicts else 'partial'}
          with gzip.open('data/national/uk_monta_public_pricing.json.gz','wt',encoding='utf-8') as g: json.dump(out,g,ensure_ascii=False,separators=(',',':'))
          Path('reports/uk/monta-public-pricing-latest.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_monta_public_pricing.json.gz reports/uk/monta-public-pricing-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Monta public pricing [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
