name: Italy remaining CPO inventory

on:
  workflow_dispatch:
  push:
    branches:
      - research/italy-cpo-priority-20260905
    paths:
      - scripts/italy_remaining_cpo_inventory.py
      - .github/workflows/italy-remaining-cpo-inventory.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: italy-remaining-cpo-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest successful Italy V9 consolidation
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow italy-v9-consolidation.yml --branch research/italy-consolidation-v9-a2a --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/italy-consolidation
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name italy-v9-consolidated-candidate --dir /tmp/italy-consolidation
          INPUT="$(find /tmp/italy-consolidation -name 'italy_v9_candidate.json.gz' -print -quit)"
          test -n "$INPUT" && test -s "$INPUT"
          cp "$INPUT" /tmp/italy_v9_candidate.json.gz
      - name: Build remaining CPO inventory
        run: |
          python -m py_compile scripts/italy_remaining_cpo_inventory.py
          python scripts/italy_remaining_cpo_inventory.py --input /tmp/italy_v9_candidate.json.gz --output data/reports/italy_remaining_cpo_priority.json
      - name: Publish inventory report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/italy_remaining_cpo_priority.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Italy: publish remaining CPO priority inventory [run ${GITHUB_RUN_ID}]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: italy-remaining-cpo-priority
          path: data/reports/italy_remaining_cpo_priority.json
          if-no-files-found: error
          retention-days: 14
