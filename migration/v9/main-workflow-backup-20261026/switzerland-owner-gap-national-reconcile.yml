name: Switzerland owner-gap national reconciliation
on:
  push:
    paths:
      - 'scripts/reconcile_swiss_owner_gap_national.py'
      - '.github/workflows/switzerland-owner-gap-national-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/reconcile_swiss_owner_gap_national.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-owner-gap-national-reconciliation-2026-09-28.json
          git commit -m 'docs(switzerland): reconcile owner-gap second pass to national scope' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
