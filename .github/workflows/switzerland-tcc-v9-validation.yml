name: Switzerland TCC V9 validation
on:
  push:
    paths:
      - 'scripts/validate_swiss_tcc_v9_bundle.py'
      - '.github/workflows/switzerland-tcc-v9-validation.yml'
      - 'data/tcc_v9/switzerland.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/validate_swiss_tcc_v9_bundle.py
      - name: Persist
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-v9-validation-2026-09-28.json
          git commit -m 'test(switzerland): validate TCC V9 bundle' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
