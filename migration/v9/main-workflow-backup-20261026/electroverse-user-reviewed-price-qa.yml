name: Electroverse user-reviewed price decisions QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_electroverse_user_review_price_decisions.mjs
      - scripts/build_electroverse_france_evse_overlay.mjs
      - data/platforms/electroverse/validated-mappings/price-disputes-review-2026-10-11.json
      - .github/workflows/electroverse-user-reviewed-price-qa.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check builder and QA source syntax
        run: |
          node --check scripts/build_electroverse_france_evse_overlay.mjs
          node --check scripts/audit_electroverse_user_review_price_decisions.mjs
      - name: Audit all 23 user-reviewed pricing disputes
        run: node scripts/audit_electroverse_user_review_price_decisions.mjs
      - name: Archive detailed test decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electroverse-user-reviewed-price-decisions
          path: reports/electroverse/price-disputes-23-validation-2026-10-11.json
          if-no-files-found: warn
      - name: Publish QA report (not the tariff overlay)
        run: |
          set -euo pipefail
          cp reports/electroverse/price-disputes-23-validation-2026-10-11.json /tmp/ev_user_price_decisions_qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/electroverse
            cp /tmp/ev_user_price_decisions_qa.json reports/electroverse/price-disputes-23-validation-2026-10-11.json
            git add reports/electroverse/price-disputes-23-validation-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(electroverse): confirm 15 price quarantines and 8 power-split stations'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
