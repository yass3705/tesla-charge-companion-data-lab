name: Inspect Freshmile LLJCP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freshmile-inspect-lljcp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Freshmile location
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --get \
            --data-urlencode 'filter[ref]=LLJCP3OVP21SAS' \
            'https://prod-driver-api.freshmile.com/charge/api/v2/locations' \
            -o /tmp/location.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/location.json',encoding='utf-8'))
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
