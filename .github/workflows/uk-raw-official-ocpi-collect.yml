name: UK RAW official OCPI collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-raw-official-ocpi-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Collect RAW official public OCPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk data/national
          python3 - <<'PY'
          import json,gzip,urllib.request,pathlib,collections
          from datetime import datetime,timezone

          BASE="https://reservations-prod-webapp.azurewebsites.net"
          UA="TeslaChargeCompanion/9 public-open-data"
          def get(path):
              req=urllib.request.Request(BASE+path,headers={"User-Agent":UA,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.status,json.loads(r.read().decode("utf-8"))

          ls,locs=get("/ocpi/locations")
          ts,tariffs=get("/ocpi/tariffs/GB/CPIE")
          if not isinstance(locs,list): raise RuntimeError("locations_not_list")
          if not isinstance(tariffs,list): raise RuntimeError("tariffs_not_list")

          evses=connectors=0
          refs=set(); tids={str(x.get("id")) for x in tariffs if isinstance(x,dict) and x.get("id") is not None}
          statuses=collections.Counter(); parties=collections.Counter(); powers=collections.Counter()
          for loc in locs:
              if not isinstance(loc,dict): continue
              parties[str(loc.get("party_id"))]+=1
              for ev in loc.get("evses") or []:
                  if not isinstance(ev,dict): continue
                  evses+=1; statuses[str(ev.get("status") or "UNKNOWN")]+=1
                  for c in ev.get("connectors") or []:
                      if not isinstance(c,dict): continue
                      connectors+=1
                      p=c.get("max_electric_power")
                      if p is not None: powers[str(p)]+=1
                      for tid in c.get("tariff_ids") or []: refs.add(str(tid))
          missing=sorted(refs-tids)

          out={
            "retrievedAt":datetime.now(timezone.utc).isoformat(),
            "sourceBase":BASE,
            "locationsEndpoint":BASE+"/ocpi/locations",
            "tariffsEndpoint":BASE+"/ocpi/tariffs/GB/CPIE",
            "http":{"locations":ls,"tariffs":ts},
            "summary":{
              "locations":len(locs),"evses":evses,"connectors":connectors,
              "tariffs":len(tariffs),"partyIds":dict(parties),
              "statuses":dict(statuses),"powerKw":dict(powers),
              "referencedTariffIds":len(refs),
              "resolvedTariffIds":len(refs & tids),
              "missingTariffIds":len(missing),
              "missingIds":missing
            }
          }
          pathlib.Path("reports/uk/raw-official-ocpi-latest.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          with gzip.open("data/national/uk_raw_official_ocpi.json.gz","wt",encoding="utf-8") as g:
              json.dump({"retrievedAt":out["retrievedAt"],"sourceBase":BASE,"locations":locs,"tariffs":tariffs},g,ensure_ascii=False,separators=(",",":"))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/raw-official-ocpi-latest.json data/national/uk_raw_official_ocpi.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect RAW official public OCPI [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
