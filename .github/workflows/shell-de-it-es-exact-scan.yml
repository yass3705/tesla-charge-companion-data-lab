name: Shell DE-IT-ES exact country tariff scan

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/shell-de-it-es-exact-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-api-global
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact DE IT ES Shell-family locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/cross-country
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-DE-IT-ES-Exact"; PROVIDER="Shell_RP_2"
          last=0.0; token=None; refreshes=0

          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token,refreshes
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr:
                  token=json.loads(rr.read().decode())["access_token"]
              refreshes+=1
          auth()

          def get(path,params=None):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+path
                  if params: url+="?"+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url,headers={
                      "Authorization":"Bearer "+token,"Accept":"application/json",
                      "RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr:
                          return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:2000]}
              return 0,{}

          countries={
              "DE":{"bbox":(5.8,47.2,15.1,55.1),"grid":(4,3),"codes":{"DEU","DE"}},
              "IT":{"bbox":(6.6,36.5,18.6,47.2),"grid":(4,3),"codes":{"ITA","IT"}},
              "ES":{"bbox":(-9.5,35.8,3.4,43.9),"grid":(4,3),"codes":{"ESP","ES"}}
          }
          terms=("shell","ubitricity","newmotion")
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"providerId":PROVIDER,"countries":{}}

          for cc,cfg in countries.items():
              west,south,east,north=cfg["bbox"]; nx,ny=cfg["grid"]; markers=[]
              for iy in range(ny):
                  s=south+(north-south)*iy/ny; n=south+(north-south)*(iy+1)/ny
                  for ix in range(nx):
                      w=west+(east-west)*ix/nx; e=west+(east-west)*(ix+1)/nx
                      st,body=get("/v2/locations/markers",{"west":w,"south":s,"east":e,"north":n,"zoom":12})
                      data=body.get("data") if isinstance(body,dict) else None
                      if st==200 and isinstance(data,list): markers.extend(data)

              uniq={}
              for m in markers:
                  if not isinstance(m,dict) or m.get("markerType")!="SingleLocation" or not m.get("locationUid"): continue
                  op=str(m.get("operatorName") or "")
                  if any(t in op.lower() for t in terms):
                      uniq[str(m["locationUid"])]=m

              rows=[]
              for uid in uniq:
                  st,body=get("/v2/locations/"+urllib.parse.quote(uid,safe=""),{"providerId":PROVIDER})
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data: data=data[0]
                  if not isinstance(data,dict): continue
                  addr=data.get("address") or {}; country=str(addr.get("country") or "").upper()
                  if country not in cfg["codes"]: continue
                  tariffs=[]; connectors=0; evseIds=[]
                  for ev in data.get("evses") or []:
                      if ev.get("evseId"): evseIds.append(ev.get("evseId"))
                      for conn in ev.get("connectors") or []:
                          connectors+=1
                          for t in conn.get("tariffs") or []:
                              tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
                  rows.append({
                      "uid":uid,"httpStatus":st,"operatorId":data.get("operatorId"),
                      "operatorName":data.get("operatorName"),"subOperatorName":data.get("subOperatorName"),
                      "address":addr,"connectorCount":connectors,"evseIds":evseIds,
                      "tariffCount":len(tariffs),"tariffs":tariffs
                  })

              byop={}
              for x in rows:
                  op=str(x.get("operatorName") or "UNKNOWN")
                  z=byop.setdefault(op,{"locations":0,"withTariff":0,"connectors":0,"tariffObjects":0})
                  z["locations"]+=1; z["connectors"]+=x["connectorCount"]; z["tariffObjects"]+=x["tariffCount"]
                  if x["tariffCount"]>0: z["withTariff"]+=1

              out["countries"][cc]={
                  "candidateMarkerCount":len(uniq),
                  "exactCountryLocationCount":len(rows),
                  "operatorCoverage":byop,
                  "locations":rows
              }

          out["tokenRefreshCount"]=refreshes
          Path("reports/cross-country/shell-de-it-es-exact-scan-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps({
              cc:{
                  "candidateMarkerCount":v["candidateMarkerCount"],
                  "exactCountryLocationCount":v["exactCountryLocationCount"],
                  "operatorCoverage":v["operatorCoverage"]
              } for cc,v in out["countries"].items()
          },ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/cross-country/shell-de-it-es-exact-scan-latest.json /tmp/shell-de-it-es-exact-scan-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/shell-de-it-es-exact-scan-latest.json reports/cross-country/shell-de-it-es-exact-scan-latest.json
          git add reports/cross-country/shell-de-it-es-exact-scan-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: exact DE-IT-ES Shell API tariff scan [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
