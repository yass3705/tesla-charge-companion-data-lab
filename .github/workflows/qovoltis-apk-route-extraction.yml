# probe-current-2026-08-26-rawscan
name: Qovoltis APK route extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-apk-route-extraction.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current Qovoltis Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -sS -L --max-time 180 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.qovoltis.client?versionCode=50012' -o work/qovoltis.xapk
          unzip -q work/qovoltis.xapk -d work/xapk
          BASE_APK=$(find work/xapk -type f -name 'com.qovoltis.client.apk' | head -1)
          cp "$BASE_APK" work/base.apk
          echo "xapk_bytes=$(wc -c < work/qovoltis.xapk)" > out/download.txt
          echo "base_apk=$BASE_APK bytes=$(wc -c < work/base.apk)" >> out/download.txt
          find work/xapk -type f -name '*.apk' -printf '%p %s\n' >> out/download.txt
          unzip -l work/base.apk > out/apk-file-list.txt

      - name: Raw APK DEX resource and native string scan
        shell: bash
        run: |
          set +e
          mkdir -p work/raw
          unzip -q work/base.apk -d work/raw
          : > out/raw-network-tariff-hits.txt
          while IFS= read -r -d '' f; do
            strings -a -n 4 "$f" 2>/dev/null | grep -Eai \
              'https?://|wss?://|qovoltis|qorest|qoapi|chargenow|qockpit|gireve|ocpi|emsp|cpo|station[-_/ ]?(list|preview|map|detail)|borne|chargepoint|connector|evse|tarif|tariff|pricing|price[_ -]?per|reference[_ -]?unit|heures[_ -]?(creuses|pleines)|kwh|graphql|base[_ -]?url|api[_ -]?url' \
              | sed "s#^#$f\t#" >> out/raw-network-tariff-hits.txt || true
          done < <(find work/raw -type f -print0)
          sort -u out/raw-network-tariff-hits.txt -o out/raw-network-tariff-hits.txt
          grep -Eai 'qovoltis|qorest|qoapi|chargenow|qockpit|gireve|ocpi|https?://[^ ]*qovoltis|station[-_/ ]?(list|preview|map|detail)|tarif|tariff|pricing|price[_ -]?per|heures[_ -]?(creuses|pleines)' out/raw-network-tariff-hits.txt \
            > out/qovoltis-focused-hits.txt || true
          sed -n '1,6000p' out/qovoltis-focused-hits.txt

      - name: Inspect manifest resources and app assets
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt >/dev/null 2>&1 || true
          aapt dump badging work/base.apk > out/aapt-badging.txt 2>&1 || true
          aapt dump xmltree work/base.apk AndroidManifest.xml > out/manifest-tree.txt 2>&1 || true
          find work/raw/assets work/raw/res work/raw/lib -type f -printf '%p\n' 2>/dev/null | head -20000 > out/assets-res-libs.txt
          grep -Eai 'flutter|react|capacitor|cordova|network|retrofit|okhttp|ktor|graphql|qovoltis|api' out/apk-file-list.txt > out/framework-clues.txt || true
          sed -n '1,2000p' out/framework-clues.txt

      - name: Decompile and scan app package plus Retrofit routes
        shell: bash
        run: |
          set +e
          URL=$(python - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/skylot/jadx/releases/latest',headers={'User-Agent':'qovoltis-probe'})
          obj=json.load(urllib.request.urlopen(req,timeout=30))
          for a in obj['assets']:
              n=a['name'].lower()
              if n.startswith('jadx-') and n.endswith('.zip') and 'gui' not in n:
                  print(a['browser_download_url']); break
          PY
          )
          curl -sS -L --max-time 120 "$URL" -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx
          work/jadx/bin/jadx --show-bad-code --no-res --threads-count 2 -d work/src work/base.apk >out/jadx.log 2>&1 || true
          find work/src/sources -type f | grep -Ei '/com/qovoltis/|qovoltis' > out/qovoltis-source-files.txt || true
          : > out/qovoltis-source-evidence.txt
          while IFS= read -r f; do
            echo "===== $f =====" >> out/qovoltis-source-evidence.txt
            grep -nEai -C 8 'https?://|baseUrl|@GET|@POST|@PUT|station|borne|connector|evse|tarif|tariff|pricing|price|kwh|offer|map|charge' "$f" 2>/dev/null | head -1000 >> out/qovoltis-source-evidence.txt || true
          done < out/qovoltis-source-files.txt
          grep -RInE --include='*.java' -C 6 '@(GET|POST|PUT|DELETE|PATCH)' work/src/sources 2>/dev/null \
            | grep -Eai -B 8 -A 8 'station|borne|connector|evse|tarif|tariff|pricing|price|offer|map|charge|qovoltis' \
            > out/retrofit-relevant.txt || true
          grep -RInE --include='*.java' -C 5 'https?://[^" ]+|baseUrl\(|BASE_URL|API_URL' work/src/sources 2>/dev/null \
            | grep -Eai -B 6 -A 6 'qovoltis|api|station|borne|charge|map' > out/decompiled-url-evidence.txt || true
          sed -n '1,5000p' out/qovoltis-source-evidence.txt

      - name: Summarize current app architecture evidence
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import re
          files=['qovoltis-focused-hits.txt','qovoltis-source-evidence.txt','retrofit-relevant.txt','decompiled-url-evidence.txt','framework-clues.txt']
          text='\n'.join(Path('out/'+f).read_text(errors='replace') if Path('out/'+f).exists() else '' for f in files)
          urls=sorted(set(re.findall(r'https?://[^\s"\'<>),]+',text,re.I)))
          urls=[u for u in urls if any(k in u.lower() for k in ('qovoltis','qorest','qoapi','chargenow','qockpit','gireve','ocpi'))]
          route_pat=re.compile(r'@(GET|POST|PUT|DELETE|PATCH)[^\n]{0,100}["\']([^"\']+)',re.I)
          routes=[]
          for m in route_pat.finditer(text):
              p=m.group(2)
              if any(k in p.lower() for k in ('station','borne','map','connector','evse','price','pricing','tarif','offer','charge')):
                  routes.append((m.group(1).upper(),p))
          lines=['URLS:']+urls+['','ROUTES:']+[f'{m}\t{p}' for m,p in sorted(set(routes))]
          for key in ('tarif_heures_creuses','tarif_heures_pleines','price_per_reference_unit','pricing_qovoltis','pricing_total','reference_unit'):
              lines.append(f'KEY {key}: {key.lower() in text.lower()}')
          Path('out/SUMMARY.txt').write_text('\n'.join(lines),encoding='utf-8')
          print(Path('out/SUMMARY.txt').read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-apk-route-extraction-current
          path: out
          retention-days: 5
