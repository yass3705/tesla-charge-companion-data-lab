name: UK Shell cross-network tariff probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-cross-network-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe ChargePoint and InstaVolt through Shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime, timezone

          cid=os.environ["SHELL_EV_CLIENT_ID"]; secret=os.environ["SHELL_EV_CLIENT_SECRET"]
          AUTH="https://api-test.shell.com/v1/oauth/token"; BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Cross-Network-Probe"; PROVIDER="Shell_RP_2"
          last=0.0
          def throttle():
              global last
              now=time.monotonic(); wait=7.5-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()
          def auth():
              throttle()
              form=urllib.parse.urlencode({"client_id":cid,"client_secret":secret,"grant_type":"client_credentials"}).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as rr: return json.loads(rr.read().decode())["access_token"]
          token=auth()
          def call(uid):
              global token
              for attempt in range(2):
                  throttle()
                  url=BASE+"/v2/locations/"+urllib.parse.quote(uid,safe="")+"?"+urllib.parse.urlencode({"providerId":PROVIDER})
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json","RequestId":str(uuid.uuid4()),"User-Agent":UA})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as rr: return rr.status,json.loads(rr.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code==401 and attempt==0:
                          token=auth(); continue
                      return e.code,{"errorBody":e.read().decode("utf-8","replace")[:2000]}
              return 0,{}

          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)
          locs=inv.get("locations") or []
          families={
              "ChargePoint":[x for x in locs if str(x.get("operatorName") or "")=="ChargePoint"][:10],
              "InstaVolt":[x for x in locs if str(x.get("operatorName") or "")=="InstaVolt-IS"][:10]
          }
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"providerId":PROVIDER,"families":{}}
          for fam,rows in families.items():
              res=[]
              for loc in rows:
                  uid=str(loc.get("uid") or loc.get("externalId") or "")
                  if not uid: continue
                  st,body=call(uid)
                  tariffs=[]; connectors=0
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data: data=data[0]
                  if isinstance(data,dict):
                      for ev in data.get("evses") or []:
                          for conn in ev.get("connectors") or []:
                              connectors+=1
                              for t in conn.get("tariffs") or []:
                                  tariffs.append({"evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),"tariff":t})
                  res.append({"uid":uid,"httpStatus":st,"connectorCount":connectors,"tariffCount":len(tariffs),"tariffs":tariffs})
              out["families"][fam]={
                  "sampleCount":len(res),
                  "http200":sum(1 for x in res if x["httpStatus"]==200),
                  "withTariff":sum(1 for x in res if x["tariffCount"]>0),
                  "tariffObjects":sum(x["tariffCount"] for x in res),
                  "results":res
              }
          Path("reports/uk/shell-cross-network-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:{kk:v[kk] for kk in ("sampleCount","http200","withTariff","tariffObjects")} for k,v in out["families"].items()},indent=2))
          PY
      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/uk/shell-cross-network-probe-latest.json /tmp/shell-cross-network-probe-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/shell-cross-network-probe-latest.json reports/uk/shell-cross-network-probe-latest.json
          git add reports/uk/shell-cross-network-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): probe Shell tariffs for ChargePoint and InstaVolt [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:main
