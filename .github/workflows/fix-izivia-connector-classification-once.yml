name: Fix IZIVIA household connector classification once
on:
  push:
    paths:
      - ".github/workflows/fix-izivia-connector-classification-once.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify household sockets as AC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_izivia_express_tcc_v8.py')
          s=p.read_text()
          old='kind = "AC" if standard in ("t2", "type2", "type_2") and power <= 43 else "DC"'
          new='kind = "AC" if standard in ("t2", "type2", "type_2", "standard_household") and power <= 43 else "DC"'
          if old not in s: raise SystemExit('classification target not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_izivia_express_tcc_v8.py
          git commit -m 'Classify IZIVIA household sockets as AC'
          git push
