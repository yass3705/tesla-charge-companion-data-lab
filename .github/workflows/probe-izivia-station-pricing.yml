name: France IZIVIA station pricing probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-station-pricing.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Probe one live station and pricing items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia
          python - <<'PY'
          import json,subprocess,pathlib,uuid,urllib.parse
          base='https://fronts-map.izivia.com/api'; device=str(uuid.uuid4())
          common=['-sS','-A','Mozilla/5.0','-H','accept: application/json','-H','Accept-Language: fr','-H',f'x-device-id: {device}']
          def call(method,path,body=None):
              cmd=['curl',*common,'-w','\n%{http_code}','-X',method]
              if body is not None: cmd += ['-H','content-type: application/json','--data',json.dumps(body,separators=(',',':'))]
              cmd += [base+path]
              r=subprocess.run(cmd,capture_output=True,text=True)
              payload,status=r.stdout.rsplit('\n',1) if '\n' in r.stdout else (r.stdout,'')
              try:data=json.loads(payload)
              except:data=payload
              return int(status or 0),data
          ms,markers=call('POST','/map/markers',{'square':{'centerLat':48.8566,'centerLng':2.3522,'zoom':9},'filters':{}})
          chosen=markers[0] if isinstance(markers,list) and markers else None
          out={'markersStatus':ms,'markerCount':len(markers) if isinstance(markers,list) else None,'chosen':chosen}
          if chosen:
              sid=chosen['id']; ds,detail=call('POST',f'/charging-locations/{sid}',{'filters':{}})
              out['detailStatus']=ds
              out['detailKeys']=list(detail) if isinstance(detail,dict) else []
              legacy=detail.get('legacyId') if isinstance(detail,dict) else None
              emip=detail.get('firstStationEmipId') if isinstance(detail,dict) else None
              out['legacyId']=legacy;out['firstStationEmipId']=emip
              if legacy is not None and emip:
                  q=urllib.parse.urlencode({'legacyId':legacy,'stationEmipId':emip})
                  ps,p=call('GET',f'/charging-locations/{sid}/pricing-info-items?{q}')
                  out['pricingStatus']=ps;out['pricing']=p
              else:
                  out['pricingStatus']=None;out['pricing']=None
          pathlib.Path('reports/france/izivia/station-pricing-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/izivia/station-pricing-probe.json
          git commit -m 'France IZIVIA: publish exact pricing probe' || exit 0
          git pull --rebase origin main
          git push
