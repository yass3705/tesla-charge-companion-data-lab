name: Analyze Electroverse France NUMERIC tariff coherence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_numeric_tariff_coherence.mjs"
      - ".github/workflows/electroverse-numeric-tariff-coherence.yml"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze and persist NUMERIC tariff-coherence groups
        run: |
          node scripts/analyze_electroverse_numeric_tariff_coherence.mjs
          test -s reports/electroverse/numeric-tariff-coherence-analysis.json
          test -s data/platforms/electroverse/validated-mappings/final-residual-recovery-plan.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/numeric-tariff-coherence-analysis.json data/platforms/electroverse/validated-mappings/final-residual-recovery-plan.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist NUMERIC tariff-coherence groups"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 2))
            done
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-numeric-tariff-coherence
          path: reports/electroverse/numeric-tariff-coherence-analysis.json
          retention-days: 14
