name: UK TotalEnergies targeted APIF key

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-totalenergies-targeted-apif-key.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Target exact x-apif-apikey client credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/total-xapk /tmp/total-unpack reports/uk data/national
          curl -fL --retry 3 --retry-delay 2             'https://d.apkpure.net/b/XAPK/com.total.europe?versionCode=3098'             -o /tmp/total-xapk/total.xapk
          unzip -q /tmp/total-xapk/total.xapk -d /tmp/total-unpack

          python3 - <<'PY'
          import json, pathlib, re, subprocess, hashlib, urllib.request, urllib.error, urllib.parse, gzip
          from datetime import datetime, timezone

          base='https://prod.apix.alzp.tgscloud.net/evdc-bff-europe/v0.0.1'
          blobs=[]
          for p in pathlib.Path('/tmp/total-unpack').rglob('*.apk'):
              try:
                  blobs.append(subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace',timeout=60).stdout)
              except Exception:
                  pass
          lines='\n'.join(blobs).splitlines()

          idx=[i for i,x in enumerate(lines) if 'x-apif-apikey' in x.lower()]
          candidates=[]
          for i in idx:
              for x in lines[max(0,i-120):min(len(lines),i+121)]:
                  x=x.strip()
                  if not (20 <= len(x) <= 160): continue
                  if re.fullmatch(r'[A-Za-z0-9._~+/=-]+',x) and not any(w in x.lower() for w in [
                      'flutter','android','application','totalenergies','mapbox','http','assets','init:','viewmodel'
                  ]):
                      candidates.append(x)

          # Also inspect around the BFF base URL and baseUrl marker.
          anchors=[i for i,x in enumerate(lines) if 'prod.apix.alzp.tgscloud.net' in x.lower() or x.strip()=='baseUrl']
          for i in anchors:
              for x in lines[max(0,i-100):min(len(lines),i+101)]:
                  x=x.strip()
                  if 20 <= len(x) <= 160 and re.fullmatch(r'[A-Za-z0-9._~+/=-]+',x):
                      candidates.append(x)

          seen=set(); candidates=[x for x in candidates if not (x in seen or seen.add(x))]
          out={
              'retrievedAt':datetime.now(timezone.utc).isoformat(),
              'header':'x-apif-apikey',
              'candidateCount':len(candidates),
              'workingCredentialFound':False,
              'attempts':[]
          }
          working=None
          for token in candidates[:160]:
              req=urllib.request.Request(base+'/v3/references/filters',headers={
                  'User-Agent':'ChargeEurope/1.25.2 Android',
                  'Accept':'application/json',
                  'x-apif-apikey':token
              })
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      status=r.status; body=r.read(300000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read(1200).decode('utf-8','replace')
              except Exception:
                  continue
              if status != 403:
                  fp=hashlib.sha256(token.encode()).hexdigest()[:16]
                  out['attempts'].append({'status':status,'fingerprint':fp,'length':len(token)})
                  working=(token,status,body,fp)
                  break

          if working:
              token,status,body,fp=working
              out['workingCredentialFound']=True
              out['credentialFingerprint']=fp
              out['validationStatus']=status

              variants=[
                  ('/v3/infrastructure/locations',{'countryCode':'GB'}),
                  ('/v3/infrastructure/locations',{'country':'GB'}),
                  ('/v3/infrastructure/locations',{}),
              ]
              inv=None; attempts=[]
              for path,params in variants:
                  url=base+path+('?' + urllib.parse.urlencode(params) if params else '')
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'ChargeEurope/1.25.2 Android','Accept':'application/json','x-apif-apikey':token
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:
                          raw=r.read(15_000_000).decode('utf-8','replace')
                          attempts.append({'path':path,'params':params,'status':r.status,'bytes':len(raw)})
                          if r.status==200:
                              try:
                                  inv=json.loads(raw); break
                              except Exception: pass
                  except urllib.error.HTTPError as e:
                      attempts.append({'path':path,'params':params,'status':e.code})
                  except Exception as e:
                      attempts.append({'path':path,'params':params,'error':type(e).__name__})
              out['inventoryAttempts']=attempts
              if inv is not None:
                  txt=json.dumps(inv,ensure_ascii=False)
                  # do not persist if auth-ish material is present
                  if not re.search(r'(?i)(access[_-]?token|refresh[_-]?token|api[_-]?key|authorization)',txt):
                      with gzip.open('data/national/uk_totalenergies_charge_europe_locations.json.gz','wt',encoding='utf-8') as gz:
                          json.dump(inv,gz,ensure_ascii=False)
                      out['inventorySaved']=True
                      if isinstance(inv,list): out['inventoryCount']=len(inv)
                      elif isinstance(inv,dict):
                          out['inventoryKeys']=list(inv)[:100]
                          for k in ('locations','items','data','results','content'):
                              v=inv.get(k)
                              if isinstance(v,list):
                                  out['inventoryListKey']=k
                                  out['inventoryCount']=len(v)
                                  if v and isinstance(v[0],dict): out['firstItemKeys']=list(v[0])[:100]
                                  break

          pathlib.Path('reports/uk/totalenergies-targeted-apif-key-latest.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

          rm -rf /tmp/total-xapk /tmp/total-unpack

      - name: Publish sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/totalenergies-targeted-apif-key-latest.json
          git add data/national/uk_totalenergies_charge_europe_locations.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): target TotalEnergies APIF client key [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
