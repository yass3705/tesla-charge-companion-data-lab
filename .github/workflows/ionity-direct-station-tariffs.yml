name: IONITY Direct station tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/ionity_station_tariffs.py"
      - "tests/test_ionity_station_tariffs.py"
      - ".github/workflows/ionity-direct-station-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: ionity-direct-station-tariffs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test strict IONITY CPO extraction
        run: python -m unittest tests/test_ionity_station_tariffs.py -v

      - name: Build current France and Italy Direct maps
        run: |
          python scripts/ionity_station_tariffs.py --country FR
          python scripts/ionity_station_tariffs.py --country IT --out data/national/ionity_direct_stations_italy.json.gz

      - name: Validate generated maps
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          rules={
            "FR":{"path":"data/national/ionity_direct_stations_france.json.gz","minLocations":180,"minConnectors":1800},
            "IT":{"path":"data/national/ionity_direct_stations_italy.json.gz","minLocations":40,"minConnectors":300},
          }

          for country,rule in rules.items():
              with gzip.open(Path(rule["path"]),"rt",encoding="utf-8") as handle:
                  p=json.load(handle)
              assert p["operator"]=="IONITY"
              assert p["country"]==country
              assert p["scope"]["requiredCpoIdentifier"]=="IONITY_CPO"
              assert p["scope"]["subscriberTariffsIncluded"] is False
              assert p["scope"]["roamingTariffsIncluded"] is False
              counts=p["counts"]
              assert counts["countryLocationCount"]>=rule["minLocations"], counts
              assert counts["countryConnectorCount"]>=rule["minConnectors"], counts
              assert counts["countryUnpricedConnectorCount"]==0, counts
              assert all(x["country"]==country and x["cpoIdentifier"]=="IONITY_CPO" for x in p["locations"])
              assert all(cn["pricePerKwhEur"]>0 for x in p["locations"] for cn in x["connectors"])
              print(country,counts)
          PY

      - name: Publish validated maps without rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/national/ionity_direct_stations_france.json.gz /tmp/ionity-france.json.gz
          cp data/national/ionity_direct_stations_italy.json.gz /tmp/ionity-italy.json.gz

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/ionity-france.json.gz data/national/ionity_direct_stations_france.json.gz
            cp /tmp/ionity-italy.json.gz data/national/ionity_direct_stations_italy.json.gz
            git add data/national/ionity_direct_stations_france.json.gz data/national/ionity_direct_stations_italy.json.gz

            if git diff --cached --quiet; then
              echo "No IONITY data changes after resync."
              exit 0
            fi

            git commit -m "data(ionity): refresh Direct France and Italy station tariffs [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying clean IONITY publish $attempt/6."
            sleep $((attempt*2))
          done
          exit 1
