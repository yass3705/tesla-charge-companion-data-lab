name: Powerdot direct QR probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/powerdot-direct-qr-probe.yml"

permissions:
  contents: write

concurrency:
  group: powerdot-direct-qr-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current national IRVE snapshot
        run: |
          set -euo pipefail
          mkdir -p tmp reports data/national
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.data.gouv.fr/api/1/datasets/r/eb76d20a-8501-400e-b336-d85724de5435' \
            -o tmp/irve.csv
          ls -lh tmp/irve.csv

      - name: Inventory Powerdot and probe QR manager
        run: |
          python - <<'PY'
          import csv, gzip, hashlib, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import urllib.request
          import urllib.error

          src = Path('tmp/irve.csv')
          out_json = Path('data/national/powerdot_probe.json.gz')
          out_md = Path('reports/powerdot_probe.md')

          with src.open('r', encoding='utf-8-sig', newline='') as f:
              sample = f.read(65536)
              f.seek(0)
              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=',;\t')
              except Exception:
                  dialect = csv.excel
              reader = csv.DictReader(f, dialect=dialect)
              rows = []
              for r in reader:
                  op = (r.get('nom_operateur') or r.get('n_operateur') or '').strip().lower()
                  amen = (r.get('nom_amenageur') or r.get('n_amenageur') or '').strip().lower()
                  ens = (r.get('nom_enseigne') or r.get('n_enseigne') or '').strip().lower()
                  if 'power dot' in op or 'powerdot' in op or 'power dot' in amen or 'powerdot' in amen or 'power dot' in ens or 'powerdot' in ens:
                      rows.append(r)

          def first(r, *keys):
              for k in keys:
                  v = r.get(k)
                  if v not in (None, ''):
                      return str(v).strip()
              return ''

          stations = {}
          for r in rows:
              sid = first(r, 'id_station_itinerance', 'id_station_local', 'nom_station', 'n_station')
              key = sid or (first(r, 'adresse_station', 'ad_station') + '|' + first(r, 'code_insee'))
              s = stations.setdefault(key, {
                  'stationId': sid,
                  'name': first(r, 'nom_station', 'n_station'),
                  'address': first(r, 'adresse_station', 'ad_station'),
                  'insee': first(r, 'code_insee'),
                  'operator': first(r, 'nom_operateur', 'n_operateur'),
                  'tarificationValues': set(),
                  'evses': [],
              })
              t = first(r, 'tarification')
              if t:
                  s['tarificationValues'].add(t)
              s['evses'].append({
                  'id': first(r, 'id_pdc_itinerance', 'id_pdc_local'),
                  'idLocal': first(r, 'id_pdc_local'),
                  'powerKw': first(r, 'puissance_nominale', 'puiss_max'),
                  'tarification': t,
              })

          for s in stations.values():
              s['tarificationValues'] = sorted(s['tarificationValues'])

          def derive_candidates(evse):
              vals = []
              for source in [evse.get('idLocal',''), evse.get('id','')]:
                  if not source:
                      continue
                  x = source.strip()
                  x = re.sub(r'^FRPD1E', '', x, flags=re.I)
                  # OCPI EVSE identifiers commonly end in connector number; QR code targets charger/EVSE.
                  if re.search(r'\d$', x):
                      x_no_connector = x[:-1]
                  else:
                      x_no_connector = x
                  for y in [x, x_no_connector]:
                      if y and y not in vals:
                          vals.append(y)
                      compact = re.sub(r'[^A-Za-z0-9]', '', y)
                      if compact and compact not in vals:
                          vals.append(compact)
                      if len(compact) > 6:
                          underscored = compact[:3] + '_' + compact[3:6] + '_' + compact[6:]
                          if underscored not in vals:
                              vals.append(underscored)
              return vals

          headers = {'User-Agent': 'Mozilla/5.0 (TCC Powerdot public QR probe; contact via repository)'}
          def get(url, timeout=12):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read(700000)
                      return {
                          'ok': True,
                          'status': getattr(resp, 'status', 200),
                          'finalUrl': resp.geturl(),
                          'contentType': resp.headers.get('content-type',''),
                          'body': body,
                      }
              except urllib.error.HTTPError as e:
                  try: body = e.read(200000)
                  except Exception: body = b''
                  return {'ok': False, 'status': e.code, 'finalUrl': url, 'contentType': e.headers.get('content-type','') if e.headers else '', 'body': body}
              except Exception as e:
                  return {'ok': False, 'status': None, 'finalUrl': url, 'contentType': '', 'body': b'', 'error': repr(e)}

          known = [
              ('Mr Bricolage Champniers', 'MRB_CHP_KPC20001'),
              ('Netto Soustons', 'NET_SST_KPS20001'),
          ]
          probes = []
          valid_pages = []

          def record_probe(label, candidate, source='known'):
              url = 'https://qrcode-manager.powerdot-ev.com/' + candidate
              r = get(url)
              text = r['body'].decode('utf-8', 'replace')
              item = {
                  'source': source,
                  'label': label,
                  'candidate': candidate,
                  'url': url,
                  'status': r.get('status'),
                  'finalUrl': r.get('finalUrl'),
                  'contentType': r.get('contentType'),
                  'length': len(r.get('body', b'')),
                  'sha256': hashlib.sha256(r.get('body', b'')).hexdigest() if r.get('body') else None,
                  'error': r.get('error'),
                  'mentionsPricing': bool(re.search(r'(?i)price|pricing|tariff|tarif|kwh|€|eur', text)),
                  'title': (re.search(r'(?is)<title[^>]*>(.*?)</title>', text).group(1).strip() if re.search(r'(?is)<title[^>]*>(.*?)</title>', text) else None),
              }
              probes.append(item)
              if r.get('status') == 200 and len(r.get('body', b'')) > 500:
                  valid_pages.append((item, text))
              return item

          for label, cand in known:
              record_probe(label, cand, 'known-forum-qr')
              time.sleep(0.3)

          # Probe a small, diverse sample from the current official inventory.
          sample_stations = sorted(stations.values(), key=lambda s: (s['name'], s['stationId']))[:35]
          seen = {p['candidate'] for p in probes}
          for s in sample_stations:
              evses = sorted(s['evses'], key=lambda e: float(e['powerKw'] or 0), reverse=True)
              if not evses:
                  continue
              tested = 0
              for cand in derive_candidates(evses[0]):
                  if cand in seen:
                      continue
                  seen.add(cand)
                  record_probe(s['name'] or s['stationId'], cand, 'derived-current-irve')
                  tested += 1
                  time.sleep(0.15)
                  if probes[-1]['status'] == 200 and probes[-1]['length'] > 500:
                      break
                  if tested >= 4:
                      break

          # Inspect scripts of up to 3 valid pages to discover public API endpoints used by the QR frontend.
          asset_findings = []
          for item, html in valid_pages[:3]:
              scripts = re.findall(r'(?is)<script[^>]+src=[\"\']([^\"\']+)', html)
              for src_url in scripts[:12]:
                  full = urljoin(item['finalUrl'] or item['url'], src_url)
                  rr = get(full, timeout=15)
                  js = rr['body'].decode('utf-8', 'replace')
                  urls = sorted(set(re.findall(r'https?://[^\"\'\s)]+', js)))[:100]
                  apiish = [u for u in urls if any(k in u.lower() for k in ('api','tariff','price','charge','powerdot'))]
                  keywords = sorted(set(m.group(0) for m in re.finditer(r'(?i).{0,45}(?:tariff|tarif|price|pricing|connector|evse).{0,90}', js)))[:60]
                  asset_findings.append({
                      'pageCandidate': item['candidate'],
                      'assetUrl': full,
                      'status': rr.get('status'),
                      'length': len(rr.get('body', b'')),
                      'apiishUrls': apiish[:50],
                      'keywordSnippets': keywords[:40],
                  })

          nonempty_tariff = [s for s in stations.values() if s['tarificationValues']]
          payload = {
              'generatedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'source': 'Base nationale IRVE resource eb76d20a-8501-400e-b336-d85724de5435 (2026-08-25)',
              'operator': 'Power Dot France',
              'scope': {'country': 'FR', 'cpoOnly': True, 'roamingTariffsIncluded': False},
              'counts': {
                  'rows': len(rows),
                  'stations': len(stations),
                  'evses': sum(len(s['evses']) for s in stations.values()),
                  'stationsWithPublishedTarificationField': len(nonempty_tariff),
                  'qrProbes': len(probes),
                  'qrHttp200': sum(1 for p in probes if p['status'] == 200),
              },
              'publishedTarificationExamples': [
                  {'stationId': s['stationId'], 'name': s['name'], 'tarificationValues': s['tarificationValues']}
                  for s in nonempty_tariff[:50]
              ],
              'probes': probes,
              'assetFindings': asset_findings,
              'sampleStations': sample_stations[:35],
          }
          with gzip.open(out_json, 'wt', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          lines = [
              '# Powerdot direct QR probe', '',
              f"- IRVE rows: **{payload['counts']['rows']}**",
              f"- Unique stations: **{payload['counts']['stations']}**",
              f"- EVSE/PDC rows: **{payload['counts']['evses']}**",
              f"- Stations with a non-empty IRVE `tarification` field: **{payload['counts']['stationsWithPublishedTarificationField']}**",
              f"- QR candidates probed: **{payload['counts']['qrProbes']}**",
              f"- HTTP 200 QR pages: **{payload['counts']['qrHttp200']}**", '',
              '## Known public QR probes', '',
          ]
          for p in probes[:2]:
              lines.append(f"- `{p['candidate']}` → status={p['status']} final=`{p['finalUrl']}` len={p['length']} pricing_terms={p['mentionsPricing']}")
          lines += ['', '## First successful derived QR probes', '']
          for p in [x for x in probes if x['source']=='derived-current-irve' and x['status']==200][:20]:
              lines.append(f"- {p['label']}: `{p['candidate']}` → `{p['finalUrl']}`")
          lines += ['', '## API / frontend asset findings', '']
          if not asset_findings:
              lines.append('- No script asset could be inspected from a valid QR page.')
          else:
              for a in asset_findings[:10]:
                  lines.append(f"- `{a['assetUrl']}` status={a['status']} len={a['length']}")
                  for u in a['apiishUrls'][:12]:
                      lines.append(f"  - URL: `{u}`")
                  for s in a['keywordSnippets'][:5]:
                      lines.append('  - snippet: `' + s.replace('`','')[:220] + '`")
          out_md.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps(payload['counts'], indent=2))
          PY

      - name: Publish probe results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/powerdot_probe.md data/national/powerdot_probe.json.gz
          if git diff --cached --quiet; then
            echo 'No probe result changes.'
            exit 0
          fi
          git commit -m "data(powerdot): publish direct QR probe [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
