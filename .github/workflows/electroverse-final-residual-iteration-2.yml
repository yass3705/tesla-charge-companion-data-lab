name: Electroverse final residual iteration 2
on:
  push:
    branches:
      - electroverse-final-residual-iteration-2
    paths:
      - ".github/workflows/electroverse-final-residual-iteration-2.yml"
permissions:
  contents: write
jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute residual recovery plan
        run: node scripts/build_electroverse_final_residual_recovery_plan.mjs
      - name: Build overlay with recomputed plan
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Commit iteration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/validated-mappings/final-residual-recovery-plan.json data/platforms/electroverse/france-evse
          git commit -m "lab: persist Electroverse final residual iteration 2" || true
      - name: Fetch main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare iteration against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
      - name: Push validated branch
        if: success()
        run: git push
