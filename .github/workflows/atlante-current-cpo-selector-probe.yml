name: Atlante current CPO selector station tariff probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/atlante-apk-public-config
    paths:
      - scripts/atlante_current_cpo_selector_probe.py
      - .github/workflows/atlante-current-cpo-selector-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public myAtlante bundle
        run: |
          python - <<'PY'
          import io,urllib.request,zipfile
          q=urllib.request.Request('https://d.apkpure.net/b/XAPK/com.atlante.charging?version=latest',headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14) Chrome/140 Mobile','Referer':'https://apkpure.net/'})
          x=urllib.request.urlopen(q,timeout=90).read()
          with zipfile.ZipFile(io.BytesIO(x)) as z:
            apk=next(n for n in z.namelist() if n.endswith('.apk') and 'config.' not in n)
            with zipfile.ZipFile(io.BytesIO(z.read(apk))) as a:open('/tmp/index.android.bundle','wb').write(a.read('assets/index.android.bundle'))
          PY
      - name: Decompile transiently
        run: |
          git clone --depth 1 https://github.com/P1sec/hermes-dec.git /tmp/hermes-dec
          python /tmp/hermes-dec/hbc-decompiler /tmp/index.android.bundle /tmp/decompiled.js
      - name: Resolve CPO selector and fetch station prices
        run: python scripts/atlante_current_cpo_selector_probe.py /tmp/decompiled.js
      - name: Validate price proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/reports/atlante_current_cpo_selector_probe.json').read_text())
          assert r['clientCredentialRecovered'] and not r['clientCredentialPersisted']
          assert r['mapLocationCount']>0 and r['stationTariffSamples']
          assert all(v is False for v in r['security'].values())
          print(json.dumps({'selector':r['selectedCpoSelector'],'locations':r['mapLocationCount'],'sampleStations':len(r['stationTariffSamples'])},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlante-current-cpo-selector-price-proof
          path: data/reports/atlante_current_cpo_selector_probe.json
          retention-days: 14
