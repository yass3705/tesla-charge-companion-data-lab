name: Audit Electroverse B published ordinal rule
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_electroverse_b_published_rule.mjs"
      - ".github/workflows/electroverse-b-published-rule-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit published B mappings
        run: node scripts/audit_electroverse_b_published_rule.mjs
      - name: Persist audit
        run: |
          test -s reports/electroverse/b-published-rule-audit.json
          node -e "JSON.parse(require('fs').readFileSync('reports/electroverse/b-published-rule-audit.json','utf8'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-published-rule-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist Electroverse B ordinal rule audit"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main || true
              git push && break
              sleep $((attempt*2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-b-published-rule-audit
          path: reports/electroverse/b-published-rule-audit.json
          retention-days: 14
