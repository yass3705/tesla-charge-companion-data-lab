name: Grand Est Connectandgo Maizieres validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/connectandgo_maizieres_official.py"
      - ".github/workflows/connectandgo-maizieres-grandest-validation.yml"

permissions:
  contents: write
concurrency:
  group: grandest-connectandgo-maizieres-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/connectandgo_maizieres
          python -m py_compile scripts/connectandgo_maizieres_official.py
          python scripts/connectandgo_maizieres_official.py --out out/connectandgo_maizieres 2> >(tee out/connectandgo_maizieres/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/connectandgo_maizieres/connectandgo_maizieres_official_grandest.json').read_text())
          assert p['dataset']=='connectandgo-maizieres-official-grandest'
          assert p['network']['publishedConnectorPowerKw']==[22,25,50]
          assert p['operatorDirect']['withoutSubscription']['day']['below30Kw']=={'eurPerKwh':0.25,'eurPerMinute':0.025}
          assert p['operatorDirect']['withoutSubscription']['night']['below30Kw']=={'eurPerKwh':0.24,'eurPerMinute':0.0}
          assert p['operatorDirect']['withoutSubscription']['idle']['below30Kw']=={'afterMinutes':180,'eurPerMinute':0.16,'condition':'without_consumption'}
          assert p['operatorDirect']['withSubscription']['monthlyEur']==3.0
          assert p['operatorDirect']['withSubscription']['day']['below30Kw']=={'eurPerKwh':0.24,'eurPerMinute':0.02}
          assert p['operatorDirect']['withSubscription']['night']['below30Kw']=={'eurPerKwh':0.20,'eurPerMinute':0.0}
          assert p['operatorDirect']['withSubscription']['idle']['below30Kw']['eurPerHourAsPublished']==0.13
          assert p['rules']['subscriptionIdleUnitAnomaly'] is True
          assert p['tccDecision']['publicTariffClassableBelow30Kw'] is True
          assert p['tccDecision']['subscriptionFullyClassableForLongIdleSessions'] is False
          assert p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/connectandgo_maizieres
          cp out/connectandgo_maizieres/connectandgo_maizieres_official_grandest.json data/operator_direct/connectandgo_maizieres_official_grandest.json
          cp out/connectandgo_maizieres/SUMMARY.md reports/connectandgo_maizieres/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/connectandgo_maizieres_official_grandest.json reports/connectandgo_maizieres/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(connectandgo): publish Maizieres tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/connectandgo_maizieres
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/connectandgo_maizieres/error.log'); s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/connectandgo_maizieres/latest_diagnostic.json').write_text(json.dumps({'dataset':'connectandgo-maizieres-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env: {JOB_STATUS: "${{ job.status }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/connectandgo_maizieres
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/connectandgo_maizieres/latest_run_status.json').write_text(json.dumps({'dataset':'connectandgo-maizieres-run-status','operator':'Connect&go - Maizières-lès-Metz','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/connectandgo_maizieres/latest_run_status.json
          if [ -f reports/connectandgo_maizieres/latest_diagnostic.json ]; then git add reports/connectandgo_maizieres/latest_diagnostic.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "status(connectandgo-maizieres): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
            exit 1
          fi
