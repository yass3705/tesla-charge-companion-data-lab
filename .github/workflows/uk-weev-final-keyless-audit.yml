name: UK Weev final keyless audit
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/uk-weev-final-keyless-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Search first-party shared bundle and sourcemaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          urls=[
            "https://weev.ie/build/assets/index-D9wR-IxX.js",
            "https://weev.ie/build/assets/maps-BFV4ss5j.js.map",
            "https://weev.ie/build/assets/index-D9wR-IxX.js.map",
            "https://weev.ie/build/assets/app-BWNgRQEY.js.map",
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Weev","assets":[]}
          for url in urls:
              rec={"url":url}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9","Accept":"application/json,application/javascript,text/plain,*/*"})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read(20_000_000).decode("utf-8","replace"); rec["status"]=r.status
                  rec["bytes"]=len(body)
                  # Keep only structural API clues, not arbitrary secrets/tokens.
                  hosts=sorted(set(re.findall(r'https?://([A-Za-z0-9.-]+)',body)))
                  rec["hosts"]=[h for h in hosts if any(k in h.lower() for k in ("weev","api","charge","station","ev"))][:100]
                  literals=[]
                  for s in re.findall(r'["\']([^"\']{3,260})["\']',body):
                      sl=s.lower()
                      if any(k in sl for k in ("station","charger","chargepoint","location","tariff","evse","/api/","open-data","opendata")):
                          if not any(k in sl for k in ("google","zoho","analytics","font","icon","image","uploads/")):
                              s=re.sub(r'(?i)(token|key|secret)(\s*[:=]\s*)[^,;}\s]{8,}',r'\1\2<redacted>',s)
                              literals.append(s)
                  rec["literals"]=sorted(set(literals))[:500]
                  contexts=[]
                  for m in re.finditer(r'(?i)(baseURL|axios\.create|fetch\(|/api/|open.?data|station|chargepoint|tariff|evse)',body):
                      c=body[max(0,m.start()-400):min(len(body),m.end()+800)]
                      if re.search(r'baseURL|axios|fetch\(|/api/|https?://',c,re.I):
                          c=re.sub(r'(?i)(token|key|secret)(["\']?\s*[:=]\s*["\'])[^"\']{8,}',r'\1\2<redacted>',c)
                          contexts.append(c)
                          if len(contexts)>=100: break
                  rec["contexts"]=contexts
              except urllib.error.HTTPError as e:
                  rec["status"]=e.code
              except Exception as e:
                  rec["error"]=f"{type(e).__name__}: {e}"
              out["assets"].append(rec)
          Path("reports/uk/weev-final-keyless-audit-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/weev-final-keyless-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): final Weev keyless API audit [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
