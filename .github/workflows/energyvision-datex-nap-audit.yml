name: EnergyVision Belgium exact DATEX to NAP audit (no price publication)

on:
  pull_request:
    paths:
      - ".github/workflows/energyvision-datex-nap-audit.yml"
      - "scripts/energyvision_datex_nap_audit.py"
      - "tests/test_energyvision_datex_nap_audit.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/energyvision-datex-nap-audit.yml"
      - "scripts/energyvision_datex_nap_audit.py"
      - "tests/test_energyvision_datex_nap_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nap-exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fail-closed identity mapping, safety and tariff taxonomy
        run: python -m unittest discover -s tests -p 'test_energyvision_datex_nap_audit.py' -v
      - name: Load immutable authenticated EnergyVision staging snapshot
        uses: actions/download-artifact@v4
        with:
          name: energyvision-datex-staging-38419429972
          path: .audit-input
          run-id: 38419429972
          github-token: ${{ github.token }}
      - name: Audit exact EnergyVision EVSE IDs against all 17 pinned NAP pages
        run: |
          python -m scripts.energyvision_datex_nap_audit \
            --stage .audit-input/artifacts/energyvision-datex-stage.json.gz \
            --manifest data/belgium/nap-belgium-manifest.json \
            --report reports/belgium/energyvision-nap-exact-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("reports/belgium/energyvision-nap-exact-audit.json").read_text())
          ids=doc["identity"]
          assert ids["sourceConnectors"]==3791, "EnergyVision staging unexpectedly changed"
          assert ids["napLocations"]>=16000, "Missing Belgium NAP pages"
          assert not doc["v9PricePublicationReady"], "No station-level rate can be auto-assigned to an EVSE"
          print("AUDIT_DIAGNOSTIC_ONLY",ids["sourceConnectors"],ids["napLocations"])
          PY
      - name: Archive aggregate audit only (no raw authenticated XML or prices published)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: energyvision-belgium-nap-audit-${{ github.run_id }}
          path: reports/belgium/energyvision-nap-exact-audit.json
          retention-days: 7
      - name: Explicit no-publish guard
        run: echo "Read-only NAP identity comparison. No tariff attachment or Production/Pages/Cloudflare deployment."
