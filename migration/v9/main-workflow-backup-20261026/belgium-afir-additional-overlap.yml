name: Belgium AFIR additional overlap
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-afir-additional-overlap.txt"
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_afir_additional_overlap.py
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/belgium-afir-additional-overlap-2026-09-29.json
          git commit -m "Compare Belgium additional AFIR sources" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
