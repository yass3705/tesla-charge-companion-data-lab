name: UK Shell tariff probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-tariff-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe Shell tariff provider IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error
          from pathlib import Path

          cid=os.environ.get("SHELL_EV_CLIENT_ID")
          secret=os.environ.get("SHELL_EV_CLIENT_SECRET")
          if not cid or not secret:
              raise SystemExit("Shell secrets missing")

          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev"
          UA="TeslaChargeCompanion/9 Shell-Tariff-Probe"
          min_interval=7.5
          last=0.0

          def throttle():
              global last
              now=time.monotonic()
              wait=min_interval-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          throttle()
          form=urllib.parse.urlencode({
              "client_id":cid,
              "client_secret":secret,
              "grant_type":"client_credentials"
          }).encode()
          req=urllib.request.Request(AUTH,data=form,method="POST",headers={
              "Content-Type":"application/x-www-form-urlencoded",
              "Accept":"application/json",
              "User-Agent":UA
          })
          with urllib.request.urlopen(req,timeout=30) as rr:
              tok=json.loads(rr.read().decode())
          token=tok["access_token"]

          def call(uid,provider=None):
              throttle()
              path="/v2/locations/"+urllib.parse.quote(uid,safe="")
              params={} if provider is None else {"providerId":provider}
              url=BASE+path+("?" + urllib.parse.urlencode(params) if params else "")
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as rr:
                      body=json.loads(rr.read().decode())
                      return {"httpStatus":rr.status,"body":body}
              except urllib.error.HTTPError as e:
                  return {"httpStatus":e.code,"bodyText":e.read().decode("utf-8","replace")[:4000]}

          import gzip
          dataset="data/national/uk_shell_ev_public_locations.json.gz"
          with gzip.open(dataset,"rt",encoding="utf-8") as g:
              inv=json.load(g)
          locs=inv.get("locations") or []

          ubi=[x for x in locs if str(x.get("operatorName") or "")=="Migration Shell Recharge"][:10]
          shell=[x for x in locs if str(x.get("operatorName") or "")=="Shell Recharge"][:10]
          samples=[("ubitricity",x) for x in ubi]+[("shell_recharge",x) for x in shell]

          out={"retrievedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),
               "providerId":"Shell_RP_2","sampleCount":len(samples),"results":[]}

          for family,loc in samples:
              uid=str(loc.get("uid") or loc.get("externalId") or "")
              if not uid: continue
              res=call(uid,"Shell_RP_2")
              entry={"family":family,"uid":uid,"operatorId":loc.get("operatorId"),
                     "operatorName":loc.get("operatorName"),"httpStatus":res["httpStatus"],
                     "tariffCount":0,"connectorCount":0,"tariffConnectors":[]}
              if "body" in res:
                  body=res["body"]
                  entry["status"]=body.get("status") if isinstance(body,dict) else None
                  data=body.get("data") if isinstance(body,dict) else None
                  if isinstance(data,list) and data:
                      data=data[0]
                  if isinstance(data,dict):
                      for ev in data.get("evses") or []:
                          for conn in ev.get("connectors") or []:
                              entry["connectorCount"]+=1
                              ts=conn.get("tariffs") or []
                              if ts:
                                  entry["tariffCount"]+=len(ts)
                                  entry["tariffConnectors"].append({
                                      "evseId":ev.get("evseId"),"connectorUid":conn.get("uid"),
                                      "tariffs":ts
                                  })
              else:
                  entry["bodyText"]=res.get("bodyText")
              out["results"].append(entry)

          fam={}
          for e in out["results"]:
              f=e["family"]
              z=fam.setdefault(f,{"locations":0,"locationsWithTariff":0,"tariffObjects":0})
              z["locations"]+=1
              z["tariffObjects"]+=e["tariffCount"]
              if e["tariffCount"]>0: z["locationsWithTariff"]+=1
          out["coverageByFamily"]=fam

          Path("reports/uk/shell-tariff-probe-latest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/shell-tariff-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): Shell tariff provider probe [run ${GITHUB_RUN_ID}]"
          git pull --rebase origin main
          git push origin HEAD:main
