name: Qovoltis public station read probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qovoltis-public-read-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test unauthenticated station list and detail reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          BASE = 'https://qoapi.qovoltis.com/api/'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 Tesla-Charge-Companion-Data-Lab/1.0',
              'Accept': 'application/json, text/plain, */*',
          }

          def get(path, params=None):
              url = urllib.parse.urljoin(BASE, path)
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=HEADERS, method='GET')
              status = None
              ctype = ''
              raw = ''
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      status = r.status
                      ctype = r.headers.get('content-type', '')
                      raw = r.read(3_000_000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  status = e.code
                  ctype = e.headers.get('content-type', '') if e.headers else ''
                  raw = e.read(500_000).decode('utf-8', 'replace')
              except Exception as e:
                  raw = repr(e)
              parsed = None
              try:
                  parsed = json.loads(raw)
              except Exception:
                  pass
              return {
                  'path': path,
                  'params': params or {},
                  'status': status,
                  'contentType': ctype,
                  'bytes': len(raw.encode('utf-8', 'replace')),
                  'json': parsed,
                  'bodyPreview': raw[:12000],
              }

          tests = []
          tests.append(get('borne/map-station-list'))
          # Paris / Ile-de-France bounding candidates. Values are public map
          # coordinates only; no account/session credentials are supplied.
          for params in [
              {'side':'1', 'minlng':'1.5', 'minlat':'48.3'},
              {'side':'2', 'minlng':'1.0', 'minlat':'47.8'},
              {'side':'0.5', 'minlng':'1.8', 'minlat':'48.5'},
          ]:
              tests.append(get('borne/map-station-list', params))

          def find_station_ids(value):
              found = []
              if isinstance(value, dict):
                  for k, v in value.items():
                      kl = str(k).lower()
                      if kl in ('id','station_id','stationid','idstation') and isinstance(v, (int, str)):
                          found.append(str(v))
                      found.extend(find_station_ids(v))
              elif isinstance(value, list):
                  for v in value:
                      found.extend(find_station_ids(v))
              return found

          ids = []
          for row in tests:
              if row['status'] == 200 and row['json'] is not None:
                  ids.extend(find_station_ids(row['json']))
          # Stable unique candidate IDs, deliberately capped.
          ids = list(dict.fromkeys(ids))[:10]

          previews = []
          for sid in ids[:5]:
              previews.append(get('borne/map-station-preview', {'station_id': sid}))

          # If the list structure did not expose an obvious id, a deliberately
          # invalid id still tells us whether the endpoint itself is public.
          if not previews:
              previews.append(get('borne/map-station-preview', {'station_id':'1'}))

          def summarize_json(value, depth=0):
              if depth > 4:
                  return '<max-depth>'
              if isinstance(value, dict):
                  return {str(k): summarize_json(v, depth+1) for k,v in list(value.items())[:80]}
              if isinstance(value, list):
                  return [summarize_json(v, depth+1) for v in value[:5]]
              if isinstance(value, str) and len(value) > 500:
                  return value[:500] + '…'
              return value

          output = {
              'scope': 'unauthenticated_read_only_public_app_endpoints',
              'base': BASE,
              'listTests': tests,
              'candidateStationIds': ids,
              'previewTests': previews,
          }
          Path('probe/qovoltis_public_read_probe.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          print('=== LIST TESTS ===')
          for r in tests:
              print(json.dumps({
                  'path': r['path'], 'params': r['params'], 'status': r['status'],
                  'contentType': r['contentType'], 'bytes': r['bytes']
              }, ensure_ascii=False))
              if r['json'] is not None:
                  print(json.dumps(summarize_json(r['json']), ensure_ascii=False)[:8000])
              else:
                  print(r['bodyPreview'][:2000])

          print('\n=== CANDIDATE IDS ===')
          print(ids)
          print('\n=== PREVIEW TESTS ===')
          for r in previews:
              print(json.dumps({
                  'params': r['params'], 'status': r['status'],
                  'contentType': r['contentType'], 'bytes': r['bytes']
              }, ensure_ascii=False))
              if r['json'] is not None:
                  print(json.dumps(summarize_json(r['json']), ensure_ascii=False)[:12000])
              else:
                  print(r['bodyPreview'][:3000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-public-read-probe
          path: probe
          retention-days: 3
