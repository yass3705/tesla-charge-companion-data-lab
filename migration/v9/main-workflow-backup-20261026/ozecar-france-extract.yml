name: OZECAR France public Monta extraction

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 4"
  pull_request:
    paths:
      - "scripts/ozecar/extract_ozecar.py"
      - "tests/test_ozecar_extract.py"
      - ".github/workflows/ozecar-france-extract.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_ozecar_extract.py

  extract:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Extract OZECAR public direct tariffs
        run: |
          python scripts/ozecar/extract_ozecar.py \
            --workers 6 \
            --out data/ozecar/france/ozecar-france-current.json \
            --report docs/france-ozecar-direct-report-current.json
          gzip -9 -f data/ozecar/france/ozecar-france-current.json
      - name: Persist snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ozecar/france/ozecar-france-current.json.gz \
                  docs/france-ozecar-direct-report-current.json
          if git diff --cached --quiet; then
            echo "No OZECAR snapshot changes to commit."
            exit 0
          fi
          git commit -m "data(france): refresh OZECAR direct snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
