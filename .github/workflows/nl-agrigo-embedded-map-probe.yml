name: NL Agri Go public embedded map data and JS probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_agrigo_embedded_map_probe_20261011.py
      - .github/workflows/nl-agrigo-embedded-map-probe.yml
permissions:
  contents: write
concurrency:
  group: nl-agrigo-public-map-data
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official website source and static frontend bundles
        run: |
          python3 -m py_compile scripts/nl_agrigo_embedded_map_probe_20261011.py
          python3 scripts/nl_agrigo_embedded_map_probe_20261011.py
      - name: Save read-only map/QR discovery
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-agrigo-embedded-map-probe-2026-10-11.json /tmp/agrigo-map.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/agrigo-map.json reports/netherlands/nl-agrigo-embedded-map-probe-2026-10-11.json
            git add reports/netherlands/nl-agrigo-embedded-map-probe-2026-10-11.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): Agri Go map and public frontend QR source review"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
