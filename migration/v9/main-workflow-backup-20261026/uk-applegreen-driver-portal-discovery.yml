name: UK Applegreen driver portal discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-applegreen-driver-portal-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Applegreen driver portal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          root="https://driver.applegreenelectric.com/"
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"root":root,"assets":[],"apiCandidates":[]}
          try:
              req=urllib.request.Request(root,headers={"User-Agent":UA,"Accept":"text/html,*/*"})
              with urllib.request.urlopen(req,timeout=45) as r:
                  html=r.read(4_000_000).decode("utf-8","replace"); final=r.geturl()
              out["rootStatus"]=200;out["finalUrl"]=final;out["htmlBytes"]=len(html)
              scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
              # include JS-like links from modern bundles
              scripts += [urllib.parse.urljoin(final,s) for s in re.findall(r'href=["\']([^"\']+\.js[^"\']*)["\']',html,re.I)]
              for u in sorted(set(scripts))[:80]:
                  item={"url":u}
                  try:
                      req=urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"application/javascript,*/*"})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          body=r.read(5_000_000).decode("utf-8","replace")
                      item["bytes"]=len(body)
                      cands=set()
                      for s in re.findall(r'["\']([^"\']{3,300})["\']',body):
                          sl=s.lower()
                          if ("/api" in sl or "apiserver" in sl or "station" in sl or "charger" in sl or "location" in sl or "tariff" in sl or "price" in sl) and not sl.startswith("data:"):
                              cands.add(s)
                      item["candidates"]=sorted(cands)[:300]
                      out["apiCandidates"].extend(item["candidates"])
                  except Exception as e:
                      item["error"]=f"{type(e).__name__}: {e}"
                  out["assets"].append(item)
              out["apiCandidates"]=sorted(set(out["apiCandidates"]))[:1200]
          except urllib.error.HTTPError as e:
              raw=e.read(100000)
              out.update({"rootStatus":e.code,"error":str(e),"bodyPrefix":raw.decode("utf-8","replace")[:2000]})
          except Exception as e:
              out["error"]=f"{type(e).__name__}: {e}"
          Path("reports/uk/applegreen-driver-portal-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/applegreen-driver-portal-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Applegreen driver portal [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
