name: UK Qwello tariff endpoint discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-qwello-tariff-endpoint-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect public Qwello tariff frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          def get(url,limit=6000000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,application/json,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(limit).decode("utf-8","replace"),r.geturl()
          html,final=get("https://tariff.qwello.eu/")
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          urls=set(); paths=set(); contexts=[]
          bodies=[("html",html)]
          for s in scripts[:40]:
              try: bodies.append((s,get(s)[0]))
              except Exception: pass
          for source,b in bodies:
              for u in re.findall(r'https?://[^"\'\s<>()\\]+',b):
                  if any(k in u.lower() for k in ("qwello","api","tariff","station","charger","evse")) and not any(k in u.lower() for k in ("googleapis","gstatic","fonts.")):
                      urls.add(u[:500])
              for p in re.findall(r'["\']((?:/api/|/v[0-9]+/|/tariffs?|/stations?|/chargers?|/evses?)[^"\']{0,220})["\']',b,re.I):
                  paths.add(p)
              for m in re.finditer(r'(?i)(fetch\(|axios|http|tariff|evse|station)',b):
                  ctx=b[max(0,m.start()-300):min(len(b),m.end()+650)]
                  if re.search(r'fetch\(|axios|https?://|/api/',ctx,re.I):
                      ctx=re.sub(r'(?i)(token|key|secret)(["\']?\s*[:=]\s*["\'])[^"\']{8,}',r'\1\2<redacted>',ctx)
                      contexts.append({"source":source,"context":ctx})
                      if len(contexts)>=120: break
              if len(contexts)>=120: break
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Qwello","page":"https://tariff.qwello.eu/",
               "scripts":scripts,"urlCandidates":sorted(urls)[:200],"relativePaths":sorted(paths)[:200],"contexts":contexts[:120]}
          Path("reports/uk/qwello-tariff-endpoint-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/qwello-tariff-endpoint-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover Qwello public tariff API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
