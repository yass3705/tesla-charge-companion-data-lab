name: Audit B against PAN national IRVE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b_pan_national_ready.py"
      - ".github/workflows/electroverse-b-pan-national.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_b_pan_national_ready.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-pan-national-promotion-ready.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B PAN national promotion-ready groups"
            git pull --rebase origin main || true
            git push
          fi
