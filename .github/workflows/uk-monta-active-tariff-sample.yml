name: UK Monta active tariff sample

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-monta-active-tariff-sample.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sample active MON locations and tariff references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,urllib.parse,time,collections
          from pathlib import Path
          from datetime import datetime,timezone
          BASE='https://public-api.monta.com/api/v1/open-data/locations'
          rows=[]; after=None
          for page in range(1000):
              q={'per_page':'1000'}
              if after is not None: q['after']=str(after)
              url=BASE+'?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanion/9 UK-Monta-audit','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r: p=json.loads(r.read().decode())
              b=p.get('data') or []
              for x in b:
                  if isinstance(x,dict) and str(x.get('party_id') or '').upper()=='MON': rows.append(x)
              pag=((p.get('meta') or {}).get('pagination') or {})
              if not pag.get('has_more') or not b: break
              nxt=pag.get('after')
              if nxt is None or str(nxt)==str(after): break
              after=nxt; time.sleep(.12)
          active=[]
          for loc in rows:
              evs=loc.get('evses') or []
              # Keep a location if at least one EVSE is not REMOVED.
              if any(isinstance(e,dict) and str(e.get('status') or '').upper()!='REMOVED' for e in evs): active.append(loc)
          tariffs=collections.Counter(); samples={}; statuses=collections.Counter(); connectors=0; active_evses=0
          for loc in active:
              for ev in loc.get('evses') or []:
                  if not isinstance(ev,dict) or str(ev.get('status') or '').upper()=='REMOVED': continue
                  active_evses+=1; statuses[str(ev.get('status') or 'UNKNOWN')]+=1
                  for c in ev.get('connectors') or []:
                      if not isinstance(c,dict): continue
                      connectors+=1
                      tids=[]
                      if c.get('tariff_id') is not None: tids.append(str(c['tariff_id']))
                      tids += [str(t) for t in (c.get('tariff_ids') or [])]
                      for tid in tids:
                          tariffs[tid]+=1
                          if tid not in samples:
                              samples[tid]={'locationId':loc.get('id'),'name':loc.get('name'),'address':loc.get('address'),'city':loc.get('city'),'postal_code':loc.get('postal_code'),'evse_id':ev.get('evse_id'),'uid':ev.get('uid'),'connector':c}
          out={'country':'GB','network':'Monta','retrievedAt':datetime.now(timezone.utc).isoformat(),'rawMonLocations':len(rows),'activeLocations':len(active),'activeEvses':active_evses,'activeConnectors':connectors,'activeStatuses':dict(statuses),'distinctActiveTariffIds':len(tariffs),'topTariffIds':[{'id':k,'connectors':v,'sample':samples[k]} for k,v in tariffs.most_common(30)]}
          Path('reports/uk/monta-active-tariff-sample-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/monta-active-tariff-sample-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit active Monta tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
