name: Bump France TCC-ready snapshot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_tcc_ready_france.py"
      - "scripts/bump_variable_tariff_parser.py"
      - ".github/workflows/bump-tcc-ready-france.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Bump France TCC-ready snapshot
        run: PYTHONPATH=scripts python scripts/bump_tcc_ready_france.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          p=json.loads(gzip.decompress(Path('data/national/bump_direct_tariffs_tcc_france.json.gz').read_bytes()))
          c=p['counts']
          assert p['scope']['directCpoOnly'] and not p['scope']['roamingIncluded']
          assert c['franceStations']==1506 and c['francePoints']==2252
          assert c['excludedForeignStations']==8 and c['excludedForeignPoints']==16
          assert c.get('unresolved_variable_rule',0)==0
          assert c['rankablePoints'] > 2000
          assert c['rankablePoints'] + c['unresolvedPoints'] == c['francePoints']
          assert not p['variableParseFailures']
          print(c)
          PY
      - name: Publish snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/bump_direct_tariffs_tcc_france.json.gz reports/bump/tcc_ready_france_latest.json reports/bump/tcc_ready_france_latest.md
          git diff --cached --quiet && exit 0
          git commit -m "data(bump): publish France-only TCC-ready snapshot [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
