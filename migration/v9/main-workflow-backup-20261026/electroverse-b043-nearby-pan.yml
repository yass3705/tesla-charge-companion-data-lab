name: Audit B043 nearby PAN inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_b043_nearby_pan.py"
      - ".github/workflows/electroverse-b043-nearby-pan.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_b043_nearby_pan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b043-nearby-pan-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B043 nearby PAN inventory"
            git pull --rebase origin main || true
            git push
          fi
