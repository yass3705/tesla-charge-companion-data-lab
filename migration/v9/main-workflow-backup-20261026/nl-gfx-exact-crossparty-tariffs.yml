name: NL GFX exact EVSE alternate-CPO tariff evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_gfx_exact_tariff_crosswalk_20261011.py
      - .github/workflows/nl-gfx-exact-crossparty-tariffs.yml
permissions:
  contents: write
concurrency:
  group: nl-gfx-exact-source-crosswalk
  cancel-in-progress: true
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Find exact GFX EVSE cross-operator existing CPO source
        run: |
          python3 -m py_compile scripts/nl_gfx_exact_tariff_crosswalk_20261011.py
          python3 scripts/nl_gfx_exact_tariff_crosswalk_20261011.py
      - name: Commit read-only exact match audit
        shell: bash
        run: |
          set -euo pipefail
          cp reports/netherlands/nl-gfx-exact-crossparty-pricing-audit-latest.json /tmp/nl-gfx-exact.json
          cp reports/netherlands/nl-gfx-exact-crossparty-pricing-candidates-latest.csv /tmp/nl-gfx-exact.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-gfx-exact.json reports/netherlands/nl-gfx-exact-crossparty-pricing-audit-latest.json
            cp /tmp/nl-gfx-exact.csv reports/netherlands/nl-gfx-exact-crossparty-pricing-candidates-latest.csv
            git add reports/netherlands/nl-gfx-exact-crossparty-pricing-audit-latest.json reports/netherlands/nl-gfx-exact-crossparty-pricing-candidates-latest.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): GFX missing tariffs crossparty exact EVSE evidence"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-gfx-exact-crossparty-${{ github.run_id }}
          path: |
            reports/netherlands/nl-gfx-exact-crossparty-pricing-audit-latest.json
            reports/netherlands/nl-gfx-exact-crossparty-pricing-candidates-latest.csv
