name: Révéo official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "27 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/reveo_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/reveo-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: reveo-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Fetch and validate official Révéo evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile scripts/reveo_official.py
          mkdir -p out/reveo
          python scripts/reveo_official.py 2> >(tee out/reveo/error.log >&2)
          cat out/reveo/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/reveo
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/reveo/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/reveo/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'reveo-diagnostic',
              'operator':'Révéo',
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-80:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/reveo/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(reveo): publish validation diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate Révéo classification envelope
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/reveo/reveo_official_france.json').read_text())
          assert p['dataset']=='reveo-official-france'
          assert p['country']=='FR'
          assert p['publicationStatus']=='candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          assert p['publicAccess']['subscriptionRequired'] is False
          assert p['membership']['badgePurchaseEur'] == 12.0
          assert p['membership']['subscriptionEurPerMonthPerBadge'] == 1.5
          assert p['directTariffModel']['exactCurrentPublicGridFullyMachineReadableFromPricingPage'] is False
          assert p['roaming']['separateFromDirectRetail'] is True
          assert p['roaming']['technicalOcpiFeedPublished'] is True
          active=p['technicalTariffEvidence']['activeTariffs']
          assert len(active) >= 8
          assert any(x.get('partyId')=='M31' for x in active)
          assert any(x.get('partyId')=='S34' for x in active)
          assert any(x.get('partyId')=='S12' for x in active)
          assert any(x.get('partyId')=='S48' for x in active)
          print('Révéo official classification envelope: OK')
          PY

      - name: Publish validated candidate only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/reveo/reveo_official_france.json')
          dst=Path('data/operator_direct/reveo_official_france.json')
          rep=Path('reports/reveo/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence','technicalTariffEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'feedSha':((d.get('technicalTariffEvidence') or {}).get('feedSha256')),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/reveo/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit Révéo candidate
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/reveo_official_france.json reports/reveo/latest_summary.md
          git commit -m "data(reveo): publish verified official tariff model [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
