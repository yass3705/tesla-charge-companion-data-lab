name: GES NextCharge operational exact recovery

on:
  push:
    branches: [research/ges-italy-probe]
    paths:
      - scripts/ges_nextcharge_operational_recovery.py
      - .github/workflows/ges-nextcharge-operational-recovery.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install --disable-pip-version-check selenium
      - name: Download latest normalized PUN artifact
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pun-italy-normalized.yml --branch research/pun-italy-normalized --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/pun
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n pun-italy-normalized -D /tmp/pun
          test -s /tmp/pun/national/pun_italy_national.json.gz
      - name: Download latest national GES candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ges-nextcharge-national-candidate.yml --branch research/ges-italy-probe --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/ges
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n nextcharge-ges-italy-national-candidate -D /tmp/ges
          test -s /tmp/ges/national/nextcharge_ges_italy_candidate.json.gz
      - name: Recover missing operational EVSE by exact UID only
        run: python scripts/ges_nextcharge_operational_recovery.py --pun /tmp/pun/national/pun_italy_national.json.gz --candidate /tmp/ges/national/nextcharge_ges_italy_candidate.json.gz
      - name: Validate recovery safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports/ges_nextcharge_operational_recovery.json')
          assert p.exists() and p.stat().st_size > 500
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['security']['accountCredentialsUsed'] is False
          assert r['security']['sessionTokenSent'] is False
          assert r['security']['captchaBypassed'] is False
          assert r['diagnostics']['stoppedReason'] is None
          assert r['counts']['operationalMissingTargets'] == 29
          for e in r['recovered']:
              assert e['exactIdentityMatch'] is True
              assert e['evseId'] == 'ITGESE'+str(e['uidConnector'])
          print(json.dumps(r['counts'],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ges-nextcharge-operational-recovery
          path: data/reports/ges_nextcharge_operational_recovery.json
          retention-days: 14
