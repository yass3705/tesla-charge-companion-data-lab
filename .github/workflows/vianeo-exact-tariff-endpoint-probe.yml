name: France Vianeo exact tariff endpoint probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vianeo-exact-tariff-endpoint-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Extract Vianeo PAN IDs and probe read-only tariff flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/vianeo /tmp/vianeo
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/refactor/unified-data-engine-v9/data/v9/france-static/all.json.gz' -o /tmp/vianeo/all.json.gz
          python - <<'PY'
          import gzip,json,re,pathlib,requests,urllib.parse
          raw=json.loads(gzip.open('/tmp/vianeo/all.json.gz','rt',encoding='utf-8').read())
          rows=raw if isinstance(raw,list) else raw.get('stations') or raw.get('data') or raw.get('items') or []
          # recursively collect likely Vianeo station/EVSE records and identifiers without assuming schema.
          matches=[]
          def textish(x):
            if isinstance(x,str): return x
            if isinstance(x,(int,float,bool)) or x is None: return ''
            try:return json.dumps(x,ensure_ascii=False)
            except:return ''
          for idx,r in enumerate(rows):
            s=textish(r).lower()
            if 'vianeo' in s or 'engie' in s and ('charge' in s or 'recharge' in s):
              matches.append(r)
          ids=[]
          idkeys=('id_pdc_itinerance','id_pdc_local','evse','evse_id','evseid','identifier','id','code')
          def walk(x,path=''):
            if isinstance(x,dict):
              for k,v in x.items():
                lk=str(k).lower(); p=path+'/'+str(k)
                if isinstance(v,str) and (lk in idkeys or any(z in lk for z in ('evse','pdc','identifier'))):
                  val=v.strip()
                  if val and len(val)<120 and val not in ids: ids.append(val)
                walk(v,p)
            elif isinstance(x,list):
              for v in x: walk(v,path+'[]')
          for r in matches[:100]: walk(r)
          # Prioritize IDs that look like roaming EVSE IDs.
          ids=sorted(ids,key=lambda x:(0 if re.search(r'(?i)^FR\*?[A-Z0-9]{2,}\*?[A-Z0-9]',x) else 1,len(x)))
          ids=ids[:25]
          base='https://backend-api.engie-vianeo.com'
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://charge.engie-vianeo.com','Referer':'https://charge.engie-vianeo.com/'})
          attempts=[]
          def safe_body(r):
            txt=r.text[:10000]
            # redact token-like data while retaining prices/structure
            txt=re.sub(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}','[JWT_REDACTED]',txt)
            txt=re.sub(r'(?i)(token|secret|key)\s*[":=]+\s*["\']?[A-Za-z0-9._~-]{16,}',r'\1:[REDACTED]',txt)
            return txt
          for evse in ids[:12]:
            q=urllib.parse.quote(evse,safe='')
            # read-only location detail first
            for label,url,method in [
              ('detail',f'{base}/locations/evses/detail/{q}','GET'),
              ('tariff_direct',f'{base}/ca/tariff/{q}','GET')]:
              try:
                rr=sess.request(method,url,timeout=20)
                attempts.append({'evse':evse,'step':label,'status':rr.status_code,'contentType':rr.headers.get('content-type'),'body':safe_body(rr)})
              except Exception as e: attempts.append({'evse':evse,'step':label,'error':str(e)})
            # Select EVSE only establishes an anonymous web-charge session; do not call charge/payment endpoints.
            try:
              rr=sess.put(f'{base}/ca/select-evse/{q}',timeout=20)
              attempts.append({'evse':evse,'step':'select','status':rr.status_code,'contentType':rr.headers.get('content-type'),'body':safe_body(rr)})
              # retry tariff after anonymous selection
              rr2=sess.get(f'{base}/ca/tariff/{q}',timeout=20)
              attempts.append({'evse':evse,'step':'tariff_after_select','status':rr2.status_code,'contentType':rr2.headers.get('content-type'),'body':safe_body(rr2)})
            except Exception as e: attempts.append({'evse':evse,'step':'select_flow','error':str(e)})
          # Extract price-like evidence for summary.
          price_hits=[]
          money=re.compile(r'(?i)(?:\b\d+[\.,]\d{1,4}\s*(?:€|eur|/kwh|kwh|/min)|(?:price|tariff|tarif|amount|cost)[^\n]{0,120})')
          for a in attempts:
            body=a.get('body','')
            hits=money.findall(body)
            if hits: price_hits.append({'evse':a.get('evse'),'step':a.get('step'),'status':a.get('status'),'hits':hits[:20],'body':body[:5000]})
          out={'matchedRecords':len(matches),'candidateIds':ids,'attempts':attempts,'priceHits':price_hits}
          pathlib.Path('reports/france/vianeo/exact-tariff-endpoint-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'matchedRecords':len(matches),'candidateIds':ids,'attempts':[{k:v for k,v in a.items() if k!='body'}|({'body':a.get('body','')[:800]} if a.get('status') in (200,201,204) else {}) for a in attempts],'priceHits':price_hits[:30]},ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/vianeo/exact-tariff-endpoint-probe.json
          git commit -m 'France Vianeo: publish exact tariff endpoint probe' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*2)); done
          exit 1
