name: UK Connected Kerb 52 day/night recovery QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/uk_connected_kerb_tod_resolution_qa.py
      - .github/workflows/uk-connected-kerb-tod-resolution-qa.yml
permissions:
  contents: write
concurrency:
  group: uk-ck-tod-recovery-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every day/night minute for 52 EVSEs; 4 fee cases stay blocked
        run: python3 scripts/uk_connected_kerb_tod_resolution_qa.py
      - name: Publish QA and provenance
        run: |
          set -euo pipefail
          cp reports/uk/connected-kerb-tod-resolution-qa-2026-10-10.json /tmp/ck-tod-qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ck-tod-qa.json reports/uk/connected-kerb-tod-resolution-qa-2026-10-10.json
            git add reports/uk/connected-kerb-tod-resolution-qa-2026-10-10.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(uk): validated 52 exact tariff time windows [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((retry*2))"
          done
          exit 1
