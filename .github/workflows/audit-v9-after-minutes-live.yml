name: V9 live after-minutes fee validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_live_v9_after_minutes_20261011.cjs'
      - 'scripts/audit_electra_78_current_overlay_20261011.cjs'
      - '.github/workflows/audit-v9-after-minutes-live.yml'
permissions:
  contents: write
concurrency:
  group: v9-live-after-minutes-fee-validation
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze production V9 ref
        run: |
          set -euo pipefail
          git ls-remote https://github.com/yass3705/tesla-charge-companion-stable.git refs/heads/main | cut -f1 > /tmp/stable-ref
          ref=$(cat /tmp/stable-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "TCC_STABLE_REF=$ref" >> "$GITHUB_ENV"
          mkdir -p /tmp/live-stable
          for path in "assets/v9/pricing-engine.js" "data/v9/france-direct-offers.json" "data/v9/france-emsp-offers.json"; do
            mkdir -p "/tmp/live-stable/$(dirname "$path")"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/$ref/v9-production-runtime/$path" \
              -o "/tmp/live-stable/$path"
            test -s "/tmp/live-stable/$path"
          done
      - name: Check JS syntax
        run: node --check scripts/audit_live_v9_after_minutes_20261011.cjs
      - name: Run 84 historical cases audit and V9 current live engine regression
        run: |
          node scripts/audit_live_v9_after_minutes_20261011.cjs \
            /tmp/live-stable/assets/v9/pricing-engine.js \
            /tmp/live-stable/data/v9/france-direct-offers.json \
            /tmp/live-stable/data/v9/france-emsp-offers.json
      - name: Reconcile historical 78 Electra eMSP samples against current overlay
        run: |
          node --check scripts/audit_electra_78_current_overlay_20261011.cjs
          node scripts/audit_electra_78_current_overlay_20261011.cjs /tmp/live-stable/assets/v9/pricing-engine.js
      - name: Preserve audit evidence even if regression fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-live-after-minutes-fee-validation
          path: |
            reports/tariff-scenarios/live-v9-after-minutes-2026-10-11.json
            reports/tariff-scenarios/electra-78-current-overlay-validation-2026-10-11.json
          if-no-files-found: warn
      - name: Publish read-only audit report
        if: success()
        run: |
          set -euo pipefail
          cp reports/tariff-scenarios/live-v9-after-minutes-2026-10-11.json /tmp/live-v9-after-minutes-audit.json
          cp reports/tariff-scenarios/electra-78-current-overlay-validation-2026-10-11.json /tmp/electra-78-overlay-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/live-v9-after-minutes-audit.json reports/tariff-scenarios/live-v9-after-minutes-2026-10-11.json
            cp /tmp/electra-78-overlay-audit.json reports/tariff-scenarios/electra-78-current-overlay-validation-2026-10-11.json
            git add reports/tariff-scenarios/live-v9-after-minutes-2026-10-11.json reports/tariff-scenarios/electra-78-current-overlay-validation-2026-10-11.json
            git diff --cached --quiet && exit 0
            git commit -m 'audit(v9): classify historical 84 fee warnings and verify current live engine'
            git push origin HEAD:main && exit 0
            sleep $((2*i))
          done
          exit 1
