name: Germany Mobilithek search contract probe

on:
  push:
    branches: [feature/germany-national-base]
    paths:
      - 'scripts/germany_mobilithek_search_contract_probe.py'
      - '.github/workflows/germany-mobilithek-search-contract-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe targeted offer search
        run: python scripts/germany_mobilithek_search_contract_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: germany-mobilithek-search-contract-${{ github.run_id }}
          path: data/germany/mobilithek_search_contract_probe.json
          if-no-files-found: error
          retention-days: 7
