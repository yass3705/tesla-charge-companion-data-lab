          ELECTROVERSE_STATUS_RUN_LIMIT: '1500'
          ELECTROVERSE_STATUS_ATTEMPTS: '2'
        run: |
          set -euo pipefail
          python scripts/resilient_v9_electroverse_status.py segment \
            --out "$RUNNER_TEMP/tcc-v9-status-census" \
            --phase recovery --partition 14
      - name: Preserve immutable recovery 14 checkpoint
        if: ${{ steps.recovery14.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-electroverse-status-stage-recovery-14
          path: ${{ runner.temp }}/tcc-v9-status-census/stage-delta/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Bounded recovery 15
        id: recovery15
        if: ${{ steps.mode.outputs.mode == 'collect' && env.STATUS_HALT != 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          ELECTROVERSE_API_KEY: ${{ secrets.ELECTROVERSE_API_KEY }}
          ELECTROVERSE_STATUS_REQUEST_DELAY_MS: '800'
          ELECTROVERSE_STATUS_FAILURE_BUDGET: '48'
          ELECTROVERSE_STATUS_RUN_LIMIT: '1500'
          ELECTROVERSE_STATUS_ATTEMPTS: '2'
        run: |
          set -euo pipefail
          python scripts/resilient_v9_electroverse_status.py segment \
