name: UK Osprey public API probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-osprey-public-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe public map endpoints
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,uuid
          from pathlib import Path
          from datetime import datetime,timezone
          base="https://apigw.ospreycharging.co.uk/portal"
          headers={
            "User-Agent":"Mozilla/5.0 TeslaChargeCompanion/9 Osprey-public-map",
            "Accept":"application/json, text/plain, */*",
            "Origin":"https://account.ospreycharging.co.uk",
            "Referer":"https://account.ospreycharging.co.uk/",
            "osprey-device-id":str(uuid.uuid4()),
            "osprey-environment":"PRD",
            "osprey-platform":"web",
            "osprey-app-version":"web"
          }
          def req(path):
              url=base+path
              item={"path":path,"url":url}
              try:
                  r=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(r,timeout=75) as x:
                      body=x.read(10000000)
                      item.update({"status":x.status,"contentType":x.headers.get("Content-Type"),"bytes":len(body)})
                      try:
                          p=json.loads(body.decode("utf-8"))
                          item["jsonType"]=type(p).__name__
                          if isinstance(p,list):
                              item["count"]=len(p)
                              item["sample"]=p[0] if p else None
                          elif isinstance(p,dict):
                              item["keys"]=list(p)[:80]
                              item["sample"]=p
                          return item,p
                      except Exception:
                          item["bodyPrefix"]=body[:1000].decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  item.update({"status":e.code,"error":str(e)})
                  try:item["bodyPrefix"]=e.read(1000).decode("utf-8","replace")
                  except Exception:pass
              except Exception as e:item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
              return item,None
          results=[]
          maprow,p=req("/location/map/all"); results.append(maprow)
          sample_id=None
          if isinstance(p,list) and p:
              sample_id=p[0].get("id") if isinstance(p[0],dict) else None
          elif isinstance(p,dict):
              arr=None
              for k in ("data","locations","items","results"):
                  if isinstance(p.get(k),list): arr=p[k]; break
              if arr and isinstance(arr[0],dict): sample_id=arr[0].get("id")
          if sample_id is not None:
              a,_=req("/location/point/"+str(sample_id)); results.append(a)
              b,_=req("/location-price/"+str(sample_id)); results.append(b)
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"Osprey Charging","base":base,"sampleId":sample_id,"results":results}
          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/osprey-public-api-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"sampleId":sample_id,"results":[{"path":x["path"],"status":x.get("status"),"count":x.get("count"),"bytes":x.get("bytes")} for x in results]},indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/osprey-public-api-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe Osprey public map API [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
