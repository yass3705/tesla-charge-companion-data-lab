name: Analyze Electroverse France 0 residual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_zero_residual.mjs"
      - ".github/workflows/electroverse-zero-residual-analysis.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze 0 unpublished residual
        run: node scripts/analyze_electroverse_zero_residual.mjs
      - name: Persist validated zero exact-set groups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/electroverse/validated-mappings/zero-homogeneous-exact-set.json
          if git diff --cached --quiet; then
            echo "No zero exact-set changes"
          else
            git commit -m "data: publish validated Electroverse zero exact-set groups"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-zero-residual-analysis
          path: reports/electroverse/zero-residual-analysis.json
          retention-days: 14
