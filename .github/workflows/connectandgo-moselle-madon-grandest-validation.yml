name: Grand Est Connectandgo Moselle Madon validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/connectandgo_moselle_madon_official.py"
      - ".github/workflows/connectandgo-moselle-madon-grandest-validation.yml"

permissions:
  contents: write

concurrency:
  group: grandest-connectandgo-moselle-madon-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/connectandgo_moselle_madon
          python -m py_compile scripts/connectandgo_moselle_madon_official.py
          python scripts/connectandgo_moselle_madon_official.py --out out/connectandgo_moselle_madon 2> >(tee out/connectandgo_moselle_madon/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/connectandgo_moselle_madon/connectandgo_moselle_madon_official_grandest.json').read_text())
          assert p['dataset']=='connectandgo-moselle-madon-official-grandest'
          assert p['network']['publishedPlannedStationCount']==24
          assert p['network']['publishedMunicipalityCount']==14
          assert p['network']['publishedConnectorPowerKw']==[22,25,120]
          assert p['operatorDirect']['withoutSubscription']['day']['below30Kw']=={'eurPerKwh':0.27,'eurPerMinute':0.025}
          assert p['operatorDirect']['withoutSubscription']['day']['above30Kw']=={'eurPerKwh':0.45,'eurPerMinute':0.025}
          assert p['operatorDirect']['withoutSubscription']['night']['below30Kw']=={'eurPerKwh':0.25,'eurPerMinute':0.0}
          assert p['operatorDirect']['withoutSubscription']['idle']['below30Kw']=={'afterMinutes':180,'eurPerMinute':0.16,'condition':'without_consumption'}
          assert p['operatorDirect']['withoutSubscription']['idle']['above30Kw']=={'afterMinutes':60,'eurPerMinute':0.20,'condition':'without_consumption'}
          assert p['operatorDirect']['withSubscription']['monthlyEur']==3.0
          assert p['operatorDirect']['withSubscription']['day']['below30Kw']=={'eurPerKwh':0.25,'eurPerMinute':0.025}
          assert p['operatorDirect']['withSubscription']['day']['above30Kw']=={'eurPerKwh':0.43,'eurPerMinute':0.02}
          assert p['operatorDirect']['withSubscription']['night']['below30Kw']=={'eurPerKwh':0.20,'eurPerMinute':0.0}
          assert p['operatorDirect']['withSubscription']['idle']['below30Kw']=={'afterMinutes':240,'eurPerMinute':0.13,'condition':'without_consumption'}
          assert p['operatorDirect']['withSubscription']['idle']['above30Kw']=={'afterMinutes':90,'eurPerMinute':0.15,'condition':'without_consumption'}
          assert p['tccDecision']['directTariffClassable'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/connectandgo_moselle_madon
          cp out/connectandgo_moselle_madon/connectandgo_moselle_madon_official_grandest.json data/operator_direct/connectandgo_moselle_madon_official_grandest.json
          cp out/connectandgo_moselle_madon/SUMMARY.md reports/connectandgo_moselle_madon/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/connectandgo_moselle_madon_official_grandest.json reports/connectandgo_moselle_madon/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(connectandgo): publish Moselle et Madon tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/connectandgo_moselle_madon
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/connectandgo_moselle_madon/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/connectandgo_moselle_madon/latest_diagnostic.json').write_text(json.dumps({'dataset':'connectandgo-moselle-madon-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/connectandgo_moselle_madon
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/connectandgo_moselle_madon/latest_run_status.json').write_text(json.dumps({'dataset':'connectandgo-moselle-madon-run-status','operator':'Connect&go - Moselle et Madon','region':'Grand Est','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/connectandgo_moselle_madon/latest_run_status.json
          if [ -f reports/connectandgo_moselle_madon/latest_diagnostic.json ]; then git add reports/connectandgo_moselle_madon/latest_diagnostic.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "status(connectandgo-moselle-madon): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
