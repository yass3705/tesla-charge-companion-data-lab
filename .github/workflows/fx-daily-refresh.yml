name: FX daily refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    paths:
      - '.github/workflows/fx-daily-refresh.yml'
      - 'scripts/update_fx.py'
      - 'tests/test_update_fx.py'
      - 'data/fx/exchange_rates.json'

permissions:
  contents: write

concurrency:
  group: fx-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained fallback behavior
        run: python -m unittest discover -s tests -p 'test_update_fx.py'
      - name: Refresh only outside PR validation
        if: github.event_name != 'pull_request'
        run: python scripts/update_fx.py
      - name: Validate the latest preserved rates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/fx/exchange_rates.json').read_text())
          required={'EUR','CHF','GBP','NOK','SEK','DKK','PLN','CZK','HUF','RON','BGN','MAD','DZD','TND'}
          assert d['base']=='EUR' and required==set(d['rates'])
          assert all(isinstance(v,(int,float)) and v>0 for v in d['rates'].values())
          PY
      - name: Commit validated rates
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fx/exchange_rates.json data/fx/metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(fx): refresh validated exchange rates [run ${GITHUB_RUN_ID}]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
