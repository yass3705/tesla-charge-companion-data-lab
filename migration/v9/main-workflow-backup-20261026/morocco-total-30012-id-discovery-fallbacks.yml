name: Morocco Total 3.00.12 fallback ID discovery

on:
  push:
    paths:
      - '.github/workflows/morocco-total-30012-id-discovery-fallbacks.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Analyze public Club EV-Charge client
        shell: bash
        env:
          URL: "https://download.pureapk.com/b/XAPK/Y29tLm5hbXAudG90YWxldl8xNF8zNTJhNjdlNQ?as2=db91def85bd2cc2cebea5e889e36b4866c92699d&k=6a2bd595361c47705231b076672895396c92699d&_p=Y29tLm5hbXAudG90YWxldg&c=1%7CBUSINESS%7Cb2lkPTkmZGV2PVRFTSUyME1hcm9jJnQ9eGFwayZzPTUwODMzMjYwJnZuPTMuMDAuMTImdmM9MTQ&_fn=Q2x1YitFVi1DaGFyZ2VfMy4wMC4xMl9hcGtjb21iby5jb20ueGFwaw%3D%3D"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libicu-dev libcapstone-dev
          python -m pip install --quiet pyelftools requests
          rm -rf /tmp/total-fallback /tmp/blutter /tmp/blutter-out
          mkdir -p /tmp/total-fallback/xapk /tmp/total-fallback/lib
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180             --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0' "$URL" -o /tmp/total-fallback/current.xapk
          unzip -q /tmp/total-fallback/current.xapk -d /tmp/total-fallback/xapk
          python - <<'PY'
          import os,zipfile
          root='/tmp/total-fallback/xapk';out='/tmp/total-fallback/lib';found=set()
          for fn in os.listdir(root):
              if not fn.endswith('.apk'): continue
              try:
                  with zipfile.ZipFile(os.path.join(root,fn)) as z:
                      for t in ('libapp.so','libflutter.so'):
                          n='lib/arm64-v8a/'+t
                          if n in z.namelist() and t not in found:
                              open(os.path.join(out,t),'wb').write(z.read(n));found.add(t)
              except Exception: pass
          if found != {'libapp.so','libflutter.so'}: raise SystemExit('ARM64 pair missing')
          PY
          git clone --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
          timeout 600 python3 /tmp/blutter/blutter.py /tmp/total-fallback/lib /tmp/blutter-out >/tmp/blutter-fallback.log 2>&1

      - name: Extract safe QR/deeplink and station-status contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/morocco/totalenergies
          python - <<'PY'
          import os,re,json
          from datetime import datetime,timezone

          root='/tmp/blutter-out'
          markers=[
            'fetchScanResult','fetchScanResultEvo','deepLinkURLScheme','deeplink',
            'qrcode','qrCode','CPID','cpid','cpId','ConnectorId','connectorId',
            'ChargeStationPIN','status/api/get-status-info','get-status-info',
            'ChargeStationId','ChargeStationStatus'
          ]
          secret=re.compile(r'(?i)(eyJ[A-Za-z0-9_.-]{20,}|AIza[A-Za-z0-9_-]{20,}|Bearer\s+[A-Za-z0-9._~+/-]{12,})')
          safe_literal=re.compile(r'(?i)(scan|qr|deep|scheme|cpid|cpId|connector|station|status|get-status-info|queryParameters|DioMixin::(?:get|post)|data|path|url)')
          records=[]
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  try:
                      if os.path.getsize(p)>50_000_000: continue
                      lines=open(p,encoding='utf-8',errors='ignore').read().splitlines()
                  except Exception: continue
                  centers=[i for i,l in enumerate(lines) if any(m.lower() in l.lower() for m in markers)]
                  for c in centers[:100]:
                      rel=os.path.relpath(p,root)
                      # limit to app source-like files and pp constants
                      if not (rel.startswith('asm/kurrent_charge/') or rel=='pp.txt'): continue
                      ctx=[]
                      for j in range(max(0,c-45),min(len(lines),c+90)):
                          line=secret.sub('<redacted-secret-like>',lines[j])
                          if safe_literal.search(line):
                              # remove opaque long quoted literals unrelated to route/key structure
                              for qm in list(re.finditer(r'"([^"]{1,300})"',line)):
                                  v=qm.group(1)
                                  if not safe_literal.search(v):
                                      line=line.replace('"'+v+'"','"<redacted>"')
                              ctx.append({'line':j+1,'text':line[:900]})
                      if ctx:
                          records.append({'file':rel,'center_line':c+1,'marker_hits':[m for m in markers if m.lower() in lines[c].lower()][:10],'context':ctx[:120]})
          # dedupe
          seen=set();uniq=[]
          for r in records:
              k=(r['file'],r['center_line'],tuple(r['marker_hits']))
              if k in seen:continue
              seen.add(k);uniq.append(r)
          out={
            'schema_version':1,
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'TotalEnergies / Club EV-Charge',
            'source_client':{'package':'com.namp.totalev','version':'3.00.12'},
            'policy':{'static_analysis_only':True,'no_backend_requests':True,'no_login':True,'no_credentials':True,'no_tokens_persisted':True,'raw_blutter_output_persisted':False},
            'records':uniq[:220]
          }
          with open('reports/morocco/totalenergies/club-ev-charge-30012-id-discovery-fallbacks-2026-09-26.json','w') as f:
              json.dump(out,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          rm -rf /tmp/total-fallback /tmp/blutter /tmp/blutter-out /tmp/blutter-fallback.log

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/totalenergies/club-ev-charge-30012-id-discovery-fallbacks-2026-09-26.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(morocco): resolve Total fallback ID discovery [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push origin main
