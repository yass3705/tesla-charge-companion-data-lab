name: UK BeEV public map collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-beev-public-map-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect Be.EV-operated public map inventory
        run: |
          python - <<'PY'
          import json,gzip,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone

          url="https://be-ev.co.uk/api/sites/GetMarkersWithFilters?Availability=o:0,a:0,&ChargerType=f:0,r:0,ur:0&ConnectorType=type2:0,ccs:0,chademo:0&Facilities=RESTAURANT:0,PARKING_LOT:0,SPORT:0,CAFE:0,HOTEL:0,MALL:0,SUPERMARKET:0,TRAIN_STATION:0,RECREATION_AREA:0,NATURE:0&source=fuuse"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TeslaChargeCompanion/9","Accept":"application/json","Referer":"https://be-ev.co.uk/"})
          with urllib.request.urlopen(req,timeout=75) as r:
              p=json.loads(r.read().decode("utf-8"))
          rows=p if isinstance(p,list) else []
          own=[x for x in rows if isinstance(x,dict) and x.get("isBeevOperated") is True]
          non_own=[x for x in rows if isinstance(x,dict) and x.get("isBeevOperated") is not True]
          cp=connectors=0; statuses={}; tariffs={}; missing_site_tariff=0; missing_cp_tariff=0
          for site in own:
              st=str(site.get("status")); statuses[st]=statuses.get(st,0)+1
              t=site.get("tariff")
              if isinstance(t,dict) and t.get("amount") is not None:
                  k=f"{t.get('amount')} {t.get('currency')}"; tariffs[k]=tariffs.get(k,0)+1
              else: missing_site_tariff+=1
              for ch in site.get("chargePoints") or []:
                  if not isinstance(ch,dict): continue
                  cp+=1
                  ct=ch.get("tariff")
                  if not (isinstance(ct,dict) and ct.get("amount") is not None): missing_cp_tariff+=1
                  for con in ch.get("connectors") or []:
                      if isinstance(con,dict): connectors+=1
          retrieved=datetime.now(timezone.utc).isoformat()
          out={"country":"GB","network":"Be.EV","retrievedAt":retrieved,"source":"official Be.EV public website map API","sites":own}
          summary={
            "country":"GB","network":"Be.EV","retrievedAt":retrieved,
            "apiRows":len(rows),"beEvOperatedSites":len(own),"excludedNonBeEvSites":len(non_own),
            "chargePoints":cp,"connectors":connectors,"siteStatuses":statuses,
            "siteTariffValues":tariffs,"sitesWithoutTariff":missing_site_tariff,
            "chargePointsWithoutTariff":missing_cp_tariff,
            "status":"complete" if own and missing_site_tariff==0 and missing_cp_tariff==0 else "partial"
          }
          Path("data/national").mkdir(parents=True,exist_ok=True); Path("reports/uk").mkdir(parents=True,exist_ok=True)
          with gzip.open("data/national/uk_beev_public_map.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/beev-public-map-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not own: raise SystemExit("no Be.EV-operated sites")
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_beev_public_map.json.gz reports/uk/beev-public-map-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Be.EV public map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
