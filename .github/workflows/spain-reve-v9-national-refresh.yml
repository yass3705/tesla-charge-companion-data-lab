name: Spain REVE national runtime refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Seed the last validated public bundle or refresh from REVE'
        type: choice
        options: [seed, refresh]
        default: refresh
  schedule:
    - cron: '17 3 1 * *'
  pull_request:
    paths:
      - '.github/workflows/spain-reve-v9-national-refresh.yml'
      - 'scripts/reve-v2-*.mjs'
      - 'scripts/validate_reve_v2_runtime.py'
      - 'data/reve_v2/validated_runtime/**'

permissions:
  contents: write

concurrency:
  group: spain-reve-v9-national-refresh
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        if: ${{ !hashFiles('data/reve_v2/validated_runtime/spain-static/manifest.json') }}
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 39c5bcaadd42b9ba932824f89dc8b97e20ebb762
          path: stable-seed
          sparse-checkout: |
            v9-production-runtime/data/v9/spain-static
            v9-production-runtime/data/v9/spain-reve-offers
      - name: Validate preserved complete REVE runtime and compiler syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/reve_v2/validated_runtime/spain-static/manifest.json ]; then
            python scripts/validate_reve_v2_runtime.py data/reve_v2/validated_runtime
          else
            python scripts/validate_reve_v2_runtime.py stable-seed/v9-production-runtime/data/v9
          fi
          for file in scripts/reve-v2-{web-extract,snapshot,analyze,build-canonical,build-tcc}.mjs; do
            node --check "$file"
          done

  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'seed'
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 39c5bcaadd42b9ba932824f89dc8b97e20ebb762
          path: stable-seed
          sparse-checkout: |
            v9-production-runtime/data/v9/spain-static
            v9-production-runtime/data/v9/spain-reve-offers
      - name: Seed immutable last-good public runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/reve_v2/validated_runtime/spain-static/manifest.json || {
            echo 'Data Lab already owns a validated REVE bundle; refusing to overwrite it' >&2
            exit 1
          }
          python scripts/validate_reve_v2_runtime.py stable-seed/v9-production-runtime/data/v9
          mkdir -p data/reve_v2/validated_runtime
          cp -a stable-seed/v9-production-runtime/data/v9/spain-static stable-seed/v9-production-runtime/data/v9/spain-reve-offers data/reve_v2/validated_runtime/
          python scripts/validate_reve_v2_runtime.py data/reve_v2/validated_runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reve_v2/validated_runtime
          git commit -m "data(spain): preserve validated REVE runtime from Stable pin"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh')
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Data Lab-owned validated baseline
        run: python scripts/validate_reve_v2_runtime.py data/reve_v2/validated_runtime
      - name: Extract, normalize and compile in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/reve-national"
          mkdir -p "$work/scripts"
          cp scripts/reve-v2-{web-extract,snapshot,analyze,build-canonical,build-tcc}.mjs "$work/scripts/"
          cd "$work"
          node scripts/reve-v2-web-extract.mjs
          node scripts/reve-v2-analyze.mjs
          node scripts/reve-v2-build-canonical.mjs
          node scripts/reve-v2-build-tcc.mjs
          node -e "const r=require('./data/reve-v2/tcc-integration/spain-tcc-build-report.json');if(!r.ok)process.exit(1)"
          mkdir -p candidate/spain-static candidate/spain-reve-offers
          cp data/reve-v2/tcc-integration/all.json.gz data/reve-v2/tcc-integration/tile_*.json.gz candidate/spain-static/
          cp data/reve-v2/tcc-integration/spain-static-manifest.json candidate/spain-static/manifest.json
          cp data/reve-v2/tcc-integration/offers_*.json.gz candidate/spain-reve-offers/
          cp data/reve-v2/tcc-integration/spain-reve-offers-manifest.json candidate/spain-reve-offers/manifest.json
          cd "$GITHUB_WORKSPACE"
          python scripts/validate_reve_v2_runtime.py "$work/candidate" --baseline data/reve_v2/validated_runtime
      - name: Publish only a complete, non-regressed bundle
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/reve-national"
          rm -rf data/reve_v2/validated_runtime/spain-static data/reve_v2/validated_runtime/spain-reve-offers
          cp -a "$work/candidate/spain-static" "$work/candidate/spain-reve-offers" data/reve_v2/validated_runtime/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reve_v2/validated_runtime
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(spain): publish validated REVE national runtime [run ${GITHUB_RUN_ID}]"
          git fetch origin main
          changed="$(git diff --name-only "$GITHUB_SHA"..origin/main -- scripts/reve-v2-\*.mjs scripts/validate_reve_v2_runtime.py .github/workflows/spain-reve-v9-national-refresh.yml)"
          if [ -n "$changed" ]; then
            echo 'REVE compiler changed during collection; refusing stale output' >&2
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reve-national-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reve-national/data/reve-v2/analysis/*/coverage-summary.json
            ${{ runner.temp }}/reve-national/data/reve-v2/canonical/build-report.json
            ${{ runner.temp }}/reve-national/data/reve-v2/tcc-integration/spain-tcc-build-report.json
          if-no-files-found: ignore
          retention-days: 14
