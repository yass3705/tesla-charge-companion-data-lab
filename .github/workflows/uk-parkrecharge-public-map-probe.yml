name: UK ParkRecharge public map probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-parkrecharge-public-map-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe webapp public devices endpoint
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA="TeslaChargeCompanion/9 ParkRecharge-public-map-probe"
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json,text/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read().decode("utf-8","replace"),r.status,r.headers.get("Content-Type")

          env_url="https://parkrecharge.app/assets/js/env.js"
          env,_,_=fetch(env_url)

          def extract(name):
              patterns=[
                rf'(?i)\b{name}\b\s*:\s*["\']([^"\']+)["\']',
                rf'(?i)\b{name}\b\s*=\s*["\']([^"\']+)["\']',
              ]
              for p in patterns:
                  m=re.search(p,env)
                  if m: return m.group(1)
              return None

          endpoint=extract("API_ENDPOINT")
          key=extract("API_KEY")
          out={"country":"GB","network":"ParkRecharge","retrievedAt":datetime.now(timezone.utc).isoformat(),
               "config":{"apiEndpointFound":bool(endpoint),"publicClientKeyFound":bool(key)}}
          if not endpoint or not key:
              out["status"]="config_not_parsed"
          else:
              url=urllib.parse.urljoin(endpoint,"devices/")+"?"+urllib.parse.urlencode({"format":"json","key":key,"data":"full"})
              try:
                  body,status,ctype=fetch(url)
                  out["httpStatus"]=status; out["contentType"]=ctype
                  p=json.loads(body)
                  out["jsonType"]=type(p).__name__
                  # inspect shape without logging credentials or raw payload
                  arr=None
                  if isinstance(p,list): arr=p
                  elif isinstance(p,dict):
                      out["topLevelKeys"]=list(p)[:80]
                      for k in ("data","devices","results","items","response"):
                          if isinstance(p.get(k),list):
                              arr=p[k]; out["arrayKey"]=k; break
                      if arr is None:
                          # common Hubeleon form can be id->device mapping
                          dictvals=[v for v in p.values() if isinstance(v,dict)]
                          if dictvals and len(dictvals)>=2:
                              arr=dictvals; out["arrayKey"]="dict_values"
                  arr=arr or []
                  out["records"]=len(arr)
                  if arr and isinstance(arr[0],dict):
                      out["firstRecordKeys"]=list(arr[0])[:100]
                  field_counts={}; status_values={}; samples=[]
                  interesting=("price","tariff","cost","rate","fee","connector","socket","status","latitude","longitude","location","name","device")
                  def walk(x,path="",depth=0):
                      if depth>5: return
                      if isinstance(x,dict):
                          for k,v in x.items():
                              kl=str(k).lower()
                              if any(term in kl for term in interesting):
                                  field_counts[kl]=field_counts.get(kl,0)+1
                                  if kl=="status" and isinstance(v,(str,int,float,bool)):
                                      sv=str(v); status_values[sv]=status_values.get(sv,0)+1
                                  if any(term in kl for term in ("price","tariff","cost","rate","fee")) and len(samples)<50:
                                      samples.append({"path":(path+"."+str(k)).lstrip("."),"value":v if isinstance(v,(str,int,float,bool,type(None))) else type(v).__name__})
                              walk(v,(path+"."+str(k)).lstrip("."),depth+1)
                      elif isinstance(x,list):
                          for i,v in enumerate(x[:50]): walk(v,path+"[]",depth+1)
                  for rec in arr[:5000]: walk(rec)
                  out["interestingFieldCounts"]=field_counts
                  out["statusValues"]=status_values
                  out["pricingFieldSamples"]=samples
                  out["status"]="public_devices_usable" if arr else "empty_or_unrecognized"
              except urllib.error.HTTPError as e:
                  out["httpStatus"]=e.code; out["status"]="http_error"
                  try: out["bodyPrefix"]=e.read(500).decode("utf-8","replace")
                  except Exception: pass
              except Exception as e:
                  out["status"]="error"; out["error"]=f"{type(e).__name__}: {e}"

          Path("reports/uk").mkdir(parents=True,exist_ok=True)
          Path("reports/uk/parkrecharge-public-map-probe-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/parkrecharge-public-map-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe ParkRecharge public map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
