name: NL 5246 pricing compiler regression tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/test_dotnl_5246_ocpi_compiler.py
      - scripts/dotnl_netherlands_runtime.py
      - .github/workflows/nl-5246-pricing-regressions.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test actual EFL, ENE and OCPI time/unit cases
        run: python3 -m unittest discover -s tests -p 'test_dotnl_5246_ocpi_compiler.py' -v
