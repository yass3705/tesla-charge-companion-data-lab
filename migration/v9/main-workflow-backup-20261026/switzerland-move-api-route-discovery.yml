name: Switzerland MOVE API route discovery
on:
  push:
    paths:
      - 'scripts/discover_move_api_routes.py'
      - '.github/workflows/switzerland-move-api-route-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/discover_move_api_routes.py
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/switzerland-move-api-route-discovery-2026-09-28.json
          git commit -m 'docs(switzerland): discover MOVE public API routes' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
