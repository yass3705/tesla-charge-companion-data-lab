name: Debug Electroverse S30 sample profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/debug_electroverse_s30_sample_profiles.mjs"
      - ".github/workflows/electroverse-s30-sample-debug.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/debug_electroverse_s30_sample_profiles.mjs
      - name: Persist S30 sample profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/s30-sample-profiles.json
          if git diff --cached --quiet; then
            echo "No S30 sample changes"
          else
            git commit -m "data: persist Electroverse S30 sample profiles"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
