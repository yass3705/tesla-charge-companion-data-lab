name: NL 5246 tariff calculation root-cause audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/nl_5246_uncomputable_tariff_diagnostic.py
      - .github/workflows/nl-5246-diagnostics.yml
permissions:
  contents: write
concurrency:
  group: nl-5246-diagnostics
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Analyze 5246 exact tariff scenarios and component structures
        run: |
          python3 -m py_compile scripts/nl_5246_uncomputable_tariff_diagnostic.py
          python3 scripts/nl_5246_uncomputable_tariff_diagnostic.py
      - name: Commit report
        run: |
          set -euo pipefail
          cp reports/netherlands/dotnl-5246-calculation-root-cause-latest.json /tmp/nl-5246.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nl-5246.json reports/netherlands/dotnl-5246-calculation-root-cause-latest.json
            git add reports/netherlands/dotnl-5246-calculation-root-cause-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(nl): explain 5246 tariff calculation cases by tariff dimension"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((i*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-5246-tariff-diagnostic-${{ github.run_id }}
          path: reports/netherlands/dotnl-5246-calculation-root-cause-latest.json
