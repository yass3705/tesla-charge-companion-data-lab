name: Morocco TotalEnergies Numocity request-shape

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/total_numocity_shape_probe.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/morocco-total-numocity-shape.yml"

permissions:
  contents: write

concurrency:
  group: morocco-total-numocity-shape
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate safety and syntax
        run: |
          python scripts/public_safety_check.py .
          python -m py_compile scripts/total_numocity_shape_probe.py
      - name: Run local read-only shape probe
        run: python scripts/total_numocity_shape_probe.py
      - name: Validate generated output
        run: |
          test -s artifacts/total-numocity-shape/summary.json
          python scripts/public_safety_check.py artifacts/total-numocity-shape
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/total-numocity-shape/summary.json').read_text())
          assert p['policy']['read_only'] is True
          assert p['policy']['backend_requests_made'] is False
          assert p['policy']['raw_package_persisted'] is False
          assert p['policy']['raw_strings_persisted'] is False
          assert p['policy']['raw_credentials_persisted'] is False
          print('routes:',p.get('route_hits',{}))
          print('verbs:',p.get('nearby_http_verb_counts',{}))
          print('params:',p.get('nearby_parameter_name_counts',{}))
          PY
      - name: Persist sanitized summary
        run: |
          mkdir -p reports/morocco/totalenergies
          cp artifacts/total-numocity-shape/summary.json reports/morocco/totalenergies/latest-numocity-shape.json
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/morocco/totalenergies/latest-numocity-shape.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git commit -m "data(morocco): update TotalEnergies Numocity shape [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:${GITHUB_REF_NAME}
