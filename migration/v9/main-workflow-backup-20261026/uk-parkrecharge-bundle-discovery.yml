name: UK ParkRecharge bundle discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-parkrecharge-bundle-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current ParkRecharge public JS bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import re,json,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          page='https://parkrecharge.com/public-charging/'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9'})
          with urllib.request.urlopen(req,timeout=45) as r: h=r.read().decode('utf-8','replace')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',h,re.I)
          scripts=[urllib.parse.urljoin(page,x) for x in scripts]
          out={'country':'GB','network':'ParkRecharge','retrievedAt':datetime.now(timezone.utc).isoformat(),'page':page,'scripts':[]}
          for url in scripts:
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeslaChargeCompanion/9'})
                  with urllib.request.urlopen(req,timeout=60) as r: txt=r.read().decode('utf-8','replace')
                  item['bytes']=len(txt.encode())
                  urls=re.findall(r'https?://[^\s"\'<>\\]+',txt)
                  paths=re.findall(r'["\'](/[^"\']{2,180})["\']',txt)
                  cand=[]
                  for x in urls+paths:
                      low=x.lower()
                      if any(k in low for k in ('api','charge','charger','station','location','tariff','open-data','opendata','ocpi','connector','evse','reliability','public')): cand.append(x)
                  item['candidates']=list(dict.fromkeys(cand))[:500]
                  ctx=[]
                  for m in re.finditer(r'(?i)(api|open.?data|ocpi|tariff|evse|connector|charger|station|location)',txt):
                      sn=re.sub(r'\s+',' ',txt[max(0,m.start()-180):min(len(txt),m.end()+350)])
                      if sn not in ctx: ctx.append(sn)
                      if len(ctx)>=80: break
                  item['contexts']=ctx
              except Exception as e: item['error']=f'{type(e).__name__}: {e}'
              out['scripts'].append(item)
          Path('reports/uk/parkrecharge-bundle-discovery-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/parkrecharge-bundle-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect ParkRecharge public bundle [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
