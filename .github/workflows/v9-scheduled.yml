name: V9 scheduled collections
run-name: ${{ (github.event.schedule == '27 * * * *' || inputs.reve_stream == true) && 'V9 REVE bounded stream' || 'V9 scheduled collections' }}
on:
  schedule:
    - cron: '37 3 * * *'
    - cron: '53 8 * * *'
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      reve_stream:
        description: Advance the existing REVE generation within its hourly quota
        required: false
        type: boolean
        default: false
      collection_run:
        description: Replay a verified IONITY collection from a previous run
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: v9-verified-${{ (inputs.reve_stream == true || github.event.schedule == '27 * * * *') && 'reve' || github.event.schedule || 'manual' }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && inputs.reve_stream != true && inputs.collection_run == '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 3 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: FR:ionity_direct_family
            slug: FR_ionity_direct_family
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 00b3ef4228e5c8ce30013f2f8c2527340dd03f86
          persist-credentials: false
      - name: Renew the approved method in temporary storage
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: python3 -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/v9" --workers 1 --attempts 1
      - name: Retain complete collection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-collection-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/v9/manifest.json
            ${{ runner.temp }}/v9/objects
          if-no-files-found: error
          retention-days: 30
  import:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && inputs.reve_stream != true && (needs.collect.result == 'success' || (needs.collect.result == 'skipped' && inputs.collection_run != ''))
    permissions:
      contents: read
      actions: read
    uses: yass3705/tesla-charge-companion-production/.github/workflows/v9-import-reviewed.yml@fd9adbe3d30c35422f60585b4f86343eca1a7d5e
    with:
      production_sha: fd9adbe3d30c35422f60585b4f86343eca1a7d5e
      collection_run: ${{ inputs.collection_run || format('{0}', github.run_id) }}

  direct-evidence:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '53 8 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - source: FR:sdey
            slug: FR_sdey
          - source: FR:siceco_cotedor
            slug: FR_siceco_cotedor
          - source: FR:sied70
            slug: FR_sied70
          - source: FR:sieeen_nievre
            slug: FR_sieeen_nievre
          - source: FR:syded_doubs
            slug: FR_syded_doubs
          - source: FR:tde90_belfort
            slug: FR_tde90_belfort
          - source: FR:fastned_official
            slug: FR_fastned_official
          - source: FR:ionity_official
            slug: FR_ionity_official
          - source: FR:atlante_official
            slug: FR_atlante_official
          - source: FR:driveco_official
            slug: FR_driveco_official
          - source: FR:eborn_official
            slug: FR_eborn_official
          - source: FR:freshmile_official
            slug: FR_freshmile_official
          - source: FR:qovoltis_official
            slug: FR_qovoltis_official
          - source: FR:metropolis_official
            slug: FR_metropolis_official
          - source: FR:iecharge_official
            slug: FR_iecharge_official
          - source: FR:lidl_plus_official
            slug: FR_lidl_plus_official
          - source: FR:pluginn_fastcharge_official
            slug: FR_pluginn_fastcharge_official
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b5758416426acc8b30b7043a096f12f85390c670
          persist-credentials: false
      - name: Collect and verify the historical method
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: python3 -m v9_rebuild.orchestrator --source "$SOURCE_ID" --out "$RUNNER_TEMP/v9" --workers 1 --attempts 1
      - name: Retain validated source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-collection-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/v9/manifest.json
            ${{ runner.temp }}/v9/objects
          if-no-files-found: error
          retention-days: 30
      - name: Retain sanitized technical failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-failure-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/v9/manifest.json
            ${{ runner.temp }}/v9/failures/*/attempt-*/process.json
          if-no-files-found: warn
          retention-days: 30

  reve:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '27 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.reve_stream == true && inputs.collection_run == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9695cb6a10f5ade872716a04439d3f4e643e9c28
          persist-credentials: false
      - name: Advance only verified REVE pages
        env:
          GH_TOKEN: ${{ github.token }}
          REVE_API_KEY: ${{ secrets.MAPA_REVE_API_KEY }}
        run: python3 scripts/scheduled_v9_reve.py "$RUNNER_TEMP/spain-reve"
      - name: Preserve verified generation for resumption
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-REVE-generation
          path: ${{ runner.temp }}/spain-reve/retained
          if-no-files-found: error
          retention-days: 30
      - name: Read completion from the verified generation
        id: state
        if: success()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'spain-reve/retained/receipt.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('complete=' + str(receipt['state'] == 'complete').lower(), file=output)
          PYTHON
      - name: Retain complete collection only
        if: success() && steps.state.outputs.complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-v9-collection-ES_reve_stream
          path: |
            ${{ runner.temp }}/spain-reve/work/manifest.json
            ${{ runner.temp }}/spain-reve/work/objects
          if-no-files-found: error
          retention-days: 30
