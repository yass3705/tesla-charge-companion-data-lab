name: Allego France station direct tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"
  push:
    paths:
      - "scripts/allego_dxp_national.py"
      - ".github/workflows/allego-station-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: allego-france-station-tariffs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Allego DXP browser dependency
        run: python -m pip install --disable-pip-version-check -q selenium

      - name: Build exact Allego France EVSE tariffs from DXP
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/allego_dxp_national.py
          python scripts/allego_dxp_national.py

      - name: Validate output and fail closed
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          data = json.loads(gzip.decompress(Path('data/national/allego_direct_stations_france.json.gz').read_bytes()))
          report = json.loads(Path('data/reports/allego_station_tariffs_report.json').read_text())
          assert data['operator'] == 'Allego'
          assert data['country'] == 'FR'
          assert data['scope']['operatorDirectOnly'] is True
          assert data['scope']['roamingIncluded'] is False
          assert data['scope']['countryDefaultsAreRankable'] is False
          assert data['counts']['franceEvseCount'] >= 500
          assert data['counts']['franceStationCount'] >= 50
          assert data['counts']['rankableEvseCount'] > 0
          assert data['counts']['rankableEvseCount'] + data['counts']['blockedEvseCount'] == data['counts']['franceEvseCount']
          assert data['counts']['coveragePct'] >= 50.0, data['counts']
          assert report['publicationReadyEvseCount'] == data['counts']['rankableEvseCount']
          print(json.dumps(data['counts'], indent=2))
          PY

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: allego-france-station-tariffs
          path: |
            data/national/allego_direct_stations_france.json.gz
            data/reports/allego_station_tariffs_report.json
          retention-days: 14

      - name: Commit refreshed Allego dataset
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/allego_direct_stations_france.json.gz data/reports/allego_station_tariffs_report.json
          if git diff --cached --quiet; then
            echo "No Allego station tariff changes"
            exit 0
          fi
          git commit -m "Refresh Allego France station direct tariffs"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
