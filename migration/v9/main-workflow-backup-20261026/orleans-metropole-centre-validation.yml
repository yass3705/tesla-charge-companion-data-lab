name: Centre Orleans Metropole validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/orleans_metropole_official.py"
      - ".github/workflows/orleans-metropole-centre-validation.yml"

permissions:
  contents: write

concurrency:
  group: centre-orleans-metropole-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/orleans
          python -m py_compile scripts/orleans_metropole_official.py
          python scripts/orleans_metropole_official.py --out out/orleans 2> >(tee out/orleans/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/orleans/orleans_metropole_official_centre.json').read_text())
          assert p['dataset']=='orleans-metropole-official-centre'
          assert p['directTariff']['energyEurPerKwhTtc']==0.50
          assert p['directTariff']['longStayFeeEurTtc']==25.0
          assert p['directTariff']['priorThresholdMinutes']==120
          assert p['classification']['currentPageRestatesThreshold'] is False
          assert p['tccDecision']['fullSessionRankable'] is False
          assert p['sourceEvidence']['officialOnly'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/orleans_metropole
          cp out/orleans/orleans_metropole_official_centre.json data/operator_direct/orleans_metropole_official_centre.json
          cp out/orleans/SUMMARY.md reports/orleans_metropole/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/orleans_metropole_official_centre.json reports/orleans_metropole/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(orleans): publish official Centre tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/orleans_metropole
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/orleans/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/orleans_metropole/latest_diagnostic.json').write_text(json.dumps({'dataset':'orleans-metropole-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/orleans_metropole
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/orleans_metropole/latest_run_status.json').write_text(json.dumps({'dataset':'orleans-metropole-run-status','operator':'Orléans Métropole','region':'Centre-Val de Loire','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/orleans_metropole/latest_run_status.json reports/orleans_metropole/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(orleans): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
