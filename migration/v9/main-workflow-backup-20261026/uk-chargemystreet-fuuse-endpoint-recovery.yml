name: UK Charge My Street Fuuse endpoint recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargemystreet-fuuse-endpoint-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover Fuuse open-data endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          seeds=[
            "https://chargemystreet.co.uk/",
            "https://chargemystreet.co.uk/map",
            "https://chargemystreet.co.uk/charge"
          ]
          seen=set(); pages=[]; candidates=[]; uuids=set()
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(5_000_000).decode("utf-8","replace"),r.geturl(),r.status
          for seed in seeds:
              try:
                  body,final,st=get(seed)
                  pages.append({"url":seed,"status":st,"finalUrl":final,"bytes":len(body)})
                  assets=[urllib.parse.urljoin(final,s.replace("&amp;","&")) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',body,re.I)]
                  blobs=[("html",body)]
                  for a in assets[:40]:
                      if a in seen: continue
                      seen.add(a)
                      try:
                          ab,af,ast=get(a); blobs.append((a,ab))
                      except Exception: pass
                  for source,txt in blobs:
                      for m in re.finditer(r'(?i)(api\.fuuse\.io|opendata|fuuseSiteID|fuuse)',txt):
                          ctx=txt[max(0,m.start()-500):min(len(txt),m.end()+900)]
                          if "api.fuuse.io" in ctx.lower() or "opendata" in ctx.lower():
                              candidates.append({"source":source,"context":ctx})
                      for u in re.findall(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',txt):
                          uuids.add(u.lower())
              except Exception as e:
                  pages.append({"url":seed,"error":f"{type(e).__name__}: {e}"})
          probes=[]
          for uid in sorted(uuids):
              for kind in ("location","tariff"):
                  url=f"https://api.fuuse.io/opendata/{uid}/{kind}"
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=40) as r:
                          raw=r.read(2000000); st=r.status; ct=r.headers.get("Content-Type")
                      parsed=json.loads(raw.decode("utf-8","replace"))
                      data=parsed.get("data") if isinstance(parsed,dict) else parsed
                      probes.append({"uuid":uid,"kind":kind,"status":st,"contentType":ct,"count":len(data) if isinstance(data,list) else None})
                  except Exception as e:
                      probes.append({"uuid":uid,"kind":kind,"error":f"{type(e).__name__}: {e}"})
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"pages":pages,
               "uuidCandidates":sorted(uuids),"contexts":candidates[:100],"probes":probes}
          Path("reports/uk/chargemystreet-fuuse-endpoint-recovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/chargemystreet-fuuse-endpoint-recovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): recover Charge My Street Fuuse endpoint [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
