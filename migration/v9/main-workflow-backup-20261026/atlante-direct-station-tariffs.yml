name: Atlante direct station tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/atlante_station_tariffs.py"
      - "tests/test_atlante_station_tariffs.py"
      - ".github/workflows/atlante-direct-station-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: atlante-direct-station-tariffs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ATLANTE_API_SUBSCRIPTION_KEY: ${{ secrets.ATLANTE_API_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test strict Atlante extraction
        run: python -m unittest tests/test_atlante_station_tariffs.py -v

      - name: Check refresh credential
        id: credential
        shell: bash
        run: |
          if [[ -n "${ATLANTE_API_SUBSCRIPTION_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Atlante refresh skipped: ATLANTE_API_SUBSCRIPTION_KEY is not configured."
          fi

      - name: Build current France direct map
        if: steps.credential.outputs.enabled == 'true'
        run: python scripts/atlante_station_tariffs.py

      - name: Validate generated map
        if: steps.credential.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          with gzip.open(Path('data/national/atlante_direct_stations_france.json.gz'),'rt',encoding='utf-8') as handle:
              p=json.load(handle)
          assert p['operator']=='Atlante'
          assert p['scope']['requiredCpo']=='FRATL'
          assert p['scope']['requiredCountryCode']=='FR'
          assert p['scope']['requiredPartyId']=='ATL'
          assert p['scope']['onlyOperatedLocations'] is True
          assert p['scope']['partnerLocationsIncluded'] is False
          assert p['scope']['atlanteGoIncluded'] is False
          assert p['counts']['franceLocationCount'] >= 100
          assert p['counts']['franceConnectorCount'] >= p['counts']['franceLocationCount']
          assert all(x['countryCode']=='FR' and x['partyId']=='ATL' and x['operatorName']=='Atlante' for x in p['locations'])
          assert all(c['pricePerKwhEur'] > 0 for x in p['locations'] for c in x['connectors'])
          print(p['counts'])
          PY

      - name: Publish updated map
        if: steps.credential.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/atlante_direct_stations_france.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(atlante): publish direct France station tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
