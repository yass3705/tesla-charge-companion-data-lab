name: Morocco FastVolt official public evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/morocco-fastvolt-official-public-evidence.yml'
      - 'reports/morocco/fastvolt/official-public-status-tariff-semantics-2026-09-02.json'

permissions:
  contents: read

jobs:
  verify-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch two allowlisted FastVolt public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fastvolt-public"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --proto '=https' \
            'https://www.fastvolt.net/FAQ' \
            -o "$RUNNER_TEMP/fastvolt-public/faq.html"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --proto '=https' \
            'https://www.fastvolt.net/HowIts' \
            -o "$RUNNER_TEMP/fastvolt-public/howits.html"

      - name: Validate and emit sanitized evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import re
          import unicodedata
          from html.parser import HTMLParser
          from pathlib import Path

          class TextOnly(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)

          def visible_text(path):
              parser = TextOnly()
              parser.feed(Path(path).read_text(encoding='utf-8', errors='replace'))
              text = html.unescape(' '.join(parser.parts))
              return re.sub(r'\s+', ' ', text).strip()

          def normalized(text):
              text = unicodedata.normalize('NFKD', text)
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              text = text.replace('\u2011', '-').replace('\u2013', '-').replace('\u2014', '-')
              return re.sub(r'\s+', ' ', text).lower().strip()

          root = Path(os.environ['RUNNER_TEMP']) / 'fastvolt-public'
          faq = normalized(visible_text(root / 'faq.html'))
          pricing = normalized(visible_text(root / 'howits.html'))

          required_faq_patterns = {
              'real_time_state': r'etat\s+en\s+temps\s+reel',
              'available': r'\bdisponible\b',
              'occupied': r'\boccupee\b',
              'out_of_service': r'\bhors[- ]service\b',
          }
          required_pricing_patterns = {
              'dc_class': r'recharge\s+rapide\s*\(dc\)',
              'dc_price': r'2\s*[,.]\s*50?\s*dhs\s*/\s*min',
              'ac_class': r'recharge\s+semi[- ]rapide\s*\(ac\)',
              'ac_price': r'0\s*[,.]\s*5\s*dhs\s*/\s*min',
          }
          missing = [
              name for name, pattern in required_faq_patterns.items()
              if not re.search(pattern, faq)
          ]
          missing += [
              name for name, pattern in required_pricing_patterns.items()
              if not re.search(pattern, pricing)
          ]
          if missing:
              raise SystemExit('Expected public evidence missing: ' + ', '.join(missing))

          out = {
              'schema_version': 1,
              'source_urls': [
                  'https://www.fastvolt.net/FAQ',
                  'https://www.fastvolt.net/HowIts',
              ],
              'network': 'FastVolt',
              'status_semantics': {
                  'disponible': 'Available',
                  'occupée': 'Occupied',
                  'hors-service': 'diagnostic_out_of_service',
              },
              'general_public_pricing_evidence': [
                  {'charging_class': 'DC_rapid', 'mad_per_minute': 2.5},
                  {'charging_class': 'AC_semi_rapid', 'mad_per_minute': 0.5},
              ],
              'modeling': {
                  'cpo_operator': 'FastVolt / Afrimobility',
                  'site_brand': 'station_specific',
                  'app_source_access_network': 'FastVolt official mobile app / official public website',
                  'tariff_channel': 'FastVolt official public website',
                  'status_source': 'unresolved_native_backend',
              },
              'production_promotion': False,
              'notes': [
                  'FAQ evidence proves native capability/vocabulary, not a live status endpoint.',
                  'Public prices are not promoted station-by-station until applicability is established.',
                  'EVOne production eligibility remains limited to Available, Occupied or Charging.',
              ],
          }
          (root / 'sanitized-evidence.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload sanitized diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: morocco-fastvolt-official-public-evidence
          path: ${{ runner.temp }}/fastvolt-public/sanitized-evidence.json
          if-no-files-found: error
          retention-days: 7
