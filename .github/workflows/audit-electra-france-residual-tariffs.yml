name: Audit Electra FR residual tariff scenarios
on:
  push:
    branches:
      - main
    paths:
      - "scripts/france/audit_electra_pricing_residuals.mjs"
      - "data/platforms/electra/france/manifest.json"
      - ".github/workflows/audit-electra-france-residual-tariffs.yml"
  workflow_dispatch:
  # Commits pushed with GITHUB_TOKEN do not trigger other push workflows.
  # Run this audit after the Electra rebuild has completed and persisted.
  workflow_run:
    workflows: ["Build France Electra platform overlay"]
    types: [completed]
permissions:
  contents: write
jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    concurrency:
      group: electra-france-pricing-audit-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify root causes for every Electra residual
        run: node --max-old-space-size=6144 scripts/france/audit_electra_pricing_residuals.mjs
      - name: Save complete case list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/irve/electra-pricing-residual-audit-2026-10-08.json reports/france/irve/electra-pricing-residual-cases-2026-10-08.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'audit: classify Electra FR unsupported and heterogeneous tariff cases'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            echo "Failed to persist Electra residual audit" >&2
            exit 1
          fi
