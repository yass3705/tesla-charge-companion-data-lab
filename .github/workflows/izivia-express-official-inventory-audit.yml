name: IZIVIA Express official inventory audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-official-inventory-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit official data.gouv IZIVIA Express inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          URL='https://static.data.gouv.fr/resources/bornes-de-recharges-izivia-express/20260825-060254/datagouv-export-izivia-express-2026-08-25t06-02-53.csv'
          curl -fsSL --retry 3 "$URL" -o audit/izivia_express_official.csv
          python - <<'PY'
          import csv,json,collections
          from pathlib import Path

          p=Path('audit/izivia_express_official.csv')
          raw=p.read_text(encoding='utf-8-sig',errors='replace')
          sample=raw[:5000]
          dialect=csv.Sniffer().sniff(sample,delimiters=',;\t')
          rows=list(csv.DictReader(raw.splitlines(),dialect=dialect))
          fields=list(rows[0].keys()) if rows else []
          print('ROWS',len(rows))
          print('FIELDS',json.dumps(fields,ensure_ascii=False))

          interesting=['nom_operateur','contact_operateur','nom_amenageur','nom_enseigne','id_station_itinerance','id_pdc_itinerance','nom_station','adresse_station','code_insee_commune','puissance_nominale','tarification','observations']
          for key in interesting:
              if key not in fields: continue
              c=collections.Counter((r.get(key) or '').strip() for r in rows)
              print('\n===',key,'unique',len(c),'===')
              for v,n in c.most_common(30): print(n,repr(v))

          # Station-level dedupe and operator integrity
          station_key='id_station_itinerance' if 'id_station_itinerance' in fields else None
          stations={}
          if station_key:
              for r in rows:
                  sid=(r.get(station_key) or '').strip()
                  if sid: stations.setdefault(sid,r)
          print('\nSTATIONS',len(stations))
          print('\nSAMPLE STATIONS')
          for sid,r in list(stations.items())[:40]:
              print(json.dumps({k:r.get(k) for k in ['id_station_itinerance','nom_station','nom_operateur','nom_amenageur','nom_enseigne','adresse_station','puissance_nominale','tarification'] if k in fields},ensure_ascii=False))

          summary={
              'rows':len(rows),
              'stations':len(stations),
              'fields':fields,
              'operators':dict(collections.Counter((r.get('nom_operateur') or '').strip() for r in rows)) if 'nom_operateur' in fields else {},
              'signs':dict(collections.Counter((r.get('nom_enseigne') or '').strip() for r in rows)) if 'nom_enseigne' in fields else {},
          }
          Path('audit/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: izivia-express-official-inventory-audit
          path: audit
          retention-days: 3
