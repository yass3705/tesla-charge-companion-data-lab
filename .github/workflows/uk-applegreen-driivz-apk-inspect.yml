name: UK Applegreen Driivz APK inspect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-applegreen-driivz-apk-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download and inspect Applegreen Driivz app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/applegreen
          curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/com.driivz.applegreen?version=latest"             -o /tmp/applegreen/app.xapk
          unzip -q /tmp/applegreen/app.xapk -d /tmp/applegreen/x
          mkdir -p /tmp/applegreen/apks
          for apk in /tmp/applegreen/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/applegreen/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"; unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os
          from pathlib import Path
          from datetime import datetime,timezone
          needles=["driivz","applegreen","api","location","station","charger","evse","tariff","price","guest","anonymous","baseurl","base_url","ocpi"]
          urls=set(); hosts=set(); hits=[]
          for fn in glob.glob("/tmp/applegreen/apks/**/*",recursive=True):
            if not os.path.isfile(fn): continue
            try:
              if os.path.getsize(fn)>60_000_000: continue
              b=open(fn,"rb").read()
            except Exception: continue
            for raw in re.findall(rb'[ -~]{18,1400}',b):
              try:s=raw.decode("utf-8","ignore")
              except:continue
              sl=s.lower()
              matched=[n for n in needles if n in sl]
              if matched and ("http" in sl or "/api" in sl or "/v1/" in sl or "location" in sl or "baseurl" in sl):
                hits.append({"file":fn.replace("/tmp/applegreen/apks/",""),"matched":matched,"text":s})
              for u in re.findall(r'https?://[^\s"\'<>]{5,500}',s):
                if any(k in u.lower() for k in needles): urls.add(u)
            for h in re.findall(rb'(?i)([a-z0-9][a-z0-9.-]+\.(?:com|co\.uk|uk|io|app|net|eu|cloud|ie))',b):
              try:
                hs=h.decode().lower()
                if any(k in hs for k in ("applegreen","driivz","api","charge","ocpi","firebase")): hosts.add(hs)
              except:pass
          def score(x): return sum(7 if n in ("driivz","applegreen","baseurl","base_url") else 3 for n in x["matched"])
          hits=sorted(hits,key=score,reverse=True)
          seen=set(); sel=[]
          for x in hits:
            k=x["text"][:350]
            if k in seen:continue
            seen.add(k);sel.append(x)
            if len(sel)>=600:break
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"package":"com.driivz.applegreen",
               "urls":sorted(urls)[:800],"hosts":sorted(hosts)[:500],"hits":sel}
          Path("reports/uk/applegreen-driivz-apk-inspect-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"urls":out["urls"],"hosts":out["hosts"],"hits":sel[:220]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          [ -f reports/uk/applegreen-driivz-apk-inspect-latest.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/applegreen-driivz-apk-inspect-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): inspect Applegreen Driivz app [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
