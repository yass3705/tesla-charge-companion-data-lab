name: Morocco FastVolt AOT websocket shape

on:
  push:
    paths:
      - '.github/workflows/morocco-fastvolt-aot-websocket-shape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download DAE and current FastVolt XAPK temporarily
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2             https://github.com/ejfkdev/dae/releases/download/v0.1.3/dae-Linux-x64             -o /tmp/dae
          chmod +x /tmp/dae
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 \
            --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0' \
            'https://download.pureapk.com/b/XAPK/bWEuZmFzdGdvXzYzX2JlZjg5YmI?as2=396c32049d304796d2893422fb0bc6a16c926938&k=08186075138529da17448b9e453991876c926938&_p=bWEuZmFzdGdv&c=1%7CAUTO_AND_VEHICLES%7Cb2lkPTkmZGV2PUFmcmklMjBNb2JpbGl0eSZ0PXhhcGsmcz0zOTQ1MTY2MCZ2bj0yLjguOSZ2Yz02Mw&_fn=RmFzdHZvbHRfMi44LjlfYXBrY29tYm8uY29tLnhhcGs%3D' \
            -o /tmp/fastvolt.xapk
          echo 'af476c969bf7982b1561cd0769a26f322b90257b347aa858f2c438d4e73fcf97  /tmp/fastvolt.xapk' | sha256sum -c -
          mkdir -p /tmp/fv-xapk /tmp/fv-apk
          unzip -q /tmp/fastvolt.xapk -d /tmp/fv-xapk
          python - <<'PY'
          import json
          m=json.load(open('/tmp/fv-xapk/manifest.json'))
          assert m.get('package_name')=='ma.fastgo'
          assert m.get('version_name')=='2.8.9'
          assert str(m.get('version_code'))=='63'
          print('Verified FastVolt',m['version_name'],'versionCode',m['version_code'])
          PY
          ARM_APK="$(find /tmp/fv-xapk -type f -name '*.apk' | while read -r f; do
            if unzip -l "$f" 2>/dev/null | grep -q 'lib/arm64-v8a/libapp.so'; then echo "$f"; break; fi
          done)"
          test -n "$ARM_APK"
          unzip -q "$ARM_APK" 'lib/arm64-v8a/libapp.so' -d /tmp/fv-apk
          test -s /tmp/fv-apk/lib/arm64-v8a/libapp.so

      - name: Full temporary AOT decompile and locate websocket literal callers
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/fv-apk/lib/arm64-v8a/libapp.so
          rm -rf /tmp/dae-out
          mkdir -p /tmp/dae-out
          /tmp/dae "$BIN" /tmp/dae-out --decompile >/tmp/dae-full.out 2>/tmp/dae-full.err

      - name: Produce sanitized websocket call-shape report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, glob
          from datetime import datetime, timezone

          root='/tmp/dae-out'
          out='reports/morocco/fastvolt/latest-native-aot-websocket-shape.json'
          os.makedirs(os.path.dirname(out),exist_ok=True)

          targets=[
              'wss://mobile.ev.fastvolt.ma/',
              'User ID is empty, skipping WebSocket connect.',
              'WebSocket connected successfully',
              'WebSocket closed. Marking as disconnected, then attempting reconnect.'
          ]

          hits=[]
          files=glob.glob(root+'/**/*.dart',recursive=True)+glob.glob(root+'/**/*.txt',recursive=True)
          for p in files:
              try:
                  text=open(p,'r',encoding='utf-8',errors='ignore').read()
              except Exception:
                  continue
              for t in targets:
                  start=0
                  while True:
                      i=text.find(t,start)
                      if i<0: break
                      lo=max(0,i-5000); hi=min(len(text),i+5000)
                      chunk=text[lo:hi]
                      hits.append((p,t,chunk,i-lo))
                      start=i+len(t)

          keywords=(
              'wss://','WebSocket','userId','user_id','userid','ff_userid','Uri.',
              'queryParameters','sink.add','jsonEncode','json.encode','connect(',
              'IOWebSocketChannel','Authorization','Bearer'
          )

          def redact_line(line):
              # Keep infrastructure URLs and identifiers, redact opaque long literals.
              line=re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_+\-/=]{40,}(?![A-Za-z0-9])','<redacted-long-token>',line)
              # Keep FastVolt URLs, replace unrelated URLs.
              line=re.sub(r'https?://(?![A-Za-z0-9.-]*fastvolt(?:\.ma|\.net))\S+','<url>',line)
              if len(line)>320: line=line[:320]+'…'
              return line

          contexts=[]
          seen=set()
          for p,target,chunk,offset in hits:
              rel=os.path.relpath(p,root)
              lines=chunk.splitlines()
              selected=[]
              for line in lines:
                  if any(k.lower() in line.lower() for k in keywords):
                      selected.append(redact_line(line.strip()))
              selected=selected[:60]
              key=(rel,target,tuple(selected))
              if key in seen: continue
              seen.add(key)
              contexts.append({
                  'file':rel,
                  'matched_literal':target,
                  'selected_structural_lines':selected
              })

          allsel='\n'.join(line for c in contexts for line in c['selected_structural_lines'])
          urls=sorted(set(re.findall(r'(?:https?|wss)://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[A-Za-z0-9_./{}:=?&%-]*)?',allsel)))
          safe_urls=[u for u in urls if 'fastvolt' in u.lower()][:30]

          indicators={}
          for term in [
              'queryParameters','queryParametersAll','Uri.parse','Uri.https','Uri.replace',
              'sink.add','jsonEncode','json.encode','userId','user_id','userid','ff_userid',
              'Authorization','Bearer','IOWebSocketChannel','WebSocketChannel.connect'
          ]:
              indicators[term]=term.lower() in allsel.lower()

          # Detect simple URL construction hints without preserving arbitrary literals.
          concat_userid=bool(re.search(r'(wss://mobile\.ev\.fastvolt\.ma/|Uri\.)[^\n]{0,500}(userId|user_id|userid|ff_userid)',allsel,re.I) or
                             re.search(r'(userId|user_id|userid|ff_userid)[^\n]{0,500}(wss://mobile\.ev\.fastvolt\.ma/|Uri\.)',allsel,re.I))
          send_userid=bool(re.search(r'(sink\.add|jsonEncode|json\.encode)[^\n]{0,500}(userId|user_id|userid|ff_userid)',allsel,re.I) or
                           re.search(r'(userId|user_id|userid|ff_userid)[^\n]{0,500}(sink\.add|jsonEncode|json\.encode)',allsel,re.I))

          report={
              'schema_version':3,
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'country':'MA','network':'FastVolt',
              'target':{'package':'ma.fastgo','client_version_context':'2.8.9 versionCode 63; exact SHA256 match'},
              'tool':{'name':'dae','version':'v0.1.3','mode':'full-temporary-decompile'},
              'policy':{
                  'static_analysis_only':True,'raw_apk_persisted':False,'raw_libapp_persisted':False,
                  'raw_decompiled_tree_persisted':False,'credentials_persisted':False,
                  'api_keys_persisted':False,'tokens_persisted':False
              },
              'summary':{
                  'dart_or_text_files_scanned':len(files),
                  'target_literal_hit_count':len(hits),
                  'sanitized_context_count':len(contexts),
                  'fastvolt_urls':safe_urls
              },
              'contexts':contexts[:20],
              'structural_indicators':indicators,
              'interpretation':{
                  'target_websocket_logic_located':len(contexts)>0,
                  'user_id_near_socket_uri':concat_userid,
                  'user_id_near_application_send':send_userid,
                  'query_parameter_evidence':indicators['queryParameters'] or indicators['queryParametersAll'] or indicators['Uri.replace'],
                  'application_send_evidence':indicators['sink.add'] or indicators['jsonEncode'] or indicators['json.encode']
              }
          }
          with open(out,'w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(report['interpretation'],indent=2))
          PY

      - name: Publish sanitized report safely alongside concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/morocco/fastvolt/latest-native-aot-websocket-shape.json
          if git diff --cached --quiet; then
            echo 'No report change'
            exit 0
          fi
          git commit -m "diag(morocco): locate FastVolt websocket AOT call shape [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push origin main

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/dae /tmp/fastvolt.xapk /tmp/fv-xapk /tmp/fv-apk /tmp/dae-out /tmp/dae-full.out /tmp/dae-full.err
