name: Qwello Saône-et-Loire official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "19 9 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/qwello-saone-et-loire-official-tariffs.yml"
      - "scripts/qwello_saone_et_loire_official.py"
      - "scripts/public_safety_check.py"

permissions:
  contents: write

concurrency:
  group: qwello-saone-et-loire-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Extract and validate official Qwello evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/qwello_saone_et_loire
          python -m py_compile scripts/qwello_saone_et_loire_official.py
          python scripts/qwello_saone_et_loire_official.py 2> >(tee out/qwello_saone_et_loire/error.log >&2)
          cat out/qwello_saone_et_loire/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qwello_saone_et_loire
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/qwello_saone_et_loire/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/qwello_saone_et_loire/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'qwello-saone-et-loire-individual-diagnostic',
              'operator':'Qwello',
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-80:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/qwello_saone_et_loire/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(qwello): publish operator diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate output envelope
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/qwello_saone_et_loire/qwello_saone_et_loire_official.json').read_text())
          assert p['dataset'] == 'qwello-saone-et-loire-official-france'
          assert p['operator'] == 'Qwello'
          assert p['country'] == 'FR'
          assert p['publicationStatus'] == 'candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          c=p['classification']
          assert c['chargePointOperator'] == 'Qwello'
          assert c['sydeslIsCurrentCpo'] is False
          assert c['qwelloOwnsNewAndInheritedSydeslStations'] is True
          assert c['publishedInitialTariffMachineVerified'] is True
          assert c['networkWideCurrentUniformTariffAsserted'] is False
          t=p['operatorDirect']['saoneEtLoire22KwInitialPublishedTariff']
          assert t['powerKw'] == 22
          assert t['eurPerKwh'] == 0.30
          assert t['eurPerMinute'] == 0.02
          assert t['vatIncluded'] is True
          assert p['access']['registrationRequired'] is False
          assert p['access']['contactlessPayment'] is True
          assert p['roaming']['mustRemainSeparateFromQwelloDirectTariff'] is True
          assert p['operatorDirect']['officialQwelloSiteExample']['mustNotBeGeneralizedToAllStations'] is True
          print('Validated Qwello Saône-et-Loire output envelope')
          PY

      - name: Publish validated rule set only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/qwello_saone_et_loire/qwello_saone_et_loire_official.json')
          dst=Path('data/operator_direct/qwello_saone_et_loire_official.json')
          rep=Path('reports/qwello_saone_et_loire/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/qwello_saone_et_loire/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Qwello rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/qwello_saone_et_loire_official.json reports/qwello_saone_et_loire/latest_summary.md
          git commit -m "data(qwello): publish official Saone-et-Loire rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
