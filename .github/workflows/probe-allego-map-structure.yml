name: France Allego map structure probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-allego-map-structure.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract map markup and JS callsites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/allego reports/france/allego
          curl -fLsS -A 'Mozilla/5.0' https://www.allego.eu/fr/trouvez-nous/ -o /tmp/allego/page.html
          curl -fLsS -A 'Mozilla/5.0' 'https://www.allego.eu/fr/wp-content/themes/allego/assets/js/main.js' -o /tmp/allego/main.js
          python - <<'PY'
          import re,json,pathlib
          html=pathlib.Path('/tmp/allego/page.html').read_text(errors='ignore');js=pathlib.Path('/tmp/allego/main.js').read_text(errors='ignore')
          out={'iframes':re.findall(r'<iframe[^>]+>',html,re.I),'dataAttrs':[],'htmlContexts':[],'jsContexts':[]}
          for m in re.finditer(r'data-[a-z0-9_-]+=["\'][^"\']*["\']',html,re.I):
              x=m.group(0)
              if any(k in x.lower() for k in ('map','station','charger','lat','lng','price','api')):out['dataAttrs'].append(x)
          for needle in ('map-container','map-overlay','charger','price-value','single-station','mapbox'):
              for m in re.finditer(re.escape(needle),html,re.I):
                  s=html[max(0,m.start()-1200):min(len(html),m.end()+2500)]
                  if s not in out['htmlContexts']:out['htmlContexts'].append(s)
          for needle in ('ajax','fetch(','map','station','charger','price'):
              for m in re.finditer(re.escape(needle),js,re.I):
                  s=js[max(0,m.start()-800):min(len(js),m.end()+1600)]
                  if s not in out['jsContexts']:out['jsContexts'].append(s)
          out={k:(v[:80] if isinstance(v,list) else v) for k,v in out.items()}
          pathlib.Path('reports/france/allego/map-structure.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:70000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/allego/map-structure.json
          git commit -m 'France Allego: publish map structure probe' || exit 0
          git pull --rebase origin main
          git push
