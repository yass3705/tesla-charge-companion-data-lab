name: UK Lidl official store inventory

on:
  push:
    paths:
      - "scripts/lidl_uk_public_store_inventory.py"
      - ".github/workflows/uk-lidl-public-store-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-lidl-public-store-inventory
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect official Lidl GB store-level EV inventory
        run: python scripts/lidl_uk_public_store_inventory.py

      - name: Publish validated store inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/national/uk_lidl_public_ev_stores.json.gz             reports/uk/lidl-public-ev-stores-latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data(uk): refresh Lidl official store EV inventory"
          git pull --rebase origin main
          git push origin HEAD:main
