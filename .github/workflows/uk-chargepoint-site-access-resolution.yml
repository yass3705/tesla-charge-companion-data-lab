name: UK ChargePoint complete evidence-first site-access resolution
on:
  push:
    branches: [main]
    paths:
      - scripts/uk_chargepoint_resolve_site_access_20261011.py
      - reports/uk/chargepoint-curated-access-proofs-2026-10-11.json
      - .github/workflows/uk-chargepoint-site-access-resolution.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uk-chargepoint-access-resolution
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve 323 UK ChargePoint stations with curated independent public-access sources
        run: python3 scripts/uk_chargepoint_resolve_site_access_20261011.py
      - name: Persist classified exact-station matrix without overwriting other updates
        shell: bash
        run: |
          set -euo pipefail
          cp reports/uk/chargepoint-site-access-resolution-latest.json /tmp/chargepoint-site-summary.json
          cp reports/uk/chargepoint-site-access-resolution-latest.csv /tmp/chargepoint-site-matrix.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/chargepoint-site-summary.json reports/uk/chargepoint-site-access-resolution-latest.json
            cp /tmp/chargepoint-site-matrix.csv reports/uk/chargepoint-site-access-resolution-latest.csv
            git add reports/uk/chargepoint-site-access-resolution-latest.json reports/uk/chargepoint-site-access-resolution-latest.csv
            if git diff --cached --quiet; then
              echo CHARGEPOINT_ACCESS_REPORT_CURRENT
              exit 0
            fi
            git commit -m "reports(uk): ChargePoint full site-access audit [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo CHARGEPOINT_ACCESS_REPORT_PUBLISHED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Commit conflict" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chargepoint-uk-full-site-access-${{ github.run_id }}
          path: |
            reports/uk/chargepoint-site-access-resolution-latest.json
            reports/uk/chargepoint-site-access-resolution-latest.csv
          retention-days: 90
