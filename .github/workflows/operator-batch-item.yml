name: Operator batch item
run-name: Operator batch item · ${{ inputs.operator }}

on:
  workflow_dispatch:
    inputs:
      operator:
        description: Operator manifest key
        required: true
        type: choice
        options:
          - ouestcharge
          - mobive
          - alize_toulouse

permissions:
  contents: write

concurrency:
  group: operator-batch-item
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve operator
        id: choose
        shell: bash
        run: |
          set -euo pipefail
          key="${{ inputs.operator }}"
          test -n "$key"
          test -f "config/operator_manifests/$key.json"
          echo "operator=$key" >> "$GITHUB_OUTPUT"
          echo "Resolved operator: $key"

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Resolve manifest metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          key = "${{ steps.choose.outputs.operator }}"
          m = json.loads((Path('config/operator_manifests') / f'{key}.json').read_text())
          print(f"output_file={m['outputFile']}")
          print(f"dataset={m['dataset']}")
          PY

      - name: Extract and validate official evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          key="${{ steps.choose.outputs.operator }}"
          mkdir -p "out/$key"
          python -m py_compile scripts/operator_manifest_runner.py
          python scripts/operator_manifest_runner.py --operator "$key" --out "out/$key" 2> >(tee "out/$key/error.log" >&2)
          cat "out/$key/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          key="${{ steps.choose.outputs.operator }}"
          mkdir -p "reports/$key"
          python - <<'PY'
          import json,re
          from pathlib import Path
          key = "${{ steps.choose.outputs.operator }}"
          p=Path('out')/key/'error.log'
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          out=Path('reports')/key/'latest_diagnostic.json'
          out.write_text(json.dumps({
              'dataset':f'{key}-batch-diagnostic',
              'operator':key,
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-60:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/$key/latest_diagnostic.json"
          if ! git diff --cached --quiet; then
            git commit -m "diag(batch:$key): publish operator diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate output envelope
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          key='${{ steps.choose.outputs.operator }}'
          m=json.loads((Path('config/operator_manifests')/f'{key}.json').read_text())
          p=json.loads((Path('out')/key/m['outputFile']).read_text())
          assert p['dataset'] == m['dataset']
          assert p['operator'] == m['operator']
          assert p['country'] == m.get('country','FR')
          assert p['publicationStatus'] == 'candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          assert len(p['sourceEvidence']['relevantTariffFingerprintSha256']) == 64
          assert p['sourceEvidence']['sources']
          print(f"Validated batch envelope for {key}")
          PY

      - name: Publish validated marker only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          key="${{ steps.choose.outputs.operator }}"
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          key='${{ steps.choose.outputs.operator }}'
          m=json.loads((Path('config/operator_manifests')/f'{key}.json').read_text())
          src=Path('out')/key/m['outputFile']
          dst=Path('data/operator_direct')/m['outputFile']
          rep=Path('reports')/key/'latest_summary.md'
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out')/key/'SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated operator rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          key="${{ steps.choose.outputs.operator }}"
          output="${{ steps.meta.outputs.output_file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/operator_direct/$output" "reports/$key/latest_summary.md"
          git commit -m "data(batch:$key): publish official tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
