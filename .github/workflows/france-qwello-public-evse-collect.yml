name: France Qwello public EVSE tariff audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/france-qwello-public-evse-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: france-qwello-public-evse-tariff-audit
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect France Qwello tariff view and exact EVSE tariffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/france/qwello
          python - <<'PY'
          import json,gzip,re,time,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Qwello/3.9.5 TeslaChargeCompanion/9 FranceAudit"

          def get_text(url,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json,text/plain,*/*"})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return r.read(40_000_000).decode("utf-8","replace"),r.status
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code not in (403,429,500,502,503,504): raise
                      delay=min(60,5*(attempt+1))
                      try:
                          if e.headers.get("Retry-After"): delay=float(e.headers["Retry-After"])
                      except Exception: pass
                      time.sleep(delay)
                  except Exception as e:
                      last=e; time.sleep(min(30,3*(attempt+1)))
              raise last

          urljs,_=get_text("https://tariff.qwello.eu/url.js")
          m=re.search(r'BASE_URL\s*[:=]\s*["\']([^"\']+)["\']',urljs) or re.search(r'["\']?BASE_URL["\']?\s*:\s*["\']([^"\']+)["\']',urljs)
          if not m: raise SystemExit("BASE_URL not found")
          base=m.group(1).rstrip("/")
          tariff_view_url=base+"/tariff-view.json"
          raw,_=get_text(tariff_view_url)
          rows=json.loads(raw)
          if not isinstance(rows,list): raise SystemExit("unexpected tariff-view payload")

          def ids_of(x):
              ids=x.get("id") or []
              if isinstance(ids,str): ids=[ids]
              return [str(i).strip() for i in ids if str(i).strip()]

          fr=[]
          for x in rows:
              if not isinstance(x,dict): continue
              ids=ids_of(x)
              country=str(x.get("country") or "").upper().strip()
              if country in ("FR","FRA","FRANCE") or any(i.upper().replace("*","").startswith("FRQWC") for i in ids):
                  fr.append(x)

          evse_ids=[]; seen=set(); station_by_evse={}
          for st in fr:
              for eid in ids_of(st):
                  norm=eid.upper().replace("*","")
                  if not norm.startswith("FRQWC"): continue
                  if eid in seen: continue
                  seen.add(eid); evse_ids.append(eid); station_by_evse[eid]=st

          if not evse_ids: raise SystemExit("no FR*QWC EVSE ids in public tariff view")

          records=[]; failures=[]; mismatches=[]
          priced=0; geo=0; connectors=0; currencies={}; statuses={}; tariff_shapes={}
          for idx,eid in enumerate(evse_ids,1):
              url="https://api.qwello.eu/springspinne/v1/pub/evses/"+urllib.parse.quote(eid,safe="")
              try:
                  txt,_=get_text(url)
                  p=json.loads(txt)
                  if not isinstance(p,dict): raise ValueError("non-dict response")
                  got=str(p.get("evseId") or "")
                  if got and got.upper().replace("*","") != eid.upper().replace("*",""):
                      mismatches.append({"requested":eid,"returned":got})
                  lat=p.get("latitude"); lon=p.get("longitude")
                  if isinstance(lat,(int,float)) and isinstance(lon,(int,float)) and lat and lon: geo+=1
                  cs=p.get("connectors") or []
                  if isinstance(cs,list): connectors+=len(cs)
                  status=str(p.get("status") or "UNKNOWN"); statuses[status]=statuses.get(status,0)+1
                  tariff=p.get("tariff")
                  if isinstance(tariff,dict) and tariff:
                      priced+=1
                      cur=str(tariff.get("currency") or "UNKNOWN"); currencies[cur]=currencies.get(cur,0)+1
                      shape="|".join(sorted(tariff.keys()))
                      tariff_shapes[shape]=tariff_shapes.get(shape,0)+1
                  records.append({"sourceTariffView":station_by_evse[eid],"publicEvse":p})
              except Exception as e:
                  failures.append({"evseId":eid,"error":f"{type(e).__name__}: {e}"})
              if idx%50==0: print(f"progress {idx}/{len(evse_ids)} recovered={len(records)} priced={priced} failures={len(failures)}")
              time.sleep(0.10)

          now=datetime.now(timezone.utc).isoformat()
          report={
            "schemaVersion":1,
            "country":"FR",
            "network":"Qwello",
            "partyId":"FR*QWC",
            "retrievedAt":now,
            "sources":{"tariffView":tariff_view_url,"evse":"https://api.qwello.eu/springspinne/v1/pub/evses/{evse_id}"},
            "globalTariffViewRows":len(rows),
            "frTariffViewStations":len(fr),
            "requestedFrQwcEvseIds":len(evse_ids),
            "recoveredEvseIds":len(records),
            "pricedEvseIds":priced,
            "unpricedRecoveredEvseIds":len(records)-priced,
            "failedEvseIds":len(failures),
            "failures":failures,
            "idMismatches":mismatches,
            "geocodedEvseIds":geo,
            "connectors":connectors,
            "currencies":currencies,
            "statuses":statuses,
            "tariffShapes":tariff_shapes,
            "coverageComplete":len(records)==len(evse_ids) and not failures and not mismatches and priced==len(evse_ids),
            "decision":"exact_evse_direct_tariffs_only_no_network_inheritance"
          }
          with gzip.open("data/operator_direct/qwello_fr_qwc_public_evses.json.gz","wt",encoding="utf-8") as g:
              json.dump({"retrievedAt":now,"network":"Qwello","partyId":"FR*QWC","records":records},g,ensure_ascii=False,separators=(",",":"))
          Path("reports/france/qwello/public-evse-tariff-audit-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if failures or mismatches: raise SystemExit(2)
          PY

      - name: Publish audit dataset
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f reports/france/qwello/public-evse-tariff-audit-latest.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/qwello_fr_qwc_public_evses.json.gz reports/france/qwello/public-evse-tariff-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(fr): audit Qwello FR*QWC exact EVSE tariffs [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
