name: IZIVIA Express V8 compatibility classification v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-compatibility-v2.yml"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout TCC V8 release
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: release/2026-08
          path: tcc
      - name: Classify runtime support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,collections
          from pathlib import Path
          bp=Path('izivia/izivia_express_station_tariffs_v1.json'); rp=Path('izivia/izivia_express_normalization_report_v1.json')
          base=json.loads(bp.read_text())
          idx=Path('tcc/index.html').read_text(errors='replace')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',idx,re.I)
          loaded_post=False
          for src in scripts:
            p=Path('tcc')/src.split('?')[0]
            if p.exists() and ('__tccPostChargeGraceV2' in p.read_text(errors='replace') or 'installPostChargePricing' in p.read_text(errors='replace')): loaded_post=True
          implementation_present=Path('tcc/assets/v8-operator-tariff-overlay.js').exists() and 'installPostChargePricing' in Path('tcc/assets/v8-operator-tariff-overlay.js').read_text(errors='replace')
          print('POSTCHARGE_IMPLEMENTATION_PRESENT',implementation_present)
          print('POSTCHARGE_IMPLEMENTATION_LOADED',loaded_post)

          def clean(raw): return ' '.join(re.sub(r'<br\s*/?>',' ',raw or '',flags=re.I).replace('\u00a0',' ').split())
          def parse(raw):
            s=clean(raw); l=s.lower().replace(',','.')
            missing=[]; latent=[]; features=[]
            cap=re.search(r'(?:facturation\s+max\s*:\s*|plafond(?:\s+de)?\s*)(\d+(?:\.\d+)?)\s*€',l)
            threshold=bool(re.search(r'(?:au[- ]delà\s+de|au dela\s+de|à\s+partir\s+de|a\s+partir\s+de)\s*20\s*kwh',l))
            has_post=('post-charge' in l or 'post charge' in l)
            started_kwh=bool(re.search(r'(?:kwh|énergie|energie)[^.!;]{0,40}entam',l) or re.search(r'entam[^.!;]{0,40}(?:kwh|énergie|energie)',l))
            started_min=bool(re.search(r'minute[s]?[^.!;]{0,30}entam',l) or re.search(r'durée[^.!;]{0,30}entam',l))
            if has_post: features.append('post_charge')
            if started_kwh: features.append('started_kwh')
            if started_min: features.append('started_minute')
            if cap: features.append('session_or_context_cap'); missing.append('session_cap_semantics_and_enforcement')
            if threshold: features.append('included_energy_threshold'); missing.append('included_energy_threshold_pricing')
            if has_post or started_kwh or started_min:
              latent.append('load_existing_postcharge_started_units_wrapper')
              if not loaded_post: missing.append('postcharge_started_units_runtime_loader')
            if cap: family='session_cap_50' if abs(float(cap.group(1))-50)<1e-9 else 'session_cap_other'
            elif threshold: family='night_connection_includes_20kwh'
            else: family='simple_postcharge'
            status='current_runtime_exact' if not missing else 'runtime_extension_required'
            status_if_wrapper='exact_if_existing_wrapper_loaded' if not [m for m in missing if m!='postcharge_started_units_runtime_loader'] else 'additional_engine_extension_required'
            return {'raw':s,'family':family,'features':sorted(set(features)),'currentRuntimeStatus':status,'statusIfExistingWrapperLoaded':status_if_wrapper,'missingRuntimeFeatures':sorted(set(missing)),'existingDormantCapabilities':sorted(set(latent))}

          families=collections.Counter(); current=collections.Counter(); with_wrapper=collections.Counter(); exact_after_wrapper=[]; blocked=[]
          for st in base['stations']:
            plans=[parse(x) for x in st.get('directRawPricing',[])]
            if not plans:
              state='direct_price_not_published'; current[state]+=1; with_wrapper[state]+=1
            else:
              for p in plans: families[p['family']]+=1
              state='current_runtime_exact' if all(p['currentRuntimeStatus']=='current_runtime_exact' for p in plans) else 'runtime_extension_required'; current[state]+=1
              state2='exact_if_existing_wrapper_loaded' if all(p['statusIfExistingWrapperLoaded']=='exact_if_existing_wrapper_loaded' for p in plans) else 'additional_engine_extension_required'; with_wrapper[state2]+=1
              if state2=='exact_if_existing_wrapper_loaded': exact_after_wrapper.append({'officialStationId':st['officialStationId'],'name':st['name'],'address':st['address'],'pricing':st['directRawPricing']})
              else: blocked.append({'officialStationId':st['officialStationId'],'name':st['name'],'missing':sorted({m for p in plans for m in p['missingRuntimeFeatures']})})
            st['v8CompatibilityV2']={'directPricePublished':bool(plans),'currentRuntimeStatus':state,'plans':plans}

          meta=base['metadata']
          meta.update({
            'compatibilitySchemaVersion':2,
            'postChargeEngineImplementationPresent':implementation_present,
            'postChargeEngineLoadedInCurrentIndex':loaded_post,
            'stationsExactCurrentV8Runtime':current['current_runtime_exact'],
            'stationsRuntimeExtensionRequired':current['runtime_extension_required'],
            'stationsExactIfExistingPostChargeWrapperLoaded':with_wrapper['exact_if_existing_wrapper_loaded'],
            'stationsAdditionalEngineExtensionRequiredAfterWrapper':with_wrapper['additional_engine_extension_required'],
            'stationsDirectPriceNotPublished':current['direct_price_not_published'],
            'compatibilityFamilyCounts':dict(families),
            'v8CompatibilityVerifiedAgainst':'tesla-charge-companion-stable release/2026-08 index.html runtime script list'
          })
          # Remove stale optimistic fields from v1.
          meta.pop('stationsExactCurrentV8',None);meta.pop('stationsEngineExtensionRequired',None)
          bp.write_text(json.dumps(base,ensure_ascii=False,indent=2),encoding='utf-8')
          report=json.loads(rp.read_text()) if rp.exists() else {}; report['metadata']=meta
          report['v8CompatibilityV2']={'currentRuntimeCounts':dict(current),'afterLoadingExistingWrapperCounts':dict(with_wrapper),'familyCounts':dict(families),'exactAfterLoadingExistingWrapper':exact_after_wrapper,'blockedStations':blocked,'requiredNewEngineFeatures':{'session_cap_semantics_and_enforcement':families['session_cap_50'],'included_energy_threshold_pricing':families['night_connection_includes_20kwh']}}
          rp.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CURRENT_RUNTIME',dict(current));print('AFTER_EXISTING_WRAPPER',dict(with_wrapper));print('FAMILIES',dict(families));print('EXACT_AFTER_WRAPPER')
          for x in exact_after_wrapper: print(x['officialStationId'],x['name'],'|',x['pricing'])
          assert implementation_present is True and loaded_post is False
          assert families=={'session_cap_50':75,'night_connection_includes_20kwh':68,'simple_postcharge':3}
          assert current['current_runtime_exact']==0 and current['runtime_extension_required']==146 and current['direct_price_not_published']==9
          assert with_wrapper['exact_if_existing_wrapper_loaded']==3 and with_wrapper['additional_engine_extension_required']==143 and with_wrapper['direct_price_not_published']==9
          PY
      - name: Commit compatibility correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izivia/izivia_express_station_tariffs_v1.json izivia/izivia_express_normalization_report_v1.json
          if git diff --cached --quiet; then echo 'No change'; else git commit -m 'Correct IZIVIA Express runtime compatibility'; git push; fi
