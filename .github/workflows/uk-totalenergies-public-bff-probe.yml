name: UK TotalEnergies public BFF probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-totalenergies-public-bff-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe app-disclosed read-only BFF routes anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, pathlib
          from datetime import datetime, timezone

          base="https://prod.apix.alzp.tgscloud.net/evdc-bff-europe/v0.0.1"
          ua="TeslaChargeCompanion/9 public-read-only-audit"
          tests=[
            ("/v3/references/filters",{}),
            ("/v3/infrastructure/locations",{}),
            ("/v3/infrastructure/locations",{"countryCode":"GB"}),
            ("/v3/infrastructure/locations",{"country":"GB"}),
            ("/v3/infrastructure/locations",{"supportedCountryCodes":"GB"}),
            ("/v2/infrastructure/locations/status",{}),
            ("/v2/infrastructure/locations/status",{"countryCode":"GB"}),
            ("/v1/operators/images",{}),
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"base":base,"tests":[]}
          for path,params in tests:
            url=base+path
            if params: url+="?"+urllib.parse.urlencode(params)
            rec={"path":path,"params":params}
            req=urllib.request.Request(url,headers={
              "User-Agent":ua,"Accept":"application/json","Origin":"https://chargingservices.totalenergies.com",
              "Referer":"https://chargingservices.totalenergies.com/"
            })
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read(2_000_000).decode("utf-8","replace")
                rec.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw)})
                try:
                  p=json.loads(raw)
                  rec["jsonType"]=type(p).__name__
                  if isinstance(p,dict):
                    rec["keys"]=list(p)[:100]
                    for k in ("data","items","locations","results","content"):
                      v=p.get(k)
                      if isinstance(v,list):
                        rec["listKey"]=k; rec["count"]=len(v)
                        if v and isinstance(v[0],dict): rec["firstItemKeys"]=list(v[0])[:100]
                        break
                  elif isinstance(p,list):
                    rec["count"]=len(p)
                    if p and isinstance(p[0],dict): rec["firstItemKeys"]=list(p[0])[:100]
                except Exception:
                  rec["bodyPrefix"]=raw[:500]
            except urllib.error.HTTPError as e:
              body=e.read(1000).decode("utf-8","replace")
              rec.update({"status":e.code,"contentType":e.headers.get("Content-Type"),"bodyPrefix":body[:500]})
            except Exception as e:
              rec["error"]=f"{type(e).__name__}: {e}"
            out["tests"].append(rec)

          pathlib.Path("reports/uk/totalenergies-public-bff-probe-latest.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/totalenergies-public-bff-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): probe TotalEnergies public BFF [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
