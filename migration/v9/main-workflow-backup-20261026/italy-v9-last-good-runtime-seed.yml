name: Italy V9 last-good runtime seed

on:
  pull_request:
    paths:
      - '.github/workflows/italy-v9-last-good-runtime-seed.yml'
      - 'scripts/seed_italy_v9_runtime.py'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Commit the exact validated Stable Italy runtime into Data Lab'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: italy-v9-last-good-runtime-seed
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 0a6d2c3415504397310d3dc92fae40be843b2435
          path: stable-pin
          sparse-checkout: |
            v9-production-runtime/data/v9/italy-static
            v9-production-runtime/data/v9/italy-offers.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate and compress exact last-good runtime
        run: |
          python3 scripts/seed_italy_v9_runtime.py stable-pin/v9-production-runtime/data/v9 "$RUNNER_TEMP/italy-seed"
          python3 - <<'PY'
          import gzip,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'italy-seed'
          proof=json.loads((root/'bundle.json').read_text())
          with gzip.open(root/'italy-offers.json.gz','rb') as stream:
              raw=stream.read()
          assert hashlib.sha256(raw).hexdigest()==proof['sourceOffersSha256']
          assert (proof['stations'],proof['directOffers'],proof['subscriptionOffers'],proof['emspOffers'])==(29696,54383,53134,1678)
          PY
      - name: Publish seed only after explicit dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.seed == true
        run: |
          set -euo pipefail
          test ! -e data/italy/validated_runtime/bundle.json || { echo 'Italy bundle already exists'; exit 1; }
          mkdir -p data/italy
          cp -a "$RUNNER_TEMP/italy-seed" data/italy/validated_runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/italy/validated_runtime
          git commit -m 'data(italy): preserve exact validated V9 runtime from Stable pin'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
