name: UK Believ pricing endpoint recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-believ-pricing-endpoint-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect Believ Next.js actions and probe routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          assets=[
            "https://charge.believ.com/_next/static/chunks/app/map/page-02df03bdb0c512ae.js",
            "https://charge.believ.com/_next/static/chunks/app/map/layout-659856b6dd1daaa5.js",
            "https://charge.believ.com/_next/static/chunks/635-547198b613780e42.js",
            "https://charge.believ.com/_next/static/chunks/383-3100892536eefb5f.js",
            "https://charge.believ.com/_next/static/chunks/202-2de75146a620d129.js"
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"assets":[],"routeCandidates":[],"probes":[]}
          bodies=[]
          for url in assets:
            item={"url":url}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                body=r.read(5_000_000).decode("utf-8","replace")
              item["bytes"]=len(body)
              bodies.append((url,body))
              contexts=[]
              for needle in ["fetchLocations","fetchLocation","fetchChargingStations","tariff","price","location","chargingStation"]:
                for m in re.finditer(re.escape(needle),body,re.I):
                  contexts.append({"needle":needle,"context":body[max(0,m.start()-500):min(len(body),m.end()+900)]})
                  if len(contexts)>=80: break
              item["contexts"]=contexts[:80]
              # string literals that look like API routes
              for lit in re.findall(r'["\']([^"\']{1,220})["\']',body):
                ll=lit.lower()
                if (lit.startswith("/") or lit.startswith("http")) and any(k in ll for k in ("api","location","station","tariff","price","map","charger")):
                  out["routeCandidates"].append(lit)
            except Exception as e:
              item["error"]=f"{type(e).__name__}: {e}"
            out["assets"].append(item)

          out["routeCandidates"]=sorted(set(out["routeCandidates"]))[:500]

          # probe only plausible same-origin API candidates, never auth/private mutations
          candidates=[]
          for r in out["routeCandidates"]:
            if r.startswith("/") and not r.startswith("//") and any(k in r.lower() for k in ("api","location","station","tariff","price","charger")):
              if not any(k in r.lower() for k in ("start","stop","payment","login","auth","session")):
                candidates.append("https://charge.believ.com"+r)
          for url in sorted(set(candidates))[:120]:
            item={"url":url}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json,text/plain,*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(500_000)
                item.update({"status":r.status,"contentType":r.headers.get("Content-Type"),"bytes":len(raw)})
                try:
                  p=json.loads(raw.decode("utf-8")); item["json"]=True; item["jsonType"]=type(p).__name__
                  if isinstance(p,dict): item["keys"]=list(p)[:50]
                  elif isinstance(p,list): item["count"]=len(p)
                except Exception:
                  item["json"]=False
            except urllib.error.HTTPError as e:
              item.update({"status":e.code,"error":str(e)})
            except Exception as e:
              item.update({"status":None,"error":f"{type(e).__name__}: {e}"})
            out["probes"].append(item)

          Path("reports/uk/believ-pricing-endpoint-recovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"routes":out["routeCandidates"],"probes":out["probes"]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/believ-pricing-endpoint-recovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): recover Believ public pricing endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
