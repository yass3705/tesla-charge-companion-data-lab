name: AVIA Picoty focused guest routes

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/avia_picoty_guest_route_focus.py"
      - ".github/workflows/avia-picoty-guest-route-focus.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract focused guest routes
        run: |
          set -euo pipefail
          python -m py_compile scripts/avia_picoty_guest_route_focus.py
          python scripts/avia_picoty_guest_route_focus.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('data/reports/avia_picoty_guest_route_focus.json')
          d=json.loads(p.read_text())
          assert d['schemaVersion'] in {'1.0.0','1.1.0'}
          assert sum(len(v) for v in d['methods'].values())>0
          assert not re.search(r'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}',p.read_text())
          print({k:len(v) for k,v in d['methods'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avia-picoty-guest-route-focus
          path: data/reports/avia_picoty_guest_route_focus.json
          retention-days: 14
      - name: Commit report
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/avia_picoty_guest_route_focus.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract focused AVIA Picoty guest routes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
