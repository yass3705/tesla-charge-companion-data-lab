name: WAAT Monta Operation static discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waat-monta-operation-static-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public Monta web map asset
        run: |
          set -euo pipefail
          mkdir -p data/reports
          python - <<'PY'
          import urllib.request,re,json
          from pathlib import Path
          url='https://maps.monta.app/assets/js/index-BJ1r_iEz.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=45) as r: text=r.read().decode('utf-8','replace')
          needles=['Operation','operation','Application','application','charge_point_group_id','/api/v1/charge_points','headers:','headers.']
          ctx={}
          for needle in needles:
            arr=[]
            start=0
            while True:
              i=text.find(needle,start)
              if i<0:break
              arr.append(text[max(0,i-1000):min(len(text),i+1600)])
              start=i+len(needle)
              if len(arr)>=100:break
            ctx[needle]=arr
          # Extract string literals likely to be header/operation names around all charge_points calls.
          charge=[]
          for m in re.finditer(r'charge_points',text):
            s=text[max(0,m.start()-1800):min(len(text),m.start()+2500)]
            if 'Operation' in s or 'operation' in s or 'headers' in s:
              charge.append(s)
            if len(charge)>=100:break
          # General exact object/property assignments mentioning operation.
          patterns={
            'operationAssignments':re.findall(r'.{0,300}(?:Operation|operation).{0,500}',text),
            'operationStringLiterals':sorted(set(re.findall(r'["\']([^"\']*(?:operation|Operation)[^"\']*)["\']',text)))[:300],
          }
          out={'asset':url,'length':len(text),'counts':{k:len(v) for k,v in ctx.items()},'contexts':ctx,'chargePointContexts':charge,'patterns':patterns}
          Path('data/reports/waat_monta_operation_static_discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'length':len(text),'counts':out['counts'],'operationStrings':patterns['operationStringLiterals'][:100],'operationAssignments':patterns['operationAssignments'][:30]},ensure_ascii=False,indent=2))
          PY
      - name: Commit sanitized discovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/waat_monta_operation_static_discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish Monta Operation header discovery"
          for attempt in 1 2 3 4 5; do git pull --rebase origin main; git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
