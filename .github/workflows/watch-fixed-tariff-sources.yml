name: Watch fixed tariff official sources

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/watch_fixed_tariff_sources.py"
      - ".github/workflows/watch-fixed-tariff-sources.yml"
      - "reports/fixed-tariff-refresh-audit.json"
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: watch-fixed-tariff-sources
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Watch official tariff sources
        run: python3 scripts/watch_fixed_tariff_sources.py
      - name: Publish source watch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fixed-tariff-source-watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: watch fixed tariff official sources [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
