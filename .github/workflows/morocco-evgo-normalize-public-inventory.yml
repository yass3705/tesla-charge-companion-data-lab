name: Morocco EVGO normalize public inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'reports/morocco/evgo/latest-pin-hydration.json'
      - 'scripts/morocco_evgo_normalize_public_inventory.py'
      - '.github/workflows/morocco-evgo-normalize-public-inventory.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build normalized EVGO public inventory
        run: python scripts/morocco_evgo_normalize_public_inventory.py

      - name: Commit normalized report when changed
        run: |
          if [ -z "$(git status --porcelain -- reports/morocco/evgo/latest-normalized-stations.json)" ]; then
            echo 'No normalized inventory change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/morocco/evgo/latest-normalized-stations.json
          git commit -m 'data(morocco): normalize EVGO public station inventory'
          git pull --rebase origin main
          git push origin HEAD:main
