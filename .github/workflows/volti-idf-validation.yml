name: IDF VOLTi validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/volti_official.py"
      - ".github/workflows/volti-idf-validation.yml"

permissions:
  contents: write

concurrency:
  group: idf-volti-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public safety
        run: python scripts/public_safety_check.py .
      - name: Extract current official rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/volti
          python -m py_compile scripts/volti_official.py
          python scripts/volti_official.py --out out/volti 2> >(tee out/volti/error.log >&2)
      - name: Validate tariff structure
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/volti/volti_official_idf.json').read_text())
          assert p['dataset']=='volti-official-idf'
          assert p['classification']['directNonSubscriber'] is True
          assert p['tariffs']['upTo22Kw']['subscriberEurPerKwh']==0.35
          assert p['tariffs']['upTo22Kw']['nonSubscriberEurPerKwh']==0.40
          assert p['tariffs']['upTo22Kw']['parking']['day0700To2200FreeMinutes']==180
          assert p['tariffs']['upTo22Kw']['parking']['dayAfter180MinutesEurPerMinute']==0.25
          assert p['tariffs']['upTo22Kw']['parking']['night2200To0700EurPerMinute']==0.0
          assert p['tariffs']['above22Kw']['subscriberEurPerKwh']==0.70
          assert p['tariffs']['above22Kw']['nonSubscriberEurPerKwh']==0.80
          assert p['tariffs']['above22Kw']['additionalAfterSessionMinutes']==60
          assert p['tariffs']['above22Kw']['additionalEurPerMinute']==0.25
          assert p['sourceEvidence']['tariffValuesHumanValidatedFromFirstPartyAssets'] is True
          PY
      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/volti
          cp out/volti/volti_official_idf.json data/operator_direct/volti_official_idf.json
          cp out/volti/SUMMARY.md reports/volti/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/volti_official_idf.json reports/volti/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(volti): publish official IDF tariff rules [run ${GITHUB_RUN_ID}]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/volti
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/volti/error.log')
          s=p.read_text(errors='replace') if p.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/volti/latest_diagnostic.json').write_text(json.dumps({'dataset':'volti-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/volti
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/volti/latest_run_status.json').write_text(json.dumps({'dataset':'volti-run-status','operator':'VOLTi','region':'Ile-de-France','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/volti/latest_run_status.json reports/volti/latest_diagnostic.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status(volti): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
