name: Validate France Electroverse PD1 duplicate-safe technical v2
on:
  push:
    branches: [electroverse-pd1-duplicate-safe-tech-v2]
    paths:
      - "scripts/build_electroverse_france_evse_overlay.mjs"
      - ".github/workflows/electroverse-pd1-duplicate-safe-tech-v2.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build overlay
        run: node scripts/build_electroverse_france_evse_overlay.mjs
      - name: Commit generated overlay locally
        run: |
          git config user.name "validation-bot"
          git config user.email "validation@example.invalid"
          git add data/platforms/electroverse/france-evse
          git commit -m "validation snapshot" || true
      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Compare committed snapshot against main
        run: node scripts/compare_electroverse_main_vs_duration_lab.mjs
