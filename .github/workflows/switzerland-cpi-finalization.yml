name: Switzerland CPI finalization
on:
  push:
    paths:
      - 'scripts/finalize_swiss_cpi.py'
      - '.github/workflows/switzerland-cpi-finalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/finalize_swiss_cpi.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          f=json.load(open('docs/switzerland-cpi-finalization-2026-09-28.json',encoding='utf-8'))
          assert f['status']=='complete', f
          assert f['nationalEvseCount']==35, f
          assert f['pricedEvseCount']==29, f
          assert f['classifiedNoPublicDirectTariffCount']==6, f
          assert f['unresolvedEvseCount']==0, f
          print(json.dumps(f,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/cpi-current-direct-tariffs.json docs/switzerland-cpi-finalization-2026-09-28.json
          git commit -m 'data(switzerland): finalize current CH*CPI scope' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
