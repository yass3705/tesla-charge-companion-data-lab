name: Validate Electroverse subscription evidence
# PR regression check: Powerdot fee fixture correction

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/powerdot_official.py"
      - "tests/test_powerdot_electroverse_subscriptions.py"
      - "data/emsp/electroverse_subscription_public_evidence_202610.json"
      - ".github/workflows/validate-electroverse-subscriptions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate official subscription evidence extraction
        run: python -m unittest discover -s tests -p 'test_powerdot_electroverse_subscriptions.py' -v
      - name: Verify public-safety
        run: python scripts/public_safety_check.py .
      - name: Validate evidence catalogue constraints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/emsp/electroverse_subscription_public_evidence_202610.json').read_text())
          assert p['publicationStatus'] == 'reference_only_not_evse_tariff_not_v9'
          assert len(p['offers']) == 5
          assert all(o['emsp'] == 'Electroverse' and 0 < o['discountPercent'] < 100 for o in p['offers'])
          assert all('evseId' not in o and 'eurPerKwh' not in o for o in p['offers'])
          assert {(o['cpo'],o['country']): o['discountPercent'] for o in p['offers']} == {
              ('IONITY','FR'):40, ('Powerdot','FR'):22, ('Powerdot','ES'):29,
              ('Powerdot','BE'):30, ('Powerdot','PT'):25}
          PY
