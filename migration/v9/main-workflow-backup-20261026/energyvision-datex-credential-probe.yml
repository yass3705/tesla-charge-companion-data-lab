name: EnergyVision DATEX credential probe (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/energyvision-datex-credential-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENERGYVISION_API_KEY: ${{ secrets.ENERGYVISION_API_KEY }}
    steps:
      - name: Check authenticated DATEX endpoints without logging credentials or response bodies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token=os.environ.get("ENERGYVISION_API_KEY","").strip()
          if not token:
              raise SystemExit("ENERGYVISION_API_KEY is absent from this workflow context")
          base="https://datex.cpo.energyvision.be/datex"
          result={}
          for endpoint in ("metadata","health"):
              req=urllib.request.Request(base+"/"+endpoint,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/xml, text/xml, application/json",
                  "User-Agent":"TeslaChargeCompanion/9 EnergyVision-DATEX-probe"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      body=response.read(2048)
                      result[endpoint]={"status":response.status,
                          "contentType":response.headers.get("Content-Type","").split(";")[0],
                          "nonEmpty":bool(body)}
              except urllib.error.HTTPError as error:
                  result[endpoint]={"status":error.code}
              except urllib.error.URLError as error:
                  result[endpoint]={"networkError":type(error.reason).__name__}
          print(json.dumps(result,sort_keys=True))
          if result.get("metadata",{}).get("status")!=200 or not result["metadata"].get("nonEmpty"):
              raise SystemExit("EnergyVision authenticated metadata not validated")
          PY
