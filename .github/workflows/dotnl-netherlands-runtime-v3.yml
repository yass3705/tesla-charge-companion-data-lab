name: DOT-NL Netherlands runtime v3 access

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dotnl-netherlands-runtime-v3.yml"
      - "scripts/dotnl_netherlands_access_patch.py"

permissions:
  contents: write

env:
  LOC_URL: https://opendata.ndw.nu/charging_point_locations_ocpi.json.gz
  TAR_URL: https://opendata.ndw.nu/charging_point_tariffs_ocpi.json.gz
  NORMALIZED_GZ: /tmp/dotnl_netherlands_normalized.json.gz
  RUNTIME_DIR: /tmp/non_tesla_netherlands
  RUNTIME_REPORT: /tmp/runtime_report.json
  ACCESS_REPORT: data/national/dotnl_netherlands_access_report.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official snapshots
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "$LOC_URL" -o /tmp/locations.json.gz
          curl -fsSL --retry 4 --retry-all-errors "$TAR_URL" -o /tmp/tariffs.json.gz
          gzip -t /tmp/locations.json.gz && gzip -t /tmp/tariffs.json.gz
      - name: Normalize and compile
        run: |
          set -euo pipefail
          python scripts/dotnl_netherlands_build.py /tmp/locations.json.gz /tmp/tariffs.json.gz "$NORMALIZED_GZ" /tmp/normalized_report.json
          python scripts/dotnl_netherlands_runtime.py "$NORMALIZED_GZ" "$RUNTIME_DIR" "$RUNTIME_REPORT"
          python scripts/dotnl_netherlands_access_patch.py "$NORMALIZED_GZ" "$RUNTIME_DIR" "$ACCESS_REPORT"
      - name: Validate access runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,os,sys
          root=os.environ['RUNTIME_DIR']
          m=json.load(open(root+'/manifest.json',encoding='utf-8'))
          a=json.load(open(os.environ['ACCESS_REPORT'],encoding='utf-8'))
          with gzip.open(root+'/all.json.gz','rt',encoding='utf-8') as f: rows=json.load(f)
          access=[r[7] for r in rows if len(r)>7 and isinstance(r[7],list)]
          known=sum(1 for x in access if x and x[0] in (1,2))
          exceptional=sum(1 for x in access if len(x)>2 and x[2])
          multi=a['metrics'].get('stationsWithMultiIntervalRegular',0)
          checks={
            'schemaV3':m.get('schemaVersion')==3,
            'scope':m.get('scope',{}).get('ocpiOpeningTimes') is True and m.get('scope',{}).get('ocpiParkingRestrictions') is True,
            'rows':len(rows)>70000 and len(access)==len(rows),
            'knownHours':known>1000,
            'coverageRecorded':m.get('accessCoverage',{}).get('unknownStations') is not None,
          }
          print(json.dumps({'checks':checks,'known':known,'exceptional':exceptional,'multiIntervalRegular':multi,'manifestCoverage':m.get('accessCoverage'),'report':a},ensure_ascii=False,indent=2))
          failed=[k for k,v in checks.items() if not v]
          if failed: print('FAILED: '+', '.join(failed),file=sys.stderr);sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dotnl-netherlands-runtime-v3-access
          path: |
            /tmp/non_tesla_netherlands/
            data/national/dotnl_netherlands_access_report.json
          retention-days: 14
      - name: Commit access metrics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ACCESS_REPORT"
          git diff --cached --quiet && exit 0
          git commit -m "Record DOT-NL access coverage"
          git pull --rebase origin dotnl-netherlands-baseline
          git push origin HEAD:dotnl-netherlands-baseline
