name: Switzerland target CPO full direct-tariff scan

on:
  push:
    paths:
      - '.github/workflows/switzerland-target-cpo-full-scan.yml'
      - 'scripts/collect_swiss_atlas_cpo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - operator: 'CH*CCC'
            slug: move
            name: MOVE
          - operator: 'CH*360'
            slug: energie360
            name: 'Energie 360'
          - operator: 'CH*EWZ'
            slug: ewz
            name: ewz
          - operator: 'CH*ELC'
            slug: electra
            name: Electra
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Collect ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/switzerland docs
          python3 scripts/collect_swiss_atlas_cpo.py \
            --operator '${{ matrix.operator }}' \
            --name '${{ matrix.name }}' \
            --output 'data/switzerland/${{ matrix.slug }}-direct-tariffs.json' \
            --delay 0.18

      - name: Write finalization status
        shell: python
        run: |
          import json,pathlib
          slug='${{ matrix.slug }}'
          p=pathlib.Path(f'data/switzerland/{slug}-direct-tariffs.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          s=x['summary']
          doc={
            'schemaVersion':1,
            'country':'CH',
            'cpo':'${{ matrix.name }}',
            'operatorId':'${{ matrix.operator }}',
            'status':s['status'],
            'stationCount':s['stationCount'],
            'stationsWithDirectTariff':s['stationsWithDirectTariff'],
            'stationsWithoutDirectTariff':s['stationsWithoutDirectTariff'],
            'coveragePct':s['coveragePct'],
            'directTariffDetailCount':s['directTariffDetailCount'],
            'directPaymentTariffDetailCount':s['directPaymentTariffDetailCount'],
            'method':'Swiss eMobility Ladepreisatlas public frontend API; direct-only filter is_roaming=false and EMP=CPO',
            'policy':'No tariff extrapolation. Stations without a direct non-roaming tariff remain unresolved.',
            'productionSource':str(p)
          }
          pathlib.Path(f'docs/switzerland-{slug}-atlas-finalization-2026-09-27.json').write_text(
            json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(doc,ensure_ascii=False,indent=2))

      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/switzerland/${{ matrix.slug }}-direct-tariffs.json' 'docs/switzerland-${{ matrix.slug }}-atlas-finalization-2026-09-27.json'
          git commit -m 'data: scan ${{ matrix.name }} direct tariffs'
          for attempt in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
