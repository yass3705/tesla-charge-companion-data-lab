name: Switzerland IONITY official finalization
on:
  push:
    paths:
      - 'scripts/collect_ionity_switzerland_official.py'
      - '.github/workflows/switzerland-ionity-official-finalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/collect_ionity_switzerland_official.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          f=json.load(open('docs/switzerland-ionity-finalization-2026-09-28.json'))
          assert f['nationalEvseCount']==168, f
          assert f['pricedEvseCount'] <= 168
          assert f['ambiguousEvseCount']==0, f
          print(json.dumps(f,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switzerland/ionity-official-direct-tariffs.json docs/switzerland-ionity-finalization-2026-09-28.json
          git commit -m 'data(switzerland): reconcile IONITY Direct to national scope'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
