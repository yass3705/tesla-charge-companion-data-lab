name: Audit Electroverse FR VIA 55C structured residual
on:
  push:
    branches:
      - audit/electroverse-via-55c-structured-residual
    paths:
      - "scripts/audit_electroverse_via_55c_structured_residual.mjs"
      - ".github/workflows/electroverse-via-55c-structured-residual.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit structured residuals
        run: node scripts/audit_electroverse_via_55c_structured_residual.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-via-55c-structured-residual.json
          git commit -m "audit: publish VIA 55C structured residual report" || exit 0
          git push
