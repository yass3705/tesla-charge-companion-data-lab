name: Analyze Electroverse France remaining residuals batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_electroverse_remaining_batch.mjs"
      - ".github/workflows/electroverse-remaining-residual-batch.yml"
permissions:
  contents: write
jobs:
  # rerank marker: post SAE H01 ADP residual sweep
  # rerank marker: validated B residual published
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze every remaining residual bucket
        run: node scripts/analyze_electroverse_remaining_batch.mjs
      - name: Validate generated residual artifacts
        run: |
          test -s reports/electroverse/remaining-batch-analysis.json
          node -e "JSON.parse(require('fs').readFileSync('reports/electroverse/remaining-batch-analysis.json','utf8'))"
          test -s data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json
          test -s data/platforms/electroverse/validated-mappings/non-actionable-covered-source-residuals.json
      - name: Persist residual analysis and validated mappings
        run: |
          cp reports/electroverse/remaining-batch-analysis.json /tmp/remaining-batch-analysis.json
          cp data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json /tmp/remaining-unique-suffix-residual.json
          cp data/platforms/electroverse/validated-mappings/non-actionable-covered-source-residuals.json /tmp/non-actionable-covered-source-residuals.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports/electroverse data/platforms/electroverse/validated-mappings
          cp /tmp/remaining-batch-analysis.json reports/electroverse/remaining-batch-analysis.json
          cp /tmp/remaining-unique-suffix-residual.json data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json
          cp /tmp/non-actionable-covered-source-residuals.json data/platforms/electroverse/validated-mappings/non-actionable-covered-source-residuals.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/remaining-batch-analysis.json data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json data/platforms/electroverse/validated-mappings/non-actionable-covered-source-residuals.json
          if git diff --cached --quiet; then
            echo "No mapping changes"
          else
            git commit -m "data: publish remaining validated Electroverse suffix mappings"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              git rebase --abort || true
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: electroverse-france-remaining-residual-batch
          path: |
            reports/electroverse/remaining-batch-analysis.json
            data/platforms/electroverse/validated-mappings/remaining-unique-suffix-residual.json
            data/platforms/electroverse/validated-mappings/non-actionable-covered-source-residuals.json
          retention-days: 14
