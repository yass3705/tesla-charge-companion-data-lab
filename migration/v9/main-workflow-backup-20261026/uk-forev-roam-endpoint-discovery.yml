name: UK FOR EV Roam endpoint discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-forev-roam-endpoint-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect FOR EV and Roam public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="Mozilla/5.0 TeslaChargeCompanion/9"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(5_000_000).decode("utf-8","replace"),r.geturl()

          out={"retrievedAt":datetime.now(timezone.utc).isoformat()}

          # FOR EV
          html,final=get("https://forev.co.uk/for-drivers/")
          uuids=sorted(set(re.findall(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',html)))
          fuuse=[]
          for m in re.finditer(r'(?i)(fuuse|api\.fuuse\.io|opendata)',html):
              fuuse.append(html[max(0,m.start()-600):min(len(html),m.end()+1000)])
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          asset_hits=[]
          for s in scripts[:40]:
              try:
                  body,_=get(s)
                  if re.search(r'(?i)(fuuse|api\.fuuse\.io|opendata|chargepoint|charger|location)',body):
                      ctx=[]
                      for m in re.finditer(r'(?i)(fuuse|api\.fuuse\.io|opendata)',body):
                          ctx.append(body[max(0,m.start()-400):min(len(body),m.end()+700)])
                      us=sorted(set(re.findall(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',body)))
                      if ctx or us: asset_hits.append({"url":s,"contexts":ctx[:20],"uuids":us[:50]})
              except Exception: pass
          out["FOR EV"]={"uuidCandidates":uuids,"htmlFuuseContexts":fuuse[:30],"assetHits":asset_hits}

          # Roam charging map
          html,final=get("https://www.roamcharging.com/for-drivers/charging-map")
          scripts=[urllib.parse.urljoin(final,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          contexts=[]; urls=set()
          for source_name,body in [("html",html)]:
              for m in re.finditer(r'(?i)(ocpi|api|graphql|stations|chargers|locations|tariffs)',body):
                  contexts.append({"source":source_name,"context":body[max(0,m.start()-300):min(len(body),m.end()+600)]})
          for s in scripts[:50]:
              try:
                  body,_=get(s)
                  hit=False
                  for m in re.finditer(r'(?i)(ocpi|api|graphql|stations|chargers|locations|tariffs)',body):
                      contexts.append({"source":s,"context":body[max(0,m.start()-300):min(len(body),m.end()+600)]})
                      hit=True
                      if len(contexts)>250: break
                  for u in re.findall(r'https?://[^"\'\s<>()\\]+',body):
                      if any(k in u.lower() for k in ("api","ocpi","roam","charge","station","location")): urls.add(u[:500])
                  if len(contexts)>250: break
              except Exception: pass
          out["Roam"]={"urls":sorted(urls)[:300],"contexts":contexts[:250]}

          Path("reports/uk/forev-roam-endpoint-discovery-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/forev-roam-endpoint-discovery-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): discover FOR EV and Roam endpoints [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
