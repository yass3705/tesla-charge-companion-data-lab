name: Audit Electroverse FR DRV national source hits
on:
  push:
    branches:
      - audit/electroverse-drv-technical-identity
    paths:
      - "scripts/audit_electroverse_drv_national_source_hits.mjs"
      - ".github/workflows/electroverse-drv-national-source-hits.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate raw DRV national records
        run: node scripts/audit_electroverse_drv_national_source_hits.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-fr-drv-national-source-hits.json
          git commit -m "audit: publish DRV national source hits" || exit 0
          git push
