name: IECharge official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "27 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/iecharge_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/iecharge-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: iecharge-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract IECharge official France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/iecharge
          python -m py_compile scripts/iecharge_official.py
          python scripts/iecharge_official.py --out out/iecharge 2> >(tee out/iecharge/error.log >&2)
          cat out/iecharge/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/iecharge
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/iecharge/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/iecharge/latest_diagnostic.json').write_text(json.dumps({'dataset':'iecharge-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/iecharge/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(iecharge): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/iecharge/iecharge_official_france.json').read_text())
          assert p['classification']['singleNationalDirectTariff'] is True
          assert p['classification']['stationLevelPriceLookupRequiredForIEChargeDirect'] is False
          assert p['operatorDirect']['highPowerFrance']['eurPerKwh'] == 0.25
          assert p['operatorDirect']['highPowerFrance']['maxPowerKwPublished'] == 320
          assert p['operatorDirect']['bankCard']['preauthorizationOrReservationEur'] == 20.0
          assert p['roaming']['operatorDirect'] is False
          assert p['roaming']['providerMayChargeDifferentTariff'] is True
          assert p['sourceEvidence']['officialOnly'] is True
          print('Validated IECharge France direct tariff and roaming separation')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/iecharge/iecharge_official_france.json')
          dst=Path('data/operator_direct/iecharge_official_france.json')
          rep=Path('reports/iecharge/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'network':d.get('network'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/iecharge/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated IECharge rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/iecharge_official_france.json reports/iecharge/latest_summary.md
          git commit -m "data(iecharge): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
