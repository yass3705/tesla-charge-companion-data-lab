name: Bump mobile API discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/bump_mobile_api_discovery.py"
      - ".github/workflows/bump-mobile-api-discovery.yml"

permissions:
  contents: write

concurrency:
  group: bump-mobile-api-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anonymous Google Play downloader
        run: python -m pip install --disable-pip-version-check "goopdl==1.2.1"

      - name: Acquire anonymous FR token
        run: timeout 120 goopdl auth --country FR

      - name: Download current Bump APK and splits
        run: |
          set -euo pipefail
          rm -rf /tmp/bump-apks
          mkdir -p /tmp/bump-apks
          for attempt in 1 2; do
            if timeout 360 goopdl download bump.charge.com.app --country FR --no-extras -o /tmp/bump-apks; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 20
          done
          count="$(find /tmp/bump-apks -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$count" -ge 1
          echo "Downloaded APK/split count: $count"

      - name: Static API/tariff discovery
        run: python scripts/bump_mobile_api_discovery.py /tmp/bump-apks

      - name: Ensure no APK is staged or persisted
        run: |
          set -euo pipefail
          rm -rf /tmp/bump-apks ~/.config/goopdl
          if find . -type f \( -name '*.apk' -o -name '*.apks' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo 'Refusing to persist app binaries in repository'
            exit 1
          fi

      - name: Validate sanitized report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reports/bump/mobile_api_discovery_latest.json').read_text())
          assert p['package']=='bump.charge.com.app'
          assert p['method']['staticAnalysisOnly'] is True
          assert p['method']['appExecuted'] is False
          assert p['method']['authenticatedToBump'] is False
          assert p['method']['queriesOrFragmentsPersisted'] is False
          assert p['counts']['apkCount'] >= 1
          for row in p['candidateUrls']:
              assert '?' not in row['url'] and '#' not in row['url']
          print(p['counts'])
          PY

      - name: Publish sanitized discovery report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bump/mobile_api_discovery_latest.json reports/bump/mobile_api_discovery_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(bump): publish mobile API discovery [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
