name: Ouest Charge official tariffs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ouestcharge-official-tariffs.yml"
      - "config/operator_manifests/ouestcharge.json"
      - "scripts/operator_manifest_runner.py"
      - "scripts/public_safety_check.py"

permissions:
  contents: write

concurrency:
  group: ouestcharge-official-tariffs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract and validate official evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/ouestcharge
          python -m py_compile scripts/operator_manifest_runner.py
          python scripts/operator_manifest_runner.py \
            --operator ouestcharge \
            --out out/ouestcharge \
            2> >(tee out/ouestcharge/error.log >&2)
          cat out/ouestcharge/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic on failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ouestcharge
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/ouestcharge/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/ouestcharge/latest_diagnostic.json').write_text(json.dumps({
              'dataset':'ouestcharge-diagnostic',
              'operator':'Ouest Charge',
              'sanitized':True,
              'runId':'${{ github.run_id }}',
              'errorTail':[x for x in text.splitlines() if x.strip()][-80:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ouestcharge/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(ouestcharge): publish validation diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate output envelope
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/operator_manifests/ouestcharge.json').read_text())
          p=json.loads(Path('out/ouestcharge/ouestcharge_official_france.json').read_text())
          assert p['dataset'] == m['dataset']
          assert p['operator'] == 'Ouest Charge'
          assert p['country'] == 'FR'
          assert p['publicationStatus'] == 'candidate_validated_source'
          assert p['sourceEvidence']['officialOnly'] is True
          assert len(p['sourceEvidence']['relevantTariffFingerprintSha256']) == 64
          assert len(p['sourceEvidence']['sources']) == 3
          assert p['operatorDirect']['nonSubscriberSessionFeeEur'] == 1.0
          assert p['operatorDirect']['qrCardPreauthorizationEur'] == 85.0
          assert p['billing']['overstayBasis'] == 'connection_time'
          assert p['roaming']['mustRemainSeparateFromOuestChargeDirectTariff'] is True
          print('Ouest Charge output envelope validated')
          PY

      - name: Publish validated candidate only when model changes
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/ouestcharge/ouestcharge_official_france.json')
          dst=Path('data/operator_direct/ouestcharge_official_france.json')
          rep=Path('reports/ouestcharge/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'dataset':d.get('dataset'),
                  'operator':d.get('operator'),
                  'facts':{k:v for k,v in d.items() if k not in {'generatedAt','sourceEvidence'}},
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2(Path('out/ouestcharge/SUMMARY.md'),rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit Ouest Charge candidate
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/ouestcharge_official_france.json reports/ouestcharge/latest_summary.md
          git commit -m "data(ouestcharge): publish official tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
