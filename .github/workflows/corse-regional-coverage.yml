name: Corse regional coverage

on:
  workflow_dispatch:
  push:
    branches: ["main", "corse-regional-coverage"]
    paths:
      - "scripts/corse_regional_coverage.py"
      - ".github/workflows/corse-regional-coverage.yml"

permissions:
  contents: write

concurrency:
  group: corse-regional-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public safety
        run: python scripts/public_safety_check.py .

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<6'

      - name: Extract and consolidate official evidence
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/corse
          python -m py_compile scripts/corse_regional_coverage.py
          python scripts/corse_regional_coverage.py --out out/corse 2> >(tee out/corse/error.log >&2)
          cat out/corse/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate tariff models and regional coverage
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('out/corse')
          p=json.loads((r/'corse_regional_coverage.json').read_text())
          assert p['region']=='Corse'
          assert p['departmentsTotal']==2
          assert p['coverage']['departmentsAccountedFor']==2
          assert p['coverage']['regionalPublicNetworkResearchCoverageComplete'] is True
          assert p['coverage']['singleUniversalRegionalTariff'] is False
          assert p['coverage']['allIdentifiedLiveTariffsResolved'] is False
          assert p['tccDecision']['stationSpecificPricingMustRemainNullUntilVerified'] is True
          assert p['sourceHealth']['officialOrOperatorSourcesReachableAtRun'] >= 8

          e=json.loads((r/'emotum_official_corse.json').read_text())
          assert e['network']['publishedCorsePoints2026']==360
          assert e['directTariff']['priceSpecificToEachStation'] is True
          assert e['postCharge']['mustVacateWithinMinutes']==30
          assert e['tccDecision']['genericCurrentDirectTariffClassable'] is False

          o=json.loads((r/'ozecar_official_corse.json').read_text())
          assert o['presence']['corsicaAgency']=='Ventiseri'
          assert o['directTariff']['siteSpecific'] is True
          assert o['tccDecision']['genericCurrentDirectTariffClassable'] is False

          b=json.loads((r/'bastia_parks_yes55_official_corse.json').read_text())
          assert b['networkSnapshot']['chargePoints']==38
          assert b['directTariff2026']['energyEurPerKwhHt']==0.20
          assert b['operatorChange']['currentSupervisor']=='YES 55'

          s=json.loads((r/'sde2a_irve_official_corse.json').read_text())
          assert s['currentNetwork']=={'communes':22,'chargePoints':31}
          assert s['deployment2026']['plannedStations']==150
          assert s['deployment2026']['plannedChargePoints']==300
          assert s['tccDecision']['futureRolloutValidatedAsPlanNotAsFullyLiveInventory'] is True

          h=json.loads((r/'sieep_hc_irve_official_corse.json').read_text())
          assert h['planning']['sdirveFinalized'] is True
          assert h['tccDecision']['doNotTreatAsSingleLiveCpoUntilDeploymentEvidenceExists'] is True
          PY

      - name: Publish validated evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct data/regional_coverage reports/corse
          for f in emotum_official_corse.json ozecar_official_corse.json bastia_parks_yes55_official_corse.json sde2a_irve_official_corse.json sieep_hc_irve_official_corse.json; do
            cp "out/corse/$f" "data/operator_direct/$f"
          done
          cp out/corse/corse_regional_coverage.json data/regional_coverage/
          cp out/corse/SUMMARY.md reports/corse/latest_summary.md
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/emotum_official_corse.json data/operator_direct/ozecar_official_corse.json data/operator_direct/bastia_parks_yes55_official_corse.json data/operator_direct/sde2a_irve_official_corse.json data/operator_direct/sieep_hc_irve_official_corse.json data/regional_coverage/corse_regional_coverage.json reports/corse/latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "data(corse): publish validated regional public-network evidence [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publish diagnostic on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/corse
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('out/corse/error.log')
          s=q.read_text(errors='replace') if q.exists() else 'validation failed without extractor stderr'
          s=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',s)
          Path('reports/corse/latest_diagnostic.json').write_text(json.dumps({'dataset':'corse-regional-diagnostic','sanitized':True,'errorTail':[x for x in s.splitlines() if x.strip()][-60:]},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/corse
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('reports/corse/latest_run_status.json').write_text(json.dumps({'dataset':'corse-regional-run-status','region':'Corse','runId':os.environ.get('GITHUB_RUN_ID',''),'status':os.environ.get('JOB_STATUS','unknown'),'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/corse/latest_run_status.json
          if [ "${JOB_STATUS}" = "success" ] && git ls-files --error-unmatch reports/corse/latest_diagnostic.json >/dev/null 2>&1; then
            git rm -f reports/corse/latest_diagnostic.json
          elif [ -f reports/corse/latest_diagnostic.json ]; then
            git add reports/corse/latest_diagnostic.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "status(corse): ${JOB_STATUS} [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
