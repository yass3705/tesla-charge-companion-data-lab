name: UK Connected Kerb P1 tariff detail deep triage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/uk_connected_kerb_deep_fee_triage_20261010.py
      - .github/workflows/uk-connected-kerb-deep-fee-triage.yml

permissions:
  contents: write

concurrency:
  group: uk-connected-kerb-p1-deep-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact-source socket tariffs and 56 flagged connector fees
        run: python3 scripts/uk_connected_kerb_deep_fee_triage_20261010.py
      - name: Publish evidence and operator-source discrepancy analysis
        shell: bash
        run: |
          set -euo pipefail
          cp reports/uk/connected-kerb-deep-fee-evidence-2026-10-10.json /tmp/ck-deep-evidence.json
          cp reports/uk/connected-kerb-deep-fee-summary-2026-10-10.csv /tmp/ck-deep-summary.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ck-deep-evidence.json reports/uk/connected-kerb-deep-fee-evidence-2026-10-10.json
            cp /tmp/ck-deep-summary.csv reports/uk/connected-kerb-deep-fee-summary-2026-10-10.csv
            git add reports/uk/connected-kerb-deep-fee-evidence-2026-10-10.json reports/uk/connected-kerb-deep-fee-summary-2026-10-10.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "reports(uk): Connected Kerb P1 exact guest tariff evidence [run ${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              echo UK_CONNECTED_KERB_DEEP_EVIDENCE_PUBLISHED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uk-connected-kerb-p1-deep-${{ github.run_id }}
          path: |
            reports/uk/connected-kerb-deep-fee-evidence-2026-10-10.json
            reports/uk/connected-kerb-deep-fee-summary-2026-10-10.csv
          retention-days: 90
