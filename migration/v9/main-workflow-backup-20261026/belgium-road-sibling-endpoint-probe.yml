name: Belgium Road sibling endpoint probe
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-road-sibling-endpoint-probe.txt"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_road_sibling_endpoint_probe.py
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/belgium-road-sibling-endpoint-probe-2026-09-29.json
          git add -f data/belgium/additional/road-tariffs-2026-09-29.json 2>/dev/null || true
          git commit -m "Probe Road public tariff sibling files" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
