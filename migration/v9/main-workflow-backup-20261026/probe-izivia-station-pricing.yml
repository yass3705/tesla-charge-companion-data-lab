name: France IZIVIA station pricing probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-izivia-station-pricing.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test pricing with legacy or EMIP identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/france/izivia
          python - <<'PY'
          import json,subprocess,pathlib,uuid,urllib.parse,concurrent.futures
          base='https://fronts-map.izivia.com/api'; device=str(uuid.uuid4())
          common=['-sS','-A','Mozilla/5.0','-H','accept: application/json','-H','Accept-Language: fr','-H',f'x-device-id: {device}']
          def call(method,path,body=None):
              cmd=['curl',*common,'-w','\n%{http_code}','-X',method]
              if body is not None: cmd += ['-H','content-type: application/json','--data',json.dumps(body,separators=(',',':'))]
              cmd += [base+path]
              r=subprocess.run(cmd,capture_output=True,text=True)
              payload,status=r.stdout.rsplit('\n',1) if '\n' in r.stdout else (r.stdout,'')
              try:data=json.loads(payload)
              except:data=payload
              return int(status or 0),data
          ms,markers=call('POST','/map/markers',{'square':{'centerLat':48.8566,'centerLng':2.3522,'zoom':9},'filters':{}})
          markers=markers if isinstance(markers,list) else []
          def detail(m):
              st,d=call('POST',f"/charging-locations/{m['id']}",{'filters':{}});return m,st,d
          candidates=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for m,st,d in ex.map(detail,markers[:300]):
                  if not isinstance(d,dict):continue
                  legacy=d.get('legacyId');emip=d.get('firstStationEmipId')
                  if legacy is not None or emip:
                      candidates.append({'id':m['id'],'name':d.get('name'),'legacyId':legacy,'stationEmipId':emip})
                  if len(candidates)>=40:break
          attempts=[]
          for c in candidates:
              params={}
              if c.get('legacyId') is not None:params['legacyId']=c['legacyId']
              if c.get('stationEmipId'):params['stationEmipId']=c['stationEmipId']
              q=urllib.parse.urlencode(params)
              ps,p=call('GET',f"/charging-locations/{c['id']}/pricing-info-items?{q}")
              attempts.append({**c,'status':ps,'pricing':p})
              if ps==200 and isinstance(p,list) and p:break
          out={'markersStatus':ms,'markerCount':len(markers),'candidateCount':len(candidates),'attempts':attempts}
          pathlib.Path('reports/france/izivia/station-pricing-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/izivia/station-pricing-probe.json
          git commit -m 'France IZIVIA: publish identifier pricing probe' || exit 0
          git pull --rebase origin main
          git push
