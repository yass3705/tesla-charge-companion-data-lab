name: Belgium TotalEnergies status probe
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-totalenergies-status-probe.txt"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BELGIUM_NAP_TOKEN: ${{ secrets.BELGIUM_NAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe representative missing TotalEnergies EVSEs
        run: python scripts/belgium_totalenergies_status_probe.py
      - name: Persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/status-probe-2026-09-28.json
          git commit -m "Probe Belgium TotalEnergies missing EVSE status prices" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
