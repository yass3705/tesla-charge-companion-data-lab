name: UK ParkRecharge public map collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-parkrecharge-public-map-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect public map inventory and pricing
        run: |
          python - <<'PY'
          import json,re,gzip,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone

          UA="TeslaChargeCompanion/9 ParkRecharge-public-map-collector"
          def fetch(url,accept="application/json,text/javascript,*/*"):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":accept})
              with urllib.request.urlopen(req,timeout=75) as r:
                  return r.read().decode("utf-8","replace")

          env=fetch("https://parkrecharge.app/assets/js/env.js")
          def extract(name):
              for p in (
                rf'(?i)\b{name}\b\s*:\s*["\']([^"\']+)["\']',
                rf'(?i)\b{name}\b\s*=\s*["\']([^"\']+)["\']',
              ):
                  m=re.search(p,env)
                  if m:return m.group(1)
              return None
          endpoint=extract("API_ENDPOINT"); key=extract("API_KEY")
          if not endpoint or not key: raise SystemExit("public webapp config not parsed")
          url=urllib.parse.urljoin(endpoint,"devices/")+"?"+urllib.parse.urlencode({"format":"json","key":key,"data":"full"})
          payload=json.loads(fetch(url))
          devices=payload.get("devices") if isinstance(payload,dict) else None
          if not isinstance(devices,list) or not devices: raise SystemExit("empty/unexpected devices payload")

          connector_count=0; device_status={}; connector_status={}; fees={}; geocoded=0
          for row in devices:
              d=row.get("device") if isinstance(row,dict) else None
              if not isinstance(d,dict): continue
              if d.get("Latitude") not in (None,"") and d.get("Longitude") not in (None,""): geocoded+=1
              ds=str(d.get("DeviceStatus") or "UNKNOWN"); device_status[ds]=device_status.get(ds,0)+1
              f=d.get("Fees") if isinstance(d.get("Fees"),dict) else {}
              combo=(str(f.get("use_fee","")),str(f.get("kwh_fee","")),str(f.get("hourly_fee","")))
              fees["|".join(combo)]=fees.get("|".join(combo),0)+1
              for c in d.get("Connectors") or []:
                  if not isinstance(c,dict): continue
                  connector_count+=1
                  st=str(c.get("ConnectorStatus") or "UNKNOWN"); connector_status[st]=connector_status.get(st,0)+1

          retrieved=datetime.now(timezone.utc).isoformat()
          out={
            "country":"GB","network":"ParkRecharge","retrievedAt":retrieved,
            "source":"official public ParkRecharge webapp devices endpoint",
            "note":"API client key is read at runtime from the public webapp config and is intentionally not persisted.",
            "devices":devices
          }
          summary={
            "country":"GB","network":"ParkRecharge","retrievedAt":retrieved,
            "devices":len(devices),"connectors":connector_count,"geocodedDevices":geocoded,
            "deviceStatuses":device_status,"connectorStatuses":connector_status,
            "feeCombinations":[
              {"useFee":k.split("|")[0],"gbpPerKwh":k.split("|")[1],"hourlyFee":k.split("|")[2],"devices":v}
              for k,v in sorted(fees.items(),key=lambda kv:(-kv[1],kv[0]))
            ],
            "pricingCoverageDevices":sum(v for k,v in fees.items() if any(x not in ("","0","0.0","0.00","None") for x in k.split("|"))),
            "status":"complete"
          }
          Path("data/national").mkdir(parents=True,exist_ok=True); Path("reports/uk").mkdir(parents=True,exist_ok=True)
          with gzip.open("data/national/uk_parkrecharge_public_map.json.gz","wt",encoding="utf-8") as g:
              json.dump(out,g,ensure_ascii=False,separators=(",",":"))
          Path("reports/uk/parkrecharge-public-map-latest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Publish dataset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_parkrecharge_public_map.json.gz reports/uk/parkrecharge-public-map-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect ParkRecharge public map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
