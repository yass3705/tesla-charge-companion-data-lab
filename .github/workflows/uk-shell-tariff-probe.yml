name: UK Shell direct CPO tariffs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-shell-tariff-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-shell-direct-cpo-tariffs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHELL_EV_CLIENT_ID: ${{ secrets.SHELL_EV_CLIENT_ID }}
      SHELL_EV_CLIENT_SECRET: ${{ secrets.SHELL_EV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Collect Shell-operated UK tariffs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operator_direct reports/uk
          python3 - <<'PY'
          import os,json,time,uuid,urllib.parse,urllib.request,urllib.error,gzip
          from pathlib import Path
          from datetime import datetime,timezone

          cid=os.environ.get("SHELL_EV_CLIENT_ID","").strip()
          secret=os.environ.get("SHELL_EV_CLIENT_SECRET","").strip()
          if not cid or not secret:
              raise SystemExit("Shell secrets missing")

          AUTH="https://api-test.shell.com/v1/oauth/token"
          BASE="https://api-test.shell.com/ev/v2/locations"
          PROVIDER="Shell_RP_2"
          UA="TeslaChargeCompanion/9 Shell-UK-Direct-CPO"
          MIN_INTERVAL=7.5
          last=0.0
          token=None

          def throttle():
              global last
              now=time.monotonic()
              wait=MIN_INTERVAL-(now-last)
              if wait>0: time.sleep(wait)
              last=time.monotonic()

          def auth():
              global token
              throttle()
              form=urllib.parse.urlencode({
                  "client_id":cid,
                  "client_secret":secret,
                  "grant_type":"client_credentials"
              }).encode()
              req=urllib.request.Request(AUTH,data=form,method="POST",headers={
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Accept":"application/json",
                  "User-Agent":UA
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  token=json.loads(r.read().decode("utf-8"))["access_token"]

          auth()

          def call(uid,retry=True):
              global token
              throttle()
              url=BASE+"/"+urllib.parse.quote(uid,safe="")+"?"+urllib.parse.urlencode({"providerId":PROVIDER})
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "RequestId":str(uuid.uuid4()),
                  "User-Agent":UA
              })
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return r.status,json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  if e.code==401 and retry:
                      auth()
                      return call(uid,False)
                  return e.code,{"error":e.read().decode("utf-8","replace")[:1000]}

          with gzip.open("data/national/uk_shell_ev_public_locations.json.gz","rt",encoding="utf-8") as g:
              inv=json.load(g)

          # Canonical rule 2026-10-01:
          # - retain Shell_RP_2 tariff only when the actual CPO is Shell Recharge (GB*TNM family)
          # - never promote provider/eMSP tariffs for third-party CPOs
          shell_locs=[]
          for loc in inv.get("locations") or []:
              op_name=str(loc.get("operatorName") or "").strip()
              op_id=str(loc.get("operatorId") or "").strip().upper()
              if op_name=="Shell Recharge" and op_id.startswith("GB*TNM"):
                  shell_locs.append(loc)

          results=[]
          for loc in shell_locs:
              uid=str(loc.get("uid") or loc.get("externalId") or "")
              if not uid:
                  continue
              status,body=call(uid)
              data=body.get("data") if isinstance(body,dict) else None
              if isinstance(data,list) and data:
                  data=data[0]
              tariff_connectors=[]
              connector_count=0
              tariff_count=0
              if isinstance(data,dict):
                  for ev in data.get("evses") or []:
                      for conn in ev.get("connectors") or []:
                          connector_count+=1
                          ts=conn.get("tariffs") or []
                          if ts:
                              tariff_count+=len(ts)
                              tariff_connectors.append({
                                  "evseId":ev.get("evseId"),
                                  "connectorUid":conn.get("uid"),
                                  "tariffs":ts
                              })
              results.append({
                  "uid":uid,
                  "operatorId":loc.get("operatorId"),
                  "operatorName":loc.get("operatorName"),
                  "address":loc.get("address"),
                  "httpStatus":status,
                  "connectorCount":connector_count,
                  "tariffCount":tariff_count,
                  "tariffConnectors":tariff_connectors
              })

          priced=[x for x in results if x["tariffCount"]>0]
          unpriced=[x for x in results if x["tariffCount"]==0]
          payload={
              "retrievedAt":datetime.now(timezone.utc).isoformat(),
              "country":"GB",
              "source":"Shell EV Public Locations API v2",
              "providerId":PROVIDER,
              "classification":{
                  "acceptedScope":"Shell Recharge CPO only",
                  "acceptedOperatorName":"Shell Recharge",
                  "acceptedOperatorIdPrefix":"GB*TNM",
                  "thirdPartyProviderTariffsIncluded":False,
                  "rule":"Shell-operated CPO => accept Shell tariff; other CPO => never use Shell eMSP tariff"
              },
              "locationCount":len(results),
              "pricedLocationCount":len(priced),
              "unpricedLocationCount":len(unpriced),
              "coveragePct":round(100*len(priced)/len(results),2) if results else 0,
              "results":results
          }
          Path("data/operator_direct/shell_recharge_uk_api_direct.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n"
          )
          report={
              "retrievedAt":payload["retrievedAt"],
              "locationCount":len(results),
              "pricedLocationCount":len(priced),
              "unpricedLocationCount":len(unpriced),
              "coveragePct":payload["coveragePct"],
              "unpriced":[{"uid":x["uid"],"address":x.get("address")} for x in unpriced],
              "thirdPartyProviderTariffsIncluded":False
          }
          Path("reports/uk/shell-direct-cpo-tariffs-latest.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/shell_recharge_uk_api_direct.json reports/uk/shell-direct-cpo-tariffs-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): retain Shell direct CPO tariffs only [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
