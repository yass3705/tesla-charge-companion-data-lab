name: Import validated Tesla Mac ingress
on:
  workflow_dispatch:
  schedule:
    - cron: '27,57 * * * *'
  pull_request:
    paths:
      - 'scripts/import_tesla_mac_ingress.py'
      - 'tests/test_import_tesla_mac_ingress.py'
      - '.github/workflows/import-tesla-mac-ingress.yml'
permissions:
  contents: write
concurrency:
  group: datalab-tesla-mac-ingress
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate deterministic importer cases
        run: python3 -m unittest discover -s tests -p test_import_tesla_mac_ingress.py -v
      - name: Import only a ready Mac lot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/import_tesla_mac_ingress.py
            if git diff --quiet -- data/tesla/mac/catalogue.json data/tesla/mac/last-good.json; then
              echo 'Tesla Mac last-good unchanged.'
              exit 0
            fi
            python3 scripts/public_safety_check.py data/tesla/mac
            git add data/tesla/mac/catalogue.json data/tesla/mac/last-good.json
            git commit -m 'data(tesla): import validated Mac lot from immutable ingress'
            if git push origin HEAD:main; then
              echo 'TESLA_MAC_DATALAB_LAST_GOOD_PUBLISHED'
              exit 0
            fi
            echo "Concurrent Data Lab commit; retry $attempt against latest main"
          done
          echo 'Data Lab Mac import could not be pushed; prior last-good remains available.' >&2
          exit 1
