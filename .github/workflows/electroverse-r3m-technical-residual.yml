name: Audit Electroverse FR R3M technical residual
on:
  push:
    branches:
      - audit/electroverse-r3m-technical-residual
    paths:
      - "scripts/audit_electroverse_r3m_technical_residual.mjs"
      - ".github/workflows/electroverse-r3m-technical-residual.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect R3M technical rows
        run: node scripts/audit_electroverse_r3m_technical_residual.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse-r3m-technical-residual.json
          git commit -m "audit: publish R3M technical residual report" || exit 0
          git push
