name: IZIVIA Express V8 engine compatibility audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/izivia-express-v8-engine-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout TCC V8 release
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: release/2026-08
          path: tcc
      - name: Inspect current exact classification and actual runtime loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('izivia/izivia_express_station_tariffs_v1.json'))
          print('=== CURRENT EXACT CLASSIFICATION ===')
          for st in p['stations']:
            if st['normalizedDirectPricing'] and all(x.get('status')=='exact_current_v8' for x in st['normalizedDirectPricing']):
              print(st['officialStationId'],st['name'],st['address'])
              print(json.dumps(st['normalizedDirectPricing'],ensure_ascii=False,indent=2))
          PY
          echo '=== SCRIPT TAGS ==='
          grep -n '<script.*src=' tcc/index.html || true
          echo '=== WHO REFERENCES OPERATOR TARIFF OVERLAY FILE ==='
          grep -RInF 'v8-operator-tariff-overlay.js' tcc --exclude='v8-operator-tariff-overlay.js' || true
          echo '=== IMPLEMENTATIONS OF POST-CHARGE V2 ==='
          grep -RInE '__tccPostChargeGraceV2|installPostChargePricing|postChargeBlockFee|startedKwhCharged' tcc/assets tcc/scripts || true
          echo '=== DIRECTLY LOADED FILES THAT CONTAIN POST-CHARGE IMPLEMENTATION ==='
          python - <<'PY'
          import re
          from pathlib import Path
          idx=Path('tcc/index.html').read_text(errors='replace')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',idx,re.I)
          print('SCRIPT_COUNT',len(scripts))
          found=[]
          for src in scripts:
            clean=src.split('?')[0]
            p=Path('tcc')/clean
            if not p.exists(): continue
            s=p.read_text(errors='replace')
            hits=[x for x in ['__tccPostChargeGraceV2','installPostChargePricing','postChargeBlockFee','startedKwhCharged'] if x in s]
            if hits:
              found.append((clean,hits));print('LOADED_POSTCHARGE_FILE',clean,hits)
          print('LOADED_IMPLEMENTATION_COUNT',len(found))
          PY
