name: EnergyVision Belgium DATEX staged identity and tariff evidence (no publish)

on:
  pull_request:
    paths:
      - ".github/workflows/energyvision-datex-stage.yml"
      - "scripts/energyvision_datex_semantic_stage.py"
      - "tests/test_energyvision_datex_semantic_stage.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/energyvision-datex-stage.yml"
      - "scripts/energyvision_datex_semantic_stage.py"
      - "tests/test_energyvision_datex_semantic_stage.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install safe XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Test exact DATEX static/dynamic identities and no pricing promotion
        run: python -m unittest discover -s tests -p 'test_energyvision_datex_semantic_stage.py' -v

  stage:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENERGYVISION_API_KEY: ${{ secrets.ENERGYVISION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install safe XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Stage exact charging point IDs, statuses and source pricing groups separately
        run: python -m scripts.energyvision_datex_semantic_stage --report reports/belgium/energyvision-datex-semantic-audit.json --staging artifacts/energyvision-datex-stage.json.gz
      - name: Store short-lived source staging (NOT used by V9)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energyvision-datex-staging-${{ github.run_id }}
          path: |
            reports/belgium/energyvision-datex-semantic-audit.json
            artifacts/energyvision-datex-stage.json.gz
          if-no-files-found: warn
          retention-days: 7
