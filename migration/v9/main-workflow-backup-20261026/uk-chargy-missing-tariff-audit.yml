name: UK char.gy missing tariff audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-chargy-missing-tariff-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe referenced tariff IDs individually
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          from pathlib import Path
          from datetime import datetime,timezone
          ids=[
            "195d3ce5-50f7-45c6-bf77-d54c6914dc8f",
            "4b854998-00de-4a9c-bbe4-2a7181d8e5ba",
            "632f5e73-73c6-4186-9d6f-7bf317a63347",
            "97b9ab3c-0d72-486e-82b3-b2815c90b3a1",
            "def5aeef-3c68-4df1-a064-e9a831734a4b"
          ]
          bases=[
            "https://char.gy/open-ocpi/tariffs/{id}",
            "https://char.gy/open-ocpi/tariffs/GB/CGY/{id}",
            "https://char.gy/open-ocpi/tariffs?tariff_id={id}",
            "https://char.gy/open-ocpi/tariffs?id={id}"
          ]
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"network":"char.gy","results":[]}
          for tid in ids:
            rec={"id":tid,"attempts":[]}
            for tmpl in bases:
              url=tmpl.format(id=tid)
              item={"template":tmpl}
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"TeslaChargeCompanion/9 char.gy audit","Accept":"application/json"})
                with urllib.request.urlopen(req,timeout=60) as r:
                  b=r.read()
                  item["status"]=r.status
                  try:
                    p=json.loads(b.decode("utf-8"))
                    item["jsonType"]=type(p).__name__
                    if isinstance(p,dict):
                      item["keys"]=list(p)[:30]
                      d=p.get("data")
                      if isinstance(d,list):
                        item["count"]=len(d)
                        item["ids"]=[str(x.get("id")) for x in d[:20] if isinstance(x,dict) and x.get("id") is not None]
                      elif isinstance(d,dict):
                        item["dataId"]=str(d.get("id")) if d.get("id") is not None else None
                  except Exception as e:
                    item["parseError"]=type(e).__name__
              except urllib.error.HTTPError as e:
                item["status"]=e.code
              except Exception as e:
                item["error"]=f"{type(e).__name__}: {e}"
              rec["attempts"].append(item)
              time.sleep(.4)
            out["results"].append(rec)
          Path("reports/uk/chargy-missing-tariff-audit-latest.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/chargy-missing-tariff-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit char.gy missing tariff ids [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
