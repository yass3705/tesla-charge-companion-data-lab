name: Belgium ChargePlus APKCombo resolve
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-chargeplus-apkcombo-resolve.txt"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/belgium_chargeplus_apkcombo_dl_response.py
      - name: Persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/apkcombo-dl-response-2026-09-28.json
          git commit -m "Resolve Charge+ APKCombo download response" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
