name: Allego PCPR V9 tariff schema review
on:
  push:
    branches: [main]
    paths: ["scripts/uk_allego_schema.py", ".github/workflows/uk-allego-schema.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/uk_allego_schema.py
      - name: Publish non-secret schema inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/allego_uk-pcpr-schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(uk): profile Allego PCPR tariff structure"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*2))
          done
          exit 1
