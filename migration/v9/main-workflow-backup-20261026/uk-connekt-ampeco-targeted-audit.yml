name: UK Connekt AMPECO targeted audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-connekt-ampeco-targeted-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract Connekt AMPECO API contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/uk /tmp/connekt
          curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0"             "https://d.apkpure.net/b/XAPK/com.connektcharging.getconnekted?version=latest"             -o /tmp/connekt/app.xapk
          unzip -q /tmp/connekt/app.xapk -d /tmp/connekt/x
          mkdir -p /tmp/connekt/apks
          for apk in /tmp/connekt/x/*.apk; do
            [ -f "$apk" ] || continue
            d="/tmp/connekt/apks/$(basename "$apk" .apk)"
            mkdir -p "$d"; unzip -q "$apk" -d "$d" || true
          done
          python - <<'PY'
          import json,re,glob,os
          from pathlib import Path
          from datetime import datetime,timezone

          needles=[
            "cp.connektcharging.com","ampeco","dynamic_tariffs","locations/search",
            "location:price","tariff","charging-station","charging_station",
            "api/locations","/locations","connector","guest","anonymous",
            "authorization","bearer","api-token","baseurl","base_url"
          ]
          hits=[]
          for fn in glob.glob("/tmp/connekt/apks/**/*",recursive=True):
            if not os.path.isfile(fn): continue
            try:
              if os.path.getsize(fn)>60_000_000: continue
              b=open(fn,"rb").read()
            except Exception: continue
            for raw in re.findall(rb'[ -~]{20,1400}',b):
              try:s=raw.decode("utf-8","ignore")
              except:continue
              sl=s.lower()
              matched=[n for n in needles if n.lower() in sl]
              if matched:
                hits.append({"file":fn.replace("/tmp/connekt/apks/",""),"matched":matched,"text":s})
          def score(x):
            return sum(8 if n in ("cp.connektcharging.com","ampeco","dynamic_tariffs","locations/search") else 3 for n in x["matched"])
          hits=sorted(hits,key=score,reverse=True)
          seen=set(); sel=[]
          for x in hits:
            k=x["text"][:350]
            if k in seen: continue
            seen.add(k); sel.append(x)
            if len(sel)>=500: break
          # extract likely route-like strings from selected text
          routes=set(); urls=set()
          for x in sel:
            s=x["text"]
            for u in re.findall(r'https?://[^\s"\'<>]{5,500}',s): urls.add(u)
            for r in re.findall(r'/(?:api/)?[A-Za-z0-9_{}$?=&.\-/]{3,180}',s):
              if any(k in r.lower() for k in ("location","tariff","charger","connector","price","station","session")):
                routes.add(r)
          out={"retrievedAt":datetime.now(timezone.utc).isoformat(),"package":"com.connektcharging.getconnekted",
               "urls":sorted(urls)[:500],"routes":sorted(routes)[:800],"hits":sel}
          Path("reports/uk/connekt-ampeco-targeted-audit-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"urls":out["urls"],"routes":out["routes"],"hits":sel[:180]},ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/uk/connekt-ampeco-targeted-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(uk): audit Connekt AMPECO backend [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
