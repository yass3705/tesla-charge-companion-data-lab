name: Belgium TotalEnergies second pass profile
on:
  workflow_dispatch:
  push:
    paths:
      - "triggers/belgium-totalenergies-second-pass-profile.txt"
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile TotalEnergies Belgium
        run: python scripts/belgium_totalenergies_second_pass.py
      - name: Persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/belgium/totalenergies/
          git commit -m "Profile Belgium TotalEnergies second pass" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
