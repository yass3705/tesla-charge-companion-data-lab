name: Atlante official tariffs

on:
  workflow_dispatch:
  schedule:
    - cron: "47 7 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/atlante_official.py"
      - "scripts/public_safety_check.py"
      - ".github/workflows/atlante-official-tariffs.yml"

permissions:
  contents: write

concurrency:
  group: atlante-official-tariffs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Public-safety scan
        run: python scripts/public_safety_check.py .

      - name: Extract Atlante official France rules
        id: extract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/atlante
          python -m py_compile scripts/atlante_official.py
          python scripts/atlante_official.py --out out/atlante 2> >(tee out/atlante/error.log >&2)
          cat out/atlante/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized diagnostic after extraction failure
        if: failure() && steps.extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/atlante
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('out/atlante/error.log')
          text=p.read_text(errors='replace') if p.exists() else 'extractor failed without stderr capture'
          text=re.sub(r'(?i)(authorization|cookie|token|secret|password)\s*[:=]\s*\S+',r'\1=[REDACTED]',text)
          Path('reports/atlante/latest_diagnostic.json').write_text(json.dumps({'dataset':'atlante-extraction-diagnostic','sanitized':True,'errorTail':[x for x in text.splitlines() if x.strip()][-40:]},ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/public_safety_check.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/atlante/latest_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "diag(atlante): publish extraction diagnostic [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Validate classification
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/atlante/atlante_official_france.json').read_text())
          assert p['classification']['singleGuaranteedNationalDirectTariffWithoutSubscription'] is False
          assert p['classification']['stationLevelPriceLookupRequiredWithoutSubscription'] is True
          go=p['operatorDirect']['atlanteGo']
          assert go['monthlyFeeEur'] == 9.99
          assert go['commitment'] == 'none'
          assert go['france']['atlanteEurPerKwh'] == 0.29
          assert go['france']['powerdotEurPerKwh'] == 0.42
          assert go['france']['chargeLeagueEurPerKwh'] == 0.49
          assert go['france']['chargeLeagueOperators'] == ['Electra','Fastned','IONITY']
          assert p['loyalty']['atlanteEarnRatePercentOfSpend'] == 50
          assert p['loyalty']['powerdotAndChargeLeagueEarnRatePercentOfSpend'] == 10
          assert p['roaming']['classification'] == 'third_party_eMSP'
          assert p['roaming']['operatorDirect'] is False
          assert p['sourceEvidence']['officialOnly'] is True
          print('Validated Atlante France subscription/direct/roaming separation')
          PY

      - name: Publish only when evidence changes
        id: publish
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('out/atlante/atlante_official_france.json')
          dst=Path('data/operator_direct/atlante_official_france.json')
          rep=Path('reports/atlante/latest_summary.md')
          new=json.loads(src.read_text())
          def sig(d):
              return {
                  'classification':d.get('classification'),
                  'operatorDirect':d.get('operatorDirect'),
                  'loyalty':d.get('loyalty'),
                  'roaming':d.get('roaming'),
                  'fees':d.get('fees'),
                  'fingerprint':(d.get('sourceEvidence') or {}).get('relevantTariffFingerprintSha256'),
                  'publicationStatus':d.get('publicationStatus'),
              }
          changed=not dst.exists() or sig(json.loads(dst.read_text())) != sig(new)
          Path('changed.flag').write_text('1' if changed else '0')
          if changed:
              dst.parent.mkdir(parents=True,exist_ok=True)
              rep.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              shutil.copy2('out/atlante/SUMMARY.md',rep)
          PY
          echo "changed=$(cat changed.flag)" >> "$GITHUB_OUTPUT"
          python scripts/public_safety_check.py .

      - name: Commit validated Atlante rule set
        if: success() && steps.publish.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operator_direct/atlante_official_france.json reports/atlante/latest_summary.md
          git commit -m "data(atlante): publish official France tariff rules [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
