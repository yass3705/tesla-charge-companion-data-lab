name: IONITY Italy exact station tariffs

on:
  workflow_dispatch:
  push:
    branches:
      - research/italy-cpo-priority-20260905
    paths:
      - scripts/ionity_italy_exact_tariffs.py
      - .github/workflows/ionity-italy-exact-tariffs.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: ionity-italy-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/italy-cpo-priority-20260905

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest successful Italy V9 consolidation
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow italy-v9-consolidation.yml --branch research/italy-consolidation-v9-a2a --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/italy-consolidation
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name italy-v9-consolidated-candidate --dir /tmp/italy-consolidation
          INPUT="$(find /tmp/italy-consolidation -name 'italy_v9_candidate.json.gz' -print -quit)"
          test -n "$INPUT" && test -s "$INPUT"
          cp "$INPUT" /tmp/italy_v9_candidate.json.gz

      - name: Resolve exact IONITY Italy prices
        run: |
          set -euo pipefail
          python -m py_compile scripts/ionity_italy_exact_tariffs.py
          python scripts/ionity_italy_exact_tariffs.py \
            --input /tmp/italy_v9_candidate.json.gz \
            --output data/national/ionity_exact_italy.json.gz \
            --report data/reports/ionity_exact_italy_summary.json

      - name: Validate exact station coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/reports/ionity_exact_italy_summary.json').read_text())
          c=r['counts']
          assert c['sourceEvse'] >= 300,c
          assert c['coverage'] >= 0.90,c
          assert c['rankableDirectEvse'] > 0,c
          print(json.dumps(c,ensure_ascii=False,indent=2))
          PY

      - name: Publish exact candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/ionity_exact_italy.json.gz data/reports/ionity_exact_italy_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(ionity): publish exact Italy station tariffs [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:research/italy-cpo-priority-20260905

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ionity-italy-exact-tariffs
          path: |
            data/national/ionity_exact_italy.json.gz
            data/reports/ionity_exact_italy_summary.json
          if-no-files-found: error
          retention-days: 14
