name: Qovoltis national direct tariff base

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qovoltis-national-base.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build national Qovoltis base from official IRVE + public ChargeNow tariff API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, os, re, sys, time, hashlib
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          OUT = Path('data/qovoltis')
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'TeslaChargeCompanion-DataLab/1.0 (+public-read-only)'
          DATASET_SLUGS = [
              'irve-statique-organisation-qovoltis',
              'irve-qovoltis',
          ]
          BSS = 'https://bss.qovoltis.com/api/borne/site-details?ref_site='

          def get_bytes(url, timeout=40):
              req=Request(url, headers={'User-Agent':UA, 'Accept':'application/json,text/csv,text/plain,*/*'})
              with urlopen(req, timeout=timeout) as r:
                  return r.read(), r.headers.get('content-type',''), getattr(r, 'status', 200)

          def get_json(url, timeout=30):
              b,_,status=get_bytes(url,timeout)
              return json.loads(b.decode('utf-8-sig','replace')), status

          # Discover the newest official Qovoltis static-IRVE CSV through data.gouv API.
          candidates=[]
          api_debug=[]
          for slug in DATASET_SLUGS:
              api=f'https://www.data.gouv.fr/api/1/datasets/{slug}/'
              try:
                  obj,status=get_json(api)
              except Exception as e:
                  api_debug.append({'slug':slug,'error':repr(e)})
                  continue
              api_debug.append({'slug':slug,'status':status,'title':obj.get('title'),'last_update':obj.get('last_update')})
              for res in obj.get('resources') or []:
                  fmt=(res.get('format') or '').lower()
                  schema=((res.get('schema') or {}).get('name') if isinstance(res.get('schema'),dict) else '') or ''
                  url=res.get('url')
                  if url and (fmt=='csv' or '.csv' in url.lower()) and ('irve' in schema.lower() or 'irve' in (obj.get('title') or '').lower()):
                      candidates.append({
                          'dataset_slug':slug,
                          'dataset_title':obj.get('title'),
                          'dataset_last_update':obj.get('last_update'),
                          'resource_id':res.get('id'),
                          'resource_title':res.get('title'),
                          'resource_last_modified':res.get('last_modified') or res.get('latest') or res.get('last_update'),
                          'url':url,
                      })
          if not candidates:
              raise SystemExit('No official Qovoltis CSV resource discovered from data.gouv API: '+json.dumps(api_debug))

          def stamp(c):
              return str(c.get('resource_last_modified') or c.get('dataset_last_update') or '')
          candidates.sort(key=stamp, reverse=True)
          source=candidates[0]
          raw,ctype,_=get_bytes(source['url'], timeout=90)
          source['sha256']=hashlib.sha256(raw).hexdigest()
          source['bytes']=len(raw)
          source['content_type']=ctype

          text=raw.decode('utf-8-sig','replace')
          sample=text[:10000]
          try:
              dialect=csv.Sniffer().sniff(sample, delimiters=',;\t')
          except Exception:
              dialect=csv.excel
              dialect.delimiter=','
          rows=list(csv.DictReader(io.StringIO(text), dialect=dialect))
          if not rows:
              raise SystemExit('Official Qovoltis IRVE CSV is empty')

          def first(row,*names):
              low={str(k).strip().lower():v for k,v in row.items() if k is not None}
              for n in names:
                  v=low.get(n.lower())
                  if v is not None and str(v).strip()!='': return str(v).strip()
              return None

          # Keep only Qovoltis records if the resource contains anything else.
          qrows=[]
          for r in rows:
              ids=' '.join(filter(None,[first(r,'id_station'),first(r,'id_pdc_itinerance'),first(r,'id_pdc_local')]))
              oper=' '.join(filter(None,[first(r,'nom_operateur'),first(r,'nom_amenageur'),first(r,'nom_enseigne')]))
              if 'FRQOV' in ids.upper() or 'QOVOLTIS' in oper.upper(): qrows.append(r)
          if not qrows:
              qrows=rows

          def ref_site_from_station_id(s):
              if not s: return None
              x=re.sub(r'[^A-Za-z0-9]','',s).upper()
              if not x.startswith('FRQOV') or len(x) <= 10: return None
              tail=x[5:]
              # Qovoltis public QR/site convention: everything before the final 5-digit site sequence is area code.
              m=re.fullmatch(r'([A-Z0-9]+)(\d{5})',tail)
              if not m: return None
              area,seq=m.groups()
              return f'FR*QOV*{area}-{seq}'

          stations={}
          unconvertible=[]
          for r in qrows:
              sid=first(r,'id_station')
              ref=ref_site_from_station_id(sid)
              if not ref:
                  unconvertible.append({'id_station':sid,'id_pdc_itinerance':first(r,'id_pdc_itinerance')})
                  continue
              st=stations.setdefault(ref,{
                  'ref_site':ref,'id_station':sid,
                  'nom_station':first(r,'nom_station'),
                  'adresse_station':first(r,'adresse_station'),
                  'code_insee_commune':first(r,'code_insee_commune'),
                  'coordonneesXY':first(r,'coordonneesXY'),
                  'nom_operateur':first(r,'nom_operateur'),
                  'nom_enseigne':first(r,'nom_enseigne'),
                  'pdc_irve':[]
              })
              st['pdc_irve'].append({
                  'id_pdc_itinerance':first(r,'id_pdc_itinerance'),
                  'id_pdc_local':first(r,'id_pdc_local'),
                  'puissance_nominale':first(r,'puissance_nominale'),
                  'prise_type_2':first(r,'prise_type_2'),
                  'prise_type_combo_ccs':first(r,'prise_type_combo_ccs'),
                  'prise_type_chademo':first(r,'prise_type_chademo'),
                  'gratuit':first(r,'gratuit'),
                  'tarification':first(r,'tarification'),
                  'condition_acces':first(r,'condition_acces'),
                  'accessibilite_pmr':first(r,'accessibilite_pmr'),
                  'horaires':first(r,'horaires'),
              })

          def fetch_site(ref):
              from urllib.parse import quote
              url=BSS+quote(ref,safe='')
              last=None
              for attempt in range(3):
                  try:
                      obj,status=get_json(url,timeout=25)
                      return ref,status,obj,None
                  except HTTPError as e:
                      body=''
                      try: body=e.read().decode('utf-8','replace')[:500]
                      except Exception: pass
                      if e.code in (429,500,502,503,504) and attempt<2:
                          time.sleep(1.5*(attempt+1)); continue
                      return ref,e.code,None,body or repr(e)
                  except Exception as e:
                      last=repr(e)
                      if attempt<2: time.sleep(1.5*(attempt+1)); continue
              return ref,None,None,last

          refs=sorted(stations)
          fetched={}; failures=[]
          # Read-only public calls, modest bounded parallelism.
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs={ex.submit(fetch_site,r):r for r in refs}
              for fut in as_completed(futs):
                  ref,status,obj,err=fut.result()
                  if status==200 and obj is not None: fetched[ref]=obj
                  else: failures.append({'ref_site':ref,'status':status,'error':err})

          PRICE_KEYS=('pricing_syder','pricing_syder_currency','pricing_duration_syder','tarif_heures_creuses','tarif_heures_pleines','rate','time_threshold','begin_free_hour','end_free_hour','price_per_reference_unit','reference_unit')
          CONNECTOR_KEYS=('reference','type_connector','power_max','status')

          def walk(node,path='$'):
              if isinstance(node,dict):
                  yield path,node
                  for k,v in node.items(): yield from walk(v,path+'.'+str(k))
              elif isinstance(node,list):
                  for i,v in enumerate(node): yield from walk(v,f'{path}[{i}]')

          out_sites=[]; priced_connectors=0; direct_prices=[]
          for ref,st in sorted(stations.items()):
              rawsite=fetched.get(ref)
              normalized=[]
              if rawsite is not None:
                  seen=set()
                  for path,d in walk(rawsite):
                      if not any(k in d for k in PRICE_KEYS): continue
                      rec={'json_path':path}
                      for k in CONNECTOR_KEYS+PRICE_KEYS:
                          if k in d: rec[k]=d.get(k)
                      # Avoid duplicate identical pricing dictionaries reached through aliases.
                      sig=json.dumps(rec,sort_keys=True,ensure_ascii=False,default=str)
                      if sig in seen: continue
                      seen.add(sig); normalized.append(rec)
                      p=rec.get('pricing_syder')
                      if p not in (None,''):
                          priced_connectors+=1
                          try: direct_prices.append(float(str(p).replace(',','.')))
                          except Exception: pass
              out_sites.append({**st,'tariff_api_ok':rawsite is not None,'tariffs':normalized,'site_details_raw':rawsite})

          now=datetime.now(timezone.utc).isoformat()
          all_price_values=sorted(set(round(x,6) for x in direct_prices))
          toussus_ref='FR*QOV*78-00027'
          toussus=next((x for x in out_sites if x['ref_site']==toussus_ref),None)
          toussus_prices=[]
          if toussus:
              for t in toussus['tariffs']:
                  if t.get('pricing_syder') not in (None,''):
                      try: toussus_prices.append(float(str(t['pricing_syder']).replace(',','.')))
                      except Exception: pass

          qa={
              'generated_at':now,
              'source':source,
              'data_gouv_discovery':api_debug,
              'csv_rows_total':len(rows),
              'csv_rows_qovoltis':len(qrows),
              'unique_ref_sites':len(refs),
              'site_details_http_200':len(fetched),
              'site_details_failures':len(failures),
              'priced_records':priced_connectors,
              'distinct_pricing_syder_eur_per_kwh':all_price_values,
              'unconvertible_rows':len(unconvertible),
              'toussus':{
                  'ref_site':toussus_ref,
                  'present':bool(toussus),
                  'pricing_syder_values':sorted(set(toussus_prices)),
                  'expected_0_3504_present':any(abs(x-0.3504)<1e-9 for x in toussus_prices),
              },
              'publication_status':'STAGED_DATA_LAB_ONLY_NOT_PUBLISHED_TO_TCC'
          }
          payload={
              'schema_version':1,
              'generated_at':now,
              'operator':'Qovoltis',
              'country':'FR',
              'tariff_kind':'direct_public_ad_hoc',
              'source_inventory':source,
              'source_tariff_api':'https://bss.qovoltis.com/api/borne/site-details?ref_site=<REF_SITE>',
              'publication_status':'STAGED_DATA_LAB_ONLY_NOT_PUBLISHED_TO_TCC',
              'sites':out_sites,
          }
          (OUT/'qovoltis_national.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'unconvertible.json').write_text(json.dumps(unconvertible,ensure_ascii=False,indent=2),encoding='utf-8')

          # Compact connector-level CSV for manual QA / future TCC adapter work.
          cols=['ref_site','id_station','nom_station','adresse_station','reference','type_connector','power_max','status','pricing_syder','pricing_syder_currency','pricing_duration_syder','tarif_heures_creuses','tarif_heures_pleines','rate','time_threshold','begin_free_hour','end_free_hour','json_path']
          with (OUT/'qovoltis_tariffs.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=cols); w.writeheader()
              for s in out_sites:
                  for t in s['tariffs']:
                      row={k:t.get(k) for k in cols}
                      for k in ('ref_site','id_station','nom_station','adresse_station'): row[k]=s.get(k)
                      w.writerow(row)

          print(json.dumps(qa,ensure_ascii=False,indent=2))
          if not qa['toussus']['expected_0_3504_present']:
              print('WARNING: Toussus 0.3504 validation not found; dataset is staged but requires review.',file=sys.stderr)
          if len(fetched)==0:
              raise SystemExit('No Qovoltis public site-details endpoint succeeded')
          PY

      - name: Show staged files
        run: |
          ls -lh data/qovoltis
          cat data/qovoltis/qa.json

      - name: Commit staged Qovoltis data to data-lab only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/qovoltis
          if git diff --cached --quiet; then
            echo 'No staged data changes.'
          else
            git commit -m 'data(qovoltis): stage national direct tariff base'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: qovoltis-national-base
          path: data/qovoltis
          retention-days: 7
