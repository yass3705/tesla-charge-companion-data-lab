name: Switzerland Partino EVC-Net protocol probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/switzerland-partino-evcnet-protocol-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract public EVC-Net AJAX protocol snippets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          base="https://partino-chf.evc-net.com"
          url=base+"/min/?g=js&v=260928"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TCC-V9-Partino"})
          txt=urllib.request.urlopen(req,timeout=60).read().decode("utf-8","replace")
          needles=[
            "/api/ajax",
            "DeviceMap.prototype._refresh",
            "DeviceMap.prototype._onDataRetrieved",
            "DeviceMap.prototype._setInfoWindow",
            "simpleTariff",
            "idsMessageHandler",
            "new ASRI",
            ".setType(",
            "Ajax",
          ]
          snippets=[]
          for needle in needles:
            pos=0; count=0
            while True:
              i=txt.find(needle,pos)
              if i<0 or count>=20: break
              snippets.append({"needle":needle,"offset":i,"text":txt[max(0,i-1800):min(len(txt),i+3500)]})
              pos=i+len(needle); count+=1
          # Also identify constructors/functions likely implementing AJAX message transport.
          patterns=[
            r'function\s+([A-Za-z0-9_$]*(?:Message|Ajax|ASRI)[A-Za-z0-9_$]*)\s*\([^)]*\)',
            r'([A-Za-z0-9_$]+)\.prototype\.run\s*=\s*function\s*\([^)]*\)',
          ]
          defs=[]
          for pat in patterns:
            for m in re.finditer(pat,txt):
              defs.append({"name":m.group(1),"offset":m.start(),"text":txt[max(0,m.start()-1000):min(len(txt),m.start()+5000)]})
          out={"schemaVersion":1,"generatedAt":datetime.now(timezone.utc).isoformat(),"source":url,"snippets":snippets,"definitions":defs[:100]}
          Path("docs/switzerland-partino-evcnet-protocol-probe-2026-09-29.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"snippetCount":len(snippets),"definitionCount":len(defs),"definitionNames":[x["name"] for x in defs[:50]]},ensure_ascii=False))
          PY
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/switzerland-partino-evcnet-protocol-probe-2026-09-29.json
          git commit -m "research(ch): inspect Partino EVC-Net AJAX protocol" || exit 0
          git pull --rebase origin main
          git push origin main
