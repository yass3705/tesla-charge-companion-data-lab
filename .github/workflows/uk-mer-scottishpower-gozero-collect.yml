name: UK Mer ScottishPower GoZero collect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uk-mer-scottishpower-gozero-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect three anonymous UK feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/national reports/uk
          python - <<'PY'
          import json,gzip,urllib.request,urllib.parse,time
          from pathlib import Path
          from datetime import datetime,timezone

          UA='TeslaChargeCompanion/9 UK-open-data'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=120) as r: return json.loads(r.read().decode('utf-8'))
          def arr(p):
              if isinstance(p,list): return p
              if isinstance(p,dict):
                  for k in ('data','locations','tariffs','items','results'):
                      if isinstance(p.get(k),list): return p[k]
              return []
          sources=[]
          # ScottishPower Recharge Fuuse ODA
          sp_l='https://api.fuuse.io/opendata/e11a667d-c56a-468f-b8d3-a50b41628292/location'
          sp_t='https://api.fuuse.io/opendata/e11a667d-c56a-468f-b8d3-a50b41628292/tariff'
          sources.append(('ScottishPower Recharge',arr(get(sp_l)),arr(get(sp_t)),{'locations':sp_l,'tariffs':sp_t}))
          time.sleep(1)
          # Go Zero OCPI 2.2.1
          gz_l='https://cpo-api.gozerocharge.com/api/v1/ocpi/2.2.1/locations'
          gz_t='https://cpo-api.gozerocharge.com/api/v1/ocpi/2.2.1/tariffs'
          sources.append(('Go Zero',arr(get(gz_l)),arr(get(gz_t)),{'locations':gz_l,'tariffs':gz_t}))
          time.sleep(1)
          # Mer publishes a combined OZeV payload.
          mer_u='https://uk.mer.eco/wp-json/ozev/v1/data'
          mp=get(mer_u); d=mp.get('data') if isinstance(mp,dict) else {}; d=d if isinstance(d,dict) else {}
          ml=d.get('locations'); mt=d.get('tariffs')
          mer_locations=arr(ml) if isinstance(ml,(dict,list)) else []
          mer_tariffs=arr(mt) if isinstance(mt,(dict,list)) else []
          sources.append(('Mer UK',mer_locations,mer_tariffs,{'combined':mer_u}))

          def summarize(name,locs,tars):
              evses=cons=0; statuses={}; refs=set(); parties=set()
              for loc in locs:
                  if not isinstance(loc,dict): continue
                  if loc.get('party_id'): parties.add(str(loc['party_id']))
                  for ev in loc.get('evses') or []:
                      if not isinstance(ev,dict): continue
                      evses+=1; st=str(ev.get('status') or 'UNKNOWN'); statuses[st]=statuses.get(st,0)+1
                      for c in ev.get('connectors') or []:
                          if not isinstance(c,dict): continue
                          cons+=1
                          for tid in c.get('tariff_ids') or []: refs.add(str(tid))
                          if c.get('tariff_id') is not None: refs.add(str(c['tariff_id']))
              tids={str(t.get('id')) for t in tars if isinstance(t,dict) and t.get('id') is not None}
              missing=sorted(refs-tids)
              return {'name':name,'locations':len(locs),'evses':evses,'connectors':cons,'tariffs':len(tars),'partyIds':sorted(parties),'statuses':statuses,'referencedTariffIds':len(refs),'resolvedTariffIds':len(refs&tids),'missingTariffIds':missing,'status':'complete' if locs and not missing else 'partial'}

          retrieved=datetime.now(timezone.utc).isoformat(); reports=[]
          payload={'country':'GB','retrievedAt':retrieved,'sources':[]}
          for name,locs,tars,endpoints in sources:
              sm=summarize(name,locs,tars); reports.append(sm)
              payload['sources'].append({'name':name,'endpoints':endpoints,'locations':locs,'tariffs':tars,'summary':sm})
          with gzip.open('data/national/uk_mer_scottishpower_gozero.json.gz','wt',encoding='utf-8') as g: json.dump(payload,g,ensure_ascii=False,separators=(',',':'))
          out={'country':'GB','retrievedAt':retrieved,'sources':reports}
          Path('reports/uk/mer-scottishpower-gozero-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national/uk_mer_scottishpower_gozero.json.gz reports/uk/mer-scottishpower-gozero-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(uk): collect Mer ScottishPower Go Zero [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt*2)); done
          exit 1
