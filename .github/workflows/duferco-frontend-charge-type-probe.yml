name: Duferco frontend charge type mapping

on:
  workflow_dispatch:
  push:
    branches: [research/duferco-italy-probe]
    paths:
      - scripts/duferco_frontend_charge_type_probe.py
      - .github/workflows/duferco-frontend-charge-type-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check selenium
      - name: Inspect public UI bundles for charge type mapping
        run: python scripts/duferco_frontend_charge_type_probe.py
      - name: Validate read-only probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/reports/duferco_frontend_charge_type_probe.json').read_text())
          assert r['security']['accountCredentialsUsed'] is False
          assert r['security']['requestHeadersRead'] is False
          assert r['security']['cookiesRead'] is False
          assert r['security']['fullBundlesPersisted'] is False
          assert r['hitCount'] > 0
          print(json.dumps({'scripts':r['scriptCount'],'hits':r['hitCount'],'terms':sorted({x['term'] for x in r['hits']})},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duferco-frontend-charge-type-probe
          path: data/reports/duferco_frontend_charge_type_probe.json
          retention-days: 14
