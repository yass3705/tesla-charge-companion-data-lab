name: Filter B QualiCharge promotion-ready groups
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/filter_b_qualicharge_promotion_ready.py"
      - ".github/workflows/electroverse-b-qualicharge-ready.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/filter_b_qualicharge_promotion_ready.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/electroverse/b-qualicharge-promotion-ready.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist B QualiCharge promotion-ready groups"
            git pull --rebase origin main || true
            git push
          fi
