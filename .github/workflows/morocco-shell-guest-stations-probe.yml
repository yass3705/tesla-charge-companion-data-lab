name: Morocco Shell guest stations probe

on:
  push:
    paths:
      - '.github/workflows/morocco-shell-guest-stations-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Shell Maroc 3.2.7 and prepare contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shell-probe /tmp/jadx
          mkdir -p /tmp/shell-probe/apk /tmp/shell-probe/out reports/morocco/shell
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            --user-agent 'Mozilla/5.0 TCC-Public-Research/1.0' \
            'https://d.apkpure.net/b/APK/com.shell.shell_loyalty_app.morocco?version=latest' \
            -o /tmp/shell-probe/app.apk
          echo '388caa4c883a285ad996859db1ae231ffd3e909bf396475969a61225bae0acf4  /tmp/shell-probe/app.apk' | sha256sum -c -
          unzip -q /tmp/shell-probe/app.apk 'lib/x86_64/libnative-lib.so' -d /tmp/shell-probe/apk
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' \
            -o /tmp/shell-probe/jadx.zip
          unzip -q /tmp/shell-probe/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/shell-probe/out /tmp/shell-probe/app.apk >/dev/null 2>&1 || true

      - name: Read-only guest station probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,subprocess,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone

          root=Path('/tmp/shell-probe/out/sources')
          so=Path('/tmp/shell-probe/apk/lib/x86_64/libnative-lib.so')
          dis=subprocess.check_output(['objdump','-d',str(so)],text=True,errors='ignore')
          sec=subprocess.check_output(['readelf','-SW',str(so)],text=True,errors='ignore')
          sm=re.search(r'\s\.rodata\s+PROGBITS\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',sec)
          if not sm: raise SystemExit('rodata section not found')
          ro_addr,ro_off,ro_size=(int(x,16) for x in sm.groups())
          data=so.read_bytes()

          def getter_string(name):
              pat=rf'<Java_com_shell_shell_1loyalty_1app_utils_SecretAPIKeys_00024APIKeys_{re.escape(name)}[^>]*>:(.*?)(?=\n\n[0-9a-f]+ <)'
              m=re.search(pat,dis,re.S)
              if not m:return None
              lm=re.search(r'#\s*([0-9a-fA-F]+)\s*<',m.group(1))
              if not lm:return None
              vaddr=int(lm.group(1),16); pos=ro_off+(vaddr-ro_addr)
              while pos<len(data) and (data[pos]<33 or data[pos]>126):pos+=1
              end=data.find(b'\0',pos)
              if end<0:return None
              out=data[pos:end].decode('ascii','ignore')
              return out if 1<=len(out)<=500 else None

          # Public client configuration getters only; values are never persisted.
          getter_names=[
            'getXAPIKeyProdMorocco','getXAPIKeyUatMorocco','getXAPIKeyQaMorocco',
            'appConfigProdApiKey','appConfigUatApiKey','appConfigQaApiKey',
            'getXPlatformCode'
          ]
          vals={n:getter_string(n) for n in getter_names}
          platform=vals.get('getXPlatformCode')

          body={
            'amenities':'','latitude':'33.5731','limit':'25','longitude':'-7.5898',
            'm':'closest','radius':'20','route':'1','type':'0'
          }
          payload=json.dumps(body).encode()
          report={
            'schema_version':2,'generated_at':datetime.now(timezone.utc).isoformat(),
            'country':'MA','network':'Shell/Vivo Energy',
            'client':{'package':'com.shell.shell_loyalty_app.morocco','version':'3.2.7'},
            'request_contract':{'serialized_fields':list(body.keys())},
            'policy':{'read_only':True,'no_login':True,'no_user_data':True,'no_mutation':True,'credentials_persisted':False},
            'public_key_getters_found':[k for k,v in vals.items() if v],
            'attempts':[]
          }

          candidates=[]
          for name in ['getXAPIKeyProdMorocco','appConfigProdApiKey','appConfigUatApiKey','getXAPIKeyUatMorocco','getXAPIKeyQaMorocco','appConfigQaApiKey']:
              if vals.get(name) and vals[name] not in [x[1] for x in candidates]:
                  candidates.append((name,vals[name]))

          for idx,(key_name,key) in enumerate(candidates,1):
              headers={
                'Content-Type':'application/json','Accept':'application/json',
                'Accept-Language':'fr','country':'ma','x-app-version':'3.2.7',
                'x-api-key':key
              }
              if platform:headers['x-platform-code']=platform
              req=urllib.request.Request('https://ma-loyaltyapi.vivoenergy.com/getStations/v1',data=payload,headers=headers,method='POST')
              rec={'attempt':idx,'public_key_getter':key_name,'request_field_names':sorted(body.keys()),'header_names':sorted(headers.keys())}
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      raw=resp.read();rec['http_status']=resp.status
              except urllib.error.HTTPError as e:
                  raw=e.read();rec['http_status']=e.code
              except Exception as e:
                  rec['error']=type(e).__name__;report['attempts'].append(rec);continue
              try:
                  obj=json.loads(raw.decode('utf-8','ignore'))
                  rows=obj
                  if isinstance(obj,dict):
                      for kn in ('data','result','stations'):
                          if isinstance(obj.get(kn),list):rows=obj[kn];break
                  rec['top_level_type']=type(obj).__name__
                  if isinstance(obj,dict):rec['top_level_keys']=sorted(obj.keys())
                  if isinstance(rows,list):
                      rec['row_count']=len(rows)
                      evrows=[]
                      for st in rows:
                          if not isinstance(st,dict):continue
                          evc,evo=st.get('ev_charging'),st.get('ev_offering')
                          if evc or evo:
                              evrows.append({
                                'id':st.get('id'),'name':st.get('name'),'lat':st.get('lat'),'lon':st.get('lon'),
                                'loc':st.get('loc'),'ev_charging':evc,'ev_offering':evo
                              })
                      rec['ev_row_count']=len(evrows)
                      rec['ev_rows']=evrows
                  elif isinstance(obj,dict):
                      rec['safe_message']={k:obj.get(k) for k in ('status','message','error','code') if k in obj}
              except Exception:
                  rec['response_json']=False
              report['attempts'].append(rec)
              if rec.get('http_status')==200:
                  break

          Path('reports/morocco/shell/guest-stations-probe-2026-09-27.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf /tmp/shell-probe /tmp/jadx

      - name: Commit sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git add reports/morocco/shell/guest-stations-probe-2026-09-27.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(morocco): probe Shell guest EV stations [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push origin main
