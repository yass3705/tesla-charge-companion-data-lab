name: Electra Powerdot pricing families and screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/france/audit_electra_powerdot_families.mjs"
      - ".github/workflows/electra-powerdot-price-families.yml"
      - "data/manual_verification/electra_app_residual_evidence_2026-10-10.json"
permissions:
  contents: write
concurrency:
  group: electra-powerdot-price-families
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Audit Powerdot cohorts and EVSE screenshot evidence
        run: node scripts/france/audit_electra_powerdot_families.mjs
      - name: Publish evidence and Powerdot samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/france/electra/powerdot-price-power-cohorts-2026-10-10.json reports/france/electra/user-residual-screens-case-resolution-2026-10-10.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(electra): group Powerdot charging price tiers and preserve verified EVSE app evidence'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
