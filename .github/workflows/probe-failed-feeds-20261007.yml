name: Probe failed public tariff feeds
on:
  push:
    branches: [codex/probe-failed-feeds-20261007]
    paths:
      - ".github/workflows/probe-failed-feeds-20261007.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public endpoints without credentials
        shell: bash
        run: |
          set -u
          urls=(
            'https://char.gy/open-ocpi/locations?limit=20&offset=0'
            'https://char.gy/open-ocpi/locations?limit=20&offset=5400'
            'https://char.gy/open-ocpi/locations?limit=20&offset=5420'
            'https://char.gy/open-ocpi/locations?limit=50&offset=5400'
            'https://char.gy/open-ocpi/locations?limit=100&offset=5400'
            'https://char.gy/open-ocpi/tariffs?limit=20&offset=0'
            'https://cpo-api.gozerocharge.com/api/v1/ocpi/2.2.1/locations'
            'https://cpo-api.gozerocharge.com/api/v1/ocpi/versions'
            'https://cpo-api.gozerocharge.com/ocpi/versions'
            'https://api.gozerocharge.com/api/v1/ocpi/2.2.1/locations'
            'https://api.gozerocharge.com/api/v1/ocpi/2.2.1/tariffs'
            'https://chargingservices.totalenergies.com/fr/find-a-charger?countryCode=NL'
            'https://chargingservices.totalenergies.com/nl/find-a-charger?countryCode=NL'
            'https://chargingservices.totalenergies.com/'
            'https://chargingservices.totalenergies.com/main.833f41fbec0463af.js'
          )
          for url in "${urls[@]}"; do
            printf '\nURL %s\n' "$url"
            curl --location --silent --show-error --max-time 18 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              --header 'Accept: application/json,text/html;q=0.9,*/*;q=0.8' \
              --dump-header /tmp/probe-headers --output /tmp/probe-body \
              --write-out 'HTTP=%{http_code} BYTES=%{size_download} FINAL=%{url_effective}\n' "$url" || true
            grep -Ei '^(content-type|location|link|x-total-count|retry-after|server):' /tmp/probe-headers | tail -8 || true
            head -c 120 /tmp/probe-body | tr '\n' ' ' || true
            printf '\n'
          done
      - name: Probe Total public runtime configuration without logging key
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,urllib.error
          url='https://chargingservices.totalenergies.com/main.833f41fbec0463af.js'
          body=urllib.request.urlopen(url,timeout=30).read().decode('utf-8','replace')
          match=re.search(r"y=JSON\\.parse\\('([^\\n]+?)'\\)",body)
          print('config_found',bool(match),'bffApiUrl_name', 'bffApiUrl' in body,'globalApiKey_name','globalApiKey' in body,'len',len(body))
          candidates=re.findall(r"JSON\\.parse\\('([^']+)'\\)",body)
          print('parse_candidates',len(candidates),'candidate_with_fields',sum('bffApiUrl' in c and 'globalApiKey' in c for c in candidates))
          if not match: raise SystemExit(0)
          try: config=json.loads(match.group(1))
          except Exception as e:
              print('config_parse_error',type(e).__name__)
              raise SystemExit(0)
          print('api_base_present',bool(config.get('bffApiUrl')),'public_key_present',bool(config.get('globalApiKey')))
          if not config.get('bffApiUrl') or not config.get('globalApiKey'): raise SystemExit(0)
          params=urllib.parse.urlencode({'countryCode':'NL','pageNumber':'0','pageSize':'5','language':'nl-NL'})
          endpoint=config['bffApiUrl']+'/v3/infrastructure/locations?'+params
          req=urllib.request.Request(endpoint,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0','x-apif-apikey':config['globalApiKey'],'marketplace-evp':'tcseu'})
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=json.load(r)
                  print('api_status',r.status,'array',isinstance(data,list),'rows',len(data) if isinstance(data,list) else None)
          except urllib.error.HTTPError as e: print('api_status',e.code)
          except Exception as e: print('api_error',type(e).__name__)
          PY
